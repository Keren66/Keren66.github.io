 from eu- central-1. Amazon Nova Pro is not hosted in eu-central-1, so when invoked, Amazon Bedrock transparently routes the request to a supporting Region (such as eu-west-3) through CRI inference profiles. However, SCPs that restrict Regions or specific Bedrock resources will block this routing unless explicitly allowed. Option B is required because the SCP must explicitly allow the eu.amazon.nova-pro-v1:0 inference profile, which is the Bedrock abstraction that enables CRI while preserving data residency guarantees. Without this, Bedrock cannot legally route the request. Option E is also required to allow EU-scoped inference profiles rather than individual Regions. This preserves precise governance while allowing Bedrock-managed CRI routing within the EU boundary, ensuring no data leaves Europe. Option A violates least-privilege and does not override SCPs. Option C breaks data residency by enabling direct eu-west-3 access. Option D does not resolve the SCP denial. Therefore, Options B and E are the only combination that resolves the error while preserving governance and EU-only data residency.", "explanation_zh": "此错误的发生是因为SCP会覆盖IAM权限，且当前SCP阻止了解析到eu-west-3的Bedrock推理调用，尽管公司打算从eu-central-1使用跨区域推理（CRI）。Amazon Nova Pro并未托管在eu-central-1中，因此当调用时，Amazon Bedrock会通过CRI推理配置文件透明地将请求路由到支持区域（如eu-west-3）。然而，限制区域或特定Bedrock资源的SCP会阻止此路由，除非明确允许。选项B是必需的，因为SCP必须明确允许eu.amazon.nova-pro-v1:0推理配置文件，这是Bedrock启用CRI同时保留数据驻留保证的抽象层。没有这个，Bedrock无法合法路由请求。选项E也是必需的，以允许欧盟范围的推理配置文件而非单个区域。这在Bedrock管理的CRI路由在欧盟边界内保留了精确治理，确保没有数据离开欧洲。选项A违反最小权限原则，且不能覆盖SCP。选项C通过启用直接的eu-west-3访问破坏了数据驻留。选项D不能解决SCP拒绝问题。因此，选项B和E是唯一能解决错误同时保留治理和仅限欧盟数据驻留的组合。"}, {"id": 50, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A financial services company uses an AI application to process financial documents by using Amazon \nBedrock. During business hours, the application handles approximately 10,000 requests each hour, which \nrequires consistent throughput. The company uses the CreateProvisionedModelThroughput API to purchase provisioned throughput. Amazon \nCloudWatch metrics show that the provisioned capacity is unused while on-demand requests are being \nthrottled. The company finds the following code in the application: response = bedrock_runtime.invoke_model( modelId=\"anthropic.claude-v2\", body=json.dumps(payload) ) The company needs the application to use the provisioned throughput and to resolve the throttling issues. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司使用一个AI应用程序通过Amazon Bedrock处理财务文档。在工作时间内，应用程序每小时处理约10000个请求，需要一致的吞吐量。公司使用CreateProvisionedModelThroughput API购买了预置吞吐量。Amazon CloudWatch指标显示预置容量未被使用，而按需请求正在被节流。公司在应用程序中发现以下代码：response = bedrock_runtime.invoke_model(modelId=\\\"anthropic.claude-v2\\\", body=json.dumps(payload)) 公司需要应用程序使用预置吞吐量并解决节流问题。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Increase the number of model units (MUs) in the provisioned throughput configuration.", "Replace the model ID parameter with the ARN of the provisioned model that the \nCreateProvisionedModelThroughput API returns.", "Add exponential backoff retry logic to handle throttling exceptions during peak hours.", "Modify the application to use the invokeModelWithResponseStream API instead of the invokeModel \nAPI."], "options_zh": ["增加预置吞吐量配置中的模型单元（MU）数量。", "将模型ID参数替换为CreateProvisionedModelThroughput API返回的预置模型ARN。", "添加指数退避重试逻辑，以处理高峰时段的节流异常。", "修改应用程序使用InvokeModelWithResponseStream API而不是InvokeModel API。"], "a": "B", "explanation_en": "Option B is the correct solution because Amazon Bedrock provisioned throughput is only used when the application explicitly invokes the provisioned model ARN, not the base foundation model ID. In the provided code, the application is calling the standard model identifier (anthropic.claude-v2), which routes requests to on-demand capacity instead of the purchased provisioned throughput. When the CreateProvisionedModelThroughput API is used, Amazon Bedrock returns a provisioned model ARN that represents the reserved capacity. Applications must reference this ARN in the modelId parameter when invoking the model. If the base model ID is used instead, Bedrock treats the request as on-demand traffic, which explains why CloudWatch metrics show unused provisioned capacity alongside throttled on- demand requests. Option A would increase capacity but would not fix the root cause because the application is not using the provisioned resource at all. Option C adds resiliency but does not ensure usage of provisioned throughput and would still incur throttling. Option D changes the response delivery mechanism but does not affect capacity routing. Therefore, Option B directly resolves the throttling issue by correctly routing traffic to the reserved capacity and ensures that the company benefits from the provisioned throughput it has purchased.", "explanation_zh": "选项B是正确的解决方案，因为Amazon Bedrock预置吞吐量仅在应用程序显式调用预置模型ARN时才被使用，而不是基础模型ID。在提供的代码中，应用程序正在调用标准模型标识符（anthropic.claude-v2），这会将请求路由到按需容量而不是已购买的预置吞吐量。当使用CreateProvisionedModelThroughput API时，Amazon Bedrock会返回一个代表预留容量的预置模型ARN。应用程序在调用模型时必须在modelId参数中引用此ARN。如果使用基础模型ID，Bedrock会将请求视为按需流量，这就解释了为什么CloudWatch指标显示预置容量未被使用而按需请求被节流。选项A会增加容量，但不会解决根本原因，因为应用程序根本没有使用预置资源。选项C增加了弹性，但不能确保使用预置吞吐量，且仍然会遭遇节流。选项D改变了响应投递机制，但不影响容量路由。因此，选项B通过正确地将流量路由到预留容量来直接解决节流问题，并确保公司从其购买的预置吞吐量中受益。"}, {"id": 51, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A bank is building a generative AI (GenAI) application that uses Amazon Bedrock to assess loan applications \nby using scanned financial documents. The application must extract structured data from the documents. The \napplication must redact personally identifiable information (PII) before inference. The application must use \nfoundation models (FMs) to generate approvals. The application must route low-confidence document \nextraction results to human reviewers who are within the same AWS Region as the loan applicant. The company must ensure that the application complies with strict Regional data residency and auditability \nrequirements. The application must be able to scale to handle 25,000 applications each day and provide 99.9% \navailability. Which combination of solutions will meet these requirements? (Select THREE.) A. B. C. D. E. F.", "body_zh": "一家银行正在构建一个生成式AI（GenAI）应用程序，使用Amazon Bedrock通过扫描的财务文档来评估贷款申请。应用程序必须从文档中提取结构化数据。应用程序必须在推理前编辑个人身份信息（PII）。应用程序必须使用基础模型（FM）生成批准结果。应用程序必须将低置信度的文档提取结果路由到与贷款申请人位于同一AWS区域的人工审核员。公司必须确保应用程序符合严格的区域数据驻留和可审计性要求。应用程序必须能够扩展以每天处理25000份申请，并提供99.9%的可用性。哪组解决方案组合能满足这些要求？（选择三个。）A. B. C. D. E. F.", "options_en": ["Deploy Amazon Textract and Amazon Augmented AI within the same Region to extract relevant data \nfrom the scanned documents. Route low-confidence pages to human reviewers.", "Use AWS Lambda functions to detect and redact PII from submitted documents before inference. \nApply Amazon Bedrock guardrails to prevent inappropriate or unauthorized content in model outputs. \nConfigure Region-specific IAM roles to enforce data residency requirements and to control access to \nthe extracted data.", "Use Amazon Kendra and Amazon OpenSearch Service to extract field-level values semantically from \nthe uploaded documents before inference.", "Store uploaded documents in Amazon S3 and apply object metadata. Configure IAM policies to store \noriginal documents within the same Region as each applicant. Enable object tagging for future audits.", "Use AWS Glue Data Quality to validate the structured document data. Use AWS Step Functions to \norchestrate a review workflow that includes a prompt engineering step that transforms validated data \ninto optimized prompts before invoking Amazon Bedrock to assess loan applications.", "Use Amazon SageMaker Clarify to generate fairness and bias reports based on model scoring decisions \nthat Amazon Bedrock makes."], "options_zh": ["在同一区域内部署Amazon Textract和Amazon Augmented AI，从扫描文档中提取相关数据。将低置信度页面路由到人工审核员。", "使用AWS Lambda函数在推理前检测并编辑已提交文档中的PII。应用Amazon Bedrock护栏，防止模型输出中出现不当或未经授权的内容。配置区域特定的IAM角色，以强制执行数据驻留要求并控制对提取数据的访问。", "在推理前使用Amazon Kendra和Amazon OpenSearch Service，从上传的文档中语义提取字段级值。", "将上传的文档存储在Amazon S3中并应用对象元数据。配置IAM策略，将原始文档存储在每个申请人所在的同一区域内。为未来审计启用对象标记。", "使用AWS Glue Data Quality验证结构化文档数据。使用AWS Step Functions编排包含提示工程步骤的审核工作流，该步骤在调用Amazon Bedrock评估贷款申请之前将验证后的数据转换为优化提示。", "使用Amazon SageMaker Clarify基于Amazon Bedrock做出的模型评分决策生成公平性和偏见报告。"], "a": "A B D", "explanation_en": "The correct combination is A, B, and D because these three options collectively satisfy the mandatory requirements for structured extraction, PII redaction before inference, regional human review, data residency, auditability, and high-scale availability with managed AWS services. Option A is essential because Amazon Textract is the AWS-managed service designed to extract structured data from scanned documents such as forms, tables, and financial statements. Textract provides confidence scores, and Amazon Augmented AI (A2I) is purpose-built to route low-confidence extractions to human reviewers. Deploying Textract and A2I within the same Region ensures that the human review loop remains regionally constrained, meeting strict data residency requirements for applicants. Option B satisfies the requirement to redact PII before inference by using AWS Lambda preprocessing. It also adds Amazon Bedrock guardrails to enforce safety controls on model outputs. Region-specific IAM roles ensure that only authorized principals in the correct Region can access the extracted data and invoke downstream services, strengthening residency enforcement and auditability. Option D ensures that source documents are stored in Amazon S3 in the same Region as the applicant. Object metadata and tagging provide an auditable trail, supporting compliance reporting and traceability. S3 also provides the durability and availability needed to support 99.9% application availability as part of a well- architected pipeline. Option C is not the correct approach for structured extraction from scans. Option E adds useful quality validation but is not strictly required to meet the stated requirements compared to A, B, and D. Option F is unrelated to the extraction/redaction/residency workflow requirements. Therefore, A, B, and D are the best three choices to meet all stated requirements with minimal operational overhead.", "explanation_zh": "正确的组合是A、B和D，因为这三个选项共同满足了结构化提取、推理前PII编辑、区域人工审核、数据驻留、可审计性和使用托管AWS服务的高规模可用性的强制性要求。选项A至关重要，因为Amazon Textract是AWS托管服务，设计用于从扫描文档（如表单、表格和财务报表）中提取结构化数据。Textract提供置信度分数，Amazon Augmented AI（A2I）专门用于将低置信度提取结果路由到人工审核员。在同一区域内部署Textract和A2I确保人工审核循环保持区域限制，满足贷款申请人的严格数据驻留要求。选项B通过使用AWS Lambda预处理满足推理前编辑PII的要求。它还添加了Amazon Bedrock护栏，以对模型输出强制执行安全控制。区域特定的IAM角色确保只有正确区域中的授权主体才能访问提取的数据和调用下游服务，加强了驻留执行和可审计性。选项D确保源文档存储在与申请人同一区域的Amazon S3中。对象元数据和标记提供了可审计的追踪记录，支持合规报告和可追溯性。S3还提供了支持99.9%应用程序可用性所需的持久性和可用性。选项C不是从扫描文档进行结构化提取的正确方法。选项E增加了有用的质量验证，但与A、B和D相比，并非满足所述要求的严格必需项。选项F与提取/编辑/驻留工作流要求无关。因此，A、B和D是满足所有要求且运营开销最小的三个最佳选择。"}, {"id": 52, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A retail company has a generative AI (GenAI) product recommendation application that uses Amazon \nBedrock. The application suggests products to customers based on browsing history and demographics. The \ncompany needs to implement fairness evaluation across multiple demographic groups to detect and measure \nbias in recommendations between two prompt approaches. The company wants to collect and monitor fairness \nmetrics in real time. The company must receive an alert if the fairness metrics show a discrepancy of more \nthan 15% between demographic groups. The company must receive weekly reports that compare the \nperformance of the two prompt approaches. Which solution will meet these requirements with the LEAST custom development effort? A. B. C. D.", "body_zh": "一家零售公司有一个使用Amazon Bedrock的生成式AI（GenAI）产品推荐应用程序。该应用程序根据浏览历史和人口统计数据向客户推荐产品。公司需要在多个不同人口统计群体中实施公平性评估，以检测和衡量两种提示方法之间推荐中的偏见。公司希望实时收集和监控公平性指标。如果公平性指标显示不同人口统计群体之间的差异超过15%，公司必须收到告警。公司必须每周收到比较两种提示方法性能的报告。哪种解决方案能在自定义开发工作量最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Configure an Amazon CloudWatch dashboard to display default metrics from Amazon Bedrock API \ncalls. Create custom metrics based on model outputs. Set up Amazon EventBridge rules to invoke AWS \nLambda functions that perform post-processing analysis on model responses and publish custom \nfairness metrics.", "Create the two prompt variants in Amazon Bedrock Prompt Management. Use Amazon Bedrock Flows \nto deploy the prompt variants with defined traffic allocation. Configure Amazon Bedrock guardrails to \nmonitor demographic fairness. Set up Amazon CloudWatch alarms on the GuardrailContentSource \ndimension by using InvocationsIntervened metrics to detect recommendation discrepancy threshold \nviolations.", "Set up Amazon SageMaker Clarify to analyze model outputs. Publish fairness metrics to Amazon \nCloudWatch. Create CloudWatch composite alarms that combine SageMaker Clarify bias metrics with \nAmazon Bedrock latency metrics.", "Create an Amazon Bedrock model evaluation job to compare fairness between the two prompt variants. \nEnable model invocation logging in Amazon CloudWatch. Set up CloudWatch alarms for \nInvocationsIntervened metrics with a dimension for each demographic group."], "options_zh": ["配置Amazon CloudWatch仪表板显示Amazon Bedrock API调用的默认指标。基于模型输出创建自定义指标。设置Amazon EventBridge规则来调用AWS Lambda函数，对模型响应执行后处理分析并发布自定义公平性指标。", "在Amazon Bedrock Prompt Management中创建两个提示变体。使用Amazon Bedrock Flows部署具有定义流量分配的提示变体。配置Amazon Bedrock护栏监控人口统计公平性。使用InvocationsIntervened指标设置Amazon CloudWatch告警，通过GuardrailContentSource维度检测推荐差异阈值违规。", "设置Amazon SageMaker Clarify分析模型输出。将公平性指标发布到Amazon CloudWatch。创建结合SageMaker Clarify偏见指标和Amazon Bedrock延迟指标的CloudWatch复合告警。", "创建一个Amazon Bedrock模型评估作业，比较两个提示变体之间的公平性。在Amazon CloudWatch中启用模型调用日志记录。为每个不同人口统计群体设置InvocationsIntervened指标的CloudWatch告警。"], "a": "B", "explanation_en": "Option B best satisfies the requirements with the least custom development effort by using native Amazon Bedrock capabilities for prompt experimentation, traffic management, fairness monitoring, and alerting. Amazon Bedrock Prompt Management allows teams to define and manage multiple prompt variants without code changes, making it ideal for comparing recommendation strategies across demographic groups. Amazon Bedrock Flows enables controlled traffic allocation between prompt variants, which supports real- time A/B testing. This allows the company to collect live fairness metrics under production conditions instead of relying on offline analysis. Because Flows are fully managed, they eliminate the need for custom routing or experimentation frameworks. Amazon Bedrock guardrails provide built-in monitoring and intervention mechanisms. When configured for fairness-related checks, guardrails can detect policy violations and surface metrics such as InvocationsIntervened, which indicate when outputs are modified or blocked due to rule enforcement. These metrics integrate directly with Amazon CloudWatch, enabling real-time dashboards and threshold-based alarms. Setting an alarm at a 15% discrepancy threshold satisfies the alerting requirement with minimal configuration. Weekly reporting can be generated from CloudWatch metrics using scheduled exports or dashboards without building custom analytics pipelines. Option A requires significant custom post-processing logic. Option C introduces an additional service with higher operational overhead and is not optimized for real-time monitoring. Option D focuses on offline evaluation jobs and does not provide continuous real-time fairness monitoring. Therefore, Option B provides the most AWS-native, scalable, and low-effort solution for fairness evaluation and monitoring.", "explanation_zh": "选项B以最少的自定义开发工作量最佳地满足了要求，它使用Amazon Bedrock原生能力进行提示实验、流量管理、公平性监控和告警。Amazon Bedrock Prompt Management允许团队无需更改代码即可定义和管理多个提示变体，是跨不同人口统计群体比较推荐策略的理想选择。Amazon Bedrock Flows支持提示变体之间的受控流量分配，支持实时A/B测试。这使得公司能够在生产条件下收集实时公平性指标，而非依赖离线分析。由于Flows是完全托管的，它们消除了自定义路由或实验框架的需求。Amazon Bedrock护栏提供内置的监控和干预机制。当配置了公平性相关检查时，护栏可以检测策略违规并显示指标（如InvocationsIntervened），指示由于规则执行而修改或阻止了哪些输出。这些指标直接与Amazon CloudWatch集成，实现实时仪表板和基于阈值的告警。将告警设置为15%的差异阈值，以最少的配置满足告警要求。无需构建自定义分析管道，即可使用计划导出或仪表板从CloudWatch指标生成每周报告。选项A需要大量自定义后处理逻辑。选项C引入了具有更高运营开销的额外服务，且未针对实时监控进行优化。选项D侧重于离线评估作业，不提供持续的实时公平性监控。因此，选项B提供了最具AWS原生性、可扩展性和低工作量的公平性评估和监控解决方案。"}, {"id": 53, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A finance company is developing an AI assistant to help clients plan investments and manage their portfolios. \nThe company identifies several high-risk conversation patterns such as requests for specific stock \nrecommendations or guaranteed returns. High-risk conversation patterns could lead to regulatory violations if \nthe company cannot implement appropriate controls. The company must ensure that the AI assistant does not provide inappropriate financial advice, generate \ncontent about competitors, or make claims that are not factually grounded in the company's approved \nfinancial guidance. The company wants to use Amazon Bedrock Guardrails to implement a solution. Which combination of steps will meet these requirements? (Select THREE) A. B. C. D. E. F.", "body_zh": "一家金融公司正在开发一个AI助手，帮助客户规划投资和管理投资组合。公司识别出几种高风险对话模式，如请求特定股票建议或保证回报。高风险对话模式如果公司无法实施适当的控制，可能导致监管违规。公司必须确保AI助手不提供不当的财务建议、不生成关于竞争对手的内容、不做出未基于公司已批准财务指导的事实性声明。公司希望使用Amazon Bedrock护栏来实施解决方案。哪组步骤组合能满足这些要求？（选择三个）A. B. C. D. E. F.", "options_en": ["Add the high-risk conversation patterns to a denied topics guardrail.", "Configure a content filter guardrail to filter prompts that contain the high-risk conversation patterns.", "Configure a content filter guardrail to filter prompts that contain competitor names.", "Add the names of competitors as custom word filters. Set the input and output actions to block.", "Set a low grounding score threshold.", "Set a high grounding score threshold."], "options_zh": ["将高风险对话模式添加到拒绝主题护栏中。", "配置内容过滤器护栏，过滤包含高风险对话模式的提示。", "配置内容过滤器护栏，过滤包含竞争对手名称的提示。", "将竞争对手的名称添加为自定义词过滤器。将输入和输出操作设置为阻止。", "设置低基础事实分数阈值。", "设置高基础事实分数阈值。"], "a": "A D F", "explanation_en": "The correct combination is A, D, and F because these guardrail features directly map to the stated financial compliance and governance requirements. Option A is required because denied topics guardrails are explicitly designed to block entire categories of requests, such as requests for guaranteed returns or specific stock recommendations. These are regulatory- sensitive scenarios where partial filtering is insufficient and full blocking is required to prevent violations. Option D is correct because custom word filters are the appropriate guardrail mechanism to block references to specific competitor names. Content filters are category-based (such as hate, sexual, or violence-related content) and are not suitable for blocking organization-specific competitor references. Custom word filters allow precise blocking at both input and output stages. Option F is required because a high grounding score threshold enforces that model outputs must be strongly supported by approved source material. This prevents the AI assistant from making speculative or unfounded claims that are not aligned with the company’s approved financial guidance, which is critical in regulated financial environments. Option B is incorrect because content filters do not target domain-specific financial advice patterns. Option C is incorrect for the same reason—competitor names are not a content filter category. Option E would weaken factual grounding and increase hallucination risk. Therefore, A, D, and F together provide topic blocking, competitor exclusion, and factual grounding enforcement.", "explanation_zh": "正确的组合是A、D和F，因为这些护栏功能直接对应所述财务合规和治理要求。选项A是必需的，因为拒绝主题护栏专门设计用于阻止整个类别的请求，如请求保证回报或特定股票建议。这些是监管敏感场景，部分过滤不够，需要完全阻止以防止违规。选项D是正确的，因为自定义词过滤器是阻止特定竞争对手名称引用的适当护栏机制。内容过滤器是基于类别的（如仇恨、色情或暴力相关内容），不适合阻止特定组织的竞争对手引用。自定义词过滤器允许在输入和输出阶段进行精确阻止。选项F是必需的，因为高基础事实分数阈值强制执行模型输出必须得到已批准源材料的强烈支持。这防止AI助手做出不符合公司已批准财务指导的推测性或无根据声明，在受监管的金融环境中至关重要。选项B不正确，因为内容过滤器不针对特定领域的财务建议模式。选项C不正确，原因相同——竞争对手名称不是内容过滤器类别。选项E会削弱事实基础并增加幻觉风险。因此，A、D和F共同提供了主题阻止、竞争对手排除和基于事实的执行。"}, {"id": 54, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A wildlife conservation agency operates zoos globally. The agency uses various sensors, trackers, and \naudiovisual recorders to monitor animal behavior. The agency wants to launch a generative AI (GenAI) \nassistant that can ingest multimodal data to study animal behavior. The GenAI assistant must support natural language queries, avoid speculative behavioral interpretations, and \nmaintain audit logs for ethical research audits. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家野生动物保护机构在全球运营动物园。该机构使用各种传感器、跟踪器和音视频记录器来监控动物行为。该机构希望推出一个能够摄取多模态数据以研究动物行为的生成式AI（GenAI）助手。该GenAI助手必须支持自然语言查询、避免推测性行为解释，并为伦理研究审计维护审计日志。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Ingest raw videos into Amazon Rekognition to detect animal postures and expressions. Use Amazon \nData Firehose to stream sensor and GPS data into Amazon S3. Prompt an Amazon Bedrock FM using \nbasic templates stored in AWS Systems Manager Parameter Store. Use IAM for access control. Use \nAWS CloudTrail for audit logging.", "Use Amazon SageMaker Processing and Amazon Transcribe to pre-process multimodal data. Ingest \ncurated summaries into an Amazon Bedrock Knowledge Bases. Apply Amazon Bedrock guardrails to \nrestrict speculative outputs. Use AWS AppConfig to manage prompt templates. Use AWS CloudTrail \nto log research activity for audits.", "Use Amazon OpenSearch Serverless to index behavioral logs and telemetry. Use Amazon Comprehend \nto extract entities. Use Amazon Bedrock to answer questions over indexed data. Use IAM for access \ncontrol and CloudTrail for audit logging.", "Configure Amazon O Business to federate data across Amazon S3, Amazon Kinesis, and Amazon \nSageMaker Feature Store. Use EventBridge for ingestion orchestration. Use custom AWS Lambda \nfunctions to filter LLM outputs for ethical compliance."], "options_zh": ["将原始视频摄取到Amazon Rekognition中检测动物姿态和表情。使用Amazon Data Firehose将传感器和GPS数据流式传输到Amazon S3。使用存储在AWS Systems Manager Parameter Store中的基本模板提示Amazon Bedrock FM。使用IAM进行访问控制。使用AWS CloudTrail进行审计日志记录。", "使用Amazon SageMaker Processing和Amazon Transcribe预处理多模态数据。将精选摘要摄取到Amazon Bedrock知识库中。应用Amazon Bedrock护栏限制推测性输出。使用AWS AppConfig管理提示模板。使用AWS CloudTrail记录研究活动用于审计。", "使用Amazon OpenSearch Serverless索引行为日志和遥测数据。使用Amazon Comprehend提取实体。使用Amazon Bedrock回答关于索引数据的问题。使用IAM进行访问控制和CloudTrail进行审计日志记录。", "配置Amazon Q Business跨Amazon S3、Amazon Kinesis和Amazon SageMaker Feature Store整合数据。使用EventBridge进行摄取编排。使用自定义AWS Lambda函数过滤LLM输出的伦理合规性。"], "a": "B", "explanation_en": "Option B best meets the multimodal, ethical, and auditability requirements using managed AWS services designed for research-grade GenAI systems. Multimodal data such as audio, video, sensor telemetry, and tracking data must be curated and summarized before being consumed by a foundation model. Amazon SageMaker Processing and Amazon Transcribe provide scalable, managed preprocessing for audiovisual and textual data. By ingesting summarized, validated observations into Amazon Bedrock Knowledge Bases, the GenAI assistant can answer natural language queries using grounded, evidence-based context instead of raw sensor signals. This significantly reduces the risk of speculative or anthropomorphic interpretations. Amazon Bedrock guardrails are critical for preventing speculative behavioral claims, enforcing scientific and ethical constraints at inference time. Guardrails provide a validated, auditable safety layer that custom Lambda-based filters cannot reliably replicate. AWS AppConfig enables controlled prompt management and change governance, ensuring that research prompts remain consistent and reviewable. AWS CloudTrail captures all access, query, and configuration changes, supporting ethical research audits and regulatory reviews. Option A lacks grounding and speculative safeguards. Option C focuses on text analytics and does not properly handle multimodal reasoning or safety enforcement. Option D relies heavily on custom logic and introduces unnecessary operational risk. Therefore, Option B provides the most robust, ethical, and auditable GenAI architecture for wildlife behavior research.", "explanation_zh": "选项B最符合多模态、伦理和可审计性要求，使用了专为研究级GenAI系统设计的托管AWS服务。音频、视频、传感器遥测和跟踪数据等多模态数据在被基础模型消费之前必须经过整理和摘要。Amazon SageMaker Processing和Amazon Transcribe为音视频和文本数据提供可扩展的托管预处理。通过将摘要化、验证后的观察结果摄取到Amazon Bedrock知识库中，GenAI助手可以使用基于事实、基于证据的上下文（而非原始传感器信号）回答自然语言查询。这显著降低了推测性或拟人化解释的风险。Amazon Bedrock护栏对于防止推测性行为声明至关重要，在推理时强制执行科学和伦理约束。护栏提供经过验证、可审计的安全层，自定义Lambda过滤器无法可靠复制。AWS AppConfig支持受控的提示管理和变更治理，确保研究提示保持一致和可审查。AWS CloudTrail捕获所有访问、查询和配置更改，支持伦理研究审计和监管审查。选项A缺乏基于事实和推测性防护措施。选项C侧重于文本分析，不能正确处理多模态推理或安全执行。选项D严重依赖自定义逻辑并引入不必要的运营风险。因此，选项B为野生动物行为研究提供了最稳健、最符合伦理且可审计的GenAI架构。"}, {"id": 55, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company uses Amazon Bedrock to implement a Retrieval Augmented Generation (RAG)-based system to \nserve medical information to users. The company needs to compare multiple chunking strategies, evaluate the \ngeneration quality of two foundation models (FMs), and enforce quality thresholds for deployment. Which Amazon Bedrock evaluation configuration will meet these requirements? A. B. C. D.", "body_zh": "一家公司使用Amazon Bedrock实施基于检索增强生成（RAG）的系统，向用户提供医疗信息。公司需要比较多种分块策略，评估两个基础模型（FM）的生成质量，并为部署强制执行质量阈值。哪种Amazon Bedrock评估配置能满足这些要求？A. B. C. D.", "options_en": ["Create a retrieve-only evaluation job that uses a supported version of Anthropic Claude Sonnet as the \nevaluator model. Configure metrics for context relevance and context coverage. Define deployment \nthresholds in a separate CI/CD pipeline.", "Create a retrieve-and-generate evaluation job that uses custom precision-at-k metrics and an LLM-as-a-\njudge metric with a scale of 1–5. Include each chunking strategy in the evaluation dataset. Use a \nsupported version of Anthropic Claude Sonnet to evaluate responses from both FMs.", "Create a separate evaluation job for each chunking strategy and FM combination. Use Amazon Bedrock \nbuilt-in metrics for correctness and completeness. Manually review scores before deployment approval.", "Set up a pipeline that uses multiple retrieve-only evaluation jobs to assess retrieval quality. Create \nseparate evaluation jobs for both FMs that use Amazon Nova Pro as the LLM-as-a-judge model. \nEvaluate based on faithfulness and citation precision metrics."], "options_zh": ["创建一个仅检索评估作业，使用受支持版本的Anthropic Claude Sonnet作为评估模型。配置上下文相关性和上下文覆盖率的指标。在单独的CI/CD管道中定义部署阈值。", "创建一个检索并生成评估作业，使用自定义精确度-at-k指标和1-5分制的LLM-as-a-judge指标。在评估数据集中包含每种分块策略。使用受支持版本的Anthropic Claude Sonnet评估两个FM的响应。", "为每种分块策略和FM组合创建单独的评估作业。使用Amazon Bedrock内置指标评估正确性和完整性。在部署批准前手动评审分数。", "设置一个使用多个仅检索评估作业的管道来评估检索质量。为两个FM创建单独的评估作业，使用Amazon Nova Pro作为LLM-as-a-judge模型。基于忠实度和引用精确度指标进行评估。"], "a": "B", "explanation_en": "Option B is the correct evaluation configuration because it enables end-to-end assessment of both retrieval and generation quality while supporting direct comparison of chunking strategies and foundation models. Amazon Bedrock evaluation jobs are designed to support RAG workflows by evaluating how well retrieved context supports accurate and high-quality model outputs. A retrieve-and-generate evaluation job evaluates the complete RAG pipeline, not just retrieval. This is essential for medical information use cases, where both the relevance of retrieved content and the correctness of generated responses directly impact user safety and trust. Including multiple chunking strategies in the evaluation dataset allows side-by-side comparison under identical prompts and conditions. Custom precision-at-k metrics measure how effectively the retrieval component surfaces relevant chunks, while an LLM-as-a-judge metric provides qualitative scoring of generated responses. Using a numeric scale enables consistent, repeatable evaluation and supports automated quality gates. Amazon Bedrock supports LLM-based evaluators to score dimensions such as accuracy, completeness, and relevance. Using the same evaluator model to assess outputs from both FMs ensures consistent scoring and eliminates evaluator bias. This configuration allows the company to define quantitative thresholds that must be met before deployment, enabling automated promotion through CI/CD pipelines. Option A evaluates retrieval only and cannot assess generation quality. Option C introduces manual review, which does not scale and delays deployment. Option D separates retrieval and generation evaluation, making it harder to correlate chunking strategies with final output quality. Therefore, Option B best meets the requirements for systematic evaluation, comparison, and quality enforcement in an Amazon Bedrock–based RAG system.", "explanation_zh": "选项B是正确的评估配置，因为它支持对检索和生成质量进行端到端评估，同时支持分块策略和基础模型的直接比较。Amazon Bedrock评估作业设计用于支持RAG工作流，通过评估检索到的上下文如何支持准确和高质量的模型输出。检索并生成评估作业评估完整的RAG管道，而不仅仅是检索。这对于医疗信息用例至关重要，因为检索内容的相关性和生成响应的正确性直接影响用户安全和信任。在评估数据集中包含多种分块策略允许在相同提示和条件下进行并排比较。自定义精确度-at-k指标衡量检索组件如何有效地呈现相关数据块，而LLM-as-a-judge指标为生成的响应提供定性评分。使用数字评分支持一致、可重复的评估，并支持自动化的质量门禁。Amazon Bedrock支持基于LLM的评估器，用于评分准确性、完整性和相关性等维度。使用相同的评估模型评估两个FM的输出确保评分一致性，消除评估者偏见。此配置允许公司定义必须在部署前满足的量化阈值，通过CI/CD管道实现自动化推广。选项A仅评估检索，无法评估生成质量。选项C引入手动评审，不可扩展且延迟部署。选项D分离了检索和生成评估，使得将分块策略与最终输出质量相关联更加困难。因此，选项B最符合基于Amazon Bedrock的RAG系统对系统化评估、比较和质量执行的要求。"}, {"id": 56, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company purchases Amazon Q Developer Pro subscriptions for 500 developers to improve code quality \nand productivity. The company needs to create an observability system that tracks adoption metrics across the \ncompany. The observability system must be able to identify active subscription users compared to underused \nsubscriptions. The system must give the company the ability to recognize power users every quarter and to \nidentify teams that require additional training. The system must provide visibility into usage patterns such as \nthe number of lines of Amazon Q generated code that each user has accepted. Which solution will meet these \nrequirements? A. B. C. D.", "body_zh": "一家公司为500名开发人员购买了Amazon Q Developer Pro订阅，以提高代码质量和生产力。公司需要创建一个可观测性系统，跟踪整个公司的采用指标。可观测性系统必须能够识别活跃订阅用户与未充分利用的订阅。系统必须使公司能够每季度识别高级用户，并确定需要额外培训的团队。系统必须提供对使用模式的可视性，如每个用户已接受的Amazon Q生成的代码行数。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Create a usage dashboard for Amazon Q Developer. Use the usage dashboard to track aggregated usage \nadoption metrics.", "Use the Amazon Q Developer built-in administrator dashboard to track user adoption metrics across the \ncompany’s organization in AWS Organizations.", "Collect user-level metrics in Amazon Q Developer. Store the metrics in an Amazon S3 bucket. Use \nAmazon QuickSight to visualize the usage data. Create dashboards to show adoption metrics for users \nand teams.", "Configure AWS CloudTrail to track all Amazon Q Developer API calls in the company’s organization \nin AWS Organizations. Use an AWS Lambda function to process the logs. Store the processed logs in \nAmazon DynamoDB. Create custom dashboards in Amazon Managed Grafana to visualize the data."], "options_zh": ["为Amazon Q Developer创建一个使用量仪表板。使用使用量仪表板跟踪汇总的使用采用指标。", "使用Amazon Q Developer内置的管理员仪表板，跟踪整个公司在AWS Organizations中的用户采用指标。", "在Amazon Q Developer中收集用户级指标。将指标存储在Amazon S3存储桶中。使用Amazon QuickSight可视化使用数据。创建显示用户和团队采用指标的仪表板。", "配置AWS CloudTrail跟踪整个公司AWS Organizations中的所有Amazon Q Developer API调用。使用AWS Lambda函数处理日志。将处理后的日志存储在Amazon DynamoDB中。在Amazon Managed Grafana中创建自定义仪表板以可视化数据。"], "a": "B", "explanation_en": "provides a built-in designed specifically for Amazon Q Developer Pro administrator dashboard organizational observability. This dashboard provides native visibility into user-level metrics across the entire AWS Organization, allowing administrators to identify active vs. underused subscriptions and recognize power users. Crucially, it tracks high-level usage patterns, including (such as lines code acceptance metrics of code generated and accepted), which is a key requirement for measuring ROI and identifying training needs. Using the built-in dashboard provides the necessary insights with the least operational overhead, as it does not require building custom data pipelines (Option C) or complex log processing architectures (Option D).", "explanation_zh": "选项B提供了专为Amazon Q Developer Pro管理员组织可观测性而设计的内置管理员仪表板。该仪表板提供对整个AWS Organization中用户级指标的原生可视性，使管理员能够识别活跃与未充分利用的订阅，并识别高级用户。关键的是，它跟踪高级使用模式，包括行代码接受指标（如生成的代码和被接受的代码），这是衡量ROI和确定培训需求的关键要求。使用内置仪表板以最少的运营开销提供了必要的洞察，因为它不需要构建自定义数据管道（选项C）或复杂的日志处理架构（选项D）。"}, {"id": 57, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company runs a generative AI (GenAI)-powered summarization application in an application AWS account \nthat uses Amazon Bedrock. The application architecture includes an Amazon API Gateway REST API that \nforwards requests to AWS Lambda functions that are attached to private VPC subnets. The application \nsummarizes sensitive customer records that the company stores in a governed data lake in a centralized data \nstorage account. The company has enabled Amazon S3, Amazon Athena, and AWS Glue in the data storage \naccount. The company must ensure that calls that the application makes to Amazon Bedrock use only private \nconnectivity between the company's application VPC and Amazon Bedrock. The company's data lake must \nprovide fine-grained column-level access across the company's AWS accounts. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司在一个使用Amazon Bedrock的应用程序AWS账户中运行一个生成式AI（GenAI）驱动的摘要应用程序。应用程序架构包括一个Amazon API Gateway REST API，该API将请求转发到附加到私有VPC子网的AWS Lambda函数。该应用程序摘要公司存储在集中式数据存储账户的受管数据湖中的敏感客户记录。公司已在数据存储账户中启用了Amazon S3、Amazon Athena和AWS Glue。公司必须确保应用程序对Amazon Bedrock的调用仅使用公司应用程序VPC与Amazon Bedrock之间的私有连接。公司的数据湖必须提供跨公司AWS账户的细粒度列级访问。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["In the application account, create interface VPC endpoints for Amazon Bedrock runtimes. Run Lambda \nfunctions in private subnets. Use IAM conditions on inference and data-plane policies to allow calls \nonly to approved endpoints and roles. In the data storage account, use AWS Lake Formation LF-tag-\nbased access control to create table-level and column-level cross-account grants.", "Run Lambda functions in private subnets. Configure a NAT gateway to provide access to Amazon \nBedrock and the data lake. Use S3 bucket policies and ACLs to manage permissions. Export AWS \nCloudTrail logs to Amazon S3 to perform weekly reviews.", "Create a gateway endpoint only for Amazon S3 in the application account. Invoke Amazon Bedrock \nthrough public endpoints. Use database-level grants in AWS Lake Formation to manage data access. \nStream AWS CloudTrail logs to Amazon CloudWatch Logs. Do not set up metric filters or alarms.", "Use VPC endpoints to provide access to Amazon Bedrock and Amazon S3 in the application account. \nUse only IAM path-based policies to manage data lake access. Send AWS CloudTrail logs to Amazon \nCloudWatch Logs. Periodically create dashboards and allow public fallback for cross-Region reads to \nreduce setup time."], "options_zh": ["在应用程序账户中，为Amazon Bedrock运行时创建接口VPC端点。在私有子网中运行Lambda函数。使用推理和数据平面策略上的IAM条件，仅允许对已批准端点和角色的调用。在数据存储账户中，使用基于AWS Lake Formation LF标签的访问控制创建表级和列级跨账户授权。", "在私有子网中运行Lambda函数。配置NAT网关以提供对Amazon Bedrock和数据湖的访问。使用S3存储桶策略和ACL管理权限。将AWS CloudTrail日志导出到Amazon S3以进行每周审查。", "在应用程序账户中仅为Amazon S3创建网关端点。通过公共端点调用Amazon Bedrock。使用AWS Lake Formation中的数据库级授权管理数据访问。将AWS CloudTrail日志流式传输到Amazon CloudWatch Logs。不设置指标过滤器或告警。", "在应用程序账户中使用VPC端点提供对Amazon Bedrock和Amazon S3的访问。仅使用IAM基于路径的策略管理数据湖访问。将AWS CloudTrail日志发送到Amazon CloudWatch Logs。定期创建仪表板，并允许公共回退用于跨区域读取以减少设置时间。"], "a": "B", "explanation_en": "The first option labeled B is the correct solution because it fully satisfies both private connectivity and fine- grained cross-account data governance requirements using AWS-native services. Creating interface VPC endpoints for Amazon Bedrock runtimes ensures that all inference calls remain on the AWS private network and never traverse the public internet. Running AWS Lambda functions in private subnets enforces network isolation, and using IAM conditions that restrict access to specific VPC endpoints and roles prevents unauthorized inference calls. For the governed data lake, AWS Lake Formation LF-tag–based access control is the recommended AWS mechanism for enforcing cross-account, column-level permissions. LF-tags allow the company to define data access policies once and apply them consistently across accounts, databases, tables, and even individual columns. This is required for sensitive customer records and is not achievable with S3 bucket policies or IAM alone. The second option labeled B uses a NAT gateway, which violates the private connectivity requirement. Option C uses public Bedrock endpoints and only database-level grants, which are insufficient. Option D relies on IAM path-based policies, which cannot enforce column-level access and introduces public fallback paths. Therefore, the first option labeled B is the only solution that meets all networking, security, and data governance requirements.", "explanation_zh": "标记为A的第一个选项是正确的解决方案，因为它完全满足私有连接和细粒度跨账户数据治理要求，使用了AWS原生服务。为Amazon Bedrock运行时创建接口VPC端点确保所有推理调用保持在AWS私有网络内，从不穿越公共互联网。在私有子网中运行AWS Lambda函数强制执行网络隔离，使用特定VPC端点和角色的IAM条件防止未经授权的推理调用。对于受管数据湖，基于AWS Lake Formation LF标签的访问控制是推荐的AWS机制，用于强制执行跨账户列级权限。LF标签允许公司一次性定义数据访问策略，并在账户、数据库、表乃至单个列之间一致应用。这对于敏感客户记录是必需的，且无法仅通过S3存储桶策略或IAM实现。标记为B的第二个选项使用NAT网关，违反了私有连接要求。选项C使用公共Bedrock端点和仅数据库级授权，这还不够。选项D依赖基于IAM路径的策略，无法强制执行列级访问，并引入了公共回退路径。因此，标记为A的第一个选项是唯一满足所有网络、安全和数据治理要求的解决方案。"}, {"id": 58, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A pharmaceutical company is developing a Retrieval Augmented Generation application that uses an Amazon \nBedrock knowledge base. The knowledge base uses Amazon OpenSearch Service as a data source for more \nthan 25 million scientific papers. Users report that the application produces inconsistent answers that cite \nirrelevant sections of papers when queries span methodology, results, and discussion sections of the papers. The company needs to improve the knowledge base to preserve semantic context across related paragraphs on \nthe scale of the entire corpus of data. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家制药公司正在开发一个使用Amazon Bedrock知识库的检索增强生成（RAG）应用程序。知识库使用Amazon OpenSearch Service作为超过2500万篇科学论文的数据源。用户报告称，当查询跨越论文的方法、结果和讨论部分时，应用程序会产生不一致的答案，并引用不相关的论文部分。公司需要改进知识库，以在整个语料库规模上保持相关段落间的语义上下文。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Configure the knowledge base to use fixed-size chunking. Set a 300-token maximum chunk size and a \n10% overlap between chunks. Use an appropriate Amazon Bedrock embedding model.", "Configure the knowledge base to use hierarchical chunking. Use parent chunks that contain 1,000 \ntokens and child chunks that contain 200 tokens. Set a 50-token overlap between chunks.", "Configure the knowledge base to use semantic chunking. Use a buffer size of 1 and a breakpoint \npercentile threshold of 85% to determine chunk boundaries based on content meaning.", "Configure the knowledge base not to use chunking. Manually split each document into separate files \nbefore ingestion. Apply post-processing reranking during retrieval."], "options_zh": ["配置知识库使用固定大小分块。设置最大数据块大小为300个令牌，块间重叠率为10%。使用适当的Amazon Bedrock嵌入模型。", "配置知识库使用分层分块。使用包含1000个令牌的父块和包含200个令牌的子块。设置数据块间50个令牌的重叠。", "配置知识库使用语义分块。使用缓冲区大小1和断点百分位阈值85%，根据内容含义确定数据块边界。", "配置知识库不使用分块。在摄取前手动将每个文档分割为单独文件。在检索期间应用后处理重排序。"], "a": "B", "explanation_en": "Option is the best fit because is designed to preserve local detail while keeping B hierarchical chunking broader document context available during retrieval, which directly addresses the problem of questions spanning methodology, results, and discussion. In large scientific papers, a single answer often depends on linked paragraphs across adjacent sections. If the knowledge base retrieves only small, isolated chunks, the RAG system can cite text that is semantically close to a query term but not contextually correct, producing inconsistent answers and irrelevant citations. With hierarchical chunking, the knowledge base creates that are small enough for high- child chunks precision vector similarity matching, such as 200 tokens, which improves the likelihood that the retrieved text is tightly related to the user’s query. At the same time, each child chunk is associated with a larger parent , such as 1,000 tokens, which retains the surrounding narrative and section-level context. This structure chunk helps the retrieval pipeline return passages that include the relevant subsection plus the explanatory framing that prevents misinterpretation, which is especially important in scientific writing where methods, results, and discussion are interdependent. The configured further reduces boundary effects where key statements split across chunks. This overlap improves continuity for paragraphs that bridge sections, such as a results paragraph that references the methodological setup or a discussion paragraph interpreting a specific metric. Option can improve consistency slightly, but fixed-size chunking still risks separating related paragraphs A and does not provide a built-in mechanism to retrieve broader context linked to precise matches. Option can C create more meaningful boundaries, but it does not guarantee the parent-level context that hierarchical chunking provides at retrieval time. Option increases operational burden and is not practical at the scale of D 25 million", "explanation_zh": "选项B是最佳选择，因为分层分块设计用于在保持局部细节的同时，使更广泛的文档上下文在检索时可用，这直接解决了跨越方法、结果和讨论部分的问题。在大型科学论文中，单个答案通常依赖于跨相邻章节的链接段落。如果知识库仅检索小的孤立数据块，RAG系统可能会引用与查询术语在语义上接近但上下文不正确的文本，产生不一致的答案和不相关的引用。使用分层分块，知识库创建足够小的子块（如200个令牌）用于高精度向量相似度匹配，提高了检索文本与用户查询紧密相关的可能性。同时，每个子块关联一个更大的父块（如1000个令牌），保留了周围的叙述和章节级上下文。这种结构帮助检索管道返回包含相关子节和解释性框架的段落，防止误解，在方法、结果和讨论相互依赖的科学写作中尤为重要。配置的重叠进一步减少了关键声明被分割到不同数据块的边界效应。这种重叠改善了连接章节的段落连续性，如引用方法论设置的结果段落或解释特定指标的讨论段落。选项A可以稍微改善一致性，但固定大小分块仍有分离相关段落的风险，且不提供将更广泛上下文与精确匹配进行关联的内置机制。选项C可以创建更有意义的边界，但不保证在检索时提供分层分块所具有的父级上下文。选项D增加了运营负担，且在2500万篇论文的规模下不实用。因此，选项B最能满足在大规模语料库中保持语义上下文和改善引用相关性的要求。"}, {"id": 59, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A financial services company needs to build a document analysis system that uses Amazon Bedrock to \nprocess quarterly reports. The system must analyze financial data, perform sentiment analysis, and validate \ncompliance across batches of reports. Each batch contains 5 reports. Each report requires multiple foundation \nmodel (FM) calls. The solution must finish the analysis within 10 seconds for each batch. Current sequential \nprocessing takes 45 seconds for each batch. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司需要构建一个使用Amazon Bedrock处理季度报告的文档分析系统。该系统必须分析财务数据、执行情感分析，并跨批次验证合规性。每批包含5份报告。每份报告需要多次基础模型（FM）调用。解决方案必须在每批10秒内完成分析。当前的顺序处理每批需要45秒。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Use AWS Lambda functions with provisioned concurrency to process each analysis type sequentially. \nConfigure the Lambda function timeouts to 10 seconds. Configure automatic retries with exponential \nbackoff.", "Use AWS Step Functions with a Parallel state to invoke separate AWS Lambda functions for each \nanalysis type simultaneously. Configure Amazon Bedrock client timeouts. Use Amazon CloudWatch \nmetrics to track execution time and model inference latency.", "Create an Amazon SQS queue to buffer analysis requests. Deploy multiple AWS Lambda functions \nwith reserved concurrency. Configure each Lambda function to process different aspects of each report \nsequentially and then combine the results.", "Deploy an Amazon ECS cluster that runs containers that process each report sequentially. Use a load \nbalancer to distribute batch workloads. Configure an auto-scaling policy based on CPU utilization."], "options_zh": ["使用具有预置并发的AWS Lambda函数顺序处理每种分析类型。将Lambda函数超时设置为10秒。配置自动重试并带指数退避。", "使用具有Parallel状态的AWS Step Functions同时调用每个分析类型的独立AWS Lambda函数。配置Amazon Bedrock客户端超时。使用Amazon CloudWatch指标跟踪执行时间和模型推理延迟。", "创建Amazon SQS队列缓冲分析请求。部署多个具有预留并发的AWS Lambda函数。配置每个Lambda函数顺序处理报告的不同方面，然后合并结果。", "部署运行容器的Amazon ECS集群，每个容器顺序处理报告。使用负载均衡器分发批量工作负载。配置基于CPU利用率的自动扩展策略。"], "a": "B", "explanation_en": "Option B is the correct solution because it parallelizes independent foundation model inference tasks while maintaining orchestration, observability, and time-bound execution. AWS Generative AI best practices emphasize reducing end-to-end latency by parallelizing independent inference calls rather than scaling individual calls vertically. In this scenario, each report requires multiple independent analyses such as financial extraction, sentiment analysis, and compliance validation. These tasks do not depend on each other’s output, making them ideal candidates for parallel execution. AWS Step Functions provides a Parallel state that can invoke multiple AWS Lambda functions simultaneously, drastically reducing total processing time compared to sequential execution. By invoking Amazon Bedrock from separate Lambda functions in parallel, the system can reduce batch execution time from 45 seconds to well under the 10-second requirement, assuming each inference call remains within acceptable latency bounds. Step Functions also provide built-in error handling, retries, and state tracking, which improves reliability without increasing complexity. CloudWatch metrics allow teams to monitor both workflow execution time and individual model inference latency, enabling performance tuning and operational visibility. Configuring client-side timeouts ensures that slow or failed model invocations do not block the entire batch. Option A still processes tasks sequentially and therefore cannot meet the strict latency requirement. Option C introduces queuing delays and sequential processing within each report, which increases total execution time. Option D relies on container-based sequential processing and adds unnecessary operational overhead for a workload that is event-driven and latency-sensitive. Therefore, Option B best meets the performance, scalability, and operational efficiency requirements for high- speed batch document analysis using Amazon Bedrock.", "explanation_zh": "选项B是正确的解决方案，因为它并行化了独立的FM推理任务，同时保持了编排、可观测性和限时执行。AWS生成式AI最佳实践强调通过并行化独立的推理调用（而非垂直扩展单个调用）来减少端到端延迟。在此场景中，每份报告需要多项独立分析，如财务提取、情感分析和合规验证。这些任务不依赖于彼此的输出，是并行执行的理想选择。AWS Step Functions提供Parallel状态，可以同时调用多个AWS Lambda函数，相比顺序执行大幅减少总处理时间。通过从独立的Lambda函数并行调用Amazon Bedrock，系统可以将批处理执行时间从45秒减少到远低于10秒的要求，假设每个推理调用保持在可接受的延迟范围内。Step Functions还提供内置的错误处理、重试和状态跟踪，提高了可靠性而不增加复杂性。CloudWatch指标允许团队监控工作流执行时间和单个模型推理延迟，实现性能调优和运营可视性。配置客户端超时确保缓慢或失败的模型调用不会阻塞整个批次。选项A仍然顺序处理任务，因此无法满足严格的延迟要求。选项C引入了队列延迟和每份报告内的顺序处理，增加了总执行时间。选项D依赖基于容器的顺序处理，为事件驱动和延迟敏感的工作负载增加了不必要的运营开销。因此，选项B最符合使用Amazon Bedrock进行高速批处理文档分析的性能、可扩展性和运营效率要求。"}, {"id": 60, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "An ecommerce company is using Amazon Bedrock to build a generative AI (GenAI) application. The \napplication uses AWS Step Functions to orchestrate a multi-agent workflow to produce detailed product \ndescriptions. The workflow consists of three sequential states: a description generator, a technical \nspecifications validator, and a brand voice consistency checker. Each state produces intermediate reasoning \ntraces and outputs that are passed to the next state. The application uses an Amazon S3 bucket for process \nstorage and to store outputs. During testing, the company discovers that outputs between Step Functions states frequently exceed the 256 \nKB quota and cause workflow failures. A GenAI Developer needs to revise the application architecture to \nefficiently handle the Step Functions 256 KB quota and maintain workflow observability. The revised \narchitecture must preserve the existing multi-agent reasoning and acting (ReAct) pattern. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家电子商务公司正在使用Amazon Bedrock构建一个生成式AI（GenAI）应用程序。该应用程序使用AWS Step Functions编排一个多智能体工作流，以生成详细的产品描述。工作流由三个顺序状态组成：描述生成器、技术规格验证器和品牌语音一致性检查器。每个状态产生中间推理轨迹和输出，传递到下一个状态。应用程序使用Amazon S3存储桶进行处理存储和输出存储。在测试期间，公司发现Step Functions状态之间的输出经常超过256KB配额，导致工作流失败。GenAI开发人员需要修改应用程序架构，以高效处理Step Functions的256KB配额并保持工作流可观测性。修改后的架构必须保留现有的多智能体推理与行动（ReAct）模式。哪种解决方案能在运营开销最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Store intermediate outputs in Amazon DynamoDB. Pass only references between states. Create a Map \nstate that retrieves the complete data from DynamoDB when required for each agent's processing step.", "Configure an Amazon Bedrock integration to use the S3 bucket URI in the input parameters for large \noutputs. Use the ResultPath and ResultSelector fields to route S3 references between the agent steps \nwhile maintaining the sequential validation workflow.", "Use AWS Lambda functions to compress outputs to less than 256 KB before each agent state. \nConfigure each agent task to decompress outputs before processing and to compress results before \npassing them to the next state.", "Configure a separate Step Functions state machine to handle each agent’s processing. Use Amazon \nEventBridge to coordinate the execution flow between state machines. Use S3 references for the \noutputs as event data."], "options_zh": ["将中间输出存储在Amazon DynamoDB中。在状态之间仅传递引用。创建一个Map状态，在每个智能体的处理步骤需要时从DynamoDB检索完整数据。", "配置Amazon Bedrock集成，在输入参数中使用S3存储桶URI处理大型输出。使用ResultPath和ResultSelector字段在智能体步骤之间路由S3引用，同时保持顺序验证工作流。", "使用AWS Lambda函数将输出压缩到小于256KB，然后传递给每个智能体状态。配置每个智能体任务在处理前解压输出，并在传递给下一状态前压缩结果。", "配置单独的Step Functions状态机处理每个智能体的处理。使用Amazon EventBridge协调状态机之间的执行流程。使用S3引用作为事件数据传递输出。"], "a": "B", "explanation_en": "Option B is the best solution because it directly addresses the Step Functions 256 KB state payload quota by externalizing large intermediate artifacts to Amazon S3 and passing only lightweight references (URIs/keys) between states. This is a standard AWS pattern for workflows that produce large intermediate results, and it avoids introducing additional databases, compression logic, or cross-state-machine coordination that increases operational overhead. In a multi-agent ReAct workflow, intermediate reasoning traces can be verbose and grow quickly as each agent produces chain-of-thought style artifacts, structured outputs, and supporting evidence. Step Functions is designed to orchestrate state transitions and pass JSON payloads, but large payloads should be stored outside the state machine and referenced by pointer values. Using Amazon S3 for intermediate outputs is operationally efficient because the application already uses S3 for storage, and S3 provides durable, low-cost storage with simple access patterns. ResultPath and ResultSelector allow each state to store or reshape results so that only the required reference fields (such as s3Uri, object key, metadata, trace IDs) are forwarded to subsequent states. This preserves observability because the workflow can still log trace references, correlate steps with S3 objects, and store structured metadata for debugging. It also preserves the sequential validation design, keeping the existing ReAct pattern intact while preventing failures due to oversized payloads. Option A adds additional services and read/write patterns that increase operational complexity. Option C introduces custom compression/decompression logic that is fragile, adds latency, and complicates troubleshooting. Option D increases orchestration overhead by splitting workflows and coordinating with events, which makes debugging harder and increases failure modes. Therefore, Option B meets the payload limit requirement while keeping the architecture simple and observable.", "explanation_zh": "选项B是最佳解决方案，因为它直接解决了Step Functions 256KB状态负载配额，通过将大型中间产物外部化到Amazon S3，并在状态之间仅传递轻量级引用（URI/键）。这是一种标准AWS模式，适用于产生大型中间结果的工作流，避免了引入增加运营开销的额外数据库、压缩逻辑或跨状态机协调。在多智能体ReAct工作流中，中间推理轨迹可能很冗长，随着每个智能体产生思维链式产物、结构化输出和支持证据而快速增长。Step Functions设计用于编排状态转换和传递JSON负载，但大型负载应存储在状态机外部并通过指针值引用。使用Amazon S3存储中间输出在运营上是高效的，因为应用程序已使用S3进行存储，且S3提供持久、低成本的存储和简单的访问模式。ResultPath和ResultSelector允许每个状态存储或重塑结果，以便仅转发所需的引用字段（如s3Uri、对象键、元数据、追踪ID）到后续状态。这保持了可观测性，因为工作流仍然可以记录追踪引用、将步骤与S3对象关联，并存储用于调试的结构化元数据。它还保留了顺序验证设计，保持现有ReAct模式完整，同时防止因负载过大而失败。选项A增加了额外的服务以及读写模式，增加了运营复杂性。选项C引入了脆弱的自定义压缩/解压逻辑，增加延迟并复杂化故障排除。选项D通过拆分工作流并用事件协调增加了编排开销，使调试更困难并增加了故障模式。因此，选项B在满足负载限制的同时保持了最少的运营开销和架构简洁性。"}, {"id": 61, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A medical device company wants to feed reports of medical procedures that used the company’s devices into \nan AI assistant. To protect patient privacy, the AI assistant must expose patient personally identifiable \ninformation (PII) only to surgeons. The AI assistant must redact PII for engineers. The AI assistant must \nreference only medical reports that are less than 3 years old. The company stores reports in an Amazon S3 bucket as soon as each report is published. The company has \nalready set up an Amazon Bedrock Knowledge Bases. The AI assistant uses Amazon Cognito to authenticate \nusers. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗器械公司希望将使用该公司设备的医疗程序报告输入AI助手。为保护患者隐私，AI助手必须仅对外科医生暴露患者的个人身份信息（PII）。AI助手必须为工程师编辑PII。AI助手必须仅引用不超过3年的医疗报告。公司在新报告发布后立即将其存储在Amazon S3存储桶中。公司已设置了Amazon Bedrock知识库。AI助手使用Amazon Cognito验证用户身份。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Enable Amazon Macie PII detection on the S3 bucket. Use an S3 trigger to invoke an AWS Lambda \nfunction that redacts PII from the reports. Configure the Lambda function to delete outdated documents \nand invoke knowledge base syncing.", "Invoke an AWS Lambda function to sync the S3 bucket and the knowledge base when a new report is \nuploaded. Use a second Lambda function with Amazon Comprehend to redact PII for engineers. Use S3 \nLifecycle rules to remove reports older than 3 years.", "Set up an S3 Lifecycle configuration to remove reports that are older than 3 years. Schedule an AWS \nLambda function to run daily syncs between the bucket and the knowledge base. When users interact \nwith the AI assistant, apply a guardrail configuration selected based on the user’s Cognito user group to \nredact PII from responses when required.", "Create a second knowledge base. Use Lambda and Amazon Comprehend to redact PII before syncing to \nthe second knowledge base. Route users to the appropriate knowledge base based on Cognito group \nmembership."], "options_zh": ["在S3存储桶上启用Amazon Macie PII检测。使用S3触发器调用AWS Lambda函数，从报告中编辑PII。配置Lambda函数删除过期文档并调用知识库同步。", "在新报告上传时调用AWS Lambda函数同步S3存储桶和知识库。使用第二个Lambda函数配合Amazon Comprehend为工程师编辑PII。使用S3生命周期规则删除超过3年的报告。", "设置S3生命周期配置，删除超过3年的报告。安排AWS Lambda函数每日运行，在存储桶和知识库之间进行同步。当用户与AI助手交互时，根据用户的Cognito用户组选择应用的护栏配置，在需要时从响应中编辑PII。", "创建第二个知识库。使用Lambda和Amazon Comprehend在同步到第二个知识库前编辑PII。根据Cognito组成员身份将用户路由到适当的知识库。"], "a": "C", "explanation_en": "Option C is the correct solution because it enforces privacy controls at inference time, not at ingestion time, which is required when different user roles require different visibility into the same underlying data. Using an S3 Lifecycle configuration ensures that documents older than 3 years are automatically removed, guaranteeing that the knowledge base references only compliant, recent medical reports. Scheduling Lambda- based syncs keeps the knowledge base aligned with the bucket contents without introducing complex per- upload orchestration. The most important requirement is role-based PII exposure. Amazon Bedrock guardrails support dynamic application at inference time, allowing the system to select a guardrail configuration based on the authenticated user’s Amazon Cognito group. Surgeons can receive full responses, while engineers receive responses with PII masked—without duplicating data or maintaining multiple knowledge bases. This approach preserves a single source of truth for medical reports while enforcing privacy through response- level controls. It also maintains full auditability of access and redaction behavior. Option A permanently removes PII and violates surgeon access requirements. Option B redacts data inconsistently and couples privacy logic to ingestion. Option D doubles storage, increases cost, and introduces data drift risk. Therefore, Option C best meets privacy, compliance, scalability, and operational efficiency requirements.", "explanation_zh": "选项C是正确的解决方案，因为它在推理时而非摄取时执行隐私控制，当不同用户角色需要对相同底层数据具有不同可视性时，这是必需的。使用S3生命周期配置确保超过3年的文档自动删除，保证知识库仅引用合规的近期医疗报告。安排基于Lambda的同步使知识库与存储桶内容保持一致，无需引入复杂的按上传编排。最重要的要求是基于角色的PII暴露控制。Amazon Bedrock护栏支持在推理时动态应用，允许根据已验证用户的Amazon Cognito组选择护栏配置。外科医生可以接收完整响应，而工程师接收PII被屏蔽的响应——无需复制数据或维护多个知识库。这种方法为医疗报告保持了单一的真实数据源，同时通过响应级控制强制执行隐私。它还保持了访问和编辑行为的完全可审计性。选项A永久删除PII，违反了外科医生访问要求。选项B不一致地编辑数据，并将隐私逻辑与摄取耦合。选项D增加了存储量、成本和数据漂移风险。因此，选项C最符合隐私、合规、可扩展性和运营效率要求。"}, {"id": 62, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A bank is developing a generative AI (GenAI)-powered AI assistant that uses Amazon Bedrock to assist the \nbank’s website users with account inquiries and financial guidance. The bank must ensure that the AI assistant \ndoes not reveal any personally identifiable information (PII) in customer interactions. The AI assistant must not send PII in prompts to the GenAI model. The AI assistant must not respond to \ncustomer requests to provide investment advice. The bank must collect audit logs of all customer interactions, \nincluding any images or documents that are transmitted during customer interactions. Which solution will meet these requirements with the LEAST operational effort? A. B. C. D.", "body_zh": "一家银行正在开发一个由生成式AI（GenAI）驱动的AI助手，使用Amazon Bedrock帮助银行网站用户处理账户咨询和财务指导。银行必须确保AI助手不在客户交互中泄露任何个人身份信息（PII）。AI助手不得在发送给GenAI模型的提示中包含PII。AI助手不得响应客户提供投资建议的请求。银行必须收集所有客户交互的审计日志，包括客户交互期间传输的任何图像或文档。哪种解决方案能在运营工作量最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Use Amazon Macie to detect and redact PII in user inputs and in the model responses. Apply prompt \nengineering techniques to force the model to avoid investment advice topics. Use AWS CloudTrail to \ncapture conversation logs.", "Use an AWS Lambda function and Amazon Comprehend to detect and redact PII. Use Amazon \nComprehend topic modeling to prevent the AI assistant from discussing investment advice topics. Set \nup custom metrics in Amazon CloudWatch to capture customer conversations.", "Configure Amazon Bedrock guardrails to apply a sensitive information policy to detect and filter PII. \nSet up a topic policy to ensure that the AI assistant avoids investment advice topics. Use the Converse \nAPI to log model invocations. Enable delivery and image logging to Amazon S3.", "Use regex controls to match patterns for PII. Apply prompt engineering techniques to avoid returning \nPII or investment advice topics to customers. Enable model invocation logging, delivery logging, and \nimage logging to Amazon S3."], "options_zh": ["使用Amazon Macie检测并编辑用户输入和模型响应中的PII。应用提示工程技术强制模型避免投资建议主题。使用AWS CloudTrail捕获对话日志。", "使用AWS Lambda函数和Amazon Comprehend检测并编辑PII。使用Amazon Comprehend主题建模防止AI助手讨论投资建议主题。在Amazon CloudWatch中设置自定义指标以捕获客户对话。", "配置Amazon Bedrock护栏应用敏感信息策略，检测和过滤PII。设置主题策略确保AI助手避免投资建议主题。使用Converse API记录模型调用。启用投递日志和图像日志记录到Amazon S3。", "使用正则表达式控制匹配PII模式。应用提示工程技术避免向客户返回PII或投资建议主题。启用模型调用日志记录、投递日志记录和图像日志记录到Amazon S3。"], "a": "C", "explanation_en": "Option C is the correct solution because Amazon Bedrock guardrails are purpose-built to enforce defense-in- depth safety controls for GenAI applications with minimal operational overhead. Guardrails provide managed, policy-based enforcement that operates before prompts are sent to the foundation model and after responses are generated, which directly satisfies the requirement that PII must not be sent to the model and must not appear in outputs. By configuring a sensitive information policy, the application can automatically detect and redact PII in user inputs and model responses without building custom preprocessing pipelines. This approach is more reliable and scalable than regex or prompt engineering techniques, which are brittle and error-prone for sensitive data handling. The topic policy capability in Amazon Bedrock guardrails allows the bank to explicitly block investment advice topics, ensuring regulatory compliance. This policy-based approach is safer and more auditable than attempting to steer the model only through prompt instructions. Using the Converse API enables structured, standardized interactions with the model and supports consistent logging of requests and responses. Enabling delivery logging and image logging to Amazon S3 ensures that all customer interactions, including documents and images, are captured in a durable, auditable storage layer. This directly supports compliance, regulatory audits, and forensic analysis. Option A incorrectly relies on Amazon Macie, which is designed for data-at-rest discovery rather than real- time conversational filtering. Option B introduces custom Lambda pipelines and topic modeling, increasing operational complexity. Option D relies on regex and prompt engineering, which do not meet financial-grade compliance standards. Therefore, Option C delivers the strongest security, governance, and auditability with the least operational effort.", "explanation_zh": "选项C是正确的解决方案，因为Amazon Bedrock护栏专为GenAI应用程序强制执行纵深防御安全控制而构建，运营开销最小。护栏提供托管式、基于策略的执行，在提示发送到基础模型之前和生成响应之后都生效，直接满足了PII不得发送到模型且不得出现在输出中的要求。通过配置敏感信息策略，应用程序可以自动检测和编辑用户输入和模型响应中的PII，无需构建自定义预处理管道。这种方法比正则表达式或提示工程技术更可靠和可扩展，后者在敏感数据处理方面脆弱且容易出错。Amazon Bedrock护栏中的主题策略能力允许银行显式阻止投资建议主题，确保监管合规。这种基于策略的方法比仅通过提示指令引导模型更安全、更可审计。使用Converse API可以实现结构化的标准化模型交互，并支持一致的请求和响应日志记录。启用投递日志和图像日志记录到Amazon S3确保所有客户交互（包括文档和图像）被捕获在持久、可审计的存储层中。这直接支持合规性、监管审计和取证分析。选项A错误地依赖Amazon Macie，它专为静态数据发现而非实时对话过滤而设计。选项B引入了自定义Lambda管道和主题建模，增加了运营复杂性。选项D依赖正则表达式和提示工程，无法达到金融级合规标准。因此，选项C以最少的运营工作量提供了最强的安全性、治理和可审计性。"}, {"id": 63, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is using Amazon Bedrock to build a customer-facing AI assistant that handles sensitive customer \ninquiries. The company must use defense-in-depth safety controls to block sophisticated prompt injection \nattacks. The company must keep audit logs of all safety interventions. The AI assistant must have cross-\nRegion failover capabilities. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock构建一个面向客户的AI助手，处理敏感的客户咨询。公司必须使用纵深防御安全控制来阻止复杂的提示注入攻击。公司必须保留所有安全干预的审计日志。AI助手必须具有跨区域故障转移能力。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Configure Amazon Bedrock guardrails with content filters set to high to protect against prompt \ninjection attacks. Use a guardrail profile to implement cross-Region guardrail inference. Use Amazon \nCloudWatch Logs with custom metrics to capture detailed guardrail intervention events.", "Configure Amazon Bedrock guardrails with content filters set to high. Use AWS WAF to block \nsuspicious inputs. Use AWS CloudTrail to log API calls.", "Deploy Amazon Comprehend custom classifiers to detect prompt injection attacks. Use Amazon API \nGateway request validation. Use CloudWatch Logs to capture intervention events.", "Configure Amazon Bedrock guardrails with custom content filters and word filters set to high. \nConfigure cross-Region guardrail replication for failover. Store logs in AWS CloudTrail for compliance \nauditing."], "options_zh": ["配置Amazon Bedrock护栏，将内容过滤器设置为高，以防范提示注入攻击。使用护栏配置文件实施跨区域护栏推理。使用Amazon CloudWatch Logs配合自定义指标捕获详细的护栏干预事件。", "配置Amazon Bedrock护栏，将内容过滤器设置为高。使用AWS WAF阻止可疑输入。使用AWS CloudTrail记录API调用。", "部署Amazon Comprehend自定义分类器检测提示注入攻击。使用Amazon API Gateway请求验证。使用CloudWatch Logs捕获干预事件。", "配置Amazon Bedrock护栏，将自定义内容过滤器和词过滤器设置为高。配置跨区域护栏复制以实现故障转移。将日志存储在AWS CloudTrail中以供合规审计。"], "a": "A", "explanation_en": "Option A provides the most complete, AWS-native defense-in-depth solution for protecting against prompt injection attacks while meeting audit and resiliency requirements. Amazon Bedrock guardrails are designed specifically to enforce safety policies on both user inputs and model outputs, including protections against prompt injection and jailbreak attempts. Setting content filters to high increases sensitivity to malicious or manipulative inputs. Guardrail profiles allow the same guardrail configuration to be applied consistently across multiple Regions, enabling cross- Region inference and failover without configuration drift. This directly satisfies the requirement for regional resilience. Amazon CloudWatch Logs captures detailed guardrail intervention events, including when content is blocked, modified, or flagged. Custom metrics derived from these logs enable fine-grained auditing, alerting, and reporting on safety enforcement actions. This provides a more detailed audit trail of safety interventions than API-level logs alone. Option B adds WAF protection but lacks detailed guardrail intervention logging. Option C introduces additional services and custom logic that increase complexity and may miss model-specific injection patterns. Option D references replication concepts that are not aligned with Bedrock guardrail operational models and relies on word filters, which are insufficient against sophisticated prompt injection techniques. Therefore, Option A best meets the requirements for layered protection, auditability, and cross-Region resilience using managed Amazon Bedrock safety controls.", "explanation_zh": "选项A提供了最完整的AWS原生纵深防御解决方案，用于防范提示注入攻击，同时满足审计和弹性要求。Amazon Bedrock护栏专门设计用于在用户输入和模型输出上强制执行安全策略，包括针对提示注入和越狱尝试的保护。将内容过滤器设置为高压制对恶意或操纵性输入的敏感性。护栏配置文件允许相同的护栏配置在多个区域一致应用，实现跨区域推理和故障转移而不会出现配置漂移。这直接满足了区域弹性的要求。Amazon CloudWatch Logs捕获详细的护栏干预事件，包括内容被阻止、修改或标记的时间。从这些日志派生的自定义指标实现了安全执行措施的细粒度审计、告警和报告。这提供了比仅API级日志更详细的安全干预审计追踪。选项B增加了WAF保护，但缺乏详细的护栏干预日志记录。选项C引入了增加复杂性的额外服务和自定义逻辑，可能遗漏模型特定的注入模式。选项D引用的复制概念与Bedrock护栏运营模型不一致，且依赖词过滤器，这不足以应对复杂的提示注入技术。因此，选项A使用托管的Amazon Bedrock安全控制，最符合分层保护、可审计性和跨区域弹性的要求。"}, {"id": 64, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A financial services company is deploying a generative AI (GenAI) application that uses Amazon Bedrock to \nassist customer service representatives to provide personalized investment advice to customers. The company \nmust implement a comprehensive governance solution that follows responsible AI practices and meets \nregulatory requirements. The solution must detect and prevent hallucinations in recommendations. The solution must have safety \ncontrols for customer interactions. The solution must also monitor model behavior drift in real time and \nmaintain audit trails of all prompt-response pairs for regulatory review. The company must deploy the \nsolution within 60 days. The solution must integrate with the company's existing compliance dashboard and \nrespond to customers within 200 ms. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家金融服务公司正在部署一个生成式AI（GenAI）应用程序，使用Amazon Bedrock帮助客户服务代表为客户提供个性化投资建议。公司必须实施全面的治理解决方案，遵循负责任的AI实践并满足监管要求。解决方案必须检测和防止建议中的幻觉。解决方案必须对客户交互具有安全控制。解决方案还必须实时监控模型行为漂移，并维护所有提示-响应对的审计追踪，以供监管审查。公司必须在60天内部署解决方案。解决方案必须与公司现有的合规仪表板集成，并在200毫秒内响应客户。哪种解决方案能在运营开销最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Configure Amazon Bedrock guardrails to apply custom content filters and toxicity detection. Use \nAmazon Bedrock Model Evaluation to detect hallucinations. Store prompt-response pairs in Amazon \nDynamoDB to capture audit trails and set a TTL. Integrate Amazon CloudWatch custom metrics with \nthe existing compliance dashboard.", "Deploy Amazon Bedrock and use AWS PrivateLink to access the application securely. Use AWS \nLambda functions to implement custom prompt validation. Store prompt-response pairs in an Amazon \nS3 bucket and configure S3 Lifecycle policies. Create custom Amazon CloudWatch dashboards to \nmonitor model performance metrics.", "Use Amazon Bedrock Agents and Amazon Bedrock Knowledge Bases to ground responses. Use \nAmazon Bedrock Guardrails to enforce content safety. Use Amazon OpenSearch Service to store and \nindex prompt-response pairs. Integrate OpenSearch Service with Amazon QuickSight to create \ncompliance reports and to detect model behavior drift.", "Use Amazon SageMaker Model Monitor to detect model behavior drift. Use AWS WAF to filter \ncontent. Store customer interactions in an encrypted Amazon RDS database. Use Amazon API Gateway \nto create custom HTTP APIs to integrate with the compliance dashboard."], "options_zh": ["配置Amazon Bedrock护栏应用自定义内容过滤器和毒性检测。使用Amazon Bedrock Model Evaluation检测幻觉。将提示-响应对存储在Amazon DynamoDB中以捕获审计追踪并设置TTL。将Amazon CloudWatch自定义指标与现有合规仪表板集成。", "部署Amazon Bedrock并使用AWS PrivateLink安全访问应用程序。使用AWS Lambda函数实施自定义提示验证。将提示-响应对存储在Amazon S3存储桶中并配置S3生命周期策略。创建自定义Amazon CloudWatch仪表板监控模型性能指标。", "使用Amazon Bedrock Agents和Amazon Bedrock知识库来基于事实生成响应。使用Amazon Bedrock护栏强制内容安全。使用Amazon OpenSearch Service存储和索引提示-响应对。将OpenSearch Service与Amazon QuickSight集成，创建合规报告并检测模型行为漂移。", "使用Amazon SageMaker Model Monitor检测模型行为漂移。使用AWS WAF过滤内容。将客户交互存储在加密的Amazon RDS数据库中。使用Amazon API Gateway创建自定义HTTP API，与合规仪表板集成。"], "a": "A", "explanation_en": "Option A is the correct solution because it uses native Amazon Bedrock governance and evaluation capabilities to meet regulatory, performance, and deployment timeline requirements with the least operational overhead. Amazon Bedrock guardrails provide built-in safety controls that enforce responsible AI policies directly during inference. Custom content filters and toxicity detection protect customer interactions and prevent disallowed investment guidance patterns without requiring custom application logic. Guardrails operate inline and are optimized for low latency, which helps meet the strict 200 ms response-time requirement. Hallucination detection is addressed through Amazon Bedrock Model Evaluation, which supports automated evaluation at scale using LLM-as-a-judge techniques. This enables the company to detect factual inaccuracies and policy violations systematically, without building custom evaluation pipelines or requiring extensive human review. Evaluation outputs can be surfaced as metrics. Storing all prompt-response pairs in Amazon DynamoDB provides a low-latency, highly scalable audit store that aligns with financial regulatory requirements. Using TTL enforces data retention policies automatically, reducing compliance risk and storage overhead. Amazon CloudWatch custom metrics integrate seamlessly with existing compliance dashboards, allowing near–real-time monitoring of safety interventions, hallucination rates, and drift indicators. CloudWatch anomaly detection can be applied to these metrics to surface behavior changes quickly. Option B relies on custom Lambda logic and S3-based auditing, increasing latency and operational complexity. Option C introduces additional services that increase setup time and may exceed the 60-day deployment window. Option D uses non–Bedrock-native monitoring and adds unnecessary infrastructure layers. Therefore, Option A provides the most complete, compliant, and low-overhead governance solution for a regulated GenAI financial services application.", "explanation_zh": "选项A是正确的解决方案，因为它使用原生Amazon Bedrock治理和评估能力，以最少的运营开销满足监管、性能和部署时间线要求。Amazon Bedrock护栏提供内置安全控制，在推理时直接执行负责任的AI策略。自定义内容过滤器和毒性检测保护客户交互，防止不允许的投资指导模式，无需自定义应用程序逻辑。护栏内联操作并针对低延迟进行了优化，有助于满足严格的200毫秒响应时间要求。幻觉检测通过Amazon Bedrock Model Evaluation实现，支持使用LLM-as-a-judge技术进行大规模自动化评估。这使得公司能够系统地检测事实不准确和策略违规，无需构建自定义评估管道或需要大量人工审核。评估输出可以作为指标呈现。将所有提示-响应对存储在Amazon DynamoDB中提供了低延迟、高可扩展的审计存储，符合金融监管要求。使用TTL自动执行数据保留策略，降低合规风险和存储开销。Amazon CloudWatch自定义指标无缝集成到现有合规仪表板中，支持安全干预、幻觉率和漂移指标的近实时监控。CloudWatch异常检测可以应用于这些指标，快速发现行为变化。选项B依赖自定义Lambda逻辑和基于S3的审计，增加了延迟和运营复杂性。选项C引入了额外服务，增加了设置时间，可能超出60天的部署窗口。选项D使用非Bedrock原生的监控，并增加了不必要的基础设施层。因此，选项A为受监管的GenAI应用程序提供了最完整、最合规且开销最小的治理解决方案。"}, {"id": 65, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A software company is using Amazon Q Business to build an AI assistant that allows employees to access \ncompany information and personal information by using natural language prompts. The company stores this \ninformation in an Amazon S3 bucket. Each department in the company has a dedicated prefix in the S3 bucket. Each object name includes the S3 \nprefix of the department that it belongs to. Each department can belong to only a single group in AWS IAM \nIdentity Center. Each employee belongs to a single department. The company configures Amazon Q Business to access data stored in an S3 bucket as a data source. The \ncompany needs to ensure that the AI assistant respects access controls based on the user's IAM Identity Center \ngroup membership. Which solution will meet this requirement with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家软件公司正在使用Amazon Q Business构建一个AI助手，允许员工通过自然语言提示访问公司信息和个人信息。公司将这些信息存储在Amazon S3存储桶中。公司的每个部门在S3存储桶中都有一个专用前缀。每个对象名称包含其所属部门的S3前缀。每个部门只能属于AWS IAM Identity Center中的一个组。每位员工属于一个部门。公司配置Amazon Q Business访问存储在S3存储桶中的数据作为数据源。公司需要确保AI助手根据用户的IAM Identity Center组成员资格遵守访问控制。哪种解决方案能在运营开销最小的情况下满足这个要求？A. B. C. D.", "options_en": ["Create a JSON file named acl.json in each department folder. In each file, create access control entries \nthat specify the IAM Identity Center group that should have access to that department's data. Indicate \nthe location of the JSON file in the Access Control section of the data source settings.", "Create a single JSON file named acl.json at the top level of the S3 bucket. Add access control entries \nthat map each department's S3 prefix to its corresponding IAM Identity Center group. Indicate the \nlocation of the JSON file in the Access Control section of the data source settings.", "For each IAM Identity Center group, create a separate permissions set that denies access to all prefixes \nin the S3 bucket. Add a StringNotEquals condition key to the permissions set for each group that \nspecifies the department each group is associated with. Attach the permissions sets to the Identity \nCenter groups.", "Create a metadata file named metadata.json at the top level of the S3 bucket. Add an AccessControlList \nobject to the file that specifies the S3 path of each department's prefix. Specify the IAM Identity Center \ngroup that should have access to each department's prefix. Reference the file location in the data source \nmetadata settings."], "options_zh": ["在每个部门文件夹中创建一个名为acl.json的JSON文件。在每个文件中创建访问控制条目，指定应有权访问该部门数据的IAM Identity Center组。在数据源设置的访问控制部分指明JSON文件的位置。", "在S3存储桶的根级别创建一个名为acl.json的单个JSON文件。添加访问控制条目，将每个部门的S3前缀映射到其对应的IAM Identity Center组。在数据源设置的访问控制部分指明JSON文件的位置。", "为每个IAM Identity Center组创建一个单独的权限集，拒绝访问S3存储桶中的所有前缀。为每个组添加一个StringNotEquals条件键，指定该组关联的部门。将权限集附加到Identity Center组。", "在S3存储桶的根级别创建一个名为metadata.json的元数据文件。向文件添加一个AccessControlList对象，指定每个部门前缀的S3路径。指定应有权访问每个部门前缀的IAM Identity Center组。在数据源元数据设置中引用文件位置。"], "a": "B", "explanation_en": "Option B is the correct solution because Amazon Q Business natively supports access control lists (ACLs) for S3 data sources using a single, centralized JSON file that maps S3 prefixes to IAM Identity Center groups. This approach directly aligns with the company’s data organization model, where each department’s data is stored under a distinct S3 prefix and each employee belongs to exactly one department group. Using a single acl.json file at the bucket root minimizes operational overhead by centralizing access control logic in one location. Administrators can update department mappings without touching individual folders or changing IAM permissions, which simplifies governance and reduces the risk of configuration drift. Amazon Q Business automatically evaluates the user’s IAM Identity Center group membership at query time and filters accessible documents accordingly. Option A increases operational complexity by requiring a separate ACL file in every department folder, which becomes difficult to maintain as departments or prefixes change. Option C attempts to enforce access using IAM permissions sets, but Amazon Q Business access control for S3 data sources is not designed to be managed through IAM condition logic and would significantly increase complexity. Option D introduces a custom metadata structure that is not the supported mechanism for Amazon Q Business access enforcement. Therefore, Option B provides the cleanest, most scalable, and AWS-recommended solution for enforcing department-based access control with the least operational effort.", "explanation_zh": "选项B是正确的解决方案，因为Amazon Q Business原生支持使用单一的集中式JSON文件为S3数据源提供访问控制列表（ACL），该文件将S3前缀映射到IAM Identity Center组。这种方法直接符合公司的数据组织模型，每个部门的数据存储在特定的S3前缀下，每位员工恰好属于一个部门组。在存储桶根目录使用单个acl.json文件，通过将访问控制逻辑集中在一个位置来最小化运营开销。管理员可以更新部门映射，而无需接触单个文件夹或更改IAM权限，简化了治理并降低了配置漂移的风险。Amazon Q Business在查询时自动评估用户的IAM Identity Center组成员资格并相应地过滤可访问的文档。选项A增加了运营复杂性，需要在每个部门文件夹中放置单独的ACL文件，随着部门或前缀的变化变得难以维护。选项C尝试使用IAM权限集强制执行访问，但Amazon Q Business对S3数据源的访问控制并非设计为通过IAM条件逻辑管理，且会显著增加复杂性。选项D引入了不是Amazon Q Business访问执行支持机制的自定义元数据结构。因此，选项B提供了最清晰、最可扩展且最符合AWS建议的解决方案，以最少的运营工作量实施基于部门的访问控制。"}, {"id": 66, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company is developing an AI-powered search assistant application to help investment \nadvisors quickly retrieve investment data. The application runs as an AWS Lambda function. The company is \nusing Amazon Bedrock to develop the application by using an Amazon Bedrock knowledge base that uses \nAmazon OpenSearch Serverless as its data source. The application agent must manage collections at scale by \nautomatically assigning access permissions to collections and indexes that match a specific pattern. The \ncompany uses Amazon Bedrock tools to test the knowledge base. The knowledge base sync process finishes \nsuccessfully. However, the test reveals a 400 Bad Authorization error from the BedrockAgentRuntime API \nand a 403 Forbidden error when the test attempts to access OpenSearch Serverless. The company must \nresolve the permissions issues. Which combination of solutions will meet this requirement? (Select TWO.) A. B. C. D. E.", "body_zh": "一家金融服务公司正在开发一个由AI驱动的搜索助手应用程序，帮助投资顾问快速检索投资数据。该应用程序作为AWS Lambda函数运行。公司正在使用Amazon Bedrock开发应用程序，使用以Amazon OpenSearch Serverless为数据源的Amazon Bedrock知识库。应用程序智能体必须通过自动分配与特定模式匹配的集合和索引的访问权限来管理大规模集合。公司使用Amazon Bedrock工具测试知识库。知识库同步过程成功完成。然而，测试显示BedrockAgentRuntime API返回400 Bad Authorization错误，且当测试尝试访问OpenSearch Serverless时出现403 Forbidden错误。公司必须解决权限问题。哪组解决方案组合能满足这个要求？（选择两个。）A. B. C. D. E.", "options_en": ["Update the Lambda function execution role to include the bedrock:InvokeAgent permission. Add the \naoss:APIAccessAll permission to the Lambda execution role.", "Create an OpenSearch Serverless data access policy that includes pattern-based resource rules.", "Configure a VPC endpoint policy for OpenSearch Serverless. Add the endpoint to the Lambda \nfunction's VPC configuration.", "Configure AWS Secrets Manager to store OpenSearch Serverless credentials. Grant the Lambda \nfunction access to retrieve the credentials.", "Enable IAM authentication for the OpenSearch Serverless domain. Add the es:ESHttp* permission to \nthe Lambda function execution role."], "options_zh": ["更新Lambda函数执行角色，包含bedrock:InvokeAgent权限。向Lambda执行角色添加aoss:APIAccessAll权限。", "创建包含基于模式的资源规则的OpenSearch Serverless数据访问策略。", "为OpenSearch Serverless配置VPC端点策略。将该端点添加到Lambda函数的VPC配置中。", "配置AWS Secrets Manager存储OpenSearch Serverless凭证。授予Lambda函数检索凭证的访问权限。", "为OpenSearch Serverless域启用IAM身份验证。向Lambda函数执行角色添加es:ESHttp*权限。"], "a": "A B", "explanation_en": "The errors described indicate missing permissions at both the application orchestration and data access levels. The from BedrockAgentRuntime indicates the Lambda execution role lacks the 400 Bad Authorization identity permission to invoke the agent; adding and (which allows bedrock:InvokeAgent aoss:APIAccessAll the principal to interact with OpenSearch Serverless APIs) is necessary. The error from 403 Forbidden OpenSearch Serverless specifically relates to data-plane permissions. Unlike traditional OpenSearch, Serverless uses . To \"manage collections at scale\" automatically, a policy must be created data access policies that uses (e.g., matching a prefix), ensuring that as new collections or indexes pattern-based resource rules are created, the required principals (the Lambda role and the Bedrock service role) are granted the necessary access witho
