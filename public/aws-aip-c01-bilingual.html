not scalable because it requires manual review of all responses. Option C relies on static rules and end-user feedback, which is insufficient for regulatory compliance and factual accuracy assurance. Option D provides monitoring but not structured quality evaluation or policy enforcement. Therefore, Option B provides the most complete, AWS-aligned solution for scalable evaluation plus human oversight in a regulated financial context.", "explanation_zh": "选项B满足了对可扩展的自动化评估进行组合的要求，并利用托管的AWS GenAI能力实现有针对性的监督。Amazon Bedrock评估能够跨大量交互实现系统性、可重复的质量评估。使用LLM作为评判模型的方法，配合强大的评估模型（如Anthropic Claude Sonnet），允许公司自动对输出的维度（如事实准确性、对话恰当性和策略一致性）进行评分。这直接支持了\"大规模自动化质量评估\"，而无需构建自定义评分模型。然而，金融建议带来的风险更高，因为监管合规需要超出一般质量评分的额外执行措施。Amazon BedrockGuardrails提供了专用的策略执行层，可以在响应违反合规约束时进行拦截或干预。Guardrails对于防止不允许的金融指导模式并确保跨部署的一致行为尤为重要。需求还要求\"对关键交互进行有针对性的审核\"。Amazon Augmented AI（A2I）是一种托管的人工审核服务，支持基于规则或置信度阈值将特定项目路由给人工审核员。在这种设计中，系统可以自动仅将高风险或策略标记的交互发送给合格的金融专家进行审核，在保持规模的同时将人工精力集中在最重要的事项上。选项A不可扩展，因为它需要人工审核所有响应。选项C依赖静态规则和最终用户反馈，不足以满足监管合规和事实准确性保证。选项D提供监控，但不提供结构化的质量评估或策略执行。因此，选项B在受监管的金融环境中为可扩展评估加上人工监督提供了最完整、最符合AWS理念的解决方案。"}, {"id": 16, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A specialty coffee company has a mobile app that generates personalized coffee roast profiles by using \nAmazon Bedrock with a three-stage prompt chain. The prompt chain converts user inputs into structured \nmetadata, retrieves relevant logs for coffee roasts, and generates a personalized roast recommendation for \neach customer. Users in multiple AWS Regions report inconsistent roast recommendations for identical inputs, slow \ninference during the retrieval step, and unsafe recommendations such as brewing at excessively high \ntemperatures. The company must improve the stability of outputs for repeated inputs. The company must also \nimprove app performance and the safety of the app's outputs. The updated solution must ensure 99.5% output \nconsistency for identical inputs and achieve inference latency of less than 1 second. The solution must also \nblock unsafe or hallucinated recommendations by using validated safety controls. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家精品咖啡公司有一个移动应用程序，使用Amazon Bedrock通过三阶段提示链生成个性化的咖啡烘焙档案。该提示链将用户输入转换为结构化元数据，检索相关的咖啡烘焙日志，并为每位客户生成个性化的烘焙推荐。多个AWS区域的用户报告说，对相同输入得到的烘焙推荐不一致，检索步骤期间推理速度慢，以及出现不安全的推荐（例如在过高的温度下冲泡）。公司必须提高对重复输入的输出稳定性。公司还必须改善应用程序性能和输出安全性。更新后的解决方案必须确保对相同输入的输出一致性达到99.5%，并将推理延迟控制在1秒以下。该解决方案还必须通过经过验证的安全控制来阻止不安全或产生幻觉的推荐。哪种解决方案能满足这些要求？", "options_en": ["Deploy Amazon Bedrock with provisioned throughput to stabilize inference latency. Apply Amazon \nBedrock guardrails that have semantic denial rules to block unsafe outputs. Use Amazon Bedrock \nPrompt Management to manage prompts by using approval workflows.", "Use Amazon Bedrock Agents to manage chaining. Log model inputs and outputs to Amazon \nCloudWatch Logs. Use logs from Amazon CloudWatch to perform A/B testing for prompt versions.", "Cache prompt results in Amazon ElastiCache. Use AWS Lambda functions to pre-process metadata and \nto trace end-to-end latency. Use AWS X-Ray to identify and remediate performance bottlenecks.", "Use Amazon Kendra to improve roast log retrieval accuracy. Store normalized prompt metadata within \nAmazon DynamoDB. Use AWS Step Functions to orchestrate multi-step prompts."], "options_zh": ["部署具有预置吞吐量的Amazon Bedrock以稳定推理延迟。应用具有语义拒绝规则的Amazon BedrockGuardrails来阻止不安全输出。使用Amazon Bedrock Prompt Management通过审批工作流管理提示词。", "使用Amazon Bedrock Agents管理链式调用。将模型输入和输出记录到Amazon CloudWatch Logs。使用CloudWatch日志对提示版本进行A/B测试。", "在Amazon ElastiCache中缓存提示结果。使用AWS Lambda函数预处理元数据并跟踪端到端延迟。使用AWS X-Ray识别和修复性能瓶颈。", "使用Amazon Kendra改善烘焙日志的检索准确性。在Amazon DynamoDB中存储标准化的提示元数据。使用AWS Step Functions编排多步骤提示。"], "a": "A", "explanation_en": "Option best meets the combined requirements of low latency, stability, and validated safety controls by A using purpose-built Amazon Bedrock features designed for production GenAI operations. The company’s latency target of under 1 second and its observation of degradation during spikes strongly indicate capacity and throughput variability. for Amazon Bedrock is intended to deliver more Provisioned throughput predictable performance by reserving inference capacity for a chosen model, reducing throttling risk and stabilizing response times under load. This directly improves operational consistency across Regions where on-demand capacity can vary. The requirement to “block unsafe or hallucinated recommendations” is most directly addressed by Amazon . Guardrails provide managed safety enforcement, including sensitive information Bedrock Guardrails controls and configurable content policies. Using enables the application to prevent semantic denial rules unsafe guidance such as dangerous brewing temperatures or other harmful procedural instructions, enforcing safety at the model boundary rather than relying on downstream filtering. The remaining requirement is “99.5% output consistency for identical inputs.” While generative models can be probabilistic, production systems achieve practical consistency by controlling prompt versions, inputs, and policy behavior. supports controlled prompt lifecycle practices, Amazon Bedrock Prompt Management including versioning and approval workflows, which reduce unintended drift across deployments and Regions. By ensuring the same approved prompt templates and parameters are used consistently, the company can materially improve repeatability for the same structured inputs and retrieval context, which is essential in multi-stage prompt chains. The other options are incomplete. improves experimentation and observability but does not enforce safety B controls or stabilize latency. can improve performance, but it does not provide validated safety enforcement C at inference time. can help retrieval relevance, but it does not address unsafe outputs or inference stability. D Therefore, is the only option that simultaneously targets predictable latency, governance of prompt A behavior, and strong safety controls within Amazon Bedrock.", "explanation_zh": "选项A通过使用专为生产GenAI运营设计的Amazon Bedrock特性，最佳地满足了低延迟、稳定性和经过验证的安全控制的组合需求。公司低于1秒的延迟目标以及高峰期间性能下降的观察结果，强烈表明是容量和吞吐量变化导致的问题。Amazon Bedrock的预置吞吐量旨在通过为所选模型预留推理容量来提供更可预测的性能，从而降低节流风险并稳定负载下的响应时间。这直接改善了跨区域的运营一致性，因为按需容量在不同区域可能有所不同。\"阻止不安全或产生幻觉的推荐\"的要求最能通过Amazon BedrockGuardrails直接解决。Guardrails提供托管的安全执行能力，包括敏感信息控制和可配置的内容策略。使用语义拒绝规则，应用程序能够阻止不安全的指导（如有害的冲泡温度或其他危险的操作说明），在模型边界处实施安全控制，而不是依赖下游过滤。其余要求是\"对相同输入实现99.5%的输出一致性\"。虽然生成模型可能是概率性的，但生产系统通过控制提示版本、输入和策略行为来实现实际的一致性。Amazon Bedrock Prompt Management支持受控的提示生命周期实践，包括版本控制和审批工作流，减少了跨部署和区域的意外漂移。通过确保跨区域一致使用相同的经批准的提示模板和参数，公司可以在相同的结构化输入和检索上下文下显著提高可重复性，这对于多阶段提示链至关重要。其他选项不完整。选项B改善实验和可观测性，但不强制执行安全控制或稳定延迟。选项C可以改善性能，但不提供提示版本控制的安全控制。选项D改善检索和编排，但不针对核心要求。因此，选项A是最佳选择。"}, {"id": 17, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A GenAI developer is building a Retrieval Augmented Generation (RAG)-based customer support application \nthat uses Amazon Bedrock foundation models (FMs). The application needs to process 50 GB of historical \ncustomer conversations that are stored in an Amazon S3 bucket as JSON files. The application must use the \nprocessed data as its retrieval corpus. The application’s data processing workflow must extract relevant data \nfrom customer support documents, remove customer personally identifiable information (PII), and generate \nembeddings for vector storage. The processing workflow must be cost-effective and must finish within 4 \nhours. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一位GenAI开发人员正在构建一个基于检索增强生成（RAG）的客户支持应用程序，使用Amazon BedrockFoundation Model (FM)。应用程序需要处理存储在Amazon S3存储桶中作为JSON文件的50 GB历史客户对话数据。应用程序必须将处理后的数据用作其检索语料库。应用程序的数据处理工作流必须从客户支持文档中提取相关数据、删除客户个人身份信息（PII）并生成embeddings for向量存储。该处理工作流必须具有成本效益，并需在4小时内完成。哪种解决方案的运营开销最低？", "options_en": ["Use AWS Lambda and Amazon Comprehend to process files in parallel, remove PII, and call Amazon \nBedrock APIs to generate vectors. Configure Lambda concurrency limits and memory settings to \noptimize throughput.", "Create an AWS Glue ETL job to run PII detection scripts on the data. Use Amazon SageMaker \nProcessing to run the HuggingFaceProcessor to generate embeddings by using a pre-trained model. \nStore the embeddings in Amazon OpenSearch Service.", "Deploy an Amazon EMR cluster that runs Apache Spark with user-defined functions (UDFs) that call \nAmazon Comprehend to detect PII. Use Amazon Bedrock APIs to generate vectors. Store outputs in \nAmazon Aurora PostgreSQL with the pgvector extension.", "Implement a data processing pipeline that uses AWS Step Functions to orchestrate a workload that uses \nAmazon Comprehend to detect PII and Amazon Bedrock to generate embeddings. Directly integrate the \nworkflow with Amazon OpenSearch Serverless to store vectors and provide similarity search \ncapabilities."], "options_zh": ["使用AWS Lambda和Amazon Comprehend并行处理文件、删除PII，并调用Amazon Bedrock API生成向量。配置Lambda并发限制和内存设置以优化吞吐量。", "创建一个AWS Glue ETL作业对数据运行PII检测脚本。使用Amazon SageMaker Processing运行HuggingFaceProcessor，利用预训练模型generate embeddings。将嵌入存储在Amazon OpenSearch Service中。", "部署一个运行Apache Spark的Amazon EMR集群，使用调用Amazon Comprehend检测PII的用户定义函数（UDF）。使用Amazon Bedrock API生成向量。将输出存储在带有pgvector扩展的Amazon Aurora PostgreSQL中。", "实现一个数据处理管道，使用AWS Step Functions编排工作负载，使用Amazon Comprehend检测PII并使用Amazon Bedrockgenerate embeddings。将工作流直接与Amazon OpenSearch Serverless集成以存储向量并提供相似性搜索能力。"], "a": "D", "explanation_en": "Comprehensive and Detailed 250 to 350 words of Explanation From AWS Generative AI concepts and services documents: Option D is the best solution because it delivers a fully managed, scalable pipeline with minimal infrastructure management while meeting the 50 GB and 4-hour constraint. AWS Step Functions provides a serverless orchestration layer that can coordinate parallel processing steps, retries, and error handling without managing clusters or tuning long-running compute. Using Amazon Comprehend for PII detection fulfills the requirement to remove customer PII in a managed and consistent way. Step Functions can coordinate Comprehend calls at scale and route sanitized outputs into the embedding step. Generating embeddings with Amazon Bedrock keeps the entire workflow within AWS managed services, eliminates the need to maintain custom embedding models, and supports consistent vector representations for downstream retrieval. Direct integration with Amazon OpenSearch Serverless provides a low-operations vector store that can handle large-scale indexing and similarity search without cluster sizing, node maintenance, or shard management. This aligns strongly with the requirement for least operational overhead and supports growth beyond the initial 50 GB corpus. Step Functions can batch and parallelize ingestion into OpenSearch Serverless to meet the 4-hour completion goal in a cost-effective manner by controlling concurrency, chunk sizes, and failure handling. Option A can be difficult and costly at this scale because Lambda concurrency and per-invocation overhead can become complex to tune for 50 GB within 4 hours. Option B introduces SageMaker Processing and embedding model management, increasing operational complexity. Option C requires EMR cluster management and tuning, which is the opposite of minimal overhead. Therefore, Option D is the most operationally efficient, scalable, and managed approach to build the required PII-sanitized embedding pipeline for a RAG corpus.", "explanation_zh": "选项D是最佳方案，因为它提供了一个完全托管、可扩展的管道，在满足50 GB和4小时约束的同时，基础架构管理工作量最小。AWS Step Functions提供了无服务器的编排层，可以协调并行处理步骤、重试和错误处理，而无需管理集群或调优长时间运行的计算任务。使用Amazon Comprehend进行PII检测，以托管且一致的方式满足删除客户PII的要求。Step Functions可以大规模协调Comprehend调用，并将清理后的输出路由到嵌入步骤。使用Amazon Bedrockgenerate embeddings使整个工作流保持在AWS托管服务范围内，消除了维护自定义embedding model的需要，并支持下游检索的一致向量表示。与Amazon OpenSearch Serverless的直接集成提供了低运营开销的向量存储，可以处理大规模索引和相似性搜索，而无需集群规模调整、节点维护或分片管理。这与最低运营开销的要求高度一致，并支持超出初始50 GB语料库的增长。Step Functions可以批处理和并行化向OpenSearch Serverless的摄取，通过控制并发、分块大小和错误处理，以具有成本效益的方式实现4小时的完成目标。选项A在此规模下可能困难且成本高昂，因为Lambda并发和每次调用的开销对于在4小时内处理50 GB可能变得复杂且难以调优。选项B引入了SageMaker Processing和embedding model管理，增加了运营复杂性。选项C需要EMR集群管理和调优，这与最低开销完全相反。因此，选项D是构建所需PII清理嵌入管道的最具运营效率、可扩展性和托管性的方法。"}, {"id": 18, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is building a generative AI (GenAI) application that uses Amazon Bedrock APIs to process \ncomplex customer inquiries. During peak usage periods, the application experiences intermittent API timeouts \nthat cause issues such as broken response chunks and delayed data delivery. The application struggles to \nensure that prompts remain within token limits when handling complex customer inquiries of varying lengths. \nUsers have reported truncated inputs and incomplete responses. The company has also observed foundation \nmodel (FM) invocation failures. The company needs a retry strategy that automatically handles transient service errors and prevents \noverwhelming Amazon Bedrock during peak usage periods. The strategy must also adapt to changing service \navailability and support response streaming and token-aware request handling. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在构建一个使用Amazon Bedrock API处理复杂客户查询的生成式AI（GenAI）应用程序。在高峰使用期间，应用程序遇到间歇性的API超时，导致响应块损坏和数据交付延迟等问题。在处理不同长度的复杂客户查询时，应用程序难以确保提示词保持在Token限制内。用户报告了输入被截断和响应不完整的问题。公司还观察到Foundation Model (FM)调用失败。公司需要一个重试策略，能够自动处理瞬态服务错误，并防止在高峰使用期间压垮Amazon Bedrock。该策略还必须适应不断变化的服务可用性，并支持响应流式传输和Token感知的请求处理。哪种解决方案能满足这些要求？", "options_en": ["Implement a standard retry strategy that uses a 1-second fixed delay between attempts and a 3-retry \nmaximum for all errors. Handle streaming response timeouts by restarting streams. Cap token usage for \neach session.", "Implement an adaptive retry strategy that uses exponential backoff with jitter and a circuit breaker \npattern that temporarily disables retries when error rates exceed a predefined threshold. Implement a", "streaming response handler that monitors for chunk delivery timeouts. Configure the handler to buffer \nsuccessfully received chunks and intelligently resume streaming from the last received chunk when \nconnections are re-established.", "Use the AWS SDK to configure a retry strategy in standard mode. Wrap Amazon Bedrock API calls in \ntry-catch blocks that handle timeout exceptions. Return cached completions for failed streaming \nrequests. Enforce a global token limit for all users. Add jitter-based retry logic and lightweight token \ntrimming for each request. Resume broken streams by requesting only missing chunks from the point of \nfailure. Maintain a small in-memory buffer of the most recent chunks.", "Set Amazon Bedrock client request timeouts to 30 seconds. Implement client-side load shedding. \nBuffer partial results and stop new requests when application performance degrades. Set static token \nusage caps for all requests. Configure exponential backoff retries, dynamic chunk sizing, and context-\naware token limits."], "options_zh": ["实现一个标准重试策略，在尝试之间使用1秒固定延迟，并对所有错误设置最多3次重试。通过重新启动流来处理流式响应超时。限制每个会话的Token使用量。", "实现一个自适应重试策略，使用带抖动的指数退避和断路器模式，当错误率超过预定义阈值时暂时禁用重试。实现一个流式响应处理器，监控块交付超时。配置处理器缓冲成功接收的块，并在连接重新建立时智能地从最后接收的块恢复流式传输。", "使用AWS SDK配置标准模式的重试策略。将Amazon Bedrock API调用包装在try-catch块中处理超时异常。为失败的流式请求返回缓存的完整结果。对所有用户强制实施全局Token限制。为每个请求添加基于抖动的重试逻辑和轻量级Token裁剪。通过仅从失败点请求缺失的块来恢复中断的流。维护最近块的小型内存缓冲区。", "将Amazon Bedrock客户端请求超时设置为30秒。实现客户端负载丢弃。缓冲部分结果，并在应用程序性能下降时停止新请求。为所有请求设置静态Token使用上限。配置指数退避重试、动态块大小调整和上下文感知的Token限制。"], "a": "B", "explanation_en": "Option B best meets all requirements because it combines AWS-recommended resiliency patterns for transient failures with streaming-aware handling and adaptive protection against cascading retries during peak load. When timeouts and throttling occur, naïve retries can amplify traffic and worsen outages. Exponential backoff with jitter is the standard AWS best practice because it spreads retry attempts over time, reduces synchronized retry storms, and lowers the probability of repeatedly colliding with service limits. The requirement also states the strategy must “adapt to changing service availability” and “prevent overwhelming Amazon Bedrock.” A circuit breaker pattern directly addresses this by temporarily stopping or reducing retries when failure rates exceed a threshold, allowing the system to degrade gracefully instead of continually hammering the service. This is a key mechanism to prevent cascading failures during throttling events. Because the application uses response streaming and experiences broken chunks, the retry strategy must be streaming-aware. A streaming response handler that detects chunk delivery timeouts and buffers already received chunks prevents the user from losing progress when a connection drops. Resuming from the last successfully received chunk minimizes redundant generation and reduces additional load on the model compared with restarting the entire stream. This supports better user experience and better service efficiency during intermittent failures. Token-aware request handling is supported in this architecture because the application can apply token budgeting before invoking the model (for example, trimming or summarizing excessive context) while still preserving streaming output behavior. Option B provides the correct backbone for this by focusing on adaptive control and robust streaming recovery. Option A is too simplistic and risks retry storms. Option C combines conflicting elements (global token limit, cached completions for streaming) and includes impractical “request only missing chunks” behavior that is not a reliable property of streamed generative output. Option D includes useful ideas (load shedding) but relies on static caps and does not provide as strong adaptive retry control as circuit breaking. Therefore, Option B is the most correct and operationally safe strategy for peak-load Bedrock streaming workloads.", "explanation_zh": "选项B最佳地满足了所有要求，因为它将AWS推荐的针对瞬态故障的弹性模式与流感知处理相结合，并在高峰负载期间提供针对级联重试的自适应保护。当发生超时和节流时，简单的重试可能会放大流量并加剧故障。带抖动的指数退避是标准的AWS最佳实践，因为它将重试尝试分散到时间上，减少同步重试风暴，并降低反复与服务限制冲突的概率。需求还要求策略必须\"适应不断变化的服务可用性\"并\"防止压垮Amazon Bedrock\"。断路器模式直接解决了这个问题，通过当故障率超过阈值时暂时停止或减少重试，允许系统优雅降级而不是持续冲击服务。这是防止节流事件中级联故障的关键机制。由于应用程序使用响应流式传输并遇到块损坏问题，重试策略必须对流式传输敏感。一个检测块交付超时并缓冲已接收块的流式响应处理器，可以在连接断开时防止用户丢失进度。从最后成功接收的块恢复，最小化了冗余生成，并减少了与重新启动整个流相比对模型的额外负载。这在间歇性故障期间支持更好的用户体验和更好的服务效率。Token感知的请求处理在此架构中得到支持，因为应用程序可以在调用模型之前应用Token预算管理（例如，裁剪或总结过多的上下文），同时仍然保持流式输出行为。选项B通过专注于自适应控制和稳健的流恢复提供了正确的骨架。选项A过于简单，存在重试风暴的风险。选项C结合了冲突的元素。选项D引入了不必要的复杂性。因此，选项B是最佳选择。"}, {"id": 19, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A healthcare company wants to develop a proof-of-concept application that uses Amazon Bedrock to \nautomatically summarize medical documents. The company has 3 weeks to validate the application's \naccuracy. The application must comply with the company’s data privacy policies. The application must \ninclude metrics to evaluate summarization accuracy and processing time. Which solution will meet these \nrequirements? A. B. C. D.", "body_zh": "一家医疗保健公司希望开发一个概念验证应用程序，使用Amazon Bedrock自动总结医疗文档。公司有3周时间来验证应用程序的准确性。应用程序必须符合公司的数据隐私政策。应用程序必须包含用于评估总结准确性和处理时间的指标。哪种解决方案能满足这些要求？", "options_en": ["Create a dataset that includes 50-100 anonymized patient records. Implement Retrieval Augmented \nGeneration (RAG) with a secure knowledge base. Use a judge model to evaluate accuracy metrics \nacross three foundation models (FMs).", "Fine-tune a single foundation model (FM) on patient records. Deploy the FM on Amazon Bedrock. Use \nAmazon Bedrock AgentCore to configure the FM as an agent. Conduct user testing on 500 company \nstaff members.", "Select the most powerful available AWS foundation model (FM). Create a chat interface by using \nConverse APIs. Test the application on 50-100 actual patient records by using only qualitative feedback \nfrom stakeholders. Use a custom web interface to gather real-world performance metrics.", "Use the Strands SDK to deploy multiple agents that connect to multiple knowledge bases that contain \nspecialized medical documents. Compare the responses of the agents. Evaluate the integration of the \nagents with the company's existing systems."], "options_zh": ["创建一个包含50-100份匿名患者记录的数据集。使用安全的Knowledge Base实施检索增强生成（RAG）。使用评判模型评估三个Foundation Model (FM)的准确性指标。", "在患者记录上微调单个Foundation Model (FM)。在Amazon Bedrock上部署FM。使用Amazon Bedrock AgentCore将FM配置为代理。对500名公司员工进行用户测试。", "选择最强大的可用AWSFoundation Model (FM)。使用Converse API创建聊天界面。仅使用来自利益相关者的定性反馈，在50-100份实际患者记录上测试应用程序。使用自定义Web界面收集实际性能指标。", "使用Strands SDK部署连接到多个包含专业医疗文档的Knowledge Base的多个代理。比较各代理的响应。评估代理与公司现有系统的集成。"], "a": "A", "explanation_en": "For a 3-week proof-of-concept in a regulated field like healthcare, Retrieval Augmented Generation (RAG) is more efficient and safer than fine-tuning. RAG allows the use of without anonymized patient records risking the leak of sensitive data into the model's permanent memory. To evaluate accuracy quantitatively and rapidly, the \"LLM-as-a-judge\" pattern is recommended. Using a strong to score the outputs of judge model multiple candidate FMs provides objective metrics (e.g., factual alignment, completeness) that manual qualitative feedback (Option C) cannot scale to provide within the timeline. Fine-tuning (Option B) typically takes longer than 3 weeks to properly data-prep and validate for clinical accuracy.", "explanation_zh": "对于受监管领域（如医疗保健）中为期3周的概念验证，检索增强生成（RAG）比微调更高效且更安全。RAG允许使用匿名患者记录，而不会冒将敏感数据泄露到模型永久记忆中的风险。为了定量且快速地评估准确性，推荐使用\"LLM作为评判模型\"的模式。使用强评判模型对多个候选FM的输出进行评分，提供了客观的指标（如事实一致性、完整性），而手动定性反馈（选项C）在时间限制内无法规模化做到。微调（选项B）通常需要超过3周的时间来适当地准备数据并验证临床准确性。"}, {"id": 20, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is planning to deploy multiple generative AI (GenAI) applications to five independent business \nunits that operate in multiple countries in Europe and the Americas. Each application uses Amazon Bedrock \nRetrieval Augmented Generation (RAG) patterns with business unit-specific knowledge bases that store \nterabytes of unstructured data. The company must establish well-architected, standardized components for security controls, observability \npractices, and deployment patterns across all the GenAI applications. The components must be reusable, \nversioned, and governed consistently. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司计划向五个独立的业务部门部署多个生成式AI（GenAI）应用程序，这些业务部门在欧洲和美洲的多个国家运营。每个应用程序使用Amazon Bedrock检索增强生成（RAG）模式，并配有存储了TB级非结构化数据的业务部门特定Knowledge Base。公司必须为所有GenAI应用程序建立符合良好架构框架的标准组件，用于安全控制、可观测性实践和部署模式。这些组件必须是可重用、有版本控制且一致治理的。哪种解决方案能满足这些要求？", "options_en": ["Configure Amazon API Gateway REST API endpoints for the GenAI applications. Deploy common \nsecurity, observability, and RAG patterns based on the AWS Well-Architected Generative AI Lens in \nstandardized AWS CloudFormation templates. Use CloudFormation Guard after deployment to validate \npolicy compliance in each business unit.", "Create standardized AWS CloudFormation templates to implement security, observability, and RAG \npatterns based on the AWS Well-Architected Generative AI Lens. Establish a centralized repository for \nversion control. Integrate a CI/CD pipeline with CloudFormation Guard to enforce consistent and \nrepeatable deployments across business units.", "Use AWS Service Catalog to define standardized portfolios and versioned products for each business \nunit. Use the portfolios to enforce security, observability, and RAG patterns based on the AWS Well-\nArchitected Generative AI Lens. Require business units to use the Service Catalog console to deploy \nresources.", "Document security controls, observability requirements, and RAG patterns based on the AWS Well-\nArchitected Generative AI Lens in a shared design document. Use Amazon Macie to enforce \ndeployment. Delegate implementation responsibility to each business unit."], "options_zh": ["为GenAI应用程序配置Amazon API Gateway REST API端点。基于AWS Well-Architected Generative AI Lens，将通用的安全、可观测性和RAG模式部署在标准化的AWS CloudFormation模板中。部署后使用CloudFormation Guard验证每个业务部门的策略合规性。", "基于AWS Well-Architected Generative AI Lens创建标准化的AWS CloudFormation模板，用于实现安全、可观测性和RAG模式。建立一个用于版本控制的中央存储库。将CI/CD管道与CloudFormation Guard集成，以跨业务部门强制执行一致且可重复的部署。", "使用AWS Service Catalog为每个业务部门定义标准化的产品组合和版本化产品。使用这些产品组合强制执行基于AWS Well-Architected Generative AI Lens的安全、可观测性和RAG模式。要求业务部门使用Service Catalog控制台部署资源。", "在共享设计文档中记录基于AWS Well-Architected Generative AI Lens的安全控制、可观测性需求和RAG模式。使用Amazon Macie强制执行部署。将实施责任委托给每个业务部门。"], "a": "B", "explanation_en": "Option B best meets the requirement for reusable, versioned, and consistently governed components across multiple business units because it implements “platform-level standardization” through infrastructure as code plus automated compliance enforcement before deployment. Standardized CloudFormation templates provide reusable building blocks for security controls (identity, networking boundaries, encryption), observability practices (metrics, logs, traces), and RAG deployment patterns (knowledge base integration, ingestion pipelines, retrieval controls). This aligns with AWS guidance to operationalize well-architected patterns through repeatable templates rather than ad hoc implementations. A centralized repository enables version control, change review, and governance of templates across all five business units. This satisfies the “versioned” and “reusable” requirements and provides a single source of truth for approved architectures. Integrating a CI/CD pipeline ensures that deployments are consistent and automated, reducing drift between business units and Regions. CloudFormation Guard is most effective when used as a preventive control in the pipeline, not only after deployment. By running Guard rules during build or pre-deploy stages, the organization can enforce mandatory security and observability configurations and block noncompliant changes before they reach production. This supports consistent governance while still enabling business units to deploy quickly. Option A performs compliance validation after deployment, which allows policy violations to be deployed first and remediated later. Option C provides governed provisioning but requiring console-based deployment reduces automation and can slow standardized CI/CD adoption; it also adds an additional governance layer that is not required to meet the stated needs. Option D is not enforceable and does not provide reusable, versioned, governed components. Therefore, Option B provides the strongest, most scalable, and most consistently governed approach for standardized GenAI deployments across business units.", "explanation_zh": "选项B最佳地满足了跨多个业务部门实现可重用、有版本控制且一致治理的组件的要求，因为它通过基础设施即代码加上部署前的自动化合规强制实施\"平台级标准化\"。标准化的CloudFormation模板为安全控制（身份、网络边界、加密）、可观测性实践（指标、日志、追踪）和RAG部署模式（Knowledge Base集成、摄取管道、检索控制）提供了可重用的构建块。这符合AWS通过可重复模板（而非临时实施）来操作化良好架构模式的指引。中央存储库支持模板的版本控制、变更审查和治理，满足了\"有版本控制\"和\"可重用\"的要求，并为批准的架构提供了单一事实来源。集成CI/CD管道可确保部署一致且自动化，减少了业务部门和区域之间的漂移。CloudFormation Guard在作为管道中的预防性控制时最为有效，而不仅仅是在部署后。通过在构建或预部署阶段运行Guard规则，组织可以强制实施强制性的安全和可观测性配置，并在不合规的变更到达生产环境之前阻止它们。这支持一致治理，同时仍然允许业务部门快速部署。选项A在部署后执行合规验证，这允许策略违规先部署然后再修复。选项C提供了受控的配置，但要求基于控制台的部署会降低自动化程度，并可能减缓标准化的CI/CD采用；它还增加了一个并非满足所述需求所必需的额外治理层。选项D不可强制执行，也不提供可重用、有版本控制且受治理的组件。因此，选项B提供了最强的、最符合AWS理念的解决方案。"}, {"id": 21, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is designing a canary deployment strategy for a payment processing API. The system must \nsupport automated gradual traffic shifting between multiple Amazon Bedrock models based on real-time \ninference metrics, historical traffic patterns, and service health. The solution must be able to gradually \nincrease traffic to new model versions. The system must increase traffic if metrics remain healthy and \ndecrease traffic if the performance degrades below acceptable thresholds. The company needs to comprehensively monitor inference latency and error rates during the deployment \nphase. The company must also be able to halt deployments and revert to a previous model version without any \nmanual intervention. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在为支付处理API设计金丝雀部署策略。系统必须支持基于实时推理指标、历史流量模式和服务健康状况，在多个Amazon Bedrock模型之间自动逐步转移流量。该解决方案必须能够逐步增加新模型版本的流量。如果指标保持健康，系统必须增加流量；如果性能低于可接受阈值，则减少流量。公司需要在部署阶段全面监控推理延迟和错误率。公司还必须能够在不进行任何手动干预的情况下停止部署并回滚到之前的模型版本。哪种解决方案能满足这些要求？", "options_en": ["Use Amazon Bedrock with provisioned throughput to host model versions. Configure an Amazon \nEventBridge rule to invoke an AWS Step Functions workflow when a new model version is released. \nConfigure the workflow to shift traffic in stages, wait for a specified time period, and invoke an AWS \nLambda function to check Amazon CloudWatch performance metrics. Configure the workflow to \nincrease traffic if metrics meet thresholds and to trigger a traffic rollback if performance metrics fall \nbelow thresholds.", "Use AWS Lambda functions to invoke various Amazon Bedrock model versions. Use an Amazon API \nGateway HTTP API with stage variables and weighted routing to shift traffic gradually. Use Amazon \nCloudWatch to monitor performance. Use external logic to adjust traffic and roll back if performance \nfalls below thresholds.", "Use Amazon SageMaker AI endpoint variants to represent multiple Amazon Bedrock model versions. \nUse variant weights to shift traffic. Use Amazon CloudWatch and SageMaker Model Monitor to trigger \nrollbacks. Use EventBridge to roll back deployments if an anomaly is detected.", "Use Amazon OpenSearch Service to track inference logs. Configure OpenSearch Service to invoke an \nAWS Systems Manager Automation runbook to update Amazon Bedrock model endpoints to shift \ntraffic based on inference logs."], "options_zh": ["使用带有预配吞吐量的Amazon Bedrock来托管模型版本。配置Amazon EventBridge规则，在新模型版本发布时调用AWS Step Functions工作流。配置工作流分阶段转移流量，等待指定的时间周期，并调用AWS Lambda函数检查Amazon CloudWatch性能指标。配置工作流在指标满足阈值时增加流量，并在性能指标低于阈值时触发流量回滚。", "使用AWS Lambda函数调用各种Amazon Bedrock模型版本。使用Amazon API Gateway HTTP API的阶段变量和加权路由逐步转移流量。使用Amazon CloudWatch监控性能。使用外部逻辑调整流量，并在性能低于阈值时回滚。", "使用Amazon SageMaker AI端点变体来表示多个Amazon Bedrock模型版本。使用变体权重转移流量。使用Amazon CloudWatch和SageMaker Model Monitor触发回滚。使用EventBridge在检测到异常时回滚部署。", "使用Amazon OpenSearch Service跟踪推理日志。配置OpenSearch Service调用AWS Systems Manager Automation运行手册，根据推理日志更新Amazon Bedrock模型端点以转移流量。"], "a": "A", "explanation_en": "Option A is the most complete solution because it provides a fully automated canary strategy with staged traffic shifts, metric-based decisioning, and automatic rollback, all using managed AWS services. The requirement emphasizes automation, health-based traffic progression, and zero manual intervention to revert if performance degrades. AWS Step Functions is well suited for orchestrating controlled deployment workflows with deterministic stages, waits, and conditional branches. By shifting traffic in stages and pausing for observation windows, the system can evaluate real-time inference latency and error rates before promoting more traffic to the new model version. Amazon CloudWatch provides the necessary real-time metrics and alarms for latency and error monitoring. Invoking a Lambda function to evaluate CloudWatch metrics enables dynamic logic: increase traffic if thresholds remain healthy, reduce traffic or roll back if error rates rise or latency exceeds limits. Step Functions can halt the deployment by stopping progression or triggering rollback steps immediately, meeting the requirement for automated revert without human action. Amazon EventBridge provides reliable automation triggers when a new model version is released, ensuring the deployment process is event-driven and repeatable. Option B depends on “external logic,” which introduces operational risk and does not guarantee automatic rollback without custom systems. Option C incorrectly uses SageMaker endpoint variants to represent Bedrock model versions, which is not the intended integration model. Option D is overly indirect and operationally complex, using log pipelines and automation runbooks instead of direct metric-based traffic control. Therefore, Option A best meets the requirements for automated gradual traffic shifting, real-time monitoring, and automatic rollback for Amazon Bedrock model deployments in a canary strategy.", "explanation_zh": "选项A是最完整的解决方案，因为它提供了完全自动化的金丝雀策略，包括分阶段流量转移、基于指标的决策和自动回滚，全部使用托管的AWS服务。要求强调自动化、基于健康状况的流量推进以及在性能下降时无需人工干预即可回滚。AWS Step Functions非常适合编排具有确定性阶段、等待和条件分支的受控部署工作流。通过分阶段转移流量并暂停观察窗口，系统可以在将更多流量推送到新模型版本之前评估实时推理延迟和错误率。Amazon CloudWatch提供必要的实时指标和告警，用于延迟和错误监控。调用Lambda函数评估CloudWatch指标可实现动态逻辑：如果阈值保持健康则增加流量，如果错误率上升或延迟超过限制则减少流量或回滚。Step Functions可以通过停止推进或立即触发回滚步骤来暂停部署，满足无需人工操作即可自动回滚的要求。Amazon EventBridge在新模型版本发布时提供可靠的自动化触发器，确保部署过程是事件驱动且可重复的。选项B依赖于“外部逻辑”，这会带来操作风险，并且无法保证在没有自定义系统的情况下自动回滚。选项C错误地使用SageMaker端点变体来表示Bedrock模型版本，这不是预期的集成模式。选项D过于间接且操作复杂，使用日志管道和自动化运行手册而不是直接的基于指标的流量控制。因此，选项A最能满足金丝雀策略中Amazon Bedrock模型部署的自动逐步流量转移、实时监控和自动回滚的要求。"}, {"id": 22, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is designing a solution that uses foundation models (FMs) to support multiple AI workloads. \nSome FMs must be invoked on demand and in real time. Other FMs require consistent high-throughput access \nfor batch processing. The solution must support hybrid deployment patterns and run workloads across cloud infrastructure and on-\npremises infrastructure to comply with data residency and compliance requirements. Which combination of steps will meet these requirements? (Select TWO.) A. B. C. D. E.", "body_zh": "一家公司正在设计一个使用基础模型(FM)支持多个AI工作负载的解决方案。某些FM必须按需实时调用。其他FM需要一致的高吞吐量访问以进行批处理。该解决方案必须支持混合部署模式，并在云基础设施和本地基础设施上运行工作负载，以遵守数据驻留和合规性要求。哪组步骤能满足这些要求？（选择两项）", "options_en": ["Use AWS Lambda to orchestrate low-latency FM inference by invoking FMs hosted on Amazon \nSageMaker AI asynchronous endpoints.", "Configure provisioned throughput in Amazon Bedrock to ensure consistent performance for high-\nvolume workloads.", "Deploy FMs to Amazon SageMaker AI endpoints with support for edge deployment by using Amazon \nSageMaker Neo. Orchestrate the FMs by using AWS Lambda to support hybrid deployment.", "Use Amazon Bedrock with auto-scaling to handle unpredictable traffic surges.", "Use Amazon SageMaker JumpStart to host and invoke the FMs."], "options_zh": ["使用AWS Lambda通过调用托管在Amazon SageMaker AI异步端点上的FM来编排低延迟FM推理。", "在Amazon Bedrock中配置预配吞吐量，以确保高容量工作负载的一致性能。", "将FM部署到Amazon SageMaker AI端点，并通过Amazon SageMaker Neo支持边缘部署。使用AWS Lambda编排FM以支持混合部署。", "使用带有自动扩缩的Amazon Bedrock来处理不可预测的流量激增。", "使用Amazon SageMaker JumpStart托管和调用FM。"], "a": "B C", "explanation_en": "The correct combination is B and C because together they address both workload diversity and hybrid deployment requirements with minimal custom engineering. Option B provides consistent, high-throughput access by configuring provisioned throughput in Amazon Bedrock. Provisioned throughput guarantees predictable capacity and performance, which is essential for batch processing workloads that require sustained inference rates. This eliminates cold starts and throttling concerns that can occur with purely on-demand usage, making it well suited for high-volume enterprise workloads. Option C enables hybrid deployment across cloud and on-premises environments by deploying foundation models to Amazon SageMaker AI endpoints and using Amazon SageMaker Neo for edge and on-premises optimization. SageMaker Neo compiles models for target hardware, allowing inference to run efficiently outside the AWS cloud while still using AWS-managed tooling. Orchestrating these deployments with AWS Lambda allows consistent invocation patterns across environments. Option A uses asynchronous endpoints, which are not suitable for real-time, low-latency inference. Option D addresses scaling but does not support on-premises or hybrid deployment. Option E simplifies model onboarding but does not address hybrid execution or guaranteed throughput. Therefore, Options B and C together provide real-time and batch support, predictable performance, and true hybrid deployment while minimizing operational overhead.", "explanation_zh": "正确的组合是B和C，因为它们共同以最少的自定义工程工作满足工作负载多样性和混合部署要求。选项B通过在Amazon Bedrock中配置预配吞吐量来提供一致的高吞吐量访问。预配吞吐量保证了可预测的容量和性能，这对于需要持续推理速率的批处理工作负载至关重要。这消除了纯按需使用可能出现的冷启动和节流问题，使其非常适合高容量企业工作负载。选项C通过将基础模型部署到Amazon SageMaker AI端点并使用Amazon SageMaker Neo进行边缘和本地优化，实现了跨云和本地环境的混合部署。SageMaker Neo为目标硬件编译模型，允许在AWS云之外高效运行推理，同时仍使用AWS管理的工具。使用AWS Lambda编排这些部署可以在不同环境中实现一致的调用模式。选项A使用异步端点，不适合实时低延迟推理。选项D解决了扩缩问题，但不支持本地或混合部署。选项E简化了模型入门，但没有解决混合执行或保证吞吐量的问题。因此，选项B和C共同提供实时和批处理支持、可预测的性能以及真正的混合部署，同时最大限度地减少了运营开销。"}, {"id": 23, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company has set up Amazon Q Developer Pro licenses for all developers at the company. The company \nmaintains a list of approved resources that developers must use when developing applications. The approved \nresources include internal libraries, proprietary algorithmic techniques, and sample code with approved \nstyling. A new team of developers is using Amazon Q Developer to develop a new Java-based application. The \ncompany must ensure that the new developer team uses the company’s approved resources. The company \ndoes not want to make project-level modifications. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司已为所有开发人员设置了Amazon Q Developer Pro许可证。该公司维护一份已批准资源列表，开发人员在开发应用程序时必须使用这些资源。已批准资源包括内部库、专有算法技术和具有已批准样式的示例代码。一个新开发团队正在使用Amazon Q Developer开发一个新的基于Java的应用程序。公司必须确保新开发团队使用公司已批准的资源。公司不希望进行项目级别修改。哪种解决方案能满足这些要求？", "options_en": ["Create a Git repository that contains all of the approved internal libraries, algorithms, and code samples. \nInclude this Git repository in the application project locally as part of the workspace. Ensure that the \ndevelopers use the workspace context to retrieve suggestions from the Git repository.", "In the project root folder, create a folder named amazonq/rules. Add the approved internal libraries, \nalgorithms, and code samples to the folder.", "Create a folder in the application project named rules. Store the guidelines and code in the folder for \nAmazon Q Developer to reference for code suggestions.", "Create an Amazon Q Developer customization that includes the approved data sources. Ensure that the \ndevelopers use the customization to develop the application."], "options_zh": ["创建一个包含所有已批准内部库、算法和代码示例的Git仓库。将此Git仓库作为工作空间的一部分本地包含在应用程序项目中。确保开发人员使用工作空间上下文从Git仓库获取建议。", "在项目根文件夹中，创建一个名为amazonq/rules的文件夹。将已批准的内部库、算法和代码示例添加到该文件夹中。", "在应用程序项目中创建一个名为rules的文件夹。将指南和代码存储在该文件夹中，供Amazon Q Developer参考以获取代码建议。", "创建一个包含已批准数据源的Amazon Q Developer定制项。确保开发人员使用该定制项来开发应用程序。"], "a": "D", "explanation_en": "Option D is the correct solution because Amazon Q Developer customizations are designed to incorporate organization-approved knowledge and coding guidance without requiring per-project changes. A customization can point Amazon Q Developer to curated internal sources such as approved libraries, coding standards, architectural patterns, and proprietary techniques. This allows the assistant’s suggestions to align with company policies and preferred implementations consistently across teams and repositories. The key requirement is that the company does not want to make project-level modifications. Options A, B, and C all require adding files or repositories into the project workspace, which directly violates this constraint. They also rely on developer behavior to “use workspace context,” which is harder to enforce and can lead to inconsistent adherence to standards. With a customization, the organization centrally manages and updates approved resources. This reduces operational overhead because updates to libraries, patterns, or guidelines propagate automatically to developers using the customization, without requiring changes to each project. This is especially valuable for a new team, where consistent enforcement of approved practices is important to reduce compliance risk, security issues, and inconsistent code style. Additionally, customizations support governance by allowing the company to standardize how Amazon Q Developer responds, ensuring that suggestions reflect approved internal content rather than generic public patterns. Therefore, Option D best satisfies the requirement for centralized enforcement of approved resources with minimal ongoing management and no project-level modifications.", "explanation_zh": "选项D是正确的解决方案，因为Amazon Q Developer定制项旨在整合组织批准的know-how和编码指导，而无需对每个项目进行更改。定制项可以将Amazon Q Developer指向精选的内部来源，例如已批准的库、编码标准、架构模式和专有技术。这使得助手的建议能够与公司政策及首选实现保持一致，并在团队和仓库之间保持一致。关键要求是公司不希望进行项目级别修改。选项A、B和C都需要将文件或仓库添加到项目工作空间中，这直接违反了这一约束。它们还依赖于开发人员“使用工作空间上下文”的行为，这更难强制实施，并可能导致标准遵守不一致。通过定制项，组织可以集中管理和更新已批准资源。这减少了运营开销，因为对库、模式或指南的更新会自动传播给使用该定制项的开发人员，而无需更改每个项目。这对于新团队尤其有价值，因为持续执行已批准实践对于降低合规风险、安全问题和代码风格不一致非常重要。此外，定制项支持治理，允许公司标准化Amazon Q Developer的响应方式，确保建议反映已批准的内部内容而非通用公共模式。因此，选项D最能满足集中强制使用已批准资源且无需项目级别修改和最少持续管理的要求。"}, {"id": 24, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company wants to select a new FM for its AI assistant. A GenAI developer needs to generate evaluation \nreports to help a data scientist assess the quality and safety of various foundation models FMs. The data \nscientist provides the GenAI developer with sample prompts for evaluation. The GenAI developer wants to \nuse Amazon Bedrock to automate report generation and evaluation. Which solution will meet this requirement? A. B. C. D.", "body_zh": "一家公司希望为其AI助手选择一个新的FM。一位GenAI开发人员需要生成评估报告，以帮助数据科学家评估各种基础模型(FM)的质量和安全性。数据科学家向GenAI开发人员提供了用于评估的示例提示。GenAI开发人员希望使用Amazon Bedrock自动化报告生成和评估。哪种解决方案能满足这一要求？", "options_en": ["Combine the sample prompts into a single JSON document. Create an Amazon Bedrock knowledge \nbase with the document. Write a prompt that asks the FM to generate a response to each sample prompt. \nUse the RetrieveAndGenerate API to generate a report for each model.", "Combine the sample prompts into a single JSONL document. Store the document in an Amazon S3 \nbucket. Create an Amazon Bedrock evaluation job that uses a judge model. Specify the S3 location as \ninput and a different S3 location as output. Run an evaluation job for each FM and select the FM as the \ngenerator.", "Combine the sample prompts into a single JSONL document. Store the document in an Amazon S3 \nbucket. Create an Amazon Bedrock evaluation job that uses a judge model. Specify the S3 location as \ninput and Amazon QuickSight as output. Run an evaluation job for each FM and select the FM as the \nevaluator.", "Combine the sample prompts into a single JSON document. Create an Amazon Bedrock knowledge \nbase from the document. Create an Amazon Bedrock evaluation job that uses the retrieval and response \ngeneration evaluation type. Specify an Amazon S3 bucket as the output. Run an evaluation job for each \nFM."], "options_zh": ["将sample prompts合并到一个JSON文档中。创建一个包含该文档的Amazon Bedrock知识库。编写一个提示，要求FM为每个sample prompt生成响应。使用RetrieveAndGenerate API为每个模型生成报告。", "将sample prompts合并到一个JSONL文档中。将文档存储在Amazon S3存储桶中。创建一个使用评估模型的Amazon Bedrock评估作业。将S3位置指定为输入，将另一个S3位置指定为输出。为每个FM运行评估作业，并将该FM选为生成器。", "将sample prompts合并到一个JSONL文档中。将文档存储在Amazon S3存储桶中。创建一个使用评估模型的Amazon Bedrock评估作业。将S3位置指定为输入，将Amazon QuickSight指定为输出。为每个FM运行评估作业，并将该FM选为评估器。", "将sample prompts合并到一个JSON文档中。从该文档创建一个Amazon Bedrock知识库。创建一个使用检索和响应生成评估类型的Amazon Bedrock评估作业。将Amazon S3存储桶指定为输出。为每个FM运行评估作业。"], "a": "B", "explanation_en": "Option B is correct because it uses the managed evaluation capability in Amazon Bedrock that is intended specifically for comparing foundation models using a consistent prompt set and producing structured results with minimal custom tooling. In a Bedrock evaluation workflow, you provide an input dataset of prompts, typically in JSON Lines format so each line represents one evaluation record. Storing the JSONL file in Amazon S3 allows Bedrock to read the dataset at scale and write standardized evaluation outputs back to S3 for downstream analysis, sharing, and retention. The key requirement is to assess both quality and safety across multiple models. A Bedrock evaluation job can use a judge model to score the generated outputs against defined criteria. This approach supports repeatable, apples-to-apples comparisons because the same judge model and scoring rubric can be applied to every candidate foundation model. The candidate models are configured as generators, meaning each evaluation job run uses one selected FM to produce answers for the same prompt set, and the judge model evaluates those answers. That matches the requirement to generate evaluation reports that help a data scientist select the best FM. Option A does not use Bedrock evaluation jobs, and a knowledge base plus RetrieveAndGenerate is a RAG pattern, not an evaluation framework. It would produce responses but not standardized scoring and reporting suitable for model selection. Option C is incorrect because Bedrock evaluation outputs are delivered to S3, not directly to a BI destination, and selecting the candidate FM as the evaluator conflicts with the intended pattern of using a stable judge model. Option D misuses knowledge bases and retrieval evaluation types when the requirement is prompt-based model assessment rather than evaluating retrieval quality.", "explanation_zh": "选项B是正确的，因为它使用了Amazon Bedrock中的托管评估功能，该功能专门用于使用一致的提示集比较基础模型，并以最少的自定义工具生成结构化结果。在Bedrock评估工作流中，您提供提示的输入数据集，通常使用JSON Lines格式，以便每行代表一条评估记录。将JSONL文件存储在Amazon S3中允许Bedrock大规模读取数据集，并将标准化评估输出写回S3，以供下游分析、共享和保留。关键要求是评估多个模型的质量和安全性。Bedrock评估作业可以使用评估模型根据定义的标准对生成的输出进行评分。这种方法支持可重复的同类比较，因为相同的评估模型和评分标准可以应用于每个候选基础模型。候选模型配置为生成器，这意味着每次评估作业运行使用一个选定的FM为相同的提示集生成答案，然后评估模型评估这些答案。这符合生成评估报告以帮助数据科学家选择最佳FM的要求。选项A没有使用Bedrock评估作业，知识库加RetrieveAndGenerate是一种RAG模式，而不是评估框架。它会产生响应，但不会产生适合模型选择的标准化评分和报告。选项C不正确，因为Bedrock评估输出会传送到S3，而不是直接传送到BI目标，并且选择候选FM作为评估器与使用稳定评估模型的预期模式相冲突。选项D误用了知识库和检索评估类型，而要求是基于提示的模型评估，而非评估检索质量。"}, {"id": 25, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company runs a Retrieval Augmented Generation (RAG) application that uses Amazon Bedrock \nKnowledge Bases to perform regulatory compliance queries. The application uses the \nRetrieveAndGenerateStream API. The application retrieves relevant documents from a knowledge base that \ncontains more than 50,000 regulatory documents, legal precedents, and policy updates. The RAG application is producing suboptimal responses because the initial retrieval often returns \nsemantically similar but contextually irrelevant documents. The poor responses are causing model \nhallucinations and incorrect regulatory guidance. The company needs to improve the performance of the RAG \napplication so it returns more relevant documents. Which solution will meet this requirement with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家公司运行一个检索增强生成(RAG)应用程序，该程序使用Amazon Bedrock Knowledge Bases执行法规合规查询。该应用程序使用RetrieveAndGenerateStream API。该应用程序从包含超过50,000份法规文件、法律先例和政策更新的知识库中检索相关文档。该RAG应用程序产生次优响应，因为初始检索经常返回语义相似但上下文不相关的文档。糟糕的响应导致模型幻觉和不正确的法规指导。公司需要改进RAG应用程序的性能，以返回更相关的文档。哪种解决方案以最少的运营开销满足这一要求？", "options_en": ["Deploy an Amazon SageMaker endpoint to run a fine-tuned ranking model. Use an Amazon API \nGateway REST API to route requests. Configure the application to make requests through the REST \nAPI to rerank the results.", "Use Amazon Comprehend to classify documents and apply relevance scores. Integrate the RAG \napplication’s reranking process with Amazon Textract to run document analysis. Use Amazon Neptune \nto perform graph-based relevance calculations.", "Implement a retrieval pipeline that uses the Amazon Bedrock Knowledge Bases Retrieve API to \nperform initial document retrieval. Call the Amazon Bedrock Rerank API to rerank the results. Invoke \nthe InvokeModelWithResponseStream operation to generate responses.", "Use the latest Amazon reranker model through the reranking configuration within Amazon Bedrock \nKnowledge Bases. Use the model to improve document relevance scoring and to reorder results based \non contextual assessments."], "options_zh": ["部署Amazon SageMaker端点以运行微调后的排序模型。使用Amazon API Gateway REST API路由请求。配置应用程序通过REST API发出请求以对结果重新排序。", "使用Amazon Comprehend对文档进行分类并应用相关性分数。将RAG应用程序的重新排序过程与Amazon Textract集成以运行文档分析。使用Amazon Neptune执行基于图的相关性计算。", "实现一个检索管道，使用Amazon Bedrock Knowledge Bases Retrieve API执行初始文档检索。调用Amazon Bedrock Rerank API对结果重新排序。调用InvokeModelWithResponseStream操作生成响应。", "通过Amazon Bedrock Knowledge Bases中的重新排序配置使用最新的Amazon重排序模型。使用该模型改进文档相关性评分，并根据上下文评估重新排序结果。"], "a": "D", "explanation_en": "Option D is the correct solution because Amazon Bedrock Knowledge Bases natively support reranking by using Amazon-managed reranker models, which are specifically designed to improve contextual relevance after the initial vector retrieval step. This approach directly addresses the root cause of the issue: semantically similar but contextually irrelevant documents being passed to the foundation model. By enabling the reranking configuration within Amazon Bedrock Knowledge Bases, the application can automatically reorder retrieved documents based on deeper contextual understanding, such as regulatory scope, legal applicability, and semantic intent. This significantly improves retrieval precision, which reduces hallucinations and improves the factual accuracy of generated regulatory guidance. Option D requires no additional infrastructure, no custom orchestration logic, and no separate model hosting. The reranking is fully managed by Amazon Bedrock and integrates seamlessly with the existing RetrieveAndGenerateStream workflow. This makes it the lowest operational overhead solution. Option A introduces operational complexity by requiring a custom SageMaker endpoint, API Gateway routing, and model lifecycle management. Option B combines multiple unrelated services and introduces significant complexity without being purpose-built for RAG relevance ranking. Option C improves relevance but requires explicitly calling the Rerank API and modifying the application pipeline, which increases operational and integration effort compared to built-in reranking. Therefore, Option D provides the most efficient, scalable, and AWS-recommended method to improve RAG retrieval quality while minimizing operational burden.", "explanation_zh": "选项D是正确的解决方案，因为Amazon Bedrock Knowledge Bases原生支持使用Amazon管理的重排序模型进行重新排序，这些模型专门设计用于在初始向量检索步骤之后改进上下文相关性。这种方法直接解决了问题的根本原因：语义相似但上下文不相关的文档被传递给基础模型。通过在Amazon Bedrock Knowledge Bases中启用重新排序配置，应用程序可以基于更深入的上下文理解（例如法规范围、法律适用性和语义意图）自动重新排序检索到的文档。这显著提高了检索精度，从而减少了幻觉并提高了生成的法规指导的事实准确性。选项D不需要额外的基础设施、自定义编排逻辑或单独的模型托管。重新排序完全由Amazon Bedrock管理，并与现有的RetrieveAndGenerateStream工作流无缝集成。这使其成为运营开销最低的解决方案。选项A通过需要自定义SageMaker端点、API Gateway路由和模型生命周期管理引入了运营复杂性。选项B组合了多个不相关的服务，并引入了显著的复杂性，但并非专门为RAG相关性排序而设计。选项C改进了相关性，但需要显式调用Rerank API并修改应用程序管道，与内置重新排序相比增加了运营和集成工作。因此，选项D提供了最有效、符合AWS最佳实践的方法来改进RAG检索质量，同时最大限度地减少运营负担。"}, {"id": 26, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A healthcare company is using Amazon Bedrock to develop a real-time patient care AI assistant to respond to \nqueries for separate departments that handle clinical inquiries, insurance verification, appointment scheduling, \nand insurance claims. The company wants to use a multi-agent architecture. The company must ensure that the AI assistant is scalable and can onboard new features for patients. The AI \nassistant must be able to handle thousands of parallel patient interactions. The company must ensure that \npatients receive appropriate domain-specific responses to queries. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗保健公司正在使用Amazon Bedrock开发一个实时患者护理AI助手，以响应来自不同科室的查询，这些科室处理临床咨询、保险验证、预约安排和保险理赔。公司希望采用多智能体架构。公司必须确保AI助手具有可扩展性，并且能够为患者上线新功能。AI助手必须能够处理数千个并行患者交互。公司必须确保患者能收到针对特定领域的适当查询响应。哪种解决方案能满足这些要求？", "options_en": ["Isolate data for each agent by using separate knowledge bases. Use IAM filtering to control access to \neach knowledge base. Deploy a supervisor agent to perform natural language intent classification on \npatient inquiries. Configure the supervisor agent to route queries to specialized collaborator agents to \nrespond to department-specific queries. Configure each specialized collaborator agent to use Retrieval \nAugmented Generation (RAG) with the agent's department-specific knowledge base.", "Create a separate supervisor agent for each department. Configure individual collaborator agents to \nperform natural language intent classification for each specialty domain within each department. \nIntegrate each collaborator agent with department-specific knowledge bases only. Implement manual \nhandoff processes between the supervisor agents.", "Isolate data for each department in separate knowledge bases. Use IAM filtering to control access to \neach knowledge base. Deploy a single general-purpose agent. Configure multiple action groups within \nthe general-purpose agent to perform specific department functions. Implement rule-based routing logic \nin the general-purpose agent instructions.", "Implement multiple independent supervisor agents that run in parallel to respond to patient inquiries for \neach department. Configure multiple collaborator agents for each supervisor agent. Integrate all agents \nwith the same knowledge base. Use external routing logic to merge responses from multiple supervisor \nagents."], "options_zh": ["通过使用独立的知识库隔离每个智能体的数据。使用IAM过滤控制对每个知识库的访问。部署一个监督智能体对患者询问执行自然语言意图分类。配置监督智能体将查询路由到专门的协作者智能体，以响应特定科室的查询。配置每个专门的协作者智能体使用检索增强生成(RAG)与智能体所属科室的知识库。", "为每个科室创建一个独立的监督智能体。配置单独的协作者智能体对每个科室内的各个专业领域执行自然语言意图分类。仅将每个协作者智能体与相应科室的知识库集成。在监督智能体之间实施手动交接流程。", "通过独立的知识库隔离每个科室的数据。使用IAM过滤控制对每个知识库的访问。部署一个通用智能体。在通用智能体中配置多个操作组以执行特定的科室功能。在通用智能体指令中实现基于规则的路由逻辑。", "实施多个独立的监督智能体，并行运行以响应每个科室的患者询问。为每个监督智能体配置多个协作者智能体。将所有智能体与同一个知识库集成。使用外部路由逻辑合并来自多个监督智能体的响应。"], "a": "A", "explanation_en": "Option best meets the requirements because it applies an AWS-aligned multi-agent pattern that cleanly A separates responsibilities: a performs intent classification and orchestration, while supervisor agent handle domain-specific tasks using the right knowledge sources. This specialized collaborator agents structure is well suited for healthcare workflows where clinical questions, scheduling, and insurance processes require different policies, terminology, and data access boundaries. The requirement for is addressed by routing each user query to a appropriate domain-specific responses department-focused collaborator agent that is grounded with its own . department-specific knowledge base Using Retrieval Augmented Generation with the correct knowledge base improves factual alignment and reduces cross-department leakage (for example, avoiding claims content in a clinical answer). It also supports better prompt grounding and more consistent tone and constraints per department. The requirement to maps to using separate knowledge bases per agent and enforcing access isolate data through , ensuring that each agent can retrieve only from the authorized datasets. This is IAM controls important for minimizing unintended exposure of sensitive or irrelevant departmental data and supports governance and compliance needs. For , this architecture minimizes contention and scalability and thousands of parallel interactions bottlenecks. Each collaborator agent can scale independently because requests are distributed across multiple agents and multiple retrieval backends. Operationally, onboarding new features is also simpler: the company can add a new collaborator agent (for example, “billing disputes” or “pharmacy refills”) with its own knowledge base and policies without redesigning the entire assistant. Option introduces unnecessary complexity with multiple supervisors and manual handoffs. Option B C overloads a single agent with broad instructions and rule-based routing, which increases prompt complexity and reduces maintainability as features grow. Option creates high operational complexity and risks D inconsistent outputs when merging responses from parallel supervisors, and it weakens data isolation by using a shared knowledge base across agents.", "explanation_zh": "选项A最能满足要求，因为它采用了符合AWS最佳实践的多智能体模式，清晰地分离了职责：监督智能体执行意图分类和编排，专门的协作者智能体使用正确的知识源处理领域特定任务。这种结构非常适合医疗保健工作流，其中临床问题、排程和保险流程需要不同的策略、术语和数据访问边界。针对特定领域的响应需求通过将每个用户查询路由到拥有各自领域专有知识库的协作者智能体来实现。使用检索增强生成配合正确的知识库提高了事实对齐度，并减少了跨科室信息泄露。它还支持更好的提示依据和每个科室更一致的语气和约束。数据隔离要求通过为每个智能体使用独立的知识库和IAM控制来强制访问，确保每个智能体只能从授权的数据集中检索。这对于最小化敏感或不相关科室数据的意外暴露非常重要，并支持治理和合规需求。对于可扩展性和数千个并行交互，此架构最大限度地减少了争用和瓶颈。每个协作者智能体可以独立扩缩，因为请求分布在多个智能体和多个检索后端之间。在运营上，添加新功能也更简单：公司可以添加新的协作者智能体（例如“账单争议”或“药房续药”）及其知识库和策略，而无需重新设计整个助手。选项B引入了不必要的复杂性和手动交接。选项C使单个智能体负载过重，指令庞杂且路由逻辑基于规则，难以治理和扩展。选项D将所有科室的数据混合到一个知识库中，增加了错误响应的风险。因此，选项A最好地满足了可扩展性、正确性和多智能体入职要求。"}, {"id": 27, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A media company must use Amazon Bedrock to implement a robust governance process for AI-generated \ncontent. The company needs to manage hundreds of prompt templates. Multiple teams use the templates \nacross multiple AWS Regions to generate content. The solution must provide version control with approval \nworkflows that include notifications for pending reviews. The solution must also provide detailed audit trails \nthat document prompt activities and consistent prompt parameterization to enforce quality standards. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家媒体公司必须使用Amazon Bedrock实施一个强大的AI生成内容治理流程。该公司需要管理数百个提示模板。多个团队在多个AWS区域使用这些模板生成内容。该解决方案必须提供带有审批工作流的版本控制，包括待审核通知。该解决方案还必须提供详细的审计跟踪，记录提示活动以及一致的提示参数化，以强制执行质量标准。哪种解决方案能满足这些要求？", "options_en": ["Configure Amazon Bedrock Studio prompt templates. Use Amazon CloudWatch dashboards to display \nprompt usage metrics. Store approval status in Amazon DynamoDB. Use AWS Lambda functions to \nenforce approvals.", "Use Amazon Bedrock Prompt Management to implement version control. Configure AWS CloudTrail \nfor audit logging. Use AWS Identity and Access Management policies to control approval permissions. \nCreate parameterized prompt templates by specifying variables.", "Use AWS Step Functions to create an approval workflow. Store prompts in Amazon S3. Use tags to \nimplement version control. Use Amazon EventBridge to send notifications.", "Deploy Amazon SageMaker Canvas with prompt templates stored in Amazon S3. Use AWS \nCloudFormation for version control. Use AWS Config to enforce approval policies."], "options_zh": ["配置Amazon Bedrock Studio提示模板。使用Amazon CloudWatch仪表板显示提示使用指标。将审批状态存储在Amazon DynamoDB中。使用AWS Lambda函数强制审批。", "使用Amazon Bedrock Prompt Management实施版本控制。配置AWS CloudTrail进行审计日志记录。使用AWS Identity and Access Management策略控制审批权限。通过指定变量创建参数化提示模板。", "使用AWS Step Functions创建审批工作流。将提示存储在Amazon S3中。使用标签实施版本控制。使用Amazon EventBridge发送通知。", "部署Amazon SageMaker Canvas，将提示模板存储在Amazon S3中。使用AWS CloudFormation进行版本控制。使用AWS Config强制审批策略。"], "a": "B", "explanation_en": "Option B is the correct solution because Amazon Bedrock Prompt Management is purpose-built to manage, govern, and standardize prompt usage at scale across teams and Regions. It provides native version control, allowing teams to track prompt changes over time and ensure that only approved versions are used in production workflows. Prompt Management supports approval workflows that align with enterprise governance requirements. Approval permissions can be enforced through IAM policies, ensuring that only authorized reviewers can approve or publish prompt versions. This removes the need for custom workflow engines or external storage systems, significantly reducing operational overhead. Parameterized prompt templates enable consistent prompt structure while allowing controlled variation through defined variables. This ensures consistent quality standards and reduces prompt drift, which is critical when hundreds of prompts are reused across multiple applications and teams. AWS CloudTrail integrates natively with Amazon Bedrock to provide immutable audit logs for prompt creation, updates, approvals, and usage. These detailed audit trails satisfy compliance requirements and allow security and governance teams to trace prompt activity across Regions and users. Option A requires significant custom development to coordinate approvals and maintain state. Option C relies on general-purpose workflow services and manual versioning mechanisms that are error-prone and difficult to scale. Option D uses services not designed for large-scale GenAI prompt governance and introduces unnecessary complexity. Therefore, Option B best meets the requirements for scalable, auditable, and low-overhead governance of AI- generated content using Amazon Bedrock.", "explanation_zh": "选项B是正确的解决方案，因为Amazon Bedrock Prompt Management专为跨团队和区域大规模管理、治理和标准化提示使用而构建。它提供原生版本控制，允许团队随时间跟踪提示更改，并确保只有已批准的版本用于生产工作流。Prompt Management支持符合企业治理要求的审批工作流。审批权限可以通过IAM策略强制执行，确保只有授权的审核者才能审批或发布提示版本。这消除了对自定义工作流引擎或外部存储系统的需求，显著减少了运营开销。参数化提示模板通过定义的变量实现受控变化，同时保持一致的提示结构。这确保了稳定的质量标准并减少了提示漂移，对于跨多个应用程序和团队重复使用的数百个提示至关重要。AWS CloudTrail与Amazon Bedrock原生集成，为提示创建、更新、审批和使用提供不可变的审计日志。这些详细的审计跟踪满足合规要求，并允许安全和治理团队跨区域和用户追踪提示活动。选项A需要大量的自定义开发来协调审批和维护状态。选项C依赖通用工作流服务和手动版本管理机制，容易出错且难以扩展。选项D使用的服务并非为大规模GenAI提示治理而设计，并引入了不必要的复杂性。因此，选项B最适合使用Amazon Bedrock对AI生成内容进行可扩展、可审计且低开销的治理要求。"}, {"id": 28, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company is building a legal research AI assistant that uses Amazon Bedrock with an Anthropic Claude \nfoundation model (FM). The AI assistant must retrieve highly relevant case law documents to augment the \nFM’s responses. The AI assistant must identify semantic relationships between legal concepts, specific legal \nterminology, and citations. The AI assistant must perform quickly and return precise results. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在构建一个法律研究AI助手，该助手使用Amazon Bedrock和Anthropic Claude基础模型(FM)。AI助手必须检索高度相关的判例法文档，以增强FM的响应。AI助手必须识别法律概念、特定法律术语和引文之间的语义关系。AI助手必须快速执行并返回精确结果。哪种解决方案能满足这些要求？", "options_en": ["Configure an Amazon Bedrock knowledge base to use a default vector search configuration. Use \nAmazon Bedrock to expand queries to improve retrieval for legal documents based on specific \nterminology and citations.", "Use Amazon OpenSearch Service to deploy a hybrid search architecture that combines vector search \nwith keyword search. Apply an Amazon Bedrock reranker model to optimize result relevance.", "Enable the Amazon Kendra query suggestion feature for end users. Use Amazon Bedrock to perform \npost-processing of search results to identify semantic similarity in the documents and to produce precise \nresults.", "Use Amazon OpenSearch Service with vector search and Amazon Bedrock Titan Embeddings to index \nand search legal documents. Use custom AWS Lambda functions to merge results with keyword-based \nfilters that are stored in an Amazon RDS database."], "options_zh": ["配置Amazon Bedrock知识库使用默认的向量搜索配置。使用Amazon Bedrock扩展查询，以改进对基于特定术语和引文的法律文档的检索。", "使用Amazon OpenSearch Service部署结合向量搜索与关键词搜索的混合搜索架构。应用Amazon Bedrock重排序模型优化结果相关性。", "为最终用户启用Amazon Kendra查询建议功能。使用Amazon Bedrock对搜索结果进行后处理，以识别文档中的语义相似性并产生精确结果。", "使用带有向量搜索的Amazon OpenSearch Service和Amazon Bedrock Titan Embeddings来索引和搜索法律文档。使用自定义AWS Lambda函数将结果与存储在Amazon RDS数据库中的基于关键词的过滤器合并。"], "a": "B", "explanation_en": "Option B is the correct solution because legal research workloads require both semantic understanding and exact lexical precision, especially for statutes, citations, and domain-specific terminology. A hybrid search architecture directly addresses this need by combining vector similarity search with traditional keyword-based retrieval. Vector search alone is often insufficient for legal research because exact phrases, citation formats, and jurisdiction-specific terms must be matched precisely. Keyword search ensures high recall and precision for citations and legal terms, while vector search captures deeper semantic relationships between legal concepts, precedents, and arguments. Amazon OpenSearch Service natively supports hybrid search, enabling efficient scoring and ranking without external orchestration. Applying an Amazon Bedrock reranker model further improves relevance by reordering retrieved documents based on deeper contextual understanding. Reranking is especially valuable in legal research because multiple documents may appear relevant, but only a subset truly addresses the user’s legal question. The reranker optimizes final results before they are passed to the Anthropic Claude FM, improving answer accuracy and reducing hallucinations. Option A relies on default vector search, which does not reliably handle citations and exact terminology. Option C focuses on query suggestions and post-processing rather than retrieval quality. Option D introduces unnecessary operational complexity by merging results across multiple systems. Therefore, Option B best meets the requirements for precision, performance, and semantic understanding in a legal research AI assistant.", "explanation_zh": "选项B是正确的解决方案，因为法律研究工作负载既需要语义理解，也需要精确的词法匹配，特别是对于法规条文、引文和领域特定术语。混合搜索架构通过结合向量相似性搜索与传统基于关键词的检索直接满足了这一需求。仅靠向量搜索往往不足以满足法律研究需求，因为精确短语、引文格式和管辖特定术语必须精确匹配。关键词搜索确保了对引文和法律术语的高召回率和精确度，而向量搜索则捕捉了法律概念、先例和论点之间更深层的语义关系。Amazon OpenSearch Service原生支持混合搜索，无需外部编排即可实现高效的评分和排序。应用Amazon Bedrock重排序模型通过基于更深入的上下文理解重新排序检索到的文档进一步改进了相关性。重排序在法律研究中尤其有价值，因为多个文档可能看似相关，但只有一部分真正解决了用户的法律问题。重排序模型在将最终结果传递给Anthropic Claude FM之前优化结果，提高了答案的准确性并减少了幻觉。选项A依赖默认的向量搜索，无法可靠地处理引文和精确术语。选项C侧重于查询建议和后处理，而非检索质量。选项D通过跨多个系统合并结果引入了不必要的操作复杂性。因此，选项B最能满足法律研究AI助手在精确性、性能和语义理解方面的要求。"}, {"id": 29, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is building a video analysis platform on AWS. The platform will analyze a large video archive by \nusing Amazon Rekognition and Amazon Bedrock. The platform must comply with predefined privacy \nstandards. The platform must also use secure model I/O, control foundation model (FM) access patterns, and \nprovide an audit of who accessed what and when. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在AWS上构建一个视频分析平台。该平台将通过使用Amazon Rekognition和Amazon Bedrock分析大型视频档案。该平台必须遵守预定义的隐私标准。该平台还必须使用安全的模型输入/输出、控制基础模型(FM)访问模式，并提供谁在何时访问了什么的审计记录。哪种解决方案能满足这些要求？", "options_en": ["Configure VPC endpoints for Amazon Bedrock model API calls. Implement Amazon Bedrock \nguardrails to filter harmful or unauthorized content in prompts and responses. Use Amazon Bedrock \ntrace events to track all agent and model invocations for auditing purposes. Export the traces to Amazon \nCloudWatch Logs as an audit record of model usage. Store all prompts and outputs in Amazon S3 with \nserver-side encryption with AWS KMS keys (SSE-KMS).", "Define access control by using IAM with attribute-based access control (ABAC) to map departments to \nspecific permissions. Configure VPC endpoints for Amazon Bedrock model API calls. Use IAM \ncondition keys to enforce specific GuardrailIdentifier and ModelId values. Configure AWS CloudTrail \nto capture management and data events for S3 objects and KMS key usage activities. Enable S3 server \naccess logging to record detailed file-level interactions with the video archives. Send all CloudTrail \nlogs to AWS CloudTrail Lake. Set up Amazon CloudWatch alarms to detect and alert on unexpected \nactivity from Amazon Bedrock, Amazon Rekognition, and AWS KMS.", "Restrict access to services by using VPC endpoint policies. Use AWS Config to track resource changes \nand compliance with security rules. Use server-side encryption with AWS KMS keys (SSE-KMS) to \nencrypt data at rest. Store the model’s I/O in separate Amazon S3 buckets. Enable S3 server access \nlogging to track file-level interactions.", "Configure AWS CloudTrail Insights to analyze API call patterns across accounts and detect anomalous \nactivity in Amazon Bedrock, Amazon Rekognition, Amazon S3, and AWS KMS. Deploy Amazon \nMacie to scan and classify the video archive. Use server-side encryption with AWS KMS keys (SSE-\nKMS) to encrypt all stored data. Configure CloudTrail to capture KMS API usage events for audit \npurposes. Configure Amazon EventBridge rules to process CloudTrail Insights anomalies and Macie \nfindings. Use CloudWatch alarms to trigger automated notifications and security responses when \npotential security issues are detected."], "options_zh": ["为Amazon Bedrock模型API调用配置VPC端点。实施Amazon Bedrock护栏，过滤提示和响应中的有害或未授权内容。使用Amazon Bedrock跟踪事件跟踪所有智能体和模型调用以进行审计。将跟踪导出到Amazon CloudWatch Logs作为模型使用的审计记录。将所有提示和输出存储在启用使用AWS KMS密钥进行服务器端加密(SSE-KMS)的Amazon S3中。", "使用带有基于属性的访问控制(ABAC)的IAM定义访问控制，将部门映射到特定权限。为Amazon Bedrock模型API调用配置VPC端点。使用IAM条件键强制指定GuardrailIdentifier和ModelId值。配置AWS CloudTrail捕获S3对象和KMS密钥使用活动的管理和数据事件。启用S3服务器访问日志记录，记录与视频档案的详细文件级别交互。将所有CloudTrail日志发送到AWS CloudTrail Lake。设置Amazon CloudWatch告警，检测并提醒来自Amazon Bedrock、Amazon Rekognition和AWS KMS的意外活动。", "使用VPC端点策略限制对服务的访问。使用AWS Config跟踪资源更改和与安全规则的合规性。使用使用AWS KMS密钥的服务器端加密(SSE-KMS)加密静态数据。将模型的输入/输出存储在单独的Amazon S3存储桶中。启用S3服务器访问日志记录以跟踪文件级别交互。", "配置AWS CloudTrail Insights分析跨账户的API调用模式并检测Amazon Bedrock、Amazon Rekognition、Amazon S3和AWS KMS中的异常活动。部署Amazon Macie扫描和分类视频档案。使用使用AWS KMS密钥的服务器端加密(SSE-KMS)加密所有存储的数据。配置CloudTrail捕获KMS API使用事件以进行审计。配置Amazon EventBridge规则处理CloudTrail Insights异常和Macie发现。使用CloudWatch告警在检测到潜在安全问题时触发自动通知和安全响应。"], "a": "B", "explanation_en": "Option B is the correct solution because it delivers end-to-end governance, security, and auditability across Amazon Bedrock, Amazon Rekognition, and the underlying data layer while meeting strict privacy and compliance requirements. Using IAM attribute-based access control (ABAC) allows the company to control access to foundation models and data based on department, role, or workload attributes rather than static permissions. This is critical for controlling FM access patterns at scale. Enforcing specific ModelId and GuardrailIdentifier values with IAM condition keys ensures that only approved models and guardrails are used, which directly supports secure model I/O and governance requirements. Configuring VPC endpoints for Amazon Bedrock ensures that all model invocations remain on private AWS network paths, reducing data exfiltration risk and supporting privacy standards. AWS CloudTrail captures both management and data events, providing a definitive audit trail of who accessed which resources and when. Sending logs to CloudTrail Lake enables centralized, long-term, queryable auditing across services. Amazon S3 server access logging adds file-level visibility into video archive access, which is essential for compliance and forensic analysis. Amazon CloudWatch alarms provide near real-time detection of anomalous or unauthorized activity across Amazon Bedrock, Amazon Rekognition, and AWS KMS. Option A focuses primarily on model-level tracing but lacks comprehensive IAM governance and S3 access auditing. Option C provides partial controls but lacks identity-aware auditing and model governance. Option D focuses on anomaly detection and classification but does not explicitly control FM access patterns. Therefore, Option B best satisfies all stated requirements in a unified, auditable, and security-first architecture.", "explanation_zh": "选项B是正确的解决方案，因为它提供了跨Amazon Bedrock、Amazon Rekognition和底层数据层的端到端治理、安全和可审计性，同时满足严格的隐私和合规要求。使用IAM基于属性的访问控制(ABAC)允许公司基于部门、角色或工作负载属性控制对基础模型和数据的访问，而不是使用静态权限。这对于大规模控制FM访问模式至关重要。使用IAM条件键强制执行特定的ModelId和GuardrailIdentifier值，确保只使用已批准的模型和护栏，直接支持安全的模型输入/输出和治理要求。为Amazon Bedrock配置VPC端点确保所有模型调用保持在私有AWS网络路径上，降低了数据泄露风险并支持隐私标准。AWS CloudTrail捕获管理和数据事件，提供了谁在何时访问了哪些资源的确定性审计跟踪。将日志发送到CloudTrail Lake实现了跨服务的集中式、长期、可查询审计。Amazon S3服务器访问日志记录增加了对视频档案访问的文件级别可见性，这对合规和取证分析至关重要。Amazon CloudWatch告警提供近实时的异常或未授权活动检测。选项A主要侧重于模型级别的跟踪，但缺少全面的IAM治理和S3访问审计。选项C提供了部分控制，但缺乏身份感知审计和模型治理。选项D侧重于异常检测和分类，但没有明确控制FM访问模式。因此，选项B以统一、可审计且安全至上的架构最佳地满足了所有既定要求。"}, {"id": 30, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is creating a generative AI (GenAI) application that uses Amazon Bedrock foundation models \n(FMs). The application must use Microsoft Entra ID to authenticate. All FM API calls must stay on private \nnetwork paths. Access to the application must be limited by department to specific model families. The \ncompany also needs a comprehensive audit trail of model interactions. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在创建使用Amazon Bedrock基础模型(FM)的生成式AI(GenAI)应用程序。该应用程序必须使用Microsoft Entra ID进行身份验证。所有FM API调用必须保持在私有网络路径上。对应用程序的访问必须按部门限制到特定的模型系列。公司还需要模型交互的全面审计跟踪。哪种解决方案能满足这些要求？", "options_en": ["Configure SAML federation between Microsoft Entra ID and AWS Identity and Access Management. \nCreate department-specific IAM roles that allow only the required ModelId values. Create AWS \nPrivateLink interface VPC endpoints for Amazon Bedrock runtime services. Enable AWS CloudTrail \nto capture Amazon Bedrock API calls. Configure Amazon Bedrock model invocation logging to record \ndetailed model interactions.", "Create an identity provider (IdP) connection in IAM to authenticate by using Microsoft Entra ID. \nAssign department permission sets to control access to specific model families. Deploy AWS Lambda \nfunctions in private subnets with a NAT gateway for egress to Amazon Bedrock public endpoints. \nEnable CloudWatch Logs to capture model interactions for auditing purposes.", "Create a SAML identity provider (IdP) in IAM to authenticate by using Microsoft Entra ID. Use IAM \npermissions boundaries to limit department roles' access to specific model families. Configure public \nAmazon Bedrock API endpoints with VPC routing to maintain private network connectivity. Set up \nCloudTrail with Amazon S3 Lifecycle rules to manage audit logs of model interactions.", "Configure OpenID Connect (OIDC) federation between Microsoft Entra ID and IAM. Use attribute-\nbased access control to map department attributes to specific model access permissions. Apply SCP \npolicies to restrict access to Amazon Bedrock FM families based on department. Use Microsoft Entra \nID's built-in logging capabilities to maintain an audit trail of model interactions."], "options_zh": ["在Microsoft Entra ID和AWS Identity and Access Management之间配置SAML联合。创建仅允许所需ModelId值的部门特定IAM角色。为Amazon Bedrock运行时服务创建AWS PrivateLink接口VPC端点。启用AWS CloudTrail捕获Amazon Bedrock API调用。配置Amazon Bedrock模型调用日志记录以记录详细的模型交互。", "在IAM中创建身份提供商(IdP)连接，以使用Microsoft Entra ID进行身份验证。分配部门权限集以控制对特定模型系列的访问。在私有子网中部署AWS Lambda函数，并设置NAT网关用于出站到Amazon Bedrock公共端点。启用CloudWatch Logs捕获模型交互以进行审计。", "在IAM中创建SAML身份提供商(IdP)以使用Microsoft Entra ID进行身份验证。使用IAM权限边界限制部门角色对特定模型系列的访问。配置公共Amazon Bedrock API端点并通过VPC路由保持私有网络连接。设置带Amazon S3生命周期规则的CloudTrail管理模型交互的审计日志。", "在Microsoft Entra ID和IAM之间配置OpenID Connect(OIDC)联合。使用基于属性的访问控制将部门属性映射到特定的模型访问权限。应用SCP策略根据部门限制对Amazon Bedrock FM系列的访问。使用Microsoft Entra ID的内置日志记录功能维护模型交互的审计跟踪。"], "a": "A", "explanation_en": "Option A is the correct solution because it satisfies authentication, private connectivity, fine-grained authorization, and auditing using AWS-recommended patterns. SAML federation between Microsoft Entra ID and IAM is a mature, well-supported integration that enables centralized enterprise authentication. Department-specific IAM roles allow precise control over which Bedrock ModelId values each department can invoke, enforcing access by model family. Using AWS PrivateLink interface VPC endpoints for Amazon Bedrock runtime services ensures that all inference traffic stays on private AWS network paths, with no public internet exposure. NAT gateways and public endpoints, as used in other options, violate this requirement. AWS CloudTrail provides authoritative audit logs of all Bedrock API calls, which is required for compliance. Amazon Bedrock model invocation logging complements CloudTrail by capturing detailed prompt and response metadata for deeper auditing and investigation. Option B uses public endpoints via NAT. Option C incorrectly claims public endpoints can be private. Option D relies on IdP-side logs, which do not capture Bedrock API activity. Therefore, Option A is the only solution that fully meets security, compliance, and observability requirements.", "explanation_zh": "选项A是正确的解决方案，因为它使用AWS推荐的模式满足了身份验证、私有连接、细粒度授权和审计要求。Microsoft Entra ID与IAM之间的SAML联合是一种成熟且得到良好支持的集成方式，可实现集中式企业身份验证。部门特定的IAM角色允许精确控制每个部门可以调用的Bedrock ModelId值，按模型系列强制执行访问。使用AWS PrivateLink接口VPC端点用于Amazon Bedrock运行时服务，确保所有推理流量保持在私有AWS网络路径上，不会暴露于公共互联网。其他选项中使用的NAT网关和公共端点违反此要求。AWS CloudTrail提供所有Bedrock API调用的权威审计日志，这是合规所必需的。Amazon Bedrock模型调用日志记录补充CloudTrail，通过捕获详细的提示和响应元数据进行更深入的审计和调查。选项B通过NAT使用公共端点。选项C错误地声称公共端点可以是私有的。选项D依赖IdP端的日志，无法捕获Bedrock API活动。因此，选项A是唯一完全满足安全、合规和可观测性要求的解决方案。"}, {"id": 31, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is using Amazon Bedrock and Anthropic Claude 3 Haiku to develop an AI assistant. The AI \nassistant normally processes 10,000 requests each hour but experiences surges of up to 30,000 requests each \nhour during peak usage periods. The AI assistant must respond within 2 seconds while operating across \nmultiple AWS Regions. The company observes that during peak usage periods, the AI assistant experiences throughput bottlenecks \nthat cause increased latency and occasional request timeouts. The company must resolve the performance \nissues. Which solution will meet this requirement? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock和Anthropic Claude 3 Haiku开发一个AI助手。该AI助手通常每小时处理10,000个请求，但在高峰使用期间会出现高达每小时30,000个请求的激增。AI助手必须在2秒内响应，同时在多个AWS区域运行。公司观察到，在高峰使用期间，AI助手遇到吞吐量瓶颈，导致延迟增加和偶发请求超时。公司必须解决性能问题。哪种解决方案能满足这一要求？", "options_en": ["Purchase provisioned throughput and sufficient model units (MUs) in a single Region. Configure the \napplication to retry failed requests with exponential backoff.", "Implement token batching to reduce API overhead. Use cross-Region inference profiles to \nautomatically distribute traffic across available Regions.", "Set up auto scaling AWS Lambda functions in each Region. Implement client-side round-robin request \ndistribution. Purchase one model unit (MU) of provisioned throughput as a backup.", "Implement batch inference for all requests by using Amazon S3 buckets across multiple Regions. Use \nAmazon SQS to set up an asynchronous retrieval process."], "options_zh": ["在单个区域购买预配吞吐量和足够的模型单元(MU)。配置应用程序以使用指数退避重试失败的请求。", "实施令牌批处理以减少API开销。使用跨区域推理配置文件自动在可用区域之间分配流量。", "在每个区域设置自动扩缩的AWS Lambda函数。实施客户端轮询请求分发。购买一个模型单元(MU)的预配吞吐量作为备份。", "通过使用跨多个区域的Amazon S3存储桶对所有请求实施批处理推理。使用Amazon SQS设置异步检索流程。"], "a": "B", "explanation_en": "Option B is the correct solution because it directly addresses both throughput bottlenecks and latency requirements using native Amazon Bedrock performance optimization features that are designed for real-time, high-volume generative AI workloads. Amazon Bedrock supports cross-Region inference profiles, which allow applications to transparently route inference requests across multiple AWS Regions. During peak usage periods, traffic is automatically distributed to Regions with available capacity, reducing throttling, request queuing, and timeout risks. This approach aligns with AWS guidance for building highly available, low-latency GenAI applications that must scale elastically across geographic boundaries. Token batching further improves efficiency by combining multiple inference requests into a single model invocation where applicable. AWS Generative AI documentation highlights batching as a key optimization technique to reduce per-request overhead, improve throughput, and better utilize model capacity. This is especially effective for lightweight, low-latency models such as Claude 3 Haiku, which are designed for fast responses and high request volumes. Option A does not meet the requirement because purchasing provisioned throughput in a single Region creates a regional bottleneck and does not address multi-Region availability or traffic spikes beyond reserved capacity. Retries increase load and latency rather than resolving the root cause. Option C improves application-layer scaling but does not solve model-side throughput limits. Client-side round-robin routing lacks awareness of real-time model capacity and can still send traffic to saturated Regions. Option D is unsuitable because batch inference with asynchronous retrieval is designed for offline or non- interactive workloads. It cannot meet a strict 2-second response time require
