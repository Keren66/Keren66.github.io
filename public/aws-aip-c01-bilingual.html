", "配置一个护栏，将有害内容的内容过滤器设置为中。为投资建议设置拒绝主题，并包含清晰的定义和示例短语进行屏蔽。配置敏感信息过滤器，在响应中屏蔽PII，在输入中阻止财务信息。启用输入和输出评估，使用自定义的阻止消息进行审计。", "为每个用例创建一个单独的护栏。创建一个应用有害内容过滤器的护栏。创建一个应用投资建议主题过滤器的护栏。创建一个应用敏感信息过滤器以阻止PII的护栏。使用AWS Step Functions按顺序链接这些护栏。"], "a": "C", "explanation_en": "Option C is the correct solution because it uses a single, well-tuned Amazon Bedrock guardrail that applies different actions to different content types, which is the recommended approach for minimizing false positives while enforcing strong policy controls. Setting content filters to medium rather than high reduces overblocking of benign customer conversations while still preventing harmful content. Amazon Bedrock guardrails are designed to balance precision and recall, and medium sensitivity is commonly recommended for customer-facing financial services use cases. Denied topics explicitly prevent the assistant from discussing investment advice, which is a regulatory requirement. Including definitions and sample phrases improves detection accuracy and reduces ambiguity. Sensitive information filters support different actions per context. Masking PII in responses preserves conversational usefulness for legitimate customer support while preventing exposure of sensitive data. Blocking sensitive financial information in inputs prevents downstream processing of disallowed content before it reaches the foundation model. Critically, enabling both input and output evaluation ensures that guardrails are applied consistently at every stage of interaction. Custom blocked messages and audit logging provide clear compliance evidence for regulators and internal audits. Option A causes excessive false positives by blocking all PII outright. Option B introduces unnecessary complexity and is not how Bedrock guardrails are intended to be applied. Option D uses orchestration logic that Bedrock guardrails already handle natively. Therefore, Option C best satisfies enforcement, flexibility, auditability, and accuracy requirements.", "explanation_zh": "选项C是正确的，因为它使用单个精心调优的Amazon Bedrock护栏，对不同内容类型应用不同的操作，这是最小化误报同时强制执行强策略控制的首选方法。将内容过滤器设置为中而非高，减少了良性客户对话的过度屏蔽，同时仍能阻止有害内容。Amazon Bedrock护栏旨在平衡精确度和召回率，中等敏感度通常推荐用于面向客户的金融服务用例。拒绝主题明确阻止助手讨论投资建议，这是监管要求。包含定义和示例短语提高了检测准确性并减少了歧义。敏感信息过滤器支持根据不同上下文采取不同操作。在响应中屏蔽PII保留了合法客户支持的对话有用性，同时防止敏感数据暴露。在输入中阻止敏感的财务信息，防止不允许的内容在到达基础模型之前被下游处理。关键是，启用输入和输出评估确保护栏在交互的每个阶段都一致应用。自定义的阻止消息和审计日志为监管机构和内部审计提供了清晰的合规证据。选项A通过彻底阻止所有PII导致过多误报。选项B引入了不必要的复杂性，不是Bedrock护栏的设计使用方式。选项D使用了Bedrock护栏已经原生处理的编排逻辑。因此，选项C最能满足执行、灵活性、可审计性和准确性的要求。"}, {"id": 84, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company is developing a Retrieval Augmented Generation (RAG) application to help \ninvestment analysts query complex financial relationships across multiple investment vehicles, market \nsectors, and regulatory environments. The dataset contains highly interconnected entities that have multi-hop \nrelationships. Analysts must examine relationships holistically to provide accurate investment guidance. The \napplication must deliver comprehensive answers that capture indirect relationships between financial entities \nand must respond in less than 3 seconds. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.  Use Amazon DynamoDB to store financial data in a custom indexing system. Use AWS Lambda to", "body_zh": "一家金融服务公司正在开发一个检索增强生成（RAG）应用程序，帮助投资分析师查询跨多种投资工具、市场板块和监管环境的复杂金融关系。数据集包含高度互联的实体，具有多跳关系。分析师必须全面审视关系以提供准确的投资指导。应用程序必须提供能够捕捉金融实体间间接关系的全面答案，并且响应时间必须小于3秒。哪种解决方案能以最少运维开销满足这些要求？", "options_en": ["Use Amazon Bedrock Knowledge Bases with GraphRAG and Amazon Neptune Analytics to store \nfinancial data. Analyze multi-hop relationships between entities and automatically identify related \ninformation across documents.", "Use Amazon Bedrock Knowledge Bases and an Amazon OpenSearch Service vector store to implement \ncustom relationship identification logic that uses AWS Lambda to query multiple vector embeddings in \nsequence.", "Use Amazon OpenSearch Serverless vector search with k-nearest neighbor (k-NN). Implement manual \nrelationship mapping in an application layer that runs on Amazon EC2 Auto Scaling.", "query relevant records. Use Amazon SageMaker to generate responses."], "options_zh": ["使用带有GraphRAG的Amazon Bedrock Knowledge Bases和Amazon Neptune Analytics来存储金融数据。分析实体间的多跳关系，自动识别跨文档的相关信息。", "使用Amazon Bedrock Knowledge Bases和Amazon OpenSearch Service向量存储，实现自定义关系识别逻辑，使用AWS Lambda按顺序查询多个向量embeddings。", "使用Amazon OpenSearch Serverless向量搜索和k近邻（k-NN）。在运行于Amazon EC2 Auto Scaling的应用层中实现手动关系映射。", "使用Amazon DynamoDB在自定义索引系统中存储金融数据。使用AWS Lambda查询相关记录。使用Amazon SageMaker生成响应。"], "a": "A", "explanation_en": "Option A best satisfies the requirement to capture multi-hop, highly interconnected relationships with minimal operational overhead. Traditional vector similarity search excels at finding semantically similar text but is not optimized for reasoning over explicit entity-to-entity relationships, especially when analysts need indirect, multi-hop connections (for example, fund # holding # issuer # sector # regulation). Graph-based retrieval is designed specifically for these kinds of relationship traversals. GraphRAG combines retrieval-augmented generation with graph-aware context selection. By representing entities and their relationships in a graph store, the system can traverse multiple hops to assemble a holistic set of relevant facts. This improves completeness and reduces the chance that the model misses indirect relationships that are essential for accurate investment guidance. Amazon Neptune Analytics provides a managed graph analytics environment capable of efficiently traversing and analyzing complex relationship networks. When integrated with Amazon Bedrock Knowledge Bases, it reduces custom engineering by providing managed ingestion, retrieval, and orchestration patterns suitable for GenAI applications. This lowers operational overhead compared to building and maintaining custom multi- stage retrieval logic. Meeting the sub-3-second requirement is also more feasible with a graph-optimized engine because multi-hop traversals can be executed efficiently compared to chaining multiple vector searches and joining results in an application layer. The managed nature of Knowledge Bases and Neptune Analytics reduces maintenance, scaling, and operational burden while enabling strong performance. Option B and C require extensive custom logic and orchestration, increasing complexity and latency. Option D is not designed for graph-style multi-hop exploration and would require significant custom indexing and retrieval logic. Therefore, Option A is the most AWS-aligned and operationally efficient approach for multi-hop relationship- aware RAG with strong performance.", "explanation_zh": "选项A最能满足以最少运维开销捕捉多跳、高度互联关系的要求。传统向量相似度搜索擅长查找语义相似的文本，但不适合对显式的实体间关系进行推理，尤其是在分析师需要间接的多跳连接时。基于图的检索正是为这类关系遍历设计的。GraphRAG结合了检索增强生成和图感知上下文选择。通过在图中表示实体及其关系，系统可以遍历多跳，汇集一组完整的相关事实。这提高了完整性，并减少了模型遗漏对准确投资指导至关重要的间接关系的可能性。Amazon Neptune Analytics提供了托管的图分析环境，能够高效遍历和分析复杂的关系网络。当与Amazon Bedrock Knowledge Bases集成时，它通过提供适用于GenAI应用的托管摄取、检索和编排模式，减少了自定义工程，相比构建和维护自定义多阶段检索逻辑降低了运维开销。满足亚3秒的要求也更容易实现，因为图优化引擎可以高效执行多跳遍历，而链接多个向量搜索并在应用层合并结果。Knowledge Bases和Neptune Analytics的托管特性减少了维护、扩展和运维负担，同时实现了强劲的性能。选项B和C需要大量的自定义逻辑和编排，增加了复杂性和延迟。选项D不是为图式多跳探索设计的，需要大量的自定义索引和检索逻辑。因此，选项A是最符合AWS架构……"}, {"id": 85, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company uses Amazon Bedrock to generate technical content for customers. The company has recently \nexperienced a surge in hallucinated outputs when the company’s model generates summaries of long technical \ndocuments. The model outputs include inaccurate or fabricated details. The company’s current solution uses a \nlarge foundation model (FM) with a basic one-shot prompt that includes the full document in a single input. The company needs a solution that will reduce hallucinations and meet factual accuracy goals. The solution \nmust process more than 1,000 documents each hour and deliver summaries within 3 seconds for each \ndocument. Which combination of solutions will meet these requirements? (Select TWO.) A. B. C. D. E.", "body_zh": "一家公司使用Amazon Bedrock为客户生成技术内容。该公司最近在模型生成长篇技术文档摘要时，出现了大量虚构输出。模型输出包含不准确或编造的细节。公司当前的解决方案使用一个大型基础模型（FM），配合基本的单次提示，将完整文档包含在单次输入中。公司需要一个能减少幻觉并达到事实准确性目标的解决方案。该解决方案必须每小时处理超过1,000份文档，并在3秒内为每份文档生成摘要。哪两种解决方案的组合能满足这些要求？（选择两个。）", "options_en": ["Implement zero-shot chain-of-thought (CoT) instructions that require step-by-step reasoning with \nexplicit fact verification before the model generates each summary.", "Use Retrieval Augmented Generation (RAG) with an Amazon Bedrock knowledge base. Apply \nsemantic chunking and tuned embeddings to ground summaries in source content.", "Configure Amazon Bedrock guardrails to block any generated output that matches patterns that are \nassociated with hallucinated content.", "Increase the temperature parameter in Amazon Bedrock.", "Prompt the Amazon Bedrock model to summarize each full document in one pass."], "options_zh": ["实施零样本思维链（CoT）指令，要求模型在生成每个摘要之前进行逐步推理和显式的事实验证。", "使用带有Amazon Bedrock知识库的检索增强生成（RAG）。应用语义分块和调优后的embeddings，将摘要基于源内容。", "配置Amazon Bedrock护栏，阻止任何与幻觉内容相关的模式匹配的输出。", "在Amazon Bedrock中提高temperature参数。", "提示Amazon Bedrock模型一次性对每份完整文档进行摘要。"], "a": "B C", "explanation_en": "The correct answers are B and C because they directly address hallucination reduction while maintaining high throughput and low latency. Option B reduces hallucinations at their source by grounding model outputs in verified content through Retrieval Augmented Generation (RAG). Using an Amazon Bedrock knowledge base with semantic chunking ensures that long technical documents are broken into meaningfully coherent sections. This allows the model to retrieve only the most relevant chunks, rather than processing an entire document in one pass, which significantly improves factual accuracy and reduces cognitive overload on the model. This approach scales efficiently and supports processing more than 1,000 documents per hour. Option C adds a defense-in-depth safety layer by using Amazon Bedrock guardrails to detect and block hallucination-like output patterns. Guardrails operate at inference time with minimal performance overhead, making them suitable for low-latency requirements. While guardrails do not eliminate hallucinations entirely, they effectively prevent unsafe or clearly fabricated outputs from reaching users. Option A increases latency and cost due to explicit reasoning steps and does not scale well for high- throughput workloads. Option D increases randomness and worsens hallucinations. Option E repeats the existing flawed approach. Therefore, Options B and C together provide scalable grounding and runtime protection that meet accuracy, performance, and throughput requirements.", "explanation_zh": "正确答案是B和C，因为它们直接解决减少幻觉的问题，同时保持高吞吐量和低延迟。选项B通过在检索增强生成（RAG）中使用经过验证的内容来基于模型输出，从源头减少幻觉。使用带有语义分块的Amazon Bedrock知识库确保长篇技术文档被分割成有意义的连贯段落。这使得模型只需检索最相关的段落，而不是一次性处理整份文档，显著提高了事实准确性并减少了模型的认知负担。这种方法高效扩展，支持每小时处理超过1,000份文档。选项C通过使用Amazon Bedrock护栏检测并阻止类似幻觉的输出模式，增加了深度防御安全层。护栏在推理时运行，性能开销极小，适用于低延迟要求。虽然护栏不能完全消除幻觉，但它们有效阻止了不安全或明显编造的输出到达用户。选项A由于显式的推理步骤增加了延迟和成本，不适合高吞吐量工作负载。选项D增加了随机性，使幻觉更严重。选项E重复了现有的有缺陷的方法。因此，选项B和C共同提供了可扩展的基于源内容的生成和运行时保护，满足了准确性、性能和吞吐量的要求。"}, {"id": 86, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company is developing a customer service AI assistant application that uses a foundation \nmodel (FM) in Amazon Bedrock. The application must provide transparent responses by documenting \nreasoning and by citing sources that are used for Retrieval Augmented Generation (RAG). The application \nmust capture comprehensive audit trails for all responses to users. The application must be able to serve up to \n10,000 concurrent users and must respond to each customer inquiry within 2 seconds. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家金融服务公司正在开发一个客户服务AI助手应用程序，使用Amazon Bedrock中的基础模型（FM）。应用程序必须提供透明的响应，记录推理过程并引用检索增强生成（RAG）所使用的来源。应用程序必须为所有用户的响应捕获全面的审计跟踪。应用程序必须能够服务于多达10,000个并发用户，并在2秒内响应每个客户查询。哪种解决方案能以最少运维开销满足这些要求？", "options_en": ["Enable tracing for Amazon Bedrock Agents. Configure structured prompts that direct the FM to provide \nevidence presentations. Integrate Amazon Bedrock Knowledge Bases with data sources to enable RAG. \nConfigure the application to reference and cite authoritative content. Deploy the application in a Multi-\nAZ architecture. Use Amazon API Gateway and AWS Lambda functions to scale the application. Use \nAmazon CloudFront to provide low-latency delivery.", "Enable tracing for Amazon Bedrock agents. Integrate a custom RAG pipeline with Amazon \nOpenSearch Service to retrieve and cite sources. Configure structured prompts to present retrieved \nevidence. Deploy the application behind an Amazon API Gateway REST API. Use AWS Lambda \nfunctions and Amazon CloudFront to scale the application and to provide low latency. Store logs in \nAmazon S3 and use AWS CloudTrail to capture audit trails.", "Use Amazon CloudWatch to monitor latency and error rates. Embed model prompts directly in the \napplication backend to cite sources. Store application interactions with users in Amazon RDS for audits.", "Store generated responses and supporting evidence in an Amazon S3 bucket. Enable versioning on the \nbucket for audits. Use AWS Glue to catalog retrieved documents. Process the retrieved documents in \nAmazon Athena to generate periodic compliance reports."], "options_zh": ["为Amazon Bedrock Agents启用跟踪。配置结构化提示，引导FM提供证据展示。将Amazon Bedrock Knowledge Bases与数据源集成以启用RAG。配置应用程序引用和引用权威内容。以多可用区架构部署应用程序。使用Amazon API Gateway和AWS Lambda函数扩展应用程序。使用Amazon CloudFront提供低延迟交付。", "为Amazon Bedrock Agents启用跟踪。集成自定义RAG流水线与Amazon OpenSearch Service，检索和引用来源。配置结构化提示以展示检索到的证据。在Amazon API Gateway REST API后部署应用程序。使用AWS Lambda函数和Amazon CloudFront扩展应用程序并提供低延迟。将日志存储在Amazon S3中，使用AWS CloudTrail捕获审计跟踪。", "使用Amazon CloudWatch监控延迟和错误率。在应用程序后端直接嵌入模型提示以引用来源。将应用程序与用户的交互存储在Amazon RDS中以供审计。", "将生成的响应和支持证据存储在Amazon S3存储桶中。启用存储桶版本控制以供审计。使用AWS Glue对检索到的文档进行编目。在Amazon Athena中处理检索到的文档以生成定期合规报告。"], "a": "A", "explanation_en": "Option A is the correct solution because it relies on native Amazon Bedrock capabilities to deliver transparency, auditability, scalability, and low latency with minimal operational overhead. Amazon Bedrock Knowledge Bases provide a fully managed Retrieval Augmented Generation (RAG) implementation that automatically handles document ingestion, embedding, retrieval, and source attribution, enabling the application to cite authoritative content without building custom pipelines. Enabling tracing for Amazon Bedrock Agents provides end-to-end visibility into agent reasoning steps, tool usage, and model interactions. This satisfies the requirement for comprehensive audit trails and supports regulatory review in financial services environments. Structured prompts further ensure that responses explicitly present reasoning and supporting evidence in a controlled, auditable format. Using Amazon API Gateway and AWS Lambda allows the application to scale automatically to thousands of concurrent users without capacity planning. These services are designed for bursty workloads and can easily support the stated requirement of up to 10,000 concurrent users. Amazon CloudFront reduces latency by caching and accelerating content delivery, helping the application meet the strict 2-second response-time requirement. Option B introduces a custom RAG pipeline with OpenSearch, increasing operational complexity and maintenance effort. Option C lacks native RAG integration and does not provide transparent reasoning or citation management. Option D focuses on offline compliance reporting rather than real-time transparency and low-latency responses. Therefore, Option A best meets all requirements while minimizing infrastructure and operational overhead.", "explanation_zh": "选项A是正确的，因为它依赖原生的Amazon Bedrock功能，以最少运维开销提供透明性、可审计性、可扩展性和低延迟。Amazon Bedrock Knowledge Bases提供了完全托管的检索增强生成（RAG）实现，自动处理文档摄取、embedding、检索和来源归属，使应用程序无需构建自定义流水线即可引用权威内容。为Amazon Bedrock Agents启用跟踪提供了代理推理步骤、工具使用和模型交互的端到端可见性。这满足了金融服务环境中全面审计跟踪和支持监管审查的要求。结构化提示进一步确保响应以受控、可审计的格式明确呈现推理过程和支持证据。使用Amazon API Gateway和AWS Lambda使应用程序能够自动扩展到数千个并发用户，无需容量规划。这些服务专为突发工作负载设计，可以轻松支持最多10,000个并发用户的要求。Amazon CloudFront通过缓存和加速内容交付减少延迟，帮助应用程序满足严格的2秒响应时间要求。选项B引入了带有OpenSearch的自定义RAG流水线，增加了运维复杂性和维护工作量。选项C缺乏原生RAG集成，不提供透明的推理或引用管理。选项D侧重于离线合规报告，而非实时透明性和低延迟响应。因此，选项A在最大限度减少基础设施和运维开销的同时，最佳地满足了所有要求。"}, {"id": 87, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is designing an API for a generative AI (GenAI) application that uses a foundation model (FM) \nthat is hosted on a managed model service. The API must stream responses to reduce latency, enforce token \nlimits to manage compute resource usage, and implement retry logic to handle model timeouts and partial \nresponses. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家公司正在为一个生成式AI（GenAI）应用程序设计API，该应用程序使用托管在管理型模型服务上的基础模型（FM）。该API必须流式传输响应以减少延迟，强制令牌限制以管理计算资源使用，并实现重试逻辑以处理模型超时和部分响应。哪种解决方案能以最少运维开销满足这些要求？", "options_en": ["Integrate an Amazon API Gateway HTTP API with an AWS Lambda function to invoke Amazon \nBedrock. Use Lambda response streaming to stream responses. Enforce token limits within the Lambda \nfunction. Implement retry logic for model timeouts by using Lambda and API Gateway timeout \nconfigurations.", "Connect an Amazon API Gateway HTTP API directly to Amazon Bedrock. Simulate streaming by \nusing client-side polling. Enforce token limits on the frontend. Configure retry behavior by using API \nGateway integration settings.", "Connect an Amazon API Gateway WebSocket API to an Amazon ECS service that hosts a \ncontainerized inference server. Stream responses by using the WebSocket protocol. Enforce token \nlimits within Amazon ECS. Handle model timeouts by using ECS task lifecycle hooks and restart \npolicies.", "Integrate an Amazon API Gateway REST API with an AWS Lambda function that invokes Amazon \nBedrock. Use Lambda response streaming to stream responses. Enforce token limits within the Lambda \nfunction. Implement retry logic by using Lambda and API Gateway timeout configurations."], "options_zh": ["将Amazon API Gateway HTTP API与AWS Lambda函数集成，以调用Amazon Bedrock。使用Lambda响应流式传输来流式传输响应。在Lambda函数内强制令牌限制。通过Lambda和API Gateway超时配置实现模型超时的重试逻辑。", "将Amazon API Gateway HTTP API直接连接到Amazon Bedrock。通过客户端轮询模拟流式传输。在前端强制令牌限制。通过API Gateway集成设置配置重试行为。", "将Amazon API Gateway WebSocket API连接到托管容器化推理服务器的Amazon ECS服务。通过WebSocket协议流式传输响应。在Amazon ECS内强制令牌限制。使用ECS任务生命周期钩子和重启策略处理模型超时。", "将Amazon API Gateway REST API与调用Amazon Bedrock的AWS Lambda函数集成。使用Lambda响应流式传输来流式传输响应。在Lambda函数内强制令牌限制。通过Lambda和API Gateway超时配置实现重试逻辑。"], "a": "A", "explanation_en": "Option A is the best solution because it satisfies streaming, token control, and retry requirements while keeping operational overhead low by using fully managed, serverless AWS services. Amazon API Gateway HTTP APIs provide a lightweight, cost-effective front door for APIs and integrate cleanly with AWS Lambda for request processing and security controls. AWS Lambda response streaming allows the API to begin returning content to the client as soon as partial model output is available, reducing perceived latency and improving user experience for long responses. Using Lambda as the integration layer also provides a centralized place to enforce token-aware request handling, such as rejecting oversized requests, truncating optional context, or applying consistent limits across users and tenants to manage compute usage. Retry logic is best handled in the client or integration layer for transient failures such as timeouts and throttling. Lambda can implement controlled retries with exponential backoff and jitter, while API Gateway timeouts help bound request lifetimes and prevent hung connections from consuming resources indefinitely. Because the model service is managed, the company avoids infrastructure management and focuses only on request shaping, safety, and resiliency behavior. Option B is not suitable because client-side polling is not true streaming, front-end token enforcement is insecure and inconsistent, and API Gateway does not provide model-aware retry behavior on its own. Option C introduces container hosting and scaling complexity, which increases operational overhead compared to serverless. Option D can work, but REST APIs are generally heavier than HTTP APIs for this pattern and do not reduce overhead compared to Option A. Therefore, Option A provides the required streaming and resiliency capabilities with the least infrastructure management effort.", "explanation_zh": "选项A是最佳解决方案，因为它满足流式传输、令牌控制和重试要求，同时通过使用完全托管的无服务器AWS服务保持低运维开销。Amazon API Gateway HTTP API为API提供了轻量级、经济高效的前端，并与AWS Lambda干净地集成以进行请求处理和安全控制。AWS Lambda响应流式传输允许API在有部分模型输出可用时立即开始向客户端返回内容，减少了感知延迟，改善了较长响应的用户体验。使用Lambda作为集成层还提供了一个集中的地方来执行令牌感知的请求处理，例如拒绝过大的请求、截断可选上下文，或跨用户和租户应用一致的令牌限制以管理计算使用。重试逻辑最好在客户端或集成层处理短暂的故障，如超时和限流。Lambda可以实现带有指数退避和抖动的受控重试，而API Gateway超时帮助限制请求生命周期，防止挂起的连接无限消耗资源。由于模型服务是托管的，公司避免了基础设施管理，只专注于请求整形、安全和弹性行为。选项B不合适，因为客户端轮询不是真正的流式传输，前端令牌执行不安全且不一致，API Gateway本身不提供模型感知的重试行为。选项C引入了容器托管和扩展复杂性，与无服务器相比增加了运维开销。选项D也可以工作，但REST API通常比HTTP API更重，用于此模式时不会减少与选项A相比的开销。因此，选项A以最少的基础设施管理工作提供了所需的流式传输和弹性能力。"}, {"id": 88, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is implementing a serverless inference API by using AWS Lambda. The API will dynamically \ninvoke multiple AI models hosted on Amazon Bedrock. The company needs to design a solution that can \nswitch between model providers without modifying or redeploying Lambda code in real time. The design \nmust include safe rollout of configuration changes and validation and rollback capabilities. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在使用AWS Lambda实现一个无服务器推理API。该API将动态调用托管在Amazon Bedrock上的多个AI模型。公司需要设计一个解决方案，能够在不修改或重新部署Lambda代码的情况下，实时切换模型提供商。设计必须包含配置变更的安全推出、验证和回滚能力。哪种解决方案能满足这些要求？", "options_en": ["Store the active model provider in AWS Systems Manager Parameter Store. Configure a Lambda \nfunction to read the parameter at runtime to determine which model to invoke.", "Store the active model provider in AWS AppConfig. Configure a Lambda function to read the \nconfiguration at runtime to determine which model to invoke.", "Configure an Amazon API Gateway REST API to route requests to separate Lambda functions. \nHardcode each Lambda function to a specific model provider. Switch the integration target manually.", "Store the active model provider in a JSON file hosted on Amazon S3. Use AWS AppConfig to \nreference the S3 file as a hosted configuration source. Configure a Lambda function to read the file \nthrough AppConfig at runtime to determine which model to invoke."], "options_zh": ["将活跃模型提供商存储在AWS Systems Manager Parameter Store中。配置Lambda函数在运行时读取该参数以决定调用哪个模型。", "将活跃模型提供商存储在AWS AppConfig中。配置Lambda函数在运行时读取配置以决定调用哪个模型。", "配置Amazon API Gateway REST API将请求路由到不同的Lambda函数。将每个Lambda函数硬编码为特定的模型提供商。手动切换集成目标。", "将活跃模型提供商存储在托管在Amazon S3上的JSON文件中。使用AWS AppConfig引用S3文件作为托管的配置源。配置Lambda函数在运行时通过AppConfig读取文件以决定调用哪个模型。"], "a": "B", "explanation_en": "Option B is the correct solution because AWS AppConfig is specifically designed to support dynamic configuration management with safe rollout, validation, and rollback, which are explicit requirements in the scenario. By storing the active model provider configuration in AWS AppConfig, the company can switch between Amazon Bedrock model providers in real time without redeploying Lambda code. AppConfig supports deployment strategies such as canary releases, linear rollouts, and immediate deployments, allowing safe and controlled changes. If a configuration causes issues, AppConfig supports automatic rollback, reducing operational risk. AWS AppConfig also supports schema validation, ensuring that configuration values such as model identifiers, provider names, or inference parameters are valid before being applied. This prevents misconfiguration from impacting production workloads. Option A uses Parameter Store, which lacks native rollout strategies, validation, and automated rollback, making it unsuitable for safe real-time switching. Option C requires manual routing changes and code coupling, increasing operational overhead and deployment risk. Option D introduces unnecessary complexity by hosting configuration files in Amazon S3 when AppConfig already supports native hosted configurations. Therefore, Option B provides the most robust, scalable, and low-maintenance solution for dynamic model switching in a serverless Amazon Bedrock inference architecture.", "explanation_zh": "选项B是正确的，因为AWS AppConfig专门设计用于支持动态配置管理，具有安全推出、验证和回滚功能，这正是本场景中的明确要求。通过将活跃模型提供商配置存储在AWS AppConfig中，公司可以实时在Amazon Bedrock模型提供商之间切换，而无需重新部署Lambda代码。AppConfig支持部署策略，如金丝雀发布、线性推出和即时部署，允许安全可控的变更。如果配置导致问题，AppConfig支持自动回滚，降低了运维风险。AWS AppConfig还支持模式验证，确保模型标识符、提供商名称或推理参数等配置值在应用前有效。这防止了配置错误影响生产工作负载。选项A使用Parameter Store，缺乏原生的推出策略、验证和自动回滚，不适合安全的实时切换。选项C需要手动路由更改和代码耦合，增加了运维开销和部署风险。选项D通过将配置文件托管在Amazon S3中引入了不必要的复杂性，而AppConfig已经支持原生托管的配置。因此，选项B为无服务器Amazon Bedrock推理架构中的动态模型切换提供了最健壮、可扩展和低维护的解决方案。"}, {"id": 89, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A specialty coffee company has a mobile app that generates personalized coffee roast profiles by using \nAmazon Bedrock with a three-stage prompt chain. The prompt chain converts user inputs into structured \nmetadata, retrieves relevant logs for coffee roasts, and generates a personalized roast recommendation for \neach customer. Users in multiple AWS Regions report inconsistent roast recommendations for identical inputs, slow \ninference during the retrieval step, and unsafe recommendations such as brewing at excessively high \ntemperatures. The company must improve the stability of outputs for repeated inputs. The company must also \nimprove app performance and the safety of the app’s outputs. The updated solution must ensure 99.5% output \nconsistency for identical inputs and achieve inference latency of less than 1 second. The solution must also \nblock unsafe or hallucinated recommendations by using validated safety controls. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家精品咖啡公司有一个移动应用程序，使用Amazon Bedrock通过三阶段提示链生成个性化咖啡烘焙方案。该提示链将用户输入转换为结构化的元数据，检索相关的咖啡烘焙日志，并为每位顾客生成个性化的烘焙推荐。多个AWS区域的用户报告称，相同输入得到的烘焙推荐不一致，检索步骤推理速度慢，以及出现不安全的推荐，如建议使用过高温度冲泡。公司必须提高相同输入的输出稳定性。公司还必须提高应用程序性能和输出安全性。更新后的解决方案必须确保相同输入达到99.5%的输出一致性，推理延迟低于1秒。解决方案还必须使用经过验证的安全控制措施阻止不安全或虚构的推荐。哪种解决方案能满足这些要求？", "options_en": ["Deploy Amazon Bedrock with provisioned throughput to stabilize inference latency. Apply Amazon \nBedrock guardrails with semantic denial rules to block unsafe outputs. Use Amazon Bedrock Prompt \nManagement to manage prompts by using approval workflows.", "Use Amazon Bedrock Agents to manage chaining. Log model inputs and outputs to Amazon \nCloudWatch Logs. Use logs from CloudWatch to perform A/B testing for prompt versions.", "Cache prompt results in Amazon ElastiCache. Use AWS Lambda functions to pre-process metadata and \nto trace end-to-end latency. Use AWS X-Ray to identify and remediate performance bottlenecks.", "Use Amazon Kendra to improve roast log retrieval accuracy. Store normalized prompt metadata within \nAmazon DynamoDB. Use AWS Step Functions to orchestrate multi-step prompts."], "options_zh": ["使用预置吞吐量部署Amazon Bedrock以稳定推理延迟。应用带有语义拒绝规则的Amazon Bedrock护栏阻止不安全输出。使用Amazon Bedrock Prompt Management通过审批工作流程管理提示。", "使用Amazon Bedrock Agents管理链式调用。将模型输入和输出记录到Amazon CloudWatch Logs。使用CloudWatch的日志对提示版本进行A/B测试。", "将提示结果缓存在Amazon ElastiCache中。使用AWS Lambda函数预处理元数据并跟踪端到端延迟。使用AWS X-Ray识别和修复性能瓶颈。", "使用Amazon Kendra提高烘焙日志检索准确性。将标准化的提示元数据存储在Amazon DynamoDB中。使用AWS Step Functions编排多步骤提示。"], "a": "A", "explanation_en": "Option A is the only choice that simultaneously addresses all three requirements: (1) higher output consistency for identical inputs, (2) sub-1-second performance, and (3) validated safety controls that block unsafe or hallucinated recommendations. Provisioned throughput in Amazon Bedrock reserves capacity for the chosen model, which helps stabilize latency and reduces the chance of throttling or variable response times across Regions. This is important for a mobile app with strict latency goals and users distributed across multiple Regions. While provisioned throughput primarily improves performance predictability, it also reduces variability caused by contention during peak demand. Amazon Bedrock guardrails provide validated safety controls to filter or block unsafe content. Semantic denial rules are appropriate for preventing dangerous brewing guidance (for example, excessively high temperatures) and for reducing hallucinated instructions that violate safety policies. Guardrails can be enforced consistently regardless of prompt-chain complexity, providing a uniform safety layer around the model outputs. Amazon Bedrock Prompt Management supports controlled prompt versioning and approval workflows. By standardizing prompts, controlling changes, and ensuring the same prompt version is used for identical inputs, the company improves output stability and reduces drift caused by unmanaged prompt edits. Combined with strict configuration control (including fixed inference parameters such as temperature where appropriate), this improves repeatability and increases the likelihood of achieving the 99.5% consistency target. Option B improves observability and experimentation but does not provide strong safety enforcement or latency stabilization. Option C improves performance through caching and tracing but does not provide validated safety controls and does not directly address cross-Region output consistency. Option D may improve retrieval but does not enforce safety controls or ensure repeatable outputs. Therefore, Option A best meets the stability, performance, and safety requirements using AWS-native controls.", "explanation_zh": "选项A是唯一能同时解决所有三个要求的选择：（1）相同输入更高的输出一致性，（2）低于1秒的性能，以及（3）阻止不安全或虚构推荐的经过验证的安全控制。Amazon Bedrock中的预置吞吐量为所选模型预留容量，有助于稳定延迟，减少跨区域限流或响应时间变化的风险。这对于具有严格延迟目标和用户分布在多个区域的移动应用非常重要。虽然预置吞吐量主要提高性能可预测性，它也减少了高峰需求期间争用引起的变化。Amazon Bedrock护栏提供经过验证的安全控制来过滤或阻止不安全内容。语义拒绝规则适用于防止危险的冲泡指导（例如过高的温度），以及减少违反安全策略的虚构指令。无论提示链的复杂性如何，都可以一致地强制护栏，在模型输出周围提供统一的安全层。Amazon Bedrock Prompt Management支持受控的提示版本控制和审批工作流程。通过标准化提示、控制变更，并确保对相同输入使用相同的提示版本，公司提高了输出稳定性，减少了未管理提示编辑引起的漂移。结合严格的配置控制（包括适当的固定推理参数，如temperature），提高了可重复性，增加了达到99.5%一致性目标的可能。选项B改进了可观测性和实验能力，但不提供强大的安全执行或延迟稳定。选项C通过缓存和跟踪提高了性能，但不提供经过验证的安全控制，也不直接解决跨区域的输出一致性问题。选项D可能改善检索，但不强制执行安全……"}, {"id": 90, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company developed a multimodal content analysis application by using Amazon Bedrock. The application \nroutes different content types (text, images, and code) to specialized foundation models (FMs). The application needs to handle multiple types of routing decisions. Simple routing based on file extension \nmust have minimal latency. Complex routing based on content semantics requires analysis before FM \nselection. The application must provide detailed history and support fallback options when primary FMs fail. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司使用Amazon Bedrock开发了一个多模态内容分析应用程序。该应用程序将不同类型的内容（文本、图像和代码）路由到专门的基础模型（FM）。应用程序需要处理多种路由决策。基于文件扩展名的简单路由必须具有最小延迟。基于内容语义的复杂路由在进行FM选择前需要分析。应用程序必须提供详细的历史记录，并在主要FM失败时支持回退选项。哪种解决方案能满足这些要求？", "options_en": ["Configure AWS Lambda functions that call Amazon Bedrock FMs for all routing logic. Use conditional \nstatements to determine the appropriate FM based on content type and semantics.", "Create a hybrid solution. Handle simple routing based on file extensions in application code. Handle \ncomplex content-based routing by using an AWS Step Functions state machine with JSONata for \ncontent analysis and the InvokeModel API for specialized FMs.", "Deploy separate AWS Step Functions workflows for each content type with routing logic in AWS \nLambda functions. Use Amazon EventBridge to coordinate between workflows when fallback to \nalternate FMs is required.", "Use Amazon SQS with different SQS queues for each content type. Configure AWS Lambda \nconsumers that analyze content and invoke appropriate FMs based on message attributes by using \nAmazon Bedrock with an AWS SDK."], "options_zh": ["配置AWS Lambda函数，对所有路由逻辑调用Amazon Bedrock FM。使用条件语句根据内容类型和语义确定合适的FM。", "创建混合解决方案。在应用代码中处理基于文件扩展名的简单路由。使用带有JSONata进行内容分析的AWS Step Functions状态机处理基于内容的复杂路由，并使用InvokeModel API调用专门的FM。", "为每种内容类型部署独立的AWS Step Functions工作流程，路由逻辑在AWS Lambda函数中。使用Amazon EventBridge在工作流程之间进行协调，当需要回退到备用FM时。", "为每种内容类型使用不同的Amazon SQS队列。配置AWS Lambda消费者，根据消息属性分析内容并使用AWS SDK调用Amazon Bedrock中合适的FM。"], "a": "B", "explanation_en": "Option B is the most appropriate solution because it directly aligns with AWS-recommended architectural patterns for building scalable, observable, and resilient generative AI applications on Amazon Bedrock. The requirements clearly distinguish between simple and complex routing decisions, and this option addresses both in an optimal way. Simple routing based on file extension is latency sensitive. Handling this logic directly in the application code avoids unnecessary orchestration, state transitions, and service calls. This approach ensures that straightforward requests, such as routing images to vision-capable foundation models or text files to language models, are processed with minimal overhead and maximum performance. For complex routing based on content semantics, AWS Step Functions is specifically designed for multi-step workflows that require analysis, branching logic, and error handling. Semantic routing often requires inspecting meaning, intent, or structure before selecting the appropriate foundation model. Step Functions enables this by orchestrating analysis steps and applying conditional logic to determine the correct model to invoke using the Amazon Bedrock InvokeModel API. A key requirement is detailed execution history. Step Functions provides built-in execution tracing, including state inputs, outputs, and error details, which is essential for auditing, debugging, and compliance. Additionally, Step Functions supports native retry and catch mechanisms, allowing the workflow to automatically fall back to alternate foundation models if a primary model invocation fails. This directly satisfies the fallback requirement without introducing excessive custom code. The other options lack one or more critical capabilities. Lambda-only logic lacks deep observability and structured fallback handling, SQS introduces additional latency and limited workflow visibility, and multiple coordinated workflows increase architectural complexity without added benefit.", "explanation_zh": "选项B是最合适的解决方案，因为它直接符合AWS推荐的在Amazon Bedrock上构建可扩展、可观察和弹性的生成式AI应用程序的架构模式。需求明确区分了简单和复杂的路由决策，该选项以最佳方式解决了这两类需求。基于文件扩展名的简单路由对延迟敏感。直接在应用程序代码中处理此逻辑避免了不必要的编排、状态转换和服务调用。这种方法确保简单的请求，如将图像路由到视觉能力基础模型或将文本文件路由到语言模型，以最小开销和最大性能进行处理。对于基于内容语义的复杂路由，AWS Step Functions专门设计用于需要分析、分支逻辑和错误处理的多步骤工作流程。语义路由通常需要检查含义、意图或结构，然后选择合适的基础模型。Step Functions通过编排分析步骤并应用条件逻辑，使用Amazon Bedrock InvokeModel API确定正确的模型来调用。一个关键的需求是详细的执行历史。Step Functions提供内置的执行跟踪，包括状态输入、输出和错误详情，这对审计、调试和合规至关重要。此外，Step Functions支持原生的重试和捕获机制，允许工作流在主要模型调用失败时自动回退到备用基础模型。这直接满足了回退需求，而无需引入过多的自定义代码。其他选项缺少一个或多个关键能力……"}, {"id": 91, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company needs a system to automatically generate study materials from multiple content sources. The \ncontent sources include document files (PDF files, PowerPoint presentations, and Word documents) and \nmultimedia files (recorded videos). The system must process more than 10,000 content sources daily with \npeak loads of 500 concurrent uploads. The system must also extract key concepts from document files and \nmultimedia files and create contextually accurate summaries. The generated study materials must support real-\ntime collaboration with version control. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司需要一个系统，从多个内容源自动生成学习材料。内容源包括文档文件（PDF文件、PowerPoint演示文稿和Word文档）和多媒体文件（录制视频）。系统必须每天处理超过10,000个内容源，峰值负载为500个并发上传。系统还必须从文档文件和多媒体文件中提取关键概念，并生成上下文准确的摘要。生成的学习材料必须支持实时协作和版本控制。哪种解决方案能满足这些要求？", "options_en": ["Use Amazon Bedrock Data Automation (BDA) with AWS Lambda functions to orchestrate document \nfile processing. Use Amazon Bedrock Knowledge Bases to process all multimedia. Store the content in \nAmazon DocumentDB with replication. Collaborate by using Amazon SNS topic subscriptions. Track \nchanges by using Amazon Bedrock Agents.", "Use Amazon Bedrock Data Automation (BDA) with foundation models (FMs) to process document \nfiles. Integrate BDA with Amazon Textract for PDF extraction and with Amazon Transcribe for \nmultimedia files. Store the processed content in Amazon S3 with versioning enabled. Store the \nmetadata in Amazon DynamoDB. Collaborate in real time by using AWS AppSync GraphQL \nsubscriptions and DynamoDB.", "Use Amazon Bedrock Data Automation (BDA) with Amazon SageMaker AI endpoints to host content \nextraction and summarization models. Use Amazon Bedrock Guardrails to extract content from all file \ntypes. Store document files in Amazon Neptune for time series analysis. Collaborate by using Amazon \nBedrock Chat for real-time messaging.", "Use Amazon Bedrock Data Automation (BDA) with AWS Lambda functions to process batches of \ncontent files. Fine-tune foundation models (FMs) in Amazon Bedrock to classify documents across all \ncontent types. Store the processed data in Amazon ElastiCache (Redis OSS) by using Cluster Mode \nwith sharding. Use Prompt management in Amazon Bedrock for version control."], "options_zh": ["使用Amazon Bedrock Data Automation（BDA）和AWS Lambda函数编排文档文件处理。使用Amazon Bedrock Knowledge Bases处理所有多媒体。将内容存储在带有复制的Amazon DocumentDB中。通过Amazon SNS主题订阅进行协作。使用Amazon Bedrock Agents跟踪变更。", "使用Amazon Bedrock Data Automation（BDA）配合基础模型（FM）处理文档文件。将BDA与Amazon Textract集成以进行PDF提取，与Amazon Transcribe集成以处理多媒体文件。将处理后的内容存储在启用版本控制的Amazon S3中。将元数据存储在Amazon DynamoDB中。通过AWS AppSync GraphQL订阅和DynamoDB进行实时协作。", "使用Amazon Bedrock Data Automation（BDA）配合Amazon SageMaker AI端点托管内容提取和摘要模型。使用Amazon Bedrock护栏从所有文件类型中提取内容。将文档文件存储在Amazon Neptune中用于时间序列分析。通过Amazon Bedrock Chat进行实时消息协作。", "使用Amazon Bedrock Data Automation（BDA）配合AWS Lambda函数处理批量内容文件。在Amazon Bedrock中微调基础模型（FM）以对所有内容类型进行分类。将处理后的数据存储在带有分片集群模式的Amazon ElastiCache（Redis OSS）中。使用Amazon Bedrock中的提示管理进行版本控制。"], "a": "B", "explanation_en": "Option B best fulfills all functional, scalability, and collaboration requirements by combining purpose-built AWS services with Amazon Bedrock capabilities. Amazon Bedrock Data Automation is designed to orchestrate large-scale, multimodal data processing pipelines and integrates naturally with foundation models for summarization and concept extraction. Using BDA to process document files ensures consistent preprocessing and model invocation at scale, which is essential for handling more than 10,000 sources per day with high concurrency. Integrating Amazon Textract for PDFs enables accurate extraction of structured and unstructured text from scanned and digital documents, while Amazon Transcribe is the appropriate service for converting recorded videos into text for downstream semantic analysis. These services are optimized for their respective media types and feed clean, normalized inputs into Bedrock foundation models, improving the quality of contextual summaries. Storing processed content in Amazon S3 with versioning enabled directly addresses the requirement for version control. S3 versioning provides immutable object history and rollback capabilities without additional complexity. Metadata storage in Amazon DynamoDB supports high-throughput, low-latency access patterns and scales automatically to handle peak upload concurrency. Real-time collaboration is achieved through AWS AppSync GraphQL subscriptions combined with DynamoDB. AppSync enables real-time updates to connected clients whenever study materials are created or modified, making it well suited for collaborative editing and live synchronization. DynamoDB streams integrate seamlessly with AppSync to propagate changes efficiently. The other options misuse services or fail to meet key requirements. Amazon SNS does not support collaborative state synchronization, Amazon DocumentDB is not optimized for versioned document storage, Amazon Neptune is unsuitable for document-centric workloads, and Amazon ElastiCache is not designed for durable storage or version control. Option B aligns with AWS best practices for scalable, multimodal generative AI systems built on Amazon Bedrock.", "explanation_zh": "选项B最好地满足所有功能、可扩展性和协作要求，结合了专为特定用途构建的AWS服务和Amazon Bedrock功能。Amazon Bedrock Data Automation（BDA）专为编排大规模、多模态数据处理流水线而设计，并自然地与用于摘要和概念提取的基础模型集成。使用BDA处理文档文件确保了一致的预处理和大规模模型调用，这对于每天处理超过10,000个源文件和高并发至关重要。集成Amazon Textract处理PDF可以从扫描和数字文档中准确提取结构化和非结构化文本，而Amazon Transcribe是将录制的视频转换为文本以进行下游语义分析的合适服务。这些服务针对各自的媒体类型进行了优化，为Bedrock基础模型提供干净、标准化的输入，提高了上下文摘要的质量。将处理后的内容存储在启用版本控制的Amazon S3中直接满足了版本控制的要求。S3版本控制提供不可变的对象历史和回滚能力，无需额外复杂性。在Amazon DynamoDB中存储元数据支持高吞吐量、低延迟的访问模式，并自动扩展以处理峰值上传并发。通过AWS AppSync GraphQL订阅结合DynamoDB实现实时协作。AppSync在学习材料创建或修改时，向连接的客户端启用实时更新，非常适合协作编辑和实时同步。DynamoDB流与AppSync无缝集成，高效传播变更。其他选项误用了服务或未能满足关键要求……"}, {"id": 92, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "An insurance company uses existing Amazon SageMaker AI infrastructure to support a web-based application \nthat allows customers to predict what their insurance premiums will be. The company stores customer data that is used to train the SageMaker AI model in an Amazon S3 bucket. The dataset is growing rapidly. The \ncompany wants a solution to continuously re-train the model. The solution must automatically re-train and re-\ndeploy the model to the application when an employee uploads a new customer data file to the S3 bucket. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家保险公司使用现有的Amazon SageMaker AI基础设施来支持一个基于Web的应用程序，该应用程序允许客户预测其保险费用。公司将用于训练SageMaker AI模型的客户数据存储在Amazon S3存储桶中。数据集正在快速增长。公司希望一个解决方案来持续重新训练模型。当员工向S3存储桶上传新的客户数据文件时，该解决方案必须自动重新训练并重新部署模型到应用程序。哪种解决方案能满足这些要求？", "options_en": ["Use AWS Glue to run an ETL job on each uploaded file. Configure the ETL job to use the AWS SDK \nto invoke the SageMaker AI model endpoint. Use real-time inference with the endpoint to re-deploy the \nmodel after it is re-trained on the updated customer dataset.", "Create an AWS Lambda function and webhook handlers to generate an event when an employee \nuploads a new file. Configure SageMaker Pipelines to re-deploy the model after it is re-trained on the \nupdated customer dataset. Use Amazon EventBridge to create an event bus. Set the Lambda function \nevent as the source and SageMaker Pipelines as the target.", "Create an AWS Step Functions Express workflow with AWS SDK integrations to retrieve the customer \ndata from the S3 bucket when an employee uploads a new file to the S3 bucket. Use a SageMaker Data \nWrangler flow to export the data from the S3 bucket to SageMaker Autopilot. Use the SageMaker \nAutopilot to re-deploy the model after it has been re-trained on the updated customer dataset.", "Create an AWS Step Functions Standard workflow. Configure the first state to call an AWS Lambda \nfunction to respond when an employee uploads a new file to the S3 bucket. Use a pipeline in \nSageMaker Pipelines to re-deploy the model after it has been re-trained on the updated customer \ndataset. Use the next state in the workflow to run the pipeline when the first state receives a response."], "options_zh": ["使用AWS Glue对每个上传的文件运行ETL作业。配置ETL作业使用AWS SDK调用SageMaker AI模型端点。使用该端点的实时推理，在模型基于更新后的客户数据集重新训练后重新部署模型。", "创建AWS Lambda函数和Webhook处理器，在员工上传新文件时生成事件。配置SageMaker Pipelines在模型基于更新后的客户数据集重新训练后重新部署模型。使用Amazon EventBridge创建一个事件总线。将Lambda函数事件设置为源，SageMaker Pipelines设置为目标。", "创建AWS Step Functions Express工作流程，使用AWS SDK集成在员工上传新文件到S3存储桶时从S3存储桶检索客户数据。使用SageMaker Data Wrangler流程将数据从S3存储桶导出到SageMaker Autopilot。使用SageMaker Autopilot在模型基于更新后的客户数据集重新训练后重新部署模型。", "创建AWS Step Functions Standard工作流程。配置第一个状态调用AWS Lambda函数以响应员工上传新文件到S3存储桶的事件。使用SageMaker Pipelines中的流水线在模型基于更新后的客户数据集重新训练后重新部署模型。使用工作流程中的下一个状态，在第一个状态收到响应时运行该流水线。"], "a": "D", "explanation_en": "Option is the best fit because it implements a reliable event-driven MLOps workflow that automates D retraining and redeployment with clear orchestration, auditability, and production-grade error handling. The requirement is explicit: whenever a new file is uploaded to Amazon S3, the system must retrain and then redeploy the model used by a web application. A common AWS pattern is to use an S3 event notification to trigger an function, which then starts a controlled workflow. In option D, Lambda serves as AWS Lambda the event handler that reacts immediately to the S3 upload event and passes the necessary context (bucket, object key, dataset version) into an state machine. AWS Step Functions Standard Step Functions Standard is appropriate for model retraining pipelines because training and deployment steps can be long-running and benefit from durable state, retries, and failure handling. It provides execution history, making it easier to troubleshoot why a particular retraining run failed and to prove which dataset version produced which model version. This operational visibility is critical when the dataset is “growing rapidly” and retraining is frequent. Within the workflow, is the right service to run the ML lifecycle stages in a Amazon SageMaker Pipelines repeatable way: data processing (if needed), training, evaluation/quality checks, model registration, and deployment to an endpoint used by the application. SageMaker Pipelines is purpose-built for CI/CD-style ML, supporting automated redeployments when a new approved model artifact is produced. By calling a pipeline execution from Step Functions, the company can add governance gates (for example, only deploy if evaluation metrics meet thresholds), and can apply consistent rollback and notification steps when deployment fails. The other options are weaker: confuses inference with retraining and does not provide deployment A orchestration. adds unnecessary webhook complexity and describes an awkward event bus configuration. B C introduces Autopilot/Data Wrangler, which may be useful but adds extra moving parts and is not required to meet the trigger-and-redeploy requirement.", "explanation_zh": "选项D是最佳选择，因为它实现了可靠的事件驱动型MLOps工作流程，具有清晰的编排、可审计性和生产级的错误处理，可自动进行重新训练和重新部署。需求很明确：每当新文件上传到Amazon S3时，系统必须重新训练然后重新部署Web应用程序使用的模型。一种常见的AWS模式是使用S3事件通知触发Lambda函数，然后启动一个受控的工作流程。在选项D中，Lambda作为事件处理器，立即响应S3上传事件，并将必要的上下文（存储桶、对象键、数据集版本）传递给Step Functions状态机。Step Functions Standard适用于模型重新训练流水线，因为训练和部署步骤可能长时间运行，受益于持久状态、重试和故障处理。它提供执行历史，更容易排查特定重新训练运行失败的原因，并证明哪个数据集版本产生了哪个模型版本。当数据集\"快速增长\"且重新训练频繁时，这种操作可见性至关重要。在工作流程中，SageMaker Pipelines是以可重复方式运行机器学习生命周期阶段的合适服务：数据处理（如果需要）、训练、评估/质量检查、模型注册和部署到应用程序使用的端点。SageMaker Pipelines专为CI/CD风格的机器学习而构建，当产生新的批准模型工件时支持自动重新部署。通过从Step Functions调用流水线执行，公司可以添加治理门控（例如，仅在评估指标满足阈值时部署），并可以在部署失败时应用一致的回滚和通知步骤。其他选项较弱……"}, {"id": 93, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A financial services company is developing a generative AI (GenAI) application that serves both premium \ncustomers and standard customers. The application uses AWS Lambda functions behind an Amazon API \nGateway REST API to process requests. The company needs to dynamically switch between AI models based \non which customer tier each user belongs to. The company also wants to perform A/B testing for new features \nwithout redeploying code. The company needs to validate model parameters like temperature and maximum \ntoken limits before applying changes. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家金融服务公司正在开发一个生成式AI（GenAI）应用程序，同时服务高级客户和标准客户。该应用程序使用Amazon API Gateway REST API后的AWS Lambda函数处理请求。公司需要根据用户所属的客户层级动态切换AI模型。公司还希望在不重新部署代码的情况下对新功能进行A/B测试。公司需要在应用变更前验证模型参数，如temperature和最大令牌限制。哪种解决方案能以最少运维开销满足这些要求？", "options_en": ["Create AWS Systems Manager Parameter Store parameters for each configuration. Use Lambda \nfunctions to poll for parameter updates. Use Amazon EventBridge events to trigger redeployments \nwhen configurations change.", "Store model configurations in Amazon DynamoDB tables. Optimize access patterns to retrieve \nconfigurations according to customer tier. Configure Lambda functions to query DynamoDB at the \nbeginning of each request to determine which model to use.", "Use AWS AppConfig to manage model configurations. Use feature flags to perform A/B testing. \nDefine JSON schema validation rules for model parameters. Configure Lambda functions to retrieve \nconfigurations by using the AWS AppConfig Agent.", "Create an Amazon ElastiCache (Redis OSS) cluster to store model configurations. Set short TTL \nvalues. Run custom validation logic in Lambda functions. Use Amazon CloudWatch metrics to monitor \nconfiguration usage."], "options_zh": ["为每个配置创建AWS Systems Manager Parameter Store参数。使用Lambda函数轮询参数更新。使用Amazon EventBridge事件在配置变更时触发重新部署。", "将模型配置存储在Amazon DynamoDB表中。优化访问模式以根据客户层级检索配置。配置Lambda函数在每个请求开始时查询DynamoDB以确定使用哪个模型。", "使用AWS AppConfig管理模型配置。使用功能标志进行A/B测试。为模型参数定义JSON模式验证规则。配置Lambda函数通过AWS AppConfig Agent检索配置。", "创建Amazon ElastiCache（Redis OSS）集群存储模型配置。设置较短的TTL值。在Lambda函数中运行自定义验证逻辑。使用Amazon CloudWatch指标监控配置使用情况。"], "a": "C", "explanation_en": "Option C is the correct solution because AWS AppConfig is purpose-built to manage dynamic application configurations with low latency, strong validation, and minimal operational overhead, which directly matches the company’s requirements. AWS AppConfig enables the company to centrally manage model selection logic, inference parameters, and customer-tier routing rules without redeploying Lambda functions. By using feature flags, the company can easily perform A/B testing of new models or prompt strategies by gradually rolling out changes to a subset of users or customer tiers. This allows experimentation and controlled releases without code changes. AppConfig also supports JSON schema validation, which is critical for validating parameters such as temperature, maximum token limits, and other model-specific settings before they are applied. This prevents invalid or unsafe configurations from being deployed and reduces the risk of runtime errors or degraded model behavior in production. Using the AWS AppConfig Agent allows Lambda functions to retrieve configurations efficiently with built-in caching and polling mechanisms, minimizing latency and avoiding excessive calls to configuration services. This approach scales well for high-throughput, low-latency applications such as GenAI APIs behind Amazon API Gateway. Option A introduces unnecessary redeployment logic and polling complexity. Option B requires building and maintaining custom configuration access patterns in DynamoDB and does not natively support feature flags or schema validation. Option D adds operational overhead by requiring ElastiCache cluster management and custom validation logic. Therefore, Option C provides the most scalable, flexible, and low-maintenance solution for dynamic model switching, A/B testing, and safe configuration management in a GenAI application.", "explanation_zh": "选项C是正确的，因为AWS AppConfig专为管理动态应用程序配置而设计，具有低延迟、强验证和最小运维开销，直接匹配公司的需求。AWS AppConfig使公司能够集中管理模型选择逻辑、推理参数和客户层级路由规则，而无需重新部署Lambda函数。通过使用功能标志，公司可以轻松地对新模型或提示策略进行A/B测试，逐步将变更推送到部分用户或客户层级。这允许在不更改代码的情况下进行实验和受控发布。AppConfig还支持JSON模式验证，这对于在应用前验证temperature、最大令牌限制和其他模型特定设置至关重要。这防止了无效或不安全的配置被部署，降低了生产环境中运行时错误或模型行为退化的风险。使用AWS AppConfig Agent使Lambda函数能够高效检索配置，具有内置缓存和轮询机制，最大限度地减少延迟，避免对配置服务的过多调用。这种方法适用于高吞吐量、低延迟的应用程序，如Amazon API Gateway后的GenAI API。选项A引入了不必要的重新部署逻辑和轮询复杂性。选项B需要构建和维护DynamoDB中的自定义配置访问模式，并且不原生支持功能标志或模式验证。选项D增加了运维开销，需要管理ElastiCache集群和自定义验证逻辑。因此，选项C为GenAI应用程序中的动态模型切换、A/B测试和安全配置管理提供了最可扩展、最灵活和最低维护的解决方案。"}, {"id": 94, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A retail company is using Amazon Bedrock to develop a customer service AI assistant. Analysis shows that \n70% of customer inquiries are simple product questions that a smaller model can effectively handle. However, \n30% of inquiries are complex return policy questions that require advanced reasoning. The company wants to implement a cost-effective model selection framework to automatically route customer \ninquiries to appropriate models based on inquiry complexity. The framework must maintain high customer \nsatisfaction and minimize response latency. Which solution will meet these requirements with the LEAST implementation effort? A. B. C. D.", "body_zh": "一家零售公司正在使用Amazon Bedrock开发一个客户服务AI助手。分析显示，70%的客户咨询是简单的产品问题，较小的模型可以高效处理。然而，30%的咨询是复杂的退换货政策问题，需要高级推理能力。公司希望实施一个经济高效的模型选择框架，根据咨询的复杂程度自动将客户咨询路由到合适的模型。该框架必须保持较高的客户满意度，并最小化响应延迟。哪种解决方案能以最少实施工作量满足这些要求？", "options_en": ["Create a multi-stage architecture that uses a small foundation model (FM) to classify the complexity of \neach inquiry. Route simple inquiries to a smaller, more cost-effective model. Route complex inquiries \nto a larger, more capable model. Use AWS Lambda functions to handle routing logic.", "Use Amazon Bedrock intelligent prompt routing to automatically analyze inquiries. Route simple \nproduct inquiries to smaller models and route complex return policy inquiries to more capable larger \nmodels.", "Implement a single-model solution that uses an Amazon Bedrock mid-sized foundation model (FM) \nwith on-demand pricing. Include special instructions in model prompts to handle both simple and \ncomplex inquiries by using the same model.", "Create separate Amazon Bedrock endpoints for simple and complex inquiries. Implement a rule-based \nrouting system based on keyword detection. Use on-demand pricing for the smaller model and \nprovisioned throughput for the larger model."], "options_zh": ["创建多阶段架构，使用小型基础模型（FM）对每次咨询的复杂程度进行分类。将简单咨询路由到更小、更具成本效益的模型。将复杂咨询路由到更大、能力更强的模型。使用AWS Lambda函数处理路由逻辑。", "使用Amazon Bedrock智能提示路由自动分析咨询。将简单的产品咨询路由到较小的模型，将复杂的退换货政策咨询路由到能力更强的大型模型。", "实现单模型解决方案，使用Amazon Bedrock中型基础模型（FM）配合按需定价。在模型提示中包含特殊指令，使用同一模型处理简单和复杂的咨询。", "为简单和复杂的咨询创建独立的Amazon Bedrock端点。实现基于关键词检测的规则路由系统。为较小的模型使用按需定价，为较大的模型使用预置吞吐量。"], "a": "B", "explanation_en": "Option B is the correct solution because it leverages native Amazon Bedrock intelligent prompt routing, which is specifically designed to reduce cost and complexity in multi-model GenAI architectures. Intelligent prompt routing automatically analyzes incoming prompts and selects the most appropriate foundation model based on prompt characteristics and complexity—without requiring custom classification logic or orchestration code. This approach directly meets the requirement for least implementation effort. The company does not need to deploy additional Lambda functions, maintain routing rules, or manage separate classification stages. Routing decisions are handled by Bedrock, which simplifies architecture and reduces operational risk. By routing the majority (70%) of simple product inquiries to smaller, lower-cost models, the company minimizes inference cost and latency. More complex return policy inquiries are automatically routed to larger models that provide better reasoning capabilities, preserving response quality and customer satisfaction. Because routing is handled inline by Bedrock, response latency remains low compared to multi-stage architectures that require an additional classification model call before inference. This is critical for customer service scenarios where responsiveness directly impacts satisfaction. Option A introduces additional inference steps and custom logic. Option C increases cost by overusing a mid- sized model for all queries. Option D relies on brittle keyword rules and increases operational overhead through endpoint management. Therefore, Option B delivers the optimal balance of cost efficiency, performance, and simplicity for dynamic model selection in Amazon Bedrock.", "explanation_zh": "选项B是正确的，因为它利用了原生的Amazon Bedrock智能提示路由，该功能专为降低多模型GenAI架构中的成本和复杂性而设计。智能提示路由自动分析传入的提示，并根据提示特征和复杂程度选择最合适的基础模型——无需自定义分类逻辑或编排代码。这种方法直接满足了最少实施工作量的要求。公司无需部署额外的Lambda函数、维护路由规则或管理单独的分类阶段。路由决策由Bedrock处理，简化了架构并降低了运维风险。通过将大部分（70%）简单产品咨询路由到更小、成本更低的模型，公司最小化了推理成本和延迟。更复杂的退换货政策咨询自动路由到提供更好推理能力的大型模型，保持了响应质量和客户满意度。由于路由由Bedrock内联处理，相比于需要额外分类模型调用后再进行推理的多阶段架构，响应延迟保持较低。这对于响应性直接影响客户满意度的客户服务场景至关重要。选项A引入了额外的推理步骤和自定义逻辑。选项B通过为所有查询过度使用中型模型增加了成本。选项D依赖脆弱的规则和通过端点管理增加的运维开销。因此，选项B在Amazon Bedrock中为动态模型选择提供了成本效率、性能和简洁性的最佳平衡。"}, {"id": 95, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is developing a customer support application that uses Amazon Bedrock foundation models \n(FMs) to provide real-time AI assistance to the company’s employees. The application must display AI-\ngenerated responses character by character as the responses are generated. The application needs to support \nthousands of concurrent users with minimal latency. The responses typically take 15 to 45 seconds to finish. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在开发一个客户支持应用程序，使用Amazon Bedrock基础模型（FM）为员工提供实时AI辅助。应用程序必须逐字符显示AI生成的响应。应用程序需要支持数千个并发用户，并具有最小延迟。响应通常需要15到45秒才能完成。哪种解决方案能满足这些要求？", "options_en": ["Configure an Amazon API Gateway WebSocket API with an AWS Lambda integration. Configure the \nWebSocket API to invoke the Amazon Bedrock InvokeModelWithResponseStream API and stream \npartial responses through WebSocket connections.", "Configure an Amazon API Gateway REST API with an AWS Lambda integration. Configure the REST \nAPI to invoke the Amazon Bedrock standard InvokeModel API and implement frontend client-side \npolling every 100 ms for complete response chunks.", "Implement direct frontend client connections to Amazon Bedrock by using IAM user credentials and \nthe InvokeModelWithResponseStream API without any intermediate gateway or proxy layer.", "Configure an Amazon API Gateway HTTP API with an AWS Lambda integration. Configure the \nHTTP API to cache complete responses in an Amazon DynamoDB table and serve the responses \nthrough multiple paginated GET requests to frontend clients."], "options_zh": ["配置带有AWS Lambda集成的Amazon API Gateway WebSocket API。配置WebSocket API调用Amazon Bedrock InvokeModelWithResponseStream API，并通过WebSocket连接流式传输部分响应。", "配置带有AWS Lambda集成的Amazon API Gateway REST API。配置REST API调用Amazon Bedrock标准InvokeModel API，并实现前端客户端每100毫秒轮询完整响应块的机制。", "实现前端客户端直接连接到Amazon Bedrock，使用IAM用户凭证和InvokeModelWithResponseStream API，不经过任何中间网关或代理层。", "配置带有AWS Lambda集成的Amazon API Gateway HTTP API。将完整响应缓存在Amazon DynamoDB表中，并通过多个分页GET请求将响应提供给前端客户端。"], "a": "A", "explanation_en": "This requirement explicitly calls for character-by-character streaming, long-running responses, low latency, and massive concurrency, which aligns directly with Amazon Bedrock streaming inference patterns. Amazon Bedrock provides the InvokeModelWithResponseStream API specifically for streaming partial model outputs as tokens are generated. This enables near-instant feedback to users instead of waiting for the full response to complete, which is essential when responses last up to 45 seconds. Amazon API Gateway WebSocket APIs are purpose-built for bidirectional, low-latency, server-initiated communication, allowing the backend to push characters or tokens to clients in real time. This eliminates inefficient polling and supports thousands of concurrent open connections. AWS Lambda integrates natively with WebSocket APIs and scales automatically with connection volume, enabling a fully managed, serverless architecture. This approach maintains security, centralized authentication, throttling, and observability while avoiding direct client access to Bedrock APIs. Option B introduces polling latency and unnecessary API overhead and does not provide true streaming. Option C violates AWS security best practices by exposing Bedrock directly to clients and does not scale securely. Option D only serves completed responses and cannot meet the real-time streaming requirement. Therefore, Option A is the only solution that fully satisfies streaming behavior, concurrency, latency, and managed-service constraints.", "explanation_zh": "此需求明确要求逐字符流式传输、长时间运行的响应、低延迟和大规模并发，这直接符合Amazon Bedrock流式推理模式。Amazon Bedrock提供InvokeModelWithResponseStream API，专门用于在生成令牌时流式传输部分模型输出。这使用户无需等待完整响应完成即可获得近乎即时的反馈，对于响应时间长达45秒的场景至关重要。Amazon API Gateway WebSocket API专为双向、低延迟、服务器发起的通信而设计，允许后端实时向客户端推送字符或令牌。这消除了低效的轮询，支持数千个并发开放连接。AWS Lambda与WebSocket API原生集成，并随连接量自动扩展，实现了完全托管的无服务器架构。这种方法在避免客户端直接访问Bedrock API的同时，保持了安全性、集中式身份验证、限流和可观测性。选项B引入了轮询延迟和不必要的API开销，不提供真正的流式传输。选项C违反AWS安全最佳实践，直接向客户端暴露Bedrock，且不能安全扩展。选项D仅服务于完成的响应，无法满足实时流式传输要求。因此，选项A是唯一能完全满足流式传输行为、并发性、延迟和托管服务约束的解决方案。"}, {"id": 96, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A retail company runs an application that makes product recommendations to customers on the company’s \nwebsite. The application uses Amazon Bedrock to generate recommendations by dynamically constructing \nprompts and sending them to foundation models (FMs). A GenAI developer has deployed an update to the \napplication that instructs the FM to include a specific promotional message when the FM generates a response \nto prompts. When the developer tests the application, the promotional message does not always appear in the \nresponses. When the promotional message does appear in the responses, it does not always flow with the rest \nof the text. The GenAI developer must ensure that the promotional message always appears in the FM \nresponses. Which solution will meet this requirement? A. B. C. D.", "body_zh": "一家零售公司运行一个应用程序，在公司的网站上向客户提供产品推荐。该应用程序使用Amazon Bedrock，通过动态构建提示并将其发送给基础模型（FM）来生成推荐。一位GenAI开发人员部署了对应用程序的更新，指示FM在生成响应时包含特定的促销信息。当开发人员测试应用程序时，促销信息并不总是出现在响应中。当促销信息出现在响应中时，它并不总是与其余文本连贯流畅。GenAI开发人员必须确保促销信息始终出现在FM响应中。哪种解决方案能满足这个要求？", "options_en": ["Use an Amazon Bedrock Guardrails filter on the prompt. Set the input filter strength to HIGH.", "Generate multiple response variants that include the promotional message in different ways. Use a \nreranker model to select the most coherent version based on relevance to the original prompt.", "Run the prompt through Amazon Bedrock. Process the response through Amazon Bedrock AgentCore \nto add the promotional message. Rerank the results by using the original prompt and the desired \nmessage as context.", "Reinforce the requirement to include the new promotional message within product recommendations by \nusing an output indicator in prompts to the FM."], "options_zh": ["在提示上使用Amazon Bedrock护栏过滤器。将输入过滤器强度设置为高。", "生成多个包含不同方式促销信息的响应变体。使用重排序模型根据与原始提示的相关性选择最连贯的版本。", "通过Amazon Bedrock运行提示。通过Amazon Bedrock AgentCore处理响应以添加促销信息。使用原始提示和期望消息作为上下文重新排序结果。", "通过在给FM的提示中使用输出指示符，强化在生成的产品推荐中包含新促销信息的要求。"], "a": "D", "explanation_en": "When a foundation model fails to include specific required content or fails to integrate it coherently, prompt engineering techniques like or \"wrappers\" are highly effective. By explicitly defining output indicators where the promotional message should appear (e.g., \"The response must end with the following message: [PROMO TEXT]\") or providing an example output structure, the developer reinforces the constraint within the model's generation path. This is more direct and less computationally expensive than generating multiple variants and reranking them (Option B) or adding complex post-processing layers (Option C). Guardrails (Option A) are intended for filtering harmful content rather than enforcing specific promotional copy insertion.", "explanation_zh": "当基础模型未能包含特定要求的内容或未能使其连贯集成时，提示工程技术（如输出指示符或\"包装器\"）非常有效。通过明确定义促销信息应出现的位置（例如\"响应必须以以下消息结尾：[促销文本]\"）或提供示例输出结构，开发人员在模型的生成路径中强化了约束。这比生成多个变体并重新排序（选项B）或添加复杂的后处理层（选项C）更直接且计算成本更低。护栏（选项A）旨在过滤有害内容，而非强制插入特定的促销文案。"}, {"id": 97, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A healthcare company is developing an application to process medical queries. The application must answer \ncomplex queries with high accuracy by reducing semantic dilution. The application must refer to domain-\nspecific terminology in medical documents to reduce ambiguity in medical terminology. The application must \nbe able to respond to 1,000 queries each minute with response times less than 2 seconds. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家医疗保健公司正在开发一个处理医疗查询的应用程序。该应用程序必须以高准确性回答复杂查询，减少语义稀释。应用程序必须引用医疗文档中的领域特定术语，以减少医学术语的歧义。应用程序必须能够每分钟响应1,000个查询，响应时间小于2秒。哪种解决方案能以最少运维开销满足这些要求？", "options_en": ["Use Amazon API Gateway to route incoming queries to an Amazon Bedrock agent. Configure the agent \nto use an Anthropic Claude model to decompose queries and an Amazon Titan model to expand \nqueries. Create an Amazon Bedrock knowledge base to store the reference medical documents.", "Configure an Amazon Bedrock knowledge base to store the reference medical documents. Enable query \ndecomposition in the knowledge base. Configure an Amazon Bedrock flow that uses a foundation \nmodel and the knowledge base to support the application.", "Use Amazon SageMaker AI to host custom ML models for both query decomposition and query \nexpansion. Configure Amazon Bedrock knowledge bases to store the reference medical documents. \nEncrypt the documents in the knowledge base.", "Create an Amazon Bedrock agent to orchestrate multiple AWS Lambda functions to decompose \nqueries. Create an Amazon Bedrock knowledge base to store the reference medical documents. Use the \nagent’s built-in knowledge base capabilities. Add deep research and reasoning capabilities to the agent \nto reduce ambiguity in the medical terminology."], "options_zh": ["使用Amazon API Gateway将传入查询路由到Amazon Bedrock代理。配置代理使用Anthropic Claude模型分解查询，使用Amazon Titan模型扩展查询。创建Amazon Bedrock知识库存储参考医疗文档。", "配置Amazon Bedrock知识库存储参考医疗文档。在知识库中启用查询分解。配置使用基础模型和知识库的Amazon Bedrock流程来支持应用程序。", "使用Amazon SageMaker AI托管用于查询分解和查询扩展的自定义ML模型。配置Amazon Bedrock知识库存储参考医疗文档。对知识库中的文档进行加密。", "创建Amazon Bedrock代理编排多个AWS Lambda函数以分解查询。创建Amazon Bedrock知识库存储参考医疗文档。使用代理的内置知识库功能。为代理添加深度研究和推理能力，以减少医学术语的歧义。"], "a": "B", "explanation_en": "Option B provides the least operational overhead because it keeps the solution primarily inside managed Amazon Bedrock capabilities, minimizing custom orchestration code and infrastructure to operate. The core requirements are domain grounding, reduced semantic dilution for complex questions, and consistent low- latency responses at high request volume. A Bedrock knowledge base is purpose-built for Retrieval Augmented Generation by ingesting domain documents, chunking content, generating embeddings, and retrieving the most relevant passages at runtime. This directly addresses the need to reference domain-specific medical terminology from authoritative documents to reduce ambiguity and improve factual accuracy. Reducing semantic dilution typically requires improving the retrieval query so that the retriever focuses on the most relevant concepts, especially for long or multi-intent questions. Enabling query decomposition allows the system to break a complex medical query into smaller, more targeted sub-queries. This increases retrieval precision and recall for each sub-question, which helps the model generate a more accurate synthesized response grounded in the retrieved medical context. Amazon Bedrock Flows provide a managed way to orchestrate multi-step generative AI workflows, such as preprocessing the input, performing retrieval against the knowledge base, invoking a foundation model, and formatting the final response. Because flows are managed, the company avoids maintaining custom state machines, multiple Lambda functions, or bespoke routing logic. This reduces operational overhead while still supporting repeatable, observable execution. Compared with the alternatives, option A introduces an agent plus API Gateway routing and multiple model choices, increasing configuration and runtime complexity. Option C requires hosting and scaling custom models on SageMaker AI, which adds significant operational burden and latency risk. Option D relies on multiple Lambda functions orchestrated by an agent, which adds more moving parts and increases cold-start and integration overhead. Option B most directly meets the requirements with the smallest operational footprint.", "explanation_zh": "选项B提供最少运维开销，因为它主要将解决方案保留在托管的Amazon Bedrock功能内，最大限度地减少了自定义编排代码和需要运维的基础设施。核心需求是领域接地、减少复杂问题的语义稀释，以及在高请求量下保持一致的低延迟响应。Bedrock知识库专为检索增强生成而设计，通过摄取领域文档、分块内容、生成embeddings并在运行时检索最相关的段落，直接满足了对权威医疗文档中领域特定术语的引用需求，以减少歧义并提高事实准确性。减少语义稀释通常需要改进检索查询，使检索器聚焦在最相关的概念上，特别是对于较长或多意图的问题。启用查询分解允许系统将复杂的医疗查询拆分为更小、更有针对性子查询。这提高了每个子问题的检索精度和召回率，有助于模型基于检索到的医疗上下文生成更准确的综合响应。Amazon Bedrock Flows提供了一种托管的方式来编排多步骤生成式AI工作流程，例如预处理输入、对知识库进行检索、调用基础模型以及格式化最终响应。由于flows是托管的，公司避免了维护自定义状态机、多个Lambda函数或定制路由逻辑的需要。这减少了运维开销，同时仍然支持可重复、可观察的执行。与其他选项相比，选项A引入了代理加API Gateway路由和多个模型选择，增加了配置和运行时复杂性。选项C需要在SageMaker AI上托管和扩展自定义模型，增加了显著的运维负担和延迟风险。选项D依赖于多个……"}, {"id": 98, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A legal research company has a Retrieval Augmented Generation (RAG) application that uses Amazon \nBedrock and Amazon OpenSearch Service. The application stores 768-dimensional vector embeddings for 15 \nmillion legal documents, including statutes, court rulings, and case summaries. The company's current chunking strategy segments text into fixed-length blocks of 500 tokens. The current \nchunking strategy often splits contextually linked information such as legal arguments, court opinions, or \nstatute references across separate chunks. Researchers report that generated outputs frequently omit key \ncontext or cite outdated legal information. Recent application logs show a 40% increase in response times. The p95 latency metric exceeds 2 seconds. \nThe company expects storage needs for the application to grow from 90 GB to 360 GB within a year. The company needs a solution to improve retrieval relevance and system performance at scale. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家法律研究公司有一个使用Amazon Bedrock和Amazon OpenSearch Service的检索增强生成（RAG）应用程序。该应用程序存储了1500万份法律文档的768维向量embeddings，包括法规、法院裁决和案例摘要。公司当前的分块策略将文本分割为固定长度的500令牌块。当前的分块策略经常将上下文关联的信息（如法律论证、法院意见或法规引用）分割到不同的块中。研究人员报告说，生成的输出经常遗漏关键上下文或引用过时的法律信息。最近的应用程序日志显示响应时间增加了40%。p95延迟指标超过2秒。公司预计应用程序的存储需求将在一年内从90 GB增长到360 GB。公司需要一个解决方案来改进检索相关性和大规模下的系统性能。哪种解决方案能满足这些要求？", "options_en": ["Increase the embedding vector dimensionality from 768 to 4,096 without changing the existing \nchunking or pre-processing strategy.", "Replace dynamic retrieval with static, pre-written summaries that are stored in Amazon S3. Use \nAmazon CloudFront to serve the summaries to reduce compute demand and improve predictability.", "Update the chunking strategy to use semantic boundaries such as complete legal arguments, clauses, or \nsections rather than fixed token limits. Regenerate vector embeddings to align with the new chunk \nstructure.", "Migrate from OpenSearch Service to Amazon DynamoDB. Implement keyword-based indexes to \nenable faster lookups for legal concepts."], "options_zh": ["在不改变现有分块或预处理策略的情况下，将embedding向量维度从768增加到4,096。", "用存储在Amazon S3中的静态预写摘要替换动态检索。使用Amazon CloudFront提供摘要，以减少计算需求并提高可预测性。", "更新分块策略，使用基于完整法律论证、条款或章节的语义边界，而非固定的令牌限制。重新生成向量embeddings以匹配新的分块结构。", "从OpenSearch Service迁移到Amazon DynamoDB。实现基于关键词的索引，以支持对法律概念的快速查询。"], "a": "C", "explanation_en": "Option C directly addresses both retrieval relevance and performance scalability. Fixed token chunking breaks semantic continuity in legal texts, causing incomplete context retrieval and degraded response quality. By switching to semantic chunking—based on legal arguments, clauses, or sections—the application preserves contextual integrity, improving retrieval accuracy and reducing hallucinations. Regenerating embeddings aligned with the new chunk structure also improves vector search efficiency, reducing unnecessary comparisons and helping control latency as the dataset scales. Option A increases cost and latency without fixing the core issue. Option B removes dynamic reasoning, which defeats the purpose of a legal RAG system. Option D discards vector semantics entirely and is unsuitable for nuanced legal research. Therefore, Option C is the correct and scalable solution.", "explanation_zh": "选项C直接解决了检索相关性和性能可扩展性问题。固定令牌分块破坏了法律文本中的语义连续性，导致上下文检索不完整和响应质量下降。通过切换到基于法律论证、条款或章节的语义分块，应用程序保持了上下文的完整性，提高了检索准确性并减少了幻觉。重新生成与新分块结构对齐的embeddings也提高了向量搜索效率，减少了不必要的比较，有助于在数据集扩展时控制延迟。选项A增加了成本和延迟，而没有解决核心问题。选项B移除了动态推理，违背了法律RAG系统的目的。选项D完全丢弃了向量语义，不适合细致的法律研究。因此，选项C是正确且可扩展的解决方案。"}, {"id": 99, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company has a recommendation system. The system's applications run on Amazon EC2 instances. The \napplications make API calls to Amazon Bedrock foundation models (FMs) to analyze customer behavior and \ngenerate personalized product recommendations. The system is experiencing intermittent issues. Some recommendations do not match customer preferences. \nThe company needs an observability solution to monitor operational metrics and detect patterns of operational \nperformance degradation compared to established baselines. The solution must also generate alerts with \ncorrelation data within 10 minutes when FM behavior deviates from expected patterns. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司有一个推荐系统。系统的应用程序运行在Amazon EC2实例上。应用程序调用Amazon Bedrock基础模型（FM）的API来分析客户行为并生成个性化产品推荐。系统正在经历间歇性问题。一些推荐与客户偏好不匹配。公司需要一个可观测性解决方案来监控运维指标，并检测与已建立基线相比的运维性能退化模式。当FM行为偏离预期模式时，该解决方案还必须在10分钟内生成带有相关性数据的告警。哪种解决方案能满足这些要求？", "options_en": ["Configure Amazon CloudWatch Container Insights for the application infrastructure. Set up \nCloudWatch alarms for latency thresholds. Add custom metrics for token counts by using the \nCloudWatch embedded metric format. Create CloudWatch dashboards to visualize the data.", "Implement AWS X-Ray to trace requests through the application components. Enable CloudWatch \nLogs Insights for error pattern detection. Set up AWS CloudTrail to monitor all API calls to Amazon \nBedrock. Create custom dashboards in Amazon QuickSight.", "Enable Amazon CloudWatch Application Insights for the application resources. Create custom metrics \nfor recommendation quality, token usage, and response latency by using the CloudWatch embedded \nmetric format with dimensions for request types and user segments. Configure CloudWatch anomaly \ndetection on the model metrics. Establish log pattern analysis by using CloudWatch Logs Insights.", "Use Amazon OpenSearch Service with the Observability plugin. Ingest model metrics and logs by \nusing Amazon Kinesis. Create custom Piped Processing Language (PPL) queries to analyze model \nbehavior patterns. Establish operational dashboards to visualize anomalies in real time."], "options_zh": ["为应用程序基础设施配置Amazon CloudWatch Container Insights。设置延迟阈值的CloudWatch告警。使用CloudWatch嵌入式指标格式添加令牌数量的自定义指标。创建CloudWatch仪表板以可视化数据。", "实施AWS X-Ray来跟踪通过应用程序组件的请求。启用CloudWatch Logs Insights进行错误模式检测。设置AWS CloudTrail监控所有对Amazon Bedrock的API调用。在Amazon QuickSight中创建自定义仪表板。", "为应用程序资源启用Amazon CloudWatch Application Insights。使用CloudWatch嵌入式指标格式创建推荐质量、令牌使用量和响应延迟的自定义指标，包含请求类型和用户分段的维度。对模型指标配置CloudWatch异常检测。通过CloudWatch Logs Insights建立日志模式分析。", "使用带有可观测性插件的Amazon OpenSearch Service。通过Amazon Kinesis摄取模型指标和日志。创建自定义Piped Processing Language（PPL）查询分析模型行为模式。建立运维仪表板实时可视化异常。"], "a": "C", "explanation_en": "Option C best satisfies the requirements because it combines application-aware observability, metric baselining, anomaly detection, and correlated alerting using fully managed AWS services with minimal operational overhead. Amazon CloudWatch Application Insights is designed to automatically monitor application health by analyzing metrics, logs, and events across EC2-based workloads. This aligns directly with the need to detect intermittent performance issues and deviations from expected behavior. By publishing custom metrics using the CloudWatch embedded metric format, the application can track generative AI–specific signals such as recommendation quality indicators, token usage, request volume, and response latency from Amazon Bedrock foundation model calls. Adding dimensions such as request type or user segment enables fine-grained visibility into which workloads or customer groups are impacted when recommendation quality degrades. A critical requirement is detecting degradation compared to established baselines and generating alerts within 10 minutes. CloudWatch anomaly detection automatically builds statistical models of normal behavior for time-series metrics and flags deviations without requiring manually tuned thresholds. This capability is well suited for monitoring foundation model behavior, which can vary subtly over time. When anomalies are detected, CloudWatch alarms can trigger notifications with contextual metric data quickly, meeting the alerting requirement. CloudWatch Logs Insights complements the metric-based view by enabling log pattern analysis and correlation. Engineers can query application logs and model response logs to identify recurring error patterns or shifts in output behavior that explain why recommendations no longer align with user preferences. Application Insights further correlates metrics and logs to surface probable root causes, reducing mean time to resolution. The other options lack one or more critical elements. Option A focuses on infrastructure-level metrics without baseline anomaly detection. Option B emphasizes tracing and auditing but does not provide automated performance deviation analysis. Option D offers flexibility but requires significantly more development and operational effort than a native CloudWatch-based solution.", "explanation_zh": "选项C最能满足要求，因为它结合了应用感知的可观测性、指标基线化、异常检测和相关性告警，使用了完全托管的AWS服务，运维开销最小。Amazon CloudWatch Application Insights设计用于通过分析EC2工作负载上的指标、日志和事件来自动监控应用程序健康状况。这直接符合检测间歇性性能问题和与预期行为偏离的需求。通过使用CloudWatch嵌入式指标格式发布自定义指标，应用程序可以跟踪生成式AI相关的信号，如推荐质量指标、令牌使用量、请求量和来自Amazon Bedrock基础模型调用的响应延迟。添加请求类型或用户分段等维度，可以在推荐质量下降时精细查看哪些工作负载或客户群受到影响。一个关键的需求是检测与已建立基线相比的退化，并在10分钟内生成告警。CloudWatch异常检测自动为时间序列指标构建正常行为的统计模型，并标记偏差，无需手动调整阈值。此功能非常适合监控基础模型行为，后者可能随时间微妙变化。当检测到异常时，CloudWatch告警可以快速触发带有上下文指标数据的通知，满足告警要求。CloudWatch Logs Insights补充了基于指标的视图，支持日志模式分析和相关性分析。工程师可以查询应用程序日志和模型响应日志，识别重复出现的错误模式或输出行为变化，解释为什么推荐不再符合用户偏好。Application Insights进一步关联指标和日志以显示可能的根本原因，减少平均解决时间。其他选项缺少一个或多个关键要素……"}, {"id": 100, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company uses an AI assistant application to summarize the company’s website content and provide \ninformation to customers. The company plans to use Amazon Bedrock to give the application access to a \nfoundation model (FM). The company needs to deploy the AI assistant application to a development environment and a production \nenvironment. The solution must integrate the environments with the FM. The company wants to test the \neffectiveness of various FMs in each environment. The solution must provide product owners with the ability \nto easily switch between FMs for testing purposes in each environment. Which solution will meet these requirements? A. B. C. D.  Create one AWS CDK application for the production environment. Configure the application to invoke", "body_zh": "一家公司使用AI助手应用程序汇总公司网站内容并向客户提供信息。公司计划使用Amazon Bedrock使应用程序能够访问基础模型（FM）。公司需要将AI助手应用程序部署到开发环境和生产环境。解决方案必须将环境与FM集成。公司希望在每个环境中测试各种FM的有效性。解决方案必须为产品所有者提供在每个环境中轻松切换FM以进行测试的能力。哪种解决方案能满足这些要求？", "options_en": ["Create one AWS CDK application. Create multiple pipelines in AWS CodePipeline. Configure each \npipeline to have its own settings for each FM. Configure the application to invoke the Amazon Bedrock \nFMs by using the aws_bedrock.ProvisionedModel.fromProvisionedModelArn() method.", "Create a separate AWS CDK application for each environment. Configure the applications to invoke \nthe Amazon Bedrock FMs by using the aws_bedrock.FoundationModel.fromFoundationModelId() \nmethod. Create a separate pipeline in AWS CodePipeline for each environment.", "Create one AWS CDK application. Configure the application to invoke the Amazon Bedrock FMs by \nusing the aws_bedrock.FoundationModel.fromFoundationModelId() method
