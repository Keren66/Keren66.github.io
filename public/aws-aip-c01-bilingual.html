<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS AIP-C01 中英双语题库 — AI Practitioner</title>
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --border: #334155;
  --orange: #f97316; --cyan: #06b6d4; --green: #22c55e; --red: #ef4444;
  --text: #f1f5f9; --text2: #94a3b8;
}
[data-theme="light"] {
  --bg: #ffffff; --card: #f0f4f8; --border: #cbd5e1;
  --orange: #ea580c; --cyan: #0891b2; --green: #16a34a; --red: #dc2626;
  --text: #1e293b; --text2: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
header { text-align: center; padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
header h1 { font-size: 1.6rem; background: linear-gradient(135deg, var(--orange), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--text2); font-size: 0.9rem; margin-top: 0.3rem; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
.controls select, .controls input, .controls button {
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 0.85rem; cursor: pointer;
}
.controls button:hover { border-color: var(--orange); }
.controls input { flex: 1; min-width: 120px; }
.btn-orange { background: var(--orange) !important; border-color: var(--orange) !important; color: #fff !important; font-weight: 600; }
.btn-cyan { background: var(--cyan) !important; border-color: var(--cyan) !important; color: #000 !important; font-weight: 600; }
.nav-btn { padding: 6px 10px; }
.nav-btn:hover { background: var(--orange); color: #fff; border-color: var(--orange); }
.progress-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.progress-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--cyan)); transition: width 0.3s; }
.progress-text { font-size: 0.8rem; color: var(--text2); white-space: nowrap; }
.q-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.q-card.correct-card { border-color: var(--green); }
.q-card.wrong-card { border-color: var(--red); }
.q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.q-num { font-size: 0.8rem; color: var(--cyan); font-weight: 600; }
.q-cat-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; color: #fff; }
.q-text { font-size: 1.05rem; margin-bottom: 14px; white-space: pre-wrap; }
.q-text-en { font-size: 1rem; margin-bottom: 10px; }
.q-text-zh { color: var(--text2); font-size: 0.95rem; margin-bottom: 8px; padding: 10px 14px; background: color-mix(in srgb,var(--cyan) 8%,var(--card)); border-radius: 8px; border-left: 2px solid var(--cyan); }
.options { list-style: none; }
.option { padding: 10px 14px; margin-bottom: 6px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.option:hover { background: color-mix(in srgb,var(--orange) 8%,var(--card)); border-color: var(--orange); }
.option.selected { border-color: var(--cyan); background: color-mix(in srgb,var(--cyan) 10%,var(--card)); }
.option.correct-answer { border-color: var(--green); background: color-mix(in srgb,var(--green) 10%,var(--card)); }
.option.wrong-answer { border-color: var(--red); background: color-mix(in srgb,var(--red) 10%,var(--card)); text-decoration: line-through; }
.option.disabled { pointer-events: none; opacity: 0.7; }
.opt-text { flex: 1; }
.opt-en { color: var(--text2); font-size: 0.85rem; margin-top: 2px; }
.explanation { display: none; margin-top: 14px; padding: 12px 16px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--cyan); }
.explanation.show { display: block; }
.explanation h4 { color: var(--cyan); margin-bottom: 6px; font-size: 0.9rem; }
.exp-en { color: var(--text); font-size: 0.9rem; }
.exp-zh { color: var(--text2); font-size: 0.85rem; margin-top: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.actions button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.actions button:hover { border-color: var(--orange); }
.actions .btn-primary { background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 600; }
.results { display: none; text-align: center; padding: 2rem; }
.results.show { display: block; }
.score-big { font-size: 3rem; font-weight: 700; }
.score-big.pass { color: var(--green); }
.score-big.fail { color: var(--red); }
.review-list { text-align: left; margin-top: 1.5rem; }
.review-item { padding: 8px 12px; margin: 4px 0; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.review-item:hover { background: var(--card); }
.review-item.correct { border-left: 3px solid var(--green); }
.review-item.wrong { border-left: 3px solid var(--red); }
.review-item .mark { font-weight: 700; font-size: 0.85rem; }
.review-item .mark.green { color: var(--green); }
.review-item .mark.red { color: var(--red); }
.hidden { display: none !important; }
@media (max-width: 600px) {
  .container { padding: 12px; }
  .q-card { padding: 14px 16px; }
  header h1 { font-size: 1.3rem; }
  .controls { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AWS Certified AI Practitioner — AIP-C01</h1>
    <p>中英双语题库 · 119 题 | Bilingual Practice · AI/ML on AWS</p>
  </header>

  <div class="controls">
    <select id="catFilter">
      <option value="all">📋 All Categories (119)</option>
      <option value="foundation">🧠 Foundation Model Integration (29)</option>
      <option value="implementation">🔧 Implementation & Integration (24)</option>
      <option value="operational">⚙️ Operational Efficiency & GenAI Ops (26)</option>
      <option value="testing">🧪 Testing, Validation & Troubleshooting (12)</option>
      <option value="safety">🛡️ Safety, Compliance & Governance (26)</option>
    </select>
    <select id="langMode">
      <option value="bilingual">🌐 中英双语</option>
      <option value="en">🇺🇸 English Only</option>
      <option value="zh">🇨🇳 中文 Only</option>
    </select>
    <input id="searchInput" type="text" placeholder="🔍 Search..." />
    <button id="themeToggle" onclick="toggleTheme()">☀️ Light</button>
    <span style="display:flex;align-items:center;gap:4px;">
      <button onclick="prevQuestion()" class="nav-btn" title="← 上一题">◀</button>
      <input id="qJumpInput" type="number" min="1" max="119" value="1"
        style="width:50px;padding:6px 4px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.85rem;text-align:center;"
        onkeydown="if(event.key==='Enter')jumpToQ()" />
      <span style="font-size:0.8rem;color:var(--text2)">/119</span>
      <button onclick="nextQuestion()" class="nav-btn" title="→ 下一题">▶</button>
    </span>
    <button onclick="showAnswer()" class="btn-cyan">💡 Show Answer</button>
    <button onclick="resetExam()" class="btn-orange">🔄 Reset</button>
  </div>

  <div class="progress-bar">
    <span class="progress-text" id="progressLabel">Q 0/119</span>
    <div class="progress-bg"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="scoreLabel">Score: -</span>
  </div>

  <div id="quizArea"></div>

  <div class="results" id="resultsArea">
    <div id="resultsContent"></div>
    <div class="review-list" id="reviewList"></div>
  </div>
</div>

<script>
// ===== BILINGUAL QUESTION DATA =====
const ALL_QUESTIONS = [{"id": 1, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "Example Corp provides a personalized video generation service that millions of enterprise customers use. \nCustomers generate marketing videos by submitting prompts to the company’s proprietary generative AI \n(GenAI) model. To improve output relevance and personalization, Example Corp wants to enhance the \nprompts by using customer-specific context such as product preferences, customer attributes, and business \nhistory. The customers have strict data governance requirements. The customers must retain full ownership and \ncontrol over their own data. The customers do not require real-time access. However, semantic accuracy must \nbe high and retrieval latency must remain low to support customer experience use cases. Example Corp wants to minimize architectural complexity in its integration pattern. Example Corp does not \nwant to deploy and manage services in each customer’s environment unless necessary. Which solution will meet these requirements? A. B. C. D.", "body_zh": "Example Corp提供一项个性化视频生成服务，供数百万企业客户使用。\n客户通过向公司专有的生成式AI（GenAI）模型提交提示词来生成营销视频。为了提高输出的相关性和个性化程度，Example Corp希望通过利用客户特定的上下文信息（如产品偏好、客户属性和业务历史）来增强提示词。客户有严格的数据治理要求。客户必须保留对其自身数据的完全所有权和控制权。客户不需要实时访问。但语义准确度必须很高，且检索延迟必须保持较低水平以支持客户体验用例。Example Corp希望在其集成模式中最小化架构复杂性。Example Corp不希望在每个客户的环境中部署和管理服务，除非必要。哪种解决方案能满足这些要求？", "options_en": ["Ensure that each customer sets up an Amazon Q Business index that includes the customer’s internal \ndata. Ensure that each customer designates Example Corp as a data accessor to allow Example Corp to \nretrieve relevant content by using a secure API to enrich prompts at runtime.", "Use federated search with Model Context Protocol (MCP) by deploying real-time MCP servers for each \ncustomer. Retrieve data in real time during prompt generation.", "Ensure that each customer configures an Amazon Bedrock knowledge base. Allow cross-account \nquerying so Example Corp can retrieve structured data for prompt augmentation.", "Configure Amazon Kendra to crawl customer data sources. Share the resulting indexes across accounts \nso Example Corp can query each customer’s Amazon Kendra index to retrieve augmentation data."], "options_zh": ["确保每个客户建立一个包含其内部数据的Amazon Q Business索引。确保每个客户将Example Corp指定为数据访问者，以便Example Corp能够通过安全的API检索相关内容，在运行时丰富提示词。", "使用Model Context Protocol (MCP)的联合搜索，为每个客户部署实时MCP服务器。在提示生成过程中实时检索数据。", "确保每个客户配置一个Amazon BedrockKnowledge Base。允许跨账户查询，以便Example Corp能够检索结构化数据用于提示增强。", "配置Amazon Kendra爬取客户数据源。跨账户共享结果索引，以便Example Corp可以查询每个客户的Amazon Kendra索引以检索增强数据。"], "a": "A", "explanation_en": "Option A is the correct solution because Amazon Q Business is explicitly designed to provide secure, governed access to enterprise data while preserving customer ownership and control. Each customer maintains their own Amazon Q Business index, which ensures that data never leaves the customer’s control boundary unless explicitly shared through approved access mechanisms. By designating Example Corp as a data accessor, customers can allow controlled, auditable access to their indexed content through secure APIs. This model satisfies strict data governance requirements, including data ownership, access transparency, and revocation capability. Customers do not need to expose raw data or deploy infrastructure in Example Corp’s environment. Amazon Q Business provides high semantic accuracy through managed indexing, ranking, and retrieval optimizations. Because real-time access is not required, this approach avoids the complexity and latency challenges of live federated retrieval while still delivering fast query performance suitable for customer experience use cases. Option B introduces unnecessary operational complexity by requiring real-time MCP servers per customer. Option C requires customers to manage Amazon Bedrock knowledge bases and enable cross-account access, which increases integration complexity and governance risk. Option D requires shared Amazon Kendra indexes across accounts, which complicates access control and data ownership boundaries. Therefore, Option A provides the cleanest, lowest-overhead architecture that meets data governance, accuracy, performance, and scalability requirements while minimizing operational burden for both Example Corp and its customers.", "explanation_zh": "选项A是正确的，因为Amazon Q Business专门设计用于提供安全、受治理的企业数据访问，同时保留客户的所有权和控制权。每个客户维护自己的Amazon Q Business索引，确保数据除非通过批准的访问机制明确共享，否则不会离开客户的控制边界。通过将Example Corp指定为数据访问者，客户可以允许通过安全API对其索引内容进行受控、可审计的访问。这种模式满足了严格的数据治理要求，包括数据所有权、访问透明度和撤销能力。客户无需在Example Corp的环境中暴露原始数据或部署基础设施。Amazon Q Business通过托管索引、排序和检索优化提供高语义准确度。由于不需要实时访问，这种方法避免了实时联合检索的复杂性和延迟挑战，同时仍能提供适合客户体验用例的快速查询性能。选项B引入了不必要的运营复杂性，需要为每个客户维护实时MCP服务器。选项C要求客户管理Amazon BedrockKnowledge Base并启用跨账户访问，这增加了集成复杂性和治理风险。选项D需要跨账户共享Amazon Kendra索引，这使访问控制和数据所有权边界复杂化。因此，选项A提供了最简洁、最低开销的架构，满足数据治理、准确性、性能和可扩展性要求，同时最小化了Example Corp及其客户的运营负担。"}, {"id": 2, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is creating a workflow to review customer-facing communications before the company sends the \ncommunications. The company uses a pre-defined message template to generate the communications and \nstores the communications in an Amazon S3 bucket. The workflow needs to capture a specific portion from \nthe template and send it to an Amazon Bedrock model. The workflow must store model responses back to the \noriginal S3 bucket. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在创建一个工作流，用于在发送面向客户的通信内容之前进行审核。该公司使用预定义的消息模板生成通信内容，并将通信内容存储在Amazon S3存储桶中。该工作流需要从模板中捕获特定部分，并将其发送给Amazon Bedrock模型。该工作流必须将模型响应存回原始S3存储桶。哪种解决方案能满足这些要求？", "options_en": ["Create a flow in Amazon Bedrock Flows. Configure S3 action nodes at the beginning and end of the \nflow to retrieve and store the communications and the model responses. In the middle of the flow, \nconfigure an expression to parse each communication. Configure an agent step to send the parsed input \nto the model for review.", "Create an AWS Step Functions Express workflow state machine. Use an Amazon S3 integration \nGetObject step to retrieve the original communications. Use an intrinsic function Pass step to parse the \ncommunications and to pass the results to an Amazon Bedrock InvokeModel step. Configure an \nAmazon S3 integration PutObject step to store the model responses back to the S3 bucket.", "Create an Amazon Bedrock agent that has an action group. Configure instructions to define how the \nagent should parse the communications. Configure the action group to retrieve the communications \nfrom the S3 bucket, invoke the Amazon Bedrock model, and store the model responses back to the S3 \nbucket.", "Create an Amazon Bedrock agent that has a single action group. Configure three AWS Lambda \nfunctions in the action group. Configure the functions to retrieve the communications from the S3 \nbucket, parse the communications and invoke the Amazon Bedrock model, and store the model \nresponses back to the S3 bucket."], "options_zh": ["在Amazon Bedrock Flows中创建一个流程。在流程的开始和结束处配置S3操作节点，用于检索和存储通信内容及模型响应。在流程中间，配置一个表达式来解析每条通信内容。配置一个代理步骤，将解析后的输入发送给模型进行审核。", "创建一个AWS Step Functions Express工作流状态机。使用Amazon S3集成GetObject步骤检索原始通信内容。使用内置函数Pass步骤解析通信内容，并将结果传递给Amazon Bedrock InvokeModel步骤。配置Amazon S3集成PutObject步骤，将模型响应存回S3存储桶。", "创建一个具有操作组的Amazon Bedrock代理。配置指令以定义代理应如何解析通信内容。配置操作组从S3存储桶检索通信内容、调用Amazon Bedrock模型，并将模型响应存回S3存储桶。", "创建一个只有一个操作组的Amazon Bedrock代理。在操作组中配置三个AWS Lambda函数。配置这些函数分别用于：从S3存储桶检索通信内容、解析通信内容并调用Amazon Bedrock模型、以及将模型响应存回S3存储桶。"], "a": "A", "explanation_en": "Option A is the correct answer because Amazon Bedrock Flows is purpose-built to orchestrate generative AI workflows that combine data access, deterministic transformations, and model invocation with minimal operational overhead. The requirements explicitly state that the workflow must retrieve content from Amazon S3, extract a specific portion of a predefined template, send that portion to an Amazon Bedrock model, and store the model’s response back into the same S3 bucket. Amazon Bedrock Flows natively supports all of these steps. By configuring S3 action nodes at the beginning and end of the flow, the workflow can retrieve the original communications and persist the reviewed output without custom code. The expression step allows deterministic parsing of a specific portion of the template, which is essential when only part of the message should be reviewed. This avoids relying on generative logic for parsing, which would be less predictable and harder to audit. The agent step is then used specifically for the review task, where the foundation model evaluates or modifies the extracted content. Option B uses AWS Step Functions, which can achieve similar outcomes but requires more explicit orchestration logic and does not provide GenAI-native constructs such as expressions and agent steps in a single managed experience. Options C and D rely on Amazon Bedrock agents and AWS Lambda functions to handle parsing and data movement, which increases complexity, operational overhead, and maintenance burden. Because Amazon Bedrock Flows directly integrates S3 actions, parsing expressions, and model review steps in a single managed workflow, Option A best meets the requirements with the least development and operational effort.", "explanation_zh": "选项A是正确的，因为Amazon Bedrock Flows是专门为编排生成式AI工作流而构建的，它结合了数据访问、确定性转换和模型调用，且运营开销极低。需求明确指出，工作流必须从Amazon S3检索内容、从预定义模板中提取特定部分、将该部分发送给Amazon Bedrock模型，并将模型的响应存回同一S3存储桶。Amazon Bedrock Flows原生支持所有这些步骤。通过在流程的开始和结束处配置S3操作节点，工作流可以无需自定义代码即可检索原始通信内容并保存审核后的输出。表达式步骤允许对模板的特定部分进行确定性解析，这在只有部分消息需要审核时至关重要。这避免了依赖生成式逻辑进行解析，因为生成式逻辑的可预测性较差且更难审计。代理步骤则专门用于审核任务，Foundation Model在该步骤中评估或修改提取的内容。选项B使用AWS Step Functions，虽然也能实现类似结果，但需要更明确的编排逻辑，并且不提供GenAI原生结构（如表达式和代理步骤）的单一托管体验。选项C和D依赖Amazon Bedrock代理和AWS Lambda函数来处理解析和数据移动，这增加了复杂性、运营开销和维护负担。由于Amazon Bedrock Flows在单个托管工作流中直接集成了S3操作、解析表达式和模型审核步骤，因此选项A以最小的开发和运营工作量最佳地满足了需求。"}, {"id": 3, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company is creating a Retrieval Augmented Generation (RAG) application that uses \nAmazon Bedrock to generate summaries of market activities. The application relies on a vector database that \nstores a small proprietary dataset with a low index count. The application must perform similarity searches. \nThe Amazon Bedrock model’s responses must maximize accuracy and maintain high performance. The company needs to configure the vector database and integrate it with the application. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司正在创建一个检索增强生成（RAG）应用程序，使用Amazon Bedrock生成市场活动摘要。该应用程序依赖一个向量数据库，存储一个索引数量较少的小型专有数据集。应用程序必须执行相似性搜索。Amazon Bedrock模型的响应必须最大化准确性并保持高性能。公司需要配置向量数据库并将其与应用程序集成。哪种解决方案能满足这些要求？", "options_en": ["Launch an Amazon MemoryDB cluster and configure the index by using the Flat algorithm. Configure \na horizontal scaling policy based on performance metrics.", "Launch an Amazon MemoryDB cluster and configure the index by using the Hierarchical Navigable \nSmall World (HNSW) algorithm. Configure a vertical scaling policy based on performance metrics.", "Launch an Amazon Aurora PostgreSQL cluster and configure the index by using the Inverted File with \nFlat Compression (IVFFlat) algorithm. Configure the instance class to scale to a larger size when the \nload increases.", "Launch an Amazon DocumentDB cluster that has an IVFFlat index and a high probe value. Configure \nconnections to the cluster as a replica set. Distribute reads to replica instances."], "options_zh": ["启动一个Amazon MemoryDB集群，并使用Flat算法配置索引。根据性能指标配置水平扩展策略。", "启动一个Amazon MemoryDB集群，并使用分层可导航小世界（HNSW）算法配置索引。根据性能指标配置垂直扩展策略。", "启动一个Amazon Aurora PostgreSQL集群，并使用带平坦压缩的倒排文件（IVFFlat）算法配置索引。配置实例类在负载增加时扩展到更大的规格。", "启动一个具有IVFFlat索引和高探测值（probe value）的Amazon DocumentDB集群。将连接配置为副本集。将读取操作分发到副本实例。"], "a": "B", "explanation_en": "Option B is the optimal solution because it maximizes similarity search accuracy and performance for a small, proprietary dataset while maintaining low operational complexity. Amazon MemoryDB is a fully managed, in- memory database that provides microsecond-level latency, making it ideal for real-time RAG workloads that require fast vector similarity searches. For small datasets with low index counts, the Hierarchical Navigable Small World (HNSW) algorithm is recommended by AWS for its high recall and accuracy. Unlike approximate methods optimized for massive datasets, HNSW excels at returning the most semantically relevant vectors with minimal loss of precision, which directly improves the quality of responses generated by the Amazon Bedrock foundation model. Vertical scaling in MemoryDB is sufficient for this use case because the dataset size is limited. Scaling up instance size provides increased memory and compute capacity without the complexity of managing distributed indexes or sharding strategies. This simplifies operations while maintaining predictable performance. Option A’s Flat algorithm is computationally expensive and inefficient at scale, even for moderate query volumes. Option C introduces higher latency and operational overhead by using a relational database not optimized for in-memory vector search. Option D is unsuitable because Amazon DocumentDB is not designed for high-performance vector similarity workloads and introduces unnecessary replica management complexity. Therefore, Option B best meets the requirements for accuracy, performance, and efficient integration with an Amazon Bedrock–based RAG application.", "explanation_zh": "选项B是最优方案，因为它为小型专有数据集最大化相似性搜索的准确性和性能，同时保持较低的运营复杂性。Amazon MemoryDB是一种完全托管的内存数据库，提供微秒级延迟，非常适合需要快速向量相似性搜索的实时RAG工作负载。对于索引数量较少的小型数据集，AWS推荐使用分层可导航小世界（HNSW）算法，因其具有高召回率和准确性。与针对海量数据集优化的近似方法不同，HNSW擅长以最小精度损失返回最语义相关的向量，这直接提高了Amazon BedrockFoundation Model生成响应的质量。对于此用例，MemoryDB中的垂直扩展已足够，因为数据集规模有限。向上扩展实例大小可提供更多的内存和计算能力，而无需管理分布式索引或分片策略的复杂性。这简化了运维，同时保持了可预测的性能。选项A的Flat算法计算开销大且效率低，即使对于中等查询量也是如此。选项C通过使用未针对内存向量搜索优化的关系型数据库，引入了更高的延迟和运营开销。选项D不合适，因为Amazon DocumentDB并非为高性能向量相似性工作负载而设计，并且引入了不必要的副本管理复杂性。因此，选项B最佳地满足了基于Amazon Bedrock的RAG应用程序对准确性、性能和高效集成的要求。"}, {"id": 4, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A healthcare company uses Amazon Bedrock to deploy an application that generates summaries of clinical \ndocuments. The application experiences inconsistent response quality with occasional factual hallucinations. \nMonthly costs exceed the company’s projections by 40%. A GenAI developer must implement a near real-\ntime monitoring solution to detect hallucinations, identify abnormal token consumption, and provide early \nwarnings of cost anomalies. The solution must require minimal custom development work and maintenance \noverhead. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗保健公司使用Amazon Bedrock部署一个生成临床文档摘要的应用程序。该应用程序遇到不一致的响应质量，偶尔出现事实性幻觉。月度成本超出公司预期的40%。一名GenAI开发人员必须实施一个近实时的监控解决方案，以检测幻觉、识别异常的Token消耗，并提供成本异常的早期预警。该解决方案需要最少的自定义开发工作和维护开销。哪种解决方案能满足这些要求？", "options_en": ["Configure Amazon CloudWatch alarms to monitor InputTokenCount and OutputTokenCount metrics to \ndetect anomalies. Store model invocation logs in an Amazon S3 bucket. Use AWS Glue and Amazon \nAthena to identify potential hallucinations.", "Run Amazon Bedrock evaluation jobs that use LLM-based judgments to detect hallucinations. \nConfigure Amazon CloudWatch to track token usage. Create an AWS Lambda function to process \nCloudWatch metrics. Configure the Lambda function to send usage pattern notifications.", "Configure Amazon Bedrock to store model invocation logs in an Amazon S3 bucket. Enable text output \nlogging. Configure Amazon Bedrock guardrails to run contextual grounding checks to detect \nhallucinations. Create Amazon CloudWatch anomaly detection alarms for token usage metrics.", "Use AWS CloudTrail to log all Amazon Bedrock API calls. Create a custom dashboard in Amazon \nQuickSight to visualize token usage patterns. Use Amazon SageMaker Model Monitor to detect quality \ndrift in generated summaries."], "options_zh": ["配置Amazon CloudWatch告警来监控InputTokenCount和OutputTokenCount指标以检测异常。将模型调用日志存储在Amazon S3存储桶中。使用AWS Glue和Amazon Athena识别潜在的幻觉。", "运行使用LLM作为评判模型的Amazon Bedrock评估任务来检测幻觉。配置Amazon CloudWatch跟踪Token使用量。创建一个AWS Lambda函数处理CloudWatch指标。配置Lambda函数发送使用模式通知。", "配置Amazon Bedrock将模型调用日志存储在Amazon S3存储桶中。启用文本输出日志记录。配置Amazon BedrockGuardrails运行上下文基础检查以检测幻觉。创建Amazon CloudWatch异常检测告警用于Token使用指标。", "使用AWS CloudTrail记录所有Amazon Bedrock API调用。在Amazon QuickSight中创建自定义仪表盘可视化Token使用模式。使用Amazon SageMaker Model Monitor检测生成摘要的质量漂移。"], "a": "C", "explanation_en": "Option C is the correct solution because it provides near real-time monitoring, hallucination detection, and cost anomaly awareness using built-in Amazon Bedrock and Amazon CloudWatch capabilities, with minimal custom development. By configuring Amazon Bedrock invocation logging with text output logging, the company captures detailed prompt and response data for auditing and analysis without building custom logging pipelines. This data is stored in Amazon S3, providing durable storage for compliance and retrospective investigation. Using Amazon Bedrock guardrails with contextual grounding checks allows the application to automatically detect hallucinations by verifying whether generated summaries are grounded in the provided clinical documents. This is the AWS-recommended approach for hallucination detection in RAG and summarization workloads and avoids the need to maintain custom evaluation models or pipelines. Creating Amazon CloudWatch anomaly detection alarms for InputTokenCount and OutputTokenCount metrics enables automatic detection of abnormal token usage patterns that often correlate with runaway prompts, inefficient summarization, or prompt injection attempts. Anomaly detection adapts dynamically to usage trends, making it more effective than static thresholds for early cost warnings. Option A introduces batch analytics with Glue and Athena, which is not near real time and increases operational overhead. Option B requires managing evaluation jobs and Lambda-based notification logic. Option D focuses on infrastructure-level monitoring and offline dashboards rather than near real-time GenAI quality and cost signals. Therefore, Option C best meets the requirements with the least operational effort and maintenance overhead.", "explanation_zh": "选项C是正确的，因为它利用Amazon Bedrock和Amazon CloudWatch的内置功能，以最少的自定义开发提供近实时的监控、幻觉检测和成本异常感知。通过配置Amazon Bedrock调用日志记录（含文本输出日志记录），公司无需构建自定义日志管道即可捕获详细的提示和响应数据用于审计和分析。这些数据存储在Amazon S3中，提供持久存储用于合规和回溯调查。使用带有上下文基础检查的Amazon BedrockGuardrails，应用程序可以通过验证生成的摘要是否基于提供的临床文档来自动检测幻觉。这是AWS推荐的用于RAG和摘要工作负载中幻觉检测的方法，避免了维护自定义评估模型或管道的需要。创建Amazon CloudWatch异常检测告警用于InputTokenCount和OutputTokenCount指标，可以自动检测异常的Token使用模式，这些模式通常与失控提示、低效摘要或提示注入尝试相关。异常检测能动态适应使用趋势，使其成为早期成本预警比静态阈值更有效的方案。选项A引入了使用Glue和Athena的批处理分析，这并非近实时，且增加了运营开销。选项B需要管理评估任务和基于Lambda的通知逻辑。选项C专注于基础设施级别的监控和离线仪表盘，而非近实时的GenAI质量和成本信号。因此，选项C以最少的运营工作和维护开销最佳地满足了需求。"}, {"id": 5, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A financial services company uses multiple foundation models (FMs) through Amazon Bedrock for its \ngenerative AI (GenAI) applications. To comply with a new regulation for GenAI use with sensitive financial \ndata, the company needs a token management solution. The token management solution must proactively alert when applications approach model-specific token \nlimits. The solution must also process more than 5,000 requests each minute and maintain token usage metrics \nto allocate costs across business units. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司通过Amazon Bedrock为其生成式AI（GenAI）应用程序使用多个Foundation Model (FM)。为了符合一项关于将GenAI用于敏感金融数据的新法规，公司需要一个Token管理解决方案。该Token管理解决方案必须在应用程序接近模型特定的Token限制时主动发出告警。该解决方案还必须每分钟处理超过5,000个请求，并维护Token使用指标以将成本分配到各个业务部门。哪种解决方案能满足这些要求？", "options_en": ["Develop model-specific tokenizers in an AWS Lambda function. Configure the Lambda function to \nestimate token usage before sending requests to Amazon Bedrock. Configure the Lambda function to \npublish metrics to Amazon CloudWatch and trigger alarms when requests approach thresholds. Store \ndetailed token usage in Amazon DynamoDB to report costs.", "Implement Amazon Bedrock Guardrails with token quota policies. Capture metrics on rejected requests. \nConfigure Amazon EventBridge rules to trigger notifications based on Amazon Bedrock Guardrails \nmetrics. Use Amazon CloudWatch dashboards to visualize token usage trends across models.", "Deploy an Amazon SQS dead-letter queue for failed requests. Configure an AWS Lambda function to \nanalyze token-related failures. Use Amazon CloudWatch Logs Insights to generate reports on token \nusage patterns based on error logs from Amazon Bedrock API responses.", "Use Amazon API Gateway to create a proxy for all Amazon Bedrock API calls. Configure request \nthrottling based on custom usage plans with predefined token quotas. Configure API Gateway to reject \nrequests that will exceed token limits."], "options_zh": ["在AWS Lambda函数中开发模型特定的分词器（tokenizer）。配置Lambda函数在发送请求到Amazon Bedrock之前估算Token使用量。配置Lambda函数将指标发布到Amazon CloudWatch，并在请求接近阈值时触发告警。将详细的Token使用数据存储在Amazon DynamoDB中以报告成本。", "实施带有Token配额策略的Amazon BedrockGuardrails。捕获被拒绝请求的指标。配置Amazon EventBridge规则，基于Amazon BedrockGuardrails指标触发通知。使用Amazon CloudWatch仪表盘可视化各模型的Token使用趋势。", "为失败的请求部署Amazon SQS死信队列。配置AWS Lambda函数分析Token相关的失败。使用Amazon CloudWatch Logs Insights基于Amazon Bedrock API响应的错误日志生成Token使用模式报告。", "使用Amazon API Gateway为所有Amazon Bedrock API调用创建代理。基于带有预定义Token配额的自定义使用计划配置请求限流。配置API Gateway拒绝将超过Token限制的请求。"], "a": "A", "explanation_en": "Option A is the correct solution because it provides proactive, model-aware token management with fine- grained visibility and alerting, which is required for regulated financial workloads. Amazon Bedrock currently exposes token usage metrics after invocation, but it does not natively enforce proactive, model-specific token limits across multiple applications or business units. By implementing model-specific tokenizers in AWS Lambda, the company can estimate input and output token usage before sending requests to Amazon Bedrock. This enables early detection of requests that are approaching or exceeding model limits and allows the application to block, truncate, or reroute requests proactively rather than reacting to failures. Publishing token usage metrics to Amazon CloudWatch enables real-time monitoring and alerting at scale, easily supporting more than 5,000 requests per minute. Storing detailed token usage data in Amazon DynamoDB allows the company to attribute usage and costs to specific applications, teams, or business units—an essential requirement for regulatory reporting and internal chargeback. Option B is incorrect because Amazon Bedrock Guardrails do not currently provide token quota enforcement or proactive token alerts. Option C is reactive and only analyzes failures after they occur. Option D throttles requests but cannot enforce token-based limits or provide per-model cost attribution. Therefore, Option A best satisfies proactive alerting, scalability, compliance reporting, and cost allocation requirements with acceptable operational effort.", "explanation_zh": "选项A是正确的，因为它提供了主动的、模型感知的Token管理，具有细粒度的可见性和告警能力，这是受监管的金融工作负载所必需的。Amazon Bedrock当前在调用后暴露Token使用指标，但本身并不原生强制实施跨多个应用程序或业务部门的主动的、模型特定的Token限制。通过在AWS Lambda中实现模型特定的分词器，公司可以在发送请求到Amazon Bedrock之前估算输入和输出Token使用量。这使得可以提前检测接近或超过模型限制的请求，并允许应用程序主动阻断、截断或重新路由请求，而不是被动响应失败。将Token使用指标发布到Amazon CloudWatch可实现大规模的实时监控和告警，轻松支持每分钟超过5,000个请求。将详细的Token使用数据存储在Amazon DynamoDB中，允许公司将使用情况和成本归因到特定应用程序、团队或业务部门——这是法规报告和内部成本分摊的基本要求。选项B不正确，因为Amazon BedrockGuardrails目前不提供Token配额执行或主动Token告警。选项C是被动的，仅在失败发生后进行分析。选项D限制请求但无法执行基于Token的限制或提供按模型的成本归属。因此，选项A以可接受的运营工作量最佳地满足了主动告警、可扩展性、合规报告和成本分配的要求。"}, {"id": 6, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company uses Amazon Bedrock to build a Retrieval Augmented Generation (RAG) system. The RAG \nsystem uses an Amazon Bedrock Knowledge Bases that is based on an Amazon S3 bucket as the data source \nfor emergency news video content. The system retrieves transcripts, archived reports, and related documents \nfrom the S3 bucket. The RAG system uses state-of-the-art embedding models and a high-performing retrieval setup. However, \nusers report slow responses and irrelevant results, which cause decreased user satisfaction. The company \nnotices that vector searches are evaluating too many documents across too many content types and over long \nperiods of time. The company determines that the underlying models will not benefit from additional fine-tuning. The \ncompany must improve retrieval accuracy by applying smarter constraints and wants a solution that requires \nminimal changes to the existing architecture. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司使用Amazon Bedrock构建一个检索增强生成（RAG）系统。该RAG系统使用基于Amazon S3存储桶作为数据源的Amazon BedrockKnowledge Base，用于存储紧急新闻视频内容。该系统从S3存储桶中检索转录文本、存档报告和相关文档。该RAG系统使用最先进的embedding model和高性能检索设置。然而，用户报告响应缓慢且结果不相关，导致用户满意度下降。公司注意到向量搜索在太多内容类型和过长的时间范围内评估了太多文档。公司确定对底层模型进行额外微调不会有帮助。公司必须通过应用更智能的约束来提高检索准确性，并希望采用一种需要对现有架构进行最小更改的解决方案。哪种解决方案能满足这些要求？", "options_en": ["Enhance embeddings by using a domain-adapted model that is specifically trained on emergency news \ncontent for improved vector similarity.", "Migrate to Amazon OpenSearch Service. Use vector fields and metadata filters to define the scope of \nresults retrieval.", "Enable metadata-aware filtering within the Amazon Bedrock knowledge base by indexing S3 object \nmetadata.", "Migrate to an Amazon Q Business index to perform structured metadata filtering and document \ncategorization during retrieval."], "options_zh": ["通过使用专门针对紧急新闻内容训练的领域自适应模型来增强嵌入，以改进向量相似性。", "迁移到Amazon OpenSearch Service。使用向量字段和元数据过滤器定义结果检索的范围。", "通过索引S3对象元数据，在Amazon BedrockKnowledge Base中启用元数据感知过滤。", "迁移到Amazon Q Business索引，在检索期间执行结构化元数据过滤和文档分类。"], "a": "C", "explanation_en": "Option C is the correct solution because it directly addresses the root cause of the problem—overly broad retrieval—while requiring minimal architectural change. Amazon Bedrock Knowledge Bases support metadata-aware filtering, which allows the system to constrain retrieval queries based on indexed metadata such as content type, publication date, source, or category. By indexing Amazon S3 object metadata, the company can restrict vector searches to relevant subsets of the corpus, such as recent emergency reports, specific content formats, or trusted sources. This significantly reduces the number of documents evaluated during retrieval, which improves both latency and result relevance without changing embedding models or retrieval infrastructure. This approach aligns with AWS best practices for optimizing RAG systems: when embeddings are already strong, retrieval quality is often improved by narrowing the candidate set rather than increasing model complexity. Metadata filtering reduces noise and ensures that retrieved documents are more contextually aligned with user queries. Option A requires retraining or adapting embedding models, which the company has already determined will not provide additional benefit. Option B introduces a migration to OpenSearch, which adds operational overhead and deviates from the existing Bedrock knowledge base architecture. Option D requires moving to a different indexing service, increasing complexity and implementation effort. Therefore, Option C provides the most effective and low-effort solution to improve retrieval accuracy and performance in the existing Amazon Bedrock RAG system.", "explanation_zh": "选项C是正确的，因为它直接解决了问题的根本原因——检索范围过于宽泛——同时需要最小的架构更改。Amazon BedrockKnowledge Base支持元数据感知过滤，允许系统基于索引的元数据（如内容类型、发布日期、来源或类别）来约束检索查询。通过索引Amazon S3对象元数据，公司可以将向量搜索限制在语料库的相关子集，例如最近的紧急报告、特定内容格式或可信来源。这显著减少了检索期间评估的文档数量，从而在不更改embedding model或检索基础设施的情况下改善延迟和结果相关性。这种方法符合AWS优化RAG系统的最佳实践：当嵌入已经很强时，通过缩小候选集而不是增加模型复杂度来改进检索质量。元数据过滤减少了噪声，确保检索到的文档与用户查询在上下文上更加一致。选项A需要重新训练或调整embedding model，而公司已经确定这不会带来额外收益。选项B引入了对OpenSearch的迁移，增加了运营开销，并且偏离了现有的BedrockKnowledge Base架构。选项D需要迁移到不同的索引服务，增加了复杂性和实施工作量。因此，选项C提供了最有效、最省力的方案，以改进现有Amazon Bedrock RAG系统的检索准确性和性能。"}, {"id": 7, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A publishing company is developing a chat assistant that uses a containerized large language model (LLM) \nthat runs on Amazon SageMaker AI. The architecture consists of an Amazon API Gateway REST API that \nroutes user requests to an AWS Lambda function. The Lambda function invokes a SageMaker AI real-time \nendpoint that hosts the LLM. Users report uneven response times. Analytics show that a high number of chats are abandoned after 2 \nseconds of waiting for the first token. The company wants a solution to ensure that p95 latency is under 800 \nms for interactive requests to the chat assistant. Which combination of solutions will meet this requirement? (Select TWO.) A. B. C. D. E.", "body_zh": "一家出版公司正在开发一个聊天助手，使用运行在Amazon SageMaker AI上的容器化大语言模型（LLM）。架构包括一个Amazon API Gateway REST API，将用户请求路由到AWS Lambda函数。Lambda函数调用托管LLM的SageMaker AI实时终端节点。用户报告响应时间不均衡。分析显示，大量聊天在等待第一个Token 2秒后被放弃。公司希望一种解决方案，确保交互式聊天助手请求的p95延迟低于800毫秒。哪两种解决方案的组合能满足这一要求？（选择两项。）", "options_en": ["Enable model preload upon container startup. Implement dynamic batching to process multiple user \nrequests together in a single inference pass.", "Select a larger GPU instance type for the SageMaker AI endpoint. Set the minimum number of \ninstances to 0. Continue to perform per-request processing. Lazily load model weights on the first \nrequest.", "Switch to a multi-model endpoint. Use lazy loading without request batching.", "Set the minimum number of instances to greater than 0. Enable response streaming.", "Switch to Amazon SageMaker Asynchronous Inference for all requests. Store requests in an Amazon \nS3 bucket. Set the minimum number of instances to 0."], "options_zh": ["在容器启动时启用模型预加载。实现动态批处理，将多个用户请求合并到一次推理过程中处理。", "为SageMaker AI终端节点选择更大的GPU实例类型。将最小实例数设置为0。继续按请求处理。在第一个请求时延迟加载模型权重。", "切换到多模型终端节点。使用延迟加载，不进行请求批处理。", "将最小实例数设置为大于0。启用响应流式传输。", "将所有请求切换到Amazon SageMaker异步推理。将请求存储在Amazon S3存储桶中。将最小实例数设置为0。"], "a": "A D", "explanation_en": "The correct answers are A and D because they directly reduce time-to-first-token and stabilize p95 latency for interactive, real-time chat workloads hosted on Amazon SageMaker AI real-time endpoints. Option D addresses the biggest driver of uneven latency: cold starts and scale-to-zero behavior. By setting the minimum number of instances to greater than 0, the endpoint always has warm capacity and loaded runtime resources, eliminating the first-request penalty that causes users to wait multiple seconds. Enabling response streaming improves perceived latency by returning the first tokens as soon as they are generated rather than waiting for the complete response. This directly targets the abandonment problem described (users leaving after waiting for the first token). Option A further improves p95 latency and throughput by removing model loading overhead during inference and improving GPU utilization. Preloading model weights during container startup ensures the model is ready before traffic arrives and avoids unpredictable on-demand weight loading. Dynamic batching increases efficiency by grouping compatible requests into a single inference pass, reducing per-request overhead and improving GPU saturation. When tuned properly for interactive workloads, batching can reduce tail latency while preserving responsiveness by enforcing small batch windows. Option B makes latency worse because setting minimum instances to 0 and lazily loading weights guarantees cold-start delays and unpredictable first-token performance. Option C similarly increases cold-start behavior through lazy loading and offers no batching benefits. Option E is designed for non-interactive workloads and introduces queueing and storage latency, which conflicts with the 800 ms p95 requirement for interactive chat. Therefore, A and D are the best combination to achieve consistently low p95 latency and fast first-token streaming for a SageMaker-hosted chat assistant.", "explanation_zh": "正确答案是A和D，因为它们直接减少了首个Token的生成时间，并稳定了托管在Amazon SageMaker AI实时终端节点上的交互式实时聊天工作负载的p95延迟。选项D解决了延迟不均衡的最大驱动因素：冷启动和缩减到零的行为。通过将最小实例数设置为大于0，终端节点始终有预热容量和已加载的运行时资源，消除了导致用户等待数秒的首个请求惩罚。启用响应流式传输通过尽快返回首个生成的Token（而不是等待完整响应完成）来改善感知延迟。这直接针对描述的用户放弃问题（用户在等待第一个Token后离开）。选项A通过消除推理期间的模型加载开销和提高GPU利用率进一步改善了p95延迟和吞吐量。在容器启动时预加载模型权重确保模型在流量到达之前已准备就绪，避免了不可预测的按需权重加载。动态批处理通过将兼容的请求分组到一次推理过程中来提高效率，减少了每个请求的开销并提高了GPU饱和度。当针对交互式工作负载进行适当调整时，批处理可以通过强制执行较小的批处理窗口来减少尾延迟，同时保持响应能力。选项B使延迟变得更糟，因为将最小实例数设置为0并延迟加载权重保证了冷启动延迟和不可预测的首个Token性能。选项C同样通过延迟加载增加了冷启动行为，并且不提供批处理收益。选项E专为非交互式工作负载设计，引入了排队和存储延迟，这与交互式聊天800毫秒p95的要求相冲突。因此，A和D是实现在SageMaker上托管的聊天助手中持续低p95延迟和快速首个Token流式传输的最佳组合。"}, {"id": 8, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company is building a customer support application that retrieves relevant financial \nregulation documents from a database based on semantic similarity to user queries. The application must \nintegrate with Amazon Bedrock to generate responses. The application must search documents in English, \nSpanish, and Portuguese. The application must filter documents by metadata such as publication date, \nregulatory agency, and document type. The database stores approximately 10 million document embeddings. To minimize operational overhead, the \ncompany wants a solution that minimizes management and maintenance effort while providing low-latency \nresponses for real-time customer interactions. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司正在构建一个客户支持应用程序，该程序根据与用户查询的语义相似性从数据库中检索相关金融法规文档。应用程序必须与Amazon Bedrock集成以生成响应。应用程序必须搜索英文、西班牙文和葡萄牙文的文档。应用程序必须按元数据（如发布日期、监管机构和文档类型）过滤文档。数据库存储约1000万个文档嵌入。为最小化运营开销，公司希望一种能够最小化管理和维护工作，同时为实时客户交互提供低延迟响应的解决方案。哪种解决方案能满足这些要求？", "options_en": ["Use Amazon OpenSearch Serverless to provide vector search capabilities and metadata filtering. \nIntegrate with Amazon Bedrock Knowledge Bases to enable Retrieval Augmented Generation (RAG) \nusing an Anthropic Claude foundation model.", "Deploy an Amazon Aurora PostgreSQL database with the pgvector extension. Store embeddings and \nmetadata in tables. Use SQL queries for similarity search and send results to Amazon Bedrock for \nresponse generation.", "Use Amazon S3 Vectors to configure a vector index and non-filterable metadata fields. Integrate S3 \nVectors with Amazon Bedrock for RAG.", "Set up an Amazon Neptune Analytics database with a vector index. Use graph-based retrieval and \nAmazon Bedrock for response generation."], "options_zh": ["使用Amazon OpenSearch Serverless提供向量搜索能力和元数据过滤。与Amazon BedrockKnowledge Base集成，使用Anthropic ClaudeFoundation Model启用检索增强生成（RAG）。", "部署带有pgvector扩展的Amazon Aurora PostgreSQL数据库。将嵌入和元数据存储在表中。使用SQL查询进行相似性搜索，并将结果发送到Amazon Bedrock进行响应生成。", "使用Amazon S3 Vectors配置向量索引和不可过滤的元数据字段。将S3 Vectors与Amazon Bedrock集成用于RAG。", "设置带有向量索引的Amazon Neptune Analytics数据库。使用基于图的检索和Amazon Bedrock进行响应生成。"], "a": "A", "explanation_en": "Option A is the optimal solution because it provides scalable semantic search, rich metadata filtering, and tight integration with Amazon Bedrock while minimizing operational overhead. Amazon OpenSearch Serverless is designed for high-volume, low-latency search workloads and removes the need to manage clusters, capacity planning, or scaling policies. With support for vector search and structured metadata filtering, OpenSearch Serverless enables efficient similarity search across 10 million embeddings while applying constraints such as language, publication date, regulatory agency, and document type. This is critical for financial services use cases where relevance and compliance depend on precise filtering. Integrating OpenSearch Serverless with Amazon Bedrock Knowledge Bases enables a fully managed RAG workflow. The knowledge base handles embedding generation, retrieval, and context assembly, while Amazon Bedrock generates responses using a foundation model. This significantly reduces custom glue code and operational complexity. Multilingual support is handled at the embedding and retrieval layer, allowing documents in English, Spanish, and Portuguese to be searched semantically without language-specific query logic. OpenSearch’s distributed architecture ensures consistent low-latency responses for real-time customer interactions. Option B increases operational overhead by requiring database tuning and scaling for vector workloads. Option C does not support advanced metadata filtering, which is a key requirement. Option D introduces unnecessary complexity and is not optimized for large-scale semantic document retrieval. Therefore, Option A best meets the requirements for performance, scalability, multilingual support, and minimal management effort in an Amazon Bedrock–based RAG application.", "explanation_zh": "选项A是最优方案，因为它提供了可扩展的语义搜索、丰富的元数据过滤以及与Amazon Bedrock的紧密集成，同时最小化了运营开销。Amazon OpenSearch Serverless专为高容量、低延迟的搜索工作负载设计，消除了管理集群、容量规划或扩展策略的需要。凭借对向量搜索和结构化元数据过滤的支持，OpenSearch Serverless可以在1000万个嵌入中高效执行相似性搜索，同时应用语言、发布日期、监管机构和文档类型等约束条件。这对于金融服务用例至关重要，因为相关性和合规性取决于精确过滤。将OpenSearch Serverless与Amazon BedrockKnowledge Base集成，可以实现完全托管的RAG工作流。Knowledge Base处理嵌入生成、检索和上下文组装，而Amazon Bedrock使用Foundation Model生成响应。这显著减少了自定义胶水代码和运营复杂性。多语言支持在嵌入和检索层处理，允许英文、西班牙文和葡萄牙文的文档无需特定语言的查询逻辑即可进行语义搜索。OpenSearch的分布式架构确保实时客户交互的一致低延迟响应。选项B需要数据库调优和扩展到向量工作负载，增加了运营开销。选项C不支持高级元数据过滤，这是一个关键需求。选项D引入了不必要的复杂性，且未针对大规模语义文档检索进行优化。因此，选项A在性能、可扩展性、多语言支持和最小管理精力方面最佳地满足了基于Amazon Bedrock的RAG应用程序的需求。"}, {"id": 9, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A healthcare company is developing a document management system that stores medical research papers in \nan Amazon S3 bucket. The company needs a comprehensive metadata framework to improve search precision \nfor a GenAI application. The metadata must include document timestamps, author information, and research \ndomain classifications. The solution must maintain a consistent metadata structure across all uploaded documents and allow \nfoundation models (FMs) to understand document context without accessing full content. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗保健公司正在开发一个文档管理系统，将医学研究论文存储在Amazon S3存储桶中。公司需要一个全面的元数据框架，以提高GenAI应用程序的搜索精度。元数据必须包括文档时间戳、作者信息和研究领域分类。该解决方案必须在所有上传的文档中保持一致的元数据结构，并允许Foundation Model (FM)在不访问完整内容的情况下理解文档上下文。哪种解决方案能满足这些要求？", "options_en": ["Store document timestamps in Amazon S3 system metadata. Use S3 object tags for domain \nclassification. Implement custom user-defined metadata to store author information.", "Set up S3 Object Lock with legal holds to track document timestamps. Use S3 object tags for author \ninformation. Implement S3 access points for domain classification.", "Use S3 Inventory reports to track timestamps. Create S3 access points for domain classification. Store \nauthor information in S3 Storage Lens dashboards.", "Use custom user-defined metadata to store author information. Use S3 Object Lock retention periods \nfor timestamps. Use S3 Event Notifications for domain classification."], "options_zh": ["将文档时间戳存储在Amazon S3系统元数据中。使用S3对象标签进行领域分类。实现自定义用户定义元数据来存储作者信息。", "设置带有法律保留（legal hold）的S3 Object Lock来跟踪文档时间戳。使用S3对象标签存储作者信息。实现S3接入点进行领域分类。", "使用S3 Inventory报告跟踪时间戳。创建S3接入点进行领域分类。将作者信息存储在S3 Storage Lens仪表盘中。", "使用自定义用户定义元数据存储作者信息。使用S3 Object Lock保留期限作为时间戳。使用S3事件通知进行领域分类。"], "a": "A", "explanation_en": "Option A is the correct solution because it uses native Amazon S3 metadata mechanisms to create a consistent, queryable, and model-friendly metadata framework with minimal complexity. S3 system metadata automatically records object creation and modification timestamps, providing reliable and consistent temporal context without additional processing. Custom user-defined metadata is the appropriate mechanism for storing structured attributes such as author information. These key-value pairs are stored directly with the object, remain consistent across uploads, and can be accessed programmatically by downstream indexing or retrieval systems used by GenAI applications. S3 object tags are ideal for domain classification because they are designed for lightweight categorization, filtering, and access control. Tags can be standardized across the organization to ensure consistent research domain labeling and can be consumed by search indexes or knowledge base ingestion pipelines without requiring access to the full document body. Together, system metadata, user-defined metadata, and object tags provide a clean separation of concerns: timestamps for temporal context, metadata for authorship, and tags for classification. This structure allows foundation models to reason about document context (such as recency, domain relevance, and authorship) based on metadata alone, improving retrieval precision and reducing unnecessary token usage. Options B, C, and D misuse features like Object Lock, access points, Storage Lens, or event notifications for purposes they were not designed for, adding complexity without improving metadata quality or model understanding. Therefore, Option A best satisfies the metadata consistency, context enrichment, and low-overhead requirements for GenAI-driven document analysis.", "explanation_zh": "选项A是正确的，因为它使用原生Amazon S3元数据机制来创建一致、可查询且对模型友好的元数据框架，且复杂性最低。S3系统元数据自动记录对象的创建和修改时间戳，提供了可靠且一致的时间上下文，无需额外处理。自定义用户定义元数据是存储作者信息等结构化属性的合适机制。这些键值对直接与对象一起存储，在上传之间保持一致，并且可以被GenAI应用程序使用的下游索引或检索系统以编程方式访问。S3对象标签非常适合领域分类，因为它们专为轻量级分类、过滤和访问控制而设计。标签可以在整个组织中标准化，以确保一致的研究领域标记，并且可以被搜索索引或Knowledge Base摄取管道使用，而无需访问完整的文档正文。系统元数据、用户定义元数据和对象标签共同提供了清晰的责任分离：时间戳用于时间上下文，元数据用于作者信息，标签用于分类。这种结构允许Foundation Model仅基于元数据推理文档上下文（如时效性、领域相关性和作者信息），从而提高检索精度并减少不必要的Token使用。选项B、C和D将Object Lock、接入点、Storage Lens或事件通知等特性用于非设计用途，增加了复杂性而没有改善元数据质量或模型理解能力。因此，选项A最佳地满足了对元数据一致性、上下文丰富性和低开销的要求，适用于GenAI驱动的文档分析。"}, {"id": 10, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is building a real-time voice assistant system to assist customer service representatives during \ncustomer calls. The system must convert audio calls to text with end-to-end latency of less than 500 ms. The \nsystem must use generative AI (GenAI) to produce response suggestions. Human supervisors must be able to \nrate the system's suggestions during a live customer call. The company must store all customer interactions to \ncomply with auditing policies. A. B. C. D.", "body_zh": "一家公司正在构建一个实时语音助手系统，以在客户通话期间协助客服代表。系统必须将音频通话转换为文本，端到端延迟低于500毫秒。系统必须使用生成式AI（GenAI）生成响应建议。人工主管必须能够在实时客户通话期间对系统的建议进行评分。公司必须存储所有客户交互以符合审计策略。", "options_en": ["Use the Amazon Transcribe streaming API with standard settings to convert speech to text. Use \nAmazon Bedrock batch processing to perform inference. Store call recordings and metadata in Amazon \nS3. Use S3 Lifecycle policies to manage the storage.", "Use the Amazon Transcribe streaming API with 100-ms audio chunks to optimize latency for the voice \nassistant. Call the Amazon Bedrock InvokeModelWithResponseStream operation to process client \ninquiries in real time. Store supervisor ratings in an Amazon DynamoDB table.", "Use Amazon Transcribe batch processing to perform post-call analysis. Configure AWS Lambda \nfunctions to generate responses by using the Amazon Bedrock InvokeModel operation. Use Amazon \nCloudWatch to log supervisor feedback.", "Use Amazon Transcribe to convert speech to text and to perform real-time analytics. Use Amazon \nComprehend to perform sentiment analysis. Use Amazon SQS to queue processing tasks. Run the \nAmazon Bedrock InvokeModel operation to generate responses."], "options_zh": ["使用带有标准设置的Amazon Transcribe流式API将语音转换为文本。使用Amazon Bedrock批处理进行推理。将通话录音和元数据存储在Amazon S3中。使用S3生命周期策略管理存储。", "使用带有100毫秒音频块的Amazon Transcribe流式API优化语音助手的延迟。调用Amazon Bedrock InvokeModelWithResponseStream操作实时处理客户查询。将主管评分存储在Amazon DynamoDB表中。", "使用Amazon Transcribe批处理进行通话后分析。配置AWS Lambda函数使用Amazon Bedrock InvokeModel操作生成响应。使用Amazon CloudWatch记录主管反馈。", "使用Amazon Transcribe将语音转换为文本并进行实时分析。使用Amazon Comprehend进行情感分析。使用Amazon SQS排队处理任务。运行Amazon Bedrock InvokeModel操作生成响应。"], "a": "B", "explanation_en": "To achieve the ultra-low latency requirement of less than 500 ms, the system must utilize streaming capabilities at every stage. Using with small (100-ms) audio chunks ensures Amazon Transcribe streaming that transcription begins immediately as the customer speaks. On the model side, Amazon Bedrock’s allows the application to receive tokens as they are generated, rather InvokeModelWithResponseStream than waiting for the entire completion, which is critical for real-time interactions. is the Amazon DynamoDB ideal choice for storing supervisor ratings during a live call because it provides the single-digit millisecond latency required for high-frequency writes without impacting the application's performance. Options involving batch processing or SQS queuing are unsuitable for sub-500 ms interactive requirements.", "explanation_zh": "为了实现低于500毫秒的超低延迟要求，系统必须在每个阶段使用流式传输能力。使用小的（100毫秒）音频块确保Amazon Transcribe流式传输在客户说话时立即开始转录。在模型端，Amazon Bedrock的InvokeModelWithResponseStream允许应用程序在Token生成时立即接收，而不是等待整个完成，这对于实时交互至关重要。Amazon DynamoDB是在实时通话期间存储主管评分的理想选择，因为它提供个位数毫秒的延迟，适用于高频写入而不会影响应用程序性能。涉及批处理或SQS排队的选项不适合低于500毫秒的交互式要求。"}, {"id": 11, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company wants to develop an Amazon Bedrock application that gives analysts the ability \nto query quarterly earnings reports and financial statements. The financial documents are typically 5–100 \npages long and contain both tabular data and text. The application must provide contextually accurate \nresponses that preserve the relationship between financial metrics and their explanatory text. To support \naccurate and scalable retrieval, the application must incorporate document segmentation and context \nmanagement strategies. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司希望开发一个Amazon Bedrock应用程序，使分析师能够查询季度收益报告和财务报表。这些财务文档通常为5-100页，包含表格数据和文本。应用程序必须提供上下文准确的响应，保留财务指标与其解释性文本之间的关系。为了支持准确且可扩展的检索，应用程序必须包含文档分段和上下文管理策略。哪种解决方案能满足这些要求？", "options_en": ["Use a direct model invocation approach that uses Anthropic Claude to process each financial document \nas a single input. Use fine-tuned prompts that instruct the model to parse tables and text separately.", "Use Amazon Bedrock Knowledge Bases to create a Retrieval Augmented Generation (RAG) \napplication that retrieves relevant information from contextually chunked sections of financial \ndocuments. Segment documents based on their structural layout. Include citations that reference the \noriginal source materials.", "Deploy an Amazon Bedrock agent that has an action group that calls custom AWS Lambda functions to \nanalyze financial documents. Configure the Lambda functions to perform fixed-size chunking when a \nuser submits a query about financial metrics.", "Create one specialized Amazon Bedrock application that is optimized for structured data. Create a \nsecond application that is optimized for unstructured data. Configure each application to use a tailored \nchunking strategy that is suited to the application's content type. Implement logic to link queries to the \nappropriate sources."], "options_zh": ["使用直接模型调用的方法，利用Anthropic Claude将每个财务文档作为单个输入处理。使用微调后的提示词指示模型分别解析表格和文本。", "使用Amazon BedrockKnowledge Base创建一个检索增强生成（RAG）应用程序，从按上下文分段的财务文档部分检索相关信息。根据文档的结构布局进行分段。包含引用原始材料的来源引用。", "部署一个具有操作组的Amazon Bedrock代理，该操作组调用自定义AWS Lambda函数来分析财务文档。当用户提交关于财务指标的查询时，配置Lambda函数执行固定大小的分块。", "创建一个专门针对结构化数据优化的Amazon Bedrock应用程序。创建第二个针对非结构化数据优化的应用程序。配置每个应用程序使用适合其内容类型的定制分块策略。实现将查询链接到适当来源的逻辑。"], "a": "B", "explanation_en": "Option best satisfies the requirements because it directly applies Retrieval Augmented Generation B principles using managed Amazon Bedrock Knowledge Bases, which are designed to handle large, complex documents while preserving contextual relationships. Financial reports often interleave tables with explanatory narrative, and accurate analysis depends on keeping those elements logically connected. By segmenting documents based on their —for example, sections, subsections, tables, and structural layout surrounding commentary—the knowledge base can retrieve semantically relevant chunks that maintain this relationship during inference. Amazon Bedrock Knowledge Bases support contextual chunking strategies that go beyond simple fixed-size segmentation. This is critical for financial documents, where a metric in a table may be explained in adjacent paragraphs or footnotes. Context-aware chunking ensures that retrieved content includes both the numeric data and its interpretation, enabling the foundation model to generate accurate, grounded responses. Including citations further improves analyst trust and auditability by allowing users to trace answers back to specific source sections, which is a common requirement in financial environments. Scalability is another key requirement. Knowledge Bases manage embedding generation, indexing, and retrieval orchestration as a managed service, which allows the solution to scale across large document collections without requiring custom infrastructure or model hosting. This approach also supports efficient updates as new quarterly reports are added, ensuring the retrieval layer remains current. Option does not scale well because processing entire 5–100 page documents in a single prompt increases A token usage, latency, and cost while risking context truncation. Option relies on fixed-size chunking C triggered at query time, which often breaks semantic relationships in structured financial content. Option D introduces unnecessary architectural complexity by splitting structured and unstructured data into separate applications, increasing operational overhead without providing better contextual retrieval than a unified RAG approach.", "explanation_zh": "选项B最佳地满足了要求，因为它直接应用了使用托管Amazon BedrockKnowledge Base的检索增强生成原则，这些Knowledge Base专为处理大型复杂文档而设计，同时保留上下文关系。财务报告通常将表格与解释性叙述交织在一起，准确的分析依赖于保持这些元素的逻辑连接。通过根据文档的结构布局（例如章节、子章节、表格和周围评论）进行分段，Knowledge Base可以在推理过程中检索语义相关的块，从而保持这种关系。Amazon BedrockKnowledge Base支持超越简单固定大小分段的上下文分块策略。这对于财务文档至关重要，其中表格中的指标可能在相邻段落或脚注中得到了解释。上下文感知的分块确保检索到的内容既包含数值数据也包含其解释，使Foundation Model能够生成准确、有依据的响应。包含引用进一步提高了分析师的可信度和可审计性，允许用户将答案追溯到特定的源章节，这在金融环境中是常见要求。可扩展性是另一个关键要求。Knowledge Base作为托管服务管理嵌入生成、索引和检索编排，使得解决方案能够在大型文档集合中扩展，而无需自定义基础设施或模型托管。这种方法还支持随着新季度报告的添加进行高效更新，确保检索层保持最新。选项A无法很好地扩展，因为在单个提示中处理5-100页的完整文档会增加Token使用量、延迟和成本，同时存在上下文截断的风险。选项C依赖在查询时触发的固定大小分块，这往往会破坏结构化财务内容中的语义关系。选项D引入了不必要的架构复杂性且增加了运营开销。因此，选项B提供了最完整、最可扩展且运营成本最低的解决方案。"}, {"id": 12, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "An ecommerce company operates a global product recommendation system that needs to switch between \nmultiple foundation models (FM) in Amazon Bedrock based on regulations, cost optimization, and \nperformance requirements. The company must apply custom controls based on proprietary business logic, \nincluding dynamic cost thresholds, AWS Region-specific compliance rules, and real-time A/B testing across \nmultiple FMs. The system must be able to switch between FMs without deploying new code. The system must route user \nrequests based on complex rules including user tier, transaction value, regulatory zone, and real-time cost \nmetrics that change hourly and require immediate propagation across thousands of concurrent requests. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家电商公司运营一个全球产品推荐系统，需要根据法规、成本优化和性能要求在Amazon Bedrock中的多个Foundation Model (FM)之间切换。公司必须基于专有业务逻辑应用自定义控制，包括动态成本阈值、特定AWS区域的合规规则以及跨多个FM的实时A/B测试。系统必须能够在不部署新代码的情况下切换FM。系统必须基于复杂规则路由用户请求，包括用户层级、交易金额、监管区域和实时成本指标，这些指标每小时变化一次，并且需要在数千个并发请求中立即传播。哪种解决方案能满足这些要求？", "options_en": ["Deploy an AWS Lambda function that uses environment variables to store routing rules and Amazon \nBedrock FM IDs. Use the Lambda console to update the environment variables when business \nrequirements change. Configure an Amazon API Gateway REST API to read request parameters to \nmake routing decisions.", "Deploy Amazon API Gateway REST API request transformation templates to implement routing logic \nbased on request attributes. Store Amazon Bedrock FM endpoints as REST API stage variables. Update \nthe variables when the system switches between models.", "Configure an AWS Lambda function to fetch routing configurations from the AWS AppConfig Agent \nfor each user request. Run business logic in the Lambda function to select the appropriate FM for each \nrequest. Expose the FM through a single Amazon API Gateway REST API endpoint.", "Use AWS Lambda authorizers for an Amazon API Gateway REST API to evaluate routing rules that \nare stored in AWS AppConfig. Return authorization contexts based on business logic. Route requests to \nmodel-specific Lambda functions for each Amazon Bedrock FM."], "options_zh": ["部署一个使用环境变量存储路由规则和Amazon Bedrock FM ID的AWS Lambda函数。当业务需求变化时，使用Lambda控制台更新环境变量。配置Amazon API Gateway REST API读取请求参数以做出路由决策。", "部署Amazon API Gateway REST API请求转换模板，基于请求属性实现路由逻辑。将Amazon Bedrock FM端点存储为REST API阶段变量。当系统在模型之间切换时更新变量。", "配置一个AWS Lambda函数，为每个用户请求从AWS AppConfig Agent获取路由配置。在Lambda函数中执行业务逻辑，为每个请求选择适当的FM。通过单个Amazon API Gateway REST API端点暴露FM。", "为Amazon API Gateway REST API使用AWS Lambda授权者，评估存储在AWS AppConfig中的路由规则。基于业务逻辑返回授权上下文。将请求路由到每个Amazon Bedrock FM对应的模型特定Lambda函数。"], "a": "C", "explanation_en": "Option C is the correct solution because AWS AppConfig is designed for real-time, validated, centrally managed configuration changes with safe rollout, immediate propagation, and rollback support—exactly matching the company’s requirements. By storing routing rules, cost thresholds, regulatory constraints, and A/B testing logic in AWS AppConfig, the company can switch between Amazon Bedrock foundation models without redeploying Lambda code. AppConfig supports feature flags, dynamic configuration updates, JSON schema validation, and staged rollouts, which are essential for safely managing complex and frequently changing routing logic. Using the AWS AppConfig Agent, Lambda functions can retrieve cached configurations efficiently, ensuring low latency even under thousands of concurrent requests. This approach allows the Lambda function to apply proprietary business logic—such as user tier, transaction value, Region compliance, and real-time cost metrics—before selecting the appropriate FM. Option A is operationally fragile because environment variable changes require function restarts and do not support validation or controlled rollouts. Option B is too limited for complex, dynamic logic and is difficult to maintain at scale. Option D misuses Lambda authorizers, which are intended for authentication and authorization, not high-frequency dynamic routing decisions. Therefore, Option C provides the most scalable, flexible, and low-overhead architecture for dynamic, regulation-aware FM routing in a global GenAI system.", "explanation_zh": "选项C是正确的，因为AWS AppConfig专为实时、经过验证、集中管理的配置变更而设计，支持安全 rollout、立即传播和回滚功能——完全符合公司的需求。通过将路由规则、成本阈值、监管约束和A/B测试逻辑存储在AWS AppConfig中，公司可以在不重新部署Lambda代码的情况下切换Amazon BedrockFoundation Model。AppConfig支持功能标志、动态配置更新、JSON Schema验证和分阶段 rollout，这对于安全管理复杂且频繁变化的路由逻辑至关重要。使用AWS AppConfig Agent，Lambda函数可以高效检索缓存配置，确保即使在数千个并发请求下也能保持低延迟。这种方法允许Lambda函数在选择适当的FM之前应用专有业务逻辑——如用户层级、交易金额、区域合规性和实时成本指标。选项A在操作上很脆弱，因为环境变量更改需要函数重启，且不支持验证或受控 rollout。选项B对于复杂动态逻辑过于有限，且难以大规模维护。选项D误用了Lambda授权者，后者旨在进行身份验证和授权，而非高频动态路由决策。因此，选项C为全球GenAI系统中动态的、符合法规的FM路由提供了最具可扩展性、灵活性和低开销的架构。"}, {"id": 13, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "An ecommerce company operates a global product recommendation system that needs to switch between \nmultiple foundation models (FMs) in Amazon Bedrock based on regulations, cost optimization, and \nperformance requirements. The company must apply custom controls based on proprietary business logic, \nincluding dynamic cost thresholds, AWS Region-specific compliance rules, and real-time A/B testing across \nmultiple FMs. The system must be able to switch between FMs without deploying new code. The system \nmust route user requests based on complex rules including user tier, transaction value, regulatory zone, and \nreal-time cost metrics that change hourly and require immediate propagation across thousands of concurrent \nrequests. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家电商公司运营一个全球产品推荐系统，需要根据法规、成本优化和性能要求在Amazon Bedrock中的多个Foundation Model (FM)之间切换。公司必须基于专有业务逻辑应用自定义控制，包括动态成本阈值、特定AWS区域的合规规则以及跨多个FM的实时A/B测试。系统必须能够在不部署新代码的情况下切换FM。系统必须基于复杂规则路由用户请求，包括用户层级、交易金额、监管区域和实时成本指标，这些指标每小时变化一次，并且需要在数千个并发请求中立即传播。哪种解决方案能满足这些要求？", "options_en": ["Deploy an AWS Lambda function that uses environment variables to store routing rules and Amazon \nBedrock FM IDs. Use the Lambda console to update the environment variables when business \nrequirements change. Configure an Amazon API Gateway REST API to read request parameters to \nmake routing decisions.", "Deploy Amazon API Gateway REST API request transformation templates to implement routing logic \nbased on request attributes. Store Amazon Bedrock FM endpoints as REST API stage variables. Update \nthe variables when the system switches between models.", "Configure an AWS Lambda function to fetch routing configuration from the AWS AppConfig Agent \nfor each user request. Run business logic in the Lambda function to select the appropriate FM for each \nrequest. Expose the FM through a single Amazon API Gateway REST API endpoint.", "Use AWS Lambda authorizers for an Amazon API Gateway REST API to evaluate routing rules that \nare stored in AWS AppConfig. Return authorization contexts based on business logic. Route requests to \nmodel-specific Lambda functions for each Amazon Bedrock FM."], "options_zh": ["部署一个使用环境变量存储路由规则和Amazon Bedrock FM ID的AWS Lambda函数。当业务需求变化时，使用Lambda控制台更新环境变量。配置Amazon API Gateway REST API读取请求参数以做出路由决策。", "部署Amazon API Gateway REST API请求转换模板，基于请求属性实现路由逻辑。将Amazon Bedrock FM端点存储为REST API阶段变量。当系统在模型之间切换时更新变量。", "配置一个AWS Lambda函数，为每个用户请求从AWS AppConfig Agent获取路由配置。在Lambda函数中执行业务逻辑，为每个请求选择适当的FM。通过单个Amazon API Gateway REST API端点暴露FM。", "为Amazon API Gateway REST API使用AWS Lambda授权者，评估存储在AWS AppConfig中的路由规则。基于业务逻辑返回授权上下文。将请求路由到每个Amazon Bedrock FM对应的模型特定Lambda函数。"], "a": "C", "explanation_en": "Option best satisfies the requirement to change routing decisions while C without redeploying code supporting complex, frequently changing business logic at scale. is designed for centrally AWS AppConfig managing dynamic configuration (feature flags, rules, thresholds, and policy parameters) and deploying changes safely. It supports controlled deployments, validation, and rapid propagation of updated configuration values, which aligns with “real-time cost metrics that change hourly” and the need for “immediate propagation across thousands of concurrent requests.” In this design, the becomes the policy decision point. For each request, it evaluates user Lambda function attributes (tier, transaction value), context (regulatory zone, Region), and live cost/performance thresholds stored in AppConfig to determine which to invoke. Because the routing rules and FM Amazon Bedrock FM identifiers are delivered as configuration, the company can switch models, adjust A/B testing weights, or update compliance routing rules by deploying new AppConfig configuration versions rather than pushing new application code. This reduces operational risk and accelerates iteration. Exposing a also minimizes client complexity and keeps routing logic server- single API Gateway endpoint side, which is important when rules change frequently. Lambda can cache configuration between invocations (within the execution environment) to reduce repeated fetch overhead while still picking up changes quickly, enabling both low latency and rapid rule rollout under high concurrency. Option relies on Lambda environment variables, which are not intended for frequent real-time updates and A typically require function configuration updates that are slower and operationally brittle. Option uses B mapping templates and stage variables, which are limited for complex rule evaluation and safe rollout patterns. Option misuses authorizers for business routing, adds extra latency and complexity, and D complicates observability and error handling by splitting decisioning from execution.", "explanation_zh": "选项C最佳地满足了在不重新部署代码的情况下更改路由决策的要求，同时支持大规模复杂且频繁变化的业务逻辑。AWS AppConfig专为集中管理动态配置（功能标志、规则、阈值和策略参数）以及安全部署变更而设计。它支持受控部署、验证和配置值的快速传播，这与\"实时成本指标每小时变化\"和\"需要在数千个并发请求中立即传播\"的需求一致。在这种设计中，Lambda函数成为策略决策点。对于每个请求，它评估用户属性（层级、交易金额）、上下文（监管区域、区域）以及存储在AppConfig中的实时成本/性能阈值，以确定调用哪个Amazon Bedrock FM。由于路由规则和FM标识符以配置形式交付，公司可以通过部署新的AppConfig配置版本来切换模型、调整A/B测试权重或更新合规路由规则，而无需推送新的应用程序代码。这降低了运营风险并加速了迭代。暴露单个API Gateway端点也最小化了客户端复杂性，并将路由逻辑保留在服务器端，这在规则频繁变化时非常重要。Lambda可以在调用之间缓存配置（在执行环境内），以减少重复获取开销，同时仍能快速获取变更，从而在高并发下实现低延迟和快速规则更新。选项A依赖Lambda环境变量，这些变量不适合频繁的实时更新，通常需要较慢且操作脆弱的函数配置更新。选项B使用映射模板和阶段变量，对于复杂规则评估和安全 rollout 模式而言能力有限。选项D将授权者误用于业务路由，增加了额外的延迟和复杂性，并使架构复杂化。因此，选项C是动态FM路由的最优选择。"}, {"id": 14, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company upgraded its Amazon Bedrock–powered foundation model (FM) that supports a multilingual \ncustomer service assistant. After the upgrade, the assistant exhibited inconsistent behavior across languages. \nThe assistant began generating different responses in some languages when presented with identical questions. The company needs a solution to detect and address similar problems for future updates. The evaluation must \nbe completed within 45 minutes for all supported languages. The evaluation must process at least 15,000 test \nconversations in parallel. The evaluation process must be fully automated and integrated into the CI/CD \npipeline. The solution must block deployment if quality thresholds are not met. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司升级了其由Amazon Bedrock驱动的Foundation Model (FM)，该模型支持一个多语言客户服务助手。升级后，该助手在不同语言之间表现出不一致的行为。当呈现相同的问题时，助手的某些语言开始生成不同的响应。公司需要一个解决方案来检测和应对未来更新中的类似问题。评估必须在45分钟内完成所有支持的语言。评估必须并行处理至少15,000个测试对话。评估过程必须完全自动化并集成到CI/CD管道中。如果未达到质量阈值，解决方案必须阻止部署。哪种解决方案能满足这些要求？", "options_en": ["Create a distributed traffic simulation framework that sends translation-heavy workloads to the assistant \nin multiple languages simultaneously. Use Amazon CloudWatch metrics to monitor latency,", "concurrency, and throughput. Run simulations before production releases to identify infrastructure \nbottlenecks.", "Deploy the assistant in multiple AWS Regions with Amazon Route 53 latency-based routing and AWS \nGlobal Accelerator to improve global performance. Store multilingual conversation logs in Amazon S3. \nPerform weekly post-deployment audits to review consistency.", "Create a pre-processing pipeline that normalizes all incoming messages into a consistent format before \nsending the messages to the assistant. Apply rule-based checks to flag potential hallucinations in the \noutputs. Focus evaluation on normalized text to simplify testing across languages.", "Set up standardized multilingual test conversations with identical meaning. Run the test conversations \nin parallel by using Amazon Bedrock model evaluation jobs. Apply similarity and hallucination \nthresholds. Integrate the process into the CI/CD pipeline to block releases that fail."], "options_zh": ["创建一个分布式流量模拟框架，同时向助手发送多种语言的翻译密集型工作负载。使用Amazon CloudWatch指标监控延迟、并发性和吞吐量。在生产版本发布前运行模拟以识别基础设施瓶颈。", "将助手部署到多个AWS区域，使用Amazon Route 53基于延迟的路由和AWS Global Accelerator改善全球性能。将多语言对话日志存储在Amazon S3中。执行每周部署后审计以审查一致性。", "创建一个预处理管道，在将消息发送到助手之前将所有传入消息规范化为一致的格式。应用基于规则的检查来标记输出中潜在的幻觉。评估重点放在规范化文本上以简化跨语言测试。", "设置具有相同含义的标准化多语言测试对话。使用Amazon Bedrock模型评估任务并行运行测试对话。应用相似性和幻觉阈值。将流程集成到CI/CD管道中，以阻止未通过测试的版本发布。"], "a": "D", "explanation_en": "Option D is the correct solution because it directly evaluates multilingual output consistency and quality in an automated, scalable, and deployment-gating workflow. Amazon Bedrock model evaluation jobs are designed to run large-scale, repeatable evaluations against defined datasets and to produce quantitative metrics that can be used as objective release criteria. The core issue is semantic inconsistency across languages for equivalent inputs. The most reliable way to detect this is to create standardized test conversations where each language version expresses the same intent and constraints. Running those tests through the updated model and comparing results with similarity metrics (for example, semantic similarity between expected and actual answers, or between language variants) surfaces regressions that infrastructure testing cannot detect. Bedrock evaluation jobs support running evaluations at scale and are well suited for processing large datasets quickly. By parallelizing evaluation runs across languages and conversations, the company can meet the 45- minute requirement while executing at least 15,000 conversations. Because the process is standardized, it also allows consistent baseline comparisons across releases. Applying hallucination thresholds ensures that answers remain grounded and do not introduce fabricated details, which is particularly important when language-specific behavior shifts after a model upgrade. Integrating evaluation jobs into the CI/CD pipeline enables fully automated execution on every model or configuration update. The pipeline can enforce a hard quality gate that blocks deployment if thresholds are not met, preventing regressions from reaching production. Option A focuses on performance and infrastructure bottlenecks, not multilingual response quality. Option B is post-deployment and too slow to prevent regressions. Option C normalizes inputs but does not measure multilingual output equivalence or provide robust, quantitative gating. Therefore, Option D best meets the automation, scale, timing, and deployment-blocking requirements.", "explanation_zh": "选项D是正确的，因为它以自动化、可扩展且可部署门控的工作流直接评估多语言输出的一致性和质量。Amazon Bedrock模型评估任务专为运行大规模、可重复的评估而设计，针对定义的评估数据集，并生成可作为客观发布标准的量化指标。核心问题是等效输入在不同语言之间出现的语义不一致。检测此问题最可靠的方法是创建标准化的测试对话，其中每种语言版本表达相同的意图和约束。通过更新后的模型运行这些测试，并使用相似性指标（例如，预期答案与实际答案之间的语义相似性，或不同语言变体之间的相似性）比较结果，可以揭示基础设施测试无法检测到的回归问题。Bedrock评估任务支持大规模运行评估，非常适合快速处理大型数据集。通过在语言和对话间并行化评估运行，公司可以在满足45分钟要求的同时执行至少15,000个对话。由于流程是标准化的，它还允许跨版本进行一致的基础线比较。应用幻觉阈值可确保答案有依据且不引入虚构的细节，这在模型升级后出现特定语言行为变化时尤为重要。将评估任务集成到CI/CD管道中，可以在每次模型或配置更新时启用全自动执行。管道可以强制实施硬性质量门控，如果未达到阈值则阻止部署，防止回归问题进入生产环境。选项A侧重于性能和基础设施瓶颈，而非多语言响应质量。选项B是部署后的，且速度太慢，无法防止回归问题。选项C规范化输入但不衡量多语言输出的等价性，也不提供稳健的量化指标。因此，选项D是最佳选择。"}, {"id": 15, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A financial technology company is using Amazon Bedrock to build an assessment system for the company’s \ncustomer service AI assistant. The AI assistant must provide financial recommendations that are factually \naccurate, compliant with financial regulations, and conversationally appropriate. The company needs to \ncombine automated quality evaluations at scale with targeted human reviews of critical interactions. What solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融科技公司正在使用Amazon Bedrock为其客户服务AI助手构建评估系统。该AI助手必须提供事实准确、符合金融法规且对话得体的金融建议。公司需要将大规模自动化质量评估与针对关键交互的有针对性的人工审核相结合。哪种解决方案能满足这些要求？", "options_en": ["Configure a pipeline in which financial experts manually score all responses for accuracy, compliance, \nand conversational quality. Use Amazon SageMaker notebooks to analyze results to identify \nimprovement areas.", "Configure Amazon Bedrock evaluations that use Anthropic Claude Sonnet as a judge model to assess \nresponse accuracy and appropriateness. Configure custom Amazon Bedrock guardrails to check \nresponses for compliance with financial policies. Add Amazon Augmented AI (Amazon A2I) human \nreviews for flagged critical interactions.", "Create an Amazon Lex bot to manage customer service interactions. Configure AWS Lambda functions \nto check responses against a static compliance database. Configure intents that call the Lambda \nfunctions. Add an additional intent to collect end-user reviews.", "Configure Amazon CloudWatch to monitor response patterns from the AI assistant. Configure \nCloudWatch alerts for potential compliance violations. Establish a team of human evaluators to review \nflagged interactions."], "options_zh": ["配置一个由金融专家手动对所有响应的准确性、合规性和对话质量进行评分的管道。使用Amazon SageMaker笔记本分析结果以识别改进领域。", "配置使用Anthropic Claude Sonnet作为评判模型的Amazon Bedrock评估，以评估响应的准确性和恰当性。配置自定义Amazon BedrockGuardrails检查响应是否符合金融政策。为被标记的关键交互添加Amazon Augmented AI（Amazon A2I）人工审核。", "创建一个Amazon Lex机器人来管理客户服务交互。配置AWS Lambda函数检查响应是否符合静态合规数据库。配置调用Lambda函数的意图。添加额外的意图来收集最终用户反馈。", "配置Amazon CloudWatch监控AI助手的响应模式。为潜在的合规违规设置CloudWatch告警。建立一个人工评估团队来审核被标记的交互。"], "a": "B", "explanation_en": "Option B meets the requirement to combine scalable automated evaluation with targeted human oversight using managed AWS GenAI capabilities. Amazon Bedrock evaluations enable systematic, repeatable quality assessment across large volumes of interactions. Using an LLM-as-a-judge approach with a strong evaluator model such as Anthropic Claude Sonnet allows the company to automatically score outputs for dimensions like factual accuracy, conversational appropriateness, and policy alignment. This directly supports “automated quality evaluations at scale” without building custom scoring models. However, financial recommendations add higher risk because regulatory compliance requires additional enforcement beyond general quality scoring. Amazon Bedrock guardrails provide a dedicated policy enforcement layer that can block or intervene when responses violate compliance constraints. Guardrails are particularly important for preventing disallowed financial guidance patterns and ensuring consistent behavior across deployments. The requirement also calls for “targeted human reviews of critical interactions.” Amazon Augmented AI (A2I) is a managed human review service that supports routing specific items to human reviewers based on rules or confidence thresholds. In this design, the system can automatically send only high-risk or policy- flagged interactions to qualified financial experts for review, keeping human effort focused where it matters most while maintaining scale. Option A is
