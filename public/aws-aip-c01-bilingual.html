ment for an interactive AI assistant. Therefore, Option B provides the most effective and AWS-aligned solution to achieve low latency, global scalability, and high throughput during peak usage periods.", "explanation_zh": "选项B是正确的解决方案，因为它直接使用专为实时高容量生成式AI工作负载设计的原生Amazon Bedrock性能优化功能来解决吞吐量瓶颈和延迟要求。Amazon Bedrock支持跨区域推理配置文件，允许应用程序透明地将推理请求路由到多个AWS区域。在高峰使用期间，流量自动分配到具有可用容量的区域，减少了节流、请求排队和超时风险。这种方法符合AWS关于构建必须跨地理边界弹性扩缩的高可用低延迟GenAI应用程序的指导。令牌批处理通过将多个推理请求合并为单个模型调用（在适用情况下）进一步提高了效率。AWS Generative AI文档将批处理强调为减少每请求开销、提高吞吐量和更好利用模型容量的关键优化技术。这对于像Claude 3 Haiku这样专为快速响应和高请求量设计的轻量级低延迟模型尤其有效。选项A不满足要求，因为在单个区域购买预配吞吐量会创建区域瓶颈，并且无法解决超出预留容量的多区域可用性或流量高峰问题。重试会增加负载和延迟，而不是解决根本原因。选项C改进了应用层扩缩，但没有解决模型侧的吞吐量限制。客户端轮询路由缺乏对实时模型容量的感知，仍然可能将流量发送到饱和区域。选项D不适用，因为带有异步检索的批处理推理专为离线或非交互式工作负载设计，无法满足交互式AI助手严格的2秒响应时间要求。因此，选项B提供了最有效且符合AWS最佳实践的解决方案。"}, {"id": 32, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A university is building an AI-powered application that includes several sub-applications. The sub-\napplications include AI assistants, assignment graders, and internal analytics applications. The university is \ndefining and testing multiple prompts by using various foundation models (FMs). The university wants to \ncompare variants of each prompt and choose the variant that yield outputs that are best-suited for specified \nuse cases. The university requires a version control solution for the prompts. The university must be able to \ntest prompt variations and collect audit trails for prompt changes and usage. The solution must also maintain \nconsistency while allowing the prompts to integrate into the main application. Which combination of \nsolutions will meet these requirements with the LEAST operational overhead? (Select TWO.) A. B. C. D. E.", "body_zh": "一所大学正在构建一个包含多个子应用程序的AI驱动应用程序。子应用程序包括AI助手、作业评分器和内部分析应用程序。大学正在使用各种基础模型(FM)定义和测试多个提示。大学希望比较每个提示的变体，并选择能为指定用例产生最佳输出的变体。大学需要一个提示版本控制解决方案。大学必须能够测试提示变体并收集提示更改和使用的审计跟踪。解决方案还必须保持一致性，同时允许提示集成到主应用程序中。哪组解决方案能以最少的运营开销满足这些要求？（选择两项）", "options_en": ["Use Amazon Bedrock Prompt Management to create versioned prompts. Include parameterized \nvariables for each use case.", "Store prompts in Amazon S3. Use AWS Step Functions to orchestrate the model interactions and \nservice integrations.", "Use Amazon Bedrock Flows to create workflows that combine FMs and AWS services.", "Configure AWS Config to record prompt changes. Use AWS CloudTrail to track prompt usage.", "Configure Amazon Bedrock intelligent prompt routing."], "options_zh": ["使用Amazon Bedrock Prompt Management创建版本化提示。为每个用例包含参数化变量。", "将提示存储在Amazon S3中。使用AWS Step Functions编排模型交互和服务集成。", "使用Amazon Bedrock Flows创建工作流，结合FM和AWS服务。", "配置AWS Config记录提示更改。使用AWS CloudTrail跟踪提示使用。", "配置Amazon Bedrock智能提示路由。"], "a": "A C", "explanation_en": "is the purpose-built service for prompt lifecycle management. it Amazon Bedrock Prompt Management provides native , allowing developers to test and compare variants side-by-side. Use of version control ensures that a single prompt structure can be consistently reused across different parameterized variables sub-applications (assistants vs. graders) while still being tailored to the specific context. To \"integrate into the main application\" with minimal overhead, provide a managed orchestration layer. Amazon Bedrock Flows Flows allow developers to link managed prompts with AWS services (like knowledge bases or Lambda functions) without writing complex state-machine logic in Step Functions (Option B). This combination ensures consistent, auditable, and easily deployable prompt assets across the university's diverse use cases.", "explanation_zh": "Amazon Bedrock Prompt Management是专为提示生命周期管理而构建的服务。它提供原生版本控制，允许开发人员并排测试和比较变体。使用参数化变量确保单个提示结构可以在不同的子应用程序（助手与评分器）之间一致重复使用，同时仍能针对特定上下文进行定制。为了实现以最少开销“集成到主应用程序”中，Amazon Bedrock Flows提供了托管的编排层。Flows允许开发人员将托管提示与AWS服务（如知识库或Lambda函数）连接，而无需在Step Functions中编写复杂的状态机逻辑（选项B）。这种组合确保了大学多样化用例中一致、可审计且易于部署的提示资产。"}, {"id": 33, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company is building a generative AI (GenAI) application that produces content based on a variety of \ninternal and external data sources. The company wants to ensure that the generated output is fully traceable. \nThe application must support data source registration and enable metadata tagging to attribute content to its \noriginal source. The application must also maintain audit logs of data access and usage throughout the \npipeline. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在构建一个生成式AI(GenAI)应用程序，该应用程序基于各种内部和外部数据源生成内容。公司希望确保生成的输出完全可追溯。应用程序必须支持数据源注册并启用元数据标记，以将内容归因到其原始来源。应用程序还必须维护整个管道中数据访问和使用的审计日志。哪种解决方案能满足这些要求？", "options_en": ["Use AWS Lake Formation to catalog data sources and control access. Apply metadata tags directly in \nAmazon S3. Use AWS CloudTrail to monitor API activity.", "Use AWS Glue Data Catalog to register and tag data sources. Use Amazon CloudWatch Logs to \nmonitor access patterns and application behavior.", "Store data in Amazon S3 and use object tagging for attribution. Use AWS Glue Data Catalog to manage \nschema information. Use AWS CloudTrail to log access to S3 buckets.", "Use AWS Glue Data Catalog to register all data sources. Apply metadata tags to attribute data sources. \nUse AWS CloudTrail to log access and activity across services."], "options_zh": ["使用AWS Lake Formation编目数据源并控制访问。直接在Amazon S3中应用元数据标签。使用AWS CloudTrail监控API活动。", "使用AWS Glue Data Catalog注册和标记数据源。使用Amazon CloudWatch Logs监控访问模式和应用程序行为。", "将数据存储在Amazon S3中并使用对象标签进行归因。使用AWS Glue Data Catalog管理模式信息。使用AWS CloudTrail记录对S3存储桶的访问。", "使用AWS Glue Data Catalog注册所有数据源。应用元数据标签来归因数据源。使用AWS CloudTrail记录跨服务的访问和活动。"], "a": "D", "explanation_en": "Option D is the correct solution because it directly satisfies all three core requirements: data source registration, metadata-based attribution, and end-to-end audit logging, while remaining service-agnostic and scalable across internal and external data sources. The AWS Glue Data Catalog is the AWS-native service for registering datasets and managing metadata centrally. It supports structured registration of diverse data sources and enables consistent tagging that can be used to attribute generated content back to its original source. This is essential for GenAI applications that combine multiple datasets and must provide traceability for outputs. Metadata tags applied within the Glue Data Catalog ensure a consistent attribution framework that downstream systems—such as Retrieval Augmented Generation (RAG) pipelines or evaluation systems—can reference without embedding attribution logic directly in application code. This improves maintainability and governance. AWS CloudTrail provides immutable audit logs of API activity across AWS services, including data access, metadata changes, and pipeline interactions. CloudTrail logs are critical for compliance and regulatory review because they capture who accessed which data, when, and through which service. This satisfies the requirement to maintain audit logs “throughout the pipeline,” not just at storage or application layers. Option A introduces Lake Formation, which is primarily intended for fine-grained data lake permissions and is not required solely for traceability. Option B relies on CloudWatch Logs, which does not provide authoritative audit logging across services. Option C limits audit scope to S3 access and does not register or govern all data sources comprehensively. Therefore, Option D provides the most complete and least intrusive solution for traceable, auditable GenAI data pipelines.", "explanation_zh": "选项D是正确的解决方案，因为它直接满足所有三个核心要求：数据源注册、基于元数据的归因和端到端审计日志记录，同时在内部和外部数据源中保持服务无关性和可扩展性。AWS Glue Data Catalog是用于集中注册数据集和管理元数据的AWS原生服务。它支持不同数据源的结构化注册，并启用一致的标记，可用于将生成的内容归因回其原始来源。这对于组合多个数据集且必须为输出提供可追溯性的GenAI应用程序至关重要。在Glue Data Catalog中应用的元数据标签确保了一致的归因框架，下游系统（如检索增强生成(RAG)管道或评估系统）可以引用，而无需将归因逻辑嵌入应用程序代码中。这提高了可维护性和治理能力。AWS CloudTrail提供跨AWS服务的API活动的不可变审计日志，包括数据访问、元数据更改和管道交互。CloudTrail日志对于合规和监管审查至关重要，因为它们捕获了谁在何时通过哪个服务访问了哪些数据。这满足了“在整个管道中”维护审计日志的要求，而不仅仅是在存储或应用程序层面。选项A引入了Lake Formation，它主要用于细粒度数据湖权限，并非仅为实现可追溯性所需。选项B依赖CloudWatch Logs，它不提供跨服务的权威审计日志记录。选项C将审计范围限制在S3访问，并没有全面注册或管理所有数据源。因此，选项D为可追溯、可审计的GenAI数据管道提供了最完整且侵入性最小的解决方案。"}, {"id": 34, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A medical company is building a generative AI (GenAI) application that uses Retrieval Augmented \nGeneration (RAG) to provide evidence-based medical information. The application uses Amazon OpenSearch \nService to retrieve vector embeddings. Users report that searches frequently miss results that contain exact \nmedical terms and acronyms and return too many semantically similar but irrelevant documents. The \ncompany needs to improve retrieval quality and maintain low end-user latency, even as the document \ncollection grows to millions of documents. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家医疗公司正在构建一个生成式AI(GenAI)应用程序，使用检索增强生成(RAG)提供基于证据的医疗信息。该应用程序使用Amazon OpenSearch Service检索向量嵌入。用户报告说，搜索经常遗漏包含精确医学术语和缩写的结果，并返回太多语义相似但不相关的文档。公司需要改进检索质量并保持较低的最终用户延迟，即使文档集合增长到数百万份文档。哪种解决方案能以最少的运营开销满足这些要求？", "options_en": ["Configure hybrid search by combining vector similarity with keyword matching to improve semantic \nunderstanding and exact term and acronym matching.", "Increase the dimensions of the vector embeddings from 384 to 1536. Use a post-processing AWS \nLambda function to filter out irrelevant results after retrieval.", "Replace OpenSearch Service with Amazon Kendra. Use query expansion to handle medical acronyms \nand terminology variants during pre-processing.", "Implement a two-stage retrieval architecture in which initial vector search results are re-ranked by an \nML model hosted on Amazon SageMaker."], "options_zh": ["配置混合搜索，结合向量相似性与关键词匹配，以改进语义理解以及精确术语和缩写的匹配。", "将向量嵌入的维度从384增加到1536。使用后处理AWS Lambda函数在检索后过滤掉不相关的结果。", "用Amazon Kendra替换OpenSearch Service。使用查询扩展在预处理阶段处理医学术语和缩写变体。", "实施两阶段检索架构，其中初始向量搜索结果由托管在Amazon SageMaker上的ML模型重新排序。"], "a": "A", "explanation_en": "Option A is the correct solution because hybrid search directly addresses the core retrieval failure modes while maintaining low latency and minimal operational overhead. In medical and scientific domains, exact terminology, abbreviations, and acronyms (for example, drug names, procedures, or conditions) are critical. Pure vector similarity search often underweights these exact matches, leading to missed results and excessive semantically related but irrelevant documents. Amazon OpenSearch Service natively supports hybrid search, which combines keyword-based retrieval (such as BM25) with vector similarity search. Keyword search ensures precise matching for exact terms and acronyms, while vector search captures semantic meaning and contextual similarity. By blending these approaches, the retrieval system improves both precision and recall without introducing additional infrastructure. Hybrid search operates within the same OpenSearch index and query path, which preserves low end-user latency even at large scale. This is especially important as the document collection grows to millions of documents. Because OpenSearch handles scoring and ranking internally, no additional orchestration layers or post-processing steps are required. Option B increases computational cost and latency while failing to address exact-term recall. Option C introduces a new service and ingestion pipeline, increasing operational overhead and latency. Option D adds model hosting, re-ranking infrastructure, and complexity that is unnecessary when OpenSearch provides native hybrid retrieval. Therefore, Option A delivers the best balance of retrieval quality, scalability, latency, and operational simplicity for medical RAG workloads.", "explanation_zh": "选项A是正确的解决方案，因为混合搜索直接解决了核心检索失败模式，同时保持了低延迟和最小的运营开销。在医疗和科学领域，精确术语、缩写和首字母缩略词（例如药物名称、程序或病症）至关重要。纯向量相似性搜索通常会低估这些精确匹配，导致遗漏结果和过多的语义相关但不相关的文档。Amazon OpenSearch Service原生支持混合搜索，结合了基于关键词的检索（如BM25）与向量相似性搜索。关键词搜索确保精确匹配精确术语和缩写，而向量搜索则捕获语义含义和上下文相似性。通过混合这些方法，检索系统在不引入额外基础设施的情况下提高了精确率和召回率。混合搜索在同一个OpenSearch索引和查询路径内运行，即使在大型规模下也能保持较低的最终用户延迟。随着文档集合增长到数百万份文档，这一点尤为重要。因为OpenSearch在内部处理评分和排序，所以不需要额外的编排层或后处理步骤。选项B增加了计算成本和延迟，同时未能解决精确术语召回问题。选项C引入了新服务和摄取管道，增加了运营开销和延迟。选项D增加了模型托管、重新排序基础设施和复杂性，而在OpenSearch提供原生混合检索的情况下这是不必要的。因此，选项A在医疗RAG工作负载的检索质量、可扩展性、延迟和操作简便性之间提供了最佳平衡。"}, {"id": 35, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "An ecommerce company is developing a generative AI application that uses Amazon Bedrock with Anthropic \nClaude to recommend products to customers. Customers report that some recommended products are not \navailable for sale on the website or are not relevant to the customer. Customers also report that the solution \ntakes a long time to generate some recommendations. The company investigates the issues and finds that most interactions between customers and the product \nrecommendation solution are unique. The company confirms that the solution recommends products that are \nnot in the company’s product catalog. The company must resolve these issues. Which solution will meet this requirement? A. B. C. D.", "body_zh": "一家电商公司正在开发一个使用Amazon Bedrock和Anthropic Claude向客户推荐产品的生成式AI应用程序。客户报告说，一些推荐的产品在网站上不可售或与客户不相关。客户还报告说，该解决方案生成某些推荐需要很长时间。公司调查问题后发现，客户与产品推荐解决方案之间的大多数交互都是唯一的。公司确认该解决方案推荐的产品不在公司的产品目录中。公司必须解决这些问题。哪种解决方案能满足这一要求？", "options_en": ["Increase grounding within Amazon Bedrock Guardrails. Enable Automated Reasoning checks. Set up \nprovisioned throughput.", "Use prompt engineering to restrict the model responses to relevant products. Use streaming techniques \nsuch as the InvokeModelWithResponseStream action to reduce perceived latency for the customers.", "Create an Amazon Bedrock knowledge base. Implement Retrieval Augmented Generation RAG. Set the \nPerformanceConfigLatency parameter to optimized.", "Store product catalog data in Amazon OpenSearch Service. Validate the model’s product \nrecommendations against the product catalog. Use Amazon DynamoDB to implement response caching."], "options_zh": ["增加Amazon Bedrock护栏内的接地性。启用自动推理检查。设置预配吞吐量。", "使用提示工程限制模型对相关产品的响应。使用流式技术（如InvokeModelWithResponseStream操作）降低客户的感知延迟。", "创建Amazon Bedrock知识库。实施检索增强生成(RAG)。将PerformanceConfigLatency参数设置为优化。", "将产品目录数据存储在Amazon OpenSearch Service中。验证模型的产品推荐与产品目录的匹配性。使用Amazon DynamoDB实现响应缓存。"], "a": "C", "explanation_en": "Option C best addresses both core problems: hallucinated recommendations that do not exist in the catalog and slow response times, while keeping operational overhead low. The most direct way to prevent the model from recommending unavailable products is to ground generation on authoritative product catalog data at inference time. An Amazon Bedrock knowledge base is designed for this pattern by ingesting domain data, chunking content, creating embeddings, and retrieving the most relevant catalog entries when a user asks for recommendations. Implementing Retrieval Augmented Generation ensures the foundation model receives only approved, catalog-backed context and can cite or base its output on those retrieved items. This sharply reduces the likelihood of inventing products, because the response is conditioned on retrieved catalog records rather than relying on the model’s parametric memory. The requirement also notes that most interactions are unique. That makes response caching far less effective, because there are fewer repeated prompts to benefit from cached outputs. Instead, improving the retrieval and model invocation path is the better optimization. Using the PerformanceConfigLatency parameter set to optimized prioritizes lower latency behavior for model inference, helping meet faster recommendation generation without requiring the company to build and operate additional infrastructure. The other options do not solve the root cause as reliably. Prompt engineering and streaming can improve perceived latency, but they do not guarantee catalog-only recommendations because the model can still hallucinate items. Guardrails can help detect or block certain undesired outputs, but without consistent catalog grounding they do not ensure every recommendation is derived from the company’s product data. Building a custom OpenSearch validation and caching layer increases operational complexity, and caching is misaligned with predominantly unique interactions. Alright, after comparing against , I have identified the unique questions. List B (txt file) List A (Word file) These questions cover scenarios or architectural configurations that were not present in the existing list. Here are the unique questions from List B, formatted as requested:", "explanation_zh": "选项C最好地解决了两个核心问题：推荐目录中不存在的幻觉产品和响应时间慢，同时保持较低的运营开销。防止模型推荐不可用产品的最直接方法是在推理时基于权威的产品目录数据进行接地生成。Amazon Bedrock知识库正是为此模式设计的，它通过摄取领域数据、对内容进行分块、创建嵌入以及在用户请求推荐时检索最相关的目录条目。实施检索增强生成确保基础模型仅接收已批准的基于目录的上下文，并可以引用或基于这些检索到的项目生成输出。这大大降低了生成虚构产品的可能性，因为响应基于检索到的目录记录而非模型的参数化记忆。要求还指出大多数交互都是唯一的。这使得响应缓存效果差得多，因为重复提示较少能从缓存输出中受益。相反，改进检索和模型调用路径是更好的优化。使用PerformanceConfigLatency参数设置为优化，优先考虑模型推理的低延迟行为，有助于满足更快的推荐生成需求，而无需公司构建和运营额外的基础设施。其他选项不能可靠地解决根本原因。提示工程和流式可以改善感知延迟，但无法保证仅基于目录的推荐，因为模型仍然可能产生幻觉。护栏可以帮助检测或阻止某些不合预期的输出，但如果没有一致的目录接地，无法确保每个推荐都来自公司的产品数据。构建自定义OpenSearch验证和缓存层增加了运营复杂性，且缓存与绝大多数唯一的交互模式不匹配。因此，选项C是最有效的解决方案。"}, {"id": 36, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company uses an organization in AWS Organizations with all features enabled to manage multiple AWS \naccounts. Employees use Amazon Bedrock across multiple accounts. The company must prevent specific \ntopics and proprietary information from being included in prompts to Amazon Bedrock models. The company \nmust ensure that employees can use only approved Amazon Bedrock models. The company wants to manage \nthese controls centrally. Which combination of solutions will meet these requirements? (Select TWO.) A. B. C. D. E.", "body_zh": "一家公司在AWS Organizations中使用启用了所有功能的组织来管理多个AWS账户。员工跨多个账户使用Amazon Bedrock。公司必须防止特定主题和专有信息被包含在对Amazon Bedrock模型的提示中。公司必须确保员工只能使用已批准的Amazon Bedrock模型。公司希望集中管理这些控制措施。哪组解决方案能满足这些要求？（选择两项）", "options_en": ["Create an IAM permissions boundary for each employee's IAM role. Configure the permissions \nboundary to require an approved Amazon Bedrock guardrail identifier to invoke Amazon Bedrock \nmodels. Create an SCP that allows employees to use only approved models.", "Create an SCP that allows employees to use only approved models. Configure the SCP to require \nemployees to specify a guardrail identifier in calls to invoke an approved model.", "Create an SCP that prevents an employee from invoking a model if a centrally deployed guardrail \nidentifier is not specified in a call to the model. Create a permissions boundary on each employee's \nIAM role that allows each employee to invoke only approved models.", "Use AWS CloudFormation to create a custom Amazon Bedrock guardrail that has a block filtering \npolicy. Use stack sets to deploy the guardrail to each account in the organization.", "Use AWS CloudFormation to create a custom Amazon Bedrock guardrail that has a mask filtering \npolicy. Use stack sets to deploy the guardrail to each account in the organization."], "options_zh": ["为每个员工的IAM角色创建IAM权限边界。配置权限边界要求使用已批准的Amazon Bedrock护栏标识符来调用Amazon Bedrock模型。创建SCP允许员工仅使用已批准的模型。", "创建SCP允许员工仅使用已批准的模型。配置SCP要求员工在调用已批准模型时指定护栏标识符。", "创建SCP，如果调用模型时未指定集中部署的护栏标识符，则阻止员工调用模型。在每个员工的IAM角色上创建权限边界，允许每个员工仅调用已批准的模型。", "使用AWS CloudFormation创建具有阻止过滤策略的自定义Amazon Bedrock护栏。使用堆栈集将护栏部署到组织中的每个账户。", "使用AWS CloudFormation创建具有遮盖过滤策略的自定义Amazon Bedrock护栏。使用堆栈集将护栏部署到组织中的每个账户。"], "a": "C D", "explanation_en": "The correct combination is because together they enforce centralized governance over both C and D model and , which are the two core requirements of the scenario. access prompt content controls To ensure employees can use , governance must be enforced at the only approved Amazon Bedrock models organization level and not rely on individual application logic. are the Service Control Policies (SCPs) strongest control mechanism available in AWS Organizations because they define the maximum permissions an account or principal can have. In option , the SCP prevents any Amazon Bedrock model invocation C unless a centrally approved guardrail identifier is specified. This ensures that guardrails are always enforced, regardless of how or where the invocation originates. The additional use of IAM permissions boundaries ensures that even within allowed accounts, employees are restricted to invoking only explicitly approved foundation models. To prevent , specific topics and proprietary information from being included in prompts Amazon must be used. Guardrails operate inline during model invocation and can block Bedrock Guardrails disallowed content before it is processed by the model. Option correctly specifies a , D block filtering policy which is appropriate when content must be prevented entirely rather than partially redacted. Deploying the guardrail using allows the company to centrally manage and consistently AWS CloudFormation StackSets deploy the same guardrail configuration across all accounts in the organization, ensuring uniform enforcement. Option uses mask filtering, which is better suited for redacting sensitive output rather than preventing E prohibited content from being submitted in prompts. Option attempts to use SCPs alone but does not B enforce guardrail deployment or content filtering. Option incorrectly places guardrail enforcement in A permissions boundaries, which are not designed to validate request parameters such as guardrail identifiers. By combining with , options SCP-based enforcement centrally deployed Bedrock guardrails C and D together provide strong, scalable, and centrally managed controls for both content safety and model governance across the organization.", "explanation_zh": "正确的组合是C和D，因为它们共同强制执行对模型访问和提示内容的集中治理，这是场景的两个核心要求。为确保员工只能使用已批准的Amazon Bedrock模型，治理必须在组织级别强制执行，而不是依赖单个应用程序逻辑。服务控制策略(SCP)是AWS Organizations中最强大的控制机制，因为它们定义了账户或主体可以拥有的最大权限。在选项C中，SCP阻止任何Amazon Bedrock模型调用，除非指定了集中批准的护栏标识符。这确保了无论调用源自何处或如何调用，护栏始终被强制执行。额外的IAM权限边界确保即使在允许的账户内，员工也被限制为只能调用明确批准的基础模型。为防止特定主题和专有信息被包含在提示中，必须使用Amazon Bedrock护栏。护栏在模型调用期间内联运行，可以在内容被模型处理之前阻止不允许的内容。选项D正确指定了阻止过滤策略，当内容必须完全阻止而不是部分遮盖时，这是合适的策略。使用AWS CloudFormation StackSets部署护栏允许公司在组织中的所有账户中集中管理并一致部署相同的护栏配置，确保统一执行。选项E使用遮盖过滤，更适合遮盖敏感输出而不是防止在提示中提交禁止内容。选项B尝试单独使用SCP，但不强制部署护栏或内容过滤。选项A错误地将护栏执行放在权限边界中，而权限边界并非设计用于验证请求参数（如护栏标识符）。通过结合选项C（阻止无护栏的模型调用）和选项D（部署具有阻止过滤策略的护栏），公司实现了对模型使用和提示内容的集中、可审计控制。"}, {"id": 37, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A healthcare company is using Amazon Bedrock to build a Retrieval Augmented Generation (RAG) \napplication that helps practitioners make clinical decisions. The application must achieve high accuracy for \npatient information retrievals, identify hallucinations in generated content, and reduce human review costs. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗保健公司正在使用Amazon Bedrock构建一个检索增强生成(RAG)应用程序，帮助从业者做出临床决策。该应用程序必须实现患者信息检索的高准确性，识别生成内容中的幻觉，并降低人工审查成本。哪种解决方案能满足这些要求？", "options_en": ["Use Amazon Comprehend to analyze and classify RAG responses and to extract medical entities and \nrelationships. Use AWS Step Functions to orchestrate automated evaluations. Configure Amazon \nCloudWatch metrics to track entity recognition confidence scores. Configure CloudWatch to send an \nalert when accuracy falls below specified thresholds.", "Implement automated large language model (LLM)-based evaluations that use a specialized model that \nis fine-tuned for medical content to assess all responses. Deploy AWS Lambda functions to parallelize \nevaluations. Publish results to Amazon CloudWatch metrics that track relevance and factual accuracy.", "Configure Amazon CloudWatch Synthetics to generate test queries that have known answers on a \nregular schedule, and track model success rates. Set up dashboards that compare synthetic test results \nagainst expected outcomes.", "Deploy a hybrid evaluation system that uses an automated LLM-as-a-judge evaluation to initially \nscreen responses and targeted human reviews for edge cases. Use a built-in Amazon Bedrock \nevaluation to track retrieval precision and hallucination rates."], "options_zh": ["使用Amazon Comprehend分析和分类RAG响应，并提取医疗实体和关系。使用AWS Step Functions编排自动化评估。配置Amazon CloudWatch指标跟踪实体识别置信度分数。配置CloudWatch在准确性低于指定阈值时发送告警。", "实施自动化大语言模型(LLM)评估，使用针对医疗内容微调的专业模型评估所有响应。部署AWS Lambda函数并行化评估。将结果发布到Amazon CloudWatch指标，跟踪相关性和事实准确性。", "配置Amazon CloudWatch Synthetics定期生成已知答案的测试查询，并跟踪模型成功率。设置仪表板比较合成测试结果与预期结果。", "部署混合评估系统，使用自动化LLM-as-a-judge评估初步筛选响应，并对边缘情况进行针对性人工审查。使用内置Amazon Bedrock评估跟踪检索精确度和幻觉率。"], "a": "D", "explanation_en": "Option D is the correct solution because it directly addresses all three requirements: high retrieval accuracy, hallucination detection, and reduced human review costs. AWS recommends a layered evaluation strategy for high-stakes domains such as healthcare, where generative outputs must be both accurate and safe. Using an automated LLM-as-a-judge evaluation enables scalable, consistent assessment of generated responses for factual grounding, relevance, and hallucination risk. This automated screening significantly reduces the number of responses that require manual inspection. Only responses that fall below defined quality thresholds or exhibit ambiguous behavior are escalated to targeted human reviews, which optimizes review effort and cost. The use of Amazon Bedrock built-in evaluations provides standardized metrics specifically designed for RAG systems, including retrieval precision, faithfulness to source documents, and hallucination rates. These evaluations integrate directly with Amazon Bedrock knowledge bases and models, eliminating the need to build and maintain custom evaluation pipelines. Option A focuses on entity extraction confidence, which does not reliably detect hallucinations in generative text. Option B requires maintaining and scaling a separate fine-tuned evaluation model, increasing complexity and cost. Option C is useful for regression testing but cannot detect hallucinations in real-world, open-ended clinical queries. Therefore, Option D provides the most effective and operationally efficient approach to maintaining clinical- grade accuracy while minimizing human review effort.", "explanation_zh": "选项D是正确的解决方案，因为它直接解决了所有三个要求：高检索准确性、幻觉检测和降低人工审查成本。AWS推荐在高风险领域（如医疗保健）采用分层评估策略，因为生成输出必须既准确又安全。使用自动化LLM-as-a-judge评估实现了对生成响应进行可扩展、一致的评估，包括事实依据、相关性和幻觉风险。这种自动筛选显著减少了需要人工检查的响应数量。只有低于定义质量阈值或表现出模糊行为的响应才会升级到针对性人工审查，从而优化了审查工作和成本。使用Amazon Bedrock内置评估提供了专门为RAG系统设计的标准化指标，包括检索精确度、对源文档的忠实度和幻觉率。这些评估与Amazon Bedrock知识库和模型直接集成，无需构建和维护自定义评估管道。选项A侧重于实体提取置信度，无法可靠地检测生成文本中的幻觉。选项B需要维护和扩缩一个单独的微调评估模型，增加了复杂性和成本。选项C对于回归测试有用，但无法检测真实世界中开放式临床查询中的幻觉。因此，选项D提供了最有效且运营高效的方法，在最小化人工审查工作的同时保持临床级别的准确性。"}, {"id": 38, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A healthcare company is using Amazon Bedrock to develop a real-time patient care AI assistant to respond to \nqueries for separate departments that handle clinical inquiries, insurance verification, appointment scheduling, \nand insurance claims. The company wants to use a multi-agent architecture. The company must ensure that the AI assistant is scalable and can onboard new features for patients. The AI \nassistant must be able to handle thousands of parallel patient interactions. The company must ensure that \npatients receive appropriate domain-specific responses to queries. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗保健公司正在使用Amazon Bedrock开发一个实时患者护理AI助手，以响应来自不同科室的查询，这些科室处理临床咨询、保险验证、预约安排和保险理赔。公司希望采用多智能体架构。公司必须确保AI助手具有可扩展性，并且能够为患者上线新功能。AI助手必须能够处理数千个并行患者交互。公司必须确保患者能收到针对特定领域的适当查询响应。哪种解决方案能满足这些要求？", "options_en": ["Isolate data for each agent by using separate knowledge bases. Use IAM filtering to control access to \neach knowledge base. Deploy a supervisor agent to perform natural language intent classification on \npatient inquiries. Configure the supervisor agent to route queries to specialized collaborator agents to \nrespond to department-specific queries. Configure each specialized collaborator agent to use Retrieval \nAugmented Generation (RAG) with the agent’s department-specific knowledge base.", "Create a separate supervisor agent for each department. Configure individual collaborator agents to \nperform natural language intent classification for each specialty domain within each department. \nIntegrate each collaborator agent with department-specific knowledge bases only. Implement manual \nhandoff processes between the supervisor agents.", "Isolate data for each department in separate knowledge bases. Use IAM filtering to control access to \neach knowledge base. Deploy a single general-purpose agent. Configure multiple action groups within \nthe general-purpose agent to perform specific department functions. Implement rule-based routing logic \nwithin the general-purpose agent instructions.", "Implement multiple independent supervisor agents that run in parallel to respond to patient inquiries for \neach department. Configure multiple collaborator agents for each supervisor agent. Integrate all agents \nwith the same knowledge base. Use external routing logic to merge responses from multiple supervisor \nagents."], "options_zh": ["通过使用独立的知识库隔离每个智能体的数据。使用IAM过滤控制对每个知识库的访问。部署一个监督智能体对患者询问执行自然语言意图分类。配置监督智能体将查询路由到专门的协作者智能体，以响应特定科室的查询。配置每个专门的协作者智能体使用检索增强生成(RAG)与智能体所属科室的知识库。", "为每个科室创建一个独立的监督智能体。配置单独的协作者智能体对每个科室内的各个专业领域执行自然语言意图分类。仅将每个协作者智能体与相应科室的知识库集成。在监督智能体之间实施手动交接流程。", "通过独立的知识库隔离每个科室的数据。使用IAM过滤控制对每个知识库的访问。部署一个通用智能体。在通用智能体中配置多个操作组以执行特定的科室功能。在通用智能体指令中实现基于规则的路由逻辑。", "实施多个独立的监督智能体，并行运行以响应每个科室的患者询问。为每个监督智能体配置多个协作者智能体。将所有智能体与同一个知识库集成。使用外部路由逻辑合并来自多个监督智能体的响应。"], "a": "A", "explanation_en": "Option A is the most appropriate design because it provides scalable multi-agent orchestration, clear domain separation, and strong governance with minimal operational complexity. A supervisor-agent pattern is a standard AWS-recommended approach for multi-agent systems: one agent performs intent classification and routing, while specialized agents handle domain-specific tasks. Isolating data with separate knowledge bases ensures that each specialized collaborator agent retrieves only the information relevant to its department. This improves response accuracy, reduces hallucinations, and supports privacy controls because clinical content, claims content, and scheduling content can have different access policies. IAM-based filtering ensures that each agent has permission only to the knowledge base it is authorized to use. Routing patient inquiries through a supervisor agent supports high concurrency and extensibility. New departments or features can be added by introducing new collaborator agents and knowledge bases without redesigning the entire system. Because routing is handled centrally, changes in classification logic do not require updates across many independent supervisors. Using RAG within each collaborator agent ensures that responses are grounded in department-approved information sources, which is critical in healthcare settings to reduce unsafe or incorrect guidance. This approach also improves performance because each retrieval scope is smaller and more relevant, supporting thousands of parallel interactions. Option B introduces manual handoffs that do not scale. Option C relies on rule-based routing inside one general agent, which becomes brittle and difficult to govern as complexity grows. Option D mixes all departments into a single knowledge base and merges responses externally, increasing risk of incorrect domain answers and operational overhead. Therefore, Option A best meets the scalability, correctness, and multi-agent onboarding requirements.", "explanation_zh": "选项A是最合适的设计，因为它提供了可扩展的多智能体编排、清晰的领域分离和强大的治理，同时运营复杂性最低。监督智能体模式是AWS推荐的多智能体系统标准方法：一个智能体执行意图分类和路由，而专门智能体处理领域特定任务。使用独立的知识库隔离数据可确保每个专门的协作者智能体仅检索与其科室相关的信息。这提高了响应准确性，减少了幻觉，并支持隐私控制，因为临床内容、理赔内容和排程内容可以有不同的访问策略。基于IAM的过滤确保每个智能体仅有权访问其授权的知识库。通过监督智能体路由患者查询支持高并发性和可扩展性。可以通过引入新的协作者智能体和知识库来添加新科室或功能，而无需重新设计整个系统。由于路由集中处理，分类逻辑的更改不需要更新许多独立的监督智能体。在每个协作者智能体中使用RAG确保响应基于科室批准的信息源，这在医疗保健环境中对于减少不安全或不正确的指导至关重要。这种方法还提高了性能，因为每个检索范围更小且更相关，支持数千个并行交互。选项B引入了无法扩展的手动交接。选项C依赖单个通用智能体内的基于规则的路由，随着复杂性增长会变得脆弱且难以治理。选项D将所有科室混合到一个知识库中并外部合并响应，增加了错误领域答案的风险和运营开销。因此，选项A最好地满足了可扩展性、正确性和多智能体入职要求。"}, {"id": 39, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "An ecommerce company is developing a generative AI (GenAI) solution that uses Amazon Bedrock with \nAnthropic Claude to recommend products to customers. Customers report that some recommended products \nare not available for sale or are not relevant. Customers also report long response times for some \nrecommendations. The company confirms that most customer interactions are unique and that the solution recommends products \nnot present in the product catalog. Which solution will meet this requirement? A. B. C. D.", "body_zh": "一家电商公司正在开发一个使用Amazon Bedrock和Anthropic Claude向客户推荐产品的生成式AI(GenAI)解决方案。客户报告说，一些推荐的产品不可售或不相关。客户还报告说某些推荐的响应时间较长。公司确认大多数客户交互是唯一的，并且该解决方案推荐的产品不在产品目录中。哪种解决方案能满足这一要求？", "options_en": ["Increase grounding within Amazon Bedrock Guardrails. Enable automated reasoning checks. Set up \nprovisioned throughput.", "Use prompt engineering to restrict model responses to relevant products. Use streaming inference to \nreduce perceived latency.", "Create an Amazon Bedrock Knowledge Bases and implement Retrieval Augmented Generation (RAG). \nSet the PerformanceConfigLatency parameter to optimized.", "Store product catalog data in Amazon OpenSearch Service. Validate model recommendations against \nthe catalog. Use Amazon DynamoDB for response caching."], "options_zh": ["增加Amazon Bedrock护栏内的接地性。启用自动推理检查。设置预配吞吐量。", "使用提示工程限制模型对相关产品的响应。使用流式推理降低感知延迟。", "创建Amazon Bedrock Knowledge Bases并实施检索增强生成(RAG)。将PerformanceConfigLatency参数设置为优化。", "将产品目录数据存储在Amazon OpenSearch Service中。验证模型推荐与目录的匹配性。使用Amazon DynamoDB进行响应缓存。"], "a": "C", "explanation_en": "Option C is the correct solution because it directly addresses both correctness and performance issues by grounding the model’s responses in authoritative product data using Retrieval Augmented Generation. Amazon Bedrock Knowledge Bases are designed to connect foundation models to trusted enterprise data sources, ensuring that generated responses are constrained to known, validated content. By ingesting the product catalog into a knowledge base, the GenAI application retrieves only products that actually exist in the catalog. This prevents hallucinated or unavailable recommendations, which is a common issue when models rely solely on prompt instructions without retrieval grounding. RAG ensures that the model’s output is based on retrieved facts rather than learned generalizations. Setting the PerformanceConfigLatency parameter to optimized enables Bedrock to prioritize lower-latency retrieval and inference paths, improving responsiveness for real-time recommendation scenarios. This directly addresses the reported performance issues without requiring provisioned throughput or caching strategies that are ineffective for mostly unique interactions. Option A improves safety and latency predictability but does not ensure recommendations are limited to valid products. Option B relies on prompt constraints, which are not sufficient to prevent hallucinations. Option D introduces additional validation and caching layers but increases complexity and does not improve generation relevance. Therefore, Option C best resolves both relevance and latency challenges using AWS-native, low-maintenance GenAI integration patterns.", "explanation_zh": "选项C是正确的解决方案，因为它通过使用检索增强生成将模型的响应基于权威产品数据，直接解决了正确性和性能问题。Amazon Bedrock Knowledge Bases旨在将基础模型连接到可信的企业数据源，确保生成的响应限制在已知的、经过验证的内容范围内。通过将产品目录摄取到知识库中，GenAI应用程序仅检索目录中实际存在的产品。这防止了虚构或不可用的推荐，这是模型仅依赖提示指令而无检索接地时的常见问题。RAG确保模型的输出基于检索到的事实而非学习到的泛化。将PerformanceConfigLatency参数设置为优化，使Bedrock优先选择更低延迟的检索和推理路径，改善了实时推荐场景的响应速度。这直接解决了报告的性能问题，而无需预配吞吐量或对于绝大多数唯一交互无效的缓存策略。选项A提高了安全性和延迟可预测性，但不能确保推荐仅限于有效的产品。选项B依赖提示约束，不足以防止幻觉。选项D引入了额外的验证和缓存层，但增加了复杂性且未改善生成相关性。因此，选项C使用AWS原生、低维护的GenAI集成模式最佳地解决了相关性和延迟挑战。"}, {"id": 40, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A university recently digitized a collection of archival documents, academic journals, and manuscripts. The \nuniversity stores the digital files in an AWS Lake Formation data lake. The university hires a GenAI developer to build a solution to allow users to search the digital files by using \ntext queries. The solution must return journal abstracts that are semantically similar to a user's query. Users \nmust be able to search the digitized collection based on text and metadata that is associated with the journal \nabstracts. The metadata of the digitized files does not contain keywords. The solution must match similar \nabstracts to one another based on the similarity of their text. The data lake contains fewer than 1 million files. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一所大学最近将一批档案文件、学术期刊和手稿进行了数字化。大学将数字化文件存储在AWS Lake Formation数据湖中。大学聘请了一位GenAI开发人员构建一个解决方案，允许用户通过文本查询搜索数字化文件。该解决方案必须返回与用户查询语义相似的期刊摘要。用户必须能够基于与期刊摘要关联的文本和元数据搜索数字化馆藏。数字化文件的元数据不包含关键词。该解决方案必须基于文本相似性将相似的摘要相互匹配。数据湖包含少于100万个文件。哪种解决方案能以最少的运营开销满足这些要求？", "options_en": ["Use Amazon Titan Embeddings in Amazon Bedrock to create vector representations of the digitized \nfiles. Store embeddings in the OpenSearch Neural plugin for Amazon OpenSearch Service.", "Use Amazon Comprehend to extract topics from the digitized files. Store the topics and file metadata in \nan Amazon Aurora PostgreSQL database. Query the abstract metadata against the data in the Aurora \ndatabase.", "Use Amazon SageMaker AI to deploy a sentence-transformer model. Use the model to create vector \nrepresentations of the digitized files. Store embeddings in an Amazon Aurora PostgreSQL database that \nhas the pgvector extension.", "Use Amazon Titan Embeddings in Amazon Bedrock to create vector representations of the digitized \nfiles. Store embeddings in an Amazon Aurora PostgreSQL Serverless database that has the pgvector \nextension."], "options_zh": ["使用Amazon Bedrock中的Amazon Titan Embeddings创建数字化文件的向量表示。将嵌入存储在Amazon OpenSearch Service的OpenSearch Neural插件中。", "使用Amazon Comprehend从数字化文件中提取主题。将主题和文件元数据存储在Amazon Aurora PostgreSQL数据库中。在Aurora数据库中查询摘要元数据。", "使用Amazon SageMaker AI部署一个句子转换模型。使用该模型创建数字化文件的向量表示。将嵌入存储在具有pgvector扩展的Amazon Aurora PostgreSQL数据库中。", "使用Amazon Bedrock中的Amazon Titan Embeddings创建数字化文件的向量表示。将嵌入存储在具有pgvector扩展的Amazon Aurora PostgreSQL Serverless数据库中。"], "a": "D", "explanation_en": "Option is the best choice because it delivers true semantic search with the smallest operational footprint by D combining a fully managed embedding service with an automatically scaling vector-capable database. The university’s requirement is explicitly semantic: the metadata has no keywords, and the system must match abstracts based on similarity of meaning. This is a direct fit for an embeddings-based approach, where each abstract is converted into a vector representation and searched using vector similarity. Amazon Titan provides a managed way to generate these vectors without hosting or Embeddings in Amazon Bedrock maintaining an ML model, eliminating the operational work of model provisioning, patching, scaling, and lifecycle management. For storage and retrieval, with the extension supports Amazon Aurora PostgreSQL Serverless pgvector vector storage and similarity search while minimizing infrastructure operations. Aurora Serverless reduces capacity planning and scaling tasks because it can automatically adjust to changes in workload, which is valuable for a university search application with variable usage patterns. With fewer than 1 million files, a PostgreSQL-based vector store is commonly operationally simpler than running a dedicated search cluster, while still meeting the requirement to query using both text-derived similarity and associated metadata filters stored alongside the vectors. Option can also enable vector search, but operating an OpenSearch domain typically introduces additional A concerns such as domain sizing, shard strategy, cluster scaling, and performance tuning for k-NN workloads. Option increases operational overhead the most because it requires deploying and operating a sentence- C transformer model endpoint in SageMaker AI, including scaling, monitoring, and model management. Option does not meet the semantic similarity requirement reliably because topic extraction is not equivalent to B embedding-based semantic matching, especially when the metadata lacks keywords and the system must compare abstracts by meaning. Therefore, best satisfies semantic search needs with the least operational overhead. D", "explanation_zh": "选项D是最佳选择，因为它通过将完全托管的嵌入服务与自动扩缩的向量能力数据库相结合，以最小的运营足迹实现真正的语义搜索。大学的要求是明确的语义搜索：元数据没有关键词，系统必须基于含义相似性匹配摘要。这直接适合基于嵌入的方法，其中每个摘要被转换为向量表示并使用向量相似性进行搜索。Amazon Bedrock中的Amazon Titan Embeddings提供了一种托管方式来生成这些向量，无需托管或维护ML模型，消除了模型配置、修补、扩缩和生命周期管理的运营工作。对于存储和检索，具有pgvector扩展的Amazon Aurora PostgreSQL Serverless支持向量存储和相似性搜索，同时最大限度地减少基础设施运营。Aurora Serverless减少了容量规划和扩缩任务，因为它可以根据工作负载变化自动调整，对于使用模式多变的大学搜索应用非常有价值。由于文件少于100万个，基于PostgreSQL的向量存储在操作上通常比运行专用搜索集群更简单，同时仍能满足使用文本派生相似性和存储在向量旁边的关联元数据过滤器进行查询的要求。选项A也可以启用向量搜索，但运营OpenSearch域通常会引起额外的考虑，如域大小调整、分片策略、集群扩缩和k-NN工作负载的性能调优。选项C增加了最多的运营开销，因为它需要在SageMaker AI中部署和运行句子转换模型端点，包括扩缩、监控和模型管理。选项B不可靠地满足语义相似性要求，因为主题提取不等同于基于嵌入的语义匹配，并且无法有效处理没有关键词的元数据。因此，选项D以最少的运营开销提供了语义搜索的所有功能。"}, {"id": 41, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "An enterprise application uses an Amazon Bedrock foundation model (FM) to process and analyze 50 to 200 \npages of technical documents. Users are experiencing inconsistent responses and receiving truncated outputs \nwhen processing documents that exceed the FM's context window limits. Which solution will resolve this problem? A. B. C. D.", "body_zh": "一家企业应用程序使用Amazon Bedrock基础模型（FM）处理和分析50至200页的技术文档。当处理的文档超过FM的上下文窗口限制时，用户会收到不一致的响应和被截断的输出。哪种解决方案能解决这个问题？A. B. C. D.", "options_en": ["Configure fixed-size chunking at 4,000 tokens for each chunk with 20% overlap. Use application-level \nlogic to link multiple chunks sequentially until the FM's maximum context window of 200,000 tokens \nis reached before making inference calls.", "Use hierarchical chunking with parent chunks of 8,000 tokens and child chunks of 2,000 tokens. Use \nAmazon Bedrock Knowledge Bases built-in retrieval to automatically select relevant parent chunks \nbased on query context. Configure overlap tokens to maintain semantic continuity.", "Use semantic chunking with a breakpoint percentile threshold of 95% and a buffer size of 3 sentences. \nUse the RetrieveAndGenerate API to dynamically select the most relevant chunks based on embedding \nsimilarity scores.", "Create a pre-processing AWS Lambda function that analyzes document token count by using the FM's \ntokenizer. Configure the Lambda function to split documents into equal segments that fit within 80% of \nthe context window. Configure the Lambda function to process each segment independently before \naggregating the results."], "options_zh": ["将每个数据块配置为固定大小4000个令牌，重叠率为20%。使用应用程序级逻辑按顺序链接多个数据块，直到达到FM的最大上下文窗口200000个令牌，然后再进行推理调用。", "使用分层分块，父块大小为8000个令牌，子块大小为2000个令牌。使用Amazon Bedrock知识库的内置检索功能，根据查询上下文自动选择相关的父块。配置重叠令牌以保持语义连续性。", "使用语义分块，断点百分位阈值设为95%，缓冲区大小为3个句子。使用RetrieveAndGenerate API根据嵌入相似度分数动态选择最相关的数据块。", "创建一个预处理AWS Lambda函数，使用FM的分词器分析文档的令牌数量。配置该Lambda函数将文档分割为适合上下文窗口80%的等长段。配置该Lambda函数独立处理每个段，然后汇总结果。"], "a": "C", "explanation_en": "Option C directly addresses the root cause of truncated and inconsistent responses by using AWS- recommended semantic chunking and dynamic retrieval rather than static or sequential chunk processing. Amazon Bedrock documentation emphasizes that foundation models have fixed context windows and that sending oversized or poorly structured input can lead to truncation, loss of context, and degraded output quality. Semantic chunking breaks documents based on meaning instead of fixed token counts. By using a breakpoint percentile threshold and sentence buffers, the content remains coherent and semantically complete. This approach reduces the likelihood that important concepts are split across chunks, which is a common cause of inconsistent summarization results. The RetrieveAndGenerate API is designed specifically to handle large documents that exceed a model’s context window. Instead of forcing all content into a single inference call, the API generates embeddings for chunks and dynamically selects only the most relevant chunks based on similarity to the user query. This ensures that the FM receives only high-value context while staying within its context window limits. Option A is ineffective because chaining chunks sequentially does not align with how FMs process context and risks exceeding context limits or introducing irrelevant information. Option B improves structure but still relies on larger parent chunks, which can lead to inefficiencies when processing very large documents. Option D processes segments independently, which often causes loss of global context and inconsistent summaries. Therefore, Option C is the most robust, AWS-aligned solution for resolving truncation and consistency issues when processing large technical documents with Amazon Bedrock.", "explanation_zh": "选项C是正确的，因为它直接解决了截断和不一致响应的根本原因，使用AWS推荐的语义分块和动态检索，而非静态或顺序分块处理。Amazon Bedrock文档强调，基础模型具有固定的上下文窗口，发送过大或结构不当的输入会导致截断、上下文丢失和输出质量下降。语义分块根据含义而非固定令牌数来分割文档。通过使用断点百分位阈值和句子缓冲区，内容保持连贯且语义完整。这种方法降低了重要概念被分割到不同数据块的可能性，而这正是不一致摘要结果的常见原因。RetrieveAndGenerate API专门设计用于处理超过模型上下文窗口的大型文档。它不为所有内容使用单次推理调用，而是为数据块生成嵌入，并根据与用户查询的相似度动态选择最相关的数据块。这确保了FM只接收高价值上下文，同时保持在上下文窗口限制内。选项A无效，因为按顺序链接数据块不符合FM处理上下文的方式，并存在超出上下文限制或引入无关信息的风险。选项B改进了结构，但仍依赖较大的父块，在处理超大型文档时可能导致效率低下。选项D独立处理各段，通常会导致全局上下文丢失和摘要不一致。因此，选项C是使用Amazon Bedrock处理大型技术文档时解决截断和一致性问题的稳健且符合AWS建议的解决方案。"}, {"id": 42, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is developing a generative AI (GenAI) application that analyzes customer service calls in real \ntime and generates suggested responses for human customer service agents. The application must process \n500,000 concurrent calls during peak hours with less than 200 ms end-to-end latency for each suggestion. The \ncompany uses existing architecture to transcribe customer call audio streams. The application must not exceed \na predefined monthly compute budget and must maintain auto scaling capabilities. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在开发一个生成式AI（GenAI）应用程序，用于实时分析客户服务通话并为人工客服人员生成建议回复。该应用程序必须在高峰时段处理50万个并发通话，每个建议的端到端延迟低于200毫秒。公司使用现有架构转录客户通话音频流。应用程序不得超过预定义的月度计算预算，并必须保持自动扩展能力。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Deploy a large, complex reasoning model on Amazon Bedrock. Purchase provisioned throughput and \noptimize for batch processing.", "Deploy a low-latency, real-time optimized model on Amazon Bedrock. Purchase provisioned \nthroughput and set up automatic scaling policies.", "Deploy a large language model (LLM) on an Amazon SageMaker real-time endpoint that uses \ndedicated GPU instances.", "Deploy a mid-sized language model on an Amazon SageMaker serverless endpoint that is optimized for \nbatch processing."], "options_zh": ["在Amazon Bedrock上部署一个大型复杂推理模型。购买预置吞吐量并针对批量处理进行优化。", "在Amazon Bedrock上部署一个低延迟、实时优化的模型。购买预置吞吐量并设置自动扩展策略。", "在Amazon SageMaker实时端点上部署一个大型语言模型（LLM），使用专用GPU实例。", "在Amazon SageMaker无服务器端点上部署一个中型语言模型，针对批量处理进行优化。"], "a": "B", "explanation_en": "Option B is the correct solution because it aligns with AWS guidance for building high-throughput, ultra-low- latency GenAI applications while maintaining predictable costs and automatic scaling. Amazon Bedrock provides access to foundation models that are specifically optimized for real-time inference use cases, including conversational and recommendation-style workloads that require responses within milliseconds. Low-latency models in Amazon Bedrock are designed to handle very high request rates with minimal per- request overhead. Purchasing provisioned throughput ensures that sufficient model capacity is reserved to handle peak loads, eliminating cold starts and reducing request queuing during traffic surges. This is critical when supporting up to 500,000 concurrent calls with strict latency requirements. Automatic scaling policies allow the application to dynamically adjust capacity based on demand, ensuring cost efficiency during off-peak hours while maintaining performance during peak usage. This directly supports the requirement to stay within a predefined monthly compute budget. Option A fails because batch processing and complex reasoning models introduce higher latency and are not suitable for real-time suggestions. Option C introduces significantly higher operational and cost overhead due to dedicated GPU instances and manual scaling responsibilities. Option D is optimized for batch workloads and cannot meet the sub-200 ms latency requirement. Therefore, Option B provides the best balance of performance, scalability, cost control, and operational simplicity using AWS-native GenAI services.", "explanation_zh": "选项B是正确的，因为它符合AWS关于构建高吞吐量、超低延迟GenAI应用程序的指导原则，同时保持可预测的成本和自动扩展。Amazon Bedrock提供专为实时推理用例优化的基础模型，包括需要在毫秒级内响应的对话式和推荐式工作负载。Amazon Bedrock中的低延迟模型旨在以最小的每请求开销处理极高的请求速率。购买预置吞吐量确保预留足够的模型容量来处理峰值负载，消除冷启动，并在流量激增期间减少请求排队。这对于支持高达50万个并发调用且延迟要求严格的场景至关重要。自动扩展策略允许应用程序根据需求动态调整容量，确保非高峰时段的成本效率，同时在高峰使用期间保持性能。这直接支持了在预定义的月度计算预算内运行的要求。选项A失败是因为批量处理和复杂推理模型会引入更高的延迟，不适合实时建议场景。选项C由于专用GPU实例和手动扩展职责而引入了显著更高的运营和成本开销。选项D针对批量工作负载进行优化，无法满足低于200毫秒的延迟要求。因此，选项B在使用AWS原生GenAI服务方面提供了性能、可扩展性、成本控制和运营简洁性的最佳平衡。"}, {"id": 43, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company provides a service that helps users from around the world discover new restaurants. The service \nhas 50 million monthly active users. The company wants to implement a semantic search solution across a \ndatabase that contains 20 million restaurants and 200 million reviews. The company currently stores the data \nin PostgreSQL. The solution must support complex natural language queries and return results for at least 95% of queries \nwithin 500 ms. The solution must maintain data freshness for restaurant details that update hourly. The \nsolution must also scale cost-effectively during peak usage periods. Which solution will meet these requirements with the LEAST development effort? A. B. C. D.", "body_zh": "一家公司提供一项服务，帮助全球用户发现新餐厅。该服务拥有5000万月活跃用户。公司希望在一个包含2000万条餐厅数据和2亿条评价的数据库上实现语义搜索解决方案。公司目前将数据存储在PostgreSQL中。该解决方案必须支持复杂的自然语言查询，并在500毫秒内为至少95%的查询返回结果。解决方案必须保持每小时更新的餐厅详情数据的新鲜度，并且必须在高峰使用期间具有经济高效的可扩展性。哪种解决方案能在开发工作量最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Migrate the restaurant data to Amazon OpenSearch Service. Implement keyword-based search rules \nthat use custom analyzers and relevance tuning to find restaurants based on attributes such as cuisine \ntype, features, and location. Create Amazon API Gateway HTTP API endpoints to transform user \nqueries into structured search parameters.", "Migrate the restaurant data to Amazon OpenSearch Service. Use a foundation model (FM) in Amazon \nBedrock to generate vector embeddings from restaurant descriptions, reviews, and menu items. When \nusers submit natural language queries, convert the queries to embeddings by using the same FM. \nPerform k-nearest neighbors (k-NN) searches to find semantically similar results.", "Keep the restaurant data in PostgreSQL and implement a pgvector extension. Use a foundation model \n(FM) in Amazon Bedrock to generate vector embeddings from restaurant data. Store the vector", "embeddings directly in PostgreSQL. Create an AWS Lambda function to convert natural language \nqueries to vector representations by using the same FM. Configure the Lambda function to perform \nsimilarity searches within the database.", "Migrate restaurant data to an Amazon Bedrock knowledge base by using a custom ingestion pipeline. \nConfigure the knowledge base to automatically generate embeddings from restaurant information. Use \nthe Amazon Bedrock Retrieve API with built-in vector search capabilities to query the knowledge base \ndirectly by using natural language input."], "options_zh": ["将餐厅数据迁移到Amazon OpenSearch Service。实施基于关键字的搜索规则，使用自定义分析器和相关性调优，根据菜系类型、特色和位置等属性查找餐厅。创建Amazon API Gateway HTTP API端点，将用户查询转换为结构化搜索参数。", "将餐厅数据迁移到Amazon OpenSearch Service。使用Amazon Bedrock中的基础模型（FM）从餐厅描述、评价和菜单项生成向量嵌入。当用户提交自然语言查询时，使用相同的FM将查询转换为嵌入。执行k近邻（k-NN）搜索以查找语义相似的结果。", "将餐厅数据保留在PostgreSQL中并实施pgvector扩展。使用Amazon Bedrock中的基础模型（FM）从餐厅数据生成向量嵌入。将向量", "嵌入直接存储在PostgreSQL中。创建一个AWS Lambda函数，使用相同的FM将自然语言查询转换为向量表示。配置该Lambda函数在数据库内执行相似性搜索。", "将餐厅数据通过自定义摄取管道迁移到Amazon Bedrock知识库。配置知识库自动从餐厅信息生成嵌入。使用Amazon Bedrock Retrieve API的内置向量搜索功能直接通过自然语言输入查询知识库。"], "a": "B", "explanation_en": "Option B best satisfies the requirements while minimizing development effort by combining managed semantic search capabilities with fully managed foundation models. AWS Generative AI guidance describes semantic search as a vector-based retrieval pattern where both documents and user queries are embedded into a shared vector space. Similarity search (such as k-nearest neighbors) then retrieves results based on meaning rather than exact keywords. Amazon OpenSearch Service natively supports vector indexing and k-NN search at scale. This makes it well suited for large datasets such as 20 million restaurants and 200 million reviews while still achieving sub- second latency for the majority of queries. Because OpenSearch is a distributed, managed service, it automatically scales during peak traffic periods and provides cost-effective performance compared with building and tuning custom vector search pipelines on relational databases. Using Amazon Bedrock to generate embeddings significantly reduces development complexity. AWS manages the foundation models, eliminates the need for custom model hosting, and ensures consistency by using the same FM for both document embeddings and query embeddings. This aligns directly with AWS- recommended semantic search architectures and removes the need for model lifecycle management. Hourly updates to restaurant data can be handled efficiently through incremental re-indexing in OpenSearch without disrupting query performance. This approach cleanly separates transactional data storage from search workloads, which is a best practice in AWS architectures. Option A does not meet the semantic search requirement because keyword-based search cannot reliably interpret complex natural language intent. Option C introduces scalability and performance risks by running large-scale vector similarity searches inside PostgreSQL, which increases operational complexity. Option D adds unnecessary ingestion and abstraction layers intended for retrieval-augmented generation, not high- throughput semantic search. Therefore, Option B provides the optimal balance of performance, scalability, data freshness, and minimal development effort using AWS Generative AI services.", "explanation_zh": "选项B最能满足要求，同时将开发工作量降至最低，它结合了托管式语义搜索功能和完全托管的基础模型。AWS生成式AI指导将语义描述为一种基于向量的检索模式，其中文档和用户查询都被嵌入到共享向量空间中。然后相似性搜索（如k近邻）根据含义而非精确关键字检索结果。Amazon OpenSearch Service原生支持大规模向量索引和k-NN搜索。这使得它非常适合2000万餐厅和2亿评价这样的大型数据集，同时仍能为大多数查询实现亚秒级延迟。由于OpenSearch是一个分布式托管服务，它能在高峰流量期间自动扩展，并提供相比在关系数据库上构建和调优自定义向量搜索管道更具成本效益的性能。使用Amazon Bedrock生成嵌入显著降低了开发复杂性。AWS管理基础模型，消除了自定义模型托管的需求，并通过为文档嵌入和查询嵌入使用相同的FM来确保一致性。这直接符合AWS推荐的语义搜索架构，并消除了模型生命周期管理的需要。餐厅数据的每小时更新可以通过OpenSearch中的增量重新索引高效处理，而不会影响查询性能。这种方法将事务性数据存储与搜索工作负载清晰分离，这是AWS架构中的最佳实践。"}, {"id": 44, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A financial services company needs to pre-process unstructured data such as customer transcripts, financial \nreports, and documentation. The company stores the unstructured data in Amazon S3 to support an Amazon \nBedrock application. The company must validate data quality, create auditable metadata, monitor data metrics, and customize text \nchunking to optimize foundation model (FM) performance. Which solution will meet these requirements with the LEAST development effort? A. B. C. D.", "body_zh": "一家金融服务公司需要对非结构化数据进行预处理，如客户通话记录、财务报告和文档。公司将非结构化数据存储在Amazon S3中，以支持Amazon Bedrock应用程序。公司必须验证数据质量、创建可审计的元数据、监控数据指标，并自定义文本分块以优化基础模型（FM）的性能。哪种解决方案能在开发工作量最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Use Amazon SageMaker Data Wrangler to create a data flow. Configure Amazon CloudWatch metrics \nand alarms to monitor data quality. Use a custom AWS Lambda function to pre-process the data. Load \nprocessed data into Amazon Bedrock.", "Set up an AWS Glue crawler to catalog data sources. Create AWS Glue ETL jobs to run custom \ntransformation scripts. Use AWS Glue Data Quality to validate and monitor data quality. Load \nprocessed data into Amazon Bedrock.", "Use Amazon Comprehend to extract entities. Create an AWS Lambda function to chunk text. Run \nAmazon Athena to query and validate data quality. Load processed data into Amazon Bedrock.", "Create an AWS Step Functions workflow to orchestrate data pre-processing tasks. Run custom code on \nAmazon EC2 instances. Use Amazon SageMaker Model Monitor to monitor data quality. Load \nprocessed data into Amazon Bedrock."], "options_zh": ["使用Amazon SageMaker Data Wrangler创建数据流。配置Amazon CloudWatch指标和告警来监控数据质量。使用自定义AWS Lambda函数预处理数据。将处理后的数据加载到Amazon Bedrock。", "设置AWS Glue爬网程序对数据源进行编目。创建AWS Glue ETL作业运行自定义转换脚本。使用AWS Glue Data Quality验证和监控数据质量。将处理后的数据加载到Amazon Bedrock。", "使用Amazon Comprehend提取实体。创建AWS Lambda函数对文本进行分块。运行Amazon Athena查询和验证数据质量。将处理后的数据加载到Amazon Bedrock。", "创建AWS Step Functions工作流来编排数据预处理任务。在Amazon EC2实例上运行自定义代码。使用Amazon SageMaker Model Monitor监控数据质量。将处理后的数据加载到Amazon Bedrock。"], "a": "B", "explanation_en": "Option B is the most appropriate solution because it uses AWS-native, purpose-built data engineering and governance services to address data quality validation, metadata creation, monitoring, and transformation with minimal custom development. AWS Glue is designed specifically for large-scale data preparation and integrates seamlessly with Amazon S3, making it ideal for preprocessing unstructured datasets for downstream GenAI applications. AWS Glue crawlers automatically infer schemas and populate the AWS Glue Data Catalog, creating auditable, queryable metadata for all datasets. This satisfies the requirement for traceability and governance, which is especially critical in financial services environments. Glue ETL jobs allow teams to implement customizable transformation logic, including text normalization and chunking strategies optimized for foundation model context windows. AWS Glue Data Quality provides built-in rulesets for validating completeness, accuracy, and consistency. It also publishes quality metrics that can be monitored over time, meeting the requirement for ongoing data quality monitoring without building custom validation frameworks. Because AWS Glue is fully managed, it eliminates the need to manage infrastructure, scaling, or orchestration. This significantly reduces development and operational effort compared to custom Lambda pipelines or EC2-based processing. The processed and validated data can then be safely ingested into Amazon Bedrock workflows or knowledge bases. Option A and C require custom logic for validation, monitoring, and chunking, increasing development complexity. Option D introduces unnecessary infrastructure management and services not optimized for data preprocessing. Therefore, Option B best meets the requirements while minimizing development effort and aligning with AWS Generative AI data preparation best practices.", "explanation_zh": "选项B是最合适的解决方案，因为它使用AWS原生的、专门构建的数据工程和治理服务，以最少的自定义开发来解决数据质量验证、元数据创建、监控和转换问题。AWS Glue专为大规模数据准备而设计，并与Amazon S3无缝集成，使其成为预处理下游GenAI应用程序非结构化数据集的理想选择。AWS Glue爬网程序自动推断模式并填充AWS Glue Data Catalog，为所有数据集创建可审计、可查询的元数据。这满足了可追溯性和治理的要求，在金融服务环境中尤为重要。Glue ETL作业允许团队实施可自定义的转换逻辑，包括针对基础模型上下文窗口优化的文本规范化和分块策略。AWS Glue Data Quality提供了用于验证完整性、准确性和一致性的内置规则集。它还发布可随时间监控的质量指标，满足持续数据质量监控的需求，而无需构建自定义验证框架。由于AWS Glue是完全托管的，它消除了管理基础设施、扩展或编排的需求。这显著减少了与自定义Lambda管道或基于EC2的处理相比的开发与运营工作量。处理并验证后的数据可以安全地导入Amazon Bedrock工作流或知识库。"}, {"id": 45, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is building a generative AI (GenAI) application that processes financial reports and provides \nsummaries for analysts. The application must run two compute environments. In one environment, AWS \nLambda functions must use the Python SDK to analyze reports on demand. In the second environment, \nAmazon EKS containers must use the JavaScript SDK to batch process multiple reports on a schedule. The \napplication must maintain conversational context throughout multi-turn interactions, use the same foundation \nmodel (FM) across environments, and ensure consistent authentication. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在构建一个生成式AI（GenAI）应用程序，该应用程序处理财务报告并为分析师提供摘要。应用程序必须运行两个计算环境。在一个环境中，AWS Lambda函数必须使用Python SDK按需分析报告。在第二个环境中，Amazon EKS容器必须使用JavaScript SDK按计划批量处理多个报告。应用程序必须维护多轮对话的上下文，跨环境使用相同的基础模型（FM），并确保一致的身份验证。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Use the Amazon Bedrock InvokeModel API with a separate authentication method for each \nenvironment. Store conversation states in Amazon DynamoDB. Use custom I/O formatting logic for \neach programming language.", "Use the Amazon Bedrock Converse API directly in both environments with a common authentication \nmechanism that uses IAM roles. Store conversation states in Amazon ElastiCache. Create programming \nlanguage-specific wrappers for model parameters.", "Create a centralized Amazon API Gateway REST API endpoint that handles all model interactions by \nusing the InvokeModel API. Store interaction history in application process memory in each Lambda \nfunction or EKS container. Use environment variables to configure model parameters.", "Use the Amazon Bedrock Converse API and IAM roles for authentication. Pass previous messages in \nthe request messages array to maintain conversational context. Use programming language-specific \nSDKs to establish consistent API interfaces."], "options_zh": ["使用Amazon Bedrock InvokeModel API，为每个环境使用单独的身份验证方法。将对话状态存储在Amazon DynamoDB中。为每种编程语言使用自定义I/O格式化逻辑。", "在两个环境中直接使用Amazon Bedrock Converse API，使用IAM角色的通用身份验证机制。将对话状态存储在Amazon ElastiCache中。为模型参数创建编程语言特定的包装器。", "创建一个集中式的Amazon API Gateway REST API端点，使用InvokeModel API处理所有模型交互。将交互历史存储在Lambda函数或EKS容器的应用程序进程内存中。使用环境变量配置模型参数。", "使用Amazon Bedrock Converse API和IAM角色进行身份验证。在请求消息数组中传递以前的消息以维护对话上下文。使用编程语言特定的SDK建立一致的API接口。"], "a": "D", "explanation_en": "Option D is the correct solution because the Amazon Bedrock Converse API is purpose-built for multi-turn conversational interactions and is designed to work consistently across SDKs and compute environments. The Converse API standardizes how messages, roles, and context are represented, which ensures consistent behavior whether the application is running in AWS Lambda with Python or in Amazon EKS with JavaScript. By passing previous messages in the messages array, the application explicitly maintains conversational context across turns without relying on external state stores. This approach is recommended by AWS for conversational GenAI workflows because it avoids state synchronization complexity and ensures deterministic model behavior across environments. Using IAM roles for authentication provides a single, consistent security model for both Lambda and EKS. IAM roles integrate natively with AWS SDKs, eliminating the need for custom authentication logic or environment-specific credentials. This aligns with AWS best practices for least privilege and simplifies governance. Option A introduces inconsistent authentication and custom formatting logic, increasing complexity. Option B unnecessarily introduces ElastiCache for state management, which is not required when using the Converse API correctly. Option C stores state in process memory, which is unsafe and unreliable for serverless and containerized workloads. Therefore, Option D best satisfies the requirements for conversational consistency, multi-environment support, shared model usage, and consistent authentication with minimal operational overhead.", "explanation_zh": "选项D是正确的解决方案，因为Amazon Bedrock Converse API专为多轮对话交互而设计，并且在不同SDK和计算环境之间保持一致工作。Converse API标准化了消息、角色和上下文的表示方式，确保无论是运行在AWS Lambda（Python）还是Amazon EKS（JavaScript）中的应用程序都表现一致。通过在消息数组中传递以前的消息，应用程序显式地跨轮次维护对话上下文，而无需依赖外部状态存储。AWS为对话式GenAI工作流推荐这种方法，因为它避免了状态同步复杂性，并确保跨环境的确定性模型行为。使用IAM角色进行身份验证为Lambda和EKS提供了单一一致的安全模型。IAM角色与AWS SDK原生集成，消除了自定义身份验证逻辑或环境特定凭证的需求。这符合AWS最小权限最佳实践，并简化了治理。选项A引入了不一致的身份验证和自定义格式化逻辑，增加了复杂性。选项B不必要地引入了ElastiCache进行状态管理，而在正确使用Converse API时并不需要。选项C将状态存储在进程内存中，对于无服务器和容器化工作负载来说是不安全且不可靠的。因此，选项D在对话一致性、多环境支持、共享模型使用和一致身份验证方面最佳地满足了要求，同时运营开销最小。"}, {"id": 46, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A medical company uses Amazon Bedrock to power a clinical documentation summarization system. The \nsystem produces inconsistent summaries when handling complex clinical documents. The system performed \nwell on simple clinical documents. The company needs a solution that diagnoses inconsistencies, compares prompt performance against \nestablished metrics, and maintains historical records of prompt versions. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗公司使用Amazon Bedrock为临床文档摘要系统提供支持。该在处理复杂临床文档时产生不一致的摘要。该系统在简单临床文档上表现良好。公司需要一个能够诊断不一致性、根据既定指标比较提示性能，并维护提示版本历史记录的解决方案。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Create multiple prompt variants by using Prompt management in Amazon Bedrock. Manually test the \nprompts with simple clinical documents. Deploy the highest performing version by using the Amazon \nBedrock console.", "Implement version control for prompts in a code repository with a test suite that contains complex \nclinical documents and quantifiable evaluation metrics. Use an automated testing framework to \ncompare prompt versions and document performance patterns.", "Deploy each new prompt version to separate Amazon Bedrock API endpoints. Split production traffic \nbetween the endpoints. Configure Amazon CloudWatch to capture response metrics and user feedback \nfor automatic version selection.", "Create a custom prompt evaluation flow in Amazon Bedrock Flows that applies the same clinical \ndocument inputs to different prompt variants. Use Amazon Comprehend Medical to analyze and score \nthe factual accuracy of each version."], "options_zh": ["使用Amazon Bedrock中的Prompt Management创建多个提示变体。使用简单临床文档手动测试提示。通过Amazon Bedrock控制台部署性能最高的版本。", "在代码仓库中对提示实施版本控制，并附带包含复杂临床文档和可量化评估指标的测试套件。使用自动化测试框架比较提示版本并记录性能模式。", "将每个新的提示版本部署到单独的Amazon Bedrock API端点。在端点之间分配生产流量。配置Amazon CloudWatch捕获响应指标和用户反馈，以自动选择版本。", "在Amazon Bedrock Flows中创建一个自定义提示评估流，将相同的临床文档输入应用于不同的提示变体。使用Amazon Comprehend Medical分析并评分每个版本的事实准确性。"], "a": "B", "explanation_en": "Option B best meets the requirements because it provides systematic diagnosis, measurable comparison, and historical traceability of prompt performance. By placing prompts under version control and testing them against complex clinical documents, the company can consistently reproduce issues, track regressions, and compare prompt behavior using quantifiable metrics such as factual accuracy, completeness, and consistency. Automated testing ensures scalability and repeatability, while version history preserves prompt evolution over time. Option A lacks objective metrics and does not address complex documents. Option C focuses on live traffic experimentation but does not inherently diagnose prompt inconsistencies or preserve detailed historical evaluations. Option D adds medical entity analysis but introduces unnecessary service coupling and does not provide robust prompt version history or automated comparative benchmarking. Therefore, Option B is the most complete and disciplined solution.", "explanation_zh": "选项B最能满足要求，因为它提供了系统化的诊断、可衡量的比较和提示性能的历史可追溯性。通过将提示置于版本控制之下并使用复杂临床文档进行测试，公司可以一致地重现问题、跟踪回归，并使用可量化指标（如事实准确性、完整性和一致性）比较提示行为。自动化测试确保了可扩展性和可重复性，而版本历史则保留了提示随时间的演变过程。选项A缺乏客观指标，也未处理复杂文档的问题。选项C侧重于实时流量实验，但本身并不能诊断提示不一致性或保存详细的历史评估。选项D增加了医学实体分析，但引入了不必要的服务耦合，并且没有提供稳健的提示版本历史或自动化的比较基准测试。因此，选项B是最完整、最规范的解决方案。"}, {"id": 47, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A pharmaceutical company is developing a Retrieval Augmented Generation (RAG) application that uses an \nAmazon Bedrock knowledge base. The knowledge base uses Amazon OpenSearch Service as a data source \nfor more than 25 million scientific papers. Users report that the application produces inconsistent answers that \ncite irrelevant sections of papers when queries span methodology, results, and discussion sections of the \npapers. The company needs to improve the knowledge base to preserve semantic context across related paragraphs on \nthe scale of the entire corpus of data. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家制药公司正在开发一个使用Amazon Bedrock知识库的检索增强生成（RAG）应用程序。知识库使用Amazon OpenSearch Service作为超过2500万篇科学论文的数据源。用户报告称，当查询跨越论文的方法、结果和讨论部分时，应用程序会产生不一致的答案，并引用不相关的论文部分。公司需要改进知识库，以在整个语料库规模上保持相关段落间的语义上下文。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Configure the knowledge base to use fixed-size chunking. Set a 300-token maximum chunk size and a \n10% overlap between chunks. Use an appropriate Amazon Bedrock embedding model.", "Configure the knowledge base to use hierarchical chunking. Use parent chunks that contain 1,000 \ntokens and child chunks that contain 200 tokens. Set a 50-token overlap between chunks.", "Configure the knowledge base to use semantic chunking. Use a buffer size of 1 and a breakpoint \npercentile threshold of 85% to determine chunk boundaries based on content meaning.", "Configure the knowledge base not to use chunking. Manually split each document into separate files \nbefore ingestion. Apply post-processing reranking during retrieval."], "options_zh": ["配置知识库使用固定大小分块。设置最大数据块大小为300个令牌，块间重叠率为10%。使用适当的Amazon Bedrock嵌入模型。", "配置知识库使用分层分块。使用包含1000个令牌的父块和包含200个令牌的子块。设置数据块间50个令牌的重叠。", "配置知识库使用语义分块。使用缓冲区大小1和断点百分位阈值85%，根据内容含义确定数据块边界。", "配置知识库不使用分块。在摄取前手动将每个文档分割为单独文件。在检索期间应用后处理重排序。"], "a": "B", "explanation_en": "Option B is the best solution because hierarchical chunking is specifically designed to preserve broader semantic context while still enabling precise retrieval at paragraph or sub-paragraph granularity. The problem described—answers citing irrelevant sections when a query spans multiple paper sections—often occurs when chunks are either too small (losing cross-paragraph context) or too “flat” (retrieving isolated snippets without their surrounding rationale). In a scientific paper, related information is frequently distributed across methodology, results, and discussion. Flat, fixed-size chunking (Option A) can split these logically connected ideas into separate chunks, causing retrieval to surface fragments that match a term but not the full intent. Semantic chunking (Option C) improves boundary placement, but it does not inherently provide a multi-resolution structure that helps preserve section-level continuity at massive scale. Hierarchical chunking solves this by creating parent chunks (larger context windows) that capture broader section context and child chunks (smaller units) that retain retrieval precision. When the retriever identifies relevant child chunks, it can also bring in the associated parent context so the foundation model sees the surrounding methodological or discussion framing. The defined overlaps further reduce the risk that key transitions or references are split across chunks. This approach is well suited for a corpus of 25 million papers because it improves relevance without requiring a custom reranking model or a manual preprocessing pipeline. It remains operationally efficient because it is configured at the knowledge base level rather than implemented through custom code per document. Option D introduces high operational complexity and inconsistent document handling at scale. Therefore, Option B best meets the requirement to preserve semantic context across related paragraphs and improve citation relevance across scientific paper sections.", "explanation_zh": "选项B是最佳解决方案，因为分层分块专门设计用于保留更广泛的语义上下文，同时仍能在段落或子段落粒度上进行精确检索。描述的问题——当查询跨越多个论文部分时，答案引用不相关的内容——通常发生在数据块太小（丢失跨段落上下文）或过于“扁平”（检索孤立的片段而缺乏周围推理）时。在科学论文中，相关信息经常分布在方法、结果和讨论部分。固定的固定大小分块（选项A）可能将这些逻辑上关联的观点分割到不同的数据块中，导致检索到匹配术语但不匹配完整意图的片段。语义分块（选项C）改善了边界放置，但本身不提供有助于在大规模下保持章节级连续性的多分辨率结构。分层分块通过创建父块（更大的上下文窗口）来捕获更广泛的章节上下文，以及子块（更小的单元）来保持检索精度来解决这个问题。当检索器识别出相关的子块时，它还可以引入关联的父上下文，以便基础模型看到周围的方法或讨论框架。定义的重叠进一步降低了关键过渡或引用被分割到不同数据块的风险。这种方法适用于2500万篇论文的语料库，因为它无需自定义重排序模型或手动预处理管道即可提高相关性。它在操作上保持高效，因为在知识库级别配置，而不是为每个文档实施自定义代码。选项D引入高操作复杂性和大规模下不一致的文档处理。因此，选项B最能满足在相关段落间保持语义上下文和提高整个科学语料库中引用相关性的要求。"}, {"id": 48, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is building a serverless application that uses AWS Lambda functions to help students around the \nworld summarize notes. The application uses Anthropic Claude through Amazon Bedrock. The company \nobserves that most of the traffic occurs during evenings in each time zone. Users report experiencing \nthrottling errors during peak usage times in their time zones. The company needs to resolve the throttling issues by ensuring continuous operation of the application. The \nsolution must maintain application performance quality and must not require a fixed hourly cost during low \ntraffic periods. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在构建一个使用AWS Lambda函数的无服务器应用程序，帮助世界各地的学生总结笔记。该应用程序通过Amazon Bedrock使用Anthropic Claude。公司观察到大部分流量发生在每个时区的晚间时段。用户报告在其所在时区的高峰使用时段遇到节流错误。公司需要通过确保应用程序持续运行来解决节流问题。解决方案必须保持应用程序性能质量，并且不得要求在低流量时段产生固定的小时费用。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Create custom Amazon CloudWatch metrics to monitor model errors. Set provisioned throughput to a \nvalue that is safely higher than the peak traffic observed.", "Create custom Amazon CloudWatch metrics to monitor model errors. Set up a failover mechanism to \nredirect invocations to a backup AWS Region when the errors exceed a specified threshold.", "Enable invocation logging in Amazon Bedrock. Monitor key metrics such as Invocations, \nInputTokenCount, OutputTokenCount, and InvocationThrottles. Distribute traffic across cross-Region \ninference endpoints.", "Enable invocation logging in Amazon Bedrock. Monitor InvocationLatency, InvocationClientErrors, \nand InvocationServerErrors metrics. Distribute traffic across multiple versions of the same model."], "options_zh": ["创建自定义Amazon CloudWatch指标来监控模型错误。将预置吞吐量设置为安全高于观察到的峰值流量的值。", "创建自定义Amazon CloudWatch指标来监控模型错误。设置故障转移机制，当错误超过指定阈值时将调用重定向到备份AWS区域。", "启用Amazon Bedrock中的调用日志记录。监控关键指标，如Invocations、InputTokenCount、OutputTokenCount和InvocationThrottles。将流量分布到跨区域推理端点。", "启用Amazon Bedrock中的调用日志记录。监控InvocationLatency、InvocationClientErrors和InvocationServerErrors指标。将流量分布到同一模型的多个版本。"], "a": "C", "explanation_en": "Option C is the correct solution because it resolves throttling while preserving performance and avoiding fixed costs during low-traffic periods. Amazon Bedrock supports on-demand inference with usage-based pricing, making it well suited for applications with time-zone–dependent traffic spikes. Throttling during peak hours typically occurs when inference requests exceed available regional capacity. Cross-Region inference allows Amazon Bedrock to automatically distribute requests across multiple AWS Regions, reducing contention and preventing throttling without requiring reserved or provisioned capacity. This approach ensures continuous operation while maintaining low latency for users in different geographic locations. Invocation logging and native metrics such as InvocationThrottles, InputTokenCount, and OutputTokenCount provide visibility into usage patterns and capacity constraints. Monitoring these metrics enables teams to validate that traffic distribution is working as intended and that performance remains consistent during peak periods. Option A introduces fixed hourly costs by relying on provisioned throughput, which directly violates the requirement to avoid unnecessary spend during low-traffic periods. Option B introduces regional failover complexity and reactive behavior instead of proactive load distribution. Option D does not address the root cause of throttling, as distributing traffic across model versions within the same Region does not increase available capacity. Therefore, Option C best aligns with AWS Generative AI best practices for scalable, cost-efficient, global serverless applications.", "explanation_zh": "选项C是正确的解决方案，因为它解决了节流问题，同时保持了性能并避免了低流量时段的固定成本。Amazon Bedrock支持基于使用量的按需推理定价，非常适合存在时区相关流量高峰的应用程序。高峰时段的节流通常发生在推理请求超过可用区域容量时。跨区域推理允许Amazon Bedrock自动将请求分布到多个AWS区域，减少争用并防止节流，而无需预留或预置容量。这种方法确保了持续运行，同时为不同地理位置的用户保持低延迟。调用日志记录和原生指标（如InvocationThrottles、InputTokenCount和OutputTokenCount）提供了对使用模式和能力限制的可视性。监控这些指标使团队能够验证流量分布是否按预期工作，以及性能在高峰期间是否保持一致。选项A通过依赖预置吞吐量引入了固定小时成本，这直接违反了避免低流量时段不必要支出的要求。选项B引入了区域故障转移的复杂性和被动行为，而非主动负载分配。选项D未解决节流的根本原因，因为在同一区域内将流量分布到多个模型版本并不会增加可用容量。因此，选项C最符合AWS生成式AI关于可扩展、高成本效益的全球无服务器应用程序的最佳实践。"}, {"id": 49, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "Company configures a landing zone in AWS Control Tower. The company handles sensitive data that must \nremain within the European Union. The company must use only the eu-central-1 Region. The company uses \nService Control Policies (SCPs) to enforce data residency policies. GenAI developers at the company are \nassigned IAM roles that have full permissions for Amazon Bedrock. The company must ensure that GenAI developers can use the Amazon Nova Pro model through Amazon \nBedrock only by using cross-Region inference (CRI) and only in eu-central-1. The company enables model \naccess for the GenAI developer IAM roles in Amazon Bedrock. However, when a GenAI developer attempts \nto invoke the model through the Amazon Bedrock Chat/Text playground, the GenAI developer receives the \nfollowing error: User arn:aws:sts:123456789012:assumed-role/AssumedDevRole/DevUserName Action: bedrock:InvokeModelWithResponseStream On resource(s): arn:aws:bedrock:eu-west-3::foundation-model/amazon.nova-pro-v1:0 Context: a service control policy explicitly denies the action The company needs a solution to resolve the error. The solution must retain the company's existing \ngovernance controls and must provide precise access control. The solution must comply with the company's \nexisting data residency policies. Which combination of solutions will meet these requirements? (Select TWO.) A. B. C. D. E.", "body_zh": "一家公司在AWS Control Tower中配置了一个着陆区。该公司处理敏感数据，数据必须保留在欧盟境内。公司只能使用eu-central-1区域。公司使用服务控制策略（SCP）来强制执行数据驻留策略。公司的GenAI开发人员被分配了具有Amazon Bedrock完全权限的IAM角色。公司必须确保GenAI开发人员只能通过跨区域推理（CRI）在eu-central-1中使用Amazon Nova Pro模型。公司在Amazon Bedrock中为GenAI开发人员IAM角色启用了模型访问。然而，当GenAI开发人员尝试通过Amazon Bedrock Chat/Text Playground调用模型时，开发人员收到以下错误：User arn:aws:sts:123456789012:assumed-role/AssumedDevRole/DevUserName Action: bedrock:InvokeModelWithResponseStream On resource(s): arn:aws:bedrock:eu-west-3::foundation-model/amazon.nova-pro-v1:0 Context: a service control policy explicitly denies the action 公司需要一个解决该错误的方案。该方案必须保留公司现有的治理控制，并提供精确的访问控制。该方案必须符合公司现有的数据驻留策略。哪组解决方案组合能满足这些要求？（选择两个。）A. B. C. D. E.", "options_en": ["Add an AdministratorAccess policy to the GenAI developer IAM role", "Extend the existing SCPs to enable CRI for the eu.amazon.nova-pro-v1:0 inference profile", "Enable Amazon Bedrock model access for Amazon Nova Pro in the eu-west-3 Region", "Validate that the GenAI developer IAM roles have permissions to invoke Amazon Nova Pro through \nthe eu.amazon.nova-pro-v1:0 inference profile on all European Union AWS Regions that can serve the \nmodel", "Extend the existing SCP to enable CRI for the eu-* inference profile"], "options_zh": ["向GenAI开发人员IAM角色添加AdministratorAccess策略", "扩展现有SCP，为eu.amazon.nova-pro-v1:0推理配置文件启用CRI", "在eu-west-3区域启用Amazon Nova Pro的Amazon Bedrock模型访问", "验证GenAI开发人员IAM角色是否具有权限，通过所有可为该模型提供服务的欧盟AWS区域中的eu.amazon.nova-pro-v1:0推理配置文件调用Amazon Nova Pro", "扩展现有SCP，为eu-*推理配置文件启用CRI"], "a": "B E", "explanation_en": "This error occurs because SCPs override IAM permissions, and the SCP currently blocks Bedrock inference calls that resolve to eu-west-3, even though the company intends to use cross-Region inference (CRI)
