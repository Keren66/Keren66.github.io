iness metrics such as conversion rates and \nrevenue impact in its own systems. The company needs a unified observability solution that correlates \ntechnical performance with business outcomes. The solution must provide automatic alerts to stakeholders \nwhen operational metrics indicate degradation. The solution must provide comprehensive visibility across \nboth technical and business metrics. A. B. C. D.", "body_zh": "一家大型电子商务公司已部署基础模型（FM）来生成产品描述。公司的工程团队通过Amazon CloudWatch监控令牌使用量、延迟和错误率等技术指标。公司的营销团队在其自己的系统中跟踪转化率和收入影响等业务指标。公司需要一个统一的可观测性解决方案，将技术性能与业务结果相关联。该解决方案必须在运维指标指示性能退化时自动向利益相关者发送告警。该解决方案必须提供跨技术和业务指标的全面可见性。哪种解决方案能满足这些要求？", "options_en": ["Create CloudWatch dashboards that include technical metrics and imported business metrics. Configure \nCloudWatch composite alarms that combine technical data and business data. Use Amazon SNS to set \nup notifications to stakeholders.", "Use Amazon Managed Grafana to visualize technical metrics from CloudWatch with business metrics \nfrom external sources. Configure Amazon Managed Grafana alerts to invoke AWS Lambda functions. \nConfigure the Lambda functions to remediate issues automatically when metrics exceed predefined \nthresholds.", "Stream CloudWatch metrics to Amazon S3 by using CloudWatch metric streams. Create Amazon \nQuickSight dashboards to visualize the combined technical metrics and business metrics. Set up \nAmazon EventBridge rules to send notifications to stakeholders when metrics exceed predefined \nthresholds.", "Configure CloudWatch custom dashboards that integrate operational metrics with imported business \nmetrics. Set up CloudWatch composite alarms with anomaly detection. Use Amazon SNS to create \nalarm actions to notify stakeholders when correlated metrics indicate performance issues."], "options_zh": ["创建包含技术指标和导入的业务指标的CloudWatch仪表板。配置结合技术数据和业务数据的CloudWatch复合告警。使用Amazon SNS设置对利益相关者的通知。", "使用Amazon Managed Grafana可视化来自CloudWatch的技术指标和来自外部来源的业务指标。配置Amazon Managed Grafana告警调用AWS Lambda函数。配置Lambda函数在指标超过预定义阈值时自动修复问题。", "通过CloudWatch指标流将CloudWatch指标流式传输到Amazon S3。创建Amazon QuickSight仪表板可视化组合的技术指标和业务指标。设置Amazon EventBridge规则在指标超过预定义阈值时向利益相关者发送通知。", "配置集成运维指标与导入业务指标的CloudWatch自定义仪表板。设置带有异常检测的CloudWatch复合告警。使用Amazon SNS创建告警操作，在关联指标指示性能问题时通知利益相关者。"], "a": "D", "explanation_en": "provides the most integrated path for unifying technical and business metrics. By Amazon CloudWatch importing business metrics into CloudWatch (via custom metrics or metric streams), teams can build custom that provide a single pane of glass for both system health and conversion performance. dashboards allow stakeholders to be notified only when multiple conditions are met (e.g., high latency Composite alarms dropping conversion rates), reducing alert fatigue. Applying to these metrics is and anomaly detection essential for GenAI workloads because performance baselines can shift subtly; CloudWatch can automatically detect these deviations and trigger alerts through . This solution provides comprehensive Amazon SNS correlation and automated alerting with less operational complexity than managing external visualization servers (Option B) or multi-service analytics pipelines (Option C).", "explanation_zh": "选项D提供了最集成的方式来统一技术和业务指标。通过将业务指标导入CloudWatch（通过自定义指标或指标流），团队可以构建提供系统健康和转化性能统一视图的自定义仪表板。复合告警允许仅在多个条件同时满足时（例如高延迟加上转化率下降）通知利益相关者，减少告警疲劳。对这些指标应用异常检测对于GenAI工作负载至关重要，因为性能基线可能微妙变化；CloudWatch可以自动检测这些偏差并通过Amazon SNS触发告警。此解决方案提供了全面的相关性和自动告警，运维复杂性低于管理外部可视化服务器（选项B）或多服务分析流水线（选项C）。"}, {"id": 119, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "An ecommerce company is building an internal platform to develop generative AI applications by using \nAmazon Bedrock foundation models (FMs). Developers need to select models based on evaluations that are \naligned to ecommerce use cases. The platform must display accuracy metrics for text generation and \nsummarization in dashboards. The company has custom ecommerce datasets to use as standardized evaluation \ninputs. Which combination of steps will meet these requirements with the LEAST operational overhead? (Select \nTWO.) A. B. C. D. E.", "body_zh": "一家电子商务公司正在构建一个内部平台，使用Amazon Bedrock基础模型（FM）开发生成式AI应用程序。开发人员需要基于与电子商务用例对齐的评估来选择模型。平台必须展示文本生成和摘要的准确性指标仪表板。公司拥有自定义电子商务数据集作为标准化评估输入。哪两种步骤的组合能以最少运维开销满足这些要求？（选择两个。）", "options_en": ["Import the datasets to an Amazon S3 bucket. Provide appropriate IAM permissions and cross-origin \nresource sharing (CORS) permissions to give the evaluation jobs access to the datasets.", "Import the datasets to an Amazon S3 bucket. Provide appropriate IAM permissions and a VPC endpoint \nconfiguration to give the evaluation jobs access to the datasets.", "Configure an AWS Lambda function to create model evaluation jobs on a schedule in the Amazon \nBedrock console. Provide the URI of the S3 bucket that contains the datasets as an input. Configure the \nevaluation jobs to measure the real world knowledge (RWK) score for text generation and BERTScore \nfor summarization. Configure a second Lambda function to check the status of the jobs and publish \ncustom logs to Amazon CloudWatch. Create a custom Amazon CloudWatch Logs Insights dashboard.", "Use Amazon SageMaker Clarify on a schedule to create model evaluation jobs. Use open source \nframeworks to create and run standardized evaluations. Publish results to Amazon CloudWatch \nnamespaces. Use an AWS Lambda function to check the status of the jobs and publish custom logs to \nAmazon CloudWatch. Create a custom Amazon CloudWatch Logs Insights dashboard.", "Run an Amazon SageMaker AI notebook job on a schedule by using the fmvelos or ragas framework to \nrun evaluations that use the datasets in the S3 bucket. Write Python code in the notebook that makes \ndirect InvokeModel API calls to the FMs and processes their responses for evaluation. Publish job \nstatus and results to Amazon CloudWatch Logs to measure the real world knowledge (RWK) score for \ntext generation and toxicity for summarization as metrics for accuracy. Create a custom CloudWatch \nLogs Insights dashboard."], "options_zh": ["将数据集导入Amazon S3存储桶。提供适当的IAM权限和跨域资源共享（CORS）权限，使评估任务能够访问数据集。", "将数据集导入Amazon S3存储桶。提供适当的IAM权限和VPC端点配置，使评估任务能够访问数据集。", "配置AWS Lambda函数按计划在Amazon Bedrock控制台中创建模型评估任务。提供包含数据集的S3存储桶URI作为输入。配置评估任务测量文本生成的RWK分数和摘要的BERTScore。配置第二个Lambda函数检查任务状态并将自定义日志发布到Amazon CloudWatch。创建自定义Amazon CloudWatch Logs Insights仪表板。", "按计划使用Amazon SageMaker Clarify创建模型评估任务。使用开源框架创建和运行标准化评估。将结果发布到Amazon CloudWatch命名空间。使用AWS Lambda函数检查任务状态并将自定义日志发布到Amazon CloudWatch。创建自定义Amazon CloudWatch Logs Insights仪表板。", "按计划使用Amazon SageMaker AI笔记本作业，使用fmvelos或ragas框架运行使用S3存储桶中数据集的评估。在笔记本中编写直接对FM进行InvokeModel API调用并处理其响应以进行评估的Python代码。将任务状态和结果发布到Amazon CloudWatch Logs，测量文本生成的RWK分数和摘要的毒性作为准确性指标。创建自定义CloudWatch Logs Insights仪表板。"], "a": "B C", "explanation_en": "The least operational overhead approach is to use managed workflows Amazon Bedrock model evaluation with datasets stored in , and then publish results into for dashboards. That Amazon S3 Amazon CloudWatch is exactly what options and combine. B C Step correctly places standardized evaluation inputs in Amazon S3 and focuses on granting the evaluation B workflow the right permissions to read those datasets. In practice, the key requirement is controlled access to the S3 objects used as evaluation datasets. Establishing IAM permissions and private access patterns (such as using VPC connectivity patterns where applicable to the organization’s networking posture) is aligned with enterprise requirements and avoids building custom storage or data distribution systems for evaluators. Step then operationalizes the evaluation lifecycle with minimal infrastructure: a scheduled C AWS Lambda function starts evaluation jobs using the S3 dataset location, and a second Lambda function checks job status and pushes results and operational signals to . This meets the platform requirement to surface CloudWatch accuracy metrics in dashboards because CloudWatch metrics/logs can be visualized in dashboards and queried through . It also supports continuous, standardized comparisons across CloudWatch Logs Insights models without requiring developers to run ad-hoc experiments. The alternatives introduce more operational burden. and rely on -based tooling, D E Amazon SageMaker notebook jobs, and open source evaluation frameworks, which require more environment management, dependency control, scaling considerations, and maintenance over time. includes CORS, which is primarily A a browser-access concern and does not address how Bedrock-managed evaluation jobs securely access S3 in the typical service-to-service pattern. Therefore, achieves standardized model evaluation, automated scheduling, and dashboard-ready B + C observability with the smallest operations footprint.", "explanation_zh": "运维开销最小的方式是使用Amazon Bedrock模型评估的托管工作流程，配合存储在Amazon S3中的数据集，然后将结果发布到Amazon CloudWatch用于仪表板。这正是选项B和C的组合。步骤B正确地将标准化评估输入放置在Amazon S3中，并专注于授予评估工作流程读取这些数据集的正确权限。在实践中，关键要求是对用作评估数据集的S3对象进行受控访问。建立IAM权限和私有访问模式（例如，使用适用于组织网络配置的VPC连接模式）符合企业要求，避免了为评估者构建自定义存储或数据分发系统。步骤C然后以最小基础设施实现评估生命周期：根据计划调度的AWS Lambda函数使用S3数据集位置启动评估任务，第二个Lambda函数检查任务状态并将结果和运维信号推送到CloudWatch。这满足了在仪表板中展示准确性指标的平台要求，因为CloudWatch指标/日志可以在仪表板中可视化并通过CloudWatch Logs Insights查询。它还支持跨模型的持续、标准化比较，无需开发人员运行临时实验。其他选项引入了更多运维负担。选项D和E依赖Amazon SageMaker笔记本作业和开源评估框架，需要更多的环境管理、依赖控制、扩展考量和长期维护。选项A包含CORS，这主要是浏览器访问问题，不解决Bedrock管理的评估任务如何在服务到服务模式中安全访问S3的问题。因此，B + C实现了标准化的模型评估、自动调度和仪表板就绪的可观测性，运维开销最小。"}];

const CAT_NAMES = {"foundation": "基础模型集成", "implementation": "实施与集成", "operational": "运营效率与GenAI优化", "testing": "测试验证与故障排除", "safety": "AI安全安全性与治理"};

// ===== STATE =====
let questions = [];
let currentIndex = 0;
let answers = {{}};
let mode = 'bilingual';
let catFilter = 'all';

// ===== DOM refs =====
const $quiz = document.getElementById('quizArea');
const $results = document.getElementById('resultsArea');
const $resultsContent = document.getElementById('resultsContent');
const $reviewList = document.getElementById('reviewList');
const $progressLabel = document.getElementById('progressLabel');
const $progressFill = document.getElementById('progressFill');
const $scoreLabel = document.getElementById('scoreLabel');
const $catFilter = document.getElementById('catFilter');
const $langMode = document.getElementById('langMode');
const $searchInput = document.getElementById('searchInput');

// ===== Filter =====
function filterQuestions() {{
  let list = [...ALL_QUESTIONS];
  if (catFilter !== 'all') list = list.filter(q => q.c === catFilter);
  const s = ($searchInput.value || '').toLowerCase();
  if (s) list = list.filter(q => q.body_en.toLowerCase().includes(s) || q.body_zh.toLowerCase().includes(s));
  questions = list;
  if (currentIndex >= questions.length) currentIndex = 0;
}}

// ===== Render =====
function renderQuestion() {{
  const input = document.getElementById('qJumpInput');
  if (input) input.value = currentIndex + 1;
  if (currentIndex >= questions.length) {{ showResults(); return; }}
  const q = questions[currentIndex];
  const total = questions.length;
  const qId = q.id;
  const a = answers[qId];

  const catName = CAT_NAMES[q.c] || q.c;
  const catColor = {{'foundation':'#6366f1','implementation':'#f59e0b','operational':'#10b981','testing':'#ef4444','safety':'#8b5cf6'}}[q.c] || '#6366f1';

  let html = `<div class="q-card ${{a && a.correct ? 'correct-card' : a && !a.correct ? 'wrong-card' : ''}}">
    <div class="q-header">
      <span class="q-num">Q${{currentIndex + 1}}/${{total}} · Exam AIP-C01 · ${{catName}}</span>
      <span class="q-cat-badge" style="background:${{catColor}}">${{q.c.charAt(0).toUpperCase() + q.c.slice(1)}}</span>
    </div>`;

  // Question text - bilingual
  if (mode === 'bilingual' || mode === 'zh') {{
    html += `<div class="q-text-zh">${{q.body_zh}}</div>`;
  }}
  if (mode === 'bilingual' || mode === 'en') {{
    html += `<div class="q-text-en">${{q.body_en}}</div>`;
  }}

  // Options
  html += '<ul class="options">';
  const letters = ['A','B','C','D','E','F'];
  for (let i = 0; i < q.options_en.length; i++) {{
    const letter = letters[i];
    const isSelected = a && a.selected === i;
    const isCorrect = a && a.selected === i && a.correct;
    const isWrong = a && a.selected === i && !a.correct;
    const showCorrect = a && a.correct !== undefined && q.a === letter && !isCorrect;
    let cls = '';
    if (isCorrect) cls = 'correct-answer';
    else if (isWrong) cls = 'wrong-answer';
    else if (isSelected) cls = 'selected';
    if (a) cls += ' disabled';

    html += `<li class="option ${{cls}}" onclick="selectOption(${{i}})">
      <strong>${{letter}}. </strong>`;
    if (mode === 'bilingual' || mode === 'zh') {{
      html += `<div class="opt-zh">${{q.options_zh[i]}}</div>`;
    }}
    if (mode === 'bilingual' || mode === 'en') {{
      html += `<div class="opt-en">${{q.options_en[i]}}</div>`;
    }}
    html += '</li>';
  }}
  html += '</ul>';

  // Answer badge
  if (a) {{
    html += `<div class="actions"><span style="color:var(--green);font-weight:700;padding:8px 0;">✅ Correct Answer: <strong>${{q.a}}</strong></span></div>`;
  }}

  // Explanation
  html += `<div class="explanation ${{a ? 'show' : ''}}" id="exp-${{q.id}}">`;
  html += `<h4>📖 Explanation / 解析</h4>`;
  if (mode === 'bilingual' || mode === 'en') {{
    html += `<div class="exp-en">${{q.explanation_en}}</div>`;
  }}
  if (mode === 'bilingual' || mode === 'zh') {{
    html += `<div class="exp-zh">${{q.explanation_zh}}</div>`;
  }}
  html += '</div>';

  html += '</div>';
  $quiz.innerHTML = html;
  updateProgress();
}}

function selectOption(idx) {{
  const q = questions[currentIndex];
  if (!q || answers[q.id]) return;
  const letters = ['A','B','C','D','E','F'];
  answers[q.id] = {{ selected: idx, correct: letters[idx] === q.a }};
  renderQuestion();
}}

function showAnswer() {{
  const q = questions[currentIndex];
  if (!q) return;
  if (!answers[q.id]) answers[q.id] = {{ selected: 0, correct: 'A' === q.a }};
  renderQuestion();
  const el = document.getElementById('exp-' + q.id);
  if (el) el.classList.add('show');
}}

function nextQuestion() {{
  currentIndex++;
  if (currentIndex >= questions.length) showResults();
  else {{ renderQuestion(); document.getElementById('qJumpInput').value = currentIndex + 1; }}
}}

function prevQuestion() {{
  if (currentIndex > 0) {{ currentIndex--; renderQuestion(); document.getElementById('qJumpInput').value = currentIndex + 1; }}
}}

function jumpToQ() {{
  const input = document.getElementById('qJumpInput');
  let idx = parseInt(input.value) - 1;
  if (isNaN(idx) || idx < 0) idx = 0;
  if (idx >= questions.length) idx = questions.length - 1;
  currentIndex = idx;
  input.value = currentIndex + 1;
  $results.classList.remove('show');
  $quiz.classList.remove('hidden');
  renderQuestion();
  window.scrollTo({{ top: 0, behavior: 'smooth' }});
}}

function jumpToQuestion(idx) {{
  currentIndex = idx;
  $results.classList.remove('show');
  $quiz.classList.remove('hidden');
  renderQuestion();
  document.getElementById('qJumpInput').value = currentIndex + 1;
  window.scrollTo({{ top: 0, behavior: 'smooth' }});
}}

function resetExam() {{
  if (!confirm('Reset all progress?')) return;
  answers = {{}};
  currentIndex = 0;
  $results.classList.remove('show');
  $quiz.classList.remove('hidden');
  filterQuestions();
  renderQuestion();
  updateProgress();
}}

function updateProgress() {{
  const total = questions.length;
  const answered = Object.keys(answers).length;
  const correct = Object.values(answers).filter(a => a.correct).length;
  $progressLabel.textContent = `Q ${{currentIndex + 1}}/${{total}} | Answered: ${{answered}}/${{total}}`;
  $progressFill.style.width = total > 0 ? (currentIndex + 1) / total * 100 + '%' : '0%';
  $scoreLabel.textContent = answered > 0 ? `Score: ${{correct}}/${{answered}}` : 'Score: -';
}}

function showResults() {{
  $quiz.classList.add('hidden');
  $results.classList.add('show');
  const total = questions.length;
  const correct = Object.values(answers).filter(a => a.correct).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  const passed = pct >= 75;

  let html = `<h2>${{passed ? '🎉 Passed! / 通过!' : '📚 Keep Studying! / 继续学习!'}}</h2>`;
  html += `<div class="score-big ${{passed ? 'pass' : 'fail'}}">${{correct}}/${{total}}</div>`;
  html += `<p style="color:var(--text2);margin-bottom:10px;">${{pct}}% — ${{passed ? 'Above 75%' : 'Below 75%'}}</p>`;
  html += `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px">`;
  html += `<button onclick="resetExam()" class="btn-cyan">🔄 Retry</button></div>`;

  let reviewHtml = '<h4 style="margin:16px 0 8px;">📋 Review / 回顾</h4>';
  questions.forEach((q, idx) => {{
    const a = answers[q.id];
    const isCorrect = a && a.correct;
    const cls = isCorrect ? 'correct' : 'wrong';
    const mark = isCorrect ? '✓' : '✗';
    reviewHtml += `<div class="review-item ${{cls}}" onclick="jumpToQuestion(${{idx}})">
      <span>${{mark}} Q${{idx + 1}}: ${{q.body_en.substring(0, 60)}}...</span>
      <span class="mark ${{isCorrect ? 'green' : 'red'}}">${{mark}}</span>
    </div>`;
  }});

  $resultsContent.innerHTML = html;
  $reviewList.innerHTML = reviewHtml;
  updateProgress();
}}

// ===== THEME =====
function toggleTheme() {{
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  if (html.getAttribute('data-theme') === 'light') {{
    html.removeAttribute('data-theme');
    btn.textContent = '☀️ Light';
    localStorage.setItem('aip-theme', 'dark');
  }} else {{
    html.setAttribute('data-theme', 'light');
    btn.textContent = '🌙 Dark';
    localStorage.setItem('aip-theme', 'light');
  }}
}}

// ===== Event listeners =====
$catFilter.addEventListener('change', () => {{ catFilter = $catFilter.value; resetExam(); }});
$langMode.addEventListener('change', () => {{ mode = $langMode.value; renderQuestion(); }});
$searchInput.addEventListener('input', () => {{ filterQuestions(); currentIndex = 0; renderQuestion(); updateProgress(); }});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {{
  if ($results.classList.contains('show') || !questions[currentIndex]) return;
  const q = questions[currentIndex];
  if (e.key === 'ArrowRight') {{ e.preventDefault(); nextQuestion(); return; }}
  if (e.key === 'ArrowLeft') {{ e.preventDefault(); prevQuestion(); return; }}
  if (e.key === 'Enter' || e.key === ' ') {{ e.preventDefault(); if (answers[q.id]) nextQuestion(); return; }}
  const num = parseInt(e.key);
  if (num >= 1 && num <= 6 && !answers[q.id]) {{
    const idx = num - 1;
    if (idx < q.options_en.length) selectOption(idx);
  }}
}});

// ===== START =====
filterQuestions();
renderQuestion();
updateProgress();
const saved = localStorage.getItem('aip-theme');
if (saved === 'light') toggleTheme();
const savedLang = localStorage.getItem('aip-lang');
if (savedLang) {{ mode = savedLang; $langMode.value = savedLang; }}
$langMode.addEventListener('change', () => {{ mode = $langMode.value; localStorage.setItem('aip-lang', mode); renderQuestion(); }});
</script>
</body>
</html>
