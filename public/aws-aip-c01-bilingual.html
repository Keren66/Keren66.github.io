ut manual policy updates for every new resource.", "explanation_zh": "描述的错误表明应用程序编排和数据访问级别都缺少权限。来自BedrockAgentRuntime的400 Bad Authorization错误表示Lambda执行角色缺少调用智能体的身份权限；添加bedrock:InvokeAgent和aoss:APIAccessAll（允许主体与OpenSearch Serverless API交互）是必需的。来自OpenSearch Serverless的403 Forbidden错误特别与数据平面权限相关。与传统OpenSearch不同，Serverless使用数据访问策略。要自动“管理大规模集合”，必须创建使用基于模式的资源规则（例如匹配前缀）的策略，确保随着新集合或索引的创建，所需主体（Lambda角色和Bedrock服务角色）被授予必要的访问权限，而无需为每个新资源手动更新策略。"}, {"id": 67, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A research company is developing a GenAI system to produce summaries of technical documents. The \ncompany must catalog all data sources in a central location. The company needs a solution that can \nautomatically discover and update data sources. The solution must tag each generated summary with citations as metadata that users can query. The solution must retain tamper-evident, immutable audit logs for every \nmodel invocation and store I/O records. A. B. C. D.", "body_zh": "一家研究公司正在开发一个GenAI系统，用于生成技术文档的摘要。公司必须在一个中心位置对所有数据源进行编目。公司需要一个能够自动发现和更新数据源的解决方案。解决方案必须用引用作为元数据标记每个生成的摘要，使用户可以查询。解决方案必须为每次模型调用保留防篡改、不可变的审计日志，并存储I/O记录。A. B. C. D.", "options_en": ["Use Amazon Comprehend to identify data sources in the documents. Store generated summaries in \nAmazon S3 and enable S3 Object Lock. Use Amazon CloudWatch metrics to generate reports about \napplication throughput. Do not include logs for each invocation.", "Use AWS Glue Data Catalog with crawlers to maintain data sources. Store generated summaries in \nAmazon S3. Write object tags that include a source ID. Store Amazon Bedrock model invocation logs \nin Amazon S3. Enable S3 Object Lock on the S3 bucket that stores invocation logs. Use AWS \nCloudTrail log file integrity validation to provide tamper-evident immutability.", "Store application outputs in Amazon DynamoDB. Apply item-level tags that include source attribution. \nWrite application events to Amazon CloudWatch Logs. Use IAM roles to provide audit traceability.", "Use AWS AppConfig feature flags to implement data versioning. Restrict access to the model by using \nIAM condition keys. Maintain a versioned mapping file of source-to-output relationships in Amazon S3."], "options_zh": ["使用Amazon Comprehend识别文档中的数据源。将生成的摘要存储在Amazon S3中并启用S3 Object Lock。使用Amazon CloudWatch指标生成关于应用程序吞吐量的报告。不包含每次调用的日志。", "使用带爬网程序的AWS Glue Data Catalog维护数据源。将生成的摘要存储在Amazon S3中。写入包含源ID的对象标签。将Amazon Bedrock模型调用日志存储在Amazon S3中。在存储调用日志的S3存储桶上启用S3 Object Lock。使用AWS CloudTrail日志文件完整性验证提供防篡改的不可变性。", "将应用程序输出存储在Amazon DynamoDB中。应用包含来源归因的项目级标签。将应用程序事件写入Amazon CloudWatch Logs。使用IAM角色提供审计可追溯性。", "使用AWS AppConfig功能标志实施数据版本控制。使用IAM条件键限制对模型的访问。在Amazon S3中维护版本化的源到输出关系映射文件。"], "a": "B", "explanation_en": "and its associated are the standard AWS tools for automatic discovery AWS Glue Data Catalog crawlers and centralized cataloging of datasets. For the generated summaries, storing them in allows the Amazon S3 use of for metadata (like source IDs), making them easily queryable. The critical requirement for object tags \"tamper-evident, immutable audit logs\" is met by enabling to an S3 Bedrock model invocation logging bucket protected by (compliance mode). To further guarantee that logs have not been altered, S3 Object Lock uses cryptographic hashes to provide non-repudiation and a AWS CloudTrail log file integrity validation verifiable audit trail. This combination covers data management, metadata attribution, and high-standard security compliance.", "explanation_zh": "AWS Glue Data Catalog及其关联的爬网程序是用于自动发现和集中编目数据集的标准AWS工具。对于生成的摘要，存储在Amazon S3中允许使用对象标签作为元数据（如源ID），使其易于查询。对“防篡改、不可变的审计日志”的关键要求通过启用Amazon Bedrock模型调用日志记录到受S3 Object Lock（合规模式）保护的S3存储桶来满足。为了进一步保证日志未被篡改，AWS CloudTrail日志文件完整性验证使用加密哈希提供不可否认性和可验证的审计追踪。这种组合涵盖了数据管理、元数据归因和高标准安全合规。"}, {"id": 68, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company provides a service that helps users from around the world discover new restaurants. The service \nhas 50 million monthly active users. The company wants to implement a semantic search solution across a \ndatabase that contains 20 million restaurants and 200 million reviews. The company currently stores the data \nin a PostgreSQL database. The solution must support complex natural language queries and return results for at least 95% of queries \nwithin 500 ms. The solution must maintain data freshness for restaurant details that update hourly. The \nsolution must also scale cost-effectively during peak usage periods. Which solution will meet these requirements with the LEAST development effort? A. B. C. D.", "body_zh": "一家公司提供一项服务，帮助全球用户发现新餐厅。该服务拥有5000万月活跃用户。公司希望在一个包含2000万条餐厅数据和2亿条评价的数据库上实现语义搜索解决方案。公司目前将数据存储在PostgreSQL数据库中。该解决方案必须支持复杂的自然语言查询，并在500毫秒内为至少95%的查询返回结果。解决方案必须保持每小时更新的餐厅详情数据的新鲜度，并且必须在高峰使用期间具有经济高效的可扩展性。哪种解决方案能在开发工作量最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Migrate the restaurant data to Amazon OpenSearch Service. Implement keyword-based search rules \nthat use custom analyzers and relevance tuning to find restaurants based on attributes such as cuisine \ntype, feature, and location. Create Amazon API Gateway HTTP API endpoints to transform user \nqueries into structured search parameters.", "Migrate the restaurant data to Amazon OpenSearch Service. Use a foundation model (FM) in Amazon \nBedrock to generate vector embeddings from restaurant descriptions, reviews, and menu items. When \nusers submit natural language queries, convert the queries to embeddings by using the same FM. \nPerform k-nearest neighbors (k-NN) searches to find semantically similar results.", "Keep the restaurant data in PostgreSQL and implement a pgvector extension. Use a foundation model \n(FM) in Amazon Bedrock to generate vector embeddings from restaurant data. Store the vector \nembeddings directly in PostgreSQL. Create an AWS Lambda function to convert natural language \nqueries to vector representations by using the same FM. Configure the Lambda function to perform \nsimilarity searches within the database.", "Migrate the restaurant data to an Amazon Bedrock knowledge base by using a custom ingestion \npipeline. Configure the knowledge base to automatically generate embeddings from restaurant \ninformation. Use the Amazon Bedrock Retrieve API with built-in vector search capabilities to query the \nknowledge base directly by using natural language input."], "options_zh": ["将餐厅数据迁移到Amazon OpenSearch Service。实施基于关键字的搜索规则，使用自定义分析器和相关性调优，根据菜系类型、特色和位置等属性查找餐厅。创建Amazon API Gateway HTTP API端点，将用户查询转换为结构化搜索参数。", "将餐厅数据迁移到Amazon OpenSearch Service。使用Amazon Bedrock中的基础模型（FM）从餐厅描述、评价和菜单项生成向量嵌入。当用户提交自然语言查询时，使用相同的FM将查询转换为嵌入。执行k近邻（k-NN）搜索以查找语义相似的结果。", "将餐厅数据保留在PostgreSQL中并实施pgvector扩展。使用Amazon Bedrock中的基础模型（FM）从餐厅数据生成向量嵌入。将向量嵌入直接存储在PostgreSQL中。创建一个AWS Lambda函数，使用相同的FM将自然语言查询转换为向量表示。配置该Lambda函数在数据库内执行相似性搜索。", "将餐厅数据迁移到Amazon Bedrock知识库，通过自定义摄取管道。配置知识库自动从餐厅信息生成嵌入。使用Amazon Bedrock Retrieve API的内置向量搜索功能直接通过自然语言输入查询知识库。"], "a": "D", "explanation_en": "Option requires the least development effort because it uses a managed retrieval workflow that bundles the D most time-consuming parts of semantic search: embedding generation, vector indexing, and natural language retrieval. With an Amazon Bedrock knowledge base, the application does not need to implement and operate separate services to (1) generate embeddings for hundreds of millions of records, (2) store and manage vectors, (3) build query-time embedding conversion logic, and (4) implement k-NN search orchestration. Instead, the knowledge base is configured to automatically create embeddings during ingestion, and the application queries it using the , which accepts natural language input and Amazon Bedrock Retrieve API performs the vector search as a managed capability. The performance requirement (95% of queries within 500 ms) is best served by a purpose-built vector search backend rather than running similarity search directly inside a transactional PostgreSQL system at this scale. A knowledge base is designed for retrieval patterns and can be backed by scalable vector stores, which helps meet latency goals under heavy concurrency. The hourly freshness requirement maps naturally to ingestion updates: the pipeline can re-ingest updated restaurant details on a schedule so the knowledge base remains current without building custom re-embedding workflows in application code. Cost-effective scaling during peak periods is also easier with a managed retrieval layer because scaling the retrieval workload is separated from the operational database. This avoids overprovisioning PostgreSQL for peak semantic-search traffic and reduces the engineering effort to tune performance, sharding, indexing, and retry logic. Options and can work, but they require the team to build and maintain embedding pipelines, query B C embedding generation, vector index management, and operational scaling strategies. Option does not A provide semantic search because it relies on keyword-based matching rather than embeddings.", "explanation_zh": "选项D需要的开发工作量最小，因为它使用托管检索工作流，捆绑了语义搜索中最耗时的部分：嵌入生成、向量索引和自然语言检索。使用Amazon Bedrock知识库，应用程序无需实施和运营独立服务来（1）为数亿条记录生成嵌入，（2）存储和管理向量，（3）构建查询时嵌入转换逻辑，以及（4）实施k-NN搜索编排。相反，知识库配置为在摄取期间自动创建嵌入，应用程序使用Amazon Bedrock Retrieve API进行查询，该API接受自然语言输入并将向量搜索作为托管能力执行。性能要求（95%的查询在500毫秒内）最好由专为向量搜索构建的后端服务来满足，而不是在此规模下在事务性PostgreSQL系统内直接运行相似性搜索。知识库专为检索模式设计，可由可扩展的向量存储支持，有助于在高并发下实现延迟目标。每小时的新鲜度要求自然地映射到摄取更新：管道可以按计划重新摄取更新的餐厅详情，使知识库保持最新，而无需在应用程序代码中构建自定义重新嵌入工作流。高峰期间的经济高效扩展也更容易实现，因为托管检索层将检索工作负载与运营数据库分离。这避免了为峰值语义搜索流量过度配置PostgreSQL，并减少了调优性能、分片、索引和重试逻辑的工程工作量。选项B和C也可以工作，但需要团队构建和维护嵌入管道、查询嵌入生成、向量索引管理和运营扩展策略。选项A不提供语义搜索，因为它依赖关键字匹配。"}, {"id": 69, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is using Amazon Bedrock to develop a customer support AI assistant. The AI assistant must \nrespond to customer questions about their accounts. The AI assistant must not expose personal information in \nresponses. The company must comply with data residency policies by ensuring that all processing occurs \nwithin the same AWS Region where each customer is located. The company wants to evaluate how effective the AI assistant is at preventing the exposure of personal \ninformation before the company makes the AI assistant available to customers. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock开发一个客户支持AI助手。AI助手必须回答客户关于其账户的问题。AI助手不得在响应中暴露个人信息。公司必须遵守数据驻留策略，确保所有处理发生在每个客户所在的同一AWS区域。公司希望在向客户提供AI助手之前，评估该AI助手在防止个人信息暴露方面的有效性。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Configure a cross-Region Amazon Bedrock guardrail to apply sensitive information filters. Set the \nguardrail to detect mode during development and testing. Switch to block mode for production \ndeployment.", "Configure an Amazon Bedrock guardrail to apply sensitive information filters. Set the guardrail to mask \nmode during development and testing. Switch to block mode for production deployment. Deploy a copy \nof the guardrail to each Region where the company operates.", "Configure an Amazon Bedrock guardrail to apply content and topic filters. Set the guardrail to detect \nmode during development, testing, and production. Disable invocation logging for the Amazon Bedrock \nmodel.", "Configure a cross-Region Amazon Bedrock guardrail to apply a set of content and word filters. Set the \nguardrail to detect mode during development and testing. Switch to mask mode for production \ndeployment."], "options_zh": ["配置跨区域Amazon Bedrock护栏应用敏感信息过滤器。在开发和测试期间将护栏设置为检测模式。在生产部署时切换到阻止模式。", "配置Amazon Bedrock护栏应用敏感信息过滤器。在开发和测试期间将护栏设置为掩码模式。在生产部署时切换到阻止模式。在公司运营的每个区域部署护栏副本。", "配置Amazon Bedrock护栏应用内容和主题过滤器。在开发、测试和生产期间将护栏设置为检测模式。禁用Amazon Bedrock模型的调用日志记录。", "配置跨区域Amazon Bedrock护栏应用一组内容和词过滤器。在开发和测试期间将护栏设置为检测模式。在生产部署时切换到掩码模式。"], "a": "B", "explanation_en": "Option best meets all stated requirements by correctly combining , B PII protection evaluation before launch , and using Amazon Bedrock Guardrails. Amazon Bedrock guardrails provide data residency compliance native sensitive information filtering that operates inline during model invocation, making them well suited for preventing personal data exposure in customer-facing AI assistants. The requirement to before release is best evaluate how effective the AI assistant is at preventing exposure addressed by using . Mask mode allows responses to be mask mode during development and testing generated while automatically redacting detected personal information, making it easy for developers and reviewers to see where and how PII would have appeared. This provides concrete validation that the guardrail rules are correctly configured without fully blocking responses, which is ideal for quality assurance and pre- production evaluation. For , switching the guardrail to ensures that responses containing personal production block mode information are fully prevented from being returned to users. This offers the strongest protection and aligns with compliance expectations for customer account data. Block mode is appropriate once confidence in the guardrail configuration has been established during testing. The is addressed by deploying a copy of the guardrail in each AWS Region data residency requirement where the application operates. Amazon Bedrock guardrails are Region-specific resources, and using Region- local guardrails ensures that inference, filtering, and enforcement all occur within the same Region as the customer data. This avoids cross-Region processing and helps the company comply with regulatory and contractual data residency policies. Option and incorrectly rely on cross-Region guardrails, which can violate data residency constraints. A D Option focuses on topic filtering rather than sensitive information filtering and keeps detect mode enabled C in production, which does not actively prevent PII exposure. Therefore, is the only option that fully satisfies B safety, compliance, and evaluation requirements.", "explanation_zh": "选项B最符合所有规定要求，它正确结合了PII保护、发布前有效性评估和数据驻留合规性，使用了Amazon Bedrock护栏。Amazon Bedrock护栏提供原生敏感信息过滤功能，在模型调用期间内联操作，非常适合防止面向客户的AI助手中的个人数据暴露。发布前评估AI助手在防止暴露方面的有效性最好通过在开发和测试期间使用掩码模式来解决。掩码模式允许生成响应，同时自动编辑检测到的个人信息，使开发人员和审核人员能够轻松看到PII原本会出现的位置和方式。这提供了护栏规则配置正确的具体验证，而不会完全阻止响应，非常适合质量保证和预生产评估。对于生产，将护栏切换到阻止模式确保包含个人信息的响应被完全阻止返回给用户。这提供了最强的保护，符合客户账户数据的合规期望。一旦在测试期间建立对护栏配置的信心，阻止模式就适用了。数据驻留要求通过在应用程序运行的每个AWS区域部署护栏副本来满足。Amazon Bedrock护栏是区域特定的资源，使用区域本地护栏确保推理、过滤和执行都在客户数据所在的同一区域内发生。这避免了跨区域处理，帮助公司遵守监管和合同数据驻留策略。选项A和D错误地依赖跨区域护栏，可能违反数据驻留约束。选项C侧重于主题过滤而非敏感信息过滤，并在生产环境中保持检测模式启用。"}, {"id": 70, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A financial services company uses an AI application to process financial documents by using Amazon \nBedrock. During business hours, the application handles approximately 10,000 requests each hour, which \nrequires consistent throughput. The company uses the CreateProvisionedModelThroughput API to purchase provisioned throughput. Amazon \nCloudWatch metrics show that the provisioned capacity is unused while on-demand requests are being \nthrottled. The company finds the following code in the application: python response = bedrock_runtime.invoke_model(modelId=\"anthropic.claude-v2\", body=json.dumps(payload)) The company needs the application to use the provisioned throughput and to resolve the throttling issues. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司使用一个AI应用程序通过Amazon Bedrock处理财务文档。在工作时间内，应用程序每小时处理约10000个请求，需要一致的吞吐量。公司使用CreateProvisionedModelThroughput API购买了预置吞吐量。Amazon CloudWatch指标显示预置容量未被使用，而按需请求正在被节流。公司在应用程序中发现以下代码：python response = bedrock_runtime.invoke_model(modelId=\\\"anthropic.claude-v2\\\", body=json.dumps(payload)) 公司需要应用程序使用预置吞吐量并解决节流问题。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Increase the number of model units (MUs) in the provisioned throughput configuration.", "Replace the model ID parameter with the ARN of the provisioned model that the \nCreateProvisionedModelThroughput API returns.", "Add exponential backoff retry logic to handle throttling exceptions during peak hours.", "Modify the application to use the InvokeModelWithResponseStream API instead of the InvokeModel \nAPI."], "options_zh": ["增加预置吞吐量配置中的模型单元（MU）数量。", "将模型ID参数替换为CreateProvisionedModelThroughput API返回的预置模型ARN。", "添加指数退避重试逻辑，以处理高峰时段的节流异常。", "修改应用程序使用InvokeModelWithResponseStream API而不是InvokeModel API。"], "a": "B", "explanation_en": "Option B is correct because the application is currently invoking the base foundation model identifier, which routes traffic to the on-demand capacity pool rather than the company’s purchased provisioned throughput. In Amazon Bedrock, provisioned throughput is attached to a specific provisioned resource created through the provisioned throughput APIs. To consume that reserved capacity, inference requests must target the provisioned resource identifier that represents the purchased throughput, not the generic model identifier used for on-demand inference. The code snippet uses modelId=\"anthropic.claude-v2\". This value selects the on-demand endpoint for that model. As a result, requests are subject to on-demand quotas and throttling behavior, while the provisioned throughput remains idle. This directly explains the CloudWatch observation: provisioned capacity metrics show unused capacity because no traffic is being directed to the provisioned resource, and the on-demand path is throttling because it is exceeding the applicable on-demand limits during peak volume. Replacing the modelId value with the provisioned throughput ARN returned by the CreateProvisionedModelThroughput workflow ensures the runtime invocation is routed to the reserved capacity. Once traffic is directed correctly, the purchased model units provide the consistent throughput required for predictable performance during business hours, which is exactly why provisioned throughput is used. Option A could increase capacity, but it does not fix the core issue that the application is not using the provisioned resource at all. Option C can reduce the impact of throttling temporarily, but it adds latency and does not guarantee consistent throughput; it also still wastes the provisioned capacity. Option D changes the response delivery mechanism, but throttling is a capacity routing and quota issue, not a streaming API issue.", "explanation_zh": "选项B是正确的，因为应用程序当前正在调用基础模型标识符，该标识符将流量路由到按需容量池，而非公司购买的预置吞吐量。在Amazon Bedrock中，预置吞吐量附加到通过预置吞吐量API创建的特定预置资源。要消费该预留容量，推理请求必须针对代表已购买吞吐量的预置资源标识符，而不是用于按需推理的通用模型标识符。代码片段使用modelId=\\\"anthropic.claude-v2\\\"。此值选择该模型的按需端点。因此，请求受按需配额和节流行为约束，而预置吞吐量保持空闲。这直接解释了CloudWatch观察结果：预置容量指标显示未使用的容量，因为没有流量被导向预置资源，而按需路径因为超出高峰期间适用的按需限制而在节流。将modelId值替换为CreateProvisionedModelThroughput工作流返回的预置吞吐量ARN确保运行时调用被路由到预留容量。一旦流量被正确导向，购买的模型单元提供工作时间内可预测性能所需的一致吞吐量，这正是使用预置吞吐量的原因。选项A可以增加容量，但不解决应用程序根本不使用预置资源的核心问题。选项C可以暂时减少节流的影响，但增加延迟且不能保证一致的吞吐量；它仍然浪费预置容量。选项D改变了响应投递机制，但节流是容量路由和配额问题，而非流式API问题。"}, {"id": 71, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A financial services company is developing a real-time generative AI (GenAI) assistant to support human call \ncenter agents. The GenAI assistant must transcribe live customer speech, analyze context, and provide \nincremental suggestions to call center agents while a customer is still speaking. To preserve responsiveness, \nthe GenAI assistant must maintain end-to-end latency under 1 second from speech to initial response display. \nThe architecture must use only managed AWS services and must support bidirectional streaming to ensure \nthat call center agents receive updates in real time. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司正在开发一个实时生成式AI（GenAI）助手，以支持人工呼叫中心客服人员。该GenAI助手必须实时转录客户语音、分析上下文，并在客户仍在说话时向客服人员提供增量建议。为保持响应性，GenAI助手必须保持从语音到初始响应显示的端到端延迟低于1秒。该架构必须仅使用托管AWS服务，并必须支持双向流式传输，确保客服人员实时收到更新。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Use Amazon Transcribe streaming to transcribe calls. Pass the text to Amazon Comprehend for \nsentiment analysis. Feed the results to Anthropic Claude on Amazon Bedrock by using the \nInvokeModel API. Store results in Amazon DynamoDB. Use a WebSocket API to display the results.", "Use Amazon Transcribe streaming with partial results enabled to deliver fragments of transcribed text \nbefore customers finish speaking. Forward text fragments to Amazon Bedrock by using the \nInvokeModelWithResponseStream API. Stream responses to call center agents through an Amazon API \nGateway WebSocket API.", "Use Amazon Transcribe batch processing to convert calls to text. Pass complete transcripts to \nAnthropic Claude on Amazon Bedrock by using the ConverseStream API. Return responses through an \nAmazon Lex chatbot interface.", "Use the Amazon Transcribe streaming API with an AWS Lambda function to transcribe each audio \nsegment. Call the Amazon Titan Embeddings model on Amazon Bedrock by using the InvokeModel \nAPI. Publish results to Amazon SNS."], "options_zh": ["使用Amazon Transcribe流式传输转录通话。将文本传递给Amazon Comprehend进行情感分析。将结果通过InvokeModel API输入到Amazon Bedrock上的Anthropic Claude。将结果存储在Amazon DynamoDB中。使用WebSocket API显示结果。", "使用启用部分结果的Amazon Transcribe流式传输，在客户说完之前投递转录文本片段。将文本片段通过InvokeModelWithResponseStream API转发到Amazon Bedrock。通过Amazon API Gateway WebSocket API将响应流式传输到客服人员。", "使用Amazon Transcribe批量处理将通话转换为文本。将完整转录通过ConverseStream API传递给Amazon Bedrock上的Anthropic Claude。通过Amazon Lex聊天机器人界面返回响应。", "使用Amazon Transcribe流式传输API配合AWS Lambda函数转录每个音频段。在Amazon Bedrock上使用InvokeModel API调用Amazon Titan Embeddings模型。将结果发布到Amazon SNS。"], "a": "B", "explanation_en": "Option B is the only solution that satisfies all strict real-time, streaming, and latency requirements. Amazon Transcribe streaming with partial results allows transcription fragments to be delivered before the speaker finishes a sentence. This significantly reduces perceived latency and enables downstream processing to begin immediately, which is essential for maintaining sub-1-second end-to-end response times. Using Amazon Bedrock’s InvokeModelWithResponseStream API enables token-level or chunk-level streaming responses from the foundation model. This allows the GenAI assistant to begin delivering suggestions to call center agents incrementally instead of waiting for a full model response. This streaming inference capability is critical for interactive, real-time agent assistance use cases. Amazon API Gateway WebSocket APIs provide fully managed, bidirectional communication between backend services and agent dashboards. This ensures that updates flow continuously to agents as new transcription fragments and model outputs become available, preserving real-time responsiveness without requiring custom socket infrastructure. Option A introduces additional synchronous processing layers and storage writes that increase latency. Option C uses batch transcription and post-call processing, which cannot meet real-time requirements. Option D uses embeddings and asynchronous messaging, which are not suitable for live incremental suggestions and bidirectional streaming. Therefore, Option B best aligns with AWS real-time GenAI architecture patterns by combining streaming transcription, streaming model inference, and managed bidirectional communication while maintaining low latency and operational simplicity.", "explanation_zh": "选项B是唯一满足所有严格实时、流式传输和延迟要求的解决方案。Amazon Transcribe流式传输配合部分结果允许在说话者完成句子之前投递转录片段。这显著减少了感知延迟，使下游处理能够立即开始，对于保持低于1秒的端到端响应时间至关重要。使用Amazon Bedrock的InvokeModelWithResponseStream API允许从基础模型获得令牌级或块级流式响应。这使得GenAI助手能够开始向客服人员增量投递建议，而无需等待完整的模型响应。这种流式推理能力对于交互式、实时代理辅助用例至关重要。Amazon API Gateway WebSocket API在后台服务和代理仪表板之间提供完全托管的双向通信。这确保随着新的转录片段和模型输出变得可用，更新持续流向代理，保持实时响应性而无需自定义套接字基础设施。选项A引入了额外的同步处理层和存储写入，增加了延迟。选项C使用批量转录和事后处理，无法满足实时要求。选项D使用嵌入和异步消息传递，不适合实时增量建议和双向流式传输。因此，选项B通过结合流式转录、流式模型推理和托管双向通信，最符合AWS实时GenAI架构模式，同时保持低延迟和运营简洁性。"}, {"id": 72, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is building a multicloud generative AI (GenAI)-powered secret resolution application that uses \nAmazon Bedrock and Agent Squad. The application resolves secrets from multiple sources, including key \nstores and hardware security modules (HSMs). The application uses AWS Lambda functions to retrieve \nsecrets from the sources. The application uses AWS AppConfig to implement dynamic feature gating. The \napplication supports secret chaining and detects secret drift. The application handles short-lived and expiring \nsecrets. The application also supports prompt flows for templated instructions. The application uses AWS \nStep Functions to orchestrate agents to resolve the secrets and to manage secret validation and drift detection. The company finds multiple issues during application testing. The application does not refresh expired secrets \nin time for agents to use. The application sends alerts for secret drift, but agents still use stale data. Prompt \nflows within the application reuse outdated templates, which cause cascading failures. The company must \nresolve the performance issues. Which solution will meet this requirement? A. B. C. D.", "body_zh": "一家公司正在构建一个使用Amazon Bedrock和Agent Squad的多云生成式AI（GenAI）驱动的密钥解析应用程序。该应用程序从多个源解析密钥，包括密钥存储和硬件安全模块（HSM）。应用程序使用AWS Lambda函数从这些源检索密钥。应用程序使用AWS AppConfig实施动态功能开关。应用程序支持密钥链式解析和检测密钥漂移。应用程序处理短生命周期和即将过期的密钥。应用程序还支持用于模板化指令的提示流。应用程序使用AWS Step Functions编排智能体以解析密钥，并管理密钥验证和漂移检测。公司在应用程序测试期间发现多个问题。应用程序未能及时刷新已过期的密钥以供智能体使用。应用程序发送密钥漂移告警，但智能体仍使用过时数据。应用程序内的提示流重复使用过时的模板，导致级联故障。公司必须解决这些性能问题。哪种解决方案能满足这个要求？A. B. C. D.", "options_en": ["Use Step Functions Map states to run agent workflows in parallel. Pass updated secret metadata through \nLambda function outputs. Use AWS AppConfig to version all prompt flows to gate and roll back faulty \ntemplates.", "Use Amazon Bedrock Agents only. Configure Amazon Bedrock guardrails to restrict prompt variation. \nUse an inline JSON schema for a single agent’s workflow definition to chain tool calls.", "Use a centralized Amazon EventBridge pipeline to invoke each agent. Store intermediate prompts in \nAmazon DynamoDB. Resolve agent ordering by using TTL-based backoff and retries.", "Use Amazon EventBridge Pipes to invoke resolvers based on Amazon CloudWatch log patterns. Store \nresponse metadata in DynamoDB with TTL and versioned writes. Use Amazon Q Developer to \ndynamically generate fallback prompts."], "options_zh": ["使用Step Functions Map状态并行运行智能体工作流。通过Lambda函数输出传递更新的密钥元数据。使用AWS AppConfig对所有提示流进行版本控制，以门控和回滚故障模板。", "仅使用Amazon Bedrock Agents。配置Amazon Bedrock护栏限制提示变化。使用内联JSON模式为单个智能体的工作流定义来链式调用工具。", "使用集中式Amazon EventBridge管道调用每个智能体。将中间提示存储在Amazon DynamoDB中。使用基于TTL的回退和重试解析智能体顺序。", "使用Amazon EventBridge Pipes基于Amazon CloudWatch日志模式调用解析器。将响应元数据存储在DynamoDB中，带TTL和版本化写入。使用Amazon Q Developer动态生成回退提示。"], "a": "A", "explanation_en": "Option A is the correct solution because it directly addresses all identified failure modes while preserving the existing Step Functions–based orchestration architecture with minimal redesign. Using Step Functions Map states enables parallel execution of secret resolution workflows, which improves refresh latency for short-lived and expiring secrets. This ensures that secrets are refreshed in time before downstream agents require them. Passing updated secret metadata through Lambda outputs guarantees that subsequent steps always consume the latest resolved values, preventing agents from using stale data even after drift alerts are generated. Versioning prompt flows in AWS AppConfig is critical to resolving cascading failures caused by outdated templates. AppConfig natively supports version control, validation, staged rollout, and rollback of configuration artifacts. By gating prompt flows through AppConfig, the company can immediately roll back faulty templates and prevent agents from reusing outdated instructions. This solution maintains clear separation of concerns: Step Functions handle orchestration and parallelism, Lambda handles secret retrieval and metadata propagation, and AppConfig governs prompt lifecycle management. No additional event pipelines or custom retry coordination layers are required. Option B oversimplifies the architecture and does not address secret lifecycle or drift. Option C introduces event-driven ordering complexity without solving prompt versioning. Option D introduces unnecessary tooling and dynamic prompt generation risk. Therefore, Option A best resolves performance, correctness, and stability issues while minimizing operational overhead.", "explanation_zh": "选项A是正确的解决方案，因为它直接解决了所有识别的故障模式，同时以最小的重新设计保留了现有的基于Step Functions的编排架构。使用Step Functions Map状态支持密钥解析工作流的并行执行，改善了短生命周期和即将过期密钥的刷新延迟。这确保密钥在下游智能体需要之前及时刷新。通过Lambda输出传递更新的密钥元数据保证后续步骤始终消费最新的解析值，防止智能体在生成漂移告警后仍使用过时数据。在AWS AppConfig中对提示流进行版本控制对于解决由过时模板引起的级联故障至关重要。AppConfig原生支持配置制品的版本控制、验证、分阶段部署和回滚。通过AppConfig对提示流进行门控，公司可以立即回滚故障模板，防止智能体重复使用过时的指令。该解决方案保持了清晰的责任分离：Step Functions处理编排和并行化，Lambda处理密钥检索和元数据传播，AppConfig管理提示生命周期治理。无需额外的事件管道或自定义重试协调层。选项B过度简化了架构，未解决密钥生命周期或漂移问题。选项C引入了事件驱动的排序复杂性，未解决提示版本控制问题。选项D引入了不必要的工具和动态提示生成风险。因此，选项A在最小化运营开销的同时，最佳地解决了性能、正确性和稳定性问题。"}, {"id": 73, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company is building an AI advisory application by using Amazon Bedrock. The application will provide \nrecommendations to customers. The company needs the application to explain its reasoning process and cite \nspecific sources for data. The application must retrieve information from company data sources and show step-\nby-step reasoning for recommendations. The application must also link data claims to source documents and \nmaintain response latency under 3 seconds. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock构建一个AI咨询应用程序。该应用程序将向客户提供建议。公司需要应用程序解释其推理过程并引用特定的数据来源。应用程序必须从公司数据源检索信息，并展示建议的逐步推理过程。应用程序还必须将数据声明链接到源文档，并将响应延迟保持在3秒以内。哪种解决方案能在运营开销最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Use Amazon Bedrock Knowledge Bases with source attribution enabled. Use the Anthropic Claude \nMessages API with RAG to set high-relevance thresholds for source documents. Store reasoning and \ncitations in Amazon S3 for auditing purposes.", "Use Amazon Bedrock with Anthropic Claude models and extended thinking. Configure a 4,000-token \nthinking budget. Store reasoning traces and citations in Amazon DynamoDB for auditing purposes.", "Configure Amazon SageMaker AI with a custom Anthropic Claude model. Use the model’s reasoning \nparameter and AWS Lambda to process responses. Add source citations from a separate Amazon RDS \ndatabase.", "Use Amazon Bedrock with Anthropic Claude models and chain-of-thought reasoning. Configure \ncustom retrieval tracking with the Amazon Bedrock Knowledge Bases API. Use Amazon CloudWatch \nto monitor response latency metrics."], "options_zh": ["使用启用来源归因的Amazon Bedrock知识库。使用带RAG的Anthropic Claude Messages API为源文档设置高相关性阈值。将推理和引用存储在Amazon S3中用于审计目的。", "使用Amazon Bedrock配合Anthropic Claude模型和扩展思考。配置4000个令牌的思考预算。将推理轨迹和引用存储在Amazon DynamoDB中用于审计目的。", "配置Amazon SageMaker AI配合自定义Anthropic Claude模型。使用模型的推理参数和AWS Lambda处理响应。从单独的Amazon RDS数据库添加源引用。", "使用Amazon Bedrock配合Anthropic Claude模型和思维链推理。通过Amazon Bedrock Knowledge Bases API配置自定义检索跟踪。使用Amazon CloudWatch监控响应延迟指标。"], "a": "A", "explanation_en": "Option A is the best solution because it natively delivers retrieval grounding, source attribution, and low operational overhead through Amazon Bedrock Knowledge Bases. The key requirements are: retrieve from company data sources, cite sources, link claims to source documents, and keep latency under 3 seconds. Knowledge Bases are a managed RAG capability that handles document ingestion, chunking, embeddings, retrieval, and assembly of context for model generation. This eliminates the need to build and maintain custom retrieval infrastructure. Source attribution is crucial: the application must “link data claims to source documents.” When source attribution is enabled, the RAG pipeline can return references to the underlying documents and segments used for generation. This enables traceable citations that can be surfaced to end users and used for internal auditing. Using the Anthropic Claude Messages API (or equivalent conversational interface) with RAG allows the application to generate recommendations grounded in retrieved context while keeping responses conversational. Setting relevance thresholds helps reduce noisy retrieval, which supports both accuracy and latency targets by limiting the context passed to the model. Storing reasoning and citations in Amazon S3 supports audit and retention needs with minimal operational burden. While the prompt may request step-by-step reasoning, AWS best practice is to produce user-facing explanations that are faithful and attributable without exposing internal reasoning traces unnecessarily. With source-grounded outputs, the system can provide concise rationale tied to citations while maintaining fast response times. Option B emphasizes extended thinking, which increases latency and does not ensure source linkage. Option C adds significant operational overhead through custom model hosting and separate citation systems. Option D requires more custom tracking work than A while not improving retrieval attribution beyond what Knowledge Bases already provide. Therefore, Option A best meets the requirements with the least operational overhead.", "explanation_zh": "选项A是最佳解决方案，因为它通过Amazon Bedrock知识库原生提供检索基于事实、来源归因和低运营开销。关键要求是：从公司数据源检索、引用来源、将声明链接到源文档并将延迟保持在3秒以下。知识库是托管的RAG能力，处理文档摄取、分块、嵌入、检索和上下文组装以供模型生成。这消除了构建和维护自定义检索基础设施的需求。来源归因至关重要：应用程序必须“将数据声明链接到源文档”。启用来源归因后，RAG管道可以返回用于生成的底层文档和段的引用。这使得可追踪的引用能够呈现给最终用户并用于内部审计。使用配合RAG的Anthropic Claude Messages API（或等效对话接口）允许应用程序生成基于检索上下文的建议，同时保持对话式响应。设置相关性阈值有助于减少噪音检索，通过限制传递给模型的上下文来支持准确性和延迟目标。将推理和引用存储在Amazon S3中支持审计和留存需求，运营负担最小。虽然提示可能要求逐步推理，但AWS最佳实践是生成忠实且可归因的面向用户的解释，而不必不必要地暴露内部推理轨迹。通过基于来源的输出，系统可以提供与引用关联的简洁理由，同时保持快速响应时间。选项B强调扩展思考，增加延迟且不确保来源链接。选项C通过自定义模型托管和单独的引用系统增加了显著的运营开销。选项D需要的自定义跟踪工作比A多，且检索归因方面并未超越知识库。"}, {"id": 74, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A healthcare company is using Amazon Bedrock to build a system to help practitioners make clinical \ndecisions. The system must provide treatment recommendations to physicians based only on approved \nmedical documentation and must cite specific sources. The system must not hallucinate or produce factually \nincorrect information. Which solution will meet these requirements with the LEAST operational overhead? A. B. C. D.", "body_zh": "一家医疗保健公司正在使用Amazon Bedrock构建一个系统，帮助从业者做出临床决策。该系统必须仅基于已批准的医疗文档向医生提供治疗建议，并引用具体来源。系统不得产生幻觉或生成事实上不正确的信息。哪种解决方案能在运营开销最小的情况下满足这些要求？A. B. C. D.", "options_en": ["Integrate Amazon Bedrock with Amazon Kendra to retrieve approved documents. Implement custom \npost-processing to compare generated responses against source documents and to include citations.", "Deploy an Amazon Bedrock Knowledge Base and connect it to approved clinical source documents. \nUse the Amazon Bedrock RetrieveAndGenerate API to return citations from the knowledge base.", "Use Amazon Bedrock and Amazon Comprehend Medical to extract medical entities. Implement \nverification logic against a medical terminology database.", "Use an Amazon Bedrock knowledge base with Retrieve API calls and InvokeModel API calls to \nretrieve approved clinical source documents. Implement verification logic to compare against retrieved \nsources and to cite sources."], "options_zh": ["将Amazon Bedrock与Amazon Kendra集成以检索已批准的文档。实施自定义后处理，将生成的响应与源文档进行比较并包含引用。", "部署Amazon Bedrock知识库并将其连接到已批准的临床源文档。使用Amazon Bedrock RetrieveAndGenerate API返回知识库中的引用。", "使用Amazon Bedrock和Amazon Comprehend Medical提取医疗实体。针对医学术语数据库实施验证逻辑。", "使用Amazon Bedrock知识库配合Retrieve API调用和InvokeModel API调用，检索已批准的临床源文档。实施验证逻辑，与检索到的源进行比较并引用来源。"], "a": "B", "explanation_en": "Option B is the correct solution because Amazon Bedrock Knowledge Bases with the RetrieveAndGenerate API provide a fully managed Retrieval Augmented Generation (RAG) capability that directly addresses grounding, citation, and hallucination prevention with the least operational overhead. Amazon Bedrock Knowledge Bases automatically manage document ingestion, chunking, embedding, retrieval, and ranking from approved data sources. When used with the RetrieveAndGenerate API, the model is constrained to generate responses only from retrieved, approved clinical documentation, significantly reducing the risk of hallucinations or unsupported claims. The API also returns explicit source citations, which satisfies regulatory and clinical transparency requirements without requiring custom comparison or validation logic. This approach aligns with AWS best practices for healthcare GenAI workloads, where correctness and traceability are critical. Because retrieval and generation are tightly integrated, the system avoids multi-step orchestration, custom verification pipelines, or additional compute layers that would increase latency and maintenance burden. Option A introduces Amazon Kendra and custom post-processing logic, increasing operational complexity. Option C focuses on entity extraction rather than controlled knowledge grounding and does not guarantee citation or hallucination prevention. Option D requires manual orchestration between retrieval and generation and custom verification logic, which increases development and maintenance effort. Therefore, Option B delivers accurate, grounded, and cited clinical recommendations with minimal infrastructure and operational overhead.", "explanation_zh": "选项B是正确的解决方案，因为Amazon Bedrock知识库配合RetrieveAndGenerate API提供了完全托管的检索增强生成（RAG）能力，以最少的运营开销直接解决基于事实、引用和幻觉预防的问题。Amazon Bedrock知识库自动管理来自已批准数据源的文档摄取、分块、嵌入、检索和排序。当与RetrieveAndGenerate API一起使用时，模型被约束为仅从检索到的已批准临床文档生成响应，显著降低幻觉或未经授权声明的风险。该API还返回显式的来源引用，满足了监管和临床透明度要求，无需自定义比较或验证逻辑。这种方法符合AWS关于医疗保健GenAI工作负载的最佳实践，其中正确性和可追溯性至关重要。由于检索和生成紧密集成，系统避免了多步骤编排、自定义验证管道或额外计算层，否则会增加延迟和维护负担。选项A引入了Amazon Kendra和自定义后处理逻辑，增加了运营复杂性。选项C侧重于实体提取而非受控的知识基础，不能保证引用或幻觉预防。选项D需要检索和生成之间的手动编排以及自定义验证逻辑，增加了开发和维护工作量。因此，选项B以最少的基础设施和运营开销提供了准确、基于事实且带引用的临床建议。"}, {"id": 75, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A hotel company wants to enhance a legacy Java-based property management system (PMS) by adding AI \ncapabilities. The company wants to use Amazon Bedrock Knowledge Bases to provide staff with room \navailability information and hotel-specific details. The solution must maintain separate access controls for \neach hotel that the company manages. The solution must provide room availability information in near real \ntime and must maintain consistent performance during peak usage periods. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家酒店公司希望通过在原有的基于Java的物业管理系统（PMS）上添加AI能力来增强系统。公司希望使用Amazon Bedrock知识库为员工提供房间可用性信息和酒店特定详情。解决方案必须为管理的每家酒店维护独立的访问控制。解决方案必须提供近实时的房间可用性信息，并在高峰使用期间保持一致的性能。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Deploy a single Amazon Bedrock knowledge base that contains combined data for all hotels. Configure \nAWS Lambda functions to synchronize data from each hotel’s PMS database through direct API \nconnections. Implement AWS CloudTrail logging with hotel-specific filters to audit access logs for \neach hotel’s data.", "Create an Amazon EventBridge rule for each hotel that is invoked by changes to the PMS database. \nConfigure the rule to send updates to a centralized Amazon Bedrock knowledge base in a management \nAWS account. Configure resource-based policies to enforce hotel-specific access controls.", "Implement one Amazon Bedrock knowledge base for each hotel in a multi-account structure. Use direct \ndata ingestion to provide near real-time room availability information. Schedule regular synchronization \nfor less critical information.", "Build a centralized Amazon Bedrock Agents solution that uses multiple knowledge bases. Implement \nAWS IAM Identity Center with hotel-specific permission sets to control staff access."], "options_zh": ["部署一个包含所有酒店合并数据的Amazon Bedrock知识库。配置AWS Lambda函数通过直接API连接从每家酒店的PMS数据库同步数据。实施带酒店特定过滤器的AWS CloudTrail日志记录，审计每家酒店数据的访问日志。", "为每家酒店创建由PMS数据库更改调用的Amazon EventBridge规则。配置规则将更新发送到管理AWS账户中的集中式Amazon Bedrock知识库。配置基于资源的策略以强制执行酒店特定的访问控制。", "在多账户结构中为每家酒店实施一个Amazon Bedrock知识库。使用直接数据摄取提供近实时的房间可用性信息。为不太关键的信息安排定期同步。", "构建一个使用多个知识库的集中式Amazon Bedrock Agents解决方案。实施带酒店特定权限集的AWS IAM Identity Center以控制员工访问。"], "a": "C", "explanation_en": "Option C best meets the requirements by aligning with AWS best practices for data isolation, access control, and scalable GenAI retrieval. Implementing a separate Amazon Bedrock knowledge base for each hotel ensures strict separation of data and permissions. This approach naturally enforces hotel-level access control without requiring complex policy logic or post-query filtering. A multi-account structure further strengthens security and governance by isolating each hotel’s data plane. AWS recommends account-level isolation for workloads with strong tenancy or compliance boundaries. Hotel staff can be granted access only to their hotel’s account and corresponding knowledge base, eliminating the risk of cross-hotel data exposure. Direct data ingestion into each knowledge base enables near real-time updates for critical data such as room availability. For information that does not change frequently, scheduled synchronization reduces ingestion cost while maintaining accuracy. This hybrid ingestion model balances freshness and operational efficiency. Because Amazon Bedrock Knowledge Bases are fully managed, performance remains consistent during peak usage periods without the company managing indexing, scaling, or retrieval infrastructure. Each knowledge base scales independently, preventing noisy-neighbor issues that could arise in a centralized design. Option A and B rely on a centralized knowledge base, which increases policy complexity and introduces risk of misconfigured access controls. Option D adds unnecessary orchestration complexity and does not inherently solve real-time data freshness requirements. Therefore, Option C provides the most secure, scalable, and operationally efficient solution for enhancing the PMS with Amazon Bedrock Knowledge Bases.", "explanation_zh": "选项C最符合要求，与AWS关于数据隔离、访问控制和可扩展GenAI检索的最佳实践保持一致。为每家酒店实施单独的Amazon Bedrock知识库确保数据和权限的严格分离。这种方法自然地强制执行酒店级访问控制，无需复杂的策略逻辑或查询后过滤。多账户结构进一步加强了安全性和治理，通过隔离每家酒店的数据平面。AWS推荐具有强租户或合规边界的工作负载使用账户级隔离。酒店员工可以被授予仅访问其酒店账户和对应知识库的权限，消除了跨酒店数据暴露的风险。向每个知识库直接数据摄取使关键数据（如房间可用性）能够近实时更新。对于不频繁变化的信息，定期同步降低了摄取成本，同时保持准确性。这种混合摄取模型平衡了新鲜度和运营效率。由于Amazon Bedrock知识库是完全托管的，高峰使用期间性能保持一致，公司无需管理索引、扩展或检索基础设施。每个知识库独立扩展，防止集中式设计中可能出现的噪音邻居问题。选项A和B依赖集中式知识库，增加了策略复杂性并带来访问控制配置错误的风险。选项D增加了不必要的编排复杂性，且本身不能解决实时数据新鲜度要求。因此，选项C为使用Amazon Bedrock知识库增强PMS提供了最安全、可扩展且运营高效的解决方案。"}, {"id": 76, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "An elevator service company has developed an AI assistant application by using Amazon Bedrock. The \napplication generates elevator maintenance recommendations to support the company’s elevator technicians. \nThe company uses Amazon Kinesis Data Streams to collect the elevator sensor data. New regulatory rules require that a human technician must review all AI-generated recommendations. The \ncompany needs to establish human oversight workflows to review and approve AI recommendations. The \ncompany must store all human technician review decisions for audit purposes. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家电梯服务公司使用Amazon Bedrock开发了一个AI助手应用程序。该应用程序生成电梯维护建议，以支持公司的电梯技术人员。公司使用Amazon Kinesis Data Streams收集电梯传感器数据。新的法规要求人工技术人员必须审核所有AI生成的建议。公司需要建立人工监督工作流，以审核和批准AI建议。公司必须存储所有人工技术人员审核决定以供审计。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Create a custom approval workflow by using AWS Lambda functions and Amazon SQS queues for \nhuman review of AI recommendations. Store all review decisions in Amazon DynamoDB for audit \npurposes.", "Create an AWS Step Functions workflow that has a human approval step that uses the \nwaitForTaskToken API to pause execution. After a human technician completes a review, use an AWS \nLambda function to call the SendTaskSuccess API with the approval decision. Store all review \ndecisions in Amazon DynamoDB.", "Create an AWS Glue workflow that has a human approval step. After the human technician review, \nintegrate the application with an AWS Lambda function that calls the SendTaskSuccess API. Store all \nhuman technician review decisions in Amazon DynamoDB.", "Configure Amazon EventBridge rules with custom event patterns to route AI recommendations to \nhuman technicians for review. Create AWS Glue jobs to process human technician approval queues. \nUse Amazon ElastiCache to cache all human technician review decisions."], "options_zh": ["使用AWS Lambda函数和Amazon SQS队列创建自定义审批工作流，用于AI建议的人工审核。将所有审核决定存储在Amazon DynamoDB中用于审计目的。", "创建具有使用waitForTaskToken API暂停执行的人工审批步骤的AWS Step Functions工作流。人工技术人员完成审核后，使用AWS Lambda函数调用SendTaskSuccess API并附上审批决定。将所有审核决定存储在Amazon DynamoDB中。", "创建具有人工审批步骤的AWS Glue工作流。人工技术人员审核后，使用AWS Lambda函数调用SendTaskSuccess API的应用程序集成。将所有人工技术人员审核决定存储在Amazon DynamoDB中。", "配置具有自定义事件模式的Amazon EventBridge规则，将AI建议路由到人工技术人员进行审核。创建AWS Glue作业处理人工技术人员审批队列。使用Amazon ElastiCache缓存所有人工技术人员审核决定。"], "a": "B", "explanation_en": "AWS Step Functions provides native support for human-in-the-loop workflows, making it the best fit for regulatory oversight requirements. The waitForTaskToken integration pattern is explicitly designed to pause a workflow until an external actor—such as a human reviewer—completes a task. In this architecture, AI-generated recommendations are sent to a human technician for review. The workflow pauses execution using a task token. Once the technician approves or rejects the recommendation, an AWS Lambda function calls SendTaskSuccess or SendTaskFailure, allowing the workflow to continue deterministically. This approach ensures full auditability, as Step Functions records every state transition, timestamp, and execution path. Storing review outcomes in Amazon DynamoDB provides durable, queryable audit records required for regulatory compliance. Option A requires custom orchestration and lacks native workflow state management. Option C incorrectly uses AWS Glue, which is not designed for approval workflows. Option D uses caching instead of durable audit storage and introduces unnecessary complexity. Therefore, Option B is the AWS-recommended, lowest-risk, and most auditable solution for mandatory human review of AI outputs.", "explanation_zh": "AWS Step Functions为人工参与工作流提供原生支持，使其最适合监管监督要求。waitForTaskToken集成模式专门设计用于暂停工作流，直到外部参与者（如人工审核员）完成任务。在此架构中，AI生成的建议被发送给人工技术人员进行审核。工作流使用任务令牌暂停执行。技术人员批准或拒绝建议后，AWS Lambda函数调用SendTaskSuccess或SendTaskFailure，使工作流确定性地继续。这种方法确保完全的可审计性，因为Step Functions记录每个状态转换、时间戳和执行路径。将审核结果存储在Amazon DynamoDB中提供了符合监管要求的持久、可查询的审计记录。选项A需要自定义编排，缺乏原生工作流状态管理。选项C错误地使用AWS Glue，这不适用于审批工作流。选项D使用缓存而非持久审计存储，并引入了不必要的复杂性。因此，选项B是AWS推荐的、风险最低且最可审计的强制性AI输出人工审核解决方案。"}, {"id": 77, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company is using Amazon Bedrock to design an application to help researchers apply for grants. The \napplication is based on an Amazon Nova Pro foundation model (FM). The application contains four required \ninputs and must provide responses in a consistent text format. The company wants to receive a notification in \nAmazon Bedrock if a response contains bullying language. However, the company does not want to block all \nflagged responses. The company creates an Amazon Bedrock flow that takes an input prompt and sends it to the Amazon Nova \nPro FM. The Amazon Nova Pro FM provides a response. Which additional steps must the company take to meet these requirements? (Select TWO.) A. B. C. D. E.", "body_zh": "一家公司正在使用Amazon Bedrock设计一个帮助研究人员申请资助的应用程序。该应用程序基于Amazon Nova Pro基础模型（FM）。应用程序包含四个必填输入，并且必须以一致的文本格式提供响应。公司希望在Amazon Bedrock中收到通知，如果响应包含霸凌语言。然而，公司不想阻止所有被标记的响应。公司创建一个Amazon Bedrock流，该流接收输入提示并将其发送到Amazon Nova Pro FM。Amazon Nova Pro FM提供响应。公司还需要采取哪些额外步骤来满足这些要求？（选择两个。）A. B. C. D. E.", "options_en": ["Use Amazon Bedrock Prompt Management to specify the required inputs as variables. Select an \nAmazon Nova Pro FM. Specify the output format for the response. Add the prompt to the prompts node \nof the flow.", "Create an Amazon Bedrock guardrail that applies the hate content filter. Set the filter response to block. \nAdd the guardrail to the prompts node of the flow.", "Create an Amazon Bedrock prompt router. Specify an Amazon Nova Pro FM. Add the required inputs \nas variables to the input node of the flow. Add the prompt router to the prompts node. Add the output \nformat to the output node.", "Create an Amazon Bedrock guardrail that applies the insults content filter. Set the filter response to \ndetect. Add the guardrail to the prompts node of the flow.", "Create an Amazon Bedrock application inference profile that specifies an Amazon Nova Pro FM. \nSpecify the output format for the response in the description. Include a tag for each of the input \nvariables. Add the profile to the prompts node of the flow."], "options_zh": ["使用Amazon Bedrock Prompt Management将必填输入指定为变量。选择Amazon Nova Pro FM。指定响应的输出格式。将提示添加到流的提示节点。", "创建应用仇恨内容过滤器的Amazon Bedrock护栏。将过滤器响应设置为阻止。将护栏添加到流的提示节点。", "创建Amazon Bedrock提示路由器。指定Amazon Nova Pro FM。将必填输入作为变量添加到流的输入节点。将提示路由器添加到提示节点。将输出格式添加到输出节点。", "创建应用侮辱内容过滤器的Amazon Bedrock护栏。将过滤器响应设置为检测。将护栏添加到流的提示节点。", "创建指定Amazon Nova Pro FM的Amazon Bedrock应用程序推理配置文件。在描述中指定响应的输出格式。为每个输入变量包含一个标签。将配置文件添加到流的提示节点。"], "a": "A D", "explanation_en": "The correct answers are A and D because they collectively satisfy the requirements for structured inputs, consistent output formatting, and non-blocking detection of bullying language. Option A is required because Amazon Bedrock Prompt Management enables prompt templates with explicit input variables and defined output formats. By defining the four required inputs as variables, the company ensures that every invocation of the Amazon Nova Pro FM receives the correct structured inputs. Specifying the output format ensures consistent responses, which is essential for a grants application workflow. Adding the managed prompt to the prompts node of the flow allows Bedrock Flows to invoke the model using this standardized configuration. Option D addresses the requirement to receive notifications when bullying language is detected without blocking responses. Amazon Bedrock guardrails support content filters with configurable actions. By applying the insults content filter and setting the response action to detect, the system flags responses containing bullying or insulting language while still allowing the response to be returned. This enables monitoring, alerting, and auditing without interrupting application functionality. Option B is incorrect because setting the filter response to block contradicts the requirement not to block all flagged responses. Option C introduces a prompt router, which is unnecessary because the application uses a single Amazon Nova Pro FM. Option E incorrectly attempts to enforce input variables and output formatting through an inference profile, which does not provide prompt-level variable enforcement or formatting guarantees. Therefore, A and D together provide structured prompt management and non-blocking safety detection with minimal operational complexity.", "explanation_zh": "正确答案是A和D，因为它们共同满足结构化输入、一致输出格式和非阻止式霸凌语言检测的要求。选项A是必需的，因为Amazon Bedrock Prompt Management支持带显式输入变量和定义输出格式的提示模板。通过将四个必填输入定义为变量，公司确保每次调用Amazon Nova Pro FM都能收到正确的结构化输入。指定输出格式确保一致的响应，这对于资助申请工作流至关重要。将托管提示添加到流的提示节点允许Bedrock Flows使用此标准化配置调用模型。选项D解决了当检测到霸凌语言时接收通知但不阻止响应的要求。Amazon Bedrock护栏支持具有可配置操作的内容过滤器。通过应用侮辱内容过滤器并将响应操作设置为检测，系统标记包含霸凌或侮辱语言的响应，同时仍允许返回响应。这支持监控、告警和审计，而不中断应用程序功能。选项B不正确，因为将过滤器响应设置为阻止违反了不阻止所有被标记响应的要求。选项C引入了不必要的提示路由器，因为应用程序只使用单个Amazon Nova Pro FM。选项E错误地尝试通过推理配置文件强制执行输入变量和输出格式，这不提供提示级变量执行或格式保证。因此，A和D共同以最少的运营复杂性提供了结构化的提示管理和非阻止式安全检测。"}, {"id": 78, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is developing a customer communication platform that uses an AI assistant powered by an \nAmazon Bedrock foundation model (FM). The AI assistant summarizes customer messages and generates \ninitial response drafts. The company wants to use Amazon Comprehend to implement layered content filtering. The layered content \nfiltering must prevent sharing of offensive content, protect customer privacy, and detect potential \ninappropriate advice solicitation. Inappropriate advice solicitation includes requests for unethical practices, \nharmful activities, or manipulative behaviors. The solution must maintain acceptable overall response times, so all pre-processing filters must finish before \nthe content reaches the FM. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在开发一个客户沟通平台，使用由Amazon Bedrock基础模型（FM）驱动的AI助手。AI助手总结客户消息并生成初始回复草稿。公司希望使用Amazon Comprehend实施分层内容过滤。分层内容过滤必须防止共享冒犯性内容、保护客户隐私，并检测潜在的不当建议索取。不当建议索取包括请求不道德行为、有害活动或操纵性行为。解决方案必须保持可接受的总体响应时间，因此所有预处理过滤器必须在内容到达FM之前完成。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Use parallel processing with asynchronous API calls. Use toxicity detection for offensive content. Use \nprompt safety classification for inappropriate advice solicitation. Use personally identifiable \ninformation (PII) detection without redaction.", "Use custom classification to build an FM that detects offensive content and inappropriate advice \nsolicitation. Apply personally identifiable information (PII) detection as a secondary filter only when \nmessages pass the custom classifier.", "Deploy a multi-stage process. Configure the process to use prompt safety classification first, then \ntoxicity detection on safe prompts only, and finally personally identifiable information (PII) detection in \nstreaming mode. Route flagged messages through Amazon EventBridge for human review.", "Use toxicity detection with thresholds configured to 0.5 for all categories. Use parallel processing for \nboth prompt safety classification and personally identifiable information (PII) detection with entity \nredaction. Apply Amazon CloudWatch alarms to filter metrics."], "options_zh": ["使用带异步API调用的并行处理。对冒犯性内容使用毒性检测。对不当建议索取使用提示安全分类。使用个人身份信息（PII）检测但不编辑。", "使用自定义分类构建一个检测冒犯性内容和不当建议索取的FM。仅在消息通过自定义分类器后，将个人身份信息（PII）检测作为次要过滤器应用。", "部署多阶段流程。配置流程首先使用提示安全分类，然后仅对安全提示进行毒性检测，最后以流式模式进行个人身份信息（PII）检测。将标记的消息通过Amazon EventBridge路由到人工审核。", "使用阈值配置为0.5的毒性检测覆盖所有类别。对提示安全分类和个人身份信息（PII）检测均使用并行处理并编辑实体。应用Amazon CloudWatch告警过滤指标。"], "a": "D", "explanation_en": "Option D best satisfies all functional, performance, and governance requirements while minimizing architectural complexity. The requirement explicitly states that all filtering must complete before content reaches the foundation model, which rules out asynchronous or streaming-based approaches that could delay enforcement. Amazon Comprehend supports toxicity detection, prompt safety classification, and PII detection with entity redaction as managed capabilities. Running these filters in parallel ensures low end-to-end latency, which is essential for customer-facing communication platforms. Parallel execution avoids the cumulative latency that would be introduced by sequential pipelines. Toxicity detection identifies offensive or abusive content early. Prompt safety classification detects requests for unethical, harmful, or manipulative advice, which directly addresses inappropriate advice solicitation requirements. PII detection with entity redaction ensures that customer privacy is preserved before data is sent to the FM, preventing sensitive information from being processed or echoed in generated responses. Configuring thresholds allows fine-grained control over sensitivity while maintaining acceptable false- positive rates. Using CloudWatch metrics and alarms enables continuous monitoring of filtering behavior and intervention rates without adding custom routing or human review pipelines that would slow responses. Option A lacks PII redaction. Option B introduces unnecessary model-building complexity and delayed PII checks. Option C adds sequential latency and introduces human review routing, which violates the response- time requirement. Therefore, Option D provides the most robust, performant, and AWS-aligned layered content filtering solution.", "explanation_zh": "选项D最符合所有功能、性能和治理要求，同时最小化架构复杂性。要求明确说明所有过滤必须在内容到达基础模型之前完成，这排除了可能延迟执行的异步或基于流式的方法。Amazon Comprehend支持毒性检测、提示安全分类和带实体编辑的PII检测作为托管能力。并行运行这些过滤器确保低端到端延迟，对于面向客户的沟通平台至关重要。并行执行避免了顺序管道会引入的累积延迟。毒性检测及早识别冒犯性或辱骂性内容。提示安全分类检测请求不道德、有害或操纵性建议，直接满足不当建议索取的要求。带实体编辑的PII检测确保在数据发送到FM之前保护客户隐私，防止敏感信息在处理或生成的响应中被处理或回显。配置阈值允许对灵敏度进行细粒度控制，同时保持可接受的误报率。使用CloudWatch指标和告警实现对过滤行为和干预率的持续监控，而无需添加会减慢响应的自定义路由或人工审核管道。选项A缺少PII编辑。选项B引入了不必要的模型构建复杂性和延迟的PII检查。选项C增加了顺序延迟并引入了人工审核路由，违反了响应时间要求。因此，选项D提供了最稳健、高性能且符合AWS建议的分层内容过滤解决方案。"}, {"id": 79, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A medical company is creating a generative AI (GenAI) system by using Amazon Bedrock. The system \nprocesses data from various sources and must maintain end-to-end data lineage. The system must also use real-\ntime personally identifiable information (PII) filtering and audit trails to automatically report compliance. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家医疗公司正在使用Amazon Bedrock创建一个生成式AI（GenAI）系统。该系统处理来自多个来源的数据，必须维护端到端的数据血缘。系统还必须使用实时个人身份信息（PII）过滤和审计追踪，以自动报告合规性。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Use AWS Glue Data Catalog to register all data sources and track lineage. Use Amazon Bedrock \nGuardrails PII filters. Enable AWS CloudTrail logging for all Amazon Bedrock API calls with Amazon \nS3 integration. Use Amazon Macie to scan stored data for sensitive information and publish findings to \nAmazon CloudWatch Logs. Create CloudWatch dashboards to visualize the findings and generate \nautomated compliance reports.", "Use AWS Config to track data source configurations and changes. Use AWS WAF with custom rules to \nfilter PII at the application layer before Amazon Bedrock processes the data. Configure Amazon \nEventBridge to capture and route audit events to Amazon S3. Use Amazon Comprehend Medical with \nscheduled AWS Lambda functions to analyze stored outputs for compliance violations.", "Use AWS DataSync to replicate data sources to track lineage. Configure Amazon Macie to scan \nAmazon Bedrock outputs for sensitive information. Use AWS Systems Manager Session Manager to \nlog user interactions. Deploy Amazon Textract with AWS Step Functions workflows to identify and \nredact PII from generated reports.", "Configure Amazon Athena to query data sources to analyze and report on data lineage. Use Amazon \nCloudWatch custom metrics to monitor PII exposure in Amazon Bedrock responses and establish AWS \nX-Ray tracing to generate an audit trail. Use an Amazon Rekognition Custom Labels model to detect \nsensitive information in the data that Amazon Bedrock processes."], "options_zh": ["使用AWS Glue Data Catalog注册所有数据源并跟踪血缘。使用Amazon Bedrock护栏PII过滤器。为所有Amazon Bedrock API调用启用带Amazon S3集成的AWS CloudTrail日志记录。使用Amazon Macie扫描存储的数据中敏感信息，并将发现结果发布到Amazon CloudWatch Logs。创建CloudWatch仪表板可视化发现结果并生成自动合规报告。", "使用AWS Config跟踪数据源配置和更改。使用带自定义规则的AWS WAF在应用程序层过滤PII，然后再由Amazon Bedrock处理数据。配置Amazon EventBridge捕获审计事件并路由到Amazon S3。使用Amazon Comprehend Medical配合定期AWS Lambda函数分析存储的输出以检测合规违规。", "使用AWS DataSync复制数据源以跟踪血缘。配置Amazon Macie扫描Amazon Bedrock输出中敏感信息。使用AWS Systems Manager Session Manager记录用户交互。部署Amazon Textract配合AWS Step Functions工作流，从生成的报告中识别和编辑PII。", "配置Amazon Athena查询数据源以分析和报告数据血缘。使用Amazon CloudWatch自定义指标监控Amazon Bedrock响应中的PII暴露，并建立AWS X-Ray追踪生成审计追踪。使用Amazon Rekognition Custom Labels模型检测Amazon Bedrock处理的数据中的敏感信息。"], "a": "A", "explanation_en": "Option is the most comprehensive and architecturally aligned solution for meeting end-to-end data lineage, A real-time PII filtering, and automated compliance reporting requirements in a medical GenAI system built on Amazon Bedrock. Each requirement maps directly to a managed AWS service that is purpose-built for governance, security, and compliance. AWS Glue Data Catalog is designed to register datasets across multiple sources and maintain metadata that supports lineage tracking. By cataloging all inputs that flow into the Bedrock-based system, the organization can trace how data moves from ingestion through processing and storage, which is essential for regulatory audits in healthcare environments. For , provide native PII detection and filtering during real-time PII filtering Amazon Bedrock Guardrails model inference. Guardrails operate inline with model invocation, ensuring sensitive information is blocked or redacted before responses are returned to users. This satisfies the requirement for real-time protection rather than post-processing analysis. AWS CloudTrail delivers a complete audit trail of all Amazon Bedrock API calls, including InvokeModel requests and configuration changes. Storing these logs in Amazon S3 enables long-term retention and supports compliance audits. CloudTrail ensures traceability of who accessed the system, when, and how it was used. To strengthen compliance monitoring, continuously scans stored data for sensitive Amazon Macie information and automatically classifies findings. Publishing Macie findings to Amazon CloudWatch Logs and visualizing them through dashboards enables near-real-time visibility into compliance posture and supports automated reporting workflows. The other options fall short. Option performs PII filtering at the application edge rather than at inference B time and relies on scheduled analysis instead of real-time enforcement. Option focuses on replication and C document processing rather than inline GenAI governance. Option uses services that are not designed for D PII detection in text-based GenAI workflows and lacks native lineage tracking. Therefore, best fulfills all stated requirements using AWS-recommended governance and security A capabilities.", "explanation_zh": "选项A是最全面且架构上最符合要求的解决方案，满足在基于Amazon Bedrock构建的医疗GenAI系统中端到端数据血缘、实时PII过滤和自动合规报告的要求。每个要求直接映射到专为治理、安全和合规而构建的托管AWS服务。AWS Glue Data Catalog设计用于注册跨多个源的数据集，并维护支持血缘追踪的元数据。通过对流入Bedrock系统的所有输入进行编目，组织可以追踪数据如何从摄取通过处理到存储的移动，这在医疗保健环境中对监管审计至关重要。对于实时PII过滤，Amazon Bedrock护栏在模型推理期间提供原生PII检测和过滤。护栏与模型调用内联操作，确保敏感信息在响应返回给用户之前被阻止或编辑。这满足了实时保护而非事后分析的要求。AWS CloudTrail提供所有Amazon Bedrock API调用的完整审计追踪，包括InvokeModel请求和配置更改。将这些日志存储在Amazon S3中支持长期留存并支持合规审计。CloudTrail确保谁访问了系统、何时以及如何使用系统的可追溯性。为加强合规监控，Amazon Macie持续扫描存储数据中的敏感信息并自动分类发现结果。将Macie发现结果发布到Amazon CloudWatch Logs并通过仪表板可视化，支持近乎实时地了解合规状态并支持自动化报告工作流。其他选项存在不足。选项B在应用程序边缘而非推理时执行PII过滤，依赖定期计划分析而非实时执行。选项C侧重于复制和文档处理，而非内联GenAI安全控制。选项D依赖不适用于实时GenAI PII过滤或血缘追踪的服务。"}, {"id": 80, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A GenAI developer is evaluating Amazon Bedrock foundation models (FMs) to enhance a Europe-based \ncompany's internal business application. The company has a multi-account landing zone in AWS Control \nTower. The company uses Service Control Policies (SCPs) to allow its accounts to use only the eu-north-1 \nand eu-west-1 Regions. All customer data must remain in private networks within the approved AWS Regions. The GenAI developer selects an FM based on analysis and testing and hosts the model in the eu-central-1 \nRegion and the eu-west-3 Region. The GenAI developer must enable access to the FM for the company's \nemployees. The GenAI developer must ensure that requests to the FM are private and remain within the same \nRegions as the FM. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一位GenAI开发人员正在评估Amazon Bedrock基础模型（FM），以增强一家欧洲公司内部业务应用程序。该公司在AWS Control Tower中拥有多账户着陆区。公司使用服务控制策略（SCP）仅允许其账户使用eu-north-1和eu-west-1区域。所有客户数据必须保留在已批准AWS区域内的私有网络中。GenAI开发人员基于分析和测试选择一个FM，并将模型托管在eu-central-1区域和eu-west-3区域。GenAI开发人员必须为公司员工启用对FM的访问。GenAI开发人员必须确保对FM的请求是私有的，并保持在与FM相同的区域内。哪种解决方案能满足这些要求？A. B. C. D.", "options_en": ["Deploy an AWS Lambda function that is exposed by a private Amazon API Gateway REST API to a \nVPC in eu-north-1. Create a VPC endpoint for the selected FM in eu-central-1 and eu-west-3. Extend \nexisting SCPs to allow employees to use the FM. Integrate the REST API with the business application.", "Deploy the FM on Amazon EC2 instances in eu-north-1. Deploy a private Amazon API Gateway REST \nAPI in front of the EC2 instances. Configure an Amazon Bedrock VPC endpoint. Integrate the REST \nAPI with the business application.", "Configure the FM to use cross-Region inference through a Europe-scoped endpoint. Configure an \nAmazon Bedrock VPC endpoint. Extend existing SCPs to allow employees to use the FM through \ninference profiles in Europe-based Regions where the FM is available. Use an inference profile to \nintegrate Amazon Bedrock with the business application.", "Deploy the FM in Amazon SageMaker in eu-north-1. Configure a SageMaker VPC endpoint. Extend \nexisting SCPs to allow employees to use the SageMaker endpoint. Integrate the FM in SageMaker with \nthe business application."], "options_zh": ["部署一个通过私有Amazon API Gateway REST API向eu-north-1中VPC公开的AWS Lambda函数。在eu-central-1和eu-west-3中为所选FM创建VPC端点。扩展现有SCP，允许员工使用FM。将REST API与业务应用程序集成。", "在eu-north-1中的Amazon EC2实例上部署FM。在EC2实例前部署私有Amazon API Gateway REST API。配置Amazon Bedrock VPC端点。将REST API与业务应用程序集成。", "通过欧洲范围的端点配置FM使用跨区域推理。配置Amazon Bedrock VPC端点。扩展现有SCP，允许员工通过FM可用的欧洲区域中的推理配置文件使用FM。使用推理配置文件将Amazon Bedrock与业务应用程序集成。", "在eu-north-1中的Amazon SageMaker中部署FM。配置SageMaker VPC端点。扩展现有SCP，允许员工使用SageMaker端点。将SageMaker中的FM与业务应用程序集成。"], "a": "C", "explanation_en": "Option C is the correct solution because it uses Amazon Bedrock cross-Region inference profiles, which are explicitly designed to support regional data residency, private connectivity, and resilience with minimal operational overhead. By using a Europe-scoped inference profile, the application ensures that all inference requests are routed only within European Regions where the FM is deployed, such as eu-central-1 and eu-west-3. This satisfies data residency requirements while still providing resilience and load distribution across Regions. Configuring an Amazon Bedrock VPC endpoint ensures that all traffic remains on the AWS private network. No public endpoints are used, which aligns with the company’s private networking requirements. Extending existing SCPs to allow inference profile usage ensures that employees can access the FM only in approved Regions, maintaining governance across the Control Tower environment. Options A and B introduce unnecessary custom routing layers and EC2 management. Option D moves away from Amazon Bedrock entirely and increases operational complexity. Therefore, Option C is the only solution that satisfies private access, regional confinement, governance controls, and low operational overhead.", "explanation_zh": "选项C是正确的解决方案，因为它使用Amazon Bedrock跨区域推理配置文件，该配置文件专门设计用于以最少的运营开销支持区域数据驻留、私有连接和弹性。通过使用欧洲范围的推理配置文件，应用程序确保所有推理请求仅路由到FM部署的欧洲区域内，如eu-central-1和eu-west-3。这满足了数据驻留要求，同时仍提供跨区域的弹性和负载分布。配置Amazon Bedrock VPC端点确保所有流量保持在AWS私有网络上。不使用公共端点，符合公司的私有网络要求。扩展现有SCP以允许使用推理配置文件，确保员工只能在已批准区域中访问FM，保持Control Tower环境中的治理。选项A和B引入了不必要的自定义路由层和EC2管理。选项D完全脱离Amazon Bedrock，增加了运营复杂性。因此，选项C是唯一满足私有访问、区域限制、治理控制和低运营开销的解决方案。"}, {"id": 81, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A media company is launching a platform that allows thousands of users every hour to upload images and text \ncontent. The platform uses Amazon Bedrock to process the uploaded content to generate creative \ncompositions. The company needs a solution to ensure that the platform does not process or produce inappropriate content. \nThe platform must not expose personally identifiable information (PII) in the compositions. The solution must \nintegrate with the company's existing Amazon S3 storage workflow. Which solution will meet these requirements with the LEAST infrastructure management overhead? A. B. C. D.", "body_zh": "一家媒体公司正在推出一个平台，每小时允许数千名用户上传图像和文本内容。该平台使用Amazon Bedrock处理上传的内容，以生成创意作品。该公司需要一个解决方案，确保平台不会处理或产生不当内容。平台不得在作品中暴露个人身份信息（PII）。该解决方案必须与公司现有的Amazon S3存储工作流程集成。哪种解决方案能以最少基础设施管理开销满足这些要求？", "options_en": ["Enable the Enhanced Monitoring tool. Use an Amazon CloudWatch alarm to filter traffic to the \nplatform. Use Amazon Comprehend PII detection to pre-process the data. Create a CloudWatch alarm \nto monitor for Amazon Comprehend PII detection events. Create an AWS Step Functions workflow \nthat includes an Amazon Rekognition image moderation step.", "Use an Amazon API Gateway HTTP API with request validation templates to screen content before \nstoring the uploaded content in Amazon S3. Use Amazon SageMaker AI to build custom content \nmoderation models that process content before sending the processed content to Amazon Bedrock.", "Create an Amazon Cognito user pool that uses pre-authentication AWS Lambda functions to run \ncontent moderation checks. Use Amazon Textract to filter text content and Amazon Rekognition to \nfilter image content before allowing users to upload content to the platform.", "Create an AWS Step Functions workflow that uses built-in Amazon Bedrock guardrails to filter \ncontent. Use Amazon Comprehend PII detection to pre-process the content. Use Amazon Rekognition \nimage moderation."], "options_zh": ["启用Enhanced Monitoring工具。使用Amazon CloudWatch告警过滤发往平台的流量。使用Amazon Comprehend PII检测对数据进行预处理。创建一个CloudWatch告警来监控Amazon Comprehend PII检测事件。创建一个AWS Step Functions工作流程，包含Amazon Rekognition图像审核步骤。", "使用Amazon API Gateway HTTP API和请求验证模板，在将上传内容存入Amazon S3之前进行内容筛选。使用Amazon SageMaker AI构建自定义内容审核模型，在将处理后的内容发送到Amazon Bedrock之前对内容进行处理。", "创建一个Amazon Cognito用户池，使用预认证的AWS Lambda函数运行内容审核检查。使用Amazon Textract过滤文本内容，使用Amazon Rekognition过滤图像内容，然后再允许用户将内容上传到平台。", "创建一个AWS Step Functions工作流程，使用内置的Amazon Bedrock护栏来过滤内容。使用Amazon Comprehend PII检测对内容进行预处理。使用Amazon Rekognition图像审核功能。"], "a": "D", "explanation_en": "Option D is the correct solution because it relies primarily on managed, purpose-built AWS services and minimizes custom infrastructure and model management. Amazon Bedrock guardrails provide native, configurable content safety controls that can block or redact disallowed content before or after model inference. This directly ensures that the platform does not process or produce inappropriate outputs while maintaining low operational overhead. Using Amazon Comprehend PII detection as a preprocessing step integrates cleanly with an Amazon S3– based ingestion workflow. Comprehend is a fully managed service that detects and optionally redacts PII in text without requiring custom models or pipelines. This ensures that sensitive information is removed before content is passed to Amazon Bedrock for generation. Amazon Rekognition image moderation is purpose-built for detecting unsafe or inappropriate visual content and integrates naturally into Step Functions workflows. Step Functions provides orchestration without requiring servers or long-running infrastructure, allowing the company to integrate text and image moderation steps in a clear, auditable pipeline. Option A introduces redundant monitoring logic and alarms that do not directly enforce content safety. Option B requires building and maintaining custom SageMaker models, increasing complexity and operational burden. Option C applies moderation at authentication time and uses services like Textract that are not designed for content moderation, increasing latency and management overhead. Therefore, Option D best satisfies content safety, PII protection, S3 integration, and minimal infrastructure management requirements.", "explanation_zh": "选项D是正确的，因为它主要依赖托管的、专为特定用途构建的AWS服务，最大限度地减少了自定义基础设施和模型管理。Amazon Bedrock护栏提供了原生、可配置的内容安全控制，可以在模型推理前后阻止或删除不允许的内容。这直接确保平台不会处理或产生不当输出，同时保持较低的运维开销。使用Amazon Comprehend PII检测作为预处理步骤，可以干净地集成到基于Amazon S3的数据摄取工作流程中。Comprehend是一个完全托管的服务，可以在文本中检测并可选地删除PII，无需自定义模型或流水线。这确保了敏感信息在内容传递给Amazon Bedrock进行生成之前已被移除。Amazon Rekognition图像审核专为检测不安全或不当的视觉内容而设计，可以自然地集成到Step Functions工作流程中。Step Functions提供编排功能，无需服务器或长期运行的基础设施，使公司能够在一个清晰、可审计的流水线中集成文本和图像审核步骤。选项A引入了冗余的监控逻辑和告警，不能直接强制内容安全。选项B需要构建和维护自定义SageMaker模型，增加了复杂性和运维负担。选项C在身份验证时应用审核，并使用Textract等并非为内容审核设计的服务，增加了延迟和管理开销。因此，选项D最能满足内容安全、PII保护、S3集成和最小基础设施管理的要求。"}, {"id": 82, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A book publishing company wants to build a book recommendation system that uses an AI assistant. The AI \nassistant will use ML to generate a list of recommended books from the company's book catalog. The system \nmust suggest books based on conversations with customers. The company stores the text of the books, customers' and editors' reviews of the books, and extracted book \nmetadata in Amazon S3. The system must support low-latency responses and scale efficiently to handle more \nthan 10,000 concurrent users. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家图书出版公司希望构建一个使用AI助手的图书推荐系统。该AI助手将使用机器学习从公司的图书目录中生成推荐图书列表。系统必须根据与客户的对话来推荐图书。公司将图书文本、顾客和编辑的图书评论以及提取的图书元数据存储在Amazon S3中。系统必须支持低延迟响应，并能够高效扩展以处理超过10,000个并发用户。哪种解决方案能满足这些要求？", "options_en": ["Use Amazon Bedrock Knowledge Bases to generate embeddings. Store the embeddings as a vector \nstore in Amazon OpenSearch Service. Create an AWS Lambda function that queries the knowledge \nbase. Configure Amazon API Gateway to invoke the Lambda function when handling user requests.", "Use Amazon Bedrock Knowledge Bases to generate embeddings. Store the embeddings as a vector \nstore in Amazon DynamoDB. Create an AWS Lambda function that queries the knowledge base. \nConfigure Amazon API Gateway to invoke the Lambda function when handling user requests.", "Use Amazon SageMaker AI to deploy a pre-trained model to build a personalized recommendation \nengine for books. Deploy the model as a SageMaker AI endpoint. Invoke the model endpoint by using \nAmazon API Gateway.", "Create an Amazon Kendra GenAI Enterprise Edition index that uses the S3 connector to index the book \ncatalog data stored in Amazon S3. Configure built-in FAQ in the Kendra index. Develop an AWS \nLambda function that queries the Kendra index based on user conversations. Deploy Amazon API \nGateway to expose this functionality and invoke the Lambda function."], "options_zh": ["使用Amazon Bedrock Knowledge Bases生成embeddings。将embeddings作为向量存储存储在Amazon OpenSearch Service中。创建一个AWS Lambda函数来查询知识库。配置Amazon API Gateway在处理用户请求时调用该Lambda函数。", "使用Amazon Bedrock Knowledge Bases生成embeddings。将embeddings作为向量存储存储在Amazon DynamoDB中。创建一个AWS Lambda函数来查询知识库。配置Amazon API Gateway在处理用户请求时调用该Lambda函数。", "使用Amazon SageMaker AI部署一个预训练模型，构建个性化的图书推荐引擎。将模型部署为SageMaker AI端点。通过Amazon API Gateway调用模型端点。", "创建一个Amazon Kendra GenAI Enterprise Edition索引，使用S3连接器对存储在Amazon S3中的图书目录数据进行索引。在Kendra索引中配置内置的常见问题解答。开发一个AWS Lambda函数，根据用户对话查询Kendra索引。部署Amazon API Gateway以暴露此功能并调用Lambda函数。"], "a": "A", "explanation_en": "Option A best meets the requirements because it directly implements a Retrieval Augmented Generation pattern for conversational recommendations using managed Amazon Bedrock capabilities and a scalable vector store. The company’s source data already resides in Amazon S3, which aligns naturally with Amazon Bedrock Knowledge Bases ingestion workflows. A knowledge base can ingest book text, reviews, and metadata, generate embeddings using a supported embedding model, and persist those vectors in a purpose- built vector backend such as Amazon OpenSearch Service. This enables semantic retrieval that is well suited to conversation-driven intent, where user prompts are often descriptive and do not map cleanly to keyword filters. The requirement to suggest books based on conversations implies the system must interpret natural language context and retrieve relevant passages, reviews, and metadata to ground the recommendation. Knowledge Bases provide managed orchestration for embedding creation and retrieval, which reduces development effort compared to building custom embedding pipelines. OpenSearch Service provides scalable vector search and k- nearest neighbors style similarity retrieval, which supports low-latency responses when properly indexed and sized. For scaling to more than 10,000 concurrent users, the API layer design in option A is a common AWS pattern: Amazon API Gateway provides a managed front door with throttling and request handling, while AWS Lambda scales horizontally with demand and can invoke the knowledge base retrieval operations. This separates compute scaling from the vector store scaling and helps keep latency predictable under load. Option B is not the best choice because DynamoDB is not the standard native vector store target for Amazon Bedrock Knowledge Bases in this context and would introduce additional implementation complexity around vector indexing and similarity search behavior. Option C requires substantial ML lifecycle work, model hosting, tuning, and continuous iteration to achieve quality recommendations at scale. Option D provides strong enterprise search, but it focuses on retrieval and FAQs rather than a managed RAG recommendation workflow grounded in embeddings and conversational context for generative responses.", "explanation_zh": "选项A最能满足要求，因为它直接实现了检索增强生成（RAG）模式，用于基于对话的推荐，使用了托管的Amazon Bedrock功能和可扩展的向量存储。公司的源数据已经存储在Amazon S3中，这与Amazon Bedrock Knowledge Bases的数据摄取工作流程自然契合。知识库可以摄取图书文本、评论和元数据，使用支持的embedding模型生成embeddings，并将这些向量存储在专为向量设计的后端（如Amazon OpenSearch Service）中。这实现了语义检索，非常适合基于对话的意图，因为用户的提示通常是描述性的，不容易用关键词过滤器处理。基于对话推荐图书的要求意味着系统必须理解自然语言上下文，并检索相关的段落、评论和元数据来支撑推荐。Knowledge Bases为embedding创建和检索提供了托管编排，相比构建自定义embedding流水线减少了开发工作量。OpenSearch Service提供可扩展的向量搜索和k近邻相似度检索，在正确索引和调整规模的情况下支持低延迟响应。为了扩展到超过10,000个并发用户，选项A中的API层设计是一种常见的AWS模式：Amazon API Gateway提供托管的入口，具有限流和请求处理功能，而AWS Lambda随需求水平扩展，可以调用知识库的检索操作。这分离了计算扩展和向量存储扩展，有助于在负载下保持延迟可预测。选项B不是最佳选择，因为在此场景中DynamoDB不是Amazon Bedrock Knowledge Bases的标准原生向量存储目标，会引入向量索引和相似度搜索方面的额外实现复杂性。选项C需要大量的机器学习生命周期工作……"}, {"id": 83, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A financial services company is developing a customer service AI assistant by using Amazon Bedrock. The \nAI assistant must not discuss investment advice with users. The AI assistant must block harmful content, \nmask personally identifiable information (PII), and maintain audit trails for compliance reporting. The AI \nassistant must apply content filtering to both user inputs and model responses based on content sensitivity. The company requires an Amazon Bedrock guardrail configuration that will effectively enforce policies with \nminimal false positives. The solution must provide multiple handling strategies for multiple types of sensitive \ncontent. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家金融服务公司正在使用Amazon Bedrock开发一个客户服务AI助手。该AI助手不得与用户讨论投资建议。AI助手必须阻止有害内容，屏蔽个人身份信息（PII），并维护用于合规报告的审计跟踪。AI助手必须根据内容敏感性对用户输入和模型输出都应用内容过滤。公司需要一个能有效执行策略且误报最少的Amazon Bedrock护栏配置。该解决方案必须为多种类型的敏感内容提供多种处理策略。哪种解决方案能满足这些要求？", "options_en": ["Configure a single guardrail and set content filters to high for all categories. Set up denied topics for \ninvestment advice and include sample phrases to block. Set up sensitive information filters that apply \nthe block action for all PII entities. Apply the guardrail to all model inference calls.", "Configure multiple guardrails by using tiered policies. Create one guardrail and set content filters to \nhigh. Configure the guardrail to block PII for public interactions. Configure a second guardrail and set \ncontent filters to medium. Configure the second guardrail to mask PII for internal use. Configure \nmultiple topic-specific guardrails to block investment advice and set up contextual grounding checks.", "Configure a guardrail and set content filters to medium for harmful content. Set up denied topics for \ninvestment advice and include clear definitions and sample phrases to block. Configure sensitive \ninformation filters to mask PII in responses and to block financial information in inputs. Enable both \ninput and output evaluations that use custom blocked messages for audits.", "Create a separate guardrail for each use case. Create one guardrail that applies a harmful content filter. \nCreate a guardrail to apply topic filters for investment advice. Create a guardrail to apply sensitive \ninformation filters to block PII. Use AWS Step Functions to chain the guardrails sequentially."], "options_zh": ["配置单个护栏，并将所有类别的内容过滤器设置为高。为投资建议设置拒绝主题，并包含示例短语进行屏蔽。设置敏感信息过滤器，对所有PII实体应用阻止操作。将护栏应用于所有模型推理调用。", "使用分层策略配置多个护栏。创建一个护栏，将内容过滤器设置为高。配置该护栏在公共交互中阻止PII。配置第二个护栏，将内容过滤器设置为中。配置第二个护栏在内部使用中屏蔽PII。配置多个特定主题的护栏来阻止投资建议，并设置上下文基础检查。
