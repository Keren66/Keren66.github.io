. Create a pipeline in AWS \nCodePipeline that has a deployment stage for each environment that uses AWS CodeBuild deploy \nactions.", "the Amazon Bedrock FMs by using the aws_bedrock.ProvisionedModel.fromProvisionedModelArn() \nmethod. Create a pipeline in AWS CodePipeline. Configure the pipeline to deploy to the production \nenvironment by using an AWS CodeBuild deploy action. For the development environment, manually \nrecreate the resources by referring to the production application code."], "options_zh": ["创建一个AWS CDK应用程序。在AWS CodePipeline中创建多个流水线。为每个流水线配置各自针对每个FM的设置。配置应用程序使用aws_bedrock.ProvisionedModel.fromProvisionedModelArn()方法调用Amazon Bedrock FM。", "为每个环境创建一个独立的AWS CDK应用程序。配置应用程序使用aws_bedrock.FoundationModel.fromFoundationModelId()方法调用Amazon Bedrock FM。为每个环境创建独立的AWS CodePipeline流水线。", "创建一个AWS CDK应用程序。配置应用程序使用aws_bedrock.FoundationModel.fromFoundationModelId()方法调用Amazon Bedrock FM。在AWS CodePipeline中创建一个流水线，包含每个环境的部署阶段，使用AWS CodeBuild部署操作。", "创建一个AWS CDK应用程序用于生产环境。配置应用程序使用aws_bedrock.ProvisionedModel.fromProvisionedModelArn()方法调用Amazon Bedrock FM。在AWS CodePipeline中创建一个流水线。配置流水线使用AWS CodeBuild部署操作部署到生产环境。对于开发环境，参考生产应用程序代码手动重新创建资源。"], "a": "C", "explanation_en": "Option C best satisfies the requirement for flexible FM testing across environments while minimizing operational complexity and aligning with AWS-recommended deployment practices. Amazon Bedrock supports invoking on-demand foundation models through the FoundationModel abstraction, which allows applications to dynamically reference different models without requiring dedicated provisioned capacity. This is ideal for experimentation and A/B testing in both development and production environments. Using a single AWS CDK application ensures infrastructure consistency and reduces duplication. Environment-specific configuration, such as selecting different foundation model IDs, can be externalized through parameters, context variables, or environment-specific configuration files. This allows product owners to easily switch between FMs in each environment without modifying application logic. A single AWS CodePipeline with distinct deployment stages for development and production is an AWS best practice for multi-environment deployments. It enforces consistent build and deployment steps while still allowing environment-level customization. AWS CodeBuild deploy actions enable automated, repeatable deployments, reducing manual errors and improving governance. Option A increases complexity by introducing multiple pipelines and relies on provisioned models, which are not necessary for FM evaluation and experimentation. Provisioned throughput is better suited for predictable, high-volume production workloads rather than frequent model switching. Option B creates unnecessary operational overhead by duplicating CDK applications and pipelines, making long-term maintenance more difficult. Option D directly conflicts with infrastructure-as-code best practices by manually recreating development resources, which increases configuration drift and reduces reliability. Therefore, Option C provides the most flexible, scalable, and AWS-aligned solution for testing and switching foundation models across development and production environments.", "explanation_zh": "选项C最能满足跨环境灵活FM测试的要求，同时最小化运维复杂性并与AWS推荐的部署实践保持一致。Amazon Bedrock支持通过FoundationModel抽象调用按需基础模型，使应用程序能够动态引用不同模型，无需专门的预置容量。这对于开发和生产环境中的实验和A/B测试非常理想。使用单个AWS CDK应用程序确保基础设施一致性并减少重复。环境特定的配置（如选择不同的基础模型ID）可以通过参数、上下文变量或环境特定的配置文件外部化。这使得产品所有者可以在每个环境中轻松切换FM，而无需修改应用程序逻辑。具有开发和测试独立部署阶段的单个AWS CodePipeline是多环境部署的AWS最佳实践。它强制一致的构建和部署步骤，同时仍允许环境级别的自定义。AWS CodeBuild部署操作实现自动化、可重复的部署，减少人工错误并改进治理。选项A通过引入多个流水线增加了复杂性，并依赖预置模型，而这对于FM评估和实验并非必要。预置吞吐量更适合可预测的高容量生产工作负载，而非频繁的模型切换。选项B通过复制CDK应用程序和流水线创建了不必要的运维开销，使长期维护更加困难。选项D直接与基础设施即代码最佳实践相冲突，通过手动重新创建开发资源增加了配置漂移并降低了可靠性。因此，选项C提供了最灵活、可扩展且符合AWS标准的方式来测试和切换基础……"}, {"id": 101, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is developing three specialized NLP models that support a customer service application. One \nmodel categorizes each customer’s specific issue. Another model extracts key information from the customer \ninteractions. The third model generates responses. The company must ensure that the application achieves at \nleast 95% accuracy for all tasks. The application must handle up to 500 concurrent requests and respond in \nless than 500 ms during daily 2-hour peak usage periods. The company must ensure that the application \noptimizes resource usage during periods of low demand between usage spikes. Which solution will meet these \nrequirements? A. B. C. D.", "body_zh": "一家公司正在开发三个专门的自然语言处理模型，用于支持客户服务应用程序。一个模型对每位客户的具体问题进行分类。另一个模型从客户互动中提取关键信息。第三个模型生成响应。公司必须确保应用程序对所有任务达到至少95%的准确性。应用程序必须能够处理最多500个并发请求，并在每日2小时的高峰使用期间在500毫秒内做出响应。公司必须确保应用程序在使用高峰之间的低需求期间优化资源使用。哪种解决方案能满足这些要求？", "options_en": ["Deploy all three models to a single Amazon SageMaker AI multi-model endpoint. Enable dynamic \nscaling on the endpoint. Use a compute optimized instance type. Configure auto scaling policies that are \nbased on invocation metrics to handle peak loads.", "Deploy each model to a separate Amazon SageMaker Serverless Inference endpoint. Set provisioned \nconcurrency to handle peak loads. Configure maximum concurrency limits and memory sizing based on \neach model's specific requirements.", "Deploy the models by using Amazon Bedrock with provisioned throughput to handle peak loads. \nConfigure the number of model units (MUs) based on expected token throughput needs. Implement \nrequest batching for each model.", "Deploy each model to a separate Amazon SageMaker AI endpoint. Use an asynchronous inference \nconfiguration. Store model requests and responses in Amazon S3. Use Amazon SNS to send alerts to \nusers when the application finishes processing requests."], "options_zh": ["将所有三个模型部署到单个Amazon SageMaker AI多模型端点。在端点上启用动态扩展。使用计算优化型实例类型。配置基于调用指标的自动扩展策略以处理峰值负载。", "将每个模型部署到独立的Amazon SageMaker Serverless Inference端点。设置预置并发以处理峰值负载。根据每个模型的具体需求配置最大并发限制和内存大小。", "使用带有预置吞吐量的Amazon Bedrock部署模型以处理峰值负载。根据预期的令牌吞吐量需求配置模型单元（MU）数量。为每个模型实施请求批处理。", "将每个模型部署到独立的Amazon SageMaker AI端点。使用异步推理配置。将模型请求和响应存储在Amazon S3中。使用Amazon SNS在应用程序处理完请求后向用户发送告警。"], "a": "B", "explanation_en": "is specifically designed for applications that experience Amazon SageMaker Serverless Inference intermittent or bursty traffic. It automatically scales compute capacity based on the number of requests and scales down to zero when there is no traffic, satisfying the requirement to optimize resource usage during low demand. To meet the 500 ms latency requirement during peak periods and avoid \"cold start\" delays, keeps a specified number of execution environments warm and ready to respond provisioned concurrency immediately. This provides a balance between the cost-effectiveness of serverless and the performance predictability of provisioned instances. Multi-model endpoints (Option A) can introduce \"noisy neighbor\" issues and latency spikes, while asynchronous inference (Option D) is intended for long-running workloads and cannot meet sub-500 ms requirements.", "explanation_zh": "Amazon SageMaker Serverless Inference专门设计用于经历间歇性或突发流量的应用程序。它根据请求数量自动扩展计算容量，并在没有流量时缩减到零，满足低需求期间优化资源使用的要求。为了满足高峰期间500毫秒的延迟要求并避免\"冷启动\"延迟，预置并发保持指定数量的执行环境保持温暖并准备好立即响应。这在Serverless的成本效益和预置实例的性能可预测性之间提供了平衡。多模型端点（选项A）可能引入\"嘈杂邻居\"问题和延迟峰值，而异步推理（选项D）适用于长时间运行的工作负载，无法满足500毫秒以下的要求。"}, {"id": 102, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is developing a generative AI (GenAI) application that uses Amazon Bedrock foundation models. \nThe application has several custom tool integrations. The application has experienced unexpected token \nconsumption surges despite consistent user traffic. The company needs a solution that uses Amazon Bedrock model invocation logging to monitor \nInputTokenCount and OutputTokenCount metrics. The solution must detect unusual patterns in tool usage and \nidentify which specific tool integrations cause abnormal token consumption. The solution must also \nautomatically adjust thresholds as traffic patterns change. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在开发一个使用Amazon Bedrock基础模型的生成式AI（GenAI）应用程序。该应用程序具有多个自定义工具集成。尽管用户流量稳定，应用程序却遇到了意外的令牌消耗激增。公司需要一个使用Amazon Bedrock模型调用日志记录来监控InputTokenCount和OutputTokenCount指标的解决方案。该解决方案必须检测工具使用中的异常模式，并识别哪些特定的工具集成导致异常的令牌消耗。该解决方案还必须随着流量模式的变化自动调整阈值。哪种解决方案能满足这些要求？", "options_en": ["Use Amazon CloudWatch Logs to capture model invocation logs. Create CloudWatch dashboards for \ntoken metrics. Configure static CloudWatch alarms with fixed thresholds for each tool integration.", "Store model invocation logs in Amazon S3. Use AWS Glue and Amazon Athena to analyze token \nusage trends.", "Use Amazon CloudWatch Logs to capture model invocation logs. Create CloudWatch metric filters to \nextract tool-specific invocation patterns. Apply CloudWatch anomaly detection alarms that \nautomatically adjust baselines for each tool’s token metrics.", "Store model invocation logs in an Amazon S3 bucket. Use AWS Lambda to process logs in real time. \nManually update CloudWatch alarm thresholds based on trends identified by the Lambda function."], "options_zh": ["使用Amazon CloudWatch Logs捕获模型调用日志。为令牌指标创建CloudWatch仪表板。为每个工具集成配置具有固定阈值的静态CloudWatch告警。", "将模型调用日志存储在Amazon S3中。使用AWS Glue和Amazon Athena分析令牌使用趋势。", "使用Amazon CloudWatch Logs捕获模型调用日志。创建CloudWatch指标过滤器提取工具特定的调用模式。为每个工具的令牌指标应用自动调整基线的CloudWatch异常检测告警。", "将模型调用日志存储在Amazon S3存储桶中。使用AWS Lambda实时处理日志。根据Lambda函数识别出的趋势手动更新CloudWatch告警阈值。"], "a": "C", "explanation_en": "Option C best meets the requirements by combining native Amazon Bedrock logging with adaptive monitoring and minimal operational overhead. Amazon Bedrock model invocation logging can be sent directly to CloudWatch Logs, where detailed fields such as InputTokenCount, OutputTokenCount, and tool invocation metadata are captured for each request. CloudWatch metric filters allow extraction of structured metrics from logs, including tool-specific token consumption patterns. By defining filters per tool integration, the company can isolate which tools are responsible for increased token usage without building custom log-processing pipelines. CloudWatch anomaly detection provides automatic baseline modeling and dynamic thresholds based on historical traffic patterns. Unlike static alarms, anomaly detection adapts as usage evolves, making it ideal for applications with changing workloads or seasonal usage patterns. This directly satisfies the requirement to automatically adjust thresholds as traffic patterns change. When abnormal token consumption occurs, anomaly detection alarms trigger immediately, enabling rapid investigation and remediation. Because this solution uses fully managed AWS services without custom analytics jobs or manual threshold tuning, it significantly reduces operational effort. Option A fails to adapt to changing patterns. Option B introduces batch analysis and delayed insights. Option D requires manual intervention and custom code, increasing maintenance burden. Therefore, Option C provides the most scalable, adaptive, and low-maintenance solution for monitoring and controlling token consumption in Amazon Bedrock–based applications.", "explanation_zh": "选项C最能满足要求，结合了原生Amazon Bedrock日志记录与自适应监控以及最小运维开销。Amazon Bedrock模型调用日志记录可以直接发送到CloudWatch Logs，其中捕获每个请求的InputTokenCount、OutputTokenCount和工具调用元数据等详细字段。CloudWatch指标过滤器允许从日志中提取结构化指标，包括工具特定的令牌消耗模式。通过为每个工具集成定义过滤器，公司可以隔离哪些工具导致令牌使用增加，而无需构建自定义日志处理流水线。CloudWatch异常检测提供基于历史流量模式的自动基线建模和动态阈值。与静态告警不同，异常检测随着使用模式的变化而适应，非常适合具有变化工作负载或季节性使用模式的应用程序。这直接满足了随着流量模式变化自动调整阈值的要求。当发生异常令牌消耗时，异常检测告警立即触发，支持快速调查和修复。由于此解决方案使用完全托管的AWS服务，无需自定义分析作业或手动阈值调整，显著减少了运维工作量。选项A未能适应变化模式。选项B引入了批量分析和延迟洞察。选项D需要手动干预和自定义代码，增加了维护负担。因此，选项C为监控和控制基于Amazon Bedrock的应用程序中的令牌消耗提供了最可扩展、自适应和低维护的解决方案。"}, {"id": 103, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company is using Amazon Bedrock to develop an AI-powered application that uses a foundation model \n(FM) that supports cross-Region inference and provisioned throughput. The application must serve users in \nEurope and North America with consistently low latency. The application must comply with data residency \nregulations that require European user data to remain within Europe-based AWS Regions. During testing, the application experiences service degradation when Regional traffic spikes reach service \nquotas. The company needs a solution that maintains application resilience and minimizes operational \ncomplexity. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock开发一个AI驱动的应用程序，使用支持跨区域推理和预置吞吐量的基础模型（FM）。应用程序必须为欧洲和北美的用户提供持续的低延迟服务。应用程序必须遵守数据驻留法规，要求欧洲用户数据留在欧洲的AWS区域。在测试期间，当区域流量达到服务配额时，应用程序出现服务降级。公司需要一个能保持应用程序弹性并最小化运维复杂性的解决方案。哪种解决方案能满足这些要求？", "options_en": ["Deploy separate Amazon Bedrock instances in North American and European Regions. Use a custom \nrouting layer that directs traffic based on user location. Configure Amazon CloudWatch alarms to \nmonitor Regional service usage. Use Amazon SNS to send email alerts when usage approaches \nthresholds.", "Use Amazon Bedrock cross-Region inference profiles by specifying geographical codes in profile IDs \nwhen calling the InvokeModel API. Configure separate Amazon API Gateway HTTP APIs to direct \nEuropean and North American users to the appropriate Regional endpoints.", "Deploy a multi-Region Amazon API Gateway HTTP API and AWS Lambda functions that implement \nretry logic to handle throttling. Configure the Lambda functions to call the FM in the nearest secondary \nRegion when quotas are reached.", "Configure provisioned throughput for Amazon Bedrock in multiple Regions. Implement failover logic \nin application code to switch Regions when throttling occurs. Use AWS Global Accelerator to route \ntraffic based on user location."], "options_zh": ["在北美和欧洲区域部署独立的Amazon Bedrock实例。使用自定义路由层根据用户位置引导流量。配置Amazon CloudWatch告警监控区域服务使用情况。使用Amazon SNS在用量接近阈值时发送电子邮件告警。", "使用Amazon Bedrock跨区域推理配置文件，在调用InvokeModel API时在配置文件ID中指定地理代码。配置独立的Amazon API Gateway HTTP API将欧洲和北美用户引导到相应的区域端点。", "部署多区域Amazon API Gateway HTTP API和AWS Lambda函数，实现重试逻辑以处理限流。配置Lambda函数在达到配额时调用最近的次要区域中的FM。", "在多个区域配置Amazon Bedrock的预置吞吐量。在应用代码中实现故障转移逻辑，在发生限流时切换区域。使用AWS Global Accelerator根据用户位置路由流量。"], "a": "B", "explanation_en": "Option B is the most appropriate solution because it directly uses Amazon Bedrock cross-Region inference profiles, which are designed to provide resilience and load distribution while respecting data residency boundaries. Cross-Region inference profiles allow applications to distribute inference requests across multiple Regions within a defined geographic boundary, such as Europe or North America, without requiring custom failover logic. By specifying geographical codes in the inference profile ID, the application ensures that European user data is processed only within Europe-based Regions, satisfying regulatory requirements. At the same time, Bedrock automatically routes requests to healthy Regions within that geography when traffic spikes or service quotas are reached, improving availability and maintaining low latency. Using separate Amazon API Gateway HTTP APIs for Europe and North America provides a clean, simple routing layer that directs users to the appropriate regional inference profile. This avoids complex custom routing or retry logic in application code and minimizes operational overhead. Option A relies on custom routing and manual monitoring, which increases complexity and does not provide automatic resilience. Option C introduces custom retry and fallback logic that risks violating data residency requirements if misconfigured. Option D requires significant application-level failover logic and adds operational burden with Global Accelerator configuration. Therefore, Option B best meets the requirements for low latency, data residency compliance, resilience during traffic spikes, and minimal operational complexity.", "explanation_zh": "选项B是最合适的解决方案，因为它直接使用Amazon Bedrock跨区域推理配置文件，这些配置文件设计用于在尊重数据驻留边界的同时提供弹性和负载分布。跨区域推理配置文件允许应用程序在定义的区域边界内（如欧洲或北美）将推理请求分布到多个区域，无需自定义故障转移逻辑。通过在推理配置文件ID中指定地理代码，应用程序确保欧洲用户数据仅在欧洲区域内处理，满足法规要求。同时，当流量激增或达到服务配额时，Bedrock自动将请求路由到该地理区域内健康的区域，提高了可用性并保持低延迟。为欧洲和北美使用独立的Amazon API Gateway HTTP API提供了干净、简单的路由层，将用户引导到相应的区域推理配置文件。这避免了复杂的自定义路由或应用代码中的重试逻辑，最小化了运维开销。选项A依赖自定义路由和手动监控，增加了复杂性，不提供自动弹性。选项C引入了自定义重试和回退逻辑，如果配置不当可能违反数据驻留要求。选项D需要大量的应用程序级故障转移逻辑，并通过Global Accelerator配置增加了运维负担。因此，选项B最佳地满足了低延迟、数据驻留合规、流量激增时的弹性以及最小运维复杂性的要求。"}, {"id": 104, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A global healthcare company is deploying a GenAI application on Amazon Bedrock to produce treatment \nrecommendations. Regulations vary for each country where the company operates. Some countries require the company to retain all model inputs and outputs for 2 years. Other countries require the company to submit \ndata for local audits only. Medical providers require consistent medical terminology across all locations. \nHowever, the treatment recommendations that the model produces must adapt to local patient demographics. \nThe solution must also integrate with existing electronic health record (EHR) systems. The application must \nsupport up to 10,000 healthcare provider queries every day with sub-second response times. The company \nmust be able to review the application before deployments and approve of prompt changes. The application \nmust produce comprehensive logs for prompts, responses, and user context. Which solution will meet these \nrequirements? A. B. C. D.", "body_zh": "一家全球医疗保健公司正在Amazon Bedrock上部署一个GenAI应用程序，用于生成治疗建议。公司运营所在各国的法规各不相同。一些国家要求公司保留所有模型输入和输出2年。其他国家要求公司仅提交数据进行当地审计。医疗提供者要求在所有地点使用一致的医学术语。然而，模型生成的治疗建议必须适应当地患者的人口统计数据。该解决方案还必须与现有的电子健康记录（EHR）系统集成。应用程序必须每天支持最多10,000个医疗提供者查询，响应时间低于1秒。公司必须能够在部署前审查应用程序并批准提示变更。应用程序必须为提示、响应和用户上下文生成全面的日志。哪种解决方案能满足这些要求？", "options_en": ["Use AWS CloudTrail to log API calls. Create standard prompts in Amazon Bedrock Prompt \nManagement that include variables for patient demographics. Implement IAM policies to ensure that \nonly approves users can access prompts.", "Use Amazon CloudWatch Logs to collect detailed model invocation logs. Store the logs in Amazon S3. \nCreate parameterized prompts in Amazon Bedrock Prompt Management that include variables for \ntreatment options. Enable prompt versioning and set up an approval workflow.", "Create AWS Lambda functions to dynamically generate prompts that enforce clinical language \nrequirements. Use Amazon CloudWatch Logs to track model invocations. Use Amazon SQS queues to \nimplement a prompt approval workflow.", "Store prompt templates in Amazon S3. Use S3 Object Lock to implement version control. Use Amazon \nEventBridge to track model invocations. Use AWS Config to monitor changes to prompt templates."], "options_zh": ["使用AWS CloudTrail记录API调用。在Amazon Bedrock Prompt Management中创建标准提示，包含患者人口统计变量的变量。实施IAM策略确保只有批准的用户可以访问提示。", "使用Amazon CloudWatch Logs收集详细的模型调用日志。将日志存储在Amazon S3中。在Amazon Bedrock Prompt Management中创建参数化提示，包含治疗选项的变量。启用提示版本控制并设置审批工作流程。", "创建AWS Lambda函数动态生成提示，强制执行临床语言要求。使用Amazon CloudWatch Logs跟踪模型调用。使用Amazon SQS队列实现提示审批工作流程。", "将提示模板存储在Amazon S3中。使用S3 Object Lock实现版本控制。使用Amazon EventBridge跟踪模型调用。使用AWS Config监控提示模板的变更。"], "a": "B", "explanation_en": "This complex set of requirements is best addressed by . It allows the Amazon Bedrock Prompt Management creation of where variables (like demographics) can be injected at runtime, ensuring parameterized prompts consistent medical terminology while adapting recommendations to the specific patient. Prompt Management natively supports , which is a requirement for clinical safety and versioning and approval workflows compliance. For audit and retention, can be configured to send detailed Bedrock model invocation logging prompt and response data to . Storing these logs in S3 supports the 2-year retention requirement Amazon S3 and facilitates local audits. S3 is more cost-effective for long-term storage than CloudWatch Logs alone. CloudTrail (Option A) only logs management events, not the actual prompt/response content required for medical auditing.", "explanation_zh": "这一系列复杂的需求最好由Amazon Bedrock Prompt Management来解决。它允许创建参数化提示，其中变量（如人口统计数据）可以在运行时注入，确保一致的医学术语同时使建议适应当前患者。Prompt Management原生支持版本控制和审批工作流程，这是临床安全性和合规的要求。对于审计和保留，可以配置Bedrock模型调用日志记录将详细的提示和响应数据发送到Amazon CloudWatch Logs。将这些日志存储在Amazon S3中支持2年保留要求，并便于当地审计。对于长期存储，S3比单独的CloudWatch Logs更具成本效益。CloudTrail（选项A）仅记录管理事件，不记录医疗审计所需的实际提示/响应内容。"}, {"id": 105, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company deploys multiple Amazon Bedrock–based generative AI (GenAI) applications across multiple \nbusiness units for customer service, content generation, and document analysis. Some applications show \nunpredictable token consumption patterns. The company requires a comprehensive observability solution that \nprovides real-time visibility into token usage patterns across multiple models. The observability solution must \nsupport custom dashboards for multiple stakeholder groups and provide alerting capabilities for token \nconsumption across all the foundation models that the company’s applications use. Which combination of solutions will meet these requirements with the LEAST operational overhead? (Select \nTWO.) A. B. C. D. E.", "body_zh": "一家公司在多个业务部门部署了多个基于Amazon Bedrock的生成式AI（GenAI）应用程序，用于客户服务、内容生成和文档分析。一些应用程序表现出不可预测的令牌消耗模式。公司需要一个全面的可观测性解决方案，提供跨多个模型的令牌使用模式的实时可见性。该可观测性解决方案必须支持为多个利益相关者群体创建自定义仪表板，并为公司应用程序使用的所有基础模型提供令牌消耗的告警能力。哪两种解决方案的组合能以最少运维开销满足这些要求？（选择两个。）", "options_en": ["Use Amazon CloudWatch metrics as data sources to create custom Amazon QuickSight dashboards that \nshow token usage trends and usage patterns across FMs.", "Use CloudWatch Logs Insights to analyze Amazon Bedrock invocation logs for token consumption \npatterns and usage attribution by application. Create custom queries to identify high-usage scenarios. \nAdd log widgets to dashboards to enable continuous monitoring.", "Create custom Amazon CloudWatch dashboards that combine native Amazon Bedrock token and \ninvocation CloudWatch metrics. Set up CloudWatch alarms to monitor token usage thresholds.", "Create dashboards that show token usage trends and patterns across the company’s FMs by using an \nAmazon Bedrock zero-ETL integration with Amazon Managed Grafana.", "Implement Amazon EventBridge rules to capture Amazon Bedrock model invocation events. Route \ntoken usage data to Amazon OpenSearch Serverless by using Amazon Data Firehose. Use OpenSearch \ndashboards to analyze usage patterns."], "options_zh": ["使用Amazon CloudWatch指标作为数据源，创建自定义Amazon QuickSight仪表板，显示跨FM的令牌使用趋势和使用模式。", "使用CloudWatch Logs Insights分析Amazon Bedrock调用日志中的令牌消耗模式和应用归属。创建自定义查询识别高使用场景。向仪表板添加日志小部件以支持持续监控。", "创建自定义Amazon CloudWatch仪表板，结合原生的Amazon Bedrock令牌和调用CloudWatch指标。设置CloudWatch告警监控令牌使用阈值。", "通过Amazon Bedrock零ETL集成与Amazon Managed Grafana，创建显示公司FM令牌使用趋势和模式的仪表板。", "实施Amazon EventBridge规则捕获Amazon Bedrock模型调用事件。通过Amazon Data Firehose将令牌使用数据路由到Amazon OpenSearch Serverless。使用OpenSearch仪表板分析使用模式。"], "a": "C D", "explanation_en": "The combination of Options C and D delivers comprehensive, real-time observability for Amazon Bedrock workloads with the least operational overhead by relying on native integrations and managed services. Amazon Bedrock publishes built-in CloudWatch metrics for model invocations and token usage. Option C leverages these native metrics directly, allowing teams to build centralized CloudWatch dashboards without additional data pipelines or custom processing. CloudWatch alarms provide threshold-based alerting for token consumption, enabling proactive cost and usage control across all foundation models. This approach aligns with AWS guidance to use native service metrics whenever possible to reduce operational complexity. Option D complements CloudWatch by enabling advanced, stakeholder-specific visualizations through Amazon Managed Grafana. The zero-ETL integration allows Bedrock and CloudWatch metrics to be visualized directly in Grafana without building ingestion pipelines or managing storage layers. Grafana dashboards are particularly well suited for serving different audiences, such as engineering, finance, and product teams, each with customized views of token usage and trends. Option A introduces unnecessary complexity by adding a business intelligence layer that is better suited for historical analytics than real-time operational monitoring. Option B is useful for deep log analysis but requires query maintenance and does not provide efficient real-time dashboards at scale. Option E involves multiple services and custom data flows, significantly increasing operational overhead compared to native metric- based observability. By combining CloudWatch dashboards and alarms with Managed Grafana’s zero-ETL visualization capabilities, the company achieves real-time visibility, flexible dashboards, and automated alerting across all Amazon Bedrock foundation models with minimal operational effort.", "explanation_zh": "选项C和D的组合通过依赖原生集成和托管服务，以最少运维开销为Amazon Bedrock工作负载提供全面、实时的可观测性。Amazon Bedrock发布内置的CloudWatch指标用于模型调用和令牌使用。选项C直接利用这些原生指标，使团队无需额外数据流水线或自定义处理即可构建集中的CloudWatch仪表板。CloudWatch告警提供基于阈值的令牌消耗告警，支持跨所有基础模型的主动成本和用量控制。这种方法符合AWS关于尽可能使用原生服务指标以减少运维复杂性的指导。选项D通过Amazon Managed Grafana实现高级的、针对特定利益相关者的可视化，补充了CloudWatch。零ETL集成允许Bedrock和CloudWatch指标直接在Grafana中可视化，无需构建摄取流水线或管理存储层。Grafana仪表板特别适合服务于不同受众，如工程、财务和产品团队，每个团队都有定制化的令牌使用和趋势视图。选项A通过添加更适合历史分析而非实时运维监控的商业智能层引入了不必要的复杂性。选项B对深入日志分析很有用，但需要查询维护，且不能高效地提供大规模实时仪表板。选项E涉及多个服务和自定义数据流，与基于原生指标的可观测性相比显著增加了运维开销。通过结合CloudWatch仪表板和告警与Managed Grafana的零ETL可视化能力，公司以最小运维工作量实现了跨所有Amazon Bedrock基础模型的实时可见性、灵活仪表板和自动告警。"}, {"id": 106, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company uses AWS Lake Formation to set up a data lake that contains databases and tables for multiple \nbusiness units across multiple AWS Regions. The company wants to use a foundation model (FM) through Amazon Bedrock to perform fraud detection. The FM must ingest sensitive financial data from the data lake. \nThe data includes some customer personally identifiable information (PII). The company must design an access control solution that prevents PII from appearing in a production \nenvironment. The FM must access only authorized data subsets that have PII redacted from specific data \ncolumns. The company must capture audit trails for all data access. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司使用AWS Lake Formation建立一个数据湖，包含多个AWS区域中多个业务部门的数据库和表。公司希望通过Amazon Bedrock使用基础模型（FM）进行欺诈检测。FM必须从数据湖中摄取敏感的财务数据。数据包含一些客户的个人身份信息（PII）。公司必须设计一个访问控制解决方案，防止PII出现在生产环境中。FM只能访问经过授权的数据子集，且特定数据列中的PII已被删除。公司必须捕获所有数据访问的审计跟踪。哪种解决方案能满足这些要求？", "options_en": ["Create a separate dataset in a separate Amazon S3 bucket for each business unit and Region \ncombination. Configure S3 bucket policies to control access based on IAM roles that are assigned to \nFM training instances. Use S3 access logs to track data access.", "Configure the FM to authenticate by using AWS Identity and Access Management roles and Lake \nFormation permissions based on LF-Tag expressions. Define business units and Regions as LF-Tags \nthat are assigned to databases and tables. Use AWS CloudTrail to collect comprehensive audit trails of \ndata access.", "Use direct IAM principal grants on specific databases and tables in Lake Formation. Create a custom \napplication layer that logs access requests and further filters sensitive columns before sending data to \nthe FM.", "Configure the FM to request temporary credentials from AWS Security Token Service. Access the data \nby using presigned S3 URLs that are generated by an API that applies business unit and Regional \nfilters. Use AWS CloudTrail to collect comprehensive audit trails of data access."], "options_zh": ["为每个业务部门和区域的组合在单独的Amazon S3存储桶中创建单独的数据集。配置S3存储桶策略，基于分配给FM训练实例的IAM角色控制访问。使用S3访问日志跟踪数据访问。", "配置FM使用AWS Identity and Access Management角色和基于LF-Tag表达式的Lake Formation权限进行身份验证。将业务部门和区域定义为分配给数据库和表的LF-Tags。使用AWS CloudTrail收集数据访问的全面审计跟踪。", "在Lake Formation中使用直接的IAM主体授权到特定的数据库和表。创建自定义应用层，记录访问请求并在将数据发送到FM之前进一步过滤敏感列。", "配置FM从AWS Security Token Service请求临时凭证。通过使用应用业务部门和区域过滤器的API生成的预签名S3 URL访问数据。使用AWS CloudTrail收集数据访问的全面审计跟踪。"], "a": "B", "explanation_en": "Option B is the correct solution because it uses native AWS governance, access control, and auditing capabilities to protect PII while enabling controlled FM access to authorized data subsets. AWS Lake Formation is designed specifically to manage fine-grained permissions for data lakes, including column-level access control, which is critical when handling sensitive financial and PII data. LF-Tags allow data administrators to define scalable, attribute-based access control policies. By tagging databases, tables, and columns with business unit and Region metadata, the company can enforce policies that ensure the foundation model only accesses approved datasets with PII-redacted columns. This eliminates the risk of sensitive data leaking into production inference workflows. IAM role-based authentication ensures that the FM accesses data using least-privilege credentials. This integrates cleanly with Amazon Bedrock, which supports IAM-based authorization for service-to-service access. AWS CloudTrail provides immutable audit logs for all access attempts, satisfying compliance and regulatory requirements. Option A introduces unnecessary data duplication and weak governance controls. Option C relies on custom application logic, increasing operational risk and complexity. Option D bypasses Lake Formation’s fine- grained controls and relies on presigned URLs, which reduces governance visibility and control. Therefore, Option B best meets the requirements for security, compliance, scalability, and auditability when integrating Amazon Bedrock with a Lake Formation–governed data lake.", "explanation_zh": "选项B是正确的，因为它使用原生的AWS治理、访问控制和审计能力来保护PII，同时使FM能够受控访问授权的数据子集。AWS Lake Formation专门设计用于管理数据湖的细粒度权限，包括列级访问控制，这在处理敏感的财务和PII数据时至关重要。LF-Tags允许数据管理员定义可扩展的、基于属性的访问控制策略。通过使用业务部门和区域元数据标记数据库、表和列，公司可以强制策略确保基础模型仅访问经批准的数据集，且PII已删除的列。这消除了敏感数据泄漏到生产推理工作流程中的风险。基于IAM角色的身份验证确保FM使用最低权限凭证访问数据。这与Amazon Bedrock干净地集成，后者支持服务到服务访问的IAM授权。AWS CloudTrail为所有访问尝试提供不可变的审计日志，满足合规和法规要求。选项A引入了不必要的数据复制和薄弱的治理控制。选项C依赖自定义应用程序逻辑，增加了运维风险和复杂性。选项D绕过了Lake Formation的细粒度控制，依赖预签名URL，降低了治理可见性和控制力。因此，选项B在将Amazon Bedrock与Lake Formation管理的数据湖集成时，最能满足安全、合规、可扩展性和可审计性的要求。"}, {"id": 107, "exam": 1, "c": "foundation", "cn": "基础模型集成、数据管理和合规", "body_en": "A company is using Amazon Bedrock to develop an AI-powered application that uses a foundation model that \nsupports cross-Region inference and provisioned throughput. The application must serve users in Europe and \nNorth America with consistently low latency. The application must comply with data residency regulations \nthat require European user data to remain within Europe-based AWS Regions. During testing, the application experiences service degradation when Regional traffic spikes reach service \nquotas. The company needs a solution that maintains application resilience and minimizes operational \ncomplexity. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock开发一个AI驱动的应用程序，使用支持跨区域推理和预置吞吐量的基础模型。应用程序必须为欧洲和北美的用户提供持续的低延迟服务。应用程序必须遵守数据驻留法规，要求欧洲用户数据留在欧洲的AWS区域。在测试期间，当区域流量达到服务配额时，应用程序出现服务降级。公司需要一个能保持应用程序弹性并最小化运维复杂性的解决方案。哪种解决方案能满足这些要求？", "options_en": ["Deploy separate Amazon Bedrock instances in North American and European Regions. Use a custom \nrouting layer that directs traffic based on user location. Configure Amazon CloudWatch alarms to \nmonitor Regional service usage. Use Amazon SNS to send email alerts to the company when usage \napproaches specified thresholds.", "Use Amazon Bedrock cross-Region inference profiles by specifying geographical codes in profile IDs \nwhen the application calls the InvokeModel API. Configure separate Amazon API Gateway HTTP \nAPIs to direct European and North American users to the appropriate Regional endpoints.", "Deploy a multi-Region Amazon API Gateway HTTP API and AWS Lambda functions that implement \nretry logic to handle throttling. Configure the Lambda functions to call the foundation model in the \nnearest secondary Region when the application reaches service quotas in the primary Region. Use \nintelligent routing to ensure compliance with data residency requirements.", "Configure provisioned throughput for Amazon Bedrock in multiple Regions. Implement failover logic \nin the application code to switch between Regions when throttling occurs. Use AWS Global \nAccelerator to route traffic to the appropriate endpoints based on user location."], "options_zh": ["在北美和欧洲区域部署独立的Amazon Bedrock实例。使用自定义路由层根据用户位置引导流量。配置Amazon CloudWatch告警监控区域服务使用情况。使用Amazon SNS在用量接近指定阈值时向公司发送电子邮件告警。", "使用Amazon Bedrock跨区域推理配置文件，在应用程序调用InvokeModel API时在配置文件ID中指定地理代码。配置独立的Amazon API Gateway HTTP API将欧洲和北美用户引导到相应的区域端点。", "部署多区域Amazon API Gateway HTTP API和AWS Lambda函数，实现重试逻辑以处理限流。配置Lambda函数在应用程序在主区域达到服务配额时调用最近次要区域中的基础模型。使用智能路由确保符合数据驻留要求。", "在多个区域配置Amazon Bedrock的预置吞吐量。在应用代码中实现故障转移逻辑，在发生限流时切换区域。使用AWS Global Accelerator根据用户位置将流量路由到相应的端点。"], "a": "B", "explanation_en": "Option best meets the latency, resilience, and data residency requirements while keeping operational B complexity low by using built-in behavior through Amazon Bedrock cross-Region inference inference . Cross-Region inference profiles are designed to provide higher availability and better traffic profiles absorption when a single Region experiences throttling, transient capacity constraints, or quota-related degradation. By selecting the appropriate inference profile (for example, a Europe-scoped geography-scoped profile for European users and a North America-scoped profile for North American users), the application can keep inference traffic within the required geographic boundary. This directly supports EU data residency needs because European requests can be served only by Europe-based Regions while still benefiting from multi-Region resilience inside Europe. The question also highlights degradation when Regional traffic spikes hit quotas. Cross-Region inference profiles help mitigate these conditions by allowing Bedrock to serve requests from another Region within the same geography, improving continuity during spikes without requiring the company to implement custom retry-and-failover logic across Regions. This reduces development and operational burden compared to building and maintaining a bespoke routing and fallback system. Using separate to direct European and North American users to the Amazon API Gateway HTTP APIs correct endpoints simplifies request routing and provides a clean boundary for compliance controls, logging, and monitoring. It also allows each geography to scale independently and maintain consistently low latency by keeping users close to the entry point and the Bedrock geography they must use. Option requires custom routing and manual operational monitoring and does not inherently solve quota- A driven degradation. Option adds significant complexity by embedding throttling retries and cross-Region C selection logic in Lambda while still needing careful controls to prevent cross-border routing mistakes. Option introduces the highest operational complexity and can inadvertently violate residency if failover crosses D geographies unless additional safeguards are implemented.", "explanation_zh": "选项B通过使用Amazon Bedrock跨区域推理配置文件的推理内置行为，在保持低运维复杂性的同时最佳地满足延迟、弹性和数据驻留要求。跨区域推理配置文件设计用于在单个区域遇到限流、临时容量约束或配额相关降级时，提供更高的可用性和更好的流量吸收。通过选择合适的推理配置文件（例如，欧洲用户选择欧洲范围的地理配置文件，北美用户选择北美范围的配置文件），应用程序可以将推理流量保持在所需的地理边界内。这直接支持欧盟数据驻留需求，因为欧洲请求只能由欧洲区域服务，同时仍然受益于欧洲内部的多区域弹性。问题还强调了当区域流量达到配额时的降级问题。跨区域推理配置文件有助于缓解这些情况，允许Bedrock在同一地理区域内从另一个区域服务请求，在流量激增期间提高连续性，而无需公司实现自定义跨区域重试和故障转移逻辑。这相比构建和维护定制的路由和回退系统减少了开发和运维负担。使用独立的Amazon API Gateway HTTP API将欧洲和北美用户引导到正确的端点简化了请求路由，并为合规控制、日志记录和监控提供了清晰的边界。它还允许每个地理区域独立扩展，并通过保持用户靠近入口点和必须使用的Bedrock地理区域来保持持续的低延迟。选项A需要自定义路由和手动运维监控，不能从根本上解决配额驱动的降级问题。选项C通过在Lambda中嵌入限重重试和跨区域选择逻辑增加了显著复杂性，而……"}, {"id": 108, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company is developing a generative AI (GenAI) application by using Amazon Bedrock. The application \nwill analyze patterns and relationships in the company’s data. The application will process millions of new \ndata points daily across AWS Regions in Europe, North America, and Asia before storing the data in Amazon \nS3. The application must comply with local data protection and storage regulations. Data residency and \nprocessing must occur within the same continent. The application must also maintain audit trails of the \napplication’s decision-making processes and provide data classification capabilities. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在使用Amazon Bedrock开发一个生成式AI（GenAI）应用程序。该应用程序将分析公司数据中的模式和关系。应用程序将每天处理数百万个新数据点，覆盖欧洲、北美和亚洲的AWS区域，然后将数据存储在Amazon S3中。应用程序必须遵守当地的数据保护和存储法规。数据驻留和处理必须发生在同一大洲内。应用程序还必须维护其决策过程的审计跟踪，并提供数据分类能力。哪种解决方案能满足这些要求？", "options_en": ["Deploy the application in each Region with local IAM policies. Use Amazon Bedrock cross-Region \ninference to distribute the workload. Use Amazon CloudWatch to log AI decision-making processes. \nManually track compliance certifications across Regions.", "Use SCPs with AWS Organizations to manage location-specific permissions. Use AWS CloudTrail \nimmutable logs to audit decision-making processes. Import a custom model into Amazon Bedrock and \ndeploy the model to each Region.", "Use Amazon S3 Object Lock with Region-specific S3 bucket policies. Pre-process the data points \nwithin the Region based on geographic origin before sending the data points to Amazon Bedrock. Use \nAmazon Macie to classify the data. Use AWS CloudTrail immutable logs to audit the decision-making \nprocesses.", "Create separate AWS accounts for each Region with individual compliance frameworks. Use Amazon \nSageMaker AI with custom monitoring. Create manual compliance reports for each regulatory \njurisdiction."], "options_zh": ["在每个区域部署应用程序，并配置本地IAM策略。使用Amazon Bedrock跨区域推理分布工作负载。使用Amazon CloudWatch记录AI决策过程。手动跟踪各区域的合规认证。", "使用AWS Organizations的SCP管理特定位置的权限。使用AWS CloudTrail不可变日志审计决策过程。将自定义模型导入Amazon Bedrock并部署到每个区域。", "使用Amazon S3 Object Lock和特定区域的S3存储桶策略。在将数据点发送到Amazon Bedrock之前，根据地理来源在区域内预处理数据点。使用Amazon Macie对数据进行分类。使用AWS CloudTrail不可变日志审计决策过程。", "为每个区域创建独立的AWS账户，配置各自的合规框架。使用Amazon SageMaker AI和自定义监控。为每个监管辖区创建手动合规报告。"], "a": "C", "explanation_en": "This scenario requires strict data residency, regional processing, classification, and auditable decision trails, which Option C addresses using AWS-native governance services. Region-specific Amazon S3 buckets enforce geographic data boundaries. Amazon S3 Object Lock ensures immutability of stored data and logs, supporting regulatory retention and non-repudiation requirements. Pre- processing data within the same Region before invoking Amazon Bedrock ensures that inference and data handling do not cross continental boundaries. Amazon Macie provides managed, automated data classification for sensitive data types such as PII and financial records, fulfilling the classification requirement without custom tooling. AWS CloudTrail immutable logs provide comprehensive audit trails of all API calls, model invocations, and data access events, ensuring traceability of AI decision-making processes. Option A violates residency rules through cross-Region inference. Option B does not provide data classification. Option D introduces high operational overhead and relies on manual compliance reporting. Therefore, Option C is the most compliant, scalable, and operationally efficient solution for regionally governed GenAI workloads.", "explanation_zh": "此场景要求严格的数据驻留、区域处理、分类和可审计的决策轨迹，选项C使用AWS原生治理服务满足了这些要求。特定区域的Amazon S3存储桶强制地理数据边界。Amazon S3 Object Lock确保存储数据和日志的不可变性，支持法规保留和不可否认性要求。在调用Amazon Bedrock之前在同一区域内预处理数据，确保推理和数据操作不跨越大陆边界。Amazon Macie提供托管的自动化数据分类功能，用于识别敏感数据类型（如PII和财务记录），无需自定义工具即可满足分类要求。AWS CloudTrail不可变日志为所有API调用、模型调用和数据访问事件提供全面的审计跟踪，确保AI决策过程的可追溯性。选项A通过跨区域推理违反数据驻留规则。选项B不提供数据分类。选项D引入高运维开销，依赖手动合规报告。因此，选项C是区域受管GenAI工作负载中最合规、可扩展和运维高效的解决方案。"}, {"id": 109, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company has deployed an AI assistant as a React application that uses AWS Amplify, an AWS AppSync \nGraphQL API, and Amazon Bedrock Knowledge Bases. The application uses the GraphQL API to call the \nAmazon Bedrock RetrieveAndGenerate API for knowledge base interactions. The company configures an \nAWS Lambda resolver to use the RequestResponse invocation type. Application users report frequent timeouts and slow response times. Users report these problems more \nfrequently for complex questions that require longer processing. The company needs a solution to fix these performance issues and enhance the user experience. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司已将AI助手部署为使用AWS Amplify、AWS AppSync GraphQL API和Amazon Bedrock Knowledge Bases的React应用程序。该应用程序使用GraphQL API调用Amazon Bedrock RetrieveAndGenerate API进行知识库交互。公司配置了AWS Lambda解析器，使用RequestResponse调用类型。用户频繁报告超时和响应速度慢的问题。对于需要更长时间处理的复杂问题，用户报告这些问题更频繁。公司需要一个解决方案来修复这些性能问题并改善用户体验。哪种解决方案能满足这些要求？", "options_en": ["Use AWS Amplify AI Kit to implement streaming responses from the GraphQL API and to optimize \nclient-side rendering.", "Increase the timeout value of the Lambda resolver. Implement retry logic with exponential backoff.", "Update the application to send an API request to an Amazon SQS queue. Update the AWS AppSync \nresolver to poll and process the queue.", "Change the RetrieveAndGenerate API to the InvokeModelWithResponseStream API. Update the \napplication to use an Amazon API Gateway WebSocket API to support the streaming response."], "options_zh": ["使用AWS Amplify AI Kit从GraphQL API实现流式响应，并优化客户端渲染。", "增加Lambda解析器的超时值。实现带指数退避的重试逻辑。", "更新应用程序，向Amazon SQS队列发送API请求。更新AWS AppSync解析器轮询和处理队列。", "将RetrieveAndGenerate API更改为InvokeModelWithResponseStream API。更新应用程序使用Amazon API Gateway WebSocket API支持流式响应。"], "a": "A", "explanation_en": "Option is the best solution because it directly addresses both observed problems: user-perceived latency and A resolver timeouts that occur more frequently for complex prompts. In the current design, an AWS AppSync Lambda resolver is configured with synchronous RequestResponse behavior. That means the client receives nothing until the entire retrieval and generation workflow completes. For longer-running knowledge base queries, this increases the likelihood of hitting request time limits in the synchronous path and creates a poor user experience because the UI appears stalled. Using to implement allows the application to return partial AWS Amplify AI Kit streaming responses output incrementally as the model produces tokens. This improves perceived responsiveness because users can see the answer forming immediately, even when the full response takes longer. Streaming also reduces the impact of variable model latency and retrieval time because the client no longer waits for a single final payload before rendering content. From a troubleshooting perspective, streaming makes it easier to distinguish “slow generation” from “no response,” and it provides faster feedback during testing of complex questions. Option is not sufficient because increasing timeouts and adding retries can worsen load and cost while still B producing a stalled UI experience. Retries also risk duplicating requests to the knowledge base and can amplify token usage. Option introduces an awkward polling model for GraphQL interactions and adds C significant operational complexity, while not inherently improving interactivity. Option adds major D architectural changes by replacing the knowledge base RetrieveAndGenerate call path with a different streaming invocation API and introducing a WebSocket layer, which is unnecessary when the goal is primarily to fix timeouts and improve UX within the existing AppSync and Amplify design. Therefore, streaming through Amplify AI Kit is the most effective and lowest-friction improvement. Thought for 24s", "explanation_zh": "选项A是最佳解决方案，因为它直接解决了观察到的两个问题：用户感知的延迟和解析器超时，这些在复杂提示时更频繁发生。在当前设计中，AWS AppSync Lambda解析器配置为同步的RequestResponse行为。这意味着客户端在整个检索和生成工作流程完成之前不会收到任何内容。对于运行时间较长的知识库查询，这增加了在同步路径中达到请求时间限制的可能性，并创造了糟糕的用户体验，因为用户界面看起来停滞了。使用AWS Amplify AI Kit实现流式响应允许应用程序在模型生成令牌时增量返回部分输出。这改善了感知响应性，因为用户即使完整响应需要更长时间，也可以立即看到答案正在形成。流式传输还减轻了可变模型延迟和检索时间的影响，因为客户端不再需要等待单个最终负载后再渲染内容。从故障排除的角度来看，流式传输使得更容易区分\"生成缓慢\"和\"无响应\"，并在测试复杂问题时提供更快的反馈。选项B不足，因为增加超时和添加重试可能使负载和成本恶化，同时仍产生停滞的用户界面体验。重试还有重复知识库请求的风险，可能放大令牌使用。选项C为GraphQL交互引入了一种笨拙的轮询模型，增加了显著的运维复杂性，同时并未固有地改善交互性。选项D通过用不同的流式推理API替换知识库RetrieveAndGenerate调用路径并引入WebSocket层，增加了重大的架构变更，而当目标主要是修复超时和改善现有AppSync和Amplify设计中的用户体验时，这是不必要的。因此，通过Amplify AI Kit实现流式传输是最有效的……"}, {"id": 110, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company has a recommendation system running on Amazon EC2 instances. The applications make API \ncalls to Amazon Bedrock foundation models (FMs) to analyze customer behavior and generate personalized \nproduct recommendations. The system experiences intermittent issues where some recommendations do not match customer preferences. \nThe company needs an observability solution to monitor operational metrics and detect patterns of \nperformance degradation compared to established baselines. The solution must generate alerts with \ncorrelation data within 10 minutes when FM behavior deviates from expected patterns. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司有一个运行在Amazon EC2实例上的推荐系统。应用程序调用Amazon Bedrock基础模型（FM）的API来分析客户行为并生成个性化产品推荐。系统经历间歇性问题，一些推荐与客户偏好不匹配。公司需要一个可观测性解决方案来监控运维指标，并检测与已建立基线相比的性能退化模式。当FM行为偏离预期模式时，该解决方案必须在10分钟内生成带有相关性数据的告警。哪种解决方案能满足这些要求？", "options_en": ["Configure Amazon CloudWatch Container Insights. Set up alarms for latency thresholds. Add custom \ntoken metrics using the CloudWatch embedded metric format.", "Implement AWS X-Ray. Enable CloudWatch Logs Insights. Set up AWS CloudTrail and create \ndashboards in Amazon QuickSight.", "Enable Amazon CloudWatch Application Insights. Create custom metrics for recommendation quality, \ntoken usage, and response latency using the CloudWatch embedded metric format with dimensions for \nrequest types and user segments. Configure CloudWatch anomaly detection on model metrics. Use \nCloudWatch Logs Insights for pattern analysis.", "Use Amazon OpenSearch Service with the Observability plugin. Ingest metrics and logs through \nAmazon Kinesis and analyze behavior with custom queries."], "options_zh": ["配置Amazon CloudWatch Container Insights。设置延迟阈值的告警。使用CloudWatch嵌入式指标格式添加自定义令牌指标。", "实施AWS X-Ray。启用CloudWatch Logs Insights。设置AWS CloudTrail并在Amazon QuickSight中创建仪表板。", "启用Amazon CloudWatch Application Insights。创建推荐质量、令牌使用量和响应延迟的自定义指标，使用CloudWatch嵌入式指标格式，包含请求类型和用户分段的维度。对模型指标配置CloudWatch异常检测。使用CloudWatch Logs Insights进行模式分析。", "使用带有可观测性插件的Amazon OpenSearch Service。通过Amazon Kinesis摄取指标和日志，使用自定义查询分析行为。"], "a": "C", "explanation_en": "Option C best satisfies the requirement for rapid, correlated detection of model-related performance degradation. Amazon CloudWatch Application Insights provides automated observability across application components running on Amazon EC2, identifying abnormal behavior patterns without requiring extensive manual configuration. Using custom metrics for recommendation quality, token usage, and response latency allows the company to directly monitor FM behavior, not just infrastructure health. Applying dimensions such as request type and user segment enables fine-grained correlation between performance issues and specific customer interactions or workloads. CloudWatch anomaly detection is critical because it establishes dynamic baselines from historical data and detects deviations automatically. This enables alerts to be generated within minutes when FM behavior changes unexpectedly, satisfying the 10-minute alerting requirement without static thresholds that can miss subtle degradations. CloudWatch Logs Insights complements metrics by enabling rapid analysis of log patterns, error messages, or unusual request flows associated with degraded recommendations. Because all data remains within CloudWatch, correlation between metrics, logs, and alerts is straightforward and operationally efficient. Option A focuses on infrastructure metrics and lacks behavioral baselining. Option B provides tracing but not automated anomaly detection. Option D adds significant operational overhead and ingestion complexity for a use case already well supported by CloudWatch-native features. Therefore, Option C delivers the most effective, scalable, and low-overhead observability solution for detecting FM-related performance deviations.", "explanation_zh": "选项C最能满足快速、相关检测模型相关性能退化的要求。Amazon CloudWatch Application Insights为运行在Amazon EC2上的应用组件提供自动可观测性，无需大量手动配置即可识别异常行为模式。使用推荐质量、令牌使用量和响应延迟的自定义指标，使公司能够直接监控FM行为，而不仅仅是基础设施健康。应用请求类型和用户分段等维度，可以在性能问题与特定客户交互或工作负载之间实现精细关联。CloudWatch异常检测至关重要，因为它从历史数据建立动态基线并自动检测偏差。这使得当FM行为意外变化时，可以在几分钟内生成告警，满足10分钟告警要求，而使用静态阈值可能漏掉细微的退化。CloudWatch Logs Insights通过快速分析日志模式、错误消息或与推荐质量下降相关的异常请求流来补充指标。由于所有数据保留在CloudWatch中，指标、日志和告警之间的关联直接且运维高效。选项A侧重于基础设施指标，缺乏行为基线化。选项B提供跟踪但不提供自动异常检测。选项D为此用例增加了显著的运维开销和摄取复杂性，而CloudWatch原生功能已经很好地支持。因此，选项C为检测FM相关性能偏差提供了最有效、可扩展和低开销的可观测性解决方案。"}, {"id": 111, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company has a generative AI (GenAI) application that uses Amazon Bedrock to provide real-time \nresponses to customer queries. The company has noticed intermittent failures with API calls to foundation \nmodels (FMs) during peak traffic periods. The company needs a solution to handle transient errors and provide detailed observability into FM \nperformance. The solution must prevent cascading failures during throttling events and provide distributed \ntracing across service boundaries to identify latency contributors. The solution must also enable correlation of \nperformance issues with specific FM characteristics. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司有一个使用Amazon Bedrock为客户查询提供实时响应的生成式AI（GenAI）应用程序。公司注意到在高峰流量期间，对基础模型（FM）的API调用出现间歇性故障。公司需要一个解决方案来处理瞬态错误，并为FM性能提供详细的可观测性。该解决方案必须防止限流事件期间的级联故障，并提供跨服务边界的分布式跟踪以识别延迟贡献因素。该解决方案还必须能够将性能问题与特定的FM特征相关联。哪种解决方案能满足这些要求？", "options_en": ["Implement a custom retry mechanism with a fixed delay of 1 second between retries. Configure \nAmazon CloudWatch alarms to monitor the application’s error rates and latency metrics.", "Configure the AWS SDK with standard retry mode and exponential backoff with jitter. Use AWS X-\nRay tracing with annotations to identify and filter service components.", "Implement client-side caching of all FM responses. Add custom logging statements in the application \ncode to record API call durations.", "Configure the AWS SDK with adaptive retry mode. Use AWS CloudTrail distributed tracing to monitor \nthrottling events."], "options_zh": ["实现自定义重试机制，重试之间固定延迟1秒。配置Amazon CloudWatch告警监控应用程序的错误率和延迟指标。", "配置AWS SDK使用标准重试模式和带抖动的指数退避。使用AWS X-Ray跟踪，配合注释来识别和过滤服务组件。", "实现所有FM响应的客户端缓存。在应用代码中添加自定义日志语句记录API调用时长。", "配置AWS SDK使用自适应重试模式。使用AWS CloudTrail分布式跟踪监控限流事件。"], "a": "B", "explanation_en": "Option B best meets the combined resiliency and observability requirements because it applies AWS- recommended retry behavior for transient throttling and enables true distributed tracing across service boundaries. During peak traffic, intermittent failures are commonly caused by throttling and other transient conditions. The AWS SDK standard retry mode provides exponential backoff with jitter, which reduces synchronized retry storms, prevents cascading failures, and improves overall system stability. Jitter is important because it spreads retry attempts over time, reducing load amplification during throttling events. For observability, AWS X-Ray provides distributed tracing that follows a request across components such as API Gateway or load balancers, application services, and downstream calls to Amazon Bedrock. X-Ray can identify where latency is being introduced and which downstream call is contributing most to end-to-end response time. This is required to “identify latency contributors” and isolate performance issues under load. The requirement also states that the company must correlate performance issues with specific FM characteristics. X-Ray annotations are designed for this purpose: the application can annotate traces with the model ID, inference parameters, region, or inference profile used. This enables filtering and analysis (for example, comparing latency or error patterns by model, parameter set, or endpoint configuration) without building a separate telemetry system. Option A’s fixed-delay retries increase synchronized retry behavior and do not provide distributed tracing. Option C does not prevent cascading failures and cannot provide cross-service tracing. Option D is incorrect because CloudTrail is an audit logging service and does not provide distributed tracing for request latency analysis. Therefore, Option B provides the correct combination of resilient retries and deep, model-correlated distributed observability for Amazon Bedrock workloads.", "explanation_zh": "选项B最能满足弹性和可观测性的综合要求，因为它应用了AWS推荐的瞬时限流失效的重试行为，并实现了真正的跨服务边界分布式跟踪。在高峰流量期间，间歇性故障通常由限流和其他瞬态条件引起。AWS SDK标准重试模式提供带抖动的指数退避，减少了同步重试风暴，防止级联故障，提高了整体系统稳定性。抖动很重要，因为它随时间分散重试尝试，减少限流事件期间负载放大。对于可观测性，AWS X-Ray提供分布式跟踪，跟踪请求通过组件（如API Gateway或负载均衡器）、应用程序服务和下游Amazon Bedrock调用。X-Ray可以识别延迟在何处被引入，以及哪个下游调用对端到端响应时间贡献最大。这对于\"识别延迟贡献因素\"和隔离负载下的性能问题是必需的。需求还要求公司能将性能问题与特定的FM特征相关联。X-Ray注释正是为此目的设计的：应用程序可以用模型ID、推理参数、区域或推理配置文件注释跟踪。这使得无需构建单独的遥测系统即可进行过滤和分析（例如，按模型、参数集或端点配置比较延迟或错误模式）。选项A的固定延迟重试增加了同步重试行为，不提供分布式跟踪。选项C不能防止级联故障，也不能提供跨服务跟踪。选项D不正确，因为CloudTrail是审计日志服务，不提供用于请求延迟分析的分布式跟踪。因此，选项B为Amazon Bedrock工作负载提供了弹性重试和深度、与模型相关的分布式可观测性的正确组合……"}, {"id": 112, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A financial services company wants to use Amazon Bedrock foundation models (FMs) to analyze call center \nrecordings. When calls end, the call center stores recordings as MP3 files in an Amazon S3 bucket. The \ncompany needs to generate summaries and sentiment analysis for the recordings in a structured format as soon \nas new files are created. The recordings average 20 MB in size. Which combination of solutions will meet \nthese requirements? (Select TWO.) A. B. C. D. E.", "body_zh": "一家金融服务公司希望使用Amazon Bedrock基础模型（FM）分析呼叫中心录音。通话结束后，呼叫中心将录音以MP3文件格式存储在Amazon S3存储桶中。公司需要在创建新文件后立即以结构化格式生成录音的摘要和情感分析。录音平均大小为20 MB。哪两种解决方案的组合能满足这些要求？（选择两个。）", "options_en": ["Use AWS Step Functions to orchestrate a workflow to process the recordings. Configure steps to \ninvoke Amazon Transcribe to convert audio to text, validate job completion, and to invoke an AWS \nLambda function to process the text by using Amazon Bedrock FMs to generate structured analysis \noutput.", "Use AWS Step Functions to orchestrate a workflow to process the recordings. Configure steps to \ninvoke Amazon Transcribe to convert audio to text, validate job completion, and to directly invoke \nAmazon Bedrock FMs to generate summaries and sentiment analysis in JSON format.", "Use AWS Step Functions to orchestrate a workflow to process the recordings. Configure steps to \ninvoke Amazon Transcribe to convert audio to text, validate job completion, and to invoke an AWS \nLambda function to create a prompt to invoke Amazon Bedrock FMs to generate structured analysis \noutput.", "Configure the source S3 bucket to send events to Amazon EventBridge. Create an EventBridge rule to \ninvoke the Step Functions workflow when an object is created in the bucket.", "Configure the source S3 bucket to send notifications to the Step Functions workflow when an object is \ncreated in the bucket."], "options_zh": ["使用AWS Step Functions编排工作流程处理录音。配置步骤调用Amazon Transcribe将音频转换为文本，验证任务完成，并调用AWS Lambda函数使用Amazon Bedrock FM处理文本以生成结构化分析输出。", "使用AWS Step Functions编排工作流程处理录音。配置步骤调用Amazon Transcribe将音频转换为文本，验证任务完成，并直接调用Amazon Bedrock FM生成JSON格式的摘要和情感分析。", "使用AWS Step Functions编排工作流程处理录音。配置步骤调用Amazon Transcribe将音频转换为文本，验证任务完成，并调用AWS Lambda函数创建提示以调用Amazon Bedrock FM生成结构化分析输出。", "配置源S3存储桶向Amazon EventBridge发送事件。创建EventBridge规则，在存储桶中创建对象时调用Step Functions工作流程。", "配置源S3存储桶在存储桶中创建对象时向Step Functions工作流程发送通知。"], "a": "B D", "explanation_en": "provides native service integrations that minimize code and operational overhead. For AWS Step Functions this workflow, Step Functions can directly invoke and, upon completion, directly invoke Amazon Transcribe foundation models. Modern foundation models can be prompted to return outputs in Amazon Bedrock JSON , fulfilling the requirement for structured analysis without needing an intermediate Lambda function to format format the request or response. To trigger the process \"as soon as new files are created,\" configuring Amazon is the recommended event-driven pattern. This allows for fine- S3 to send events to Amazon EventBridge grained routing and decouples the storage layer from the processing logic, ensuring the workflow scales reliably as call volume grows.", "explanation_zh": "选项B和D的组合提供了最少的代码和运维开销。对于此工作流程，AWS Step Functions提供原生服务集成。Step Functions可以直接调用Amazon Transcribe，并在完成后直接调用Amazon Bedrock基础模型。现代基础模型可以被提示以JSON格式返回输出，满足结构化分析的要求，而无需中间Lambda函数格式化请求或响应。为了\"在新文件创建后立即\"触发流程，配置Amazon S3向Amazon EventBridge发送事件是推荐的事件驱动模式。这允许精细的路由，并将存储层与处理逻辑解耦，确保工作流程随着呼叫量增长可靠扩展。"}, {"id": 113, "exam": 1, "c": "testing", "cn": "测试、验证与故障排除", "body_en": "A company has a customer service application that uses Amazon Bedrock to generate personalized responses \nto customer inquiries. The company needs to establish a quality assurance process to evaluate prompt \neffectiveness and model configurations across updates. The process must automatically compare outputs from \nmultiple prompt templates, detect response quality issues, provide quantitative metrics, and allow human \nreviewers to give feedback on responses. The process must prevent configurations that do not meet a \npredefined quality threshold from being deployed. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司有一个使用Amazon Bedrock生成客户查询个性化响应的客户服务应用程序。公司需要建立一个质量保证流程，跨更新评估提示有效性和模型配置。该流程必须自动比较多个提示模板的输出，检测响应质量问题，提供定量指标，并允许人工审核人员对响应提供反馈。该流程必须防止未达到预定义质量阈值的配置被部署。哪种解决方案能满足这些要求？", "options_en": ["Create an AWS Lambda function that sends sample customer inquiries to multiple Amazon Bedrock \nmodel configurations and stores responses in Amazon S3. Use Amazon QuickSight to visualize \nresponse patterns. Manually review outputs daily. Use AWS CodePipeline to deploy configurations that \nmeet the quality threshold.", "Use Amazon Bedrock evaluation jobs to compare model outputs by using custom prompt datasets. \nConfigure AWS CodePipeline to run the evaluation jobs when prompt templates change. Configure \nCodePipeline to deploy only configurations that exceed the predefined quality threshold.", "Set up Amazon CloudWatch alarms to monitor response latency and error rates from Amazon Bedrock. \nUse Amazon EventBridge rules to notify teams when thresholds are exceeded. Configure a manual \napproval workflow in AWS Systems Manager.", "Use AWS Lambda functions to create an automated testing framework that samples production traffic \nand routes duplicate requests to the updated model version. Use Amazon Comprehend sentiment \nanalysis to compare results. Block deployment if sentiment scores decrease."], "options_zh": ["创建AWS Lambda函数，将示例客户查询发送到多个Amazon Bedrock模型配置，并将响应存储在Amazon S3中。使用Amazon QuickSight可视化响应模式。每日手动审查输出。使用AWS CodePipeline部署达到质量阈值的配置。", "使用Amazon Bedrock评估任务比较模型输出，使用自定义提示数据集。配置AWS CodePipeline在提示模板更改时运行评估任务。配置CodePipeline仅部署超过预定义质量阈值的配置。", "设置Amazon CloudWatch告警监控Amazon Bedrock的响应延迟和错误率。使用Amazon EventBridge规则在超过阈值时通知团队。在AWS Systems Manager中配置手动审批工作流程。", "使用AWS Lambda函数创建自动化测试框架，采样生产流量并将重复请求路由到更新后的模型版本。使用Amazon Comprehend情感分析比较结果。如果情感分数下降则阻止部署。"], "a": "B", "explanation_en": "Option B is the correct solution because Amazon Bedrock evaluation jobs are purpose-built to assess prompt effectiveness, model behavior, and response quality in a repeatable and automated manner. Evaluation jobs support both quantitative metrics and LLM-based judgment, making them suitable for detecting subtle response quality regressions that simple sentiment or latency metrics cannot capture. By using custom prompt datasets, the company can consistently test multiple prompt templates and model configurations against the same inputs. This enables accurate comparison across updates and eliminates variability introduced by live traffic sampling. Amazon Bedrock evaluation jobs also support structured scoring outputs, which can be used to enforce objective quality thresholds. Integrating evaluation jobs directly into AWS CodePipeline ensures that quality checks are automatically triggered whenever prompt templates or configurations change. This creates a gated deployment workflow in which only configurations that meet or exceed the predefined quality threshold are promoted. This directly satisfies the requirement to prevent low-quality configurations from being deployed. Human reviewers can be incorporated by reviewing evaluation results and scores produced by the jobs, enabling informed feedback without manual data collection. Option A and D rely on custom frameworks and indirect quality signals, increasing complexity and reducing reliability. Option C focuses on operational health rather than response quality. Therefore, Option B provides the most robust, scalable, and AWS-aligned quality assurance process for Amazon Bedrock–based applications.", "explanation_zh": "选项B是正确的，因为Amazon Bedrock评估任务专为以可重复、自动化的方式评估提示有效性、模型行为和响应质量而设计。评估任务支持定量指标和基于LLM的判断，使其适合检测简单情感或延迟指标无法捕捉的细微响应质量退化。通过使用自定义提示数据集，公司可以一致地测试多个提示模板和模型配置对同一输入的响应。这实现了跨更新的准确比较，消除了实时流量采样引入的变异性。Amazon Bedrock评估任务还支持结构化评分输出，可用于强制执行客观质量阈值。将评估任务直接集成到AWS CodePipeline中确保每当提示模板或配置更改时自动触发质量检查。这创建了一个门控部署工作流程，只有达到或超过预定义质量阈值的配置才会被推送。这直接满足了防止低质量配置被部署的要求。人工审核人员可以通过审查评估任务产生的结果和分数来参与，实现无需手动数据收集的知情反馈。选项A和D依赖自定义框架和间接质量信号，增加了复杂性并降低了可靠性。选项C侧重于运维健康而非响应质量。因此，选项B为基于Amazon Bedrock的应用程序提供了最健壮、可扩展且符合AWS标准的质量保证流程。"}, {"id": 114, "exam": 1, "c": "safety", "cn": "AI安全、安全性与治理", "body_en": "A company uses AWS Lambda functions to build an AI agent solution. A GenAI developer must set up a \nModel Context Protocol (MCP) server that accesses user information. The GenAI developer must also \nconfigure the AI agent to use the new MCP server. The GenAI developer must ensure that only authorized \nusers can access the MCP server. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司使用AWS Lambda函数构建AI代理解决方案。一位GenAI开发人员必须设置一个访问用户信息的Model Context Protocol（MCP）服务器。该GenAI开发人员还必须配置AI代理使用新的MCP服务器。该GenAI开发人员必须确保只有授权用户可以访问MCP服务器。哪种解决方案能满足这些要求？", "options_en": ["Use a Lambda function to host the MCP server. Grant the AI agent Lambda functions permission to \ninvoke the Lambda function that hosts the MCP server. Configure the AI agent’s MCP client to invoke \nthe MCP server asynchronously.", "Use a Lambda function to host the MCP server. Grant the AI agent Lambda functions permission to \ninvoke the Lambda function that hosts the MCP server. Configure the AI agent to use the STDIO \ntransport with the MCP server.", "Use a Lambda function to host the MCP server. Create an Amazon API Gateway HTTP API that \nproxies requests to the Lambda function. Configure the AI agent solution to use the Streamable HTTP \ntransport to make requests through the HTTP API. Use Amazon Cognito to enforce OAuth 2.1.", "Use a Lambda layer to host the MCP server. Add the Lambda layer to the AI agent Lambda functions. \nConfigure the agentic AI solution to use the STDIO transport to send requests to the MCP server. In the \nAI agent’s MCP configuration, specify the Lambda layer ARN as the command. Specify the user \ncredentials as environment variables."], "options_zh": ["使用Lambda函数托管MCP服务器。授予AI代理Lambda函数调用托管MCP服务器的Lambda函数的权限。配置AI代理的MCP客户端异步调用MCP服务器。", "使用Lambda函数托管MCP服务器。授予AI代理Lambda函数调用托管MCP服务器的Lambda函数的权限。配置AI代理使用STDIO传输与MCP服务器通信。", "使用Lambda函数托管MCP服务器。创建Amazon API Gateway HTTP API代理请求到Lambda函数。配置AI代理解决方案使用Streamable HTTP传输通过HTTP API发出请求。使用Amazon Cognito强制执行OAuth 2.1。", "使用Lambda层托管MCP服务器。将Lambda层添加到AI代理Lambda函数。配置AI代理解决方案使用STDIO传输向MCP服务器发送请求。在AI代理的MCP配置中，将Lambda层ARN指定为命令。将用户凭证指定为环境变量。"], "a": "C", "explanation_en": "Option C is the correct solution because it provides a secure, scalable, and standards-compliant way to expose an MCP server to an AI agent while enforcing strong user authorization. The Model Context Protocol supports HTTP-based transports for remote MCP servers, making Streamable HTTP the appropriate choice when the server is hosted as a managed service rather than a local process. Hosting the MCP server in AWS Lambda enables automatic scaling and cost-efficient execution. By placing Amazon API Gateway in front of the Lambda function, the company creates a secure, managed HTTP endpoint that the AI agent can invoke reliably. This architecture cleanly separates transport, authentication, and business logic, which aligns with AWS serverless best practices. Using Amazon Cognito to enforce OAuth 2.1 ensures that only authenticated and authorized users can access the MCP server. This satisfies security and compliance requirements when the MCP server handles sensitive user information. Cognito integrates natively with API Gateway, removing the need for custom authentication logic and reducing operational overhead. Option A lacks user-level authorization controls. Option B and Option D rely on STDIO transport, which is intended for local or tightly coupled processes and is not suitable for distributed, serverless architectures. Option D also introduces security risks by handling credentials through environment variables. Therefore, Option C best meets the requirements for secure access control, scalability, and correct MCP integration in an AWS-based AI agent architecture.", "explanation_zh": "选项C是正确的，因为它提供了一种安全、可扩展且符合标准的方式来向AI代理暴露MCP服务器，同时强制强大的用户授权。Model Context Protocol支持基于HTTP的传输用于远程MCP服务器，使得当服务器作为托管服务而非本地进程托管时，Streamable HTTP是合适的选择。在AWS Lambda中托管MCP服务器可实现自动扩展和成本高效的执行。通过在Lambda函数前放置Amazon API Gateway，公司创建了一个安全、托管的HTTP端点，AI代理可以可靠地调用。这种架构清晰地分离了传输、身份验证和业务逻辑，符合AWS无服务器最佳实践。使用Amazon Cognito强制执行OAuth 2.1确保只有经过身份验证和授权的用户可以访问MCP服务器。这满足了MCP服务器处理敏感用户信息时的安全和合规要求。Cognito与API Gateway原生集成，无需自定义身份验证逻辑，减少了运维开销。选项A缺乏用户级授权控制。选项B和选项D依赖STDIO传输，该传输适用于本地或紧密耦合的进程，不适用于分布式无服务器架构。选项D还通过环境变量处理凭证引入了安全风险。因此，选项C在基于AWS的AI代理架构中最佳地满足了安全访问控制、可扩展性和正确MCP集成的要求。"}, {"id": 115, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is developing a generative AI (GenAI)-powered customer support application that uses Amazon \nBedrock foundation models (FMs). The application must maintain conversational context across multiple \ninteractions with the same user. The application must run clarification workflows to handle ambiguous user queries. The company must store encrypted records of each user conversation to use for personalization. The \napplication must be able to handle thousands of concurrent users while responding to each user quickly. Which solution will meet these requirements? A. B. C. D.", "body_zh": "一家公司正在开发一个基于生成式AI（GenAI）的客户支持应用程序，使用Amazon Bedrock基础模型（FM）。应用程序必须跨与同一用户的多次交互维护对话上下文。应用程序必须运行澄清工作流程以处理模糊的用户查询。公司必须存储每个用户对话的加密记录以供个性化使用。应用程序必须能够处理数千个并发用户，同时快速响应每个用户。哪种解决方案能满足这些要求？", "options_en": ["Use an AWS Step Functions Express workflow to orchestrate conversation flow. Invoke AWS Lambda \nfunctions to run clarification logic. Store conversation history in Amazon RDS and use session IDs as \nthe primary key.", "Use an AWS Step Functions Standard workflow to orchestrate clarification workflows. Include Wait \nfor a Callback patterns to manage the workflows. Store conversation history in Amazon DynamoDB. \nPurchase on-demand capacity and configure server-side encryption.", "Deploy the application by using an Amazon API Gateway REST API to route user requests to an AWS \nLambda function to update and retrieve conversation context. Store conversation history in Amazon S3 \nand configure server-side encryption. Save each interaction as a separate JSON file.", "Use AWS Lambda functions to call Amazon Bedrock inference APIs. Use Amazon SQS queues to \norchestrate clarification steps. Store conversation history in an Amazon ElastiCache (Redis OSS) \ncluster. Configure encryption at rest."], "options_zh": ["使用AWS Step Functions Express工作流程编排对话流程。调用AWS Lambda函数运行澄清逻辑。将对话历史存储在Amazon RDS中，使用会话ID作为主键。", "使用AWS Step Functions Standard工作流程编排澄清工作流程。包含等待回调模式来管理工作流程。将对话历史存储在Amazon DynamoDB中。购买按需容量并配置服务器端加密。", "使用Amazon API Gateway REST API部署应用程序，将用户请求路由到AWS Lambda函数以更新和检索对话上下文。将对话历史存储在Amazon S3中并配置服务器端加密。将每次交互保存为独立的JSON文件。", "使用AWS Lambda函数调用Amazon Bedrock推理API。使用Amazon SQS队列编排澄清步骤。将对话历史存储在Amazon ElastiCache（Redis OSS）集群中。配置静态加密。"], "a": "B", "explanation_en": "Option B is the correct solution because it provides a scalable, durable, and secure architecture for conversational GenAI workloads that require multi-step clarification workflows and persistent memory. AWS Step Functions Standard workflows are designed for long-running, stateful workflows with high reliability, which is ideal for clarification loops that may require multiple back-and-forth interactions. The Wait for a Callback pattern allows the workflow to pause while awaiting additional user input, making it well- suited for handling ambiguous queries without losing execution state. Storing conversation history in Amazon DynamoDB enables millisecond-latency reads and writes at massive scale, supporting thousands of concurrent users. DynamoDB’s on-demand capacity mode automatically scales with traffic, eliminating capacity planning. Server-side encryption ensures that stored conversation data is encrypted at rest, meeting security and compliance requirements for personalized data. Option A uses Step Functions Express and Amazon RDS, which is not ideal for long-lived conversational workflows and introduces scaling and connection management challenges. Option C stores conversations as individual S3 objects, which increases latency and complicates context retrieval. Option D relies on Amazon ElastiCache, which is optimized for ephemeral caching rather than durable, auditable conversation history. Therefore, Option B best balances scalability, performance, durability, and security for a conversational Amazon Bedrock–based customer support application.", "explanation_zh": "选项B是正确的，因为它为需要多步骤澄清工作流程和持久记忆的对话式GenAI工作负载提供了可扩展、持久且安全的架构。AWS Step Functions Standard工作流程专为长时间运行、有状态的工作流程设计，具有高可靠性，非常适合可能需要多次来回交互的澄清循环。等待回调模式允许工作流程在等待额外用户输入时暂停，使其非常适合处理模糊查询而不会丢失执行状态。将对话历史存储在Amazon DynamoDB中可在大规模下实现毫秒级延迟的读写，支持数千个并发用户。DynamoDB的按需容量模式自动随流量扩展，消除了容量规划。服务器端加密确保存储的对话数据在静态时加密，满足个性化数据的安全和合规要求。选项A使用Step Functions Express和Amazon RDS，不适合长时间运行的对话工作流程，并引入了扩展和连接管理挑战。选项C将对话存储为独立的S3对象，增加了延迟并使上下文检索复杂化。选项D依赖Amazon ElastiCache，该服务针对临时缓存而非持久、可审计的对话历史进行了优化。因此，选项B最佳地平衡了可扩展性、性能、持久性和安全性，适用于基于Amazon Bedrock的对话式客户支持应用程序。"}, {"id": 116, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A company uses an application to process customer support tickets. The company wants to integrate AI-\npowered sentiment analysis and auto-response generation into the application by using Amazon Bedrock. The company wants to prioritize urgent issues and reduce initial response times by 40% compared to manual \nresponses. The solution must process 100 concurrent webhook requests with response times under 500 ms. \nThe solution must maintain 99.9% availability across multiple AWS Regions and authenticate all incoming \nrequests. The company must avoid any authentication failures. The company does not want to modify the \nexisting application infrastructure, which includes several ticketing systems that use multiple webhook \nauthentication methods. The solution must support scaling to handle occasional spikes up to 250,000 daily \ntickets during peak periods. A. B. C. D.", "body_zh": "一家公司使用一个应用程序处理客户支持工单。公司希望通过使用Amazon Bedrock将AI驱动的情感分析和自动回复生成集成到应用程序中。公司希望优先处理紧急问题，并将初始响应时间相比手动回复减少40%。该解决方案必须处理100个并发webhook请求，响应时间低于500毫秒。该解决方案必须在多个AWS区域保持99.9%的可用性，并验证所有传入请求的身份。公司必须避免任何身份验证失败。公司不希望修改现有的应用程序基础设施，其中包括使用多个webhook身份验证方法的多个工单系统。该解决方案必须支持扩展以处理高峰期间偶尔高达250,000个日工单的激增。哪种解决方案能满足这些要求？", "options_en": ["Use an Amazon API Gateway REST API with a Regional endpoint to receive webhook requests and \ninvoke AWS Lambda functions. Configure Lambda authorizers to validate all the webhook \nauthentication methods. Configure the Lambda functions to call Amazon Bedrock to perform sentiment \nanalysis and generate responses. Store results in Amazon DynamoDB global tables to provide multi-\nRegion availability.", "Create AWS Lambda function URLs for each ticketing system. Configure the function URLs with the \nNONE authentication type. Configure separate Lambda functions to verify webhook signatures by \nusing Hash-based Message Authentication Code (HMAC) validation in the function code. Deploy the \nfunctions to multiple Regions and use AWS Global Accelerator to route traffic. Use Amazon Bedrock \nto perform sentiment analysis and generate responses. Return responses through webhook callbacks.", "Set up an Amazon SQS queue in each Region to receive webhook messages. Use the SQS queue to \ninvoke AWS Lambda functions that call Amazon Comprehend to perform sentiment analysis and \nAmazon Lex to generate responses. Use Amazon EventBridge to retry message delivery to the \napplication API.", "Deploy an AWS AppSync GraphQL API to multiple Regions. Configure API tokens to authenticate \nincoming requests. Create GraphQL mutation resolvers that publish events to Amazon EventBridge. \nConfigure EventBridge rules to invoke AWS Lambda functions that use Amazon Bedrock to perform \nsentiment analysis and generate responses. Use Amazon CloudFront to reduce latency."], "options_zh": ["使用带有Regional端点的Amazon API Gateway REST API接收webhook请求并调用AWS Lambda函数。配置Lambda授权器验证所有webhook身份验证方法。配置Lambda函数调用Amazon Bedrock进行情感分析和生成响应。将结果存储在Amazon DynamoDB全局表中以提供多区域可用性。", "为每个工单系统创建AWS Lambda函数URL。使用NONE身份验证类型配置函数URL。配置独立的Lambda函数使用基于哈希的消息认证码（HMAC）验证在函数代码中验证webhook签名。将函数部署到多个区域并使用AWS Global Accelerator路由流量。使用Amazon Bedrock进行情感分析和生成响应。通过webhook回调返回响应。", "在每个区域设置Amazon SQS队列以接收webhook消息。使用SQS队列调用AWS Lambda函数，调用Amazon Comprehend进行情感分析，Amazon Lex生成响应。使用Amazon EventBridge重试向应用程序API传递消息。", "将AWS AppSync GraphQL API部署到多个区域。配置API令牌验证传入请求。创建GraphQL变更解析器将事件发布到Amazon EventBridge。配置EventBridge规则调用使用Amazon Bedrock进行情感分析和生成响应的AWS Lambda函数。使用Amazon CloudFront减少延迟。"], "a": "A", "explanation_en": "To handle high concurrency (100+ requests) with sub-500 ms response times and diverse authentication methods without infrastructure changes, with is the optimal Amazon API Gateway Lambda authorizers choice. The Lambda authorizers can evaluate multiple authentication tokens or signatures centrally before the request reaches the processing logic, preventing unauthorized traffic and potential authentication failures at scale. integrated with provides the scalability to handle ticket surges (up to AWS Lambda Amazon Bedrock 250,000 daily) without over-provisioning resources. For high availability (99.9%) and multi-region resilience, storing the resulting sentiment and responses in ensures that data is Amazon DynamoDB global tables accessible across regions with minimal latency. Option B is less secure due to the \"NONE\" auth type, and Option C introduces queuing latency that may exceed the 500 ms target.", "explanation_zh": "为了处理高并发（100+请求）且响应时间低于500毫秒，以及多种身份验证方法而无需修改基础设施，使用带有Lambda授权器的Amazon API Gateway是最佳选择。Lambda授权器可以在请求到达处理逻辑之前集中评估多个身份验证令牌或签名，防止未经授权的流量和规模下的身份验证失败。与AWS Lambda和Amazon Bedrock集成提供了处理工单激增（高达250,000日工单）的可扩展性，而无需过度预置资源。为了实现高可用性（99.9%）和多区域弹性，将生成的情感和响应结果存储在Amazon DynamoDB全局表中确保数据可以在各区域以最小延迟访问。选项B由于使用\"NONE\"身份验证类型安全性较低，选项C引入的队列延迟可能超过500毫秒的目标。"}, {"id": 117, "exam": 1, "c": "implementation", "cn": "实施与集成", "body_en": "A company is using AWS Lambda and REST APIs to build a reasoning agent to automate support workflows. \nThe system must preserve memory across interactions, share relevant agent state, and support event-driven \ninvocation and synchronous invocation. The system must also enforce access control and session-based \npermissions. Which combination of steps provides the MOST scalable solution? (Select TWO.) A. B. C. D. E.", "body_zh": "一家公司正在使用AWS Lambda和REST API构建一个推理代理来自动化支持工作流程。系统必须跨交互保留记忆，共享相关的代理状态，并支持事件驱动调用和同步调用。系统还必须执行访问控制和基于会话的权限。哪两种步骤的组合能提供最具可扩展性的解决方案？（选择两个。）", "options_en": ["Use Amazon Bedrock AgentCore to manage memory and session-aware reasoning. Deploy the agent \nwith built-in identity support, event handling, and observability.", "Register the Lambda functions and REST APIs as actions by using Amazon API Gateway and Amazon \nEventBridge. Enable Amazon Bedrock AgentCore to invoke the Lambda functions and REST APIs \nwithout custom orchestration code.", "Use Amazon Bedrock Agents for reasoning and conversation management. Use AWS Step Functions \nand Amazon SQS for orchestration. Store agent state in Amazon DynamoDB.", "Deploy the reasoning logic as a container on Amazon ECS behind API Gateway. Use Amazon Aurora \nto store memory and identity data.", "Build a custom RAG pipeline by using Amazon Kendra and Amazon Bedrock. Use AWS Lambda to \norchestrate tool invocations. Store agent state in Amazon S3."], "options_zh": ["使用Amazon Bedrock AgentCore管理记忆和会话感知推理。使用内置的身份支持、事件处理和可观测性部署代理。", "通过Amazon API Gateway和Amazon EventBridge将Lambda函数和REST API注册为操作。使Amazon Bedrock AgentCore能够调用Lambda函数和REST API，无需自定义编排代码。", "使用Amazon Bedrock Agents进行推理和对话管理。使用AWS Step Functions和Amazon SQS进行编排。将代理状态存储在Amazon DynamoDB中。", "将推理逻辑作为容器部署在API Gateway后的Amazon ECS上。使用Amazon Aurora存储记忆和身份数据。", "使用Amazon Kendra和Amazon Bedrock构建自定义RAG流水线。使用AWS Lambda编排工具调用。将代理状态存储在Amazon S3中。"], "a": "A B", "explanation_en": "The combination of Options A and B provides the most scalable and AWS-native architecture for building reasoning agents with persistent memory, session awareness, secure access control, and flexible invocation models. Amazon Bedrock AgentCore is purpose-built to manage agent memory, session context, and identity-aware reasoning across interactions. It eliminates the need for developers to manually store and retrieve agent state, manage session lifecycles, or implement custom memory layers. AgentCore natively supports both synchronous requests and event-driven execution, making it ideal for support workflow automation. Option B complements AgentCore by enabling seamless tool invocation. By registering AWS Lambda functions and REST APIs as agent actions through API Gateway and EventBridge, the agent can invoke tools reactively or synchronously without custom orchestration code. EventBridge enables event-driven execution, while API Gateway supports synchronous request-response patterns. This combination provides built-in security, observability, and scaling, while avoiding the operational burden of managing queues, databases, or custom workflow engines. Option C introduces unnecessary orchestration complexity. Option D increases infrastructure management and cost. Option E stores agent state in S3, which is not suitable for low-latency, session-based reasoning. Therefore, A and B together deliver the most scalable, secure, and low-overhead solution for production- grade reasoning agents on AWS.", "explanation_zh": "选项A和B的组合提供了最具可扩展性和AWS原生的架构，用于构建具有持久记忆、会话感知、安全访问控制和灵活调用模型的推理代理。Amazon Bedrock AgentCore专为管理跨交互的代理记忆、会话上下文和身份感知推理而设计。它消除了开发人员手动存储和检索代理状态、管理会话生命周期或实现自定义记忆层的需要。AgentCore原生支持同步请求和事件驱动执行，使其非常适合支持工作流程自动化。选项B通过启用无缝工具调用来补充AgentCore。通过API Gateway和EventBridge将AWS Lambda函数和REST API注册为代理操作，代理可以反应式或同步地调用工具，无需自定义编排代码。EventBridge启用事件驱动执行，而API Gateway支持同步请求-响应模式。这种组合提供了内置的安全性、可观测性和扩展性，同时避免了管理队列、数据库或自定义工作流引擎的运维负担。选项C引入了不必要的编排复杂性。选项D增加了基础设施管理和成本。选项E将代理状态存储在S3中，不适合低延迟、基于会话的推理。因此，A和B共同为AWS上的生产级推理代理提供了最具可扩展性、安全和低开销的解决方案。"}, {"id": 118, "exam": 1, "c": "operational", "cn": "运营效率与GenAI优化", "body_en": "A large ecommerce company has deployed a foundation model (FM) to generate product descriptions. The \ncompany's engineering team monitors technical metrics such as token usage, latency, and error rates by using Amazon CloudWatch. The company's marketing team tracks bus
