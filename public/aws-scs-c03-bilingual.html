Encrypt` API has a 4 KB plaintext data limit.\n \nHow should they encrypt these large files?", "options_en": ["Split the file into 4 KB chunks, encrypt each chunk individually using the KMS `Encrypt` API with the same CMK, then concatenate all encrypted chunks into a single composite ciphertext file for S3 storage.", "Use envelope encryption: call `GenerateDataKey` to get a plaintext data key and its KMS-encrypted copy, encrypt the file locally with the plaintext key using AES-256, store the encrypted file alongside the encrypted data key, and discard the plaintext key.", "Upload the file directly to S3 with SSE-KMS encryption enabled on the bucket, which transparently handles large file encryption server-side using multipart upload integration without requiring any client-side cryptographic operations.", "Use CloudHSM to generate a symmetric data key inside the HSM, export the key material securely, encrypt the file locally using the HSM-generated key, then import the encrypted data key into KMS for centralized lifecycle management."], "correct": 1, "explanation_en": "Envelope encryption is the standard pattern for encrypting data larger than 4 KB with KMS. `GenerateDataKey` returns a plaintext data key and a KMS-encrypted copy. The application encrypts the data locally with the plaintext key, stores the encrypted data alongside the encrypted data key, and discards the plaintext key. To decrypt, the application calls KMS `Decrypt` on the encrypted data key, then decrypts the data locally. SSE-KMS is for server-side S3 encryption, not client-side pre-upload encryption.", "question_zh": "一个应用程序需要在将大于100MB的文件存储到S3之前对其进行加密。KMS Encrypt API有4KB的明文数据限制。\n\n他们应该如何加密这些大文件？", "options_zh": ["将文件分割成4KB块，使用相同的CMK对每个块单独使用KMS Encrypt API加密，然后将所有加密块合并成一个复合密文文件以存储在S3中。", "使用信封加密：调用GenerateDataKey获取明文数据密钥及其KMS加密副本，使用AES-256在本地用明文密钥加密文件，将加密文件与加密数据密钥一起存储，然后丢弃明文密钥。", "直接将文件上传到启用了SSE-KMS加密的S3存储桶，该方式利用分段上传集成在服务器端透明地处理大文件加密，无需任何客户端加密操作。", "使用CloudHSM在HSM内部生成对称数据密钥，安全导出密钥材料，使用HSM生成的密钥在本地加密文件，然后将加密数据密钥导入KMS以进行集中生命周期管理。"], "explanation_zh": "信封加密是使用KMS加密大于4KB数据的标准模式。GenerateDataKey返回明文数据密钥和KMS加密的副本。应用程序在本地用明文密钥加密数据，将加密数据与加密数据密钥一起存储，然后丢弃明文密钥。解密时，应用程序对加密数据密钥调用KMS Decrypt，然后在本地解密数据。SSE-KMS用于服务器端S3加密，而非客户端上传前加密。"}, {"exam": 4, "id": 46, "question_en": "Account A stores a database credential in AWS Secrets Manager encrypted with a customer managed KMS key. A Lambda function in Account B needs to retrieve this secret at runtime.\n \nWhat is required for cross-account access?", "options_en": ["Replicate the secret to Account B using Secrets Manager multi-Region replication, which creates a read replica of the secret in Account B's Region for local retrieval by the Lambda function.", "Create a proxy Lambda function in Account A that retrieves the secret value from Secrets Manager and exposes it through an API Gateway endpoint that Account B's Lambda function calls at runtime.", "Use AWS Resource Access Manager (RAM) to share the Secrets Manager secret resource with Account B, allowing Account B's Lambda role to call `GetSecretValue` directly on the shared resource.", "Add a resource-based policy to the secret granting Account B's Lambda role `GetSecretValue` permission, and update the KMS key policy to allow Account B's role to call `Decrypt`."], "correct": 3, "explanation_en": "Cross-account Secrets Manager access requires two policy updates: a resource-based policy on the secret allowing the cross-account principal to call `GetSecretValue`, and a KMS key policy granting `kms:Decrypt` to the same principal. The AWS managed key (`aws/secretsmanager`) does not support cross-account access; a customer managed key is required. Secrets Manager does not integrate with RAM. Multi-Region replication copies within the same account to other Regions, not across accounts.", "question_zh": "账户A在AWS Secrets Manager中存储了一个使用客户托管KMS密钥加密的数据库凭证。账户B中的Lambda函数需要在运行时检索此密钥。\n\n跨账户访问需要什么？", "options_zh": ["使用Secrets Manager多区域复制将密钥复制到账户B，在账户B的区域中创建密钥的只读副本，以供Lambda函数本地检索。", "在账户A中创建一个代理Lambda函数，从Secrets Manager检索密钥值，并通过API Gateway端点公开，账户B的Lambda函数在运行时调用该端点。", "使用AWS Resource Access Manager(RAM)与账户B共享Secrets Manager密钥资源，允许账户B的Lambda角色直接在共享资源上调用GetSecretValue。", "向密钥添加基于资源的策略，授予账户B的Lambda角色GetSecretValue权限，并更新KMS密钥策略以允许账户B的角色调用Decrypt。"], "explanation_zh": "跨账户Secrets Manager访问需要两个策略更新：密钥上的基于资源的策略允许跨账户主体调用GetSecretValue，KMS密钥策略授予同一主体kms:Decrypt权限。AWS托管密钥(aws/secretsmanager)不支持跨账户访问；需要客户托管密钥。Secrets Manager不与RAM集成。多区域复制在同一账户内复制到其他区域，而非跨账户。"}, {"exam": 4, "id": 47, "question_en": "A CloudHSM cluster experiences an HSM hardware failure. The security team wants to restore cryptographic capacity quickly without recreating all keys manually.\n \nWhich CloudHSM capability supports this recovery model?", "options_en": ["Automatic encrypted cluster backups that can be restored to replacement HSMs in the same Region.", "Cross-account key replication that continuously copies key material to a standby account by default.", "Automatic export of all private keys to KMS on every configuration change for fallback operations.", "Native multi-Region active-active key synchronization across independent CloudHSM clusters."], "correct": 0, "explanation_en": "CloudHSM provides automatic cluster backups that support recovery when HSM instances fail and are replaced. This reduces operational overhead for restoring key material and cluster state. The other choices describe capabilities that CloudHSM does not provide natively.", "question_zh": "一个CloudHSM集群遭遇HSM硬件故障。安全团队希望快速恢复加密能力，而无需手动重新创建所有密钥。\n\n哪个CloudHSM功能支持此恢复模型？", "options_zh": ["自动加密集群备份，可以恢复到同一区域的替换HSM。", "跨账户密钥复制，默认情况下持续将密钥材料复制到备用账户。", "每次配置更改时自动将所有私钥导出到KMS以进行回退操作。", "跨独立CloudHSM集群的原生多区域主动-主动密钥同步。"], "explanation_zh": "CloudHSM提供自动集群备份，支持在HSM实例故障和替换时的恢复。这减少了恢复密钥材料和集群状态的操作开销。其他选项描述的功能CloudHSM并非原生提供。"}, {"exam": 4, "id": 48, "question_en": "An S3 bucket stores millions of small objects encrypted with SSE-KMS. Each `PutObject` and `GetObject` generates a separate KMS API call, resulting in high KMS costs. The team wants to reduce costs without changing the encryption type.\n \nWhat should they enable?", "options_en": ["Implement client-side encryption with the AWS Encryption SDK and enable data key caching to reuse derived data keys across multiple encrypt operations, reducing per-object KMS API calls.", "Switch from SSE-KMS to SSE-S3 managed encryption, which uses Amazon-managed keys and eliminates all KMS `GenerateDataKey` API calls during object upload and download operations.", "Enable S3 Bucket Keys, which generate a short-lived bucket-level data key from KMS and reuse it for multiple objects, reducing the per-object KMS API calls significantly.", "Increase the KMS automatic key rotation interval from one year to three years, reducing the total number of backing key versions and the frequency of re-encryption API calls for new objects."], "correct": 2, "explanation_en": "S3 Bucket Keys introduce a data key hierarchy where S3 generates a bucket-level key from the KMS key and reuses it for a time-limited period. This dramatically reduces KMS `GenerateDataKey` requests. S3 Bucket Keys work transparently with SSE-KMS, require no application code changes, and can be enabled on existing buckets without re-encrypting data. Key rotation frequency does not affect per-request KMS API call volume.", "question_zh": "一个S3存储桶存储了数百万个使用SSE-KMS加密的小对象。每个PutObject和GetObject都会生成一个单独的KMS API调用，导致高昂的KMS费用。团队希望在不改变加密类型的情况下降低成本。\n\n他们应该启用什么？", "options_zh": ["使用AWS Encryption SDK实现客户端加密，并启用数据密钥缓存以在多个加密操作中重用派生的数据密钥，减少每个对象的KMS API调用。", "从SSE-KMS切换到SSE-S3托管加密，使用Amazon托管密钥并消除对象上传和下载操作期间的所有KMS GenerateDataKey API调用。", "启用S3 Bucket Keys，从KMS生成一个短生命周期的存储桶级别数据密钥，并将其重用于多个对象，显著减少每个对象的KMS API调用。", "将KMS自动密钥轮换间隔从一年增加到三年，减少后备密钥版本的总数和为新对象重新加密API调用的频率。"], "explanation_zh": "S3 Bucket Keys引入了一个数据密钥层次结构，其中S3从KMS密钥生成存储桶级别密钥，并在有限时间内重用它。这显著减少了KMS GenerateDataKey请求。S3 Bucket Keys与SSE-KMS透明配合使用，无需应用程序代码更改，并且可以在现有存储桶上启用而无需重新加密数据。密钥轮换频率不影响每个请求的KMS API调用量。"}, {"exam": 4, "id": 49, "question_en": "Amazon Macie classification jobs correctly detect sensitive patterns but generate recurring false positives from known benign test values used by QA datasets.\n \nWhat is the best Macie-native way to reduce this noise?", "options_en": ["Disable all managed data identifiers globally and create custom regex-only data identifiers to replace the built-in detection patterns with filters that exclude the known benign test values.", "Create an allow list in Macie for known benign values and use it during sensitive data discovery jobs.", "Move the QA dataset objects to S3 Glacier Deep Archive storage class so that Macie cannot access or process their contents during classification jobs, eliminating false positives at the source.", "Replace Macie with a custom Lambda-based scanner that reads S3 objects, applies regex patterns with hardcoded exclusion lists for known test values, and publishes findings to Security Hub."], "correct": 1, "explanation_en": "Macie allow lists are built for suppressing expected benign matches so findings focus on meaningful sensitive data detections. This improves signal quality without disabling managed identifiers. Storage class changes or custom scanners do not provide the same integrated tuning model.", "question_zh": "Amazon Macie分类作业正确检测到敏感模式，但从QA数据集使用的已知良性测试值产生了重复的误报。\n\n减少这种噪音的最佳Macie原生方式是什么？", "options_zh": ["全局禁用所有托管数据标识符，创建仅自定义正则表达式数据标识符来替换内置检测模式，并使用排除已知良性测试值的筛选器。", "在Macie中为已知良性值创建允许列表，并在敏感数据发现作业中使用它。", "将QA数据集对象移动到S3 Glacier Deep Archive存储类，使Macie无法在分类作业期间访问或处理其内容，从源头消除误报。", "用基于Lambda的自定义扫描器替换Macie，读取S3对象，应用带有已知测试值硬编码排除列表的正则表达式模式，并将发现项发布到Security Hub。"], "explanation_zh": "Macie允许列表专为抑制预期的良性匹配而构建，使发现项集中于有意义的敏感数据检测。这提高了信号质量，而无需禁用托管标识符。存储类更改或自定义扫描器不提供相同的集成调优模型。"}, {"exam": 4, "id": 50, "question_en": "A regulated workload must retain records in Amazon S3 under WORM controls for seven years, and no administrator should be able to shorten retention or delete protected object versions during that period.\n \nWhich option meets this requirement most directly?", "options_en": ["S3 with versioning enabled and MFA Delete configured on the bucket, requiring multi-factor authentication for any version deletion request but still allowing retention policy changes by administrators.", "S3 Object Lock in Governance mode with a seven-year retention period, which prevents most users from deleting protected versions but allows administrators with `s3:BypassGovernanceRetention` to override.", "S3 Object Lock in Compliance mode with a seven-year retention period applied to protected object versions.", "S3 Lifecycle policy transitioning objects to Glacier Deep Archive after 30 days with a bucket policy denying `s3:DeleteObject` actions, providing cost-optimized archival without true WORM enforcement."], "correct": 2, "explanation_en": "Compliance mode in S3 Object Lock provides the strongest WORM behavior by preventing retention changes and protected-version deletions for all users, including administrators. Governance mode can be bypassed by principals with specific permissions. Versioning and lifecycle settings alone are not equivalent immutability controls.", "question_zh": "一个受监管的工作负载必须在Amazon S3中以WORM控制保留记录七年，在此期间任何管理员都不能缩短保留时间或删除受保护的对象版本。\n\n哪个选项最直接地满足此要求？", "options_zh": ["S3启用版本控制和MFA Delete，要求对任何版本删除请求进行多因素身份验证，但仍允许管理员更改保留策略。", "S3 Object Lock的Governance模式，设置七年保留期，阻止大多数用户删除受保护的版本，但允许具有s3:BypassGovernanceRetention权限的管理员覆盖。", "对受保护的对象版本应用S3 Object Lock的Compliance模式，设置七年保留期。", "S3生命周期策略在30天后将对象转换到Glacier Deep Archive，并使用存储桶策略拒绝s3:DeleteObject操作，提供成本优化的归档，但没有真正的WORM强制执行。"], "explanation_zh": "S3 Object Lock的Compliance模式提供最强的WORM行为，通过阻止所有用户（包括管理员）更改保留和删除受保护的版本。Governance模式可以被具有特定权限的主体绕过。版本控制和生命周期设置本身不是等效的不可变性控制。"}, {"exam": 4, "id": 51, "question_en": "Operations needs centralized backup governance for EC2, EBS, and RDS with policy-based scheduling, retention, and cross-account copy rules managed from one place.\n \nWhich service is the best fit?", "options_en": ["Create an Amazon Data Lifecycle Manager (DLM) lifecycle policy targeting EBS volumes by tag, scheduling daily snapshots, and configuring a 30-day retention period for automatic deletion.", "AWS Backup, because backup plans and backup vault policies can consistently govern multiple supported resource types.", "Create a CloudWatch Events rule that triggers a Lambda function on a daily schedule to iterate through tagged EBS volumes, create snapshots, and delete snapshots older than 30 days.", "Use EC2 Image Builder to create daily AMI pipelines that capture the full instance state including EBS volume data, automatically deregistering AMIs beyond the 30-day retention window."], "correct": 1, "explanation_en": "AWS Backup is designed for centralized, policy-based backup management across multiple AWS services and accounts. It supports consistent schedules, retention, and copy behaviors through backup plans. DLM is narrower in scope and does not provide the same multi-service governance model.", "question_zh": "运维部门需要为EC2、EBS和RDS提供集中式备份治理，具有基于策略的调度、保留和跨账户复制规则，从一处管理。\n\n哪个服务是最佳选择？", "options_zh": ["创建Amazon Data Lifecycle Manager(DLM)生命周期策略，按标签定位EBS卷，安排每日快照，并配置30天保留期以自动删除。", "AWS Backup，因为备份计划和备份保管库策略可以一致地管理多种支持的资源类型。", "创建一个CloudWatch Events规则，每天触发Lambda函数遍历带标签的EBS卷，创建快照，并删除超过30天的快照。", "使用EC2 Image Builder创建每日AMI管道，捕获包括EBS卷数据的完整实例状态，自动注销超过30天保留窗口的AMI。"], "explanation_zh": "AWS Backup专为跨多个AWS服务和账户的集中式、基于策略的备份管理而设计。它通过备份计划支持一致的调度、保留和复制行为。DLM范围较窄，不提供相同的多服务治理模型。"}, {"exam": 4, "id": 52, "question_en": "A healthcare organization stores medical records in S3 for 7 years to meet HIPAA requirements. Even administrators with full S3 permissions must NOT be able to delete or overwrite records before the retention period expires.\n \nWhich S3 data protection strategy meets this requirement?", "options_en": ["Enable S3 versioning with MFA Delete, requiring multi-factor authentication for any delete operation, which prevents administrators from removing object versions during the retention window.", "Enable S3 Object Lock in Governance mode with a 7-year retention period, which restricts most users from deleting objects but allows administrators with special permissions to override the retention.", "Enable S3 Object Lock in Compliance mode with a 7-year retention period, which prevents any user including the root account from deleting or overwriting object versions until the retention period expires.", "Configure an S3 Lifecycle policy that transitions objects to S3 Glacier Deep Archive immediately and applies a Glacier Vault Lock policy in compliance mode to enforce the 7-year retention."], "correct": 2, "explanation_en": "S3 Object Lock in Compliance mode provides the strictest immutability protection. Once set, the retention period cannot be shortened and the object version cannot be deleted or overwritten by any user, including the root account. Governance mode allows users with the `s3:BypassGovernanceRetention` permission to override the retention, which does not meet the requirement that administrators cannot delete records.", "question_zh": "一家医疗组织将医疗记录在S3中存储7年以满足HIPAA要求。即使是具有完整S3权限的管理员也绝不能能够删除或覆盖保留期到期前的记录。\n\n哪种S3数据保护策略满足此要求？", "options_zh": ["启用S3版本控制和MFA Delete，要求对任何删除操作进行多因素身份验证，阻止管理员在保留窗口期间删除对象版本。", "启用S3 Object Lock的Governance模式，设置七年保留期，限制大多数用户删除对象，但允许具有特殊权限的管理员覆盖保留。", "启用S3 Object Lock的Compliance模式，设置七年保留期，防止任何用户（包括根账户）在保留期到期前删除或覆盖对象版本。", "配置S3生命周期策略，立即将对象转换到S3 Glacier Deep Archive，并在合规模式下应用Glacier Vault Lock策略以强制执行七年保留期。"], "explanation_zh": "S3 Object Lock的Compliance模式提供最严格的不可变性保护。一旦设置，保留期不能缩短，任何用户（包括根账户）都不能删除或覆盖对象版本。Governance模式允许具有s3:BypassGovernanceRetention权限的用户覆盖保留，这不满足管理员不能删除记录的要求。"}, {"exam": 4, "id": 53, "question_en": "An organization needs production account backups automatically copied to a separate backup account in a different Region, with the backup copies being immutable.\n \nWhich AWS Backup configuration supports this?", "options_en": ["A backup plan with cross-Region copy rules within the same production account, using resource-based vault access policies to allow the backup account's IAM roles to perform cross-account restores.", "A backup plan with cross-account, cross-Region copy rules targeting a vault in the backup account, with AWS Backup Vault Lock enabled on the destination vault for immutability.", "A backup plan with Vault Lock enabled on the source vault in the production account, protecting local recovery points from deletion but not providing cross-account or cross-Region copies.", "A backup plan with cross-Region copy to the backup account using the default vault retention settings without Vault Lock, allowing administrators in the backup account to modify or delete recovery points."], "correct": 1, "explanation_en": "AWS Backup supports cross-account and cross-Region copy rules in backup plans. Recovery points are automatically copied to a destination vault in another account and/or Region. Enabling Backup Vault Lock on the destination vault makes the backups immutable, preventing deletion even by privileged users. This provides ransomware protection and regulatory compliance for backup data.", "question_zh": "一个组织需要将生产账户的备份自动复制到不同区域中的单独备份账户，备份副本必须是不可变的。\n\n哪种AWS Backup配置支持此要求？", "options_zh": ["一个具有区域内跨区域复制规则的备份计划，在同一生产账户内，使用基于资源的保管库访问策略允许备份账户的IAM角色执行跨账户还原。", "一个具有跨账户、跨区域复制规则的备份计划，以备份账户中的保管库为目标，并在目标保管库上启用AWS Backup Vault Lock以实现不可变性。", "一个在生产账户的源保管库上启用了Vault Lock的备份计划，保护本地恢复点不被删除，但不提供跨账户或跨区域复制。", "一个使用默认保管库保留设置（不带Vault Lock）将备份跨区域复制到备份账户的备份计划，允许备份账户中的管理员修改或删除恢复点。"], "explanation_zh": "AWS Backup支持备份计划中的跨账户和跨区域复制规则。恢复点会自动复制到另一个账户和/或区域的目标保管库。在目标保管库上启用Backup Vault Lock使备份不可变，防止即使是特权用户也无法删除。这为备份数据提供了勒索软件保护和法规合规性。"}, {"exam": 4, "id": 54, "question_en": "A company discovers that a private certificate issued by their AWS Private CA has been compromised. They need clients to reject this specific certificate during TLS validation.\n \nWhich revocation mechanisms does AWS Private CA support?", "options_en": ["Only Certificate Revocation Lists (CRLs) published to an S3 bucket, where clients download and cache the list periodically to check certificate validity during TLS handshake validation.", "Only OCSP via a managed responder endpoint that clients query in real time during TLS handshake validation to determine whether a specific certificate serial number has been revoked.", "Certificate revocation is not natively supported by AWS Private CA; the recommended approach is to re-issue all certificates from a new CA hierarchy when a compromise is detected.", "Both CRL (published to S3) and OCSP (via a managed responder), which can be enabled independently or together for defense-in-depth revocation checking by relying parties."], "correct": 3, "explanation_en": "AWS Private CA supports two revocation mechanisms: CRLs published to an S3 bucket contain a list of revoked certificate serial numbers, and the managed OCSP responder provides real-time revocation status to clients. Both can be enabled independently or together. OCSP provides faster checking since clients do not download the full CRL. Using both provides defense in depth for clients that may support only one mechanism. These must be configured on the CA before issuing certificates.", "question_zh": "一家公司发现由其AWS Private CA颁发的私有证书已被泄露。他们需要客户端在TLS验证期间拒绝该特定证书。\n\nAWS Private CA支持哪些吊销机制？", "options_zh": ["仅证书吊销列表(CRL)，发布到S3存储桶，客户端定期下载并缓存列表以在TLS握手验证期间检查证书有效性。", "仅OCSP，通过托管响应器端点，客户端在TLS握手验证期间实时查询以确定特定证书序列号是否已被吊销。", "AWS Private CA不支持原生的证书吊销；推荐的折中方法是当检测到泄露时从新的CA层次结构重新颁发所有证书。", "CRL（发布到S3）和OCSP（通过托管响应器）都支持，可以独立或一起启用以实现依赖方的纵深防御吊销检查。"], "explanation_zh": "AWS Private CA支持两种吊销机制：发布到S3存储桶的CRL包含已吊销证书序列号的列表，托管的OCSP响应器为客户端提供实时吊销状态查询。两者可以独立或一起启用。OCSP提供更快的检查，因为客户端不需要下载完整的CRL。同时使用两者为可能只支持一种机制的客户端提供纵深防御。这些必须在颁发证书之前在CA上配置。"}, {"exam": 4, "id": 55, "question_en": "A company needs to ensure every object uploaded to an S3 bucket is encrypted with a specific customer managed KMS key. Objects uploaded with a different key or with SSE-S3 should be rejected.\n \nHow should they enforce this?", "options_en": ["Configure S3 default encryption with the KMS key AND add a bucket policy Deny statement that rejects PutObject requests lacking the correct `x-amz-server-side-encryption-aws-kms-key-id` header.", "Configure only S3 default encryption with the KMS key, which applies the key to objects uploaded without an encryption header but does not reject objects explicitly encrypted with a different key.", "Create an IAM policy on the uploading roles requiring the `x-amz-server-side-encryption-aws-kms-key-id` header to match the designated key ARN, which prevents those roles from using other keys.", "Enable S3 Object Lock in Compliance mode on the bucket, which enforces that all objects are stored with server-side encryption using the bucket's default KMS key and prevents any key changes."], "correct": 0, "explanation_en": "S3 default encryption applies to objects uploaded without specifying encryption, but does NOT prevent users from uploading objects with a different key or SSE-S3. To enforce a specific KMS key, a bucket policy Deny statement with the `s3:x-amz-server-side-encryption-aws-kms-key-id` condition key is needed. This rejects any `PutObject` where the specified key does not match. The combination of default encryption and policy enforcement ensures both a fallback default and strict enforcement.", "question_zh": "一家公司需要确保上传到S3存储桶的每个对象都使用特定的客户托管KMS密钥加密。使用不同密钥或SSE-S3上传的对象应被拒绝。\n\n他们应该如何强制执行此要求？", "options_zh": ["使用KMS密钥配置S3默认加密，并添加存储桶策略Deny语句，拒绝缺少正确x-amz-server-side-encryption-aws-kms-key-id标头的PutObject请求。", "仅使用KMS密钥配置S3默认加密，该方式将密钥应用于未指定加密标头的对象上传，但不拒绝明确使用不同密钥加密的对象。", "在上传角色上创建一个IAM策略，要求x-amz-server-side-encryption-aws-kms-key-id标头与指定的密钥ARN匹配，阻止这些角色使用其他密钥。", "在存储桶上启用S3 Object Lock的Compliance模式，强制执行所有对象使用存储桶的默认KMS密钥进行服务器端加密存储，并阻止任何密钥更改。"], "explanation_zh": "S3默认加密适用于未指定加密方式上传的对象，但不阻止用户使用不同密钥或SSE-S3上传对象。要强制执行特定的KMS密钥，需要带有s3:x-amz-server-side-encryption-aws-kms-key-id条件键的存储桶策略Deny语句。这拒绝任何指定密钥不匹配的PutObject操作。默认加密和策略强制相结合，既提供回退默认值又提供严格强制执行。"}, {"exam": 4, "id": 56, "question_en": "Application logs sent to CloudWatch Logs occasionally contain sensitive customer data such as email addresses and credit card numbers. Compliance requires this data be masked in real-time before anyone can view it.\n \nWhich feature should they use?", "options_en": ["Create a CloudWatch Logs subscription filter that streams matching log events to a Lambda function performing regex-based PII detection and replacement before forwarding sanitized logs to S3.", "Configure Amazon Macie to connect to CloudWatch Logs as a data source and run scheduled sensitive data discovery jobs that scan log content for PII patterns and generate findings in Security Hub.", "Enable CloudWatch Logs data protection policies with managed data identifiers to automatically detect and mask sensitive data patterns like credit card numbers, SSNs, and email addresses in log events.", "Use CloudWatch Logs Insights queries with regular expression extraction and masking functions to redact sensitive fields at query time, returning sanitized results without modifying the stored log data."], "correct": 2, "explanation_en": "CloudWatch Logs data protection policies automatically detect and mask sensitive data in log events using managed data identifiers. Masked data appears as asterisks in log output. This operates in real-time during log ingestion, requiring no custom Lambda functions or processing pipelines. Macie is designed for S3 data classification, not CloudWatch Logs. Logs Insights regex masking would only work at query time and requires manual effort.", "question_zh": "发送到CloudWatch Logs的应用程序日志偶尔包含敏感的客户数据，如电子邮件地址和信用卡号。合规性要求在任何人都能查看之前实时屏蔽这些数据。\n\n他们应该使用哪个功能？", "options_zh": ["创建一个CloudWatch Logs订阅筛选器，将匹配的日志事件流式传输到执行基于正则表达式的PII检测和替换的Lambda函数，然后将清理后的日志转发到S3。", "配置Amazon Macie连接CloudWatch Logs作为数据源，运行定时敏感数据发现作业扫描日志内容的PII模式，并在Security Hub中生成发现项。", "启用CloudWatch Logs数据保护策略，使用托管数据标识符自动检测和屏蔽日志事件中的敏感数据模式，如信用卡号、SSN和电子邮件地址。", "在查询时使用带正则表达式提取和屏蔽功能的CloudWatch Logs Insights查询来编辑敏感字段，返回清理后的结果而不修改存储的日志数据。"], "explanation_zh": "CloudWatch Logs数据保护策略使用托管数据标识符自动检测和屏蔽日志事件中的敏感数据。屏蔽的数据在日志输出中显示为星号。这在日志摄取期间实时运行，无需自定义Lambda函数或处理管道。Macie专为S3数据分类设计，而非CloudWatch Logs。Logs Insights正则表达式屏蔽仅在查询时起作用，需要手动操作。"}, {"exam": 4, "id": 57, "question_en": "A platform team adopted Control Tower Account Factory for Terraform (AFT) and wants per-account baseline modules to run automatically whenever a new account request is approved.\n \nWhere should this customization logic be implemented?", "options_en": ["In the AFT account customizations pipeline so Terraform modules are applied based on account request metadata.", "In manual post-provision Terraform runs executed from developer laptops after account creation.", "In SCP JSON documents only, because AFT does not support Terraform-based account-specific customizations.", "In CloudFormation StackSets exclusively, since AFT pipelines cannot trigger module deployments per account."], "correct": 0, "explanation_en": "AFT includes account customization workflows that apply Terraform modules automatically for provisioned accounts. This enables repeatable account baseline automation without manual post-provision steps. SCPs and StackSets can complement governance, but they do not replace AFT's account customization pipeline.", "question_zh": "一个平台团队采用了Control Tower Account Factory for Terraform(AFT)，并希望在新的账户请求被批准时自动运行每个账户的基线模块。\n\n此自定义逻辑应该在哪里实现？", "options_zh": ["在AFT账户自定义管道中，使Terraform模块根据账户请求元数据应用。", "在账户创建后从开发者笔记本电脑执行的手动配置后Terraform运行中。", "仅在SCP JSON文档中，因为AFT不支持基于Terraform的账户特定自定义。", "仅在CloudFormation StackSets中，因为AFT管道无法按账户触发模块部署。"], "explanation_zh": "AFT包含账户自定义工作流，自动为配置的账户应用Terraform模块。这实现了可重复的账户基线自动化，无需手动配置后步骤。SCP和StackSets可以补充治理，但不能替代AFT的账户自定义管道。"}, {"exam": 4, "id": 58, "question_en": "A security team needs a single-pane view of AWS Config compliance across 80 accounts and 4 Regions in their Organization.\n \nHow should they achieve this?", "options_en": ["Enable AWS Config separately in each member account and create EventBridge rules that forward compliance change events to a centralized SNS topic in the security account for aggregated alerting.", "Use Security Hub with the AWS Foundational Security Best Practices standard to aggregate Config rule compliance findings across the organization from a single delegated administrator account.", "Create CloudWatch cross-account observability dashboards in the security account that pull Config compliance metrics from each member account for a unified view of organizational compliance.", "Create an AWS Config aggregator in the central security account that collects configuration and compliance data from all member accounts across the organization without requiring individual account setup."], "correct": 3, "explanation_en": "An AWS Config aggregator collects configuration and compliance data from multiple accounts and Regions into a unified view. An organization aggregator automatically collects from all member accounts without individual authorization setup. It displays compliance status of Config rules, resource configurations, and relationships across the entire organization from one account. This is the native, zero-code solution for multi-account Config visibility.", "question_zh": "一个安全团队需要在其组织中的80个账户和4个区域中实现AWS Config合规性的单一视图。\n\n他们应该如何实现？", "options_zh": ["在每个成员账户中单独启用AWS Config，并创建EventBridge规则将合规性变更事件转发到安全账户中的集中SNS主题以进行聚合告警。", "使用Security Hub和AWS Foundational Security Best Practices标准，从单个委派管理员账户聚合整个组织的Config规则合规性发现项。", "在安全账户中创建CloudWatch跨账户可观测性仪表板，从每个成员账户拉取Config合规性指标，以获得组织合规性的统一视图。", "在中心安全账户中创建一个AWS Config聚合器，从组织中的所有成员账户收集配置和合规性数据，无需单独的账户设置。"], "explanation_zh": "AWS Config聚合器将来自多个账户和区域的配置和合规性数据收集到统一视图中。组织聚合器自动从所有成员账户收集数据，无需单独的授权设置。它从一个账户显示整个组织的Config规则合规性状态、资源配置和关系。这是多账户Config可见性的原生零代码解决方案。"}, {"exam": 4, "id": 59, "question_en": "A SaaS company needs to automate evidence collection from their AWS environment for an upcoming SOC 2 Type II audit, organized by SOC 2 trust service criteria.\n \nWhich service should they use?", "options_en": ["AWS Audit Manager with the SOC 2 pre-built framework, which automatically collects evidence from CloudTrail, Config, and other sources, mapping each evidence item to the relevant SOC 2 control domain.", "AWS Artifact, which provides downloadable copies of AWS's own SOC 2 compliance reports and certifications for the customer's auditors to review AWS's infrastructure-level compliance posture.", "Security Hub with the CIS AWS Foundations Benchmark standard enabled, which provides continuous compliance scoring against industry security best practices as a proxy for SOC 2 readiness.", "Manual evidence collection by exporting CloudTrail event logs, AWS Config compliance snapshots, and Security Hub finding summaries into spreadsheets organized by each SOC 2 control domain."], "correct": 0, "explanation_en": "AWS Audit Manager automates continuous evidence collection from AWS services and maps it to compliance framework controls. It includes a pre-built SOC 2 framework mapping AWS evidence to trust service criteria. Assessment reports organize evidence by control domain for auditors. AWS Artifact provides AWS's own compliance reports (about AWS infrastructure), not evidence from your environment.", "question_zh": "一家SaaS公司需要从AWS环境中自动收集证据，为即将到来的SOC 2 Type II审计做准备，按SOC 2信任服务标准组织。\n\n他们应该使用哪个服务？", "options_zh": ["AWS Audit Manager与SOC 2预构建框架，自动从CloudTrail、Config和其他来源收集证据，将每个证据项映射到相关的SOC 2控制域。", "AWS Artifact，提供AWS自身的SOC 2合规性报告和认证的可下载副本，供客户的审计员审查AWS的基础设施级别合规性状况。", "Security Hub启用CIS AWS Foundations Benchmark标准，提供针对行业安全最佳实践的持续合规性评分，作为SOC 2就绪状态的代理。", "通过将CloudTrail事件日志、AWS Config合规性快照和Security Hub发现项摘要导出到按每个SOC 2控制域组织的电子表格来手动收集证据。"], "explanation_zh": "AWS Audit Manager自动从AWS服务持续收集证据，并将其映射到合规性框架控制。它包括一个预构建的SOC 2框架，将AWS证据映射到信任服务标准。评估报告按控制域组织证据供审计员使用。AWS Artifact提供AWS自身的合规性报告（关于AWS基础设施），而非来自您环境的证据。"}, {"exam": 4, "id": 60, "question_en": "A security team wants CI policy checks that fail CloudFormation templates if they miss required tags, violate allowed instance types, or use disallowed configurations before deployment starts.\n \nWhich tool is purpose-built for this policy-as-code validation?", "options_en": ["AWS Config conformance packs, because they block template deployment during synthesis in developer pipelines.", "CloudFormation drift detection, because it evaluates templates pre-deployment against custom policy rules.", "AWS CloudFormation Guard, because rule files can validate template content against organization-defined policy requirements.", "cfn-lint only, because it enforces security policy semantics and organizational compliance controls by default."], "correct": 2, "explanation_en": "CloudFormation Guard is designed for policy-as-code validation of templates against custom rule sets before deployment. It is well suited for CI gate checks on structural and compliance requirements. Config and drift detection operate after resources exist, and cfn-lint primarily performs static template linting.", "question_zh": "一个安全团队希望CI策略检查在部署开始之前，如果CloudFormation模板缺少必需的标签、违反允许的实例类型或使用不允许的配置，则使之失败。\n\n哪个工具专门为此策略即代码验证而设计？", "options_zh": ["AWS Config合规包，因为它们在开发者管道中合成期间阻止模板部署。", "CloudFormation偏差检测，因为它在部署前根据自定义策略规则评估模板。", "AWS CloudFormation Guard，因为规则文件可以根据组织定义的策略要求验证模板内容。", "仅cfn-lint，因为它在默认情况下强制执行安全策略语义和组织合规性控制。"], "explanation_zh": "CloudFormation Guard专为在部署前根据自定义规则集对模板进行策略即代码验证而设计。它非常适合对结构和合规性要求进行CI门控检查。Config和偏差检测在资源存在后操作，cfn-lint主要执行静态模板检查。"}, {"exam": 4, "id": 61, "question_en": "A platform team needs to validate that all CloudFormation templates comply with security policies (no public S3 buckets, no open security groups, RDS multi-AZ required) before deployment.\n \nWhich tool should they integrate into their CI/CD pipeline?", "options_en": ["Use cfn-lint to validate CloudFormation templates for JSON/YAML syntax errors and AWS resource specification compliance, catching structural issues before any deployment attempt.", "Write CloudFormation Guard rules expressing security policies as code and run them against templates before deployment, blocking non-compliant configurations like unencrypted volumes or missing tags.", "Deploy CloudFormation templates into a sandbox account first, then run AWS Config rules against the provisioned resources to evaluate whether they comply with organizational security policies.", "Create IAM policies that use CloudFormation-specific condition keys to prevent non-compliant resource properties from being specified during stack creation, enforcing guardrails at the API level."], "correct": 1, "explanation_en": "CloudFormation Guard is a policy-as-code tool that validates CloudFormation templates against custom rules written in its domain-specific language. Rules can express requirements like encryption must be enabled, public access must be blocked, and multi-AZ must be configured. Running Guard in the CI/CD pipeline catches violations before deployment, which is faster and safer than post-deployment detection. cfn-lint validates syntax but does not support custom security policy rules.", "question_zh": "一个平台团队需要在部署前验证所有CloudFormation模板是否符合安全策略（禁止公有S3存储桶、禁止开放安全组、要求RDS多可用区）。\n\n他们应该将哪个工具集成到CI/CD管道中？", "options_zh": ["使用cfn-lint验证CloudFormation模板的JSON/YAML语法错误和AWS资源规范合规性，在任何部署尝试之前捕获结构性问题。", "编写CloudFormation Guard规则，将安全策略表达为代码，并在部署前对模板运行它们，阻止不合规的配置，如未加密的卷或缺失的标签。", "首先将CloudFormation模板部署到沙盒账户，然后对配置的资源运行AWS Config规则，评估它们是否符合组织安全策略。", "创建使用CloudFormation特定条件键的IAM策略，阻止在堆栈创建期间指定不合规的资源属性，在API级别强制执行护栏。"], "explanation_zh": "CloudFormation Guard是一个策略即代码工具，根据以其领域特定语言编写的自定义规则验证CloudFormation模板。规则可以表达诸如必须启用加密、必须阻止公共访问以及必须配置多可用区等要求。在CI/CD管道中运行Guard在部署前捕获违规，这比部署后检测更快更安全。cfn-lint验证语法但不支持自定义安全策略规则。"}, {"exam": 4, "id": 62, "question_en": "An organization with 200 accounts needs to ensure every ALB and API Gateway has consistent WAF rules. New resources created by any team should automatically receive the organization's WAF policy.\n \nWhich service provides centralized, automatic WAF management?", "options_en": ["Deploy WAF WebACLs using CloudFormation StackSets across all member accounts and create a Lambda function that monitors new ALB creation events and automatically associates WebACLs with each new ALB.", "Share a centrally managed WAF WebACL from the management account to all member accounts using AWS Resource Access Manager (RAM), allowing each account to associate the shared WebACL with their ALBs.", "Enable AWS Config managed rules to detect ALBs and API Gateways that lack WAF WebACL associations, triggering SNS notifications for the security team to manually associate the organization's WebACL.", "Use AWS Firewall Manager to create a WAF policy that automatically creates and associates WebACLs with all in-scope ALBs and API Gateways across organization accounts, remediating non-compliant resources."], "correct": 3, "explanation_en": "AWS Firewall Manager provides centralized WAF management across an organization. A WAF policy defines rule groups and automatically creates WebACLs in each account/Region, associating them with in-scope resources. When new ALBs or API Gateways are created, Firewall Manager automatically applies the WAF policy. StackSets deploy WAF but do not auto-associate with newly created resources. WAF WebACLs cannot be shared via RAM.", "question_zh": "一个拥有200个账户的组织需要确保每个ALB和API Gateway都具有一致的WAF规则。任何团队创建的新资源都应自动接收组织的WAF策略。\n\n哪个服务提供集中式、自动化的WAF管理？", "options_zh": ["使用CloudFormation StackSets在所有成员账户中部署WAF WebACL，并创建一个Lambda函数监控新ALB创建事件并自动将WebACL与每个新ALB关联。", "使用AWS Resource Access Manager(RAM)将集中管理的WAF WebACL从管理账户共享给所有成员账户，允许每个账户将共享的WebACL与其ALB关联。", "启用AWS Config托管规则检测缺少WAF WebACL关联的ALB和API Gateway，触发SNS通知供安全团队手动关联组织的WebACL。", "使用AWS Firewall Manager创建WAF策略，自动创建WebACL并将其与组织账户中所有范围内的ALB和API Gateway关联，修复不合规的资源。"], "explanation_zh": "AWS Firewall Manager提供跨组织的集中式WAF管理。WAF策略定义规则组，并在每个账户/区域中自动创建WebACL，将它们与范围内的资源关联。当新的ALB或API Gateway被创建时，Firewall Manager自动应用WAF策略。StackSets部署WAF但不自动与新创建的资源关联。WAF WebACL不能通过RAM共享。"}, {"exam": 4, "id": 63, "question_en": "A company has internal security standards beyond the AWS Well-Architected Framework. They want to include company-specific security requirements in Well-Architected reviews so teams are evaluated against both AWS best practices and internal standards in one review.\n \nHow can they extend the Well-Architected Tool?", "options_en": ["Create a custom lens in the AWS Well-Architected Tool that defines the company-specific requirements as additional questions with risk levels and improvement plans, then apply it alongside standard AWS lenses during reviews.", "Modify the default Security pillar questions in the Well-Architected Tool to incorporate company-specific requirements by editing the built-in lens definition directly through the console's lens customization interface.", "Create a parallel internal review process using spreadsheets and checklists that combine relevant AWS best practices with company-specific security standards, running it alongside the Well-Architected review.", "Use AWS Audit Manager with a custom framework containing the company's security control requirements, collecting evidence automatically and presenting assessment results in a format complementary to Well-Architected reviews."], "correct": 0, "explanation_en": "The Well-Architected Tool supports custom lenses that allow organizations to define their own best practices, pillars, and questions. Custom lenses are applied alongside standard AWS lenses, providing a unified review experience covering both AWS and company-specific requirements. Default Well-Architected Framework lenses cannot be modified. Audit Manager is for compliance evidence collection, not architecture reviews.", "question_zh": "一家公司拥有超出AWS Well-Architected Framework的内部安全标准。他们希望在Well-Architected审查中包含公司特定的安全要求，以便在一次审查中同时根据AWS最佳实践和内部标准对团队进行评估。\n\n他们如何扩展Well-Architected Tool？", "options_zh": ["在AWS Well-Architected Tool中创建自定义透镜，将公司特定要求定义为具有风险级别和改进计划的附加问题，然后在审查期间与标准AWS透镜一起应用。", "通过在控制台的透镜自定义界面直接编辑内置透镜定义，修改Well-Architected Tool中的默认安全支柱问题以纳入公司特定要求。", "使用电子表格和检查清单创建并行的内部审查流程，将相关AWS最佳实践与公司特定安全标准结合，与Well-Architected审查并行运行。", "使用AWS Audit Manager，使用包含公司安全控制要求的自定义框架，自动收集证据并以与Well-Architected审查互补的格式呈现评估结果。"], "explanation_zh": "Well-Architected Tool支持自定义透镜，允许组织定义自己的最佳实践、支柱和问题。自定义透镜与标准AWS透镜一起应用，提供涵盖AWS和公司特定要求的统一审查体验。默认的Well-Architected Framework透镜不能修改。Audit Manager用于合规性证据收集，而非架构审查。"}, {"exam": 4, "id": 64, "question_en": "A central networking account manages a Transit Gateway connecting 50 VPCs across 10 AWS accounts. New accounts joining the organization should automatically be able to attach their VPCs without manual sharing configuration.\n \nHow should they configure sharing?", "options_en": ["Create individual VPC peering connections from each new account's VPC to the networking account's Transit Gateway VPC, managing routing through peering route table entries in each account.", "Deploy a separate Transit Gateway in each new account and establish inter-Region Transit Gateway peering connections between them and the central networking account's Transit Gateway.", "Use AWS Resource Access Manager (RAM) to share the Transit Gateway with the entire organization. New accounts automatically see the shared TGW and can create attachments without additional sharing steps.", "Create an IAM role in the networking account that grants new accounts permission to call Transit Gateway APIs directly, allowing each account to manage their own attachments through cross-account role assumption."], "correct": 2, "explanation_en": "RAM integrates with AWS Organizations to share resources like Transit Gateways with the entire organization or specific OUs. When sharing is enabled for the organization, new accounts automatically receive access to the shared Transit Gateway. Account owners can then create VPC attachments from their own accounts. This is the standard approach for centralized Transit Gateway management in multi-account architectures without per-account sharing configuration.", "question_zh": "一个中心网络账户管理着连接10个AWS账户中50个VPC的Transit Gateway。加入组织的新账户应能自动附加其VPC，无需手动共享配置。\n\n他们应该如何配置共享？", "options_zh": ["从每个新账户的VPC到网络账户的Transit Gateway VPC创建单独的VPC对等连接，通过在每个账户中对等路由表条目管理路由。", "在每个新账户中部署单独的Transit Gateway，并在它们与中心网络账户的Transit Gateway之间建立区域间Transit Gateway对等连接。", "使用AWS Resource Access Manager(RAM)与整个组织共享Transit Gateway。新账户自动看到共享的TGW，并可以创建附件而无需额外的共享步骤。", "在网络账户中创建一个IAM角色，授予新账户直接调用Transit Gateway API的权限，允许每个账户通过跨账户角色承担来管理自己的附件。"], "explanation_zh": "RAM与AWS Organizations集成，可以与整个组织或特定OU共享Transit Gateway等资源。当为组织启用共享时，新账户自动获得对共享Transit Gateway的访问权限。账户所有者随后可以从自己的账户创建VPC附件。这是在多账户架构中进行集中式Transit Gateway管理的标准方法，无需为每个账户配置共享。"}, {"exam": 4, "id": 65, "question_en": "A Service Catalog product exposes CloudFormation parameters, but security wants to restrict end users to approved values (for example instance sizes and CIDR ranges) during provisioning.\n \nWhich Service Catalog control should be used?", "options_en": ["Launch constraints, because they validate user-entered parameter values against allowed regex patterns.", "Template constraints, because they define parameter validation rules for product templates at provisioning time.", "TagOptions only, because they override all CloudFormation parameter inputs with predefined secure defaults.", "Notification constraints, because they can deny stack creation when parameters violate organization policies."], "correct": 1, "explanation_en": "Template constraints in Service Catalog are used to enforce parameter rules and value restrictions for products. Launch constraints control which role provisions resources, not parameter validation semantics. This separation lets teams enforce both provisioning permissions and input guardrails.", "question_zh": "Service Catalog产品公开了CloudFormation参数，但安全部门希望在配置期间将最终用户限制为已批准的值（例如实例大小和CIDR范围）。\n\n应该使用哪个Service Catalog控件？", "options_zh": ["启动约束，因为它们根据允许的正则表达式模式验证用户输入的参数值。", "模板约束，因为它们在配置时为产品模板定义参数验证规则。", "仅TagOptions，因为它们用预定义的安全默认值覆盖所有CloudFormation参数输入。", "通知约束，因为它们可以在参数违反组织策略时拒绝堆栈创建。"], "explanation_zh": "Service Catalog中的模板约束用于为产品强制执行参数规则和值限制。启动约束控制哪个角色配置资源，而非参数验证语义。这种分离使团队能够同时强制执行配置权限和输入护栏。"}, {"exam": 5, "id": 1, "question_en": "A financial services company runs Amazon Aurora PostgreSQL databases containing sensitive customer data. The security team wants to detect anomalous login attempts such as logins from unusual IP addresses or failed authentication spikes without installing agents on database instances.\n \nWhich AWS service provides this capability natively?", "options_en": ["Enable Amazon Inspector database scanning to monitor Aurora login patterns and generate findings for anomalous authentication behavior across all instances.", "Configure Amazon Detective with Aurora as a data source to build behavior graphs that identify unusual database login activity automatically.", "Enable Amazon GuardDuty RDS Protection, which monitors Aurora login events and uses ML models to identify anomalous access patterns without agents.", "Enable AWS CloudTrail data events for RDS and create CloudWatch Logs Insights queries to detect unusual login patterns from captured API activity."], "correct": 2, "explanation_en": "GuardDuty RDS Protection monitors and profiles RDS login activity for Aurora databases using ML models to detect anomalous login behavior such as logins from unusual IPs without requiring agents. Inspector scans for software vulnerabilities, not login anomalies. Detective analyzes existing findings but does not directly monitor database authentication. CloudTrail captures API calls to the RDS service, not database-level authentication events.", "question_zh": "一家金融服务公司运行包含敏感客户数据的 Amazon Aurora PostgreSQL 数据库。安全团队希望检测异常登录尝试，例如来自异常 IP 地址的登录或失败的身份验证峰值，而无需在数据库实例上安装代理。\n \n哪个 AWS 服务本身提供此功能？", "options_zh": ["启用 Amazon Inspector 数据库扫描以监控 Aurora 登录模式并生成所有实例中的异常身份验证行为的结果。", "将 Amazon Detective 配置为 Aurora 作为数据源，以构建自动识别异常数据库登录活动的行为图。", "启用 Amazon GuardDuty RDS 保护，该保护可监控 Aurora 登录事件并使用 ML 模型来识别无需代理的异常访问模式。", "为 RDS 启用 AWS CloudTrail 数据事件并创建 CloudWatch Logs Insights 查询以从捕获的 API 活动中检测异常登录模式。"], "explanation_zh": "GuardDuty RDS Protection 使用 ML 模型监控和分析 Aurora 数据库的 RDS 登录活动，以检测异常登录行为，例如来自异常 IP 的登录，而无需代理。 Inspector 扫描软件漏洞，而不是登录异常。 Detective 分析现有调查结果，但不直接监控数据库身份验证。 CloudTrail 捕获对 RDS 服务的 API 调用，而不是数据库级身份验证事件。"}, {"exam": 5, "id": 2, "question_en": "A company has enabled AWS Security Hub across all accounts in their organization. The compliance team needs to evaluate their AWS environment against the CIS AWS Foundations Benchmark while also being able to disable specific controls that do not apply to their environment.\n \nHow should they configure Security Hub to meet this requirement?", "options_en": ["Enable the CIS AWS Foundations Benchmark standard in Security Hub and selectively disable individual controls that are not applicable to the environment.", "Create a custom Security Hub standard that includes only the CIS controls relevant to the environment and deploy it across all member accounts.", "Use AWS Config conformance packs with CIS templates and integrate the results into Security Hub using a custom EventBridge integration pipeline.", "Deploy third-party CIS scanning tools on EC2 instances and forward the results to Security Hub using the BatchImportFindings API for aggregation."], "correct": 0, "explanation_en": "Security Hub supports multiple built-in security standards including CIS AWS Foundations Benchmark. Administrators can enable a standard and selectively disable individual controls that are not relevant. Custom standards cannot be created within Security Hub. Config conformance packs are separate and do not natively feed into Security Hub standards. Third-party tools can send findings but would not provide the integrated standard compliance view.", "question_zh": "一家公司已在其组织中的所有账户中启用 AWS Security Hub。合规团队需要根据 CIS AWS Foundations 基准评估其 AWS 环境，同时还能够禁用不适用于其环境的特定控制。\n \n他们应该如何配置 Security Hub 来满足此要求？", "options_zh": ["在 Security Hub 中启用 CIS AWS Foundations 基准标准，并有选择地禁用不适用于环境的单个控件。", "创建仅包含与环境相关的 CIS 控制的自定义 Security Hub 标准，并将其部署到所有成员帐户。", "将 AWS Config 一致性包与 CIS 模板结合使用，并使用自定义 EventBridge 集成管道将结果集成到 Security Hub 中。", "在 EC2 实例上部署第三方 CIS 扫描工具，并使用 BatchImportFindings API 将结果转发到 Security Hub 进行聚合。"], "explanation_zh": "Security Hub 支持多种内置安全标准，包括 CIS AWS Foundations Benchmark。管理员可以启用标准并有选择地禁用不相关的单个控件。无法在 Security Hub 中创建自定义标准。配置一致性包是独立的，本身并不纳入 Security Hub 标准。第三方工具可以发送调查结果，但不会提供集成的标准合规性视图。"}, {"exam": 5, "id": 3, "question_en": "An auditor requires that all object-level API operations on an S3 bucket containing financial records be logged for compliance. The team needs to capture `GetObject`, `PutObject`, and `DeleteObject` activity for the specific bucket without generating excessive logs for other S3 buckets.\n \nWhat is the MOST efficient configuration?", "options_en": ["Enable S3 server access logging on the target bucket and configure the logs to be delivered to a separate logging bucket for auditor review.", "Configure a CloudTrail trail with data event logging for S3, scoped to the specific bucket ARN, to capture all object-level API operations.", "Enable CloudTrail management events and use CloudWatch Logs metric filters to isolate S3 object-level operations for the target bucket.", "Create a Lambda function triggered by S3 event notifications that logs each object operation to a DynamoDB table for compliance tracking."], "correct": 1, "explanation_en": "CloudTrail data events capture object-level API activity for S3 and can be scoped to specific bucket ARNs, avoiding unnecessary log volume from other buckets. S3 server access logging provides access records but in a different format and without CloudTrail integration for centralized analysis. CloudTrail management events do not capture object-level operations. A custom Lambda function adds unnecessary complexity compared to the native CloudTrail data events feature.", "question_zh": "审计员要求记录包含财务记录的 S3 存储桶上的所有对象级 API 操作以确保合规性。团队需要捕获特定存储桶的“GetObject”、“PutObject”和“DeleteObject”活动，而不为其他 S3 存储桶生成过多日志。\n \n最有效的配置是什么？", "options_zh": ["在目标存储桶上启用 S3 服务器访问日志记录，并将日志配置为传送到单独的日志记录存储桶以供审核员审查。", "使用 S3 的数据事件日志记录配置 CloudTrail 跟踪，范围仅限于特定存储桶 ARN，以捕获所有对象级 API 操作。", "启用 CloudTrail 管理事件并使用 CloudWatch Logs 指标筛选器来隔离目标存储桶的 S3 对象级操作。", "创建由 S3 事件通知触发的 Lambda 函数，将每个对象操作记录到 DynamoDB 表中以进行合规性跟踪。"], "explanation_zh": "CloudTrail 数据事件捕获 S3 的对象级 API 活动，并且可以将范围限定到特定存储桶 ARN，从而避免来自其他存储桶的不必要的日志量。 S3 服务器访问日志记录提供访问记录，但格式不同，并且没有 CloudTrail 集成来进行集中分析。 CloudTrail 管理事件不捕获对象级操作。与本机 CloudTrail 数据事件功能相比，自定义 Lambda 函数增加了不必要的复杂性。"}, {"exam": 5, "id": 4, "question_en": "A security analyst needs to investigate a potential data exfiltration incident by querying VPC Flow Logs stored in CloudWatch Logs. The analyst must identify the top 10 source IP addresses that sent the most traffic to external destinations during a specific 24-hour window.\n \nWhich approach is MOST effective for this ad-hoc investigation?", "options_en": ["Export the CloudWatch Logs group to S3, create an Athena table over the exported data, and run a SQL query to aggregate traffic by source IP.", "Create a CloudWatch Contributor Insights rule on the log group to identify the highest-volume source IPs and review the time-series dashboard output.", "Use Amazon OpenSearch Service to ingest the flow logs, build an index pattern, and run aggregation queries to identify the top source IP addresses.", "Run a CloudWatch Logs Insights query using the `stats` and `sort` commands to aggregate bytes by source address and return the top 10 results."], "correct": 3, "explanation_en": "CloudWatch Logs Insights provides an interactive, purpose-built query language for exploring log data directly within CloudWatch Logs. Analysts can perform ad-hoc investigations without exporting data or provisioning additional services. Exporting to S3 for Athena adds latency. Contributor Insights provides ongoing top-N monitoring but is not as flexible for ad-hoc queries. OpenSearch requires separate infrastructure provisioning.", "question_zh": "安全分析师需要通过查询 CloudWatch Logs 中存储的 VPC 流日志来调查潜在的数据泄露事件。分析师必须确定在特定 24 小时窗口内向外部目标发送最多流量的前 10 个源 IP 地址。\n \n对于这项临时调查，哪种方法最有效？", "options_zh": ["将 CloudWatch Logs 组导出到 S3，根据导出的数据创建 Athena 表，然后运行 ​​SQL 查询以按源 IP 聚合流量。", "在日志组上创建 CloudWatch Contributor Insights 规则，以识别数量最多的源 IP 并查看时间序列仪表板输出。", "使用 Amazon OpenSearch Service 提取流日志、构建索引模式并运行聚合查询来识别排名靠前的源 IP 地址。", "使用“stats”和“sort”命令运行 C​​loudWatch Logs Insights 查询，按源地址聚合字节并返回前 10 个结果。"], "explanation_zh": "CloudWatch Logs Insights 提供了一种交互式、专用查询语言，用于直接在 CloudWatch Logs 中探索日志数据。分析师可以执行临时调查，而无需导出数据或提供额外服务。导出到 Athena 的 S3 会增加延迟。 Contributor Insights 提供持续的 Top-N 监控，但对于临时查询而言不够灵活。 OpenSearch 需要单独的基础设施配置。"}, {"exam": 5, "id": 5, "question_en": "A multinational company collects security logs from AWS workloads in `us-east-1`, `eu-west-1`, and `ap-southeast-1`. They want to centralize all security log data into a single Region for their SOC team to query using Amazon Athena without manually replicating S3 data.\n \nWhich approach achieves this centralization MOST efficiently?", "options_en": ["Enable AWS CloudTrail organization trail with a multi-Region configuration and deliver all logs to a single S3 bucket in the SOC Region.", "Configure Amazon Security Lake with a rollup Region that automatically consolidates security data from all contributing Regions into one location.", "Set up S3 Cross-Region Replication from each Region's log bucket to a central bucket in the SOC Region and query the central bucket with Athena.", "Deploy Amazon Kinesis Data Firehose streams in each Region to forward security logs to a central OpenSearch domain in the SOC Region."], "correct": 1, "explanation_en": "Security Lake supports rollup Regions, which automatically consolidate security data from multiple contributing Regions into a designated Region. This eliminates manual replication and normalizes data into the OCSF format for consistent querying with Athena. CloudTrail organization trails only cover CloudTrail logs, not other security sources. S3 Cross-Region Replication requires manual setup per bucket and does not normalize data formats. Kinesis to OpenSearch adds cost and complexity.", "question_zh": "一家跨国公司从“us-east-1”、“eu-west-1”和“ap-southeast-1”中的 AWS 工作负载收集安全日志。他们希望将所有安全日志数据集中到一个区域中，以便 SOC 团队使用 Amazon Athena 进行查询，而无需手动复制 S3 数据。\n \n哪种方法最有效地实现这种集中化？", "options_zh": ["使用多区域配置启用 AWS CloudTrail 组织跟踪，并将所有日志传送到 SOC 区域中的单个 S3 存储桶。", "使用汇总区域配置 Amazon Security Lake，该区域会自动将所有贡献区域的安全数据整合到一个位置。", "设置从每个区域的日志存储桶到 SOC 区域中的中央存储桶的 S3 跨区域复制，并使用 Athena 查询中央存储桶。", "在每个区域中部署 Amazon Kinesis Data Firehose 流，以将安全日志转发到 SOC 区域中的中央 OpenSearch 域。"], "explanation_zh": "Security Lake 支持汇总区域，可自动将多个贡献区域的安全数据整合到指定区域中。这消除了手动复制并将数据标准化为 OCSF 格式，以便与 Athena 进行一致的查询。 CloudTrail 组织跟踪仅涵盖 CloudTrail 日志，不涵盖其他安全源。 S3 跨区域复制需要每个存储桶手动设置，并且不会标准化数据格式。 Kinesis 到 OpenSearch 增加了成本和复杂性。"}, {"exam": 5, "id": 6, "question_en": "A security operations team shares an Athena environment with data analysts. The security team queries sensitive CloudTrail logs and requires that all query results be encrypted with a specific KMS key. They also need to prevent their query costs from exceeding a monthly budget.\n \nHow should this be configured in Athena?", "options_en": ["Create a dedicated Athena workgroup for the security team with enforced query result encryption using the specified KMS key and a per-query data scan limit.", "Apply an IAM policy to the security team's role that mandates SSE-KMS encryption on the S3 results bucket and set a billing alarm in CloudWatch.", "Configure the default Athena workgroup with KMS encryption for all query results and use SCPs to restrict the data analysts from querying CloudTrail tables.", "Create a separate AWS account for security queries with its own Athena configuration and use RAM to share the Glue Data Catalog tables across accounts."], "correct": 0, "explanation_en": "Athena workgroups provide isolation for different teams with workgroup-level settings including enforced query result encryption with a specific KMS key and data usage controls such as per-query scan limits. These settings override client-side configurations when enforcement is enabled. IAM policies control access but cannot enforce Athena encryption settings. Modifying the default workgroup would affect all users. A separate account is unnecessarily complex for this requirement.", "question_zh": "安全运营团队与数据分析师共享 Athena 环境。安全团队查询敏感的CloudTrail日志，并要求所有查询结果使用特定的KMS密钥进行加密。他们还需要防止查询成本超出每月预算。\n \n在 Athena 中应该如何配置？", "options_zh": ["为安全团队创建专用的 Athena 工作组，使用指定的 KMS 密钥和每个查询的数据扫描限制强制执行查询结果加密。", "将 IAM 策略应用于安全团队的角色，该角色强制要求对 S3 结果存储桶进行 SSE-KMS 加密，并在 CloudWatch 中设置计费警报。", "为所有查询结果配置使用 KMS 加密的默认 Athena 工作组，并使用 SCP 限制数据分析师查询 CloudTrail 表。", "使用自己的 Athena 配置创建单独的 AWS 帐户用于安全查询，并使用 RAM 跨帐户共享 Glue 数据目录表。"], "explanation_zh": "Athena 工作组通过工作组级别设置为不同团队提供隔离，包括使用特定 KMS 密钥强制查询结果加密和数据使用控制（例如每个查询扫描限制）。当启用强制执行时，这些设置会覆盖客户端配置。 IAM 策略控制访问，但无法强制实施 Athena 加密设置。修改默认工作组会影响所有用户。对于此要求来说，单独的帐户不必要地复杂。"}, {"exam": 5, "id": 7, "question_en": "A company ingests 500 GB of security logs daily into Amazon OpenSearch Service. Logs older than 30 days are rarely queried but must be retained for one year to meet compliance requirements. The team wants to reduce storage costs without losing the ability to query historical data.\n \nWhich OpenSearch feature should they implement?", "options_en": ["Enable automated snapshots to back up indices to S3 daily and delete indices older than 30 days, restoring them manually when historical queries are needed.", "Configure cross-cluster replication to a smaller, cost-optimized OpenSearch domain and route historical queries to the replica cluster when required.", "Use Index State Management policies to automatically migrate indices older than 30 days to UltraWarm storage and indices older than 90 days to cold storage.", "Export indices older than 30 days to S3 using a Lambda function and query them with Amazon Athena, removing the data from OpenSearch entirely after export."], "correct": 2, "explanation_en": "OpenSearch UltraWarm and cold storage tiers provide significantly lower-cost storage for infrequently accessed data while keeping it queryable directly within OpenSearch. Index State Management (ISM) policies automate the lifecycle transition between hot, UltraWarm, and cold tiers based on index age. Automated snapshots require manual restoration for queries. Cross-cluster replication duplicates data rather than reducing costs. Exporting to S3 removes the data from OpenSearch and requires a separate query tool.", "question_zh": "一家公司每天将 500 GB 的安全日志提取到 Amazon OpenSearch Service 中。超过 30 天的日志很少被查询，但必须保留一年以满足合规性要求。该团队希望在不失去查询历史数据的能力的情况下降低存储成本。\n \n他们应该实施哪些 OpenSearch 功能？", "options_zh": ["启用自动快照，每天将索引备份到 S3 并删除超过 30 天的索引，并在需要历史查询时手动恢复它们。", "配置跨集群复制到更小的、成本优化的 OpenSearch 域，并在需要时将历史查询路由到副本集群。", "使用索引状态管理策略将超过 30 天的索引自动迁移到 UltraWarm 存储，将超过 90 天的索引自动迁移到冷存储。", "使用 Lambda 函数将超过 30 天的索引导出到 S3，并使用 Amazon Athena 查询它们，导出后从 OpenSearch 中完全删除数据。"], "explanation_zh": "OpenSearch UltraWarm 和冷存储层为不常访问的数据提供成本显着降低的存储，同时保持其可在 OpenSearch 中直接查询。索引状态管理 (ISM) 策略可根据索引寿命自动执行热层、UltraWarm 层和冷层之间的生命周期转换。自动快照需要手动恢复查询。跨集群复制只是复制数据而不是降低成本。导出到 S3 会从 OpenSearch 中删除数据，并且需要单独的查询工具。"}, {"exam": 5, "id": 8, "question_en": "A company runs serverless workloads using AWS Lambda for payment processing. The security team is concerned about compromised Lambda functions making unexpected network connections to cryptocurrency mining pools or command-and-control servers.\n \nWhich feature should they enable to detect this threat?", "options_en": ["Enable Amazon Inspector Lambda standard scanning to analyze function code for network call patterns that match known malicious endpoint signatures.", "Configure VPC Flow Logs for the Lambda function's VPC and create CloudWatch metric filters to alert on connections to known malicious IP addresses.", "Deploy AWS Network Firewall in the Lambda function's VPC with Suricata rules that block connections to cryptocurrency mining pools and C2 servers.", "Enable Amazon GuardDuty Lambda Protection, which monitors network activity from Lambda functions and generates findings for suspicious communication patterns."], "correct": 3, "explanation_en": "GuardDuty Lambda Protection monitors network activity logs from Lambda functions to detect suspicious communication such as connections to known cryptocurrency mining pools or command-and-control servers. Inspector Lambda scanning analyzes code dependencies for vulnerabilities, not runtime network behavior. VPC Flow Logs require Lambda to be VPC-attached and need manual analysis rules. Network Firewall blocks traffic but does not provide detection findings for security investigation.", "question_zh": "一家公司使用 AWS Lambda 运行无服务器工作负载进行支付处理。安全团队担心受感染的 Lambda 函数会与加密货币挖掘池或命令和控制服务器建立意外的网络连接。\n \n他们应该启用哪些功能来检测这种威胁？", "options_zh": ["启用 Amazon Inspector Lambda 标准扫描来分析与已知恶意终端节点签名匹配的网络调用模式的函数代码。", "为 Lambda 函数的 VPC 配置 VPC 流日志，并创建 CloudWatch 指标过滤器，以针对已知恶意 IP 地址的连接发出警报。", "在 Lambda 函数的 VPC 中部署 AWS 网络防火墙，并使用 Suricata 规则阻止与加密货币挖掘池和 C2 服务器的连接。", "启用 Amazon GuardDuty Lambda 保护，该保护可监控 Lambda 函数的网络活动并生成可疑通信模式的发现结果。"], "explanation_zh": "GuardDuty Lambda Protection 监控来自 Lambda 函数的网络活动日志，以检测可疑通信，例如与已知加密货币挖掘池或命令和控制服务器的连接。 Inspector Lambda 扫描分析漏洞的代码依赖性，而不是运行时网络行为。 VPC流日志需要Lambda附加VPC并且需要手动分析规则。网络防火墙会阻止流量，但不会提供安全调查的检测结果。"}, {"exam": 5, "id": 9, "question_en": "An organization's CloudTrail data event costs have increased significantly due to high-volume `kms:Decrypt` and `kms:Encrypt` API calls from application workloads. The security team still needs to log all other data events but wants to exclude these specific KMS operations to reduce costs.\n \nHow should they configure CloudTrail?", "options_en": ["Create a separate CloudTrail trail that only captures KMS events and disable KMS data event logging on the primary trail to split the log volume.", "Use an S3 lifecycle policy on the CloudTrail log bucket to automatically delete log files that contain KMS encryption and decryption API call records.", "Configure advanced event selectors on the trail to exclude KMS data events by specifying `eventSource` equals `kms.amazonaws.com` as an exclusion.", "Apply an SCP that prevents CloudTrail from recording KMS API calls by denying the `cloudtrail:PutEventSelectors` action for KMS-related operations."], "correct": 2, "explanation_en": "CloudTrail advanced event selectors support exclusion filters that allow administrators to exclude specific data event sources such as KMS from logging. By excluding events where `eventSource` equals `kms.amazonaws.com`, the organization can reduce costs without losing visibility into other data events. Creating a separate trail still incurs costs. S3 lifecycle policies delete entire log files, not individual events. SCPs control IAM actions, not CloudTrail recording behavior.", "question_zh": "由于来自应用程序工作负载的大量“kms:Decrypt”和“kms:Encrypt” API 调用，组织的 CloudTrail 数据事件成本显着增加。安全团队仍然需要记录所有其他数据事件，但希望排除这些特定的 KMS 操作以降低成本。\n \n他们应该如何配置 CloudTrail？", "options_zh": ["创建一个单独的 CloudTrail 跟踪，仅捕获 KMS 事件，并在主跟踪上禁用 KMS 数据事件日志记录以拆分日志卷。", "在 CloudTrail 日志存储桶上使用 S3 生命周期策略自动删除包含 KMS 加解密 API 调用记录的日志文件。", "通过指定“eventSource”等于“kms.amazonaws.com”作为排除项，在跟踪上配置高级事件选择器以排除 KMS 数据事件。", "应用 SCP，通过拒绝 KMS 相关操作的“cloudtrail:PutEventSelectors”操作来阻止 CloudTrail 记录 KMS API 调用。"], "explanation_zh": "CloudTrail 高级事件选择器支持排除过滤器，允许管理员从日志记录中排除特定数据事件源（例如 KMS）。通过排除“eventSource”等于“kms.amazonaws.com”的事件，组织可以降低成本，而不会失去对其他数据事件的可见性。创建单独的路径仍然会产生成本。 S3 生命周期策略会删除整个日志文件，而不是单个事件。 SCP 控制 IAM 操作，而不是 CloudTrail 记录行为。"}, {"exam": 5, "id": 10, "question_en": "A company conducts regular penetration testing from a set of known IP addresses. These tests generate a large number of GuardDuty findings that overwhelm the security team's triage workflow. The team wants to prevent GuardDuty from generating findings for traffic originating from these known pen-test IP addresses entirely.\n \nWhat is the BEST approach?", "options_en": ["Upload a trusted IP list to GuardDuty containing the penetration testing IP addresses so that GuardDuty skips finding generation for those sources.", "Create GuardDuty suppression rules with a filter matching the pen-test source IP addresses to auto-archive the findings and remove them from active view.", "Add the penetration testing IP addresses to a GuardDuty threat intelligence list and configure the threat list action to ignore rather than alert on traffic.", "Configure a VPC Network ACL that blocks the pen-test IP addresses during non-testing periods so that GuardDuty does not observe the test traffic patterns."], "correct": 0, "explanation_en": "GuardDuty trusted IP lists prevent findings from being generated for traffic originating from the listed IP addresses. This differs from suppression rules, which still generate findings but auto-archive them. For known pen-test sources where no findings are desired at all, trusted IP lists are the correct mechanism. Threat lists are for marking IPs as malicious, not trusted. NACLs would block legitimate test traffic rather than suppressing GuardDuty findings.", "question_zh": "一家公司定期对一组已知 IP 地址进行渗透测试。这些测试生成大量 GuardDuty 结果，压垮了安全团队的分类工作流程。该团队希望完全阻止 GuardDuty 生成源自这些已知渗透测试 IP 地址的流量的结果。\n \n最好的方法是什么？", "options_zh": ["将包含渗透测试 IP 地址的可信 IP 列表上传到 GuardDuty，以便 GuardDuty 跳过这些源的查找生成。", "使用与渗透测试源 IP 地址匹配的过滤器创建 GuardDuty 抑制规则，以自动存档结果并将其从活动视图中删除。", "将渗透测试 IP 地址添加到 GuardDuty 威胁情报列表，并将威胁列表操作配置为忽略而不是对流量发出警报。", "配置 VPC 网络 ACL，在非测试期间阻止渗透测试 IP 地址，以便 GuardDuty 不会观察测试流量模式。"], "explanation_zh": "GuardDuty 可信 IP 列表可防止针对源自所列 IP 地址的流量生成调查结果。这与抑制规则不同，抑制规则仍然会生成结果，但会自动存档它们。对于根本不需要任何结果的已知渗透测试源，可信 IP 列表是正确的机制。威胁列表用于将 IP 标记为恶意的、不可信的。 NACL 将阻止合法的测试流量，而不是抑制 GuardDuty 发现结果。"}, {"exam": 5, "id": 11, "question_en": "During an incident response investigation, a security analyst needs to capture volatile memory from a potentially compromised EC2 instance running Linux. The memory capture must preserve evidence for forensic analysis while minimizing disruption to the running instance.\n \nWhat is the RECOMMENDED approach?", "options_en": ["Stop the EC2 instance and create an EBS snapshot of the root volume to capture the memory contents that were paged to disk before the instance shutdown.", "Use SSM Run Command to execute a memory acquisition tool such as LiME on the instance, streaming the memory dump to an S3 bucket in a forensic account.", "Create an AMI from the running instance, which captures a point-in-time image of both the disk and memory state for offline forensic analysis in a separate account.", "Enable EC2 instance hibernation and hibernate the instance to write the contents of RAM to the root EBS volume for subsequent forensic extraction and review."], "correct": 1, "explanation_en": "Using SSM Run Command to execute a memory acquisition tool like LiME (Linux Memory Extractor) on the live instance captures volatile memory without stopping it. The memory dump can be streamed to an isolated S3 bucket for analysis. Stopping the instance destroys volatile memory. Creating an AMI captures disk state but not memory contents. Hibernation writes memory to disk but requires prior configuration and changes the instance state, potentially alerting an attacker.", "question_zh": "在事件响应调查期间，安全分析师需要从运行 Linux 的可能受到威胁的 EC2 实例中捕获易失性内存。内存捕获必须保留证据以供取证分析，同时最大限度地减少对运行实例的干扰。\n \n推荐的方法是什么？", "options_zh": ["停止 EC2 实例并创建根卷的 EBS 快照，以捕获在实例关闭之前分页到磁盘的内存内容。", "使用 SSM Run Command 在实例上执行内存获取工具（例如 LiME），将内存转储流式传输到取证帐户中的 S3 存储桶。", "从正在运行的实例创建 AMI，该实例捕获磁盘和内存状态的时间点映像，以便在单独的账户中进行离线取证分析。", "启用 EC2 实例休眠并使实例休眠，以将 RAM 的内容写入根 EBS 卷，以供后续取证提取和审查。"], "explanation_zh": "使用 SSM Run Command 在实时实例上执行 LiME (Linux Memory Extractor) 等内存获取工具，无需停止即可捕获易失性内存。内存转储可以流式传输到隔离的 S3 存储桶以进行分析。停止实例会破坏易失性内存。创建 AMI 会捕获磁盘状态，但不会捕获内存内容。休眠会将内存写入磁盘，但需要事先配置并更改实例状态，这可能会警告攻击者。"}, {"exam": 5, "id": 12, "question_en": "A company needs to automate their incident management process when GuardDuty detects a high-severity finding. Requirements include automatic creation of an incident record, predefined escalation contacts, and an associated Systems Manager Automation runbook for initial containment.\n \nWhich service should they use to orchestrate this process?", "options_en": ["Create EventBridge rules that match GuardDuty findings and trigger a Step Functions state machine to coordinate notifications and execute runbook steps.", "Configure Security Hub to aggregate GuardDuty findings and use Security Hub custom actions to manually trigger Lambda functions for incident orchestration.", "Set up an Amazon SNS topic with GuardDuty as a publisher and configure multiple subscriber Lambda functions that handle escalation and containment tasks.", "Configure AWS Systems Manager Incident Manager with a response plan that defines escalation contacts, notification channels, and associated automation runbooks."], "correct": 3, "explanation_en": "Incident Manager provides a purpose-built incident management service that integrates with EventBridge to automatically create incidents from GuardDuty findings. Response plans define escalation contacts, chat channels, and SSM Automation runbooks that execute automatically when an incident is created. Step Functions can orchestrate workflows but requires custom development for incident management features. Security Hub custom actions require manual triggering. SNS-based solutions lack the structured incident lifecycle management.", "question_zh": "当 GuardDuty 检测到高严重性问题时，公司需要自动化其事件管理流程。要求包括自动创建事件记录、预定义的升级联系人以及用于初始遏制的关联 Systems Manager Automation 操作手册。\n \n他们应该使用哪种服务来协调这个过程？", "options_zh": ["创建与 GuardDuty 结果匹配的 EventBridge 规则并触发 Step Functions 状态机来协调通知并执行 Runbook 步骤。", "配置 Security Hub 以聚合 GuardDuty 结果并使用 Security Hub 自定义操作手动触发 Lambda 函数以进行事件编排。", "使用 GuardDuty 作为发布者设置 Amazon SNS 主题，并配置多个订阅者 Lambda 函数来处理升级和遏制任务。", "使用响应计划配置 AWS Systems Manager 事件管理器，该计划定义升级联系人、通知通道和关联的自动化运行手册。"], "explanation_zh": "事件管理器提供了专门构建的事件管理服务，该服务与 EventBridge 集成，可根据 GuardDuty 发现结果自动创建事件。响应计划定义了升级联系人、聊天渠道和 SSM 自动化运行手册，这些运行手册在创建事件时自动执行。 Step Functions 可以编排工作流程，但需要自定义开发事件管理功能。 Security Hub 自定义操作需要手动触发。基于 SNS 的解决方案缺乏结构化的事件生命周期管理。"}, {"exam": 5, "id": 13, "question_en": "After a GuardDuty finding indicates potential credential compromise of an IAM role, a security analyst wants to understand the historical behavior of that role over the past 30 days. They need to see API call volumes, geolocation patterns, and resource access history to determine whether the activity is genuinely anomalous.\n \nWhich service provides this behavioral analysis capability?", "options_en": ["Use Amazon Detective to view the entity profile for the IAM role, which shows a behavior graph with API call history, geolocations, and resource interactions.", "Query CloudTrail Lake with SQL to aggregate all API calls made by the IAM role over 30 days and create a dashboard with the results in Amazon QuickSight.", "Use IAM Access Analyzer to generate an access report for the role that shows which services and resources were accessed during the investigation period.", "Enable CloudWatch Contributor Insights on the CloudTrail log group to identify the top API actions and source IPs associated with the role over 30 days."], "correct": 0, "explanation_en": "Amazon Detective automatically builds behavior graphs from CloudTrail, VPC Flow Logs, and GuardDuty findings. Entity profiles for IAM roles show historical API call volumes, geolocation patterns, and resource interactions over a rolling time window providing the contextual analysis needed to determine whether activity is anomalous. CloudTrail Lake provides raw query capability but requires manual analysis. Access Analyzer evaluates policy permissions, not activity history. Contributor Insights shows top contributors but lacks the integrated entity behavior view.", "question_zh": "GuardDuty 发现表明 IAM 角色可能存在凭证泄露后，安全分析师希望了解该角色在过去 30 天内的历史行为。他们需要查看 API 调用量、地理位置模式和资源访问历史记录，以确定活动是否确实存在异常。\n \n哪种服务提供这种行为分析功能？", "options_zh": ["使用 Amazon Detective 查看 IAM 角色的实体配置文件，其中显示包含 API 调用历史记录、地理位置和资源交互的行为图。", "使用 SQL 查询 CloudTrail Lake，以聚合 IAM 角色在 30 天内发出的所有 API 调用，并在 Amazon QuickSight 中创建包含结果的控制面板。", "使用 IAM 访问分析器为角色生成访问报告，显示在调查期间访问了哪些服务和资源。", "在 CloudTrail 日志组上启用 CloudWatch Contributor Insights，以识别 30 天内与该角色关联的最常见 API 操作和源 IP。"], "explanation_zh": "Amazon Detective 根据 CloudTrail、VPC 流日志和 GuardDuty 结果自动构建行为图。 IAM 角色的实体配置文件显示滚动时间窗口内的历史 API 调用量、地理位置模式和资源交互，提供确定活动是否异常所需的上下文分析。 CloudTrail Lake提供原始查询功能，但需要手动分析。访问分析器评估策略权限，而不是活动历史记录。贡献者洞察显示了顶级贡献者，但缺乏集成的实体行为视图。"}, {"exam": 5, "id": 14, "question_en": "A reliability engineering team is running AWS Fault Injection Service experiments that simulate EC2 instance terminations in production. They need a safety mechanism that automatically halts the experiment if the application's error rate exceeds a defined threshold during the test.\n \nWhich FIS feature provides this safeguard?", "options_en": ["Configure the FIS experiment template with a rollback action that reverts all injected faults when a CloudWatch alarm transitions to the ALARM state.", "Set up an EventBridge rule that monitors the application error rate metric and invokes a Lambda function to call the `StopExperiment` API automatically.", "Define stop conditions in the FIS experiment template that reference CloudWatch alarms, causing the experiment to halt automatically if the alarm triggers.", "Enable FIS experiment logging to CloudWatch and create a metric filter with an associated alarm that sends an SNS notification to the operations team."], "correct": 2, "explanation_en": "FIS stop conditions allow you to reference CloudWatch alarms in the experiment template. If a stop condition alarm enters the ALARM state during the experiment, FIS automatically stops the experiment and attempts to roll back injected faults. This is the native safety mechanism designed for this purpose. FIS does not have a separate rollback action type. EventBridge with Lambda adds complexity and latency compared to native stop conditions. Logging with metric filters provides notification but does not automatically stop the experiment.", "question_zh": "可靠性工程团队正在运行 AWS 故障注入服务实验，模拟生产中的 EC2 实例终止。他们需要一种安全机制，如果应用程序的错误率在测试期间超过定义的阈值，该机制可以自动停止实验。\n \n哪个 FIS 功能提供了这种保障？", "options_zh": ["使用回滚操作配置 FIS 实验模板，该操作可在 CloudWatch 警报转换为 ALARM 状态时恢复所有注入的故障。", "设置一个 EventBridge 规则来监控应用程序错误率指标并调用 Lambda 函数来自动调用“StopExperiment”API。", "在引用 CloudWatch 警报的 FIS 实验模板中定义停止条件，使实验在警报触发时自动停止。", "启用 CloudWatch 的 FIS 实验日志记录，并创建一个指标过滤器以及向运营团队发送 SNS 通知的关联警报。"], "explanation_zh": "FIS 停止条件允许您在实验模板中引用 CloudWatch 警报。如果实验期间停止条件警报进入 ALARM 状态，FIS 会自动停止实验并尝试回滚注入的故障。这是为此目的而设计的本机安全机制。 FIS 没有单独的回滚操作类型。与本机停止条件相比，具有 Lambda 的 EventBridge 增加了复杂性和延迟。使用指标过滤器进行日志记录会提供通知，但不会自动停止实验。"}, {"exam": 5, "id": 15, "question_en": "A company uses AWS Shield Advanced to protect their internet-facing Application Load Balancer. They want Shield Advanced to detect DDoS attacks more accurately by considering the application's health status, reducing false positives during normal traffic spikes.\n \nHow should they configure Shield Advanced for health-based detection?", "options_en": ["Enable Shield Advanced automatic application layer mitigation and configure WAF rate-based rules that adjust thresholds based on application response codes.", "Create a CloudWatch composite alarm that combines DDoS metrics with application health metrics and link the composite alarm to a Shield Advanced protection.", "Configure Shield Advanced to use an Amazon CloudFront distribution with origin failover so that health checks are automatically included in DDoS detection.", "Associate a Route 53 health check with the Shield Advanced protected resource so that Shield uses application health status to improve detection accuracy."], "correct": 3, "explanation_en": "Shield Advanced supports health-based detection by associating a Route 53 health check with a protected resource. When the health check reports unhealthy during a potential DDoS event, Shield Advanced uses this signal to detect attacks more quickly and with greater accuracy, reducing false positives during legitimate traffic spikes. CloudWatch composite alarms are not directly integrated with Shield detection. CloudFront origin failover handles availability but does not improve Shield detection. WAF rate-based rules are separate from Shield's detection mechanism.", "question_zh": "一家公司使用 AWS Shield Advanced 来保护其面向互联网的 Application Load Balancer。他们希望 Shield Advanced 通过考虑应用程序的运行状况来更准确地检测 DDoS 攻击，从而减少正常流量高峰期间的误报。\n \n他们应该如何配置 Shield Advanced 来进行基于健康的检测？", "options_zh": ["启用 Shield Advanced 自动应用程序层缓解并配置基于 WAF 速率的规则，根据应用程序响应代码调整阈值。", "创建将 DDoS 指标与应用程序运行状况指标相结合的 CloudWatch 复合警报，并将复合警报链接到 Shield Advanced 防护。", "配置 Shield Advanced 以使用具有源故障转移功能的 Amazon CloudFront 发行版，以便将运行状况检查自动包含在 DDoS 检测中。", "将 Route 53 运行状况检查与 Shield Advanced 受保护资源关联，以便 Shield 使用应用程序运行状况来提高检测准确性。"], "explanation_zh": "Shield Advanced 通过将 Route 53 运行状况检查与受保护资源关联来支持基于运行状况的检测。当健康检查在潜在的 DDoS 事件期间报告健康状况不佳时，Shield Advanced 使用此信号更快、更准确地检测攻击，从而减少合法流量高峰期间的误报。 CloudWatch 复合警报不直接与 Shield 检测集成。 CloudFront 源故障转移可处理可用性，但不会改进 Shield 检测。基于 WAF 速率的规则与 Shield 的检测机制是分开的。"}, {"exam": 5, "id": 16, "question_en": "A security operations team using AWS Security Hub wants to enable analysts to trigger specific remediation workflows directly from the Security Hub console when reviewing findings. For example, an analyst should be able to select a finding and initiate an automated quarantine of the affected EC2 instance.\n \nWhich Security Hub feature enables this workflow?", "options_en": ["Configure Security Hub automation rules with specific criteria that automatically trigger remediation Lambda functions whenever matching findings are received.", "Create Security Hub custom actions that send selected findings to EventBridge, where rules trigger the appropriate remediation workflows such as Lambda functions.", "Set up Security Hub integrations with AWS Systems Manager OpsCenter to automatically create OpsItems that link to predefined SSM Automation documents.", "Enable Security Hub member account delegation so that individual analysts can execute remediation scripts directly within the Security Hub findings dashboard."], "correct": 1, "explanation_en": "Security Hub custom actions allow analysts to select findings in the console and manually send them to EventBridge, which then triggers downstream remediation workflows such as Lambda functions or Step Functions. This provides an analyst-in-the-loop mechanism for initiating automated responses. Automation rules trigger automatically without analyst intervention. OpsCenter integration creates OpsItems but does not provide the same direct analyst-triggered workflow. Security Hub does not support executing scripts directly from the console.", "question_zh": "使用 AWS Security Hub 的安全运营团队希望分析师能够在审查结果时直接从 Security Hub 控制台触发特定的修复工作流程。例如，分析师应该能够选择一个发现并对受影响的 EC2 实例启动自动隔离。\n \n哪个 Security Hub 功能支持此工作流程？", "options_zh": ["使用特定标准配置 Security Hub 自动化规则，只要收到匹配的结果，这些规则就会自动触发修复 Lambda 函数。", "创建 Security Hub 自定义操作，将选定的结果发送到 EventBridge，其中规则会触发适当的修复工作流程，例如 Lambda 函数。", "设置 Security Hub 与 AWS Systems Manager OpsCenter 的集成，以自动创建链接到预定义 SSM 自动化文档的 OpsItem。", "启用 Security Hub 成员帐户委派，以便各个分析师可以直接在 Security Hub 结果仪表板中执行修复脚本。"], "explanation_zh": "Security Hub 自定义操作允许分析师在控制台中选择结果并将其手动发送到 EventBridge，然后 EventBridge 会触发下游修复工作流程，例如 Lambda 函数或 Step Functions。这提供了用于启动自动响应的分析师在环机制。自动化规则自动触发，无需分析师干预。 OpsCenter 集成会创建 OpsItem，但不提供相同的直接分析师触发的工作流程。 Security Hub 不支持直接从控制台执行脚本。"}, {"exam": 5, "id": 17, "question_en": "During an incident response, the security team needs to analyze a compromised EC2 instance without allowing it to communicate with any other resources or the internet. The analysis must occur in an isolated environment that preserves the instance's disk contents and network configuration metadata for forensic review.\n \nWhat is the RECOMMENDED forensic isolation approach?", "options_en": ["Create an EBS snapshot of the instance's volumes, launch a new instance from the snapshot in an isolated VPC with no internet gateway or NAT gateway attached.", "Modify the instance's security group to remove all inbound and outbound rules, effectively blocking all network traffic while keeping the instance running in place.", "Stop the instance, detach its EBS volumes, and attach them to a forensic workstation in the same VPC to analyze the disk contents without any network connectivity.", "Move the instance to a dedicated placement group with no other instances and apply a network ACL that denies all inbound and outbound traffic on the subnet."], "correct": 0, "explanation_en": "Creating EBS snapshots and launching from them in an isolated VPC with no IGW, NAT, or peering is the recommended forensic approach. It preserves the original evidence intact while providing a safe analysis environment. Modifying security groups on the live instance risks the attacker detecting the change and destroying evidence. Stopping and detaching volumes may lose volatile state and modifies the original evidence. Dedicated placement groups do not provide network isolation.", "question_zh": "在事件响应期间，安全团队需要分析受损的 EC2 实例，但不允许其与任何其他资源或互联网进行通信。分析必须在隔离环境中进行，该环境保留实例的磁盘内容和网络配置元数据以供取证审查。\n \n推荐的法医隔离方法是什么？", "options_zh": ["创建实例卷的 EBS 快照，在未连接互联网网关或 NAT 网关的隔离 VPC 中从快照启动新实例。", "修改实例的安全组以删除所有入站和出站规则，有效阻止所有网络流量，同时保持实例正常运行。", "停止实例，分离其 EBS 卷，并将它们附加到同一 VPC 中的取证工作站，以在没有任何网络连接的情况下分析磁盘内容。", "将实例移动到没有其他实例的专用置放群组，并应用拒绝子网上所有入站和出站流量的网络 ACL。"], "explanation_zh": "建议的取证方法是创建 EBS 快照并在没有 IGW、NAT 或对等互连的隔离 VPC 中启动它们。它完整​​地保留了原始证据，同时提供了安全的分析环境。修改实时实例上的安全组可能会导致攻击者检测到更改并破坏证据。停止和分离卷可能会丢失易失状态并修改原始证据。专用置放群组不提供网络隔离。"}, {"exam": 5, "id": 18, "question_en": "A compliance requirement mandates that the company regularly validates their backup recovery process by performing automated restore tests. The restored resources must be automatically cleaned up after validation to avoid ongoing costs from leftover test resources.\n \nWhich AWS Backup feature satisfies this requirement?", "options_en": ["Create an AWS Backup audit framework with a control that checks whether recovery points can be restored, generating a compliance report without actually restoring data.", "Use AWS Backup cross-account backup policies to replicate backups to a test account and manually restore them on a quarterly schedule for validation purposes.", "Configure AWS Backup restore testing plans t
