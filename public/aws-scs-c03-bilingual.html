 "options_en": ["Fairness - Considering impacts on different stakeholder groups and ensuring equitable outcomes", "Profitability - Ensuring AI systems maximize revenue while minimizing operational costs", "Automation - Eliminating human oversight to increase processing speed and efficiency", "Cost Optimization - Reducing infrastructure spending while maintaining AI model accuracy"], "correct": 0, "explanation_en": "AWS's Responsible AI Framework defines eight key dimensions across the AI lifecycle: Fairness (equitable outcomes across stakeholder groups), Transparency, Explainability, Accountability, Privacy and Security, Safety, Controllability, and Veracity and Robustness. Fairness is the only option from the list that corresponds to an actual dimension of the framework.\n \nWhy the other options are incorrect:\n\nProfitability — maximizing revenue while minimizing costs: Profitability is not a dimension of the AWS Responsible AI Framework. The framework focuses on ethical, safe, and equitable AI deployment, not business financial outcomes.\nAutomation — eliminating human oversight to increase speed: This directly contradicts a core Responsible AI principle. For consequential decisions (such as loan approvals), AWS requires appropriate human oversight, rigorous testing, and use case-specific safeguards. Eliminating human oversight is explicitly discouraged for high-stakes AI applications.\nCost Optimization — reducing infrastructure spending: Cost optimization is not a Responsible AI dimension. It is an operational and architectural consideration addressed elsewhere in the AWS Well-Architected Framework, not in the Responsible AI principles.\n", "question_zh": "您的公司正在 AWS 上部署一个生成式 AI 应用程序，用于贷款审批推荐。安全和合规团队希望确保系统在整个 AI 生命周期中遵循 AWS Responsible AI 原则。\n\n哪个维度是 AWS Responsible AI 框架的一部分？", "options_zh": ["公平性——考虑对不同利益相关者群体的影响并确保公平的结果", "盈利能力——确保 AI 系统在最小化运营成本的同时最大化收入", "自动化——消除人工监督以提高处理速度和效率", "成本优化——在保持 AI 模型准确性的同时减少基础设施支出"], "explanation_zh": "AWS Responsible AI 框架在整个 AI 生命周期中定义了八个关键维度：公平性（跨利益相关者群体的公平结果）、透明度、可解释性、问责制、隐私和安全、安全性、可控性以及真实性和鲁棒性。公平性是列表中唯一对应于框架实际维度的选项。\n\n为什么其他选项不正确：\n\n盈利能力——在最小化成本的同时最大化收入：盈利能力不是 AWS Responsible AI 框架的维度。该框架关注道德、安全和公平的 AI 部署，而不是业务财务结果。\n自动化——消除人工监督以提高速度：这与核心 Responsible AI 原则直接矛盾。对于后果性决策（如贷款审批），AWS 要求适当的人工监督、严格的测试和针对特定用例的安全措施。消除人工监督对于高风险 AI 应用是明确不鼓励的。\n成本优化——减少基础设施支出：成本优化不是 Responsible AI 维度。它是在 AWS Well-Architected Framework 中处理的操作和架构考虑因素，而不是 Responsible AI 原则。"}, {"exam": 1, "id": 48, "question_en": "A healthcare company is building a patient support chatbot using Amazon Bedrock with Claude foundation model. They need to implement safeguards to prevent the AI from providing medical advice, protect patient privacy, and detect when the model generates inaccurate information (hallucinations).\n \nWhich Amazon Bedrock Guardrails policy BEST addresses the primary safety concern in this scenario?", "options_en": ["Content moderation to filter harmful content including hate speech and violence", "PII redaction to detect and mask personally identifiable information in inputs and responses", "Denied topics policy to define and block topics such as medical diagnosis and treatment advice", "Automated cost optimization to reduce foundation model inference charges"], "correct": 2, "explanation_en": "The denied topics policy is the most directly applicable Bedrock Guardrails policy for this scenario. It allows you to define a list of topics — such as medical diagnosis, prescriptions, and treatment advice — that the guardrail will detect and block in both prompts and responses. When the model or the user touches a denied topic, the guardrail returns a configurable blocked message instead of the model output. This is the guardrail specifically designed to keep the chatbot within its intended support role and prevent liability from unauthorized medical advice.\n \nWhy the other options are incorrect:\n\nContent moderation (content filters): Content filters detect broadly harmful content such as hate speech, violence, sexual content, and insults. A patient asking for a diagnosis is not producing harmful content in the content-filter sense — the concern is the topic, not the toxicity — so this policy would not trigger.\nPII redaction (sensitive information filters): Sensitive information filters detect and mask personally identifiable information in inputs and responses, which supports HIPAA compliance and patient privacy. This is a valuable complementary guardrail for healthcare use cases, but it does not prevent the chatbot from providing medical advice — which is the primary safety concern in this scenario.\nAutomated cost optimization: This is not an Amazon Bedrock Guardrails policy type at all. The five Guardrails policy types are: content filters, denied topics, word filters, sensitive information filters, and contextual grounding checks. Cost optimization is not among them.\n\n \nNote: A complete production implementation would combine denied topics with sensitive information filters (PII) and contextual grounding checks (hallucination detection). No single guardrail policy covers all three stated requirements, but the denied topics policy is the one most directly addressing the primary risk of a healthcare chatbot dispensing medical advice.", "question_zh": "一家医疗保健公司正在使用 Amazon Bedrock 配合 Claude 基础模型构建患者支持聊天机器人。他们需要实施安全措施，以防止 AI 提供医疗建议、保护患者隐私，并检测模型何时生成不准确的信息（幻觉）。\n\n哪个 Amazon Bedrock Guardrails 策略最能解决此场景中的主要安全问题？", "options_zh": ["内容审核以过滤有害内容，包括仇恨言论和暴力", "PII 修订以检测和屏蔽输入和响应中的个人身份信息", "拒绝主题策略以定义和阻止医疗诊断和治疗建议等主题", "自动成本优化以减少基础模型推理费用"], "explanation_zh": "拒绝主题策略是此场景中最直接适用的 Bedrock Guardrails 策略。它允许您定义主题列表——如医疗诊断、处方和治疗建议——护栏将在提示和响应中检测并阻止这些主题。当模型或用户触及被拒绝的主题时，护栏返回可配置的阻止消息而不是模型输出。这是专门设计用于保持聊天机器人在其预期的支持角色内并防止未经授权医疗建议导致的责任的护栏。\n\n为什么其他选项不正确：\n\n内容审核（内容过滤器）：内容过滤器检测广泛有害内容，如仇恨言论、暴力、色情内容和侮辱。患者请求诊断在内容过滤意义上不会产生有害内容——关注点是主题而不是毒性——因此此策略不会触发。\nPII 修订（敏感信息过滤器）：敏感信息过滤器检测和屏蔽输入和响应中的个人身份信息，这支持 HIPAA 合规和患者隐私。这是医疗保健用例的有价值的补充护栏，但它不能防止聊天机器人提供医疗建议——这是此场景中的主要安全关注点。\n自动成本优化：这根本不是 Amazon Bedrock Guardrails 策略类型。五种 Guardrails 策略类型是：内容过滤器、拒绝主题、词语过滤器、敏感信息过滤器和上下文基础检查。成本优化不在其中。\n\n注意：完整的生产实施会将拒绝主题与敏感信息过滤器（PII）和上下文基础检查（幻觉检测）结合使用。没有单一的护栏策略涵盖所有三个所述要求，但拒绝主题策略是最直接解决提供医疗建议的医疗聊天机器人的主要风险的策略。"}, {"exam": 1, "id": 49, "question_en": "A financial services company is implementing an AI system on AWS to automate credit risk assessments for mortgage applications. The system will analyze applicant financial data and make preliminary lending decisions. The compliance team is reviewing whether this requires human oversight under AWS Responsible AI guidelines.\n \nAccording to AWS Responsible AI principles, which approach correctly implements oversight for this use case?", "options_en": ["Fully automate the lending decisions since AI models are more objective and consistent than humans; deploy the system with automated model monitoring only.", "Implement human oversight for all lending decisions because this is a consequential decision impacting financial rights; include human review, rigorous testing, and use case-specific safeguards.", "Use AI for final lending decisions but require human approval only for loan denials to reduce bias and improve customer experience.", "Implement a hybrid approach where AI makes decisions for loan amounts under $50,000, and humans review only larger loans to balance efficiency with oversight."], "correct": 1, "explanation_en": "Under AWS Responsible AI principles, mortgage lending is classified as a consequential decision — one that affects fundamental rights such as access to credit and housing. For consequential decisions, AWS requires three things: appropriate human oversight, rigorous testing and validation, and use case-specific safeguards. The correct approach applies all three: human reviewers evaluate AI recommendations before final decisions are made, the model is tested for fairness and bias across demographic groups, and safeguards such as explainability, audit trails, and an applicant appeals process are built in.\n \nWhy the other options are incorrect:\n\nFully automate lending decisions with only automated model monitoring: This directly violates the AWS Responsible AI requirement for human oversight on consequential decisions. AI objectivity does not remove the need for human accountability — models can encode historical bias and produce systematically unfair outcomes that automated monitoring alone will not catch or correct.\nHuman approval only for loan denials: Approvals are equally subject to bias and error as denials. An AI system that over-approves certain demographic groups or approves unsuitable applicants also causes harm. Limiting human review to denials provides incomplete oversight and does not satisfy the requirement for review of all consequential decisions.\nHybrid approach based on loan amount threshold: The dollar amount of a mortgage does not change whether the decision is consequential. A $40,000 loan decision impacts the applicant's financial rights just as much as a $500,000 one. AWS Responsible AI principles do not allow arbitrary thresholds to substitute for genuine human oversight of consequential decisions.\n", "question_zh": "一家金融服务公司正在 AWS 上实施一个 AI 系统，用于自动化抵押申请的信用风险评估。该系统将分析申请人财务数据并做出初步贷款决策。合规团队正在审查根据 AWS Responsible AI 指南是否需要人工监督。\n\n根据 AWS Responsible AI 原则，哪种方法正确实施了对此用例的监督？", "options_zh": ["完全自动化贷款决策，因为 AI 模型比人类更客观和一致；仅部署自动化模型监控。", "为所有贷款决策实施人工监督，因为这是影响财务权利的后果性决策；包括人工审查、严格测试和针对用例的安全措施。", "使用 AI 进行最终贷款决策，但仅要求人工批准贷款拒绝以减少偏见并改善客户体验。", "实施混合方法，AI 对 50,000 美元以下的贷款金额做出决策，人类仅审查较大贷款以平衡效率与监督。"], "explanation_zh": "根据 AWS Responsible AI 原则，抵押贷款被归类为后果性决策——影响基本权利（如信贷和住房获取权）的决策。对于后果性决策，AWS 要求三件事：适当的人工监督、严格的测试和验证、以及针对用例的安全措施。正确的方法应用所有三项：人工审查员在做出最终决策前评估 AI 建议，模型在人口群体间测试公平性和偏见，并内置可解释性、审计跟踪和申请人申诉流程等安全措施。\n\n为什么其他选项不正确：\n\n完全自动化贷款决策仅配合自动化模型监控：这直接违反了 AWS Responsible AI 对后果性决策要求人工监督的规定。AI 客观性不消除对人工问责的需求——模型可能编码历史偏见并产生系统性不公平的结果，而仅自动化监控无法捕获或纠正。\n仅对贷款拒绝要求人工批准：批准与拒绝一样容易受到偏见和错误的影响。过度批准某些人口群体或批准不合适申请人的 AI 系统也会造成伤害。将人工审查限制在拒绝上提供了不完整的监督，不满足审查所有后果性决策的要求。\n基于贷款金额阈值的混合方法：抵押贷款的金额不改变决策是否为后果性。40,000 美元的贷款决策对申请人财务权利的影响与 500,000 美元的决策一样。AWS Responsible AI 原则不允许任意阈值替代对后果性决策的真正人工监督。"}, {"exam": 1, "id": 59, "question_en": "An IAM user named `developer-john` belongs to a group called `Developers` and has an inline policy directly attached. The user attempts to delete an S3 object at `s3://production-data/config.json`. The policies are as follows:\n \nGroup Policy (Developers):\n`{\n \"Effect\": \"Allow\",\n \"Action\": \"s3:*\",\n \"Resource\": \"arn:aws:s3:::production-data/*\"\n}`\n \nUser Inline Policy:\n`{\n \"Effect\": \"Deny\",\n \"Action\": \"s3:DeleteObject\",\n \"Resource\": \"arn:aws:s3:::production-data/config.json\"\n}`\n \nS3 Bucket Policy:\n`{\n \"Effect\": \"Allow\",\n \"Principal\": {\"AWS\": \"arn:aws:iam::123456789012:root\"},\n \"Action\": \"s3:DeleteObject\",\n \"Resource\": \"arn:aws:s3:::production-data/*\"\n}`\n \nWhat is the result of the delete operation?", "options_en": ["The operation is ALLOWED because the S3 bucket policy explicitly allows the action for all principals in the account, and resource-based policies take precedence over identity-based policies.", "The operation is DENIED because the explicit Deny in the user inline policy overrides all Allow statements, following the principle that Deny always wins in IAM policy evaluation.", "The operation is ALLOWED because the group policy provides Allow permission, and group policies are evaluated before user policies, granting access before the Deny is evaluated.", "The operation is evaluated based on the timestamp of policy creation, with the most recently created or modified policy taking precedence, resulting in unpredictable behavior."], "correct": 1, "explanation_en": "The delete operation is denied. The core rule of IAM policy evaluation is that an explicit Deny always overrides any number of Allow statements, regardless of which policy type they come from. Here, the group policy and S3 bucket policy both Allow `s3:DeleteObject` on the target object, but the user's inline policy contains an explicit Deny for exactly that action on exactly that resource. The Deny wins unconditionally — IAM evaluates all applicable policies simultaneously, not sequentially, and a single explicit Deny anywhere terminates the evaluation with a denial.\n \nWhy the other options are incorrect:\n\nThe S3 bucket policy takes precedence because resource-based policies override identity-based policies: Resource-based and identity-based policies are evaluated together — neither type takes precedence over the other within the same account. An explicit Deny in any policy type, including an identity-based inline policy, will deny the request regardless of what resource-based policies allow.\nGroup policies are evaluated before user policies, so the Allow is granted before the Deny is reached: IAM does not evaluate policies in a sequential order based on attachment type. All applicable policies are evaluated together. Policy evaluation is not \"first match wins\" — it is \"any explicit Deny wins.\" The attachment type or evaluation order of the group vs. inline policy is irrelevant.\nThe most recently created or modified policy takes precedence, resulting in unpredictable behavior: IAM policy evaluation is fully deterministic and never considers timestamps. The outcome is always: explicit Deny overrides Allow, which overrides the implicit default deny. Creation time has no bearing on evaluation.\n", "question_zh": "名为 `developer-john` 的 IAM 用户属于 `Developers` 组，并直接附加了一个内联策略。该用户尝试删除 `s3://production-data/config.json` 处的 S3 对象。策略如下：\n\n组策略（Developers）：\n`{\"Effect\": \"Allow\", \"Action\": \"s3:*\", \"Resource\": \"arn:aws:s3:::production-data/*\"}`\n\n用户内联策略：\n`{\"Effect\": \"Deny\", \"Action\": \"s3:DeleteObject\", \"Resource\": \"arn:aws:s3:::production-data/config.json\"}`\n\nS3 存储桶策略：\n`{\"Effect\": \"Allow\", \"Principal\": {\"AWS\": \"arn:aws:iam::123456789012:root\"}, \"Action\": \"s3:DeleteObject\", \"Resource\": \"arn:aws:s3:::production-data/*\"}`\n\n删除操作的结果是什么？", "options_zh": ["操作被允许，因为 S3 存储桶策略显式允许账户中所有主体的操作，且基于资源的策略优先于基于身份的策略。", "操作被拒绝，因为用户内联策略中的显式 Deny 覆盖所有 Allow 语句，遵循 Deny 在 IAM 策略评估中始终胜出的原则。", "操作被允许，因为组策略提供 Allow 权限，且组策略在用户策略之前评估，在 Deny 被评估之前授予访问权限。", "操作根据策略创建的时间戳评估，最近创建或修改的策略优先，导致不可预测的行为。"], "explanation_zh": "删除操作被拒绝。IAM 策略评估的核心规则是显式 Deny 始终覆盖任何数量的 Allow 语句，无论它们来自哪种策略类型。此处，组策略和 S3 存储桶策略都允许对目标对象的 `s3:DeleteObject`，但用户的内联策略包含对确切的该操作和确切的该资源的显式 Deny。Deny 无条件胜出——IAM 同时评估所有适用策略，而非顺序评估，且任何地方的单个显式 Deny 都以拒绝终止评估。\n\n为什么其他选项不正确：\n\nS3 存储桶策略优先，因为基于资源的策略覆盖基于身份的策略：基于资源和基于身份的策略被一起评估——在同一账户内，任何一种类型都不优先于另一种。任何策略类型中的显式 Deny，包括基于身份的内联策略，都将拒绝请求，无论基于资源的策略允许什么。\n组策略在用户策略之前评估，因此 Allow 在 Deny 到达之前被授予：IAM 不根据附加类型按顺序评估策略。所有适用策略被一起评估。策略评估不是\"先匹配获胜\"——它是\"任何显式 Deny 获胜\"。组与内联策略的附加类型或评估顺序无关。\n最近创建或修改的策略优先，导致不可预测的行为：IAM 策略评估是完全确定性的，从不考虑时间戳。结果总是：显式 Deny 覆盖 Allow，Allow 覆盖隐式默认拒绝。创建时间对评估没有影响。"}, {"exam": 1, "id": 60, "question_en": "Your mobile app uses Amazon Cognito with both User Pool authentication and social identity providers (Google and Facebook). After authentication, users need AWS credentials from a Cognito Identity Pool. You want to implement role-based access control where:\n\nUsers authenticated via User Pool get assigned the `AuthenticatedUserRole`\nUsers authenticated via Google get the `GoogleUserRole` with enhanced permissions\nUsers authenticated via Facebook get the `FacebookUserRole` with restricted permissions\n\n \nWhich Cognito Identity Pool configuration accomplishes this requirement?", "options_en": ["Configure the Identity Pool with a single IAM role for authenticated users. Use IAM policy variables like `${cognito-identity.amazonaws.com:provider}` in the role's permission policy to grant different access levels based on the authentication provider.", "Configure the Identity Pool with Rules-based mapping. Create mapping rules that evaluate the `cognito:preferred_role` claim from each provider, then assign roles dynamically based on rule matching with precedence order.", "Configure the Identity Pool with Token-based mapping. Set up role mappings for each identity provider (User Pool, Google, Facebook) with the \"Use default role\" option, assigning different IAM roles to each authentication provider.", "Configure separate Identity Pools for each authentication provider (one for User Pool, one for Google, one for Facebook). Each Identity Pool is associated with its respective IAM role, and the mobile app selects the appropriate Identity Pool based on the authentication method used."], "correct": 2, "explanation_en": "Token-based mapping is the correct Identity Pool configuration for this requirement. With token-based mapping, each identity provider is associated with a specific IAM role directly in the Identity Pool configuration. When a user authenticates, the Identity Pool inspects the token issuer to determine which provider was used, then assumes the corresponding IAM role — no claim evaluation or custom logic needed. This natively produces the three distinct roles required: one per provider (User Pool, Google, Facebook).\n \nWhy the other options are incorrect:\n\nSingle IAM role with `${cognito-identity.amazonaws.com:provider}` policy variables: A single role with provider-based conditions in the permission policy cannot effectively grant fundamentally different permission sets. The `${cognito-identity.amazonaws.com:provider}` variable can narrow access within a policy, but cannot replicate the distinct permission boundaries that separate IAM roles provide. When different providers require meaningfully different permissions, separate roles via token-based mapping is the correct approach.\nRules-based mapping evaluating the `cognito:preferred_role` claim: Rules-based mapping is designed to assign roles based on attributes within a token — such as a custom department or group claim. It is not the right tool for provider-based role assignment, where the provider itself (not a claim value) determines the role. Additionally, `cognito:preferred_role` is not automatically populated by external social providers like Google or Facebook.\nSeparate Identity Pools for each authentication provider: A single Cognito Identity Pool is designed to support multiple authentication providers simultaneously — that is its core purpose. Creating three separate Identity Pools adds unnecessary infrastructure, forces the mobile app to implement pool-selection logic, and significantly increases operational overhead for no benefit.\n", "question_zh": "您的移动应用使用 Amazon Cognito，同时具有 User Pool 认证和社交身份提供者（Google 和 Facebook）。认证后，用户需要来自 Cognito Identity Pool 的 AWS 凭证。您希望实施基于角色的访问控制：\n\n- 通过 User Pool 认证的用户获得 `AuthenticatedUserRole`\n- 通过 Google 认证的用户获得具有增强权限的 `GoogleUserRole`\n- 通过 Facebook 认证的用户获得具有受限权限的 `FacebookUserRole`\n\n哪种 Cognito Identity Pool 配置可以完成此要求？", "options_zh": ["配置 Identity Pool 使用单一 IAM 角色用于认证用户。在角色的权限策略中使用 IAM 策略变量，如 `${cognito-identity.amazonaws.com:provider}`，根据认证提供者授予不同的访问级别。", "配置 Identity Pool 使用基于规则的映射。创建评估来自每个提供者的 `cognito:preferred_role` 声明的映射规则，然后根据规则匹配和优先级顺序动态分配角色。", "配置 Identity Pool 使用基于令牌的映射。为每个身份提供者（User Pool、Google、Facebook）设置角色映射，使用\"使用默认角色\"选项，为每个认证提供者分配不同的 IAM 角色。", "为每个认证提供者配置单独的 Identity Pools（一个用于 User Pool，一个用于 Google，一个用于 Facebook）。每个 Identity Pool 关联其各自的 IAM 角色，移动应用根据使用的认证方法选择适当的 Identity Pool。"], "explanation_zh": "基于令牌的映射是此要求的正确 Identity Pool 配置。使用基于令牌的映射，每个身份提供者直接在 Identity Pool 配置中关联到特定的 IAM 角色。当用户认证时，Identity Pool 检查令牌颁发者以确定使用了哪个提供者，然后代入相应的 IAM 角色——无需声明评估或自定义逻辑。这原生产生了所需的三个不同角色：每个提供者一个（User Pool、Google、Facebook）。\n\n为什么其他选项不正确：\n\n使用 `${cognito-identity.amazonaws.com:provider}` 策略变量的单一 IAM 角色：具有基于提供者的条件在权限策略中的单一角色无法有效地授予根本不同的权限集。`${cognito-identity.amazonaws.com:provider}` 变量可以在策略内缩小访问范围，但无法复制分离的 IAM 角色提供的不同权限边界。当不同提供者需要有意义的不同权限时，通过基于令牌的映射的分离角色是正确的做法。\n基于规则的映射评估 `cognito:preferred_role` 声明：基于规则的映射设计用于根据令牌内的属性（如自定义部门或组声明）分配角色。它不是用于基于提供者的角色分配的正确工具，其中提供者本身（而非声明值）决定角色。此外，`cognito:preferred_role` 不会由 Google 或 Facebook 等外部社交提供者自动填充。\n为每个认证提供者使用单独的 Identity Pools：单个 Cognito Identity Pool 设计用于同时支持多个认证提供者——这是其核心目的。创建三个单独的 Identity Pools 增加了不必要的基础设施，迫使移动应用实施池选择逻辑，并显著增加了运营开销而没有好处。"}, {"exam": 1, "id": 61, "question_en": "Your company has a KMS key used to encrypt sensitive data in S3. Security policy requires that all KMS API calls must originate from within specific VPCs (`vpc-11111111` and `vpc-22222222`) through a KMS VPC endpoint (`vpce-1a2b3c4d`). A Lambda function with an IAM role that has `kms:Decrypt` permission attempts to decrypt data. The Lambda is configured with VPC settings to run in `vpc-11111111`.\n \nKMS Key Policy:\n`{\n \"Sid\": \"AllowVPCEndpointAccess\",\n \"Effect\": \"Allow\",\n \"Principal\": {\"AWS\": \"arn:aws:iam::123456789012:root\"},\n \"Action\": \"kms:*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:sourceVpce\": \"vpce-1a2b3c4d\"\n }\n }\n}`\n \nLambda IAM Role Policy:\n`{\n \"Effect\": \"Allow\",\n \"Action\": \"kms:Decrypt\",\n \"Resource\": \"arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012\"\n}`\n \nWhat is the result when the Lambda function attempts to decrypt?", "options_en": ["Decryption SUCCEEDS because the Lambda has IAM permission for kms:Decrypt, runs in the required VPC, and the key policy allows access from the account root principal, satisfying all requirements.", "Decryption FAILS because Lambda functions, even when VPC-configured, do not route KMS API calls through the VPC endpoint by default. The aws:sourceVpce condition is not satisfied unless the VPC endpoint policy explicitly allows it.", "Decryption SUCCEEDS only if the Lambda function's security group allows outbound HTTPS traffic to the KMS VPC endpoint, and the VPC endpoint's security group allows inbound traffic from the Lambda's security group.", "Decryption FAILS because the KMS key policy requires aws:sourceVpce condition, but the Lambda IAM role policy does not include a matching condition. Both policies must have identical conditions for the request to succeed."], "correct": 1, "explanation_en": "The decryption fails. This is a subtle but important distinction about how VPC-configured Lambda functions make AWS service API calls.\n \nRunning a Lambda function inside a VPC means it gets ENIs in the specified subnets and can reach private resources like RDS or ElastiCache. However, AWS service API calls (KMS, S3, DynamoDB, etc.) do not automatically route through VPC endpoints. By default, the Lambda SDK resolves `kms.us-east-1.amazonaws.com` via public DNS and sends the request over AWS's internal service network — not through `vpce-1a2b3c4d`.\n \nBecause the request never traverses the VPC endpoint, the `aws:sourceVpce` condition key is never populated. The key policy condition `StringEquals: aws:sourceVpce = vpce-1a2b3c4d` evaluates to false, and KMS denies the request — even though the Lambda has IAM permission for `kms:Decrypt` and runs in the correct VPC.\n \nTo fix this, private DNS must be enabled on the VPC endpoint. With private DNS enabled, the VPC's internal DNS resolver overrides the public resolution of `kms.us-east-1.amazonaws.com` and directs it to the VPC endpoint. Only then does the request carry a valid `aws:sourceVpce` value and satisfy the key policy condition.\n \nWhy the other options are incorrect:\n\nDecryption SUCCEEDS because Lambda is in the VPC: VPC placement alone does not cause AWS API calls to route through VPC endpoints. The `aws:sourceVpce` condition is only satisfied when the request actually traverses the endpoint, which requires private DNS to be enabled. This is a common misconception.\nDecryption SUCCEEDS if security groups allow HTTPS: Security group rules affect network reachability but do not change how the SDK resolves the KMS endpoint. Without private DNS, the request still bypasses the VPC endpoint even if all security group rules are correct, so the `aws:sourceVpce` condition remains unmet.\nDecryption FAILS because IAM and key policy conditions must match: IAM policies and key policies are evaluated independently. The key policy condition checks the context of the incoming request (whether `aws:sourceVpce` is set). There is no requirement for the IAM role policy to mirror or repeat conditions defined in the key policy.\n", "question_zh": "您的公司有一个用于加密 S3 中敏感数据的 KMS 密钥。安全策略要求所有 KMS API 调用必须通过 KMS VPC 端点（`vpce-1a2b3c4d`）源自特定 VPC（`vpc-11111111` 和 `vpc-22222222`）。一个 Lambda 函数具有 `kms:Decrypt` 权限的 IAM 角色，尝试解密数据。Lambda 配置了 VPC 设置，在 `vpc-11111111` 中运行。\n\nKMS 密钥策略：\n`{\"Sid\": \"AllowVPCEndpointAccess\", \"Effect\": \"Allow\", \"Principal\": {\"AWS\": \"arn:aws:iam::123456789012:root\"}, \"Action\": \"kms:*\", \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"aws:sourceVpce\": \"vpce-1a2b3c4d\"}}}`\n\nLambda IAM 角色策略：\n`{\"Effect\": \"Allow\", \"Action\": \"kms:Decrypt\", \"Resource\": \"arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012\"}`\n\n当 Lambda 函数尝试解密时，结果是什么？", "options_zh": ["解密成功，因为 Lambda 具有 kms:Decrypt 的 IAM 权限，在所需 VPC 中运行，且密钥策略允许来自账户根主体的访问，满足所有要求。", "解密失败，因为即使配置了 VPC 的 Lambda 函数，默认也不通过 VPC 端点路由 KMS API 调用。除非启用了私有 DNS，否则 aws:sourceVpce 条件不会被满足。", "仅当 Lambda 函数的安全组允许到 KMS VPC 端点的出站 HTTPS 流量，且 VPC 端点的安全组允许来自 Lambda 安全组的入站流量时，解密才成功。", "解密失败，因为 KMS 密钥策略需要 aws:sourceVpce 条件，但 Lambda IAM 角色策略不包含匹配条件。两个策略必须具有相同的条件才能使请求成功。"], "explanation_zh": "解密失败。这是关于配置了 VPC 的 Lambda 函数如何进行 AWS 服务 API 调用的一个微妙但重要的区别。\n\n在 VPC 内运行 Lambda 函数意味着它在指定子网中获取 ENI，并可以访问私有资源如 RDS 或 ElastiCache。但是，AWS 服务 API 调用（KMS、S3、DynamoDB 等）不会自动通过 VPC 端点路由。默认情况下，Lambda SDK 通过公有 DNS 解析 `kms.us-east-1.amazonaws.com`，并通过 AWS 内部服务网络发送请求——不通过 `vpce-1a2b3c4d`。\n\n因为请求从未穿越 VPC 端点，`aws:sourceVpce` 条件键从未被填充。密钥策略条件 `StringEquals: aws:sourceVpce = vpce-1a2b3c4d` 评估为 false，KMS 拒绝请求——即使 Lambda 具有 `kms:Decrypt` 的 IAM 权限并在正确的 VPC 中运行。\n\n要修复此问题，必须在 VPC 端点上启用私有 DNS。启用私有 DNS 后，VPC 的内部 DNS 解析器覆盖 `kms.us-east-1.amazonaws.com` 的公有解析并将其定向到 VPC 端点。只有这样请求才携带有效的 `aws:sourceVpce` 值并满足密钥策略条件。\n\n为什么其他选项不正确：\n\n解密成功因为 Lambda 在 VPC 中：VPC 放置本身不会导致 AWS API 调用通过 VPC 端点路由。`aws:sourceVpce` 条件仅在请求实际穿越端点时才满足，这需要启用私有 DNS。这是一个常见的误解。\n如果安全组允许 HTTPS 则解密成功：安全组规则影响网络可达性但不改变 SDK 如何解析 KMS 端点。没有私有 DNS，即使所有安全组规则正确，请求仍然绕过 VPC 端点，因此 `aws:sourceVpce` 条件仍然未满足。\n解密失败因为 IAM 和密钥策略条件必须匹配：IAM 策略和密钥策略是独立评估的——不需要具有匹配的条件。在这种情况下，IAM 角色策略已授予权限，但密钥策略独立地拒绝请求，因为其条件未满足。失败不是由于条件不匹配，而是由于密钥策略的 `aws:sourceVpce` 条件未被满足。"}, {"exam": 1, "id": 62, "question_en": "Your organization's compliance team requires that all access to an S3 bucket containing sensitive logs must use TLS/SSL encryption in transit. You need to add a policy statement to the bucket policy that enforces this requirement.\n \nWhich policy statement correctly enforces TLS/SSL for all access to the bucket?", "options_en": ["`{\n \"Sid\": \"DenyNonTLS\",\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": [\n \"arn:aws:s3:::my-logs-bucket\",\n \"arn:aws:s3:::my-logs-bucket/*\"\n ],\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\": \"false\"\n }\n }\n}`", "`{\n \"Sid\": \"AllowOnlyTLS\",\n \"Effect\": \"Allow\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": [\n \"arn:aws:s3:::my-logs-bucket\",\n \"arn:aws:s3:::my-logs-bucket/*\"\n ],\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\": \"true\"\n }\n }\n}`", "`{\n \"Sid\": \"DenyNonTLS\",\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": \"arn:aws:s3:::my-logs-bucket/*\",\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\": \"false\"\n }\n }\n}`", "`{\n \"Sid\": \"DenyInsecure\",\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": [\n \"arn:aws:s3:::my-logs-bucket\",\n \"arn:aws:s3:::my-logs-bucket/*\"\n ],\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\": \"true\"\n }\n }\n}`"], "correct": 0, "explanation_en": "The correct approach to enforce TLS/SSL on S3 is to use an explicit Deny statement with `aws:SecureTransport: false`. This condition evaluates to `true` when the request is sent over HTTP (unencrypted), and the Deny effect blocks it. Because explicit Deny always takes precedence over Allow in IAM policy evaluation, this guarantees no unencrypted access regardless of what other policies may allow. The Resource must include both the bucket ARN (for bucket-level operations) and the bucket ARN with `/*` (for object-level operations) to cover all S3 actions.\n \nWhy other options are incorrect:\n\nAllow with `aws:SecureTransport: true`: This only allows TLS requests but does not deny non-TLS requests. Without an explicit Deny, non-TLS requests could still be permitted by other Allow statements in IAM policies or bucket policies. Allowing TLS is not the same as denying non-TLS.\nDeny with only the object resource (`/*`): This omits the bucket-level resource ARN. Bucket-level operations like `ListBucket` or `GetBucketAcl` would not be covered by this statement, leaving a gap in TLS enforcement.\nDeny with `aws:SecureTransport: true`: This is backwards — it denies requests that DO use TLS, which would block all HTTPS access while allowing unencrypted HTTP access. This is the opposite of the intended behavior.\n", "question_zh": "您组织的合规团队要求所有对包含敏感日志的 S3 存储桶的访问必须使用 TLS/SSL 传输加密。您需要在存储桶策略中添加一个强制执行此要求的策略语句。\n\n哪个策略语句正确强制了对存储桶的所有访问使用 TLS/SSL？", "options_zh": ["`{\"Sid\": \"DenyNonTLS\", \"Effect\": \"Deny\", \"Principal\": \"*\", \"Action\": \"s3:*\", \"Resource\": [\"arn:aws:s3:::my-logs-bucket\", \"arn:aws:s3:::my-logs-bucket/*\"], \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"false\"}}}`", "`{\"Sid\": \"AllowOnlyTLS\", \"Effect\": \"Allow\", \"Principal\": \"*\", \"Action\": \"s3:*\", \"Resource\": [\"arn:aws:s3:::my-logs-bucket\", \"arn:aws:s3:::my-logs-bucket/*\"], \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"true\"}}}`", "`{\"Sid\": \"DenyNonTLS\", \"Effect\": \"Deny\", \"Principal\": \"*\", \"Action\": \"s3:*\", \"Resource\": \"arn:aws:s3:::my-logs-bucket/*\", \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"false\"}}}`", "`{\"Sid\": \"DenyInsecure\", \"Effect\": \"Deny\", \"Principal\": \"*\", \"Action\": \"s3:*\", \"Resource\": [\"arn:aws:s3:::my-logs-bucket\", \"arn:aws:s3:::my-logs-bucket/*\"], \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"true\"}}}`"], "explanation_zh": "在 S3 上强制执行 TLS/SSL 的正确方法是使用显式 Deny 语句配合 `aws:SecureTransport: false`。此条件在请求通过 HTTP（未加密）发送时评估为 `true`，Deny 效果阻止它。因为显式 Deny 在 IAM 策略评估中始终优先于 Allow，这保证无论其他策略允许什么都无法进行未加密访问。Resource 必须同时包括存储桶 ARN（用于存储桶级别操作）和带有 `/*` 的存储桶 ARN（用于对象级别操作），以涵盖所有 S3 操作。\n\n为什么其他选项不正确：\n\nAllow 配合 `aws:SecureTransport: true`：这仅允许 TLS 请求但不拒绝非 TLS 请求。没有显式 Deny，非 TLS 请求仍可能被 IAM 策略或存储桶策略中的其他 Allow 语句允许。允许 TLS 与拒绝非 TLS 不同。\n仅使用对象资源（`/*`）的 Deny：这省略了存储桶级别的资源 ARN。像 `ListBucket` 或 `GetBucketAcl` 这样的存储桶级别操作将不会被此语句涵盖，在 TLS 强制执行中留下缺口。\nDeny 配合 `aws:SecureTransport: true`：这是反过来的——它拒绝确实使用 TLS 的请求，这将阻止所有 HTTPS 访问同时允许未加密的 HTTP 访问。这与预期行为相反。"}, {"exam": 1, "id": 63, "question_en": "Your company (Account A: 111111111111) provides a SaaS monitoring service. Customer accounts (Account B: 222222222222) create IAM roles that your service assumes to collect CloudWatch metrics. To prevent the confused deputy security problem, you require customers to include an ExternalId in the role's trust policy.\n \nCustomer's IAM role trust policy:\n`{\n \"Version\": \"2012-10-17\",\n \"Statement\": [{\n \"Effect\": \"Allow\",\n \"Principal\": {\n \"AWS\": \"arn:aws:iam::111111111111:role/MonitoringServiceRole\"\n },\n \"Action\": \"sts:AssumeRole\",\n \"Condition\": {\n \"StringEquals\": {\n \"sts:ExternalId\": \"unique-customer-id-12345\"\n }\n }\n }]\n}`\n \nYour monitoring service assumes the role using:\n`sts_client = boto3.client('sts')\nresponse = sts_client.assume_role(\n RoleArn='arn:aws:iam::222222222222:role/CustomerMonitoringRole',\n RoleSessionName='monitoring-session',\n ExternalId='unique-customer-id-12345'\n)`\n \nWhy is ExternalId necessary in this scenario?", "options_en": ["ExternalId acts as an additional authentication factor (like MFA) that encrypts the AssumeRole request, preventing man-in-the-middle attacks when assuming roles across accounts.", "ExternalId prevents the confused deputy problem where a malicious customer could trick your service into assuming a role in a different customer's account by providing the ARN of another customer's role.", "ExternalId ensures that only the monitoring service can assume the role, preventing the customer's own IAM users from assuming the role and impersonating the monitoring service to access resources.", "ExternalId is required by AWS for all cross-account role assumptions and serves as an audit identifier in CloudTrail logs to track which external service assumed the role."], "correct": 1, "explanation_en": "The confused deputy problem arises when a trusted service (the \"deputy\") can be manipulated by one customer into acting on behalf of another. In this scenario, a malicious customer could register with the monitoring service but supply a different customer's role ARN during setup. Without ExternalId, the monitoring service would blindly call `AssumeRole` on that ARN — and because the victim's role trusts Account A, the assumption would succeed. The attacker effectively weaponizes the monitoring service against another customer.\n \n`ExternalId` breaks this attack by binding each role assumption to a secret that only the legitimate customer and the service provider share. The monitoring service generates a unique ExternalId (e.g., a UUID) per customer and stores it internally. The customer embeds it in their role's trust policy. When the service calls `AssumeRole`, it passes that customer's ExternalId. If an attacker provides a victim's role ARN, the service still sends the attacker's ExternalId — which won't match the value in the victim's trust policy, so STS denies the request.\n \nWhy the other options are incorrect:\n\nExternalId acts as an encryption or MFA factor: ExternalId is not a cryptographic mechanism. It is a plaintext string passed in the API call. It provides no encryption and is not comparable to MFA. Its security value comes from the fact that it is a shared secret between service provider and customer — not from any technical hardening of the request itself.\nExternalId prevents the customer's own users from assuming the role: The customer's own users can see their trust policy and therefore know the ExternalId. ExternalId does not prevent the customer from assuming their own role — it only prevents a third party (such as another customer) who does not know the ExternalId from exploiting the service as a proxy. Restricting which principals can assume the role requires narrowing the `Principal` field, not ExternalId.\nExternalId is required by AWS for all cross-account assumptions and serves as a CloudTrail identifier: ExternalId is completely optional. Many valid cross-account patterns — such as trusting a specific IAM role ARN instead of an entire account — do not need it. While ExternalId does appear in CloudTrail logs, its purpose is security (preventing confused deputy), not auditing.\n", "question_zh": "您的公司（账户 A：111111111111）提供 SaaS 监控服务。客户账户（账户 B：222222222222）创建您的服务代以收集 CloudWatch 指标的 IAM 角色。为了防止 confused deputy 安全问题，您要求客户在角色的信任策略中包含 ExternalId。\n\n客户的 IAM 角色信任策略：\n`{\"Version\": \"2012-10-17\", \"Statement\": [{\"Effect\": \"Allow\", \"Principal\": {\"AWS\": \"arn:aws:iam::111111111111:role/MonitoringServiceRole\"}, \"Action\": \"sts:AssumeRole\", \"Condition\": {\"StringEquals\": {\"sts:ExternalId\": \"unique-customer-id-12345\"}}}]}`\n\n您的监控服务使用以下方式代入角色：\n`sts_client = boto3.client('sts')\nresponse = sts_client.assume_role(\n    RoleArn='arn:aws:iam::222222222222:role/CustomerMonitoringRole',\n    RoleSessionName='monitoring-session',\n    ExternalId='unique-customer-id-12345'\n)`\n\n为什么在此场景中 ExternalId 是必需的？", "options_zh": ["ExternalId 充当额外的认证因素（如 MFA），加密 AssumeRole 请求，防止跨账户代入角色时的中间人攻击。", "ExternalId 防止 confused deputy 问题，恶意客户可能通过提供另一个客户角色的 ARN 欺骗您的服务代入不同客户账户中的角色。", "ExternalId 确保只有监控服务可以代入角色，防止客户自己的 IAM 用户代入角色并冒充监控服务访问资源。", "ExternalId 是所有跨账户角色代入的 AWS 要求，作为 CloudTrail 日志中的审计标识符，跟踪哪个外部服务代入了角色。"], "explanation_zh": "confused deputy 问题发生在一个受信任的服务（\"代理\"）可以被一个客户操纵代表另一个客户行事时。在此场景中，恶意客户可以在注册监控服务时提供不同客户的角色 ARN。没有 ExternalId，监控服务会盲目地对那个 ARN 调用 `AssumeRole`——因为受害者的角色信任账户 A，代入将成功。攻击者有效地将监控服务武器化来对付另一个客户。\n\n`ExternalId` 通过将每个角色代入绑定到只有合法客户和服务提供者共享的密钥来打破这种攻击。监控服务为每个客户生成一个唯一的 ExternalId（例如 UUID）并内部存储。客户将其嵌入到其角色的信任策略中。当服务调用 `AssumeRole` 时，它传递该客户的 ExternalId。如果攻击者提供受害者的角色 ARN，服务仍然发送攻击者的 ExternalId——与受害者信任策略中的值不匹配，因此 STS 拒绝请求。\n\n为什么其他选项不正确：\n\nExternalId 充当加密或 MFA 因素：ExternalId 不是密码学机制。它是在 API 调用中传递的明文字符串。它不提供加密，也不与 MFA 类似。其安全价值来自它是服务提供者和客户之间的共享密钥——而不是来自对请求本身的任何技术强化。\nExternalId 防止客户自己的用户代入角色：客户自己的用户可以看到其信任策略，因此知道 ExternalId。ExternalId 不防止客户代入自己的角色——它只防止不知道 ExternalId 的第三方（如另一个客户）利用服务作为代理。限制哪些主体可以代入角色需要缩小 `Principal` 字段，而不是 ExternalId。\nExternalId 是所有跨账户角色代入的 AWS 要求：ExternalId 是可选的，而非必需的。这是一个安全最佳实践，而不是 AWS API 的先决条件。客户不包含 ExternalId 的 `AssumeRole` 调用在技术上仍然可以工作——它只是使服务暴露在 confused deputy 攻击之下。它不是 CloudTrail 中的审计标识符——会话名称和角色 ARN 已经标识了调用。"}, {"exam": 1, "id": 64, "question_en": "Your mobile banking app uses Amazon Cognito User Pools for authentication. The security team requires protection against credential compromise and account takeover attacks. You need to implement risk-based adaptive authentication that can detect suspicious sign-in attempts (e.g., from unusual locations or devices) and require additional verification. The solution should also prevent automated bot attacks during sign-up.\n \nWhich combination of Cognito features BEST addresses these requirements?", "options_en": ["Enable Cognito Advanced Security Features for risk-based authentication. Configure adaptive authentication with MFA for medium and high-risk events. Implement Amazon Cognito user pool triggers (Pre-Authentication Lambda) to detect unusual login patterns and block suspicious requests.", "Enable Cognito Advanced Security Features with automatic risk mitigation. Configure CAPTCHA (reCAPTCHA) integration for sign-up and sign-in forms. Use Cognito's built-in compromised credentials detection to block passwords found in data breaches. Require SMS MFA for all users regardless of risk level.", "Implement AWS WAF with rate limiting rules in front of API Gateway that processes Cognito authentication requests. Use Cognito user pool triggers (Post-Authentication Lambda) to log authentication events to CloudWatch for security analysis. Enable account recovery via security questions.", "Enable Cognito Advanced Security Features for risk-based authentication with adaptive MFA based on risk score. Integrate with Amazon Fraud Detector to create custom fraud detection models. Use device tracking and remembering to establish trusted devices and reduce MFA prompts for known devices."], "correct": 0, "explanation_en": "The correct combination is Cognito Advanced Security Features for risk-based authentication paired with a Pre-Authentication Lambda trigger for custom validation. Advanced Security Features assigns each sign-in a risk score (low, medium, high) based on signals such as IP geolocation, device fingerprinting, and login velocity. Adaptive MFA is then applied proportionally — low-risk sign-ins proceed normally, medium-risk triggers MFA if configured, and high-risk events require MFA or are blocked. The Pre-Authentication Lambda trigger fires before authentication completes, allowing custom logic (e.g., IP blocklists, impossible travel detection) to reject suspicious requests before a session is established. Together, these natively address both adaptive risk-based authentication and bot/pattern detection without requiring external services.\n \nWhy the other options are incorrect:\n\nAdvanced Security Features with CAPTCHA, compromised credentials detection, and SMS MFA required for all users regardless of risk: The individual components are mostly sound, but requiring SMS MFA for all users regardless of risk level defeats the purpose of adaptive authentication. Low-risk users with consistent behavior are always challenged, degrading UX without a meaningful security benefit. The whole point of risk-based authentication is to apply friction selectively.\nAWS WAF rate limiting, Post-Authentication Lambda for logging, and account recovery via security questions: Three problems here. WAF rate limiting addresses volumetric/DDoS threats at the network layer, not credential compromise or account takeover. A Post-Authentication Lambda trigger fires after the user has already successfully authenticated — it cannot block suspicious sign-ins. Security questions are a deprecated, weak authentication factor that Cognito does not natively support and modern security standards explicitly discourage.\nAdvanced Security Features with Amazon Fraud Detector integration and device tracking: Advanced Security Features and device tracking are both correct and useful, but integrating Amazon Fraud Detector is unnecessary. Cognito Advanced Security already provides built-in authentication risk scoring and account takeover protection. Amazon Fraud Detector is designed for transaction-level fraud (e.g., payment fraud in e-commerce), not for authentication event analysis. Adding it here introduces significant cost, custom ML model maintenance, and architectural complexity with no material benefit over what Cognito natively provides.\n", "question_zh": "您的移动银行应用使用 Amazon Cognito User Pools 进行认证。安全团队要求防范凭证泄露和账户接管攻击。您需要实施基于风险的自适应认证，可以检测可疑的登录尝试（例如来自异常位置或设备），并需要额外的验证。解决方案还应防止注册期间的自动化机器人攻击。\n\n哪种 Cognito 功能组合最能满足这些要求？", "options_zh": ["启用 Cognito Advanced Security Features 进行基于风险的认证。配置自适应认证，对中高风险事件使用 MFA。实施 Amazon Cognito 用户池触发器（Pre-Authentication Lambda）检测异常登录模式并阻止可疑请求。", "启用 Cognito Advanced Security Features 配合自动风险缓解。为注册和登录表单配置 CAPTCHA（reCAPTCHA）集成。使用 Cognito 内置的泄露凭证检测阻止在数据泄露中发现的密码。要求所有用户不论风险级别使用 SMS MFA。", "在处理 Cognito 认证请求的 API Gateway 前实施 AWS WAF 配合速率限制规则。使用 Cognito 用户池触发器（Post-Authentication Lambda）将认证事件记录到 CloudWatch 进行安全分析。通过安全问题启用账户恢复。", "启用 Cognito Advanced Security Features 进行基于风险的自适应认证，基于风险评分使用自适应 MFA。与 Amazon Fraud Detector 集成创建自定义欺诈检测模型。使用设备跟踪和记住功能建立可信设备并减少已知设备的 MFA 提示。"], "explanation_zh": "正确的组合是 Cognito Advanced Security Features 进行基于风险的认证，配合 Pre-Authentication Lambda 触发器进行自定义验证。Advanced Security Features 为每次登录分配风险评分（低、中、高），基于 IP 地理位置、设备指纹和登录速度等信号。然后按比例应用自适应 MFA——低风险登录正常进行，中等风险在配置时触发 MFA，高风险事件需要 MFA 或被阻止。Pre-Authentication Lambda 触发器在认证完成前触发，允许自定义逻辑（例如 IP 黑名单、不可能的旅行检测）在建立会话之前拒绝可疑请求。这两者共同原生地解决了自适应基于风险的认证和机器人/模式检测，无需外部服务。\n\n为什么其他选项不正确：\n\nAdvanced Security Features 配合 CAPTCHA、泄露凭证检测以及所有用户不论风险级别都要求 SMS MFA：各个组件大多合理，但要求所有用户不论风险级别使用 SMS MFA 违背了自适应认证的目的。具有一致行为的低风险用户始终受到挑战，降低用户体验而没有有意义的安全收益。基于风险的认证的关键点是有选择地施加摩擦。\nAWS WAF 速率限制、Post-Authentication Lambda 进行日志记录、以及通过安全问题恢复账户：这里有三个问题。WAF 速率限制解决网络层的容量/DDoS 威胁，而非凭证泄露或账户接管。Post-Authentication Lambda 触发器在用户已成功认证后触发——它无法阻止可疑登录。安全问题是已弃用的弱认证因素，Cognito 不原生支持，现代安全标准明确不鼓励。\nAdvanced Security Features 配合 Amazon Fraud Detector 集成和设备跟踪/记住：Amazon Fraud Detector 是为检测欺诈交易和活动（如在线支付欺诈）而构建的单独服务——它不是为 Cognito 认证风险分析而设计的。创建和维护 Fraud Detector 模型增加了显著的运营复杂性，且在此用例中未提供任何优于 Cognito 原生 Advanced Security Features 的好处。Cognito 已经内置了基于风险评分的自适应 MFA 和设备跟踪/记住功能，无需外部 Fraud Detector 集成。"}, {"exam": 1, "id": 65, "question_en": "Your application runs in multiple AWS regions (us-east-1 and eu-west-1) for disaster recovery. You use AWS KMS to encrypt application data in S3 and DynamoDB. Security requirements mandate that the same key must be usable in both regions, encrypted data must remain accessible during a regional outage, and key policies must be centrally managed without per-region configuration.\n \nWhich approach BEST meets these requirements?", "options_en": ["Create separate CMKs in each region with identical key policies. Use S3 Cross-Region Replication (CRR) with SSE-KMS encryption to replicate objects between regions, specifying the destination region's CMK. Replicate DynamoDB global tables with region-specific KMS keys and use multi-region encryption.", "Create a multi-region KMS key in us-east-1 as the primary key. Enable key replication to eu-west-1 to create a replica key. Configure S3 and DynamoDB to use the multi-region key ARN, which automatically resolves to the local replica key in each region. Update the key policy once on the primary key, which propagates to all replicas.", "Create a KMS key in us-east-1 and grant cross-region access by adding eu-west-1 principals to the key policy. Configure S3 and DynamoDB in eu-west-1 to use the us-east-1 KMS key ARN for encryption, accepting the cross-region latency for cryptographic operations.", "Create a KMS key in us-east-1 and export the key material. Import the same key material into a separate CMK in eu-west-1, creating functionally identical keys in both regions. Configure applications to use the local key in each region while maintaining the same underlying cryptographic material."], "correct": 1, "explanation_en": "Multi-region KMS keys are the correct solution because they directly satisfy all three requirements:\n\nSame key in both regions: Multi-region keys share the same key ID (prefixed `mrk-`) and key material across primary and replica keys. Ciphertext encrypted in us-east-1 can be decrypted in eu-west-1 without re-encryption.\nAccessible during regional outage: Each replica is a fully independent KMS key in its own region. If the primary region fails, applications use the local replica — no cross-region KMS calls are required.\nCentrally managed key policy: Updating the key policy on the primary key automatically propagates to all replicas. No per-region policy management is needed.\n\n \nWhy other options are incorrect:\n\nSeparate CMKs with identical policies: These are distinct keys with different key IDs. Ciphertext encrypted with one key cannot be decrypted with another, even if the policies are identical. Policy changes must be applied to each region separately. Fails the \"same key\" and \"centrally managed\" requirements.\nCross-region KMS access from eu-west-1: AWS services like S3 and DynamoDB require the KMS key to be in the same region as the data. A cross-region key ARN is not accepted. Additionally, if us-east-1 is unavailable, eu-west-1 cannot perform any cryptographic operations. Fails the \"accessible during regional outage\" requirement.\nImport the same key material into separate CMKs: Despite sharing key material, these are separate keys with different key IDs and ARNs. Key policy changes must be applied per region. The key material must be managed outside AWS, adding operational risk. Fails the \"centrally managed\" requirement.\n", "question_zh": "您的应用程序在多个 AWS 区域（us-east-1 和 eu-west-1）运行，用于灾难恢复。您使用 AWS KMS 加密 S3 和 DynamoDB 中的应用程序数据。安全要求规定同一密钥必须在两个区域都可用，加密数据在区域中断期间必须保持可访问，且密钥策略必须集中管理而无需按区域配置。\n\n哪种方法最能满足这些要求？", "options_zh": ["在每个区域创建单独的 CMK，具有相同的密钥策略。使用 S3 Cross-Region Replication (CRR) 配合 SSE-KMS 加密在区域之间复制对象，指定目标区域的 CMK。使用区域特定的 KMS 密钥复制 DynamoDB 全局表，并使用多区域加密。", "在 us-east-1 中创建多区域 KMS 密钥作为主密钥。启用到 eu-west-1 的密钥复制以创建副本密钥。配置 S3 和 DynamoDB 使用多区域密钥 ARN，它在每个区域自动解析为本地副本密钥。在主密钥上更新密钥策略一次，这会传播到所有副本。", "在 us-east-1 中创建 KMS 密钥，并通过将 eu-west-1 主体添加到密钥策略来授予跨区域访问权限。配置 eu-west-1 中的 S3 和 DynamoDB 使用 us-east-1 KMS 密钥 ARN 进行加密，接受加密操作的跨区域延迟。", "在 us-east-1 中创建 KMS 密钥并导出密钥材料。将相同的密钥材料导入 eu-west-1 中的单独 CMK，在两个区域中创建功能相同的密钥。配置应用程序在每个区域使用本地密钥，同时保持相同的底层加密材料。"], "explanation_zh": "多区域 KMS 密钥是正确的解决方案，因为它们直接满足所有三个要求：\n\n- 两个区域使用相同密钥：多区域密钥在主密钥和副本密钥之间共享相同的密钥 ID（前缀 `mrk-`）和密钥材料。在 us-east-1 中加密的密文可以在 eu-west-1 中解密，无需重新加密。\n- 区域中断期间可访问：每个副本是其自己区域中完全独立的 KMS 密钥。如果主区域失败，应用程序使用本地副本——不需要跨区域 KMS 调用。\n- 集中管理密钥策略：在主密钥上更新密钥策略会自动传播到所有副本。不需要按区域策略管理。\n\n为什么其他选项不正确：\n\n具有相同策略的单独 CMK：这些是具有不同密钥 ID 的不同密钥。用一个密钥加密的密文不能用另一个解密，即使策略相同。策略更改必须单独应用于每个区域。不符合\"相同密钥\"和\"集中管理\"要求。\n从 eu-west-1 跨区域 KMS 访问：像 S3 和 DynamoDB 这样的 AWS 服务要求 KMS 密钥与数据在同一区域。不接受跨区域密钥 ARN。此外，如果 us-east-1 不可用，eu-west-1 无法执行任何加密操作。不符合\"区域中断期间可访问\"要求。\n将相同的密钥材料导入单独的 CMK：尽管共享密钥材料，这些是具有不同密钥 ID 和 ARN 的单独密钥。密钥策略更改必须按区域应用。密钥材料必须在 AWS 外部管理，增加运营风险。不符合\"集中管理\"要求。"}, {"exam": 1, "id": 50, "question_en": "You are a Security Engineer at a mobile gaming startup. The development team wants to add user authentication to their iOS and Android apps. Users should be able to sign up with email/password, authenticate with social identity providers (Google, Facebook), and securely access AWS resources like S3 (for storing game saves) and DynamoDB (for leaderboards). The solution must not require managing server infrastructure for authentication.\n \nWhich AWS architecture BEST meets these requirements?", "options_en": ["Use IAM users for each game player with programmatic access keys embedded in the mobile app. Store credentials in the app's secure keychain and rotate them monthly using a Lambda function triggered by EventBridge.", "Implement Amazon Cognito User Pools for authentication and Cognito Identity Pools for AWS credential vending. Configure the User Pool with email and social identity providers, then use the Identity Pool to exchange User Pool tokens for temporary AWS credentials with an IAM role.", "Deploy a custom authentication server on EC2 with Auto Scaling behind an ALB. Use this server to authenticate users and generate IAM session tokens using AWS STS AssumeRole, returning temporary credentials to the mobile app via HTTPS API.", "Use AWS IAM Identity Center (AWS SSO) with SAML 2.0 federation. Configure mobile apps to redirect users to the SSO portal for authentication, then receive SAML assertions that are exchanged for AWS credentials using STS AssumeRoleWithSAML."], "correct": 1, "explanation_en": "Amazon Cognito is purpose-built for this use case. Cognito User Pools provide the user directory — handling email/password sign-up, social identity provider integration (Google, Facebook), MFA, and JWT token issuance — with no server infrastructure to manage. Cognito Identity Pools then exchange those User Pool tokens for temporary AWS credentials via STS, enabling the mobile app to directly access S3, DynamoDB, and other AWS services with least-privilege IAM roles.\n \nWhy the other options are incorrect:\n\nIAM users per game player with access keys embedded in the mobile app: Embedding long-term IAM credentials in a mobile app is a critical security anti-pattern. Credentials can be extracted through reverse engineering or device compromise. IAM users also do not scale to millions of players, have no built-in social provider integration, and credential rotation becomes an operational burden.\nCustom EC2 authentication server behind an ALB: This requires managing server infrastructure (patching, scaling, monitoring), implementing social provider integration from scratch, and building all authentication features manually. It is reinventing what Cognito provides as a fully managed service — violating the requirement to avoid managing server infrastructure.\nIAM Identity Center with SAML 2.0 for mobile app users: IAM Identity Center is designed for workforce identity (employees accessing AWS accounts), not customer identity (app users). SAML 2.0 is browser-based and requires redirecting users to a web SSO portal — a poor experience for native mobile apps. It does not natively support social providers or the scale of millions of consumer identities.\n", "question_zh": "您是一家移动游戏初创公司的安全工程师。开发团队希望为其 iOS 和 Android 应用添加用户认证。用户应能够使用电子邮件/密码注册、使用社交身份提供者（Google、Facebook）认证，并安全地访问 AWS 资源，如 S3（存储游戏存档）和 DynamoDB（排行榜）。解决方案不能需要管理用于认证的服务器基础设施。\n\n哪种 AWS 架构最能满足这些要求？", "options_zh": ["为每个游戏玩家使用 IAM 用户，将程序化访问密钥嵌入移动应用。将凭证存储在应用的安全密钥链中，并使用由 EventBridge 触发的 Lambda 函数每月轮换。", "实施 Amazon Cognito User Pools 进行身份认证和 Cognito Identity Pools 进行 AWS 凭证发放。配置 User Pool 使用电子邮件和社交身份提供者，然后使用 Identity Pool 将 User Pool 令牌交换为具有 IAM 角色的临时 AWS 凭证。", "在具有 Auto Scaling 的 EC2 上部署自定义认证服务器，前端为 ALB。使用此服务器认证用户，并使用 AWS STS AssumeRole 生成 IAM 会话令牌，通过 HTTPS API 将临时凭证返回给移动应用。", "使用 AWS IAM Identity Center（AWS SSO）配合 SAML 2.0 联合。配置移动应用将用户重定向到 SSO 门户进行认证，然后接收 SAML 断言，使用 STS AssumeRoleWithSAML 交换为 AWS 凭证。"], "explanation_zh": "Amazon Cognito 是为此用例专门设计的。Cognito User Pools 提供用户目录——处理电子邮件/密码注册、社交身份提供者集成（Google、Facebook）、MFA 和 JWT 令牌颁发——无需管理服务器基础设施。Cognito Identity Pools 然后将这些 User Pool 令牌交换为临时 AWS 凭证，通过 STS 授予，使移动应用能够直接使用最低权限 IAM 角色访问 S3、DynamoDB 和其他 AWS 服务。\n\n为什么其他选项不正确：\n\n为每个游戏玩家创建 IAM 用户并在移动应用中嵌入访问密钥：在移动应用中嵌入长期 IAM 凭证是严重的安全反模式。凭证可以通过逆向工程或设备入侵提取。IAM 用户也无法扩展到数百万玩家，没有内置社交提供者集成，凭证轮换成为运营负担。\n在 ALB 后面部署自定义 EC2 认证服务器：这需要管理服务器基础设施（补丁、扩展、监控），从头实施社交提供者集成，并手动构建所有认证功能。这是在重新发明 Cognito 作为完全托管服务提供的功能——违反避免管理服务器基础设施的要求。\nIAM Identity Center 配合 SAML 2.0 用于移动应用用户：IAM Identity Center 是为劳动力身份（员工访问 AWS 账户）设计的，而不是客户身份（应用用户）。SAML 2.0 是基于浏览器的，需要将用户重定向到 Web SSO 门户——对原生移动应用来说体验很差。它不原生支持社交提供者或数百万消费者身份的规模。"}, {"exam": 1, "id": 51, "question_en": "Your company already uses Auth0 as the primary identity provider for all applications. You're building a new mobile app that needs to access AWS resources (API Gateway, S3, Lambda). The security team requires that all authentication continue using Auth0 (not migrating to Cognito User Pools), but the mobile app needs temporary AWS credentials to directly invoke API Gateway endpoints secured with IAM authorization.\n \nWhat is the MOST appropriate architecture?", "options_en": ["Configure Auth0 as an OIDC identity provider in IAM. Create an IAM role with a trust policy that trusts the Auth0 OIDC provider. Mobile app authenticates with Auth0, receives an ID token, then exchanges it for AWS credentials using STS AssumeRoleWithWebIdentity.", "Configure Auth0 to act as a SAML 2.0 identity provider in IAM. Mobile app redirects users to Auth0 for SAML authentication, receives a SAML assertion, then exchanges it for AWS credentials using STS AssumeRoleWithSAML.", "Create a Lambda authorizer (custom authorizer) in API Gateway that validates Auth0 tokens. Mobile app authenticates with Auth0 and includes the Auth0 access token in API Gateway requests. API Gateway does NOT provide AWS credentials; it only authorizes API requests.", "Use Cognito Identity Pools configured with Auth0 as an external OIDC identity provider. Mobile app authenticates with Auth0, receives an OIDC token, exchanges it with Cognito Identity Pool for temporary AWS credentials, then accesses AWS resources directly."], "correct": 3, "explanation_en": "The correct architecture is Cognito Identity Pools with Auth0 configured as an external OIDC identity provider. The mobile app authenticates with Auth0 using the Auth0 SDK and receives an OIDC ID token. It then exchanges that token with a Cognito Identity Pool, which validates it, maps the user to an IAM role, and calls `STS AssumeRoleWithWebIdentity` internally. Cognito returns temporary AWS credentials that the app uses to sign requests (SigV4) to IAM-authorized API Gateway endpoints and other AWS services directly.\n \nThis is preferred over calling STS directly because Cognito Identity Pools handle token validation, credential caching, and role mapping — reducing the complexity of client-side code and following the AWS-recommended pattern for third-party IdP credential vending.\n \nWhy the other options are incorrect:\n\nDirect STS AssumeRoleWithWebIdentity with Auth0 as an IAM OIDC provider: This is technically functional but requires the mobile app to manage STS API calls, implement its own token validation, and handle credential caching and refresh manually. Cognito Identity Pools provide all of these as a managed service and are the AWS-recommended abstraction for this pattern. While this option would work, it is not the most appropriate architecture.\nAuth0 as a SAML 2.0 identity provider with STS AssumeRoleWithSAML: Auth0 supports OIDC natively and OIDC is the correct protocol for native mobile apps. SAML is XML-based and designed for browser-based SSO with HTTP redirects and POST bindings — it produces a poor user experience in native mobile apps and is not the modern standard for this use case.\nLambda authorizer in API Gateway that validates Auth0 tokens: A Lambda authorizer controls access to API Gateway but does not vend AWS credentials. The mobile app would still have no temporary credentials and could not sign requests with SigV4 to access S3, Lambda, or IAM-authorized API Gateway endpoints directly. This option addresses authorization at the API layer only, not credential issuance.\n", "question_zh": "您的公司已经使用 Auth0 作为所有应用程序的主要身份提供者。您正在构建一个需要访问 AWS 资源（API Gateway、S3、Lambda）的新移动应用。安全团队要求所有身份认证继续使用 Auth0（不迁移到 Cognito User Pools），但移动应用需要临时 AWS 凭证以直接调用使用 IAM 授权保护的 API Gateway 端点。\n\n什么是最合适的架构？", "options_zh": ["在 IAM 中将 Auth0 配置为 OIDC 身份提供者。创建信任 Auth0 OIDC 提供者的 IAM 角色及信任策略。移动应用使用 Auth0 认证，接收 ID 令牌，然后使用 STS AssumeRoleWithWebIdentity 将其交换为 AWS 凭证。", "在 IAM 中将 Auth0 配置为 SAML 2.0 身份提供者。移动应用将用户重定向到 Auth0 进行 SAML 认证，接收 SAML 断言，然后使用 STS AssumeRoleWithSAML 将其交换为 AWS 凭证。", "在 API Gateway 中创建 Lambda 授权器（自定义授权器）验证 Auth0 令牌。移动应用使用 Auth0 认证并在 API Gateway 请求中包含 Auth0 访问令牌。API Gateway 不提供 AWS 凭证；它仅授权 API 请求。", "使用配置了 Auth0 作为外部 OIDC 身份提供者的 Cognito Identity Pools。移动应用使用 Auth0 认证，接收 OIDC 令牌，通过 Cognito Identity Pool 交换临时 AWS 凭证，然后直接访问 AWS 资源。"], "explanation_zh": "正确的架构是 Cognito Identity Pools 配置 Auth0 作为外部 OIDC 身份提供者。移动应用使用 Auth0 SDK 通过 Auth0 认证，接收 OIDC ID 令牌。然后将其与 Cognito Identity Pool 交换，后者验证令牌，将用户映射到 IAM 角色，并在内部调用 `STS AssumeRoleWithWebIdentity`。Cognito 返回临时 AWS 凭证，应用使用这些凭证签署请求（SigV4）到 IAM 授权的 API Gateway 端点和其他 AWS 服务。\n\n这优于直接调用 STS，因为 Cognito Identity Pools 处理令牌验证、凭证缓存和角色映射——减少客户端代码的复杂性，并遵循 AWS 推荐的第三方 IdP 凭证发放模式。\n\n为什么其他选项不正确：\n\n直接 STS AssumeRoleWithWebIdentity 配合 Auth0 作为 IAM OIDC 提供者：这在技术上是可行的，但需要移动应用管理 STS API 调用、实施自己的令牌验证，并手动处理凭证缓存和刷新。Cognito Identity Pools 将这些作为托管服务提供，是此模式的 AWS 推荐抽象。虽然此选项可以工作，但不是最合适的架构。\nAuth0 作为 SAML 2.0 身份提供者配合 STS AssumeRoleWithSAML：Auth0 原生支持 OIDC，且 OIDC 是原生移动应用的正确协议。SAML 是基于 XML 的，为基于浏览器的 SSO 设计，使用 HTTP 重定向和 POST 绑定——在原生移动应用中产生糟糕的用户体验，不是此用例的现代标准。\nAPI Gateway 中的 Lambda 授权器验证 Auth0 令牌：Lambda 授权器控制对 API Gateway 的访问但不发放 AWS 凭证。移动应用仍然没有临时凭证，无法使用 SigV4 签署请求以直接访问 S3、Lambda 或 IAM 授权的 API Gateway 端点。此选项仅解决 API 授权，而不是 AWS 凭证获取。"}, {"exam": 1, "id": 52, "question_en": "Your enterprise uses Active Directory Federation Services (AD FS) as the corporate identity provider. Developers need to programmatically access AWS APIs using AWS CLI and SDKs with their corporate credentials. Security requirements mandate that AWS access must be temporary, tied to corporate identity, and not require IAM users. The solution must work from developer workstations (not browser-based SSO).\n \nWhat workflow BEST accomplishes this requirement?", "options_en": ["Configure AD FS as a SAML identity provider in IAM. Developers run a custom script that authenticates with AD FS (using Windows Integrated Authentication), receives a SAML assertion, calls STS AssumeRoleWithSAML to get temporary credentials, and writes them to ~/.aws/credentials.", "Use AWS IAM Identity Center (AWS SSO) with AD FS as the identity source. Developers run `aws sso login` which opens a browser for AD FS authentication, receives SAML assertion via browser redirect, exchanges it for temporary credentials, and caches them locally.", "Create IAM users for each developer with programmatic access. Configure MFA and implement a Lambda function that validates Active Directory credentials via LDAP, then uses IAM to rotate the access keys daily.", "Install AWS Tools for PowerShell with AD FS integration. Configure PowerShell to use Windows Integrated Authentication to AD FS, which automatically provides Kerberos tickets that AWS SDK uses to authenticate API calls without STS."], "correct": 0, "explanation_en": "This is the standard SAML-based federation for programmatic API access pattern. AD FS is registered as a SAML identity provider in IAM, and an IAM role is configured to trust that provider. The developer's script authenticates with AD FS using Windows Integrated Authentication (Kerberos), receives a signed SAML 2.0 assertion, then calls `STS AssumeRoleWithSAML` to exchange it for temporary AWS credentials. The credentials are written locally and used by the AWS CLI/SDK. No IAM users are created, access is temporary, and it's tied to corporate identity.\n \nWhy other options are incorrect:\n\nIAM Identity Center with `aws sso login`: The `aws sso login` command opens a web browser for authentication. The question explicitly requires the solution to work from developer workstations without browser-based SSO, which disqualifies this approach.\nIAM users with Lambda-based AD validation: This creates IAM users, directly violating the requirement that AWS access must not require IAM users. It also doesn't provide true federation — disabling an AD account would not automatically revoke AWS access.\nKerberos tickets for AWS API calls: AWS APIs require Signature Version 4 (SigV4) authentication, which uses AWS access keys. Kerberos tickets cannot be used directly to authenticate AWS API calls. The Kerberos authentication must be exchanged for a SAML assertion, which is then exchanged for temporary AWS credentials via STS.\n", "question_zh": "您的企业使用 Active Directory Federation Services (AD FS) 作为企业身份提供者。开发人员需要使用其企业凭证通过 AWS CLI 和 SDK 以编程方式访问 AWS API。安全要求规定 AWS 访问必须是临时的、与企业身份绑定，且不需要 IAM 用户。解决方案必须从开发人员工作站工作（不是基于浏览器的 SSO）。\n\n什么工作流程最能完成此要求？", "options_zh": ["在 IAM 中将 AD FS 配置为 SAML 身份提供者。开发人员运行自定义脚本，使用 AD FS 进行身份验证（使用 Windows 集成身份验证），接收 SAML 断言，调用 STS AssumeRoleWithSAML 获取临时凭证，并将其写入 ~/.aws/credentials。", "使用 AWS IAM Identity Center（AWS SSO）配合 AD FS 作为身份源。开发人员运行 `aws sso login`，打开浏览器进行 AD FS 身份验证，通过浏览器重定向接收 SAML 断言，将其交换为临时凭证，并在本地缓存。", "为每个开发人员创建带有程序化访问的 IAM 用户。配置 MFA 并实施 Lambda 函数通过 LDAP 验证 Active Directory 凭证，然后使用 IAM 每天轮换访问密钥。", "安装 AWS Tools for PowerShell 配合 AD FS 集成。配置 PowerShell 使用到 AD FS 的 Windows 集成身份验证，自动提供 Kerberos 票据，AWS SDK 使用这些票据直接认证 API 调用而无需 STS。"], "explanation_zh": "这是用于程序化 API 访问的标准基于 SAML 的联合模式。AD FS 在 IAM 中注册为 SAML 身份提供者，IAM 角色配置为信任该提供者。开发人员的脚本使用 Windows 集成身份验证（Kerberos）通过 AD FS 进行身份验证，接收签名的 SAML 2.0 断言，然后调用 `STS AssumeRoleWithSAML` 将其交换为临时 AWS 凭证。凭证在本地写入，由 AWS CLI/SDK 使用。不创建 IAM 用户，访问是临时的，且与企业身份绑定。\n\n为什么其他选项不正确：\n\nIAM Identity Center 配合 `aws sso login`：`aws sso login` 命令打开 Web 浏览器进行身份验证。问题明确要求解决方案从开发人员工作站工作而无需基于浏览器的 SSO，这取消了此方法的资格。\n带有基于 Lambda AD 验证的 IAM 用户：这会创建 IAM 用户，直接违反 AWS 访问必须不需要 IAM 用户的要求。它也不能提供真正的联合——禁用 AD 账户不会自动撤销 AWS 访问。\nKerberos 票据用于 AWS API 调用：AWS API 需要 Signature Version 4 (SigV4) 身份验证，使用 AWS 访问密钥。Kerberos 票据不能直接用于认证 AWS API 调用。Kerberos 身份验证必须交换为 SAML 断言，然后通过 STS 交换为临时 AWS 凭证。"}, {"exam": 1, "id": 53, "question_en": "You're building a serverless API for a mobile app using Amazon Cognito User Pools for authentication, API Gateway for the API layer, and Lambda for business logic. User-specific data is stored in DynamoDB. The mobile app should authenticate users via Cognito, then access protected API endpoints. The API must validate JWT tokens and authorize access based on Cognito user identity.\n \nWhich approach BEST implements this architecture?", "options_en": ["Configure API Gateway with a Cognito User Pool authorizer. Mobile app includes the Cognito ID token in the Authorization header. API Gateway validates the token signature and expiration, then passes user claims (including `sub`) to Lambda via request context. Lambda uses the `sub` claim as the DynamoDB partition key.", "Configure API Gateway with an IAM authorizer. Mobile app exchanges Cognito User Pool token with Cognito Identity Pool for AWS credentials, signs API requests with SigV4, and sends them to API Gateway. Lambda receives authenticated user identity via request context.", "Implement a Lambda authorizer (custom authorizer) that validates Cognito tokens by calling Cognito UserInfo endpoint. Cache authorization decisions in ElastiCache Redis with a 1-hour TTL. Lambda function queries DynamoDB using the user ID from the cached authorization context.", "Mobile app sends Cognito access token to Lambda via API Gateway with no authorizer configured. Lambda validates the token by downloading JWKS from Cognito public keys endpoint, verifies signature and expiration, then extracts user identity for DynamoDB queries."], "correct": 0, "explanation_en": "The recommended pattern for this architecture is a Cognito User Pool authorizer on API Gateway. API Gateway has native, built-in support for Cognito User Pools — no custom code required. When the mobile app sends the Cognito ID token in the `Authorization` header, API Gateway automatically verifies the JWT signature (using Cognito's JWKS), checks expiration, validates the issuer and audience, and rejects invalid tokens before the request ever reaches Lambda. All validated token claims are then forwarded to Lambda via `event['requestContext']['authorizer']['claims']`, making the `sub` claim (a stable, unique user UUID) readily available as a DynamoDB partition key — without any token-parsing code in Lambda.\n \nWhy the other options are incorrect:\n\nIAM authorizer with Cognito Identity Pool: This adds significant complexity that is not needed here. The mobile app would have to exchange its Cognito User Pool token with a Cognito Identity Pool to get temporary AWS credentials, then sign every API request with SigV4. Identity Pools are the right tool when the mobile app needs to call AWS services directly (e.g., S3, DynamoDB). When the app only needs to reach a custom API backed by Lambda, the User Pool authorizer is simpler and sufficient.\nLambda authorizer that calls the Cognito UserInfo endpoint: This re-implements what API Gateway already does natively. Each request would incur an extra HTTP round-trip to Cognito, increasing latency. Adding ElastiCache for caching introduces operational overhead that a native authorizer handles automatically. A custom Lambda authorizer is appropriate when authenticating with a third-party IdP (Auth0, Okta) that API Gateway does not natively support — not for Cognito.\nNo authorizer — token validation in Lambda: Without an authorizer configured on API Gateway, the endpoint is publicly reachable by anyone. An unauthenticated request would trigger Lambda execution, wasting compute and exposing the function to abuse. Delegating authentication to application code is an anti-pattern; it should be enforced at the gateway layer.\n", "question_zh": "您正在为移动应用构建无服务器 API，使用 Amazon Cognito User Pools 进行身份认证、API Gateway 作为 API 层、Lambda 进行业务逻辑。用户特定数据存储在 DynamoDB 中。移动应用应通过 Cognito 认证用户，然后访问受保护的 API 端点。API 必须验证 JWT 令牌并根据 Cognito 用户身份授权访问。\n\n哪种方法最能实施此架构？", "options_zh": ["在 API Gateway 中配置 Cognito User Pool 授权器。移动应用在 Authorization 头中包含 Cognito ID 令牌。API Gateway 验证令牌签名和过期时间，然后通过请求上下文将用户声明（包括 `sub`）传递给 Lambda。Lambda 使用 `sub` 声明作为 DynamoDB 分区键。", "在 API Gateway 中配置 IAM 授权器。移动应用将 Cognito User Pool 令牌与 Cognito Identity Pool 交换为 AWS 凭证，使用 SigV4 签署 API 请求，并将其发送到 API Gateway。Lambda 通过请求上下文接收认证用户身份。", "实施 Lambda 授权器（自定义授权器），通过调用 Cognito UserInfo 端点验证 Cognito 令牌。在 ElastiCache Redis 中缓存授权决策，TTL 为 1 小时。Lambda 函数使用缓存授权上下文中的用户 ID 查询 DynamoDB。", "移动应用通过 API Gateway 将 Cognito 访问令牌发送到 Lambda，无需配置授权器。Lambda 通过从 Cognito 公钥端点下载 JWKS 来验证令牌，验证签名和过期时间，然后提取用户身份进行 DynamoDB 查询。"], "explanation_zh": "此架构的推荐模式是 API Gateway 上的 Cognito User Pool 授权器。API Gateway 具有对 Cognito User Pools 的原生内置支持——无需自定义代码。当移动应用在 `Authorization` 头中发送 Cognito ID 令牌时，API Gateway 自动验证 JWT 签名（使用 Cognito 的 JWKS），检查过期时间，验证颁发者和受众，并在请求到达 Lambda 之前拒绝无效令牌。所有验证过的令牌声明然后通过 `event['requestContext']['authorizer']['claims']` 转发给 Lambda，使 `sub` 声明（稳定、唯一的用户 UUID）易于作为 DynamoDB 分区键——无需在 Lambda 中进行任何令牌解析代码。\n\n为什么其他选项不正确：\n\nIAM 授权器配合 Cognito Identity Pool：这增加了不必要的复杂性。移动应用必须将其 Cognito User Pool 令牌与 Cognito Identity Pool 交换以获取临时 AWS 凭证，然后使用 SigV4 签署每个 API 请求。当移动应用需要直接调用 AWS 服务（如 S3、DynamoDB）时，Identity Pools 是正确的工具。当应用只需要访问由 Lambda 支持的自定义 API 时，User Pool 授权器更简单且足够。\nLambda 授权器调用 Cognito UserInfo 端点：这重新实现了 API Gateway 已经原生完成的内容。每个请求将产生到 Cognito 的额外 HTTP 往返，增加延迟。添加 ElastiCache 进行缓存引入了运营开销，而原生授权器自动处理。自定义 Lambda 授权器适用于使用 API Gateway 不原生支持的第三方 IdP（Auth0、Okta）进行认证时——而不是 Cognito。\n无授权器——在 Lambda 中进行令牌验证：当 API Gateway 上没有配置授权器时，端点对任何人都可公共访问。未经身份验证的请求将触发 Lambda 执行，浪费计算资源并暴露函数于 DoS 攻击。在每个函数中实现令牌解析和验证违反了关注点分离，分散了授权逻辑。"}, {"exam": 1, "id": 54, "question_en": "Your company's mobile app uses Amazon Cognito User Pools for authentication and API Gateway with Lambda for the backend. The product team wants to implement feature flags that control which features users can access. Feature flags are stored in a DynamoDB table and can be updated in real-time. The API must authorize each request based on the user's identity AND their current feature flag settings.\n \nWhat is the MOST appropriate implementation?", "options_en": ["Use a Cognito User Pool authorizer in API Gateway. In each Lambda function, query DynamoDB for the user's feature flags using the `sub` claim from the Cognito token, check if the requested feature is enabled, and return 403 if disabled.", "Use a Lambda authorizer (REQUEST type) in API Gateway. Validate the Cognito token, query DynamoDB for feature flags, generate a cached IAM policy that includes feature-specific resource ARNs with Allow/Deny statements, and set cache TTL to 5 minutes.", "Use Cognito User Pool authorizer with Cognito Groups to represent feature flags. Update group memberships when feature flags change. API Gateway authorizer passes groups to Lambda via claims, and Lambda checks if required feature group is present.", "Configure API Gateway with no authorizer. Lambda function validates the Cognito token using JWKS, queries feature flags from DynamoDB, caches the combined authorization decision in Lambda execution context, and reuses it for warm container invocations."], "correct": 1, "explanation_en": "A Lambda authorizer (REQUEST type) is the correct choice when authorization depends on both user identity and external data sources like feature flags. According to AWS documentation, Lambda authorizers let you implement custom authorization schemes by receiving the full request context (headers, path, query strings), calling external data sources, and returning an IAM policy that API Gateway enforces before invoking the backend Lambda.\n \nWhy this is the best approach:\n\nCentralizes authorization logic in one place instead of duplicating it across every backend Lambda function\nAPI Gateway enforces the returned policy before the backend Lambda is invoked, blocking unauthorized requests earlier\nBuilt-in authorization caching with configurable TTL reduces repeated DynamoDB queries and Lambda invocations\nThe REQUEST type receives full request context, enabling path- and method-specific authorization decisions\n\n \nWhy other options are incorrect:\n\nCognito authorizer + DynamoDB in each Lambda: A Cognito User Pool authorizer only validates the JWT token — it cannot query DynamoDB or enforce feature flags. This forces every backend Lambda to independently query DynamoDB and implement authorization logic, duplicating effort and mixing authorization with business logic.\nCognito Groups as feature flags: Group memberships are embedded in the JWT at token issuance. Changing a user's groups requires them to re-authenticate to get a new token. This makes Cognito Groups unsuitable for feature flags that must update in real-time without forcing users to log in again.\nNo authorizer + Lambda validation: Without an API Gateway authorizer, the API endpoints are publicly accessible to any caller. Caching authorization decisions in Lambda execution context is unreliable because containers are recycled unpredictably and there is no cache invalidation mechanism.\n", "question_zh": "您公司的移动应用使用 Amazon Cognito User Pools 进行身份认证，并使用 API Gateway 配合 Lambda 作为后端。产品团队希望实施功能标志来控制用户可访问哪些功能。功能标志存储在 DynamoDB 表中，可以实时更新。API 必须根据用户身份及其当前功能标志设置来授权每个请求。\n\n什么是最合适的实施？", "options_zh": ["在 API Gateway 中使用 Cognito User Pool 授权器。在每个 Lambda 函数中，使用 Cognito 令牌中的 `sub` 声明查询 DynamoDB 中的用户功能标志，检查请求的功能是否启用，如果禁用则返回 403。", "在 API Gateway 中使用 Lambda 授权器（REQUEST 类型）。验证 Cognito 令牌，查询 DynamoDB 获取功能标志，生成包含特定于功能的资源 ARN 及 Allow/Deny 语句的缓存 IAM 策略，并将缓存 TTL 设置为 5 分钟。", "使用 Cognito User Pool 授权器配合 Cognito Groups 来表示功能标志。当功能标志更改时更新组成员身份。API Gateway 授权器通过声明将组传递给 Lambda，Lambda 检查是否存在所需的功能组。", "配置 API Gateway 不使用授权器。Lambda 函数使用 JWKS 验证 Cognito 令牌，从 DynamoDB 查询功能标志，在 Lambda 执行上下文中缓存合并的授权决策，并为热容器调用重用。"], "explanation_zh": "当授权依赖于用户身份和外部数据源（如功能标志）时，Lambda 授权器（REQUEST 类型）是正确的选择。根据 AWS 文档，Lambda 授权器允许您通过接收完整请求上下文（标头、路径、查询字符串）、调用外部数据源并返回 API Gateway 在调用后端 Lambda 之前强制执行的 IAM 策略来实现自定义授权方案。\n\n为什么这是最佳方法：\n- 将授权逻辑集中在一个地方，而不是在每个后端 Lambda 函数中重复\n- API Gateway 在后端 Lambda 被调用之前强制执行返回的策略，更早阻止未授权请求\n- 内置授权缓存，可配置 TTL，减少重复的 DynamoDB 查询和 Lambda 调用\n- REQUEST 类型接收完整请求上下文，可实现基于路径和方法的特定授权决策\n\n为什么其他选项不正确：\n\nCognito 授权器 + 每个 Lambda 中的 DynamoDB：Cognito User Pool 授权器仅验证 JWT 令牌——它不能查询 DynamoDB 或强制执行功能标志。这迫使每个后端 Lambda 独立查询 DynamoDB 并实施授权逻辑，重复努力并将授权与业务逻辑混合。\nCognito Groups 作为功能标志：组成员身份在令牌颁发时嵌入 JWT。更改用户组需要他们重新认证以获取新令牌。这使得 Cognito Groups 不适用于必须实时更新的功能标志，而无需强制用户重新登录。\n无授权器 + Lambda 验证：当 API Gateway 上没有授权器时，API 端点对任何调用者都可公共访问。在 Lambda 执行上下文中缓存授权决策不可靠，因为容器不可预测地回收且没有缓存失效机制。"}, {"exam": 1, "id": 55, "question_en": "You're building a mobile photo-sharing app. Users authenticate with Amazon Cognito User Pools (email/password and Google social login). After authentication, users need to directly upload photos to S3 and query their photo metadata from DynamoDB. Each user should only access their own S3 folder and DynamoDB items. The solution must follow AWS security best practices for mobile applications.\n \nWhich architecture BEST meets these requirements?", "options_en": ["After User Pool authentication, mobile app sends the Cognito ID token to a Lambda function via API Gateway. Lambda assumes an IAM role using STS AssumeRole, generates S3 presigned URLs and DynamoDB credentials, and returns them to the mobile app. Mobile app uses these credentials for direct AWS service access.", "Configure a Cognito Identity Pool with User Pool as the authentication provider. After User Pool authentication, mobile app exchanges the ID token with Identity Pool for temporary AWS credentials mapped to an IAM role. Use IAM policy variables (`${cognito-identity.amazonaws.com:sub}`) to restrict S3 and DynamoDB access to user-specific resources.", "Create an IAM user for each app user with programmatic access. Store IAM credentials encrypted in DynamoDB with the Cognito User Pool `sub` as the key. After Cognito authentication, mobile app retrieves its IAM credentials from DynamoDB via API Gateway/Lambda and uses them for S3/DynamoDB access.", "Use Cognito User Pool authorizer in API Gateway with Lambda proxy integration. All S3 and DynamoDB operations go through Lambda functions that validate the user identity from Cognito claims and perform operations on behalf of the user using Lambda's execution role."], "correct": 1, "explanation_en": "The correct architecture is Cognito User Pool + Cognito Identity Pool with IAM policy variables. The User Pool handles authentication (email/password and Google social login) and issues an ID token. The mobile app exchanges that token with the Identity Pool, which maps the authenticated user to an IAM role and returns short-lived temporary AWS credentials. The IAM role policy uses the `${cognito-identity.amazonaws.com:sub}` variable to scope S3 access to `s3://bucket/users/{identity-id}/*` and DynamoDB access to items where the partition key matches the user's identity ID. This means each user's credentials are automatically restricted to only their own data — no custom authorization logic required.\n \nWhy the other options are incorrect:\n\nLambda generates presigned URLs and DynamoDB credentials via API Gateway: This adds unnecessary latency and complexity. Every S3 operation requires a round-trip through API Gateway and Lambda before the app can act. Presigned URLs also don't apply to DynamoDB, so that access path would still need a separate solution. The direct SDK pattern with Identity Pool credentials is simpler, lower-latency, and the AWS-recommended approach for mobile apps that need direct service access.\nCreate an IAM user per app user and store credentials in DynamoDB: This is a well-documented anti-pattern. IAM has a default limit of 5,000 users per account, making it unscalable for a consumer app. Access keys are long-term credentials — storing them in DynamoDB and retrieving them via a Lambda proxy exposes them to exfiltration and doesn't provide automatic revocation when a user account is deleted or suspended.\nRoute all S3 and DynamoDB operations through Lambda using the Lambda execution role: This means the mobile app never gets direct AWS credentials and must proxy every read and write through Lambda. This increases latency and cost for every operation, introduces Lambda as a bottleneck and single point of failure, and forgoes native SDK features like S3 multipart upload. Lambda proxy is appropriate when business logic or validation is needed — not for simple user-scoped storage access.\n", "question_zh": "您正在构建一个移动照片分享应用。用户使用 Amazon Cognito User Pools 进行认证（电子邮件/密码和 Google 社交登录）。认证后，用户需要直接将照片上传到 S3 并从 DynamoDB 查询其照片元数据。每个用户只能访问自己的 S3 文件夹和 DynamoDB 项目。解决方案必须遵循移动应用程序的 AWS 安全最佳实践。\n\n哪种架构最能满足这些要求？", "options_zh": ["User Pool 认证后，移动应用通过 API Gateway 将 Cognito ID 令牌发送到 Lambda 函数。Lambda 使用 STS AssumeRole 代入 IAM 角色，生成 S3 预签名 URL 和 DynamoDB 凭证，并将其返回给移动应用。移动应用使用这些凭证进行直接 AWS 服务访问。", "配置 Cognito Identity Pool 配合 User Pool 作为认证提供者。User Pool 认证后，移动应用将 ID 令牌与 Identity Pool 交换为映射到 IAM 角色的临时 AWS 凭证。使用 IAM 策略变量（`${cognito-identity.amazonaws.com:sub}`）将 S3 和 DynamoDB 访问限制为用户特定资源。", "为每个应用用户创建带有程序化访问的 IAM 用户。将 IAM 凭证加密存储在 DynamoDB 中，以 Cognito User Pool 的 `sub` 作为键。Cognito 认证后，移动应用通过 API Gateway/Lambda 从 DynamoDB 检索其 IAM 凭证，并将其用于 S3/DynamoDB 访问。", "在 API Gateway 中使用 Cognito User Pool 授权器配合 Lambda 代理集成。所有 S3 和 DynamoDB 操作通过 Lambda 函数进行，Lambda 函数验证来自 Cognito 声明的用户身份，并使用 Lambda 的执行角色代表用户执行操作。"], "explanation_zh": "正确的架构是 Cognito User Pool + Cognito Identity Pool 配合 IAM 策略变量。User Pool 处理认证（电子邮件/密码和 Google 社交登录）并颁发 ID 令牌。移动应用将该令牌与 Identity Pool 交换，后者将认证用户映射到 IAM 角色并返回短期临时 AWS 凭证。IAM 角色策略使用 `${cognito-identity.amazonaws.com:sub}` 变量将 S3 访问范围限定为 `s3://bucket/users/{identity-id}/*`，并将 DynamoDB 访问限制为分区键与用户身份 ID 匹配的项目。这意味着每个用户的凭证自动限制为仅其自己的数据——无需自定义授权逻辑。\n\n为什么其他选项不正确：\n\nLambda 通过 API Gateway 生成预签名 URL 和 DynamoDB 凭证：这增加了不必要的延迟和复杂性。每个 S3 操作在应用可以执行之前都需要通过 API Gateway 和 Lambda 进行往返。预签名 URL 也不适用于 DynamoDB，因此该访问路径仍然需要单独的解决方案。使用 Identity Pool 凭证的直接 SDK 模式更简单、延迟更低，是需要直接服务访问的移动应用的 AWS 推荐方法。\n为每个应用用户创建 IAM 用户并将凭证存储在 DynamoDB 中：这是充分记录的反模式。IAM 每个账户有 5,000 用户的默认限制，使其对于消费者应用不可扩展。访问密钥是长期凭证——将它们存储在 DynamoDB 中并通过 Lambda 代理检索会将它们暴露给窃取风险，并且在用户账户被删除或暂停时不提供自动撤销。\n通过 Lambda 路由所有 S3 和 DynamoDB 操作使用 Lambda 执行角色：这意味着移动应用永远不会获取直接 AWS 凭证，必须为每次读写代理通过 Lambda。这增加了每个操作的延迟和成本，将 Lambda 引入为瓶颈和单点故障，并失去了用户特定访问控制的优雅 IAM 策略变量解决方案。"}, {"exam": 1, "id": 56, "question_en": "Your mobile app uses Google as the sole identity provider (users sign in with \"Sign in with Google\"). After authentication, the app needs temporary AWS credentials to directly access S3 for file storage and invoke Lambda functions for backend processing. You do NOT want to use Amazon Cognito User Pools—only Google authentication is required.\n \nWhat is the MOST appropriate architecture?", "options_en": ["Configure Google as an OpenID Connect (OIDC) provider in IAM. Mobile app authenticates with Google, receives an OIDC ID token, then calls STS AssumeRoleWithWebIdentity directly with the Google token to receive temporary AWS credentials.", "Create a Cognito Identity Pool configured with Google as an external identity provider (no Cognito User Pool). Mobile app authenticates with Google, exchanges the Google ID token with Cognito Identity Pool for temporary AWS credentials, then directly accesses S3 and Lambda.", "Implement API Gateway with a Lambda authorizer that validates Google ID tokens by calling Google's tokeninfo endpoint. Lambda authorizer generates temporary credentials using STS AssumeRole and returns them in the authorization context for use by backend Lambda functions.", "Use AWS IAM Identity Center (AWS SSO) with Google Workspace as the identity source. Mobile app redirects users to Google for authentication, receives SAML assertion, exchanges it with IAM Identity Center for temporary credentials, then accesses AWS services."], "correct": 1, "explanation_en": "The correct architecture is a Cognito Identity
