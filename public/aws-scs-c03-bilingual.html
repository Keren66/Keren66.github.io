 configures a NAT Gateway in each AZ for private subnet outbound access: False. NAT Gateways are not created by default. They must be added manually or through Control Tower Customizations (CfCT) if outbound internet access is needed from private subnets.\n", "question_zh": "AWS Control Tower 在每个新成员账户中自动创建 VPC。网络架构师需要了解默认 VPC 配置以规划 IP 寻址和连接。\n\n哪个陈述准确描述了 Control Tower 创建的 VPC？", "options_zh": ["VPC 默认使用 /16 CIDR 块，每个账户提供 65,536 个 IP 地址。", "Control Tower 仅创建公有子网；您必须手动为不需要互联网访问的工作负载创建私有子网。", "VPC 自动启用 VPC Flow Logs，将日志发送到 Log Archive 账户的 S3 存储桶。", "Control Tower 在每个可用区配置一个 NAT Gateway，用于私有子网出站互联网访问。"], "explanation_zh": "Control Tower 自动创建的 VPC 使用 /16 CIDR 块（默认：172.31.0.0/16），每个账户提供 65,536 个 IP 地址。它在多个可用区中创建公有和私有子网，并为公有子网配置 Internet Gateway 和适当的路由表。CIDR 块可以在账户预置期间自定义。\n\n为什么其他选项不正确：\n\nControl Tower 仅创建公有子网：错误。Control Tower 自动在每个可用区中创建公有和私有子网。\nVPC Flow Logs 自动启用并发送到 Log Archive 账户：错误。VPC Flow Logs 在 Control Tower VPC 中默认不启用。它们可以通过护栏或自定义启用，但这不会在默认情况下自动发生。\nControl Tower 在每个 AZ 中为私有子网出站访问配置 NAT Gateway：错误。NAT Gateway 默认不创建。如果私有子网需要出站互联网访问，必须手动添加或通过 Control Tower Customizations (CfCT) 添加。"}, {"exam": 1, "id": 25, "question_en": "A Security Analyst discovers that a user's IAM Identity Center credentials were compromised. The user has active sessions across multiple AWS accounts via permission sets. You need to immediately revoke all active sessions for this user.\n \nWhat is the CORRECT sequence of steps to revoke active IAM role sessions created by IAM Identity Center permission sets?", "options_en": ["1) Delete the user from IAM Identity Center; 2) Wait for sessions to expire naturally (up to 12 hours)", "1) Disable the user in IAM Identity Center; 2) For each affected account, attach an IAM policy with `\"Condition\": {\"DateLessThan\": {\"aws:TokenIssueTime\": \"\"}}` to revoke sessions issued before now", "1) Remove the user from all permission set assignments in IAM Identity Center; 2) Call `DeleteAccessKey` API for each active session", "1) Update the trust policy of the IAM roles in each account to add a `\"Condition\": {\"StringEquals\": {\"sts:ExternalId\": \"revoked\"}}` condition; 2) Force the user to log out"], "correct": 1, "explanation_en": "The correct two-step process is: first, disable the user in IAM Identity Center to block new authentications immediately. Disabling the user prevents them from establishing any new sessions, but it does NOT terminate existing active role sessions already in progress. To revoke those, the second step is to attach an inline IAM policy to the IAM role(s) in each affected account with a `Deny` on all actions conditioned on `aws:TokenIssueTime` being less than the current timestamp. This invalidates all tokens issued before that point, effectively revoking every existing session without waiting for natural expiry.\n \nWhy the other options are incorrect:\n\nDelete the user from IAM Identity Center and wait for sessions to expire: Deleting the user does not revoke active sessions. Session tokens remain valid until they naturally expire, which can take up to 12 hours. For a compromised credential incident, waiting hours is not acceptable.\nRemove permission set assignments and call `DeleteAccessKey` for each session: IAM Identity Center permission sets generate temporary STS role credentials, not IAM access keys. The `DeleteAccessKey` API applies to long-term IAM user credentials and has no effect on temporary STS session tokens.\nUpdate the role trust policy to add an ExternalId condition and force logout: Modifying the trust policy does not terminate existing sessions — it only affects future `AssumeRole` calls. Additionally, `ExternalId` is a condition for cross-account role assumption by third-party services, not a session revocation mechanism.\n", "question_zh": "一名安全分析师发现用户的 IAM Identity Center 凭证已被泄露。该用户通过权限集在多个 AWS 账户中拥有活动会话。您需要立即撤销该用户的所有活动会话。\n\n撤销由 IAM Identity Center 权限集创建的活跃 IAM 角色会话的正确步骤顺序是什么？", "options_zh": ["1) 从 IAM Identity Center 删除用户；2) 等待会话自然过期（最多 12 小时）", "1) 在 IAM Identity Center 中禁用用户；2) 对于每个受影响的账户，附加一个带有条件 `\"Condition\": {\"DateLessThan\": {\"aws:TokenIssueTime\": \"\"}}` 的 IAM 策略，以撤销在当前时间之前发出的会话", "1) 从 IAM Identity Center 中的所有权限集分配中移除用户；2) 对每个活动会话调用 `DeleteAccessKey` API", "1) 更新每个账户中 IAM 角色的信任策略，添加条件 `\"Condition\": {\"StringEquals\": {\"sts:ExternalId\": \"revoked\"}}`；2) 强制用户注销"], "explanation_zh": "正确的两步过程是：首先，在 IAM Identity Center 中禁用用户以立即阻止新的身份验证。禁用用户可防止他们建立任何新会话，但不会终止已在进行中的现有活动角色会话。要撤销这些会话，第二步是在每个受影响的账户中为 IAM 角色附加一个内联 IAM 策略，对所有操作使用 `Deny`，条件为 `aws:TokenIssueTime` 小于当前时间戳。这会使在该时间点之前发出的所有令牌失效，从而有效撤销每个现有会话，无需等待自然过期。\n\n为什么其他选项不正确：\n\n从 IAM Identity Center 删除用户并等待会话过期：删除用户不会撤销活动会话。会话令牌在自然过期前保持有效，可能需要长达 12 小时。对于凭证泄露事件，等待数小时是不可接受的。\n移除权限集分配并对每个会话调用 `DeleteAccessKey`：IAM Identity Center 权限集生成临时 STS 角色凭证，而不是 IAM 访问密钥。`DeleteAccessKey` API 适用于长期 IAM 用户凭证，对临时 STS 会话令牌无效。\n更新角色信任策略添加 ExternalId 条件并强制注销：修改信任策略不会终止现有会话——它仅影响未来的 `AssumeRole` 调用。此外，`ExternalId` 是第三方服务跨账户角色代入的条件，不是会话撤销机制。"}, {"exam": 1, "id": 26, "question_en": "A security engineer is standardizing encryption across the organization. The team currently uses an asymmetric RSA KMS key for digital signing and wants to reuse it for EBS volume encryption to simplify key management. They also want to understand how KMS key rotation affects existing encrypted volumes.\n \nWhich statement is TRUE about EBS encryption with KMS keys?", "options_en": ["When you enable automatic key rotation for a customer managed key used by EBS, all existing encrypted volumes are automatically re-encrypted with the new key material.", "EBS encryption supports only symmetric encryption KMS keys; asymmetric keys cannot be used for EBS volume encryption.", "You must grant the AWS service principal `ebs.amazonaws.com` permission to use your customer managed key through the key policy.", "The AWS managed key `aws/ebs` is automatically rotated every 3 years and cannot be disabled or configured."], "correct": 1, "explanation_en": "EBS only supports symmetric encryption KMS keys. Asymmetric KMS keys (such as RSA keys used for signing) cannot be used for EBS volume encryption because EBS encryption relies on envelope encryption, which requires a single key for both encryption and decryption.\n \nWhy other options are incorrect:\n\nRe-encryption after key rotation: When automatic key rotation occurs, AWS KMS retains all previous key versions. Existing volumes continue using their original key material for decryption. No re-encryption is needed — rotation is transparent to applications and does not affect existing volumes.\nThe `ebs.amazonaws.com` service principal: EBS encryption grants are issued to the EC2 service, not to an `ebs.amazonaws.com` service principal. There is no separate EBS service principal for KMS key policies.\nAWS managed key rotation frequency: The AWS managed key `aws/ebs` rotates annually (every 1 year), not every 3 years.\n", "question_zh": "一名安全工程师正在整个组织中标准化加密。团队当前使用非对称 RSA KMS 密钥进行数字签名，并希望将其重用于 EBS 卷加密以简化密钥管理。他们还想了解 KMS 密钥轮换如何影响现有的加密卷。\n\n关于使用 KMS 密钥进行 EBS 加密，哪个陈述是正确的？", "options_zh": ["当您为 EBS 使用的 customer managed key 启用自动密钥轮换时，所有现有的加密卷会自动使用新密钥材料重新加密。", "EBS 加密仅支持对称加密 KMS 密钥；非对称密钥不能用于 EBS 卷加密。", "您必须通过密钥策略授予 AWS 服务主体 `ebs.amazonaws.com` 使用您的 customer managed key 的权限。", "AWS managed key `aws/ebs` 每 3 年自动轮换一次，不能禁用或配置。"], "explanation_zh": "EBS 仅支持对称加密 KMS 密钥。非对称 KMS 密钥（如用于签名的 RSA 密钥）不能用于 EBS 卷加密，因为 EBS 加密依赖信封加密，需要一个单一密钥同时用于加密和解密。\n\n为什么其他选项不正确：\n\n密钥轮换后重新加密：当自动密钥轮换发生时，AWS KMS 保留所有先前的密钥版本。现有卷继续使用其原始密钥材料进行解密。不需要重新加密——轮换对应用程序是透明的，不影响现有卷。\n`ebs.amazonaws.com` 服务主体：EBS 加密授权是向 EC2 服务发出的，而不是向 `ebs.amazonaws.com` 服务主体。KMS 密钥策略没有单独的 EBS 服务主体。\nAWS managed key 轮换频率：AWS managed key `aws/ebs` 每年轮换一次（每 1 年），而不是每 3 年。"}, {"exam": 1, "id": 27, "question_en": "A data analytics team wants to encrypt data at rest and in transit for their Amazon EMR cluster processing sensitive healthcare data. They need to understand how EMR integrates with AWS KMS for encryption.\n \nWhich statement about EMR encryption with KMS is TRUE?", "options_en": ["EMR supports encrypting EMRFS data in S3 using KMS, but local disk encryption requires LUKS encryption configured at the OS level.", "When using KMS for EMR encryption, each EMR cluster node retrieves the data encryption key directly from KMS for every read/write operation.", "EMR supports both SSE-KMS (server-side encryption) and CSE-KMS (client-side encryption) for S3 data, with CSE-KMS providing encryption before data leaves the EMR cluster.", "You can use the same KMS key for encrypting both local disk volumes and EMRFS data in S3."], "correct": 2, "explanation_en": "EMR supports two KMS-based encryption modes for S3 data (EMRFS): SSE-KMS, where S3 encrypts data server-side using KMS, and CSE-KMS, where the EMR cluster encrypts data client-side before it is sent to S3. CSE-KMS provides stronger data sovereignty guarantees because the data is encrypted before it ever leaves the cluster.\n \nWhy the other options are incorrect:\n\nEMRFS via KMS but requiring LUKS for local disk encryption: EMR natively supports KMS for both EMRFS (S3) and local disk (EBS volume) encryption through the EMR security configuration. Manual LUKS configuration at the OS level is not required.\nEach cluster node calling KMS directly for every read/write operation: EMR uses envelope encryption. KMS generates a data key once per context; that data key is cached on the cluster node and used for the actual encrypt/decrypt operations. Direct KMS calls are not made for every individual read or write, which would introduce unacceptable latency at scale.\nThe same KMS key cannot be used for both local disk and EMRFS encryption: This is false — EMR security configurations allow the same customer managed KMS key to be specified for both local disk (EBS) encryption and EMRFS S3 encryption, simplifying key management.\n", "question_zh": "一个数据分析团队希望为其处理敏感医疗数据的 Amazon EMR 集群加密静态数据和传输中数据。他们需要了解 EMR 如何与 AWS KMS 集成进行加密。\n\n关于使用 KMS 进行 EMR 加密，哪个陈述是正确的？", "options_zh": ["EMR 支持使用 KMS 加密 S3 中的 EMRFS 数据，但本地磁盘加密需要在操作系统级别配置 LUKS 加密。", "当使用 KMS 进行 EMR 加密时，每个 EMR 集群节点直接为每次读/写操作从 KMS 检索数据加密密钥。", "EMR 为 S3 数据同时支持 SSE-KMS（服务器端加密）和 CSE-KMS（客户端加密），CSE-KMS 在数据离开 EMR 集群之前提供加密。", "您不能使用相同的 KMS 密钥加密本地磁盘卷和 S3 中的 EMRFS 数据。"], "explanation_zh": "EMR 为 S3 数据（EMRFS）支持两种基于 KMS 的加密模式：SSE-KMS，S3 使用 KMS 在服务器端加密数据；CSE-KMS，EMR 集群在数据发送到 S3 之前在客户端加密数据。CSE-KMS 提供更强的数据主权保证，因为数据在离开集群之前就已加密。\n\n为什么其他选项不正确：\n\n通过 KMS 的 EMRFS 但需要 LUKS 进行本地磁盘加密：EMR 通过 EMR 安全配置原生支持 KMS 进行 EMRFS（S3）和本地磁盘（EBS 卷）加密。不需要在操作系统级别手动配置 LUKS。\n每个集群节点直接为每次读/写操作调用 KMS：EMR 使用信封加密。KMS 为每个上下文生成一次数据密钥；该数据密钥缓存在集群节点上，用于实际的加密/解密操作。不会为每个单独的读或写进行直接 KMS 调用，这会在规模上引入不可接受的延迟。\n相同的 KMS 密钥不能用于本地磁盘和 EMRFS 加密：这是错误的——EMR 安全配置允许为本地磁盘（EBS）加密和 EMRFS S3 加密指定相同的 customer managed KMS 密钥，简化密钥管理。"}, {"exam": 1, "id": 28, "question_en": "A financial services company uses Amazon Redshift to analyze transaction data. They want to migrate from an unencrypted Redshift cluster to one encrypted with a customer managed KMS key. The cluster contains 10 TB of data and must remain available during migration.\n \nWhat is the correct approach to migrate to an encrypted Redshift cluster?", "options_en": ["Enable encryption on the existing cluster using the AWS CLI `modify-cluster` command with `--encrypted` and `--kms-key-id` parameters; Redshift encrypts data in place over 24-48 hours.", "Create a manual snapshot of the unencrypted cluster, copy the snapshot with encryption enabled specifying the KMS key, restore a new cluster from the encrypted snapshot, then redirect applications to the new cluster.", "Use AWS Database Migration Service (DMS) to replicate data from the unencrypted cluster to a new encrypted cluster with zero downtime.", "Enable encryption at the database level using Redshift's `ALTER DATABASE ENCRYPT` command, which encrypts data table-by-table during maintenance windows."], "correct": 1, "explanation_en": "Amazon Redshift does not support enabling encryption on an existing unencrypted cluster in-place. The correct migration path is: create a manual snapshot of the existing cluster, copy that snapshot with encryption enabled (specifying the customer managed KMS key during the copy operation), restore a new cluster from the encrypted snapshot, then redirect applications to the new cluster endpoint and decommission the original.\n \nWhy the other options are incorrect:\n\nUsing `modify-cluster` with `--encrypted` and `--kms-key-id` to encrypt in place over 24-48 hours: Redshift does not support modifying an existing cluster to add encryption. Encryption is a cluster-level property that must be set at creation time. The `modify-cluster` command does not accept encryption parameters for this purpose.\nUsing AWS Database Migration Service (DMS) to replicate data with zero downtime: While DMS can migrate data between Redshift clusters, it is not the standard or recommended approach for this specific use case. The snapshot copy and restore approach is simpler, natively supported by Redshift, and does not require setting up DMS replication infrastructure.\nUsing an `ALTER DATABASE ENCRYPT` SQL command during maintenance windows: No such SQL command exists in Redshift. Encryption in Redshift is a cluster-wide infrastructure-level setting, not a database-level SQL operation.\n", "question_zh": "一家金融服务公司使用 Amazon Redshift 分析交易数据。他们希望从不加密的 Redshift 集群迁移到使用 customer managed KMS 密钥加密的集群。该集群包含 10 TB 数据，迁移期间必须保持可用。\n\n迁移到加密 Redshift 集群的正确方法是什么？", "options_zh": ["使用 AWS CLI 的 `modify-cluster` 命令配合 `--encrypted` 和 `--kms-key-id` 参数在现有集群上启用加密；Redshift 在 24-48 小时内原地加密数据。", "创建不加密集群的手动快照，在启用加密并指定 KMS 密钥的情况下复制快照，从加密快照恢复新集群，然后将应用程序重定向到新集群。", "使用 AWS Database Migration Service (DMS) 以零停机时间将数据从不加密集群复制到新的加密集群。", "使用 Redshift 的 `ALTER DATABASE ENCRYPT` 命令在数据库级别启用加密，该命令在维护窗口期间逐表加密数据。"], "explanation_zh": "Amazon Redshift 不支持在现有不加密集群上原地启用加密。正确的迁移路径是：创建现有集群的手动快照，在启用加密的情况下复制该快照（在复制操作期间指定 customer managed KMS 密钥），从加密快照恢复新集群，然后将应用程序重定向到新集群端点并停用原始集群。\n\n为什么其他选项不正确：\n\n使用 `modify-cluster` 配合 `--encrypted` 和 `--kms-key-id` 在 24-48 小时内原地加密：Redshift 不支持修改现有集群以添加加密。加密是必须在创建时设置的集群级别属性。`modify-cluster` 命令不接受用于此目的的加密参数。\n使用 AWS Database Migration Service (DMS) 以零停机时间复制数据：虽然 DMS 可以在 Redshift 集群之间迁移数据，但这不是此特定用例的标准或推荐方法。快照复制和恢复方法更简单，由 Redshift 原生支持，不需要设置 DMS 复制基础设施。\n在维护窗口期间使用 `ALTER DATABASE ENCRYPT` SQL 命令：Redshift 中不存在此类 SQL 命令。Redshift 中的加密是集群范围的基础设施级别设置，而不是数据库级别的 SQL 操作。"}, {"exam": 1, "id": 29, "question_en": "Your organization wants to implement Attribute-Based Access Control (ABAC) for KMS keys. Development teams should only be able to use KMS keys that match their team tag. Team Alpha has users tagged with `Team=Alpha` and keys tagged with `Project=Alpha-Backend`.\n \nWhich IAM policy correctly implements ABAC to allow users to use only their team's KMS keys?", "options_en": ["`{\n \"Effect\": \"Allow\",\n \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"kms:ResourceTag/Team\": \"${aws:PrincipalTag/Team}\"\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:ResourceTag/Project\": \"${aws:PrincipalTag/Team}\"\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"],\n \"Resource\": \"arn:aws:kms:*:*:key/*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:RequestTag/Team\": \"${aws:PrincipalTag/Team}\"\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"ForAllValues:StringEquals\": {\n \"kms:ResourceTag/Team\": [\"Alpha\", \"Beta\", \"Gamma\"]\n }\n }\n}`"], "correct": 0, "explanation_en": "ABAC for KMS works by comparing a tag on the IAM principal (user/role) to a tag on the KMS key resource. The correct policy uses `kms:ResourceTag/Team` to read the `Team` tag on the KMS key and compares it to `${aws:PrincipalTag/Team}`, which dynamically resolves to the Team tag value of the calling principal. Access is only granted when the two tags match — no hardcoded team names are needed, and the same policy works for all teams automatically.\n \nWhy the other options are incorrect:\n\nPolicy using `aws:ResourceTag/Project` compared to `${aws:PrincipalTag/Team}`: Two problems here. First, `aws:ResourceTag` is the generic IAM condition key namespace; for KMS resources, the correct namespace is `kms:ResourceTag`. Second, comparing a `Project` tag on the key to a `Team` tag on the principal is a tag key mismatch — the tag names are different and the values will not align as intended.\nPolicy using `aws:RequestTag/Team`: `aws:RequestTag` checks for tags being submitted in the API request itself (e.g., when creating or tagging a resource). It does not read the tags already present on an existing KMS key. Using it here would never match for encryption/decryption operations.\nPolicy using `ForAllValues:StringEquals` with hardcoded team names: Hardcoding team names (Alpha, Beta, Gamma) defeats the purpose of ABAC. Every time a new team is added or renamed, the policy must be manually updated. It also grants access to all listed teams regardless of which team the calling principal belongs to, providing no actual team-level isolation.\n", "question_zh": "您的组织希望为 KMS 密钥实施基于属性的访问控制（ABAC）。开发团队应只能使用与其团队标签匹配的 KMS 密钥。Team Alpha 的用户带有 `Team=Alpha` 标签，密钥带有 `Project=Alpha-Backend` 标签。\n\n哪个 IAM 策略正确实施了 ABAC，允许用户仅使用其团队的 KMS 密钥？", "options_zh": ["`{\"Effect\": \"Allow\", \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"], \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"kms:ResourceTag/Team\": \"${aws:PrincipalTag/Team}\"}}}`", "`{\"Effect\": \"Allow\", \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"], \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"aws:ResourceTag/Project\": \"${aws:PrincipalTag/Team}\"}}}`", "`{\"Effect\": \"Allow\", \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"], \"Resource\": \"arn:aws:kms:*:*:key/*\", \"Condition\": {\"StringEquals\": {\"aws:RequestTag/Team\": \"${aws:PrincipalTag/Team}\"}}}`", "`{\"Effect\": \"Allow\", \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\", \"kms:GenerateDataKey\"], \"Resource\": \"*\", \"Condition\": {\"ForAllValues:StringEquals\": {\"kms:ResourceTag/Team\": [\"Alpha\", \"Beta\", \"Gamma\"]}}}`"], "explanation_zh": "KMS 的 ABAC 通过比较 IAM 主体（用户/角色）上的标签与 KMS 密钥资源上的标签来工作。正确的策略使用 `kms:ResourceTag/Team` 读取 KMS 密钥上的 `Team` 标签，并将其与 `${aws:PrincipalTag/Team}` 进行比较，后者动态解析为调用主体的 Team 标签值。仅当两个标签匹配时才授予访问权限——无需硬编码团队名称，同一策略自动适用于所有团队。\n\n为什么其他选项不正确：\n\n使用 `aws:ResourceTag/Project` 与 `${aws:PrincipalTag/Team}` 比较的策略：这里有两个问题。首先，`aws:ResourceTag` 是通用的 IAM 条件键命名空间；对于 KMS 资源，正确的命名空间是 `kms:ResourceTag`。其次，将密钥上的 `Project` 标签与主体上的 `Team` 标签比较是标签键不匹配——标签名称不同，值不会按预期对齐。\n使用 `aws:RequestTag/Team` 的策略：`aws:RequestTag` 检查 API 请求本身中正在提交的标签（例如，在创建或标记资源时）。它不会读取现有 KMS 密钥上已存在的标签。在此处使用它永远不会匹配加密/解密操作。\n使用 `ForAllValues:StringEquals` 配合硬编码团队名称的策略：硬编码团队名称（Alpha、Beta、Gamma）违背了 ABAC 的目的。每次添加或重命名新团队时，策略都必须手动更新。它还授予对所有列出团队的访问权限，而不管调用主体属于哪个团队，没有提供实际的团队级别隔离。"}, {"exam": 1, "id": 30, "question_en": "A DevOps team has the ability to create IAM roles for their applications. The security team wants to ensure that the DevOps team cannot create roles with more permissions than their own role has. The DevOps role has `AdministratorAccess` within their account but should not be able to escalate privileges.\n \nHow should you implement this restriction using IAM permissions boundaries?", "options_en": ["Attach a permissions boundary to the DevOps role that denies `iam:CreateRole` and `iam:PutRolePolicy` actions.", "Create a permissions boundary policy that defines maximum allowed permissions, then require the DevOps team to attach this boundary to all roles they create by denying `iam:CreateRole` unless `iam:PermissionsBoundary` is set.", "Use an SCP to prevent the DevOps team from creating roles with the `AdministratorAccess` policy attached.", "Create a resource-based policy on IAM roles that prevents the DevOps team from assuming roles with elevated permissions."], "correct": 1, "explanation_en": "The correct approach is to create a permissions boundary policy defining the maximum allowed permissions, then require the DevOps team to attach it to every role they create by conditioning `iam:CreateRole` on `iam:PermissionsBoundary` being set to the approved boundary ARN. This way, even if the DevOps team attaches `AdministratorAccess` to a role, the boundary caps the effective permissions to only what the boundary allows. The DevOps team cannot remove the boundary without a separate explicit permission, preventing escalation. Permissions boundaries define the maximum permissions an entity can have — effective permissions are the intersection of the identity policy and the boundary.\n \nWhy the other options are incorrect:\n\nAttaching a boundary to the DevOps role that denies `iam:CreateRole` and `iam:PutRolePolicy`: Denying role creation and policy attachment entirely prevents the DevOps team from doing their job. The requirement is not to block role creation, but to ensure created roles cannot exceed a defined permission ceiling.\nUsing an SCP to prevent the DevOps team from attaching `AdministratorAccess`: SCPs apply to all principals in an account (or OU), not selectively to the DevOps team. An SCP blocking `AdministratorAccess` attachment would affect every principal in the account, including legitimate administrators.\nCreating a resource-based policy on IAM roles: IAM roles do not support resource-based policies. They have trust policies (controlling who can assume the role) and permission policies (controlling what the role can do), but no resource-based policy mechanism that could constrain role creation by the DevOps team.\n", "question_zh": "一个 DevOps 团队有能力为其应用程序创建 IAM 角色。安全团队希望确保 DevOps 团队不能创建比其自身角色拥有更多权限的角色。DevOps 角色在其账户内拥有 `AdministratorAccess`，但不应该能够提升权限。\n\n您应如何使用 IAM 权限边界来实施此限制？", "options_zh": ["将权限边界附加到 DevOps 角色，拒绝 `iam:CreateRole` 和 `iam:PutRolePolicy` 操作。", "创建一个定义最大允许权限的权限边界策略，然后通过拒绝没有设置 `iam:PermissionsBoundary` 的 `iam:CreateRole` 来要求 DevOps 团队将此边界附加到他们创建的所有角色。", "使用 SCP 防止 DevOps 团队创建附加了 `AdministratorAccess` 策略的角色。", "在 IAM 角色上创建基于资源的策略，防止 DevOps 团队代入具有提升权限的角色。"], "explanation_zh": "正确的方法是创建一个定义最大允许权限的权限边界策略，然后通过以 `iam:PermissionsBoundary` 设置为批准的边界 ARN 为条件来要求 DevOps 团队将其附加到他们创建的每个角色。这样，即使 DevOps 团队将 `AdministratorAccess` 附加到角色，边界也会将有效权限限制为仅边界允许的内容。DevOps 团队没有单独的显式权限来移除边界，从而防止权限提升。权限边界定义了实体可以拥有的最大权限——有效权限是身份策略和边界的交集。\n\n为什么其他选项不正确：\n\n将拒绝 `iam:CreateRole` 和 `iam:PutRolePolicy` 的边界附加到 DevOps 角色：完全拒绝角色创建和策略附加会阻止 DevOps 团队完成其工作。要求不是阻止角色创建，而是确保创建的角色不能超过定义的权限上限。\n使用 SCP 防止 DevOps 团队附加 `AdministratorAccess`：SCP 适用于账户（或 OU）中的所有主体，而不是选择性地适用于 DevOps 团队。阻止 `AdministratorAccess` 附加的 SCP 会影响账户中的每个主体，包括合法的管理员。\n在 IAM 角色上创建基于资源的策略：IAM 角色不支持基于资源的策略。它们有信任策略（控制谁可以代入角色）和权限策略（控制角色可以做什么），但没有可以限制 DevOps 团队创建角色的基于资源的策略机制。"}, {"exam": 1, "id": 31, "question_en": "Your company uses IAM Identity Center (AWS SSO) for federated access. Users from the Finance team should be automatically redirected to the EC2 console in the `us-west-2` region when they sign in, rather than the default AWS console home page.\n \nHow can you configure the relay state to redirect Finance team users to the EC2 console in `us-west-2`?", "options_en": ["Set the relay state in the permission set to: `https://console.aws.amazon.com/ec2/v2/home?region=us-west-2`", "Configure an AWS Lambda function that intercepts the SAML response and modifies the redirect URL based on user attributes.", "Set the relay state in the permission set to: `https://us-west-2.console.aws.amazon.com/ec2`", "Add a SAML attribute mapping in the identity provider configuration with `RelayState=ec2` and `Region=us-west-2`."], "correct": 0, "explanation_en": "The relay state field on an IAM Identity Center permission set accepts a full console URL and redirects users to that destination immediately after authentication. The correct AWS console URL format uses the region as a query parameter, not a subdomain:\n`https://console.aws.amazon.com/ec2/v2/home?region=us-west-2`\nThis URL is set directly on the permission set assigned to the Finance team group. Users can still navigate to other services after the redirect.\n \nWhy the other options are incorrect:\n\nLambda function intercepting the SAML response: Relay state is a native, built-in feature of IAM Identity Center permission sets. No custom Lambda function or SAML interception is needed — it is a simple URL field in the permission set configuration.\nURL using a regional subdomain (`https://us-west-2.console.aws.amazon.com/ec2`): AWS console URLs do not use the region as a subdomain for relay state purposes. The correct format appends the region as a `?region=` query parameter on the global `console.aws.amazon.com` domain.\nSAML attribute mapping with `RelayState=ec2` and `Region=us-west-2`: Relay state is not configured through SAML attribute mappings on the identity provider side. It is a URL string set within the IAM Identity Center permission set, independent of the IdP configuration.\n", "question_zh": "您的公司使用 IAM Identity Center（AWS SSO）进行联合访问。来自 Finance 团队的用户在登录时应自动重定向到 `us-west-2` 区域的 EC2 控制台，而不是默认的 AWS 控制台主页。\n\n如何配置中继状态以将 Finance 团队用户重定向到 `us-west-2` 中的 EC2 控制台？", "options_zh": ["在权限集中将中继状态设置为：`https://console.aws.amazon.com/ec2/v2/home?region=us-west-2`", "配置 AWS Lambda 函数拦截 SAML 响应并根据用户属性修改重定向 URL。", "在权限集中将中继状态设置为：`https://us-west-2.console.aws.amazon.com/ec2`", "在身份提供者配置中添加带有 `RelayState=ec2` 和 `Region=us-west-2` 的 SAML 属性映射。"], "explanation_zh": "IAM Identity Center 权限集上的中继状态字段接受完整的控制台 URL，并在身份验证后立即将用户重定向到该目的地。正确的 AWS 控制台 URL 格式使用区域作为查询参数，而不是子域名：\n`https://console.aws.amazon.com/ec2/v2/home?region=us-west-2`\n此 URL 直接设置在分配给 Finance 团队组的权限集上。用户在重定向后仍可导航到其他服务。\n\n为什么其他选项不正确：\n\nLambda 函数拦截 SAML 响应：中继状态是 IAM Identity Center 权限集的原生内置功能。不需要自定义 Lambda 函数或 SAML 拦截——它是权限集配置中的一个简单 URL 字段。\n使用区域子域名的 URL（`https://us-west-2.console.aws.amazon.com/ec2`）：AWS 控制台 URL 不会使用区域作为子域名用于中继状态。正确的格式是在全局 `console.aws.amazon.com` 域上将区域作为 `?region=` 查询参数附加。\nSAML 属性映射配合 `RelayState=ec2` 和 `Region=us-west-2`：中继状态不是通过身份提供者端的 SAML 属性映射配置的。它是在 IAM Identity Center 权限集内设置的 URL 字符串，独立于 IdP 配置。"}, {"exam": 1, "id": 32, "question_en": "Your organization uses IAM Identity Center with an external IdP (Okta). You want to implement ABAC so users can only access S3 buckets tagged with their department. Users have a `Department` attribute in Okta (e.g., `Department=Finance`).\n \nWhat is the correct implementation sequence?", "options_en": ["1) Configure attribute mappings in IAM Identity Center to map Okta's `Department` to session tag `Department`; 2) Create permission sets with IAM policies using `${aws:PrincipalTag/Department}` variable; 3) Apply permission sets to users", "1) Create IAM users for each Okta user with Department tags; 2) Configure IAM Identity Center to assume these IAM users; 3) Use tag-based policies", "1) Export user attributes from Okta to DynamoDB; 2) Create Lambda function to inject tags during authentication; 3) Use CloudFormation to deploy user-specific IAM policies", "1) Configure permission sets with inline policies containing department names; 2) Assign permission sets to users based on Okta groups; 3) Users inherit department from group membership"], "correct": 0, "explanation_en": "ABAC in IAM Identity Center requires three steps in sequence: First, configure attribute mappings in IAM Identity Center to map Okta's `Department` attribute to a session tag named `Department`. Second, create a permission set whose IAM policy uses the `${aws:PrincipalTag/Department}` variable to dynamically match S3 bucket tags to the user's department — no hardcoded department names needed. Third, assign the permission set to users or groups. At authentication time, IAM Identity Center receives the `Department` attribute from Okta, embeds it as a session tag, and the policy variable resolves automatically.\n \nWhy the other options are incorrect:\n\nCreating IAM users per Okta user with Department tags, then having Identity Center assume those IAM users: IAM Identity Center does not assume IAM users — it generates temporary credentials via IAM roles. Creating per-user IAM users defeats the purpose of federated identity and is an unscalable anti-pattern.\nExporting attributes to DynamoDB, injecting tags via Lambda during authentication, and deploying user-specific CloudFormation policies: This is vastly over-engineered. IAM Identity Center has built-in attribute mapping that handles IdP-to-session-tag propagation natively without any custom infrastructure.\nAssigning different permission sets per department group with hardcoded department names in inline policies: This is traditional group-based access control (GBAC), not ABAC. It requires creating and maintaining a separate permission set for every department, and policies must be updated manually whenever department names change or new departments are added. ABAC solves this with a single dynamic policy.\n", "question_zh": "您的组织使用 IAM Identity Center 配合外部 IdP（Okta）。您希望实施 ABAC，使用户只能访问标记了其部门的 S3 存储桶。用户在 Okta 中有一个 `Department` 属性（例如 `Department=Finance`）。\n\n正确的实施顺序是什么？", "options_zh": ["1) 在 IAM Identity Center 中配置属性映射，将 Okta 的 `Department` 映射到会话标签 `Department`；2) 创建使用 `${aws:PrincipalTag/Department}` 变量的 IAM 策略的权限集；3) 将权限集应用于用户", "1) 为每个 Okta 用户创建带有 Department 标签的 IAM 用户；2) 配置 IAM Identity Center 代入这些 IAM 用户；3) 使用基于标签的策略", "1) 从 Okta 导出用户属性到 DynamoDB；2) 创建 Lambda 函数在身份验证期间注入标签；3) 使用 CloudFormation 部署用户特定的 IAM 策略", "1) 配置包含部门名称的内联策略的权限集；2) 根据 Okta 组将权限集分配给用户；3) 用户从组成员身份继承部门"], "explanation_zh": "IAM Identity Center 中的 ABAC 需要三个步骤依次执行：首先，在 IAM Identity Center 中配置属性映射，将 Okta 的 `Department` 属性映射到名为 `Department` 的会话标签。其次，创建一个权限集，其 IAM 策略使用 `${aws:PrincipalTag/Department}` 变量将 S3 存储桶标签动态匹配到用户的部门——无需硬编码部门名称。第三，将权限集分配给用户或组。在身份验证时，IAM Identity Center 接收来自 Okta 的 `Department` 属性，将其嵌入为会话标签，策略变量自动解析。\n\n为什么其他选项不正确：\n\n为每个 Okta 用户创建带有 Department 标签的 IAM 用户，然后让 Identity Center 代入这些 IAM 用户：IAM Identity Center 不代入 IAM 用户——它通过 IAM 角色生成临时凭证。为每个用户创建 IAM 用户违背了联合身份的目的，是一种不可扩展的反模式。\n将属性导出到 DynamoDB，在身份验证期间通过 Lambda 注入标签，并部署用户特定的 CloudFormation 策略：这严重过度设计。IAM Identity Center 具有内置的属性映射，原生处理 IdP 到会话标签的传播，无需任何自定义基础设施。\n为每个部门组分配不同的权限集，内联策略中包含硬编码的部门名称：这是传统的基于组的访问控制（GBAC），而不是 ABAC。需要为每个部门创建和维护单独的权限集，策略必须在部门名称更改或添加新部门时手动更新。ABAC 通过单个动态策略解决了这个问题。"}, {"exam": 1, "id": 33, "question_en": "Your company uses Amazon Bedrock with a resource-based policy that allows the Bedrock service to access an S3 bucket. A security review identified a potential confused deputy vulnerability where an attacker in a different account could potentially trick Bedrock into accessing your S3 bucket.\n \nWhich condition keys should you use to prevent the confused deputy problem, and what's the difference?", "options_en": ["Use `aws:SourceAccount` to restrict access to Bedrock resources in your account; this prevents any cross-account confused deputy attacks.", "Use `aws:SourceArn` to restrict to specific Bedrock resources; use `aws:SourceAccount` as a backup when you don't know the full ARN (e.g., for resources not yet created).", "Use `aws:PrincipalArn` to verify that only your account's Bedrock service principal can access the S3 bucket.", "Use both `aws:SourceArn` AND `aws:SourceAccount` together with an AND condition to provide maximum protection."], "correct": 1, "explanation_en": "The correct approach uses both condition keys, but for different purposes: `aws:SourceArn` provides the most precise restriction by scoping access to a specific Bedrock resource ARN — use this when you know the full ARN. `aws:SourceAccount` is the appropriate fallback when you do not yet know the full ARN (e.g., for resources not yet created), as it scopes access to any Bedrock resource within your account. Use one or the other depending on whether the specific ARN is known — `aws:SourceArn` is always preferred when available because it provides a narrower, more secure constraint.\n \nWhy the other options are incorrect:\n\nUsing only `aws:SourceAccount` to prevent cross-account confused deputy attacks: While `aws:SourceAccount` does protect against cross-account confused deputy attacks, it is less precise than `aws:SourceArn` when the specific resource ARN is known. It allows any Bedrock resource in your account to trigger the access, rather than restricting to specific resources.\nUsing `aws:PrincipalArn` to verify your account's Bedrock service principal: `aws:PrincipalArn` checks the ARN of the IAM principal making the call — the calling identity. For service-to-service calls, the principal is the AWS service role, not your Bedrock resource. This does not prevent a confused deputy attack from another customer's account using the same Bedrock service.\nUsing both `aws:SourceArn` AND `aws:SourceAccount` together with an AND condition: Using both simultaneously is unnecessarily restrictive and not the recommended pattern. AWS documentation recommends using `aws:SourceArn` when the ARN is known, or `aws:SourceAccount` when it is not — not both together, as that creates overly tight conditions that can cause legitimate requests to fail.\n", "question_zh": "您的公司使用 Amazon Bedrock，其基于资源的策略允许 Bedrock 服务访问 S3 存储桶。安全审查发现了一个潜在的 confused deputy 漏洞，即不同账户中的攻击者可能欺骗 Bedrock 访问您的 S3 存储桶。\n\n您应该使用哪些条件键来防止 confused deputy 问题，它们之间有什么区别？", "options_zh": ["使用 `aws:SourceAccount` 将访问限制为您账户中的 Bedrock 资源；这可以防止任何跨账户 confused deputy 攻击。", "使用 `aws:SourceArn` 限制到特定的 Bedrock 资源；当您不知道完整 ARN 时（例如，对于尚未创建的资源），使用 `aws:SourceAccount` 作为备用方案。", "使用 `aws:PrincipalArn` 验证只有您账户的 Bedrock 服务主体可以访问 S3 存储桶。", "同时使用 `aws:SourceArn` 和 `aws:SourceAccount` 以 AND 条件提供最大保护。"], "explanation_zh": "正确的方法使用两个条件键，但用于不同目的：`aws:SourceArn` 通过将访问范围限定到特定 Bedrock 资源 ARN 来提供最精确的限制——当您知道完整 ARN 时使用此选项。`aws:SourceAccount` 是当您还不知道完整 ARN 时（例如，对于尚未创建的资源）的适当备用方案，它将访问范围限定为您账户内的任何 Bedrock 资源。根据是否知道特定 ARN 使用一个或另一个——当可用时，`aws:SourceArn` 始终是首选，因为它提供了更窄、更安全的限制。\n\n为什么其他选项不正确：\n\n仅使用 `aws:SourceAccount` 防止跨账户 confused deputy 攻击：虽然 `aws:SourceAccount` 确实可以防止跨账户 confused deputy 攻击，但当知道特定资源 ARN 时，它不如 `aws:SourceArn` 精确。它允许您账户中的任何 Bedrock 资源触发访问，而不是限制到特定资源。\n使用 `aws:PrincipalArn` 验证您账户的 Bedrock 服务主体：`aws:PrincipalArn` 检查进行调用的 IAM 主体的 ARN——即调用身份。对于服务到服务的调用，主体是 AWS 服务角色，而不是您的 Bedrock 资源。这不能防止来自使用相同 Bedrock 服务的其他客户账户的 confused deputy 攻击。\n同时使用 `aws:SourceArn` 和 `aws:SourceAccount` 以 AND 条件：同时使用两者是不必要的限制，也不是推荐的模式。AWS 文档建议在知道 ARN 时使用 `aws:SourceArn`，不知道时使用 `aws:SourceAccount`——不要同时使用两者，因为这会创建过于严格的条件，可能导致合法请求失败。"}, {"exam": 1, "id": 34, "question_en": "A security engineer is configuring AWS Security Lake to collect logs from multiple AWS services. They want to ensure they're not creating duplicate logging configurations.\n \nWhich statement is TRUE about collecting data from AWS services in Security Lake?", "options_en": ["You must first enable CloudTrail logging, VPC Flow Logs, and Route 53 query logs in each source account before Security Lake can collect them.", "Security Lake automatically collects data from supported AWS services through an independent stream of events; you do not need to separately configure logging in these services.", "Security Lake creates AWS Config rules in each member account to collect configuration data and transforms it into OCSF format.", "You must create custom Lambda functions to extract logs from CloudWatch Logs and send them to Security Lake's S3 bucket."], "correct": 1, "explanation_en": "AWS Security Lake collects data from supported AWS services (CloudTrail, VPC Flow Logs, Route 53 Resolver query logs, Security Hub findings, EKS audit logs, WAF logs) through an independent stream of events. You do not need to pre-configure logging in each source service — Security Lake taps into them directly. It converts collected data into OCSF format and stores it as Parquet in your Security Lake S3 bucket. AWS Config rules are not involved in log collection, and custom Lambda functions are only needed for third-party or non-native data sources, not for supported AWS services.", "question_zh": "一名安全工程师正在配置 AWS Security Lake 以收集来自多个 AWS 服务的日志。他们希望确保不会创建重复的日志配置。\n\n关于在 Security Lake 中从 AWS 服务收集数据，哪个陈述是正确的？", "options_zh": ["在 Security Lake 可以收集之前，您必须首先在每个源账户中启用 CloudTrail 日志记录、VPC Flow Logs 和 Route 53 查询日志。", "Security Lake 通过独立的事件流自动从支持的 AWS 服务收集数据；您不需要在这些服务中单独配置日志记录。", "Security Lake 在每个成员账户中创建 AWS Config 规则来收集配置数据，并将其转换为 OCSF 格式。", "您必须创建自定义 Lambda 函数，从 CloudWatch Logs 提取日志并将其发送到 Security Lake 的 S3 存储桶。"], "explanation_zh": "AWS Security Lake 通过独立的事件流从支持的 AWS 服务（CloudTrail、VPC Flow Logs、Route 53 Resolver 查询日志、Security Hub 发现项、EKS 审计日志、WAF 日志）收集数据。您不需要在每个源服务中预先配置日志记录——Security Lake 直接接入它们。它将收集的数据转换为 OCSF 格式，并将其存储为 Parquet 格式在您的 Security Lake S3 存储桶中。AWS Config 规则不参与日志收集，自定义 Lambda 函数仅用于第三方或非原生数据源，而不是支持的 AWS 服务。"}, {"exam": 1, "id": 35, "question_en": "Your company's security team needs to completely disable AWS Security Lake across your organization. The Security Lake delegated administrator is in a dedicated security account, and Security Lake is collecting data from 50 member accounts across multiple regions.\n \nWhat is the correct procedure to fully disable Security Lake?", "options_en": ["In the Security Lake delegated administrator account, use the console to disable Security Lake for all regions and member accounts; this automatically removes the delegated administrator designation.", "In the management account, use the AWS CLI command `aws securitylake deregister-data-lake-delegated-administrator` to remove the delegated administrator, then disable Security Lake in each member account individually.", "Use AWS Organizations to remove the Security Lake service principal from trusted services, which cascades the disable operation to all member accounts.", "In the delegated administrator account, delete all Security Lake S3 buckets; this automatically disables Security Lake across the organization."], "correct": 1, "explanation_en": "The correct procedure requires two steps: first, run `aws securitylake deregister-data-lake-delegated-administrator` from the AWS Organizations management account to remove the delegated administrator designation, then disable Security Lake in the member accounts. The management account must perform the deregistration because delegated administrator designations are an organization-level concern — only the management account has the authority to grant or revoke them.\n \nWhy the other options are incorrect:\n\nDisabling via the delegated administrator account console: The delegated administrator account cannot remove its own delegation — that authority belongs exclusively to the management account. Using the console in the delegated admin account does not fully clean up the organization-level configuration.\nRemoving the Security Lake service principal from AWS Organizations trusted services: This does not properly deregister the delegated administrator. The service principal removal is a separate action from deregistration and does not trigger a cascading disable across member accounts.\nDeleting the Security Lake S3 buckets in the delegated administrator account: Deleting storage buckets does not disable the Security Lake service. This would cause errors and data loss without properly offboarding Security Lake from the organization.\n", "question_zh": "您公司的安全团队需要在整个组织中完全禁用 AWS Security Lake。Security Lake 委托管理员在一个专用的安全账户中，Security Lake 正在从 50 个成员账户跨多个区域收集数据。\n\n完全禁用 Security Lake 的正确程序是什么？", "options_zh": ["在 Security Lake 委托管理员账户中，使用控制台为所有区域和成员账户禁用 Security Lake；这会自动移除委托管理员指定。", "在管理账户中，使用 AWS CLI 命令 `aws securitylake deregister-data-lake-delegated-administrator` 移除委托管理员，然后在每个成员账户中单独禁用 Security Lake。", "使用 AWS Organizations 从可信服务中移除 Security Lake 服务主体，这会将禁用操作级联到所有成员账户。", "在委托管理员账户中，删除所有 Security Lake S3 存储桶；这会自动在整个组织中禁用 Security Lake。"], "explanation_zh": "正确的程序需要两个步骤：首先，从 AWS Organizations 管理账户运行 `aws securitylake deregister-data-lake-delegated-administrator` 移除委托管理员指定，然后在成员账户中禁用 Security Lake。管理账户必须执行取消注册，因为委托管理员指定是组织级别的事务——只有管理账户有权授予或撤销它们。\n\n为什么其他选项不正确：\n\n通过委托管理员账户控制台禁用：委托管理员账户不能移除自己的委托——该权限仅属于管理账户。在委托管理员账户中使用控制台不会完全清理组织级别的配置。\n从 AWS Organizations 可信服务中移除 Security Lake 服务主体：这不会正确取消注册委托管理员。服务主体移除是与取消注册不同的操作，不会触发跨成员账户的级联禁用。\n删除委托管理员账户中的 Security Lake S3 存储桶：删除存储桶不会禁用 Security Lake 服务。这会在未正确从组织中卸载 Security Lake 的情况下导致错误和数据丢失。"}, {"exam": 1, "id": 36, "question_en": "Your company's security policy requires that all AWS API calls use TLS 1.2 or higher. A security engineer needs to identify AWS service endpoints that are still receiving connections using older TLS versions (TLS 1.0 or 1.1) to update client configurations.\n \nWhat AWS service and approach should they use?", "options_en": ["Enable VPC Flow Logs and query for TLS version information using Athena; create alerts for TLS 1.0/1.1 connections.", "Use AWS CloudTrail Lake to run SQL queries against CloudTrail events, filtering by the `tlsDetails.tlsVersion` attribute to identify older TLS connections.", "Configure AWS WAF to inspect TLS handshake versions and log connections using older protocols to CloudWatch Logs.", "Use AWS Config's `required-tls-version` managed rule to detect and report AWS service endpoints accepting older TLS versions."], "correct": 1, "explanation_en": "CloudTrail Lake is a managed data lake that stores and indexes CloudTrail events for SQL-based querying. Every CloudTrail event includes a `tlsDetails` field that captures the TLS version negotiated for that API call. By querying CloudTrail Lake and filtering on `tlsDetails.tlsVersion IN ('TLSv1.0', 'TLSv1.1')`, a security engineer can identify exactly which principals and services are still using older TLS — with no custom code or infrastructure required.\n \nWhy the other options are incorrect:\n\nVPC Flow Logs with Athena: VPC Flow Logs capture network-level metadata (IPs, ports, bytes, packets) but do not record TLS version information. They cannot identify which TLS version was negotiated for a connection.\nAWS WAF: WAF is designed to protect public-facing web applications from common exploits. It operates at the HTTP/HTTPS layer in front of your resources, not at the AWS API control plane level. It cannot inspect or log TLS versions used in AWS API calls.\nAWS Config's `required-tls-version` managed rule: No such managed rule exists in AWS Config. Config managed rules evaluate the configuration state of AWS resources — they do not monitor or report on the TLS versions used in API call connections.\n", "question_zh": "您公司的安全策略要求所有 AWS API 调用使用 TLS 1.2 或更高版本。安全工程师需要识别仍在接收使用旧 TLS 版本（TLS 1.0 或 1.1）连接的 AWS 服务端点，以更新客户端配置。\n\n他们应该使用什么 AWS 服务和方法？", "options_zh": ["启用 VPC Flow Logs 并使用 Athena 查询 TLS 版本信息；为 TLS 1.0/1.1 连接创建告警。", "使用 AWS CloudTrail Lake 对 CloudTrail 事件运行 SQL 查询，通过 `tlsDetails.tlsVersion` 属性过滤以识别旧 TLS 连接。", "配置 AWS WAF 检查 TLS 握手版本，并将使用旧协议的连接记录到 CloudWatch Logs。", "使用 AWS Config 的 `required-tls-version` 托管规则检测和报告接受旧 TLS 版本的 AWS 服务端点。"], "explanation_zh": "CloudTrail Lake 是一个托管数据湖，存储和索引 CloudTrail 事件以进行基于 SQL 的查询。每个 CloudTrail 事件都包含一个 `tlsDetails` 字段，捕获为该 API 调用协商的 TLS 版本。通过查询 CloudTrail Lake 并按 `tlsDetails.tlsVersion IN ('TLSv1.0', 'TLSv1.1')` 过滤，安全工程师可以准确识别哪些主体和服务仍在使用旧 TLS——无需自定义代码或基础设施。\n\n为什么其他选项不正确：\n\nVPC Flow Logs 配合 Athena：VPC Flow Logs 捕获网络级别的元数据（IP、端口、字节、数据包），但不记录 TLS 版本信息。它们无法识别为连接协商了哪个 TLS 版本。\nAWS WAF：WAF 旨在保护面向公众的 Web 应用程序免受常见漏洞攻击。它在资源前面的 HTTP/HTTPS 层运行，而不是在 AWS API 控制平面级别。它无法检查或记录 AWS API 调用中使用的 TLS 版本。\nAWS Config 的 `required-tls-version` 托管规则：AWS Config 中不存在此类托管规则。Config 托管规则评估 AWS 资源的配置状态——它们不监控或报告 API 调用连接中使用的 TLS 版本。"}, {"exam": 1, "id": 37, "question_en": "A healthcare company is building a HIPAA-compliant application that processes sensitive patient data in AWS Nitro Enclaves. They need to establish TLS connections from within the enclave to external APIs and want to use AWS Certificate Manager to manage certificates.\n \nWhich statement is TRUE about using ACM with Nitro Enclaves?", "options_en": ["Nitro Enclaves can directly call the ACM API to retrieve private certificates from ACM Private CA.", "AWS Certificate Manager for Nitro Enclaves uses a local agent (ACM for Nitro Enclaves package) that runs inside the enclave and communicates with ACM via a local vsock connection to the parent EC2 instance.", "Certificates from ACM must be exported as PEM files and manually loaded into the Nitro Enclave at build time.", "Nitro Enclaves can only use self-signed certificates generated within the enclave; ACM integration is not supported."], "correct": 1, "explanation_en": "ACM for Nitro Enclaves works through a local agent that runs inside the enclave. The agent communicates with ACM via a vsock connection to the parent EC2 instance, which acts as a proxy to the ACM API. ACM delivers the certificate and an encrypted private key; the private key is only decrypted inside the enclave's isolated secure memory and never exists in plaintext outside of it. This architecture allows the enclave to establish TLS connections while keeping key material cryptographically protected throughout its lifecycle.\n \nWhy the other options are incorrect:\n\nEnclaves directly call the ACM API: Nitro Enclaves have no direct network access to external AWS APIs. All communication with ACM goes through the agent-to-vsock-to-parent-instance path, not via a direct API call from within the enclave.\nCertificates must be exported as PEM files and manually loaded at build time: This would defeat the entire security model. Exporting a private key and bundling it into the enclave image or loading it at build time exposes the key material outside the enclave's protected boundary.\nACM integration is not supported; only self-signed certificates can be used: ACM integration is explicitly supported and is the AWS-recommended approach for managing TLS certificates in Nitro Enclave workloads.\n", "question_zh": "一家医疗保健公司正在构建一个符合 HIPAA 的应用程序，在 AWS Nitro Enclaves 中处理敏感患者数据。他们需要从 enclave 内部建立到外部 API 的 TLS 连接，并希望使用 AWS Certificate Manager 管理证书。\n\n关于在 Nitro Enclaves 中使用 ACM，哪个陈述是正确的？", "options_zh": ["Nitro Enclaves 可以直接调用 ACM API 从 ACM Private CA 检索私有证书。", "AWS Certificate Manager for Nitro Enclaves 使用在 enclave 内运行的本地代理（ACM for Nitro Enclaves 包），通过到父 EC2 实例的本地 vsock 连接与 ACM 通信。", "来自 ACM 的证书必须导出为 PEM 文件，并在构建时手动加载到 Nitro Enclave 中。", "Nitro Enclaves 只能使用在 enclave 内生成的自签名证书；ACM 集成不受支持。"], "explanation_zh": "ACM for Nitro Enclaves 通过在 enclave 内运行的本地代理工作。该代理通过到父 EC2 实例的 vsock 连接与 ACM 通信，父 EC2 实例充当到 ACM API 的代理。ACM 交付证书和加密的私钥；私钥仅在 enclave 的隔离安全内存中解密，永远不会以明文形式存在于其外部。此架构允许 enclave 建立 TLS 连接，同时在整个生命周期中以密码学方式保护密钥材料。\n\n为什么其他选项不正确：\n\nEnclave 直接调用 ACM API：Nitro Enclaves 没有到外部 AWS API 的直接网络访问。所有与 ACM 的通信都通过代理到 vsock 到父实例的路径，而不是从 enclave 内部直接 API 调用。\n证书必须导出为 PEM 文件并在构建时手动加载：这会破坏整个安全模型。导出私钥并将其捆绑到 enclave 镜像中或在构建时加载会将密钥材料暴露在 enclave 受保护边界之外。\nACM 集成不受支持；只能使用自签名证书：ACM 集成是明确支持的，并且是管理 Nitro Enclave 工作负载中 TLS 证书的 AWS 推荐方法。"}, {"exam": 1, "id": 38, "question_en": "A development team needs to install SSL/TLS certificates on EC2 instances running NGINX web servers. They want to use AWS Certificate Manager but discover that standard ACM certificates cannot be exported for use on EC2.\n \nWhat should they do to use ACM for EC2 instances?", "options_en": ["Use AWS Certificate Manager to issue exportable public certificates that can be downloaded along with the private key for installation on EC2 instances.", "Request certificates from ACM Private CA and export them using the `GetCertificate` API with the `CertificateArn` parameter.", "Use Let's Encrypt with Certbot running on the EC2 instances to automatically request and renew certificates.", "Configure an Application Load Balancer in front of EC2 instances and use standard ACM certificates on the ALB, with HTTP between ALB and EC2."], "correct": 0, "explanation_en": "ACM now supports exportable public certificates. When you request an exportable certificate, ACM allows you to download both the certificate chain and the private key (protected by a passphrase), which can then be installed directly on EC2 instances running NGINX or any other web server. This directly solves the problem — standard ACM certificates cannot be exported, but exportable ACM certificates can. Note that unlike standard ACM certificates, renewal is not automatic and must be managed manually.\n \nWhy the other options are incorrect:\n\nRequesting certificates from ACM Private CA and exporting via the `GetCertificate` API with `CertificateArn`: ACM Private CA issues private certificates for internal use — not publicly trusted certificates. The `GetCertificate` API retrieves the certificate body but does not export the private key for ACM-managed certificates. This approach is also the wrong tool for a public-facing NGINX web server.\nUsing Let's Encrypt with Certbot: This is a valid technical approach for obtaining free publicly trusted certificates, but the question explicitly asks how to use ACM for EC2 instances. Let's Encrypt is a third-party CA entirely outside of ACM.\nPlacing an ALB in front with standard ACM certificates and HTTP between ALB and EC2: This is a common and recommended pattern for web applications, but it does not install any certificate on the EC2 instance itself — TLS terminates at the ALB. The question specifically asks about installing SSL/TLS certificates on EC2 instances, which this option does not accomplish.\n", "question_zh": "一个开发团队需要在运行 NGINX Web 服务器的 EC2 实例上安装 SSL/TLS 证书。他们希望使用 AWS Certificate Manager，但发现标准 ACM 证书不能导出用于 EC2。\n\n他们应该怎么做才能为 EC2 实例使用 ACM？", "options_zh": ["使用 AWS Certificate Manager 颁发可导出的公有证书，可以连同私钥一起下载，用于在 EC2 实例上安装。", "从 ACM Private CA 请求证书，并使用 `GetCertificate` API 配合 `CertificateArn` 参数导出。", "在 EC2 实例上使用 Let's Encrypt 配合 Certbot 自动请求和续订证书。", "在 EC2 实例前配置 Application Load Balancer，并在 ALB 上使用标准 ACM 证书，ALB 与 EC2 之间使用 HTTP。"], "explanation_zh": "ACM 现在支持可导出的公有证书。当您请求可导出的证书时，ACM 允许您同时下载证书链和私钥（由密码短语保护），然后可以直接安装在运行 NGINX 或任何其他 Web 服务器的 EC2 实例上。这直接解决了问题——标准 ACM 证书不能导出，但可导出的 ACM 证书可以。请注意，与标准 ACM 证书不同，续订不是自动的，必须手动管理。\n\n为什么其他选项不正确：\n\n从 ACM Private CA 请求证书并通过 `GetCertificate` API 配合 `CertificateArn` 导出：ACM Private CA 颁发用于内部使用的私有证书——不是公开信任的证书。`GetCertificate` API 检索证书正文，但不导出 ACM 托管证书的私钥。这种方法对于面向公众的 NGINX Web 服务器也是错误的工具。\n在 EC2 实例上使用 Let's Encrypt 配合 Certbot：这是获取免费公开信任证书的有效技术方法，但问题明确询问如何使用 ACM 用于 EC2 实例。Let's Encrypt 是完全在 ACM 之外的第三方 CA。\n在 EC2 前放置 ALB 配合标准 ACM 证书和 ALB 与 EC2 之间的 HTTP：这是 Web 应用程序的常见推荐模式，但它不会在 EC2 实例本身上安装任何证书——TLS 在 ALB 处终止。问题具体询问在 EC2 实例上安装 SSL/TLS 证书，此选项无法完成。"}, {"exam": 1, "id": 39, "question_en": "A Security Analyst receives a GuardDuty finding indicating that one of the company's AWS credentials may be compromised. The credential is actually a Secrets Manager secret used by a Lambda function for database access.\n \nWhat GuardDuty finding type would indicate that a Secrets Manager secret is potentially compromised, and what should be done?", "options_en": ["`UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom` - Rotate the secret immediately using Secrets Manager automatic rotation.", "`CredentialAccess:IAMUser/AnomalousBehavior` - Investigate the Lambda function's execution role and rotate the secret if confirmed compromised.", "`Discovery:IAMUser/AnomalousBehavior` - Update the resource policy on the secret to restrict access and revoke sessions.", "GuardDuty does not monitor Secrets Manager API activity; use CloudTrail to investigate `GetSecretValue` API calls manually."], "correct": 1, "explanation_en": "GuardDuty monitors Secrets Manager activity through `CredentialAccess:IAMUser/AnomalousBehavior`. This finding type uses ML-based anomaly detection on CloudTrail management events and specifically tracks credential access APIs including `GetSecretValue`, `BatchGetSecretValue`, `GetPasswordData`, and `GenerateDbAuthToken`. When GuardDuty detects anomalous patterns (e.g., calls from unusual locations, unexpected principals, or atypical user agents), it generates this finding. The correct response is to investigate the Lambda function's execution role, review CloudTrail logs for the specific API calls, and rotate the secret if compromise is confirmed.\n \nWhy the other options are incorrect:\n\n`UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom` — rotate the secret immediately: This finding fires when API calls originate from IP addresses on a custom threat list. It indicates the source IP is suspicious, not that the credential access pattern itself is anomalous. It is not specific to Secrets Manager activity.\n`Discovery:IAMUser/AnomalousBehavior` — update the resource policy and revoke sessions: The `Discovery` threat category covers reconnaissance APIs like `DescribeInstances`, `GetRolePolicy`, and `ListAccessKeys` — not credential access APIs like `GetSecretValue`. The wrong finding type, and the proposed response (updating the resource policy) is also not the immediate remediation action for a compromised secret.\nGuardDuty does not monitor Secrets Manager activity: False. GuardDuty uses CloudTrail management events as a foundational data source and explicitly monitors Secrets Manager API calls as part of its `CredentialAccess` finding category.\n", "question_zh": "一名安全分析师收到 GuardDuty 发现项，指示公司的一个 AWS 凭证可能已泄露。该凭证实际上是由 Lambda 函数用于数据库访问的 Secrets Manager 密钥。\n\n哪个 GuardDuty 发现项类型会指示 Secrets Manager 密钥可能已泄露，应该采取什么措施？", "options_zh": ["`UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom`——使用 Secrets Manager 自动轮换立即轮换密钥。", "`CredentialAccess:IAMUser/AnomalousBehavior`——调查 Lambda 函数的执行角色，如果确认已泄露则轮换密钥。", "`Discovery:IAMUser/AnomalousBehavior`——更新密钥上的资源策略以限制访问并撤销会话。", "GuardDuty 不监控 Secrets Manager API 活动；使用 CloudTrail 手动调查 `GetSecretValue` API 调用。"], "explanation_zh": "GuardDuty 通过 `CredentialAccess:IAMUser/AnomalousBehavior` 监控 Secrets Manager 活动。此发现项类型对 CloudTrail 管理事件使用基于机器学习的异常检测，并专门跟踪凭证访问 API，包括 `GetSecretValue`、`BatchGetSecretValue`、`GetPasswordData` 和 `GenerateDbAuthToken`。当 GuardDuty 检测到异常模式（例如来自异常位置的调用、意外的调用主体或非典型的用户代理）时，它会生成此发现项。正确的响应是调查 Lambda 函数的执行角色，审查 CloudTrail 日志中的特定 API 调用，并在确认泄露后轮换密钥。\n\n为什么其他选项不正确：\n\n`UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom`——立即轮换密钥：此发现项在 API 调用来自自定义威胁列表上的 IP 地址时触发。它指示源 IP 可疑，而不是凭证访问模式本身异常。它不是特定于 Secrets Manager 活动的。\n`Discovery:IAMUser/AnomalousBehavior`——更新资源策略并撤销会话：`Discovery` 威胁类别涵盖侦察 API，如 `DescribeInstances`、`GetRolePolicy` 和 `ListAccessKeys`——而不是像 `GetSecretValue` 这样的凭证访问 API。发现项类型错误，并且提议的响应（更新资源策略）也不是针对已泄露密钥的立即修复操作。\nGuardDuty 不监控 Secrets Manager 活动：错误。GuardDuty 使用 CloudTrail 管理事件作为基础数据源，并作为其 `CredentialAccess` 发现项类别的一部分显式监控 Secrets Manager API 调用。"}, {"exam": 1, "id": 40, "question_en": "A security team wants to enhance vulnerability scanning of their Amazon Linux 2023 EC2 instances. Standard Amazon Inspector scanning detects OS and programming language packages, but they want to scan for vulnerabilities in application dependencies bundled inside JAR files and Python packages.\n \nWhich statement is TRUE about Amazon Inspector deep inspection for EC2 instances?", "options_en": ["Deep inspection is automatically enabled for all EC2 instances when Amazon Inspector is activated at the account level.", "Deep inspection requires the Systems Manager (SSM) agent to be installed and running on the EC2 instances.", "Deep inspection works on Windows Server instances but not on Linux-based instances.", "Deep inspection scans running containers on EC2 instances and reports vulnerabilities in container images."], "correct": 1, "explanation_en": "Amazon Inspector deep inspection requires the SSM Agent to be installed and running on the EC2 instances, with an IAM instance profile that grants SSM permissions. The SSM Agent is how Inspector accesses the file system to scan inside JAR, WAR, EAR files (Java), wheel and egg files (Python), and packed Node.js application bundles for transitive dependency vulnerabilities. Deep inspection is a separate feature toggle from standard EC2 scanning and must be explicitly enabled after activating Inspector.\n \nWhy the other options are incorrect:\n\nDeep inspection is automatically enabled for all EC2 instances when Inspector is activated: False. Deep inspection is a distinct capability that requires explicit activation — it is not enabled automatically when Inspector is turned on at the account level.\nDeep inspection works on Windows Server but not Linux: False. Deep inspection is available for Linux-based instances (Amazon Linux 2, Ubuntu, CentOS, etc.). It is not available for Windows Server instances.\nDeep inspection scans running containers on EC2 and reports on container image vulnerabilities: False. Deep inspection targets application dependency files on the EC2 instance itself — JAR files, Python packages, etc. Scanning container images is a separate Amazon Inspector feature that works through Amazon ECR integration, not through the EC2 deep inspection capability.\n", "question_zh": "安全团队希望增强其 Amazon Linux 2023 EC2 实例的漏洞扫描。标准 Amazon Inspector 扫描检测操作系统和编程语言包，但他们希望扫描捆绑在 JAR 文件和 Python 包中的应用程序依赖项中的漏洞。\n\n关于 Amazon Inspector 对 EC2 实例的深度检查，哪个陈述是正确的？", "options_zh": ["当在账户级别激活 Amazon Inspector 时，深度检查会自动为所有 EC2 实例启用。", "深度检查需要 Systems Manager (SSM) 代理在 EC2 实例上安装并运行。", "深度检查适用于 Windows Server 实例，但不适用于基于 Linux 的实例。", "深度检查扫描 EC2 实例上运行的容器并报告容器镜像中的漏洞。"], "explanation_zh": "Amazon Inspector 深度检查需要 SSM Agent 在 EC2 实例上安装并运行，并配置授予 SSM 权限的 IAM 实例配置文件。SSM Agent 是 Inspector 访问文件系统以扫描 JAR、WAR、EAR 文件（Java）、wheel 和 egg 文件（Python）以及打包的 Node.js 应用程序包中传递性依赖项漏洞的方式。深度检查是与标准 EC2 扫描不同的功能开关，必须在激活 Inspector 后显式启用。\n\n为什么其他选项不正确：\n\n激活 Inspector 时深度检查自动为所有 EC2 实例启用：错误。深度检查是需要显式激活的独立功能——当在账户级别打开 Inspector 时不会自动启用。\n深度检查适用于 Windows Server 但不适用于 Linux：错误。深度检查可用于基于 Linux 的实例（Amazon Linux 2、Ubuntu、CentOS 等）。它不适用于 Windows Server 实例。\n深度检查扫描在 EC2 上运行的容器并报告容器镜像漏洞：错误。深度检查针对 EC2 实例本身上的应用程序依赖文件——JAR 文件、Python 包等。扫描容器镜像是通过 Amazon ECR 集成的单独 Amazon Inspector 功能，而不是通过 EC2 深度检查功能。"}, {"exam": 1, "id": 41, "question_en": "Your company (Account A: 111111111111) needs to allow developers from a partner company (Account B: 222222222222) to assume a role for accessing S3 buckets in your account. The security team requires that partner developers must authenticate with MFA before assuming the role.\n \nWhere should the MFA requirement be configured?", "options_en": ["In the IAM policy attached to the developers' users in Account B, add a condition requiring `aws:MultiFactorAuthPresent = true`.", "In the trust policy of the IAM role in Account A, add a condition requiring `aws:MultiFactorAuthPresent = true`.", "In the S3 bucket policy in Account A, add a condition requiring `aws:MultiFactorAuthPresent = true`.", "Enable MFA in AWS Organizations at the root level, which applies to all cross-account access automatically."], "correct": 1, "explanation_en": "MFA for cross-account role assumption must be enforced in the trust policy of the IAM role in the account being accessed (Account A). The trust policy is what governs who can call `sts:AssumeRole` on that role, and adding an `aws:MultiFactorAuthPresent = true` condition ensures STS only grants the role to callers who authenticated with MFA. The MFA check happens at assumption time — developers must supply `--serial-number` and `--token-code` parameters in their `assume-role` call.\n \nWhy the other options are incorrect:\n\nAdding the MFA condition to an IAM policy attached to developers in Account B: IAM policies in Account B govern what those principals can do within Account B. They can be used to prevent developers from calling `sts:AssumeRole` without MFA, but they do not enforce anything on Account A's role. The trust policy in Account A is the authoritative control point — Account B policies alone cannot guarantee MFA at cross-account assumption.\nAdding the MFA condition to the S3 bucket policy in Account A: The S3 bucket policy controls who can access the S3 bucket — it does not govern role assumption. By the time S3 policies are evaluated, the role has already been assumed. Enforcing MFA at the S3 layer would not prevent unauthenticated role assumption.\nEnabling MFA in AWS Organizations at the root level: AWS Organizations does not provide automatic MFA enforcement for cross-account access. SCPs can restrict what actions can be performed, but there is no Organizations-level setting that universally requires MFA for all cross-account role assumptions.\n", "question_zh": "您的公司（账户 A：111111111111）需要允许合作伙伴公司（账户 B：222222222222）的开发人员代入一个角色以访问您账户中的 S3 存储桶。安全团队要求合作伙伴开发人员在代入角色之前必须使用 MFA 进行身份验证。\n\nMFA 要求应配置在哪里？", "options_zh": ["在附加到账户 B 中开发人员用户的 IAM 策略中，添加条件要求 `aws:MultiFactorAuthPresent = true`。", "在账户 A 中 IAM 角色的信任策略中，添加条件要求 `aws:MultiFactorAuthPresent = true`。", "在账户 A 中的 S3 存储桶策略中，添加条件要求 `aws:MultiFactorAuthPresent = true`。", "在 AWS Organizations 的根级别启用 MFA，这将自动适用于所有跨账户访问。"], "explanation_zh": "跨账户角色代入的 MFA 必须在被访问账户（账户 A）中 IAM 角色的信任策略中强制执行。信任策略是控制谁可以在该角色上调用 `sts:AssumeRole` 的策略，添加 `aws:MultiFactorAuthPresent = true` 条件可确保 STS 仅向使用 MFA 进行身份验证的调用者授予角色。MFA 检查在代入时进行——开发人员必须在其 `assume-role` 调用中提供 `--serial-number` 和 `--token-code` 参数。\n\n为什么其他选项不正确：\n\n将 MFA 条件添加到账户 B 中附加到开发人员的 IAM 策略：账户 B 中的 IAM 策略控制这些主体在账户 B 内可以做什么。它们可以用于防止开发人员在未使用 MFA 的情况下调用 `sts:AssumeRole`，但它们不对账户 A 的角色强制执行任何内容。账户 A 中的信任策略是权威控制点——单独的账户 B 策略不能保证跨账户代入时的 MFA。\n将 MFA 条件添加到账户 A 中的 S3 存储桶策略：S3 存储桶策略控制谁可以访问 S3 存储桶——它不控制角色代入。当 S3 策略被评估时，角色已经被代入。在 S3 层强制执行 MFA 不会阻止未经身份验证的角色代入。\n在 AWS Organizations 根级别启用 MFA：AWS Organizations 不提供跨账户访问的自动 MFA 强制执行。SCP 可以限制可以执行的操作，但没有组织级别设置可以普遍要求所有跨账户角色代入使用 MFA。"}, {"exam": 1, "id": 42, "question_en": "Your company wants to require MFA for all IAM users who perform sensitive operations like deleting S3 buckets or terminating EC2 instances, but regular read operations should not require MFA.\n \nHow should you implement this MFA requirement?", "options_en": ["Attach an IAM policy to users with `Deny` effect on sensitive actions when `aws:MultiFactorAuthPresent != true`.", "Enable MFA Delete on all S3 buckets and require MFA device association for all IAM users.", "Configure AWS Organizations SCP to deny sensitive actions unless MFA is present.", "Use IAM Access Analyzer to detect sensitive operations and trigger Step Functions workflow requiring MFA approval."], "correct": 0, "explanation_en": "The correct approach is an IAM policy with a `Deny` effect on sensitive actions conditioned on `aws:MultiFactorAuthPresent` being false. The condition operator `BoolIfExists` is used rather than `Bool` to correctly handle sessions where the key is absent (e.g., long-term credential calls). Read operations are unaffected because they are not listed in the denied actions — only the sensitive write/delete actions are gated behind MFA. Users authenticate with MFA using `sts:GetSessionToken`, which returns temporary credentials that carry `aws:MultiFactorAuthPresent = true`, satisfying the condition.\n \nWhy the other options are incorrect:\n\nMFA Delete on S3 buckets with MFA device association for all users: MFA Delete is a specific S3 versioning feature that gates deletion of versioned objects — it does not apply to EC2 or other services, and it requires the root account to enable. It is not a general-purpose MFA enforcement mechanism for API operations.\nAWS Organizations SCP to deny sensitive actions unless MFA is present: SCPs apply to all principals in the affected accounts and cannot be scoped to specific IAM users or groups. An IAM policy attached to specific users or groups is more targeted and does not risk inadvertently blocking service roles or automation that legitimately lacks MFA.\nIAM Access Analyzer triggering a Step Functions approval workflow: IAM Access Analyzer analyzes resource policies for external access exposure — it does not monitor real-time API calls or enforce MFA. This option describes a non-existent capability and would not enforce MFA before the action executes.\n", "question_zh": "您的公司希望要求所有执行敏感操作（如删除 S3 存储桶或终止 EC2 实例）的 IAM 用户使用 MFA，但常规读取操作不应要求 MFA。\n\n您应该如何实施此 MFA 要求？", "options_zh": ["将 IAM 策略附加到用户，当 `aws:MultiFactorAuthPresent != true` 时对敏感操作使用 `Deny` 效果。", "在所有 S3 存储桶上启用 MFA Delete，并要求所有 IAM 用户关联 MFA 设备。", "配置 AWS Organizations SCP 在未使用 MFA 的情况下拒绝敏感操作。", "使用 IAM Access Analyzer 检测敏感操作并触发需要 MFA 批准的 Step Functions 工作流。"], "explanation_zh": "正确的方法是使用 IAM 策略，对敏感操作使用 `Deny` 效果，条件为 `aws:MultiFactorAuthPresent` 为 false。使用条件操作符 `BoolIfExists` 而非 `Bool` 来正确处理键不存在的情况（例如长期凭证调用）。读取操作不受影响，因为它们未列在拒绝的操作中——只有敏感的写入/删除操作才需要 MFA。用户使用 `sts:GetSessionToken` 进行 MFA 身份验证，该 API 返回带有 `aws:MultiFactorAuthPresent = true` 的临时凭证，满足条件。\n\n为什么其他选项不正确：\n\n在所有 S3 存储桶上启用 MFA Delete 并要求所有 IAM 用户关联 MFA 设备：MFA Delete 是特定的 S3 版本控制功能，限制了对版本化对象的删除——它不适用于 EC2 或其他服务，并且需要根账户才能启用。它不是 API 操作的通用 MFA 强制执行机制。\nAWS Organizations SCP 在未使用 MFA 的情况下拒绝敏感操作：SCP 适用于受影响账户中的所有主体，不能限定到特定的 IAM 用户或组。附加到特定用户或组的 IAM 策略更有针对性，不会有意外阻止合法缺少 MFA 的服务角色或自动化操作的风险。\nIAM Access Analyzer 触发 Step Functions 批准工作流：IAM Access Analyzer 分析资源策略的外部访问暴露——它不监控实时 API 调用或强制执行 MFA。此选项描述了一种不存在的能力，且不会在操作执行前强制执行 MFA。"}, {"exam": 1, "id": 43, "question_en": "Your company has S3 buckets containing financial data. You want to require MFA for any `s3:DeleteObject` operations on these buckets, regardless of which IAM principal attempts the deletion.\n \nHow should you implement this MFA requirement?", "options_en": ["Add an IAM policy to all users and roles requiring MFA for S3 delete operations.", "Add a condition to the S3 bucket policy denying `s3:DeleteObject` when `aws:MultiFactorAuthPresent != true`.", "Enable MFA Delete on the S3 bucket through versioning configuration; this automatically requires MFA for all delete operations.", "Use S3 Object Lock in compliance mode, which inherently requires MFA for all object deletions."], "correct": 1, "explanation_en": "An S3 bucket policy with a `Deny` on `s3:DeleteObject` conditioned on `aws:MultiFactorAuthPresent` being false is the correct approach. Because it is a resource-based policy applied directly to the bucket, it covers all principals universally — including current and future IAM users, roles, and cross-account identities — without requiring any changes to individual identity policies. An explicit `Deny` always overrides any `Allow`, so no principal can bypass it. Principals must obtain MFA-backed temporary credentials (via `aws sts get-session-token`) before the condition is satisfied.\n \nWhy the other options are incorrect:\n\nAdding an IAM policy to all users and roles: This approach is operationally brittle — it requires updating every existing principal and relies on correctly applying the policy to every future principal. A single bucket policy is far simpler and more reliable for a bucket-wide requirement.\nMFA Delete via versioning configuration: MFA Delete is a separate S3 feature that requires the root account to provide an MFA code specifically when permanently deleting versioned objects or suspending versioning. It does not enforce general MFA for `s3:DeleteObject` operations by all principals.\nS3 Object Lock in compliance mode: Object Lock enforces WORM (write-once-read-many) retention policies, preventing deletion until a retention period expires. It does not enforce MFA authentication as a prerequisite for delete operations.\n", "question_zh": "您的公司有包含财务数据的 S3 存储桶。您希望对任何 `s3:DeleteObject` 操作要求 MFA，无论哪个 IAM 主体尝试删除。\n\n您应该如何实施此 MFA 要求？", "options_zh": ["向所有用户和角色添加要求 MFA 进行 S3 删除操作的 IAM 策略。", "在 S3 存储桶策略中添加条件，当 `aws:MultiFactorAuthPresent != true` 时拒绝 `s3:DeleteObject`。", "通过版本控制配置在 S3 存储桶上启用 MFA Delete；这会自动要求所有删除操作使用 MFA。", "使用合规模式的 S3 Object Lock，这固有地要求所有对象删除使用 MFA。"], "explanation_zh": "S3 存储桶策略中对 `s3:DeleteObject` 使用 `Deny` 并条件为 `aws:MultiFactorAuthPresent` 为 false 是正确的做法。因为它是直接应用于存储桶的基于资源的策略，所以它普遍涵盖所有主体——包括当前和未来的 IAM 用户、角色以及跨账户身份——而无需更改任何单独的身份策略。显式 `Deny` 始终覆盖任何 `Allow`，因此没有主体可以绕过它。主体必须获取 MFA 支持的临时凭证（通过 `aws sts get-session-token`）才能满足条件。\n\n为什么其他选项不正确：\n\n向所有用户和角色添加 IAM 策略：这种方法在操作上是脆弱的——它需要更新每个现有主体，并依赖正确地将策略应用于每个未来主体。单个存储桶策略对于存储桶范围的要求要简单可靠得多。\n通过版本控制配置 MFA Delete：MFA Delete 是单独的 S3 功能，需要根账户在永久删除版本化对象或暂停版本控制时提供 MFA 代码。它不为所有主体的 `s3:DeleteObject` 操作强制执行通用 MFA。\n合规模式的 S3 Object Lock：Object Lock 强制执行 WORM（一次写入多次读取）保留策略，防止在保留期到期前删除。它不将 MFA 身份验证作为删除操作的先决条件强制执行。"}, {"exam": 1, "id": 44, "question_en": "A financial services company has S3 buckets with versioning enabled storing transaction records. They want to ensure that even administrators cannot permanently delete object versions or disable versioning without MFA authentication.\n \nWhich statement about S3 MFA Delete is TRUE?", "options_en": ["MFA Delete can be enabled by any IAM user with `s3:PutBucketVersioning` permissions.", "MFA Delete requires using the root account credentials to enable or disable the feature.", "When MFA Delete is enabled, both deleting an object version and adding a delete marker require MFA authentication.", "MFA Delete automatically enables versioning on the bucket if it's not already enabled."], "correct": 1, "explanation_en": "S3 MFA Delete can only be enabled or disabled by the AWS account root user, using the CLI or API (not the console), with MFA authentication active at the time of the call. This root-account requirement is intentional — it ensures that even highly privileged IAM administrators cannot silently disable the protection. Once enabled, MFA Delete requires MFA authentication to permanently delete a specific object version (by version ID) and to suspend or disable versioning.\n \nWhy the other options are incorrect:\n\nMFA Delete can be enabled by any IAM user with `s3:PutBucketVersioning` permissions: False. MFA Delete can only be enabled or disabled by the root account. IAM users cannot enable or disable MFA Delete regardless of what IAM permissions they hold.\nWhen MFA Delete is enabled, both deleting an object version and adding a delete marker require MFA: False. Only permanently deleting a specific version (supplying a version ID) and suspending or disabling versioning require MFA. Adding a delete marker — which is what happens when you delete an object without specifying a version ID — does NOT require MFA.\nMFA Delete automatically enables versioning if it is not already enabled: False. MFA Delete is a feature layered on top of versioning — versioning must already be enabled on the bucket before MFA Delete can be activated. MFA Delete does not enable versioning automatically.\n", "question_zh": "一家金融服务公司有启用了版本控制的 S3 存储桶，存储交易记录。他们希望确保即使是管理员也无法在没有 MFA 身份验证的情况下永久删除对象版本或禁用版本控制。\n\n关于 S3 MFA Delete，哪个陈述是正确的？", "options_zh": ["MFA Delete 可以由任何具有 `s3:PutBucketVersioning` 权限的 IAM 用户启用。", "MFA Delete 需要使用根账户凭证来启用或禁用该功能。", "当启用 MFA Delete 时，删除对象版本和添加删除标记都需要 MFA 身份验证。", "如果尚未启用版本控制，MFA Delete 会自动在存储桶上启用版本控制。"], "explanation_zh": "S3 MFA Delete 只能由 AWS 账户根用户使用 CLI 或 API（而非控制台）启用或禁用，且在调用时必须使用活动的 MFA 身份验证。此根账户要求是故意的——它确保即使是高权限的 IAM 管理员也无法静默禁用保护。一旦启用，MFA Delete 需要 MFA 身份验证才能永久删除特定对象版本（按版本 ID）以及暂停或禁用版本控制。\n\n为什么其他选项不正确：\n\nMFA Delete 可以由任何具有 `s3:PutBucketVersioning` 权限的 IAM 用户启用：错误。MFA Delete 只能由根账户启用或禁用。无论 IAM 用户持有何种 IAM 权限，都不能启用或禁用 MFA Delete。\n启用 MFA Delete 时，删除对象版本和添加删除标记都需要 MFA：错误。只有永久删除特定版本（提供版本 ID）以及暂停或禁用版本控制需要 MFA。添加删除标记——即在不指定版本 ID 的情况下删除对象——不需要 MFA。\n如果尚未启用版本控制，MFA Delete 自动启用版本控制：错误。MFA Delete 是叠加在版本控制之上的功能——在激活 MFA Delete 之前，存储桶上必须已启用版本控制。MFA Delete 不会自动启用版本控制。"}, {"exam": 1, "id": 45, "question_en": "Your company's security policy requires that all AWS resources must be created only in `us-east-1`, `us-west-2`, and `eu-west-1` for data residency compliance. You need to prevent users from creating resources in other regions.\n \nWhich IAM policy correctly implements this restriction?", "options_en": ["`{\n \"Effect\": \"Deny\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringNotEquals\": {\n \"aws:RequestedRegion\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:RequestedRegion\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]\n }\n }\n}`", "`{\n \"Effect\": \"Deny\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringNotEquals\": {\n \"aws:SourceRegion\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]\n }\n }\n}`", "`{\n \"Effect\": \"Deny\",\n \"Action\": \"ec2:RunInstances\",\n \"Resource\": \"arn:aws:ec2:*:*:instance/*\",\n \"Condition\": {\n \"StringNotEquals\": {\n \"aws:Region\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]\n }\n }\n}`"], "correct": 0, "explanation_en": "The correct approach uses a `Deny` with `StringNotEquals` on `aws:RequestedRegion`. The `aws:RequestedRegion` condition key represents the region where an API call will create or modify a resource, making it the right tool for enforcing data residency. Combining it with `StringNotEquals` and a `Deny` effect blocks all actions targeting any region outside the approved list — and since explicit Deny always overrides Allow, no other policy can circumvent it. Note that global services (IAM, Route 53, CloudFront) are not affected by region-based restrictions.\n \nWhy the other options are incorrect:\n\nAllow with `StringEquals` on `aws:RequestedRegion`: An `Allow` statement with a condition only permits actions when the condition is met — it does not block anything. If a user has any other `Allow` policy without a region condition, they can still create resources in unapproved regions. Deny-based enforcement is required to guarantee the restriction.\nDeny with `StringNotEquals` on `aws:SourceRegion`: `aws:SourceRegion` is a different condition key used specifically for cross-region service operations (such as S3 replication or CloudTrail cross-region logging). It is not a general-purpose condition for restricting where API calls create resources.\nDeny on `ec2:RunInstances` only with a non-standard `aws:Region` key: This is doubly wrong — it restricts only EC2 instance launches, leaving all other services unrestricted, and `aws:Region` is a deprecated condition key that should not be used in place of `aws:RequestedRegion`.\n", "question_zh": "您公司的安全策略要求所有 AWS 资源只能创建在 `us-east-1`、`us-west-2` 和 `eu-west-1` 中，以满足数据驻留合规要求。您需要防止用户在其他区域创建资源。\n\n哪个 IAM 策略正确实施了此限制？", "options_zh": ["`{\"Effect\": \"Deny\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"StringNotEquals\": {\"aws:RequestedRegion\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]}}}`", "`{\"Effect\": \"Allow\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"aws:RequestedRegion\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]}}}`", "`{\"Effect\": \"Deny\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"StringNotEquals\": {\"aws:SourceRegion\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]}}}`", "`{\"Effect\": \"Deny\", \"Action\": \"ec2:RunInstances\", \"Resource\": \"arn:aws:ec2:*:*:instance/*\", \"Condition\": {\"StringNotEquals\": {\"aws:Region\": [\"us-east-1\", \"us-west-2\", \"eu-west-1\"]}}}`"], "explanation_zh": "正确的方法使用 `Deny` 配合 `StringNotEquals` 和 `aws:RequestedRegion`。`aws:RequestedRegion` 条件键表示 API 调用将创建或修改资源的区域，使其成为强制执行数据驻留的正确工具。将其与 `StringNotEquals` 和 `Deny` 效果结合使用，可以阻止所有针对批准列表之外任何区域的操作——并且由于显式 Deny 始终覆盖 Allow，没有其他策略可以规避它。请注意，全局服务（IAM、Route 53、CloudFront）不受基于区域的限制影响。\n\n为什么其他选项不正确：\n\n允许配合 `StringEquals` 和 `aws:RequestedRegion`：带有条件的 `Allow` 语句仅在条件满足时才允许操作——它不会阻止任何内容。如果用户有任何其他没有区域条件的 `Allow` 策略，他们仍然可以在未批准的区域创建资源。需要基于 Deny 的强制执行才能保证限制。\n拒绝配合 `StringNotEquals` 和 `aws:SourceRegion`：`aws:SourceRegion` 是用于跨区域服务操作（如 S3 复制或 CloudTrail 跨区域日志记录）的不同条件键。它不是限制 API 调用创建资源位置的通用条件。\n仅对 `ec2:RunInstances` 使用 Deny 配合非标准的 `aws:Region` 键：这是双重错误——它只限制 EC2 实例启动，所有其他服务不受限制，且 `aws:Region` 是不应用来替代 `aws:RequestedRegion` 的已弃用条件键。"}, {"exam": 1, "id": 46, "question_en": "Your company wants to ensure that AWS API calls can only be made from corporate office IPs or VPN endpoints. You need to deny all AWS actions from IP addresses outside the approved range.\n \nWhich IAM policy correctly denies access from non-corporate IP addresses?", "options_en": ["`{\n \"Effect\": \"Deny\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"NotIpAddress\": {\n \"aws:SourceIp\": [\"203.0.113.0/24\", \"198.51.100.0/24\"]\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"IpAddress\": {\n \"aws:SourceIp\": [\"203.0.113.0/24\", \"198.51.100.0/24\"]\n }\n }\n}`", "`{\n \"Effect\": \"Deny\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"NotIpAddress\": {\n \"aws:VpcSourceIp\": [\"203.0.113.0/24\", \"198.51.100.0/24\"]\n }\n }\n}`", "`{\n \"Effect\": \"Deny\",\n \"Action\": \"*\",\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringNotLike\": {\n \"aws:SourceIp\": [\"203.0.113.*\", \"198.51.100.*\"]\n }\n }\n}`"], "correct": 0, "explanation_en": "The correct policy combines `Effect: Deny` with the `NotIpAddress` condition operator and `aws:SourceIp`. `NotIpAddress` matches any IP address that falls outside the listed CIDR ranges, so the deny fires for all non-corporate traffic. Using `Deny` is essential because explicit denies override any Allow statement elsewhere — making this an effective guardrail regardless of what other policies are attached.\n \nWhy the other options are incorrect:\n\n`Allow` with `IpAddress` and `aws:SourceIp`: An Allow statement that restricts to corporate IPs does not block access from other IPs — it simply does not grant it via this policy. Other Allow policies (from permission boundaries, SCPs, or other statements) could still grant access from outside the approved range. Only an explicit `Deny` guarantees the block.\n`Deny` with `NotIpAddress` and `aws:VpcSourceIp`: `aws:VpcSourceIp` is only populated for requests that arrive through a VPC endpoint — it is not set for general internet API calls from corporate offices or VPNs. Using it here would leave most non-VPC-endpoint requests unchecked, failing to enforce the policy for the stated use case.\n`Deny` with `StringNotLike` and wildcard patterns: `StringNotLike` with glob wildcards (e.g. `203.0.113.*`) is a string comparison, not a CIDR-aware IP match. It cannot correctly express subnet boundaries — for example, it cannot distinguish between `203.0.113.0/24` and `203.0.113.0/28`. `NotIpAddress` with CIDR notation is the correct and precise operator for IP range conditions.\n", "question_zh": "您的公司希望确保 AWS API 调用只能从企业办公室 IP 或 VPN 端点进行。您需要拒绝来自批准范围之外的 IP 地址的所有 AWS 操作。\n\n哪个 IAM 策略正确拒绝了来自非企业 IP 地址的访问？", "options_zh": ["`{\"Effect\": \"Deny\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"NotIpAddress\": {\"aws:SourceIp\": [\"203.0.113.0/24\", \"198.51.100.0/24\"]}}}`", "`{\"Effect\": \"Allow\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"IpAddress\": {\"aws:SourceIp\": [\"203.0.113.0/24\", \"198.51.100.0/24\"]}}}`", "`{\"Effect\": \"Deny\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"NotIpAddress\": {\"aws:VpcSourceIp\": [\"203.0.113.0/24\", \"198.51.100.0/24\"]}}}`", "`{\"Effect\": \"Deny\", \"Action\": \"*\", \"Resource\": \"*\", \"Condition\": {\"StringNotLike\": {\"aws:SourceIp\": [\"203.0.113.*\", \"198.51.100.*\"]}}}`"], "explanation_zh": "正确的策略结合了 `Effect: Deny` 与 `NotIpAddress` 条件操作符和 `aws:SourceIp`。`NotIpAddress` 匹配落在列出 CIDR 范围之外的任何 IP 地址，因此拒绝会针对所有非企业流量触发。使用 `Deny` 至关重要，因为显式拒绝会覆盖其他任何地方的任何 Allow 语句——使其成为有效的护栏，无论附加了何种其他策略。\n\n为什么其他选项不正确：\n\n`Allow` 配合 `IpAddress` 和 `aws:SourceIp`：限制到企业 IP 的 Allow 语句不会阻止来自其他 IP 的访问——它只是不通过此策略授予访问权限。其他 Allow 策略（来自权限边界、SCP 或其他语句）仍然可以从批准范围之外授予访问权限。只有显式 `Deny` 才能保证阻止。\n`Deny` 配合 `NotIpAddress` 和 `aws:VpcSourceIp`：`aws:VpcSourceIp` 仅对通过 VPC 端点到达的请求填充——它不会为来自企业办公室或 VPN 的通用互联网 API 调用设置。在此处使用它会使大多数非 VPC 端点请求未经检查，无法针对所述用例强制执行策略。\n`Deny` 配合 `StringNotLike` 和通配符模式：`StringNotLike` 使用 glob 通配符（例如 `203.0.113.*`）是字符串比较，不是 CIDR 感知的 IP 匹配。它无法正确表达子网边界——例如，它无法区分 `203.0.113.0/24` 和 `203.0.113.0/28`。`NotIpAddress` 配合 CIDR 表示法是 IP 范围条件的正确且精确的操作符。"}, {"exam": 1, "id": 47, "question_en": "Your company is deploying a generative AI application on AWS that will make recommendations for loan approvals. The security and compliance team wants to ensure the system adheres to AWS's Responsible AI principles throughout the AI lifecycle.\n \nWhich dimension is part of AWS's Responsible AI framework?",
