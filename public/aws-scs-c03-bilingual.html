hat automatically restore selected recovery points on a schedule, validate them, and delete the restored resources afterward.", "Set up an EventBridge rule triggered by AWS Backup job completion events that invokes a Lambda function to perform test restores and clean up restored resources."], "correct": 2, "explanation_en": "AWS Backup restore testing plans automate the process of restoring recovery points on a defined schedule, running validation checks, and automatically cleaning up restored resources after testing. This satisfies compliance requirements for regular restore validation without manual intervention or ongoing costs from leftover resources. Audit frameworks check backup policies, not actual restore capability. Cross-account replication does not automate restore testing. Custom Lambda solutions add unnecessary complexity compared to the native feature.", "question_zh": "合规性要求要求公司通过执行自动恢复测试定期验证其备份恢复流程。验证后必须自动清理恢复的资源，以避免剩余测试资源带来的持续成本。\n \n哪个 AWS Backup 功能满足此要求？", "options_zh": ["创建一个 AWS Backup 审核框架，其中包含检查恢复点是否可以恢复的控件，从而生成合规性报告，而无需实际恢复数据。", "使用 AWS Backup 跨账户备份策略将备份复制到测试账户，并按季度计划手动还原它们以进行验证。", "配置 AWS Backup 恢复测试计划，按计划自动恢复选定的恢复点、验证它们，然后删除恢复的资源。", "设置由 AWS Backup 作业完成事件触发的 EventBridge 规则，该规则调用 Lambda 函数来执行测试恢复并清理恢复的资源。"], "explanation_zh": "AWS Backup 还原测试计划会自动执行按定义的计划还原恢复点、运行验证检查以及在测试后自动清理还原资源的过程。这满足了定期恢复验证的合规性要求，无需手动干预或剩余资源的持续成本。审核框架检查备份策略，而不是实际的恢复能力。跨账户复制不会自动进行恢复测试。与本机功能相比，自定义 Lambda 解决方案增加了不必要的复杂性。"}, {"exam": 5, "id": 19, "question_en": "A company experiences frequent application layer (Layer 7) DDoS attacks against their web application behind an Application Load Balancer. They want Shield Advanced to automatically create and apply WAF rules to mitigate these attacks without requiring manual intervention from the security team.\n \nWhich Shield Advanced capability should they enable?", "options_en": ["Enable Shield Advanced proactive engagement so that the AWS Shield Response Team can manually craft and deploy WAF rules during detected application layer attacks.", "Enable Shield Advanced automatic application layer DDoS mitigation, which creates, tests, and deploys WAF rules automatically in response to detected Layer 7 attacks.", "Configure Shield Advanced event-based detection to send notifications to an SNS topic that triggers a Lambda function to update WAF rules based on attack patterns.", "Associate a WAF web ACL with rate-based rules to the ALB and let Shield Advanced monitor the rules' effectiveness without creating additional automated protections."], "correct": 1, "explanation_en": "Shield Advanced automatic application layer DDoS mitigation creates, tests, and deploys custom WAF rules when it detects an application layer DDoS attack. These rules are placed in a dedicated rule group within the associated WAF web ACL and are automatically removed when the attack subsides. Proactive engagement involves the SRT team for advisory support, not automated rule creation. Custom Lambda solutions add latency and complexity. Rate-based rules are a static defense that does not adapt to specific attack patterns.", "question_zh": "一家公司的应用程序负载均衡器后面的 Web 应用程序经常遭受应用程序层（第 7 层）DDoS 攻击。他们希望 Shield Advanced 能够自动创建并应用 WAF 规则来缓解这些攻击，而无需安全团队的手动干预。\n \n他们应该启用哪些 Shield Advanced 功能？", "options_zh": ["启用 Shield Advanced 主动参与，以便 AWS Shield 响应团队可以在检测到的应用程序层攻击期间手动制定和部署 WAF 规则。", "启用 Shield Advanced 自动应用程序层 DDoS 缓解，可自动创建、测试和部署 WAF 规则以响应检测到的第 7 层攻击。", "配置 Shield Advanced 基于事件的检测以将通知发送到 SNS 主题，从而触发 Lambda 函数根据攻击模式更新 WAF 规则。", "将 WAF Web ACL 与基于速率的规则关联到 ALB，并让 Shield Advanced 监控规则的有效性，而无需创建额外的自动保护。"], "explanation_zh": "Shield Advanced 自动应用程序层 DDoS 缓解会在检测到应用程序层 DDoS 攻击时创建、测试和部署自定义 WAF 规则。这些规则放置在关联的 WAF Web ACL 内的专用规则组中，并在攻击平息时自动删除。主动参与涉及 SRT 团队提供咨询支持，而不是自动创建规则。自定义 Lambda 解决方案会增加延迟和复杂性。基于速率的规则是一种静态防御，不适应特定的攻击模式。"}, {"exam": 5, "id": 20, "question_en": "A SaaS company exposes a public REST API through Amazon API Gateway and AWS WAF. They want to protect the API from abuse by limiting each client IP address to a maximum of 2000 requests in any 5-minute window, while allowing the application to handle legitimate burst traffic from enterprise customers.\n \nWhich WAF rule type is MOST appropriate for this requirement?", "options_en": ["Create a WAF managed rule group that applies Amazon IP reputation intelligence to automatically block IP addresses exhibiting API abuse patterns.", "Deploy a WAF regex pattern set rule that identifies and blocks requests containing suspicious query parameters commonly associated with API scraping tools.", "Configure a WAF size constraint rule that limits the request body size to prevent bulk data operations that could overwhelm the API backend services.", "Configure a WAF rate-based rule that tracks request counts per IP address and automatically blocks IPs exceeding 2000 requests within a 5-minute evaluation window."], "correct": 3, "explanation_en": "WAF rate-based rules track the request rate from individual IP addresses over a 5-minute evaluation window. When the count exceeds the defined threshold, WAF automatically blocks subsequent requests from that IP until the rate drops below the threshold. This provides straightforward API rate limiting per client. Managed rule groups address known threats, not custom rate limits. Regex rules inspect request content, not request frequency. Size constraint rules limit payload size, not request volume.", "question_zh": "一家 SaaS 公司通过 Amazon API Gateway 和 AWS WAF 公开公共 REST API。他们希望通过将每个客户端 IP 地址限制在任何 5 分钟窗口内最多 2000 个请求来保护 API 免遭滥用，同时允许应用程序处理来自企业客户的合法突发流量。\n \n哪种 WAF 规则类型最适合此要求？", "options_zh": ["创建一个 WAF 托管规则组，该规则组应用 Amazon IP 信誉智能来自动阻止表现出 API 滥用模式的 IP 地址。", "部署 WAF 正则表达式模式集规则，该规则可识别并阻止包含通常与 API 抓取工具关联的可疑查询参数的请求。", "配置 WAF 大小约束规则，限制请求正文大小，以防止可能压垮 API 后端服务的批量数据操作。", "配置基于 WAF 速率的规则，跟踪每个 IP 地址的请求计数，并在 5 分钟评估窗口内自动阻止超过 2000 个请求的 IP。"], "explanation_zh": "基于 WAF 速率的规则在 5 分钟评估窗口内跟踪各个 IP 地址的请求速率。当计数超过定义的阈值时，WAF 会自动阻止来自该 IP 的后续请求，直到速率降至阈值以下。这为每个客户端提供了简单的 API 速率限制。托管规则组解决已知威胁，而不是自定义速率限制。正则表达式规则检查请求内容，而不是请求频率。大小约束规则限制有效负载大小，而不是请求量。"}, {"exam": 5, "id": 21, "question_en": "An organization with 50 VPCs connected via AWS Transit Gateway needs to inspect all inter-VPC and internet-bound traffic using AWS Network Firewall. They want a deployment model that avoids deploying firewall endpoints in every VPC while maintaining centralized policy management.\n \nWhich architecture BEST meets this requirement?", "options_en": ["Deploy Network Firewall endpoints in a dedicated inspection VPC and route all inter-VPC and internet-bound traffic through the inspection VPC via Transit Gateway routing.", "Deploy Network Firewall endpoints in each VPC and use AWS Firewall Manager to distribute a common firewall policy across all 50 VPCs from a central account.", "Configure Transit Gateway with appliance mode routing and deploy third-party firewall appliances in an inspection VPC for centralized traffic inspection at lower cost.", "Use VPC security groups and NACLs for inter-VPC traffic filtering and deploy Network Firewall only in the egress VPC that handles internet-bound traffic from workloads."], "correct": 0, "explanation_en": "A centralized inspection VPC architecture deploys Network Firewall endpoints in a single dedicated VPC. Transit Gateway routes all inter-VPC and internet-bound traffic through this inspection VPC, avoiding the need to deploy firewall endpoints in each of the 50 spoke VPCs. This provides centralized policy management and simplified operations. Deploying in every VPC is operationally complex. Third-party appliances require additional licensing. Security groups and NACLs lack the deep packet inspection capabilities of Network Firewall.", "question_zh": "拥有通过 AWS Transit Gateway 连接的 50 个 VPC 的组织需要使用 AWS 网络防火墙检查所有 VPC 间和互联网绑定的流量。他们想要一种部署模型，避免在每个 VPC 中部署防火墙端点，同时保持集中策略管理。\n \n哪种架构最能满足此要求？", "options_zh": ["在专用检查 VPC 中部署网络防火墙端点，并通过 Transit Gateway 路由通过检查 VPC 路由所有 VPC 间和互联网绑定流量。", "在每个 VPC 中部署网络防火墙终端节点，并使用 AWS Firewall Manager 从一个中央账户跨所有 50 个 VPC 分发通用防火墙策略。", "使用设备模式路由配置 Transit Gateway，并在检查 VPC 中部署第三方防火墙设备，以较低的成本进行集中流量检查。", "使用 VPC 安全组和 NACL 进行 VPC 间流量过滤，并仅在处理来自工作负载的 Internet 绑定流量的出口 VPC 中部署网络防火墙。"], "explanation_zh": "集中式检查 VPC 架构在单个专用 VPC 中部署网络防火墙端点。 Transit Gateway 通过此检查 VPC 路由所有 VPC 间和互联网绑定流量，从而无需在 50 个分支 VPC 中的每个 VPC 中部署防火墙终端节点。这提供了集中的策略管理和简化的操作。在每个 VPC 中进行部署在操作上都很复杂。第三方设备需要额外的许可。安全组和 NACL 缺乏网络防火墙的深度数据包检查功能。"}, {"exam": 5, "id": 22, "question_en": "A company's vulnerability management team needs to generate a Software Bill of Materials (SBOM) for all container images running in their Amazon ECS environment. The SBOM must be exportable in a standard format for integration with their existing software composition analysis toolchain.\n \nWhich AWS service provides this capability?", "options_en": ["Use Amazon ECR image scanning to analyze container images and export the scan results as a CycloneDX SBOM document for each image in the registry.", "Deploy AWS CodeGuru Security to scan container image layers and generate an SPDX-format SBOM with dependency trees for all packages found in each layer.", "Use Amazon Inspector to scan container images and export the findings as an SBOM in CycloneDX or SPDX format for integration with external analysis tools.", "Configure AWS Config to inventory all ECS task definitions and generate an SBOM by correlating task definition metadata with known package vulnerability databases."], "correct": 2, "explanation_en": "Amazon Inspector provides SBOM export functionality that generates Software Bills of Materials in industry-standard CycloneDX and SPDX formats for scanned container images, EC2 instances, and Lambda functions. This integrates with external software composition analysis tools. ECR basic scanning does not generate SBOMs. CodeGuru Security focuses on code-level vulnerabilities, not SBOM generation. AWS Config tracks resource configuration but does not generate package-level SBOMs.", "question_zh": "公司的漏洞管理团队需要为其 Amazon ECS 环境中运行的所有容器映像生成软件物料清单 (SBOM)。 SBOM 必须能够以标准格式导出，以便与现有的软件组合分析工具链集成。\n \n哪个 AWS 服务提供此功能？", "options_zh": ["使用 Amazon ECR 映像扫描来分析容器映像，并将扫描结果导出为注册表中每个映像的 CycloneDX SBOM 文档。", "部署 AWS CodeGuru Security 以扫描容器映像层并生成 SPDX 格式的 SBOM，其中包含每层中找到的所有包的依赖关系树。", "使用 Amazon Inspector 扫描容器映像并将结果导出为 CycloneDX 或 SPDX 格式的 SBOM，以便与外部分析工具集成。", "配置 AWS Config 以清点所有 ECS 任务定义，并通过将任务定义元数据与已知包漏洞数据库相关联来生成 SBOM。"], "explanation_zh": "Amazon Inspector 提供 SBOM 导出功能，可为扫描的容器映像、EC2 实例和 Lambda 函数生成行业标准 CycloneDX 和 SPDX 格式的软件物料清单。这与外部软件组成分析工具集成。 ECR 基本扫描不会生成 SBOM。 CodeGuru Security 专注于代码级漏洞，而不是 SBOM 生成。 AWS Config 跟踪资源配置，但不生成包级 SBOM。"}, {"exam": 5, "id": 23, "question_en": "A company manages 500 EC2 instances across multiple accounts and needs to ensure that all instances have critical security patches applied within 48 hours of release. They need a centralized reporting dashboard to verify patch compliance status across all environments.\n \nWhich AWS service provides automated patching and compliance reporting?", "options_en": ["Use Amazon Inspector to continuously scan instances for missing patches and trigger SSM Run Command to install patches when critical vulnerabilities are detected.", "Use AWS Systems Manager Patch Manager with patch baselines that auto-approve critical patches, maintenance windows for deployment, and compliance reporting dashboards.", "Deploy AWS Config rules that evaluate patch compliance and use Config remediation actions to invoke Lambda functions that install missing patches on non-compliant instances.", "Configure EC2 Image Builder to create new AMIs with the latest patches and use Auto Scaling group instance refresh to replace running instances with newly patched AMIs."], "correct": 1, "explanation_en": "Systems Manager Patch Manager provides end-to-end patch management including patch baselines with auto-approval rules, maintenance windows for scheduled deployment, and built-in compliance reporting. It integrates with Systems Manager Explorer for centralized multi-account compliance dashboards. Inspector detects vulnerabilities but does not directly apply patches. Config rules evaluate compliance but require custom remediation logic. Image Builder creates patched AMIs but does not address running instances directly.", "question_zh": "一家公司跨多个账户管理 500 个 EC2 实例，需要确保所有实例在发布后 48 小时内应用关键安全补丁。他们需要一个集中的报告仪表板来验证所有环境中的补丁合规性状态。\n \n哪种 AWS 服务提供自动修补和合规性报告？", "options_zh": ["使用 Amazon Inspector 持续扫描实例是否缺少补丁，并在检测到严重漏洞时触发 SSM Run Command 安装补丁。", "将 AWS Systems Manager Patch Manager 与可自动批准关键补丁的补丁基准、部署维护时段以及合规性报告仪表板结合使用。", "部署评估补丁合规性的 AWS Config 规则，并使用 Config 修复操作来调用在不合规实例上安装缺失补丁的 Lambda 函数。", "配置 EC2 Image Builder 以使用最新补丁创建新 AMI，并使用 Auto Scaling 组实例刷新将正在运行的实例替换为新修补的 AMI。"], "explanation_zh": "Systems Manager 补丁管理器提供端到端补丁管理，包括具有自动批准规则的补丁基准、计划部署的维护时段以及内置合规性报告。它与 Systems Manager Explorer 集成，以实现集中式多帐户合规性仪表板。 Inspector 检测漏洞但不直接应用补丁。配置规则评估合规性，但需要自定义修复逻辑。 Image Builder 创建修补的 AMI，但不直接处理正在运行的实例。"}, {"exam": 5, "id": 24, "question_en": "A company uses AWS Verified Access to provide secure access to internal web applications. The security team needs to log all access decisions including the user identity, trust data evaluated, and whether access was granted or denied for audit compliance purposes.\n \nHow should they configure Verified Access logging?", "options_en": ["Enable CloudTrail data events for the Verified Access service to capture all API calls including access grant and deny decisions with full request parameters.", "Configure the Verified Access trust provider to forward authentication events to a centralized SIEM through SAML assertion logging in the identity provider.", "Create VPC Flow Logs on the Verified Access endpoint ENIs to capture all network traffic and correlate the flow records with user identities from the IdP logs.", "Enable Verified Access access logs and configure delivery to CloudWatch Logs, S3, or Kinesis Data Firehose to capture trust context and access decisions per request."], "correct": 3, "explanation_en": "Verified Access provides built-in access logging that captures detailed information about each access request including user identity, trust provider data evaluated, policy decision, and whether access was granted or denied. Logs can be delivered to CloudWatch Logs, S3, or Kinesis Data Firehose. CloudTrail captures Verified Access management API calls, not individual access decisions. IdP logging captures authentication but not the Verified Access policy evaluation. VPC Flow Logs capture network-level data without application-level context.", "question_zh": "一家公司使用 AWS Verified Access 提供对内部 Web 应用程序的安全访问。安全团队需要记录所有访问决策，包括用户身份、评估的信任数据以及出于审计合规性目的是否授予或拒绝访问。\n \n他们应该如何配置验证访问日志记录？", "options_zh": ["为验证访问服务启用 CloudTrail 数据事件，以捕获所有 API 调用，包括具有完整请求参数的访问授予和拒绝决策。", "配置验证访问信任提供程序以通过身份提供程序中的 SAML 断言日志记录将身份验证事件转发到集中式 SIEM。", "在已验证的访问终端节点 ENI 上创建 VPC 流日志，以捕获所有网络流量并将流记录与 IdP 日志中的用户身份相关联。", "启用验证访问访问日志并配置到 CloudWatch Logs、S3 或 Kinesis Data Firehose 的传输，以捕获每个请求的信任上下文和访问决策。"], "explanation_zh": "验证访问提供内置访问日志记录，可捕获有关每个访问请求的详细信息，包括用户身份、评估的信任提供商数据、策略决策以及是否授予或拒绝访问。日志可以传送到 CloudWatch Logs、S3 或 Kinesis Data Firehose。 CloudTrail 捕获验证访问管理 API 调用，而不是单个访问决策。 IdP 日志记录捕获身份验证，但不捕获验证访问策略评估。 VPC 流日志捕获网络级数据，无需应用程序级上下文。"}, {"exam": 5, "id": 25, "question_en": "A healthcare application collects patient information through web forms served via Amazon CloudFront. Certain form fields such as Social Security numbers must be encrypted at the edge before reaching the origin servers, ensuring that only authorized backend microservices with the private key can decrypt these specific fields.\n \nWhich CloudFront feature provides this field-level protection?", "options_en": ["Configure CloudFront field-level encryption to encrypt specific POST body fields at the edge using a public key, so only holders of the private key can decrypt them.", "Enable CloudFront origin access control with a custom encryption header that encrypts sensitive form fields in transit between the CloudFront edge and the origin.", "Use AWS WAF attached to the CloudFront distribution with a custom rule that redacts sensitive field values from POST requests before forwarding to the origin.", "Configure CloudFront to use HTTPS with a client certificate that performs end-to-end TLS encryption including selective field encryption for sensitive form data."], "correct": 0, "explanation_en": "CloudFront field-level encryption allows you to specify which POST body form fields should be encrypted at the edge using an asymmetric public key. The encrypted fields remain encrypted through the origin and intermediate services until a microservice with the corresponding private key decrypts them. Origin access control handles S3 origin authentication, not field encryption. WAF can inspect but not selectively encrypt fields. Client certificates provide transport-level encryption, not field-level encryption.", "question_zh": "医疗保健应用程序通过 Amazon CloudFront 提供的 Web 表单收集患者信息。某些表单字段（例如社会保障号）必须在到达源服务器之前在边缘进行加密，确保只有拥有私钥的授权后端微服务才能解密这些特定字段。\n \n哪个 CloudFront 功能提供了这种字段级保护？", "options_zh": ["配置 CloudFront 字段级加密以使用公钥加密边缘的特定 POST 正文字段，因此只有私钥持有者才能解密它们。", "使用自定义加密标头启用 CloudFront 源访问控制，该标头对在 CloudFront 边缘和源之间传输的敏感表单字段进行加密。", "使用附加到 CloudFront 分配的 AWS WAF 和自定义规则，在转发到源之前编辑 POST 请求中的敏感字段值。", "将 CloudFront 配置为使用带有客户端证书的 HTTPS，该客户端证书执行端到端 TLS 加密，包括对敏感表单数据的选择性字段加密。"], "explanation_zh": "CloudFront 字段级加密允许您指定应使用非对称公钥在边缘加密哪些 POST 正文表单字段。加密字段通过源服务和中间服务保持加密状态，直到具有相应私钥的微服务对其进行解密。源访问控制处理 S3 源身份验证，而不是字段加密。 WAF 可以检查但不能选择性地加密字段。客户端证书提供传输级加密，而不是字段级加密。"}, {"exam": 5, "id": 26, "question_en": "Two VPCs in the same Region are connected via VPC peering. An application in VPC-A needs to allow inbound traffic only from a specific security group in VPC-B. The security team wants to avoid using CIDR-based rules because the IP ranges in VPC-B may change as instances scale.\n \nHow can they achieve this dynamic security group reference?", "options_en": ["Create a VPC endpoint service in VPC-B and have VPC-A connect through an interface endpoint, which allows security group rules based on the endpoint ENI.", "Use AWS Transit Gateway instead of VPC peering because Transit Gateway supports cross-VPC security group references while VPC peering does not support this.", "Reference the VPC-B security group directly in VPC-A's security group rule by specifying the peer VPC's account ID and security group ID in the inbound rule.", "Deploy a Network Load Balancer in VPC-B as a proxy and reference the NLB's security group in VPC-A's rules, since cross-VPC security group referencing is unsupported."], "correct": 2, "explanation_en": "VPC peering supports cross-VPC security group referencing within the same Region. Security group rules can reference a security group in the peered VPC by specifying the account ID and security group ID. This provides dynamic membership-based access control without relying on static CIDR ranges. VPC endpoints and NLBs add unnecessary architectural complexity. Transit Gateway does not support security group referencing across VPCs.", "question_zh": "同一区域中的两个 VPC 通过 VPC 对等连接。 VPC-A 中的应用程序需要仅允许来自 VPC-B 中特定安全组的入站流量。安全团队希望避免使用基于 CIDR 的规则，因为 VPC-B 中的 IP 范围可能会随着实例的扩展而变化。\n \n他们如何实现这种动态安全组引用？", "options_zh": ["在 VPC-B 中创建 VPC 终端节点服务，并通过接口终端节点连接 VPC-A，这允许基于终端节点 ENI 的安全组规则。", "使用 AWS Transit Gateway 而不是 VPC 对等互连，因为 Transit Gateway 支持跨 VPC 安全组引用，而 VPC 对等互连不支持此功能。", "通过在入站规则中指定对端VPC的账号ID和安全组ID，可以直接在VPC-A的安全组规则中引用VPC-B安全组。", "由于不支持跨 VPC 安全组引用，因此在 VPC-B 中部署网络负载均衡器作为代理，并在 VPC-A 的规则中引用 NLB 的安全组。"], "explanation_zh": "VPC 对等支持同一区域内的跨 VPC 安全组引用。安全组规则可以通过指定账户ID和安全组ID来引用对等VPC中的安全组。这提供了基于成员资格的动态访问控制，而不依赖于静态 CIDR 范围。 VPC 终端节点和 NLB 增加了不必要的架构复杂性。 Transit Gateway 不支持跨 VPC 的安全组引用。"}, {"exam": 5, "id": 27, "question_en": "A government agency hosts their public DNS zone in Amazon Route 53. They are required to implement DNSSEC signing for their domain to protect DNS responses from spoofing and to allow resolvers to verify the authenticity of DNS records.\n \nWhich steps are required to enable DNSSEC signing for a Route 53 public hosted zone?", "options_en": ["Create a symmetric KMS key in any Region, enable DNSSEC signing on the hosted zone referencing the symmetric key, and add the DS record to the parent zone.", "Create an asymmetric KMS key with ECC_NIST_P256 key spec in `us-east-1`, enable DNSSEC signing on the hosted zone, and add the DS record to the parent zone registrar.", "Import a third-party RSA 2048-bit signing key into AWS Certificate Manager, enable DNSSEC on the hosted zone with the imported certificate, and update the NS records.", "Enable Route 53 Resolver DNSSEC validation on the hosted zone, which automatically generates signing keys and publishes DS records to the parent zone registrar."], "correct": 1, "explanation_en": "Route 53 DNSSEC signing requires an asymmetric customer managed KMS key with the ECC_NIST_P256 key spec, and the key must be in the `us-east-1` Region. After enabling signing, you must add the Delegation Signer (DS) record to the parent zone at your domain registrar to establish the chain of trust. Symmetric keys cannot be used for DNSSEC. ACM certificates are for TLS, not DNS signing. Resolver DNSSEC validation is for validating signed responses, not for signing your own zone.", "question_zh": "政府机构在 Amazon Route 53 中托管其公共 DNS 区域。他们需要为其域实施 DNSSEC 签名，以保护 DNS 响应免遭欺骗，并允许解析程序验证 DNS 记录的真实性。\n \n为 Route 53 公共托管区域启用 DNSSEC 签名需要执行哪些步骤？", "options_zh": ["在任何区域中创建对称 KMS 密钥，在引用对称密钥的托管区域上启用 DNSSEC 签名，并将 DS 记录添加到父区域。", "在“us-east-1”中使用 ECC_NIST_P256 密钥规范创建非对称 KMS 密钥，在托管区域上启用 DNSSEC 签名，并将 DS 记录添加到父区域注册器。", "将第三方 RSA 2048 位签名密钥导入 AWS Certificate Manager，使用导入的证书在托管区域上启用 DNSSEC，并更新 NS 记录。", "在托管区域上启用 Route 53 解析器 DNSSEC 验证，该验证会自动生成签名密钥并将 DS 记录发布到父区域注册商。"], "explanation_zh": "Route 53 DNSSEC 签名需要具有 ECC_NIST_P256 密钥规范的非对称客户管理的 KMS 密钥，并且该密钥必须位于“us-east-1”区域。启用签名后，您必须将委派签名者 (DS) 记录添加到域名注册商的父区域以建立信任链。对称密钥不能用于 DNSSEC。 ACM 证书用于 TLS，而不是 DNS 签名。解析器 DNSSEC 验证用于验证签名的响应，而不是用于对您自己的区域进行签名。"}, {"exam": 5, "id": 28, "question_en": "A company wants to distinguish between legitimate human users and automated bots accessing their web application protected by AWS WAF. They want a silent verification method that does not disrupt the user experience for legitimate visitors but blocks clients that cannot run JavaScript.\n \nWhich WAF rule action should they use?", "options_en": ["Configure a WAF rule with the `Block` action and a custom response that returns an HTML page with a reCAPTCHA widget for the client to complete.", "Configure a WAF rule with the `Count` action combined with a label that triggers a downstream Lambda function to verify the client browser fingerprint.", "Configure a WAF rule with the `CAPTCHA` action that presents an interactive visual puzzle requiring the user to solve a challenge before accessing the application.", "Configure a WAF rule with the `Challenge` action that silently verifies the client can run JavaScript without presenting a visual puzzle to the end user."], "correct": 3, "explanation_en": "The WAF `Challenge` action performs a silent client verification by serving an interstitial page that runs JavaScript to verify the client is a real browser. Unlike the `CAPTCHA` action, which presents a visual puzzle requiring user interaction, the Challenge action is transparent to legitimate users with JavaScript-capable browsers. The Block action with a custom response requires custom implementation. The Count action does not block or verify clients.", "question_zh": "一家公司希望区分合法人类用户和访问受 AWS WAF 保护的 Web 应用程序的自动机器人。他们想要一种静默验证方法，该方法不会破坏合法访问者的用户体验，但会阻止无法运行 JavaScript 的客户端。\n \n他们应该使用哪种 WAF 规则操作？", "options_zh": ["使用“阻止”操作和自定义响应配置 WAF 规则，该响应返回带有 reCAPTCHA 小部件的 HTML 页面以供客户端完成。", "使用“计数”操作结合触发下游 Lambda 函数以验证客户端浏览器指纹的标签来配置 WAF 规则。", "使用“CAPTCHA”操作配置 WAF 规则，该操作会呈现交互式视觉谜题，要求用户在访问应用程序之前解决挑战。", "使用“挑战”操作配置 WAF 规则，以静默方式验证客户端是否可以运行 JavaScript，而不向最终用户呈现视觉难题。"], "explanation_zh": "WAF“挑战”操作通过提供运行 JavaScript 的插页式页面来执行静默客户端验证，以验证客户端是否是真实的浏览器。与“CAPTCHA”操作不同，“CAPTCHA”操作呈现需要用户交互的视觉谜题，“挑战”操作对于使用支持 JavaScript 的浏览器的合法用户来说是透明的。具有自定义响应的阻止操作需要自定义实现。计数操作不会阻止或验证客户端。"}, {"exam": 5, "id": 29, "question_en": "A company's AWS Network Firewall policy contains both stateless and stateful rule groups. The security team needs to understand the traffic evaluation order to troubleshoot why certain packets are being dropped before reaching their stateful inspection rules.\n \nWhat is the correct traffic evaluation order in AWS Network Firewall?", "options_en": ["Stateless rules are evaluated first by priority, then traffic that passes or is forwarded to stateful rules undergoes stateful inspection as the second stage.", "Stateful rules are evaluated first using 5-tuple matching, then traffic not matching any stateful rule is passed to the stateless rule groups for final disposition.", "Stateless and stateful rules are evaluated simultaneously, and the most specific matching rule across both types determines whether traffic is allowed or dropped.", "Traffic is evaluated against the default action first, then stateless rules by priority, then stateful rules, with the first matching rule at any stage being final."], "correct": 0, "explanation_en": "AWS Network Firewall evaluates stateless rules first, processing them by priority number. Each stateless rule group can pass, drop, or forward traffic to stateful rule groups. Only traffic explicitly forwarded to stateful rules by the stateless engine undergoes stateful inspection. This two-stage evaluation means that packets dropped by stateless rules never reach stateful inspection, which explains why certain traffic may be blocked before stateful rules apply.", "question_zh": "公司的 AWS 网络防火墙策略包含无状态和有状态规则组。安全团队需要了解流量评估顺序，以便在达到状态检查规则之前排除某些数据包被丢弃的原因。\n \nAWS 网络防火墙中正确的流量评估顺序是什么？", "options_zh": ["无状态规则首先按优先级进行评估，然后通过或转发到有状态规则的流量进行第二阶段的状态检查。", "首先使用 5 元组匹配评估有状态规则，然后将不匹配任何有状态规则的流量传递到无状态规则组进行最终处理。", "无状态和有状态规则同时评估，两种类型中最具体的匹配规则决定是允许还是丢弃流量。", "首先根据默认操作评估流量，然后按优先级评估无状态规则，然后是有状态规则，任何阶段的第一个匹配规则都是最终的。"], "explanation_zh": "AWS Network Firewall 首先评估无状态规则，并按优先级编号进行处理。每个无状态规则组都可以将流量传递、丢弃或转发到有状态规则组。只有由无状态引擎显式转发到有状态规则的流量才会经过状态检查。这种两阶段评估意味着无状态规则丢弃的数据包永远不会到达有状态检查，这解释了为什么某些流量可能会在有状态规则应用之前被阻止。"}, {"exam": 5, "id": 30, "question_en": "A company needs to provide SSH access to EC2 instances in private subnets for troubleshooting. The instances have no public IP addresses and the company does not want to deploy bastion hosts or NAT gateways. They also want to leverage IAM for controlling who can connect.\n \nWhich solution meets these requirements with the LEAST operational overhead?", "options_en": ["Set up AWS Client VPN with an endpoint in the VPC and configure IAM-based authentication so that authorized users can establish a VPN tunnel to reach instances.", "Create an EC2 Instance Connect Endpoint in the VPC, which allows IAM-authorized users to SSH into private instances without public IPs or bastion hosts.", "Deploy AWS Systems Manager Session Manager with the SSM Agent on all instances and grant IAM permissions for `ssm:StartSession` to authorized users.", "Configure AWS Direct Connect with a private virtual interface and use IAM conditions to restrict SSH access through the Direct Connect link to authorized members."], "correct": 1, "explanation_en": "EC2 Instance Connect Endpoint creates a private tunnel to instances in private subnets without requiring public IPs, bastion hosts, IGWs, or NAT gateways. Access is controlled through IAM policies, and connections are logged in CloudTrail. Session Manager is also valid but uses a browser-based or CLI session rather than native SSH. Client VPN requires VPN endpoint management overhead. Direct Connect is a dedicated physical connection not suitable for ad-hoc SSH access.", "question_zh": "公司需要提供对私有子网中的 EC2 实例的 SSH 访问以进行故障排除。这些实例没有公共 IP 地址，公司不想部署堡垒主机或 NAT 网关。他们还希望利用 IAM 来控制谁可以连接。\n \n哪种解决方案能够以最少的运营开销满足这些要求？", "options_zh": ["使用 VPC 中的终端节点设置 AWS 客户端 VPN 并配置基于 IAM 的身份验证，以便授权用户可以建立 VPN 隧道来访问实例。", "在 VPC 中创建 EC2 Instance Connect 终端节点，允许 IAM 授权的用户通过 SSH 访问私有实例，而无需公共 IP 或堡垒主机。", "在所有实例上使用 SSM 代理部署 AWS Systems Manager 会话管理器，并向授权用户授予“ssm:StartSession”的 IAM 权限。", "使用私有虚拟接口配置 AWS Direct Connect，并使用 IAM 条件限制通过 Direct Connect 链接对授权成员进行 SSH 访问。"], "explanation_zh": "EC2 Instance Connect 终端节点创建通往私有子网中实例的私有隧道，无需公共 IP、堡垒主机、IGW 或 NAT 网关。访问通过 IAM 策略进行控制，连接记录在 CloudTrail 中。会话管理器也有效，但使用基于浏览器或 CLI 会话而不是本机 SSH。客户端 VPN 需要 VPN 端点管理开销。 Direct Connect 是专用物理连接，不适合临时 SSH 访问。"}, {"exam": 5, "id": 31, "question_en": "A development team uses a CI/CD pipeline to build and deploy container images to Amazon ECR. The security team requires that container images be scanned for critical vulnerabilities before deployment, and the pipeline must fail if any critical findings are detected.\n \nHow should they integrate Amazon Inspector into the CI/CD pipeline?", "options_en": ["Enable ECR basic scanning which triggers automatically on image push and configure EventBridge rules to block ECS deployments when critical findings are generated.", "Install the Inspector agent inside the container image during the build phase so that Inspector can continuously monitor the container for vulnerabilities after deployment.", "Use the Amazon Inspector SBOM Generator and Inspector Scan API in the build stage to scan container images and fail the pipeline if critical vulnerabilities are found.", "Configure Amazon Inspector to monitor the ECR repository and create an AWS Config rule that evaluates image compliance, blocking non-compliant images from deployment."], "correct": 2, "explanation_en": "Amazon Inspector provides CI/CD integration through the Inspector SBOM Generator and the Inspector Scan API. The SBOM generator extracts the software inventory from the container image during the build stage, and the Scan API evaluates it for vulnerabilities. Pipeline logic can fail the build if critical findings are returned. ECR basic scanning is asynchronous and not designed for pipeline gating. Inspector does not use agents inside containers. Config rules evaluate resource compliance, not container image contents.", "question_zh": "开发团队使用 CI/CD 管道构建容器映像并将其部署到 Amazon ECR。安全团队要求在部署之前扫描容器映像是否存在严重漏洞，如果检测到任何严重问题，管道必须失败。\n \n他们应该如何将 Amazon Inspector 集成到 CI/CD 管道中？", "options_zh": ["启用在图像推送时自动触发的 ECR 基本扫描，并配置 EventBridge 规则以在生成关键结果时阻止 ECS 部署。", "在构建阶段将 Inspector 代理安装在容器映像内，以便 Inspector 可以在部署后持续监控容器是否存在漏洞。", "在构建阶段使用 Amazon Inspector SBOM 生成器和 Inspector 扫描 API 扫描容器映像，并在发现严重漏洞时使管道失败。", "配置 Amazon Inspector 以监控 ECR 存储库并创建 AWS Config 规则来评估映像合规性，阻止部署不合规的映像。"], "explanation_zh": "Amazon Inspector 通过 Inspector SBOM 生成器和 Inspector 扫描 API 提供 CI/CD 集成。 SBOM 生成器在构建阶段从容器映像中提取软件清单，并且 Scan API 对其进行漏洞评估。如果返回关键结果，管道逻辑可能会使构建失败。 ECR 基本扫描是异步的，并不是为管道门控而设计的。 Inspector 不在容器内使用代理。配置规则评估资源合规性，而不是容器镜像内容。"}, {"exam": 5, "id": 32, "question_en": "A company uses AWS CloudFormation to deploy infrastructure. They want to ensure that certain IAM roles can only create S3 buckets when the request originates from CloudFormation, preventing direct API calls to S3 from the same role using the CLI or SDK.\n \nWhich IAM condition key enforces this restriction?", "options_en": ["Use `aws:SourceArn` to restrict the S3 `CreateBucket` action to requests where the source ARN matches the specific CloudFormation stack ARN.", "Use `aws:RequestedRegion` to restrict S3 bucket creation to Regions where CloudFormation stacks are deployed, preventing direct calls from other Regions.", "Use `aws:PrincipalServiceName` to verify that the calling principal is the CloudFormation service, blocking any direct user or role API calls to S3.", "Use `aws:CalledVia` to require that the S3 API call was made through `cloudformation.amazonaws.com`, ensuring requests originate from CloudFormation."], "correct": 3, "explanation_en": "The `aws:CalledVia` condition key verifies that an AWS service made the API call on behalf of the principal. Setting it to `cloudformation.amazonaws.com` ensures that S3 bucket creation only succeeds when the request passes through CloudFormation. Direct API calls from the role would lack this condition and be denied. `aws:SourceArn` is for service-to-service calls, not for restricting user-initiated service chaining. `aws:RequestedRegion` filters by Region, not calling service.", "question_zh": "一家公司使用 AWS CloudFormation 来部署基础设施。他们希望确保某些 IAM 角色只能在请求源自 CloudFormation 时创建 S3 存储桶，从而防止同一角色使用 CLI 或 SDK 直接对 S3 进行 API 调用。\n \n哪个 IAM 条件键强制实施此限制？", "options_zh": ["使用 `aws:SourceArn` 将 S3 `CreateBucket` 操作限制为源 ARN 与特定 CloudFormation 堆栈 ARN 匹配的请求。", "使用 `aws:RequestedRegion` 将 S3 存储桶创建限制在部署了 CloudFormation 堆栈的区域，从而防止来自其他区域的直接调用。", "使用“aws:PrincipalServiceName”验证调用主体是否为 CloudFormation 服务，从而阻止对 S3 的任何直接用户或角色 API 调用。", "使用“aws:CalledVia”要求通过“cloudformation.amazonaws.com”进行 S3 API 调用，确保请求源自 CloudFormation。"], "explanation_zh": "`aws:CalledVia` 条件键验证 AWS 服务是否代表委托人进行 API 调用。将其设置为“cloudformation.amazonaws.com”可确保仅当请求通过 CloudFormation 时，S3 存储桶创建才会成功。来自角色的直接 API 调用将缺少此条件并被拒绝。 `aws:SourceArn` 用于服务到服务的调用，而不是用于限制用户启动的服务链。 `aws:RequestedRegion` 按区域过滤，而不是调用服务。"}, {"exam": 5, "id": 33, "question_en": "An organization has a nested OU structure: Root, then Security OU, then Sub-OU. The Root has the default `FullAWSAccess` SCP. The Security OU has an SCP that allows only `iam:*`, `cloudtrail:*`, and `config:*`. No additional SCPs are attached to the Sub-OU.\n \nWhich permissions are available to accounts in the Sub-OU?", "options_en": ["Only `iam:*`, `cloudtrail:*`, and `config:*` because the effective permissions are the intersection of all inherited SCPs along the OU path.", "All AWS actions because the Root's `FullAWSAccess` SCP overrides the restrictive SCP on the Security OU for all descendant accounts.", "No AWS actions because the Sub-OU has no SCP attached, and without an explicit Allow SCP at each level, all actions are implicitly denied.", "All actions allowed by the Security OU SCP plus any actions granted by IAM policies, since SCPs only apply at the OU level where they are directly attached."], "correct": 0, "explanation_en": "SCP permissions are the intersection of all SCPs along the path from the Root to the account. The Root allows everything via `FullAWSAccess`, and the Security OU restricts to IAM, CloudTrail, and Config. The effective permissions for accounts in the Sub-OU are the intersection: only those three service namespaces. The Root SCP does not override child SCPs. The Sub-OU inherits its parent's restrictions even without its own SCP. SCPs are evaluated at every level in the hierarchy.", "question_zh": "组织具有嵌套的 OU 结构：根、安全 OU、子 OU。根具有默认的“FullAWSAccess”SCP。安全 OU 具有仅允许“iam:*”、“cloudtrail:*”和“config:*”的 SCP。没有其他 SCP 附加到子 OU。\n \n子OU中的账户有哪些权限？", "options_zh": ["仅“iam:*”、“cloudtrail:*”和“config:*”，因为有效权限是沿 OU 路径继承的所有 SCP 的交集。", "所有 AWS 操作，因为根的“FullAWSAccess” SCP 会覆盖所有后代账户的安全 OU 上的限制性 SCP。", "没有 AWS 操作，因为子 OU 没有附加 SCP，并且在每个级别没有显式允许 SCP，所有操作都会被隐式拒绝。", "安全 OU SCP 允许的所有操作加上 IAM 策略授予的任何操作，因为 SCP 仅适用于它们直接附加的 OU 级别。"], "explanation_zh": "SCP 权限是从 Root 到帐户路径上所有 SCP 的交集。根允许通过“FullAWSAccess”执行所有操作，安全 OU 仅限于 IAM、CloudTrail 和 Config。子OU中账户的有效权限是交集：只有这三个服务命名空间。根 SCP 不会覆盖子 SCP。即使没有自己的 SCP，子 OU 也会继承其父级的限制。 SCP 在层次结构的每个级别进行评估。"}, {"exam": 5, "id": 34, "question_en": "A company uses IAM Identity Center as their central identity provider. They have a third-party SaaS application that supports SAML 2.0 single sign-on. The company wants users to access this SaaS application from the IAM Identity Center portal with their existing credentials.\n \nHow should they configure this integration?", "options_en": ["Create an IAM SAML identity provider in the SaaS vendor's AWS account and configure a trust relationship with the company's IAM Identity Center instance.", "Add a custom SAML 2.0 application in IAM Identity Center, upload the SaaS application's metadata, configure attribute mappings, and assign users or groups.", "Set up Amazon Cognito as an intermediary that federates with IAM Identity Center via OIDC and provides SAML assertions to the third-party SaaS application.", "Create an IAM role in the company's account with a SAML trust policy pointing to IAM Identity Center and share the role ARN with the SaaS application vendor."], "correct": 1, "explanation_en": "IAM Identity Center supports custom SAML 2.0 application integrations. Administrators add the SaaS application, upload the application's SAML metadata or manually configure the ACS URL and entity ID, map user attributes, and assign access to users or groups. Users then see the application tile in their Identity Center portal. Creating an IAM SAML provider is for federating external IdPs into AWS, not the reverse. Cognito adds unnecessary complexity. IAM roles with SAML trust policies are for accessing AWS resources, not third-party SaaS.", "question_zh": "一家公司使用 IAM Identity Center 作为其中央身份提供商。他们有一个支持 SAML 2.0 单点登录的第三方 SaaS 应用程序。该公司希望用户使用现有凭证从 IAM Identity Center 门户访问此 SaaS 应用程序。\n \n他们应该如何配置此集成？", "options_zh": ["在 SaaS 供应商的 AWS 账户中创建 IAM SAML 身份提供商，并配置与公司的 IAM Identity Center 实例的信任关系。", "在 IAM Identity Center 中添加自定义 SAML 2.0 应用程序、上传 SaaS 应用程序的元数据、配置属性映射以及分配用户或组。", "将 Amazon Cognito 设置为通过 OIDC 与 IAM Identity Center 联合的中介，并向第三方 SaaS 应用程序提供 SAML 断言。", "使用指向 IAM Identity Center 的 SAML 信任策略在公司账户中创建 IAM 角色，并与 SaaS 应用程序供应商共享角色 ARN。"], "explanation_zh": "IAM Identity Center 支持自定义 SAML 2.0 应用程序集成。管理员添加 SaaS 应用程序、上传应用程序的 SAML 元数据或手动配置 ACS URL 和实体 ID、映射用户属性以及为用户或组分配访问权限。然后，用户会在其 Identity Center 门户中看到该应用程序磁贴。创建 IAM SAML 提供商是为了将外部 IdP 联合到 AWS，而不是相反。 Cognito 增加了不必要的复杂性。具有 SAML 信任策略的 IAM 角色用于访问 AWS 资源，而不是第三方 SaaS。"}, {"exam": 5, "id": 35, "question_en": "A company's web application uses Amazon Cognito user pools for authentication. Compliance requires that all users must complete multi-factor authentication during sign-in. The security team wants to support both TOTP authenticator apps and SMS-based one-time passwords as MFA methods.\n \nHow should they configure Cognito MFA?", "options_en": ["Enable MFA in the user pool settings with enforcement set to Optional, then create a Lambda pre-authentication trigger that denies sign-in if MFA is not completed.", "Configure the application client to require MFA by setting the auth flow to `CUSTOM_AUTH` and implementing MFA verification in a custom authentication Lambda.", "Set MFA enforcement to Required in the user pool settings and enable both TOTP software token and SMS message as available MFA methods for the user pool.", "Enable adaptive authentication with the risk level set to Always, which automatically requires MFA challenges for every sign-in attempt regardless of risk score."], "correct": 2, "explanation_en": "Cognito user pools support MFA enforcement at the pool level with the Required setting, which mandates MFA for all users. Both TOTP software token and SMS can be enabled simultaneously, allowing users to choose their preferred method. Setting MFA to Optional and using Lambda triggers is unnecessarily complex and error-prone. Custom authentication flows require significant development effort. Adaptive authentication adjusts MFA requirements based on risk assessment, not as a blanket requirement.", "question_zh": "公司的 Web 应用程序使用 Amazon Cognito 用户池进行身份验证。合规性要求所有用户在登录期间必须完成多重身份验证。安全团队希望支持 TOTP 身份验证器应用程序和基于短信的一次性密码作为 MFA 方法。\n \n他们应该如何配置 Cognito MFA？", "options_zh": ["在用户池设置中启用 MFA，并将强制执行设置为可选，然后创建一个 Lambda 预身份验证触发器，该触发器在 MFA 未完成时拒绝登录。", "通过将身份验证流程设置为“CUSTOM_AUTH”并在自定义身份验证 Lambda 中实施 MFA 验证，将应用程序客户端配置为需要 MFA。", "在用户池设置中将 MFA 强制设置为“必需”，并启用 TOTP 软件令牌和 SMS 消息作为用户池的可用 MFA 方法。", "启用自适应身份验证，并将风险级别设置为“始终”，这会自动要求每次登录尝试都进行 MFA 质询，无论风险评分如何。"], "explanation_zh": "Cognito 用户池通过“必需”设置在池级别支持 MFA 强制实施，该设置为所有用户强制执行 MFA。 TOTP 软件令牌和 SMS 可以同时启用，允许用户选择自己喜欢的方法。将 MFA 设置为可选并使用 Lambda 触发器会变得不必要的复杂且容易出错。自定义身份验证流程需要大量的开发工作。自适应身份验证根据风险评估调整 MFA 要求，而不是作为一揽子要求。"}, {"exam": 5, "id": 36, "question_en": "A company requires that IAM users must present an MFA token before performing any API operations in the production AWS account. An engineer uses the AWS CLI and needs to include MFA verification when making API calls from the command line.\n \nWhich STS API call should the engineer use to obtain MFA-authenticated temporary credentials?", "options_en": ["Call `sts:GetSessionToken` with the MFA device serial number and the current TOTP code to receive temporary credentials that include MFA authentication context.", "Call `sts:AssumeRole` with the engineer's own IAM user ARN as the role and include the MFA serial number parameter to elevate the session with MFA.", "Call `sts:GetFederationToken` with MFA parameters to obtain federated temporary credentials that carry MFA authentication status for subsequent API calls.", "Call `sts:GetCallerIdentity` with the MFA token code appended to verify the MFA device, then use the existing long-term credentials for subsequent API calls."], "correct": 0, "explanation_en": "`sts:GetSessionToken` is the correct API for IAM users to obtain MFA-authenticated temporary credentials. The call requires the MFA device serial number and current token code. The resulting temporary credentials include MFA context, satisfying IAM policy conditions like `aws:MultiFactorAuthPresent`. `AssumeRole` is for assuming a different role, not the user's own identity. `GetFederationToken` does not support MFA parameters. `GetCallerIdentity` returns identity information and does not accept MFA input.", "question_zh": "公司要求 IAM 用户在生产 AWS 账户中执行任何 API 操作之前必须出示 MFA 令牌。工程师使用 AWS CLI，并且在从命令行进行 API 调用时需要包含 MFA 验证。\n \n工程师应使用哪个 STS API 调用来获取经过 MFA 验证的临时凭证？", "options_zh": ["使用 MFA 设备序列号和当前 TOTP 代码调用“sts:GetSessionToken”，以接收包含 MFA 身份验证上下文的临时凭证。", "使用工程师自己的 IAM 用户 ARN 作为角色调用“sts:AssumeRole”，并包含 MFA 序列号参数以提升与 MFA 的会话。", "使用 MFA 参数调用“sts:GetFederationToken”以获取联合临时凭证，该凭证携带后续 API 调用的 MFA 身份验证状态。", "调用“sts:GetCallerIdentity”并附加 MFA 令牌代码来验证 MFA 设备，然后使用现有的长期凭据进行后续 API 调用。"], "explanation_zh": "`sts:GetSessionToken` 是 IAM 用户获取经过 MFA 身份验证的临时凭证的正确 API。该调用需要 MFA 设备序列号和当前令牌代码。生成的临时凭证包括 MFA 上下文，满足 IAM 策略条件，例如“aws:MultiFactorAuthPresent”。 `AssumeRole` 用于假设不同的角色，而不是用户自己的身份。 `GetFederationToken` 不支持 MFA 参数。 `GetCallerIdentity` 返回身份信息，不接受 MFA 输入。"}, {"exam": 5, "id": 37, "question_en": "A development team is building a multi-tenant application that uses Amazon Verified Permissions for fine-grained authorization. They need to ensure that all Cedar policies submitted to the policy store conform to a predefined data model that defines valid entity types, actions, and attributes.\n \nWhich Verified Permissions feature enforces this data model consistency?", "options_en": ["Define Cedar policy templates that constrain the structure of all policies and require developers to instantiate policies from approved templates only.", "Use IAM policies attached to the developers' roles to restrict which Cedar policy elements they can include when calling the `CreatePolicy` API.", "Implement a Lambda authorizer that validates Cedar policy syntax against a custom JSON schema before the policy is submitted to the Verified Permissions policy store.", "Configure a schema in the Verified Permissions policy store that defines the valid entity types, actions, and attributes, so that policies are validated against it on creation."], "correct": 3, "explanation_en": "Verified Permissions supports a schema definition for each policy store that specifies valid entity types, actions, and context attributes. When a schema is configured, all policies are validated against it during creation and updates, ensuring consistency with the application's data model. Policy templates define reusable policy structures but do not enforce a data model. IAM policies control API access, not Cedar policy content. Custom Lambda validation adds complexity when native schema validation already exists.", "question_zh": "开发团队正在构建一个多租户应用程序，该应用程序使用 Amazon Verified Permissions 进行细粒度授权。他们需要确保提交到策略存储的所有 Cedar 策略都符合定义有效实体类型、操作和属性的预定义数据模型。\n \n哪个验证权限功能强制执行此数据模型一致性？", "options_zh": ["定义 Cedar 策略模板，限制所有策略的结构，并要求开发人员仅从批准的模板实例化策略。", "使用附加到开发人员角色的 IAM 策略来限制他们在调用“CreatePolicy” API 时可以包含哪些 Cedar 策略元素。", "实现一个 Lambda 授权方，在将策略提交到已验证的权限策略存储之前，根据自定义 JSON 架构验证 Cedar 策略语法。", "在验证权限策略存储中配置一个架构，该架构定义有效的实体类型、操作和属性，以便在创建时根据其验证策略。"], "explanation_zh": "已验证的权限支持每个策略存储的架构定义，该定义指定有效的实体类型、操作和上下文属性。配置模式后，所有策略都会在创建和更新期间根据该模式进行验证，确保与应用程序的数据模型的一致性。策略模板定义可重用的策略结构，但不强制执行数据模型。 IAM 策略控制 API 访问，而不是 Cedar 策略内容。当本机架构验证已经存在时，自定义 Lambda 验证会增加复杂性。"}, {"exam": 5, "id": 38, "question_en": "A company uses AWS Managed Microsoft AD in `us-east-1` for authentication across their AWS workloads. They are expanding to `eu-west-1` and need domain controllers in the European Region to reduce authentication latency for EC2 instances deployed there.\n \nHow should they extend their directory to the new Region?", "options_en": ["Create a new AWS Managed Microsoft AD directory in `eu-west-1` and configure a two-way forest trust between the two directories for cross-Region authentication.", "Add `eu-west-1` as a new Region for the existing directory, which automatically deploys additional domain controllers in the target Region for low-latency access.", "Deploy an AD Connector in `eu-west-1` that proxies authentication requests over a VPN connection back to the Managed AD domain controllers in `us-east-1`.", "Use VPC peering between the two Regions and configure the `eu-west-1` VPC's DHCP options to use the `us-east-1` domain controllers as DNS servers."], "correct": 1, "explanation_en": "AWS Managed Microsoft AD supports multi-Region replication, allowing you to add additional Regions to an existing directory. This automatically deploys domain controllers in the target Region, providing low-latency authentication for local workloads while maintaining a single directory identity. Creating a separate directory with forest trust adds operational complexity. AD Connector routes all requests cross-Region, increasing latency. VPC peering without local domain controllers does not reduce authentication latency.", "question_zh": "一家公司在“us-east-1”中使用 AWS Managed Microsoft AD 在其 AWS 工作负载中进行身份验证。他们正在扩展到“eu-west-1”，并且需要欧洲区域的域控制器来减少部署在那里的 EC2 实例的身份验证延迟。\n \n他们应该如何将目录扩展到新区域？", "options_zh": ["在“eu-west-1”中创建新的 AWS Managed Microsoft AD 目录，并在两个目录之间配置双向林信任以进行跨区域身份验证。", "将“eu-west-1”添加为现有目录的新区域，这会自动在目标区域中部署其他域控制器以实现低延迟访问。", "在“eu-west-1”中部署 AD 连接器，通过 VPN 连接将身份验证请求代理回“us-east-1”中的托管 AD 域控制器。", "在两个区域之间使用 VPC 对等互连，并配置“eu-west-1”VPC 的 DHCP 选项以使用“us-east-1”域控制器作为 DNS 服务器。"], "explanation_zh": "AWS Managed Microsoft AD 支持多区域复制，允许您将其他区域添加到现有目录。这会自动在目标区域中部署域控制器，为本地工作负载提供低延迟身份验证，同时维护单个目录身份。创建具有林信任的单独目录会增加操作复杂性。 AD Connector 跨区域路由所有请求，从而增加延迟。没有本地域控制器的 VPC 对等互连不会减少身份验证延迟。"}, {"exam": 5, "id": 39, "question_en": "A security team is working to enforce least-privilege access across their organization. They need to identify IAM roles that have permissions granted but never used within the last 90 days, and IAM users with access keys that have not been used recently, at organizational scale.\n \nWhich feature provides this analysis?", "options_en": ["Use IAM credential reports to download a CSV of all users' credential status including last-used dates for passwords and access keys across the entire account.", "Enable AWS Config with the `iam-policy-no-statements-with-admin-access` managed rule to detect overly permissive policies attached to roles and users.", "Create an IAM Access Analyzer analyzer with unused access analysis, which identifies unused roles, unused permissions, unused access keys, and unused passwords.", "Review the IAM Access Advisor tab for each role individually to see which services were last accessed and identify permissions that have not been exercised."], "correct": 2, "explanation_en": "IAM Access Analyzer unused access analysis can scan across an organization or account to identify unused roles, unused permissions within policies, unused access keys, and unused passwords. It generates findings with recommendations for remediation at scale. IAM credential reports show credential status but not unused permissions within policies. Config rules check policy content, not usage patterns. Access Advisor shows service last accessed data per role but requires manual role-by-role review and does not generate actionable findings at scale.", "question_zh": "安全团队正在努力在整个组织中强制实施最低权限访问。他们需要在组织范围内识别已授予权限但在过去 90 天内从未使用过的 IAM 角色，以及最近未使用过访问密钥的 IAM 用户。\n \n哪个功能提供此分析？", "options_zh": ["使用 IAM 凭证报告下载所有用户凭证状态的 CSV，其中包括整个账户的密码和访问密钥的上次使用日期。", "使用“iam-policy-no-statements-with-admin-access”托管规则启用 AWS Config，以检测附加到角色和用户的过于宽松的策略。", "创建具有未使用访问分析的 IAM Access Analyzer 分析器，该分析器可识别未使用的角色、未使用的权限、未使用的访问密钥和未使用的密码。", "单独查看每个角色的 IAM 访问顾问选项卡，以查看上次访问的服务并确定尚未行使的权限。"], "explanation_zh": "IAM 访问分析器未使用的访问分析可以扫描整个组织或账户，以识别未使用的角色、策略中未使用的权限、未使用的访问密钥和未使用的密码。它会生成调查结果以及大规模修复建议。 IAM 凭证报告显示凭证状态，但不显示策略中未使用的权限。配置规则检查策略内容，而不是使用模式。访问顾问显示每个角色的服务上次访问的数据，但需要手动逐个角色审查，并且不会大规模生成可操作的结果。"}, {"exam": 5, "id": 40, "question_en": "A security engineer notices that certain IAM roles in their account were not created by any team member and cannot be modified or deleted through normal IAM operations. These roles have policies that grant permissions to specific AWS services and are prefixed with `AWSServiceRoleFor`.\n \nWhat type of IAM roles are these?", "options_en": ["These are AWS managed roles that are automatically created during account setup and provide default permissions for commonly used AWS services across the account.", "These are cross-account roles created by AWS support during a support case, providing temporary access for AWS personnel to troubleshoot service-related issues.", "These are IAM roles created by AWS Organizations SCPs that automatically provision service access roles when new services are enabled in organizational member accounts.", "These are service-linked roles that are predefined by AWS services, containing only the permissions each service needs to call other AWS services on your behalf."], "correct": 3, "explanation_en": "Service-linked roles (SLRs) are predefined IAM roles created by AWS services, prefixed with `AWSServiceRoleFor`. They contain only the permissions the service requires and cannot be modified by customers because AWS manages the trust and permission policies. SLRs are created when you enable certain service features. They are not account setup roles, not support access roles, and not created by SCPs.", "question_zh": "安全工程师注意到，其账户中的某些 IAM 角色不是由任何团队成员创建的，并且无法通过正常 IAM 操作进行修改或删除。这些角色具有向特定 AWS 服务授予权限的策略，并以“AWSServiceRoleFor”为前缀。\n \n这些是什么类型的 IAM 角色？", "options_zh": ["这些是在账户设置期间自动创建的 AWS 托管角色，并为账户中常用的 AWS 服务提供默认权限。", "这些是 AWS 支持人员在支持案例期间创建的跨账户角色，为 AWS 人员提供临时访问权限以解决与服务相关的问题。", "这些是由 AWS Organizations SCP 创建的 IAM 角色，当在组织成员账户中启用新服务时，这些角色会自动预置服务访问角色。", "这些是由 AWS 服务预定义的服务相关角色，仅包含每个服务代表您调用其他 AWS 服务所需的权限。"], "explanation_zh": "服务相关角色 (SLR) 是由 AWS 服务创建的预定义 IAM 角色，前缀为“AWSServiceRoleFor”。它们仅包含服务所需的权限，客户无法修改，因为 AWS 管理信任和权限策略。当您启用某些服务功能时，就会创建 SLR。它们不是帐户设置角色，不支持访问角色，也不是由 SCP 创建的。"}, {"exam": 5, "id": 41, "question_en": "A company allows IAM users to assume a highly privileged admin role after MFA authentication. For security, they want the assumed role session to be denied if the MFA verification occurred more than one hour ago, forcing users to re-authenticate with MFA.\n \nWhich IAM condition key should they use in the role's trust policy?", "options_en": ["Use `aws:MultiFactorAuthAge` with a `NumericLessThan` condition set to 3600 to deny role assumption if MFA authentication is older than one hour.", "Use `aws:MultiFactorAuthPresent` with a `Bool` condition set to true combined with a session duration limit of 3600 seconds on the role itself.", "Use `aws:TokenIssueTime` with a `DateGreaterThan` condition to restrict role assumption to sessions where the token was issued within the last hour.", "Use `aws:SessionDuration` with a `NumericLessThan` condition set to 3600 to limit the maximum session length, effectively forcing MFA re-verification."], "correct": 0, "explanation_en": "The `aws:MultiFactorAuthAge` condition key evaluates the number of seconds since MFA authentication occurred. Using `NumericLessThan: 3600` in the role trust policy restricts access to sessions where MFA was verified within the last hour. `aws:MultiFactorAuthPresent` only checks whether MFA was used, not when. `aws:TokenIssueTime` checks when temporary credentials were issued, not when MFA was completed. `aws:SessionDuration` is not a valid IAM condition key for trust policies.", "question_zh": "公司允许 IAM 用户在 MFA 身份验证后担任具有高权限的管理员角色。出于安全考虑，如果 MFA 验证发生在一个多小时前，他们希望拒绝代入的角色会话，从而强制用户使用 MFA 重新进行身份验证。\n \n他们应该在角色的信任策略中使用哪个 IAM 条件键？", "options_zh": ["如果 MFA 身份验证早于一小时，请使用“aws:MultiFactorAuthAge”并将“NumericLessThan”条件设置为 3600，以拒绝角色假设。", "使用“aws:MultiFactorAuthPresent”，并将“Bool”条件设置为 true，并结合角色本身的 3600 秒会话持续时间限制。", "将 `aws:TokenIssueTime` 与 `DateGreaterThan` 条件结合使用，将角色假设限制为在过去一小时内颁发令牌的会话。", "使用将“NumericLessThan”条件设置为 3600 的“aws:SessionDuration”来限制最大会话长度，从而有效强制 MFA 重新验证。"], "explanation_zh": "`aws:MultiFactorAuthAge` 条件键评估自发生 MFA 身份验证以来的秒数。在角色信任策略中使用“NumericLessThan: 3600”会限制对过去一小时内验证了 MFA 的会话的访问。 `aws:MultiFactorAuthPresent` 仅检查是否使用了 MFA，而不检查何时使用。 `aws:TokenIssueTime` 检查何时颁发临时凭证，而不是何时完成 MFA。 `aws:SessionDuration` 不是信任策略的有效 IAM 条件键。"}, {"exam": 5, "id": 42, "question_en": "A company uses a central identity provider that authenticates developers and passes metadata such as team name and project code. When developers assume cross-account IAM roles, the target account's policies need to grant access based on these identity attributes rather than static role permissions.\n \nWhich STS feature enables this attribute-based access pattern?", "options_en": ["Configure IAM policy variables using `${aws:username}` to dynamically scope permissions based on the developer's username inherited from the identity provider.", "Pass session tags during the `sts:AssumeRole` call containing team name and project code, then reference `aws:PrincipalTag` in the target account policies.", "Create separate IAM roles in the target account for each team and project combination, with the identity provider mapping developers to the appropriate role ARN.", "Use IAM Roles Anywhere with X.509 certificate attributes to embed team and project metadata in the certificate subject, which IAM evaluates during role assumption."], "correct": 1, "explanation_en": "STS session tags allow identity attributes to be passed as key-value pairs during `AssumeRole`, `AssumeRoleWithSAML`, or `AssumeRoleWithWebIdentity` calls. Target account policies can then use `aws:PrincipalTag` conditions to make authorization decisions based on these dynamic attributes, enabling ABAC without creating per-team roles. Policy variables like `${aws:username}` do not carry IdP metadata. Multiple roles per team do not scale. IAM Roles Anywhere uses X.509 certificates, not session-level metadata passed by an IdP.", "question_zh": "公司使用中央身份提供商对开发人员进行身份验证并传递团队名称和项目代码等元数据。当开发人员承担跨账户 IAM 角色时，目标账户的策略需要根据这些身份属性而不是静态角色权限授予访问权限。\n \n哪个 STS 功能支持这种基于属性的访问模式？", "options_zh": ["使用“${aws:username}”配置 IAM 策略变量，以根据从身份提供商继承的开发人员用户名动态调整权限范围。", "在包含团队名称和项目代码的“sts:AssumeRole”调用期间传递会话标签，然后在目标账户策略中引用“aws:PrincipalTag”。", "在目标账户中为每个团队和项目组合创建单独的 IAM 角色，并使用身份提供商将开发人员映射到适当的角色 ARN。", "使用具有 X.509 证书属性的 IAM Roles Anywhere 将团队和项目元数据嵌入到证书主题中，IAM 在角色代入期间对其进行评估。"], "explanation_zh": "STS 会话标签允许在“AssumeRole”、“AssumeRoleWithSAML”或“AssumeRoleWithWebIdentity”调用期间将身份属性作为键值对传递。然后，目标账户策略可以使用“aws:PrincipalTag”条件根据这些动态属性做出授权决策，从而无需创建每个团队角色即可启用 ABAC。像“${aws:username}”这样的策略变量不携带 IdP 元数据。每个团队的多个角色无法扩展。 IAM Roles Anywhere 使用 X.509 证书，而不是 IdP 传递的会话级元数据。"}, {"exam": 5, "id": 43, "question_en": "A mobile gaming company uses their own authentication system that verifies player credentials against a custom database. After authentication, the game client needs temporary AWS credentials to upload replay files directly to S3. The company does not want to integrate with any external identity provider.\n \nWhich Cognito feature supports this custom authentication workflow?", "options_en": ["Configure a Cognito user pool with a pre-authentication Lambda trigger that validates credentials against the custom database and issues Cognito tokens on success.", "Create a Cognito user pool with a custom authentication flow using Define, Create, and Verify Auth Challenge Lambda triggers for the complete sign-in sequence.", "Use Cognito identity pools with developer authenticated identities, where the backend validates credentials and registers the authentication with Cognito to obtain AWS credentials.", "Enable Cognito identity pools with unauthenticated access and use IAM policy conditions to restrict S3 upload permissions based on a custom token passed in the request."], "correct": 2, "explanation_en": "Cognito identity pools support developer authenticated identities, which allow applications using their own authentication system to obtain temporary AWS credentials. The backend server authenticates the user against the custom database, calls `GetOpenIdTokenForDeveloperIdentity` to register the authentication with Cognito, and the mobile client exchanges the token for temporary AWS credentials. User pools require migration to the Cognito-managed user store. Custom authentication flows still use Cognito as the identity store. Unauthenticated access does not provide per-user identity.", "question_zh": "移动游戏公司使用自己的身份验证系统根据自定义数据库验证玩家凭据。身份验证后，游戏客户端需要临时 AWS 凭证才能将重播文件直接上传到 S3。该公司不想与任何外部身份提供商集成。\n \n哪些 Cognito 功能支持此自定义身份验证工作流程？", "options_zh": ["使用预身份验证 Lambda 触发器配置 Cognito 用户池，该触发器根据自定义数据库验证凭据并在成功时颁发 Cognito 令牌。", "使用定义、创建和验证身份验证质询 Lambda 触发器来创建具有自定义身份验证流程的 Cognito 用户池，以实现完整的登录序列。", "将 Cognito 身份池与经过开发人员身份验证的身份结合使用，其中后端验证凭证并向 Cognito 注册身份验证以获取 AWS 凭证。", "启用具有未经身份验证访问的 Cognito 身份池，并使用 IAM 策略条件根据请求中传递的自定义令牌来限制 S3 上传权限。"], "explanation_zh": "Cognito 身份池支持开发人员经过身份验证的身份，这允许应用程序使用自己的身份验证系统获取临时 AWS 凭证。后端服务器根据自定义数据库对用户进行身份验证，调用“GetOpenIdTokenForDeveloperIdentity”以向 Cognito 注册身份验证，然后移动客户端将令牌交换为临时 AWS 凭证。用户池需要迁移到 Cognito 管理的用户存储。自定义身份验证流程仍然使用 Cognito 作为身份存储。未经身份验证的访问不提供每个用户的身份。"}, {"exam": 5, "id": 44, "question_en": "A developer is attempting to attach an IAM role to an EC2 instance using the AWS CLI but receives an error indicating that a role cannot be directly attached to an instance. The developer can see the role in the IAM console and has verified the trust policy allows the EC2 service.\n \nWhat additional configuration is required?", "options_en": ["The developer must first create a service-linked role for EC2 that delegates the permissions from the original IAM role to the EC2 instance via trust policy chaining.", "The developer must create an instance profile and add the IAM role to it, because EC2 instances use instance profiles as the container for associating IAM roles.", "The developer must modify the IAM role's trust policy to include the specific EC2 instance ID as a principal, since roles cannot be broadly trusted by the entire EC2 service.", "The developer must create an IAM policy that grants `iam:PassRole` to the role and attach this permission to the instance itself before the role can be associated."], "correct": 1, "explanation_en": "EC2 instances do not reference IAM roles directly. Instead, they use instance profiles, which are containers that hold a reference to an IAM role. When creating a role through the AWS Console for EC2, an instance profile is created automatically, but when using the CLI or SDK, the instance profile must be created separately and the role added to it. Service-linked roles are managed by AWS services. Trust policies use the EC2 service principal, not instance IDs. `iam:PassRole` is a permission the developer needs on their own identity, not on the instance.", "question_zh": "开发人员尝试使用 AWS CLI 将 IAM 角色附加到 EC2 实例，但收到一条错误，指示角色无法直接附加到实例。开发人员可以在 IAM 控制台中看到该角色，并已验证信任策略允许 EC2 服务。\n \n需要什么额外配置？", "options_zh": ["开发人员必须首先为 EC2 创建一个服务相关角色，通过信任策略链将权限从原始 IAM 角色委托给 EC2 实例。", "由于EC2实例使用实例配置文件作为关联IAM角色的容器，因此开发人员必须创建实例配置文件并向其添加IAM角色。", "开发人员必须修改 IAM 角色的信任策略以将特定 EC2 实例 ID 作为委托人包含在内，因为角色无法被整个 EC2 服务广泛信任。", "开发人员必须创建一个 IAM 策略，将“iam:PassRole”授予该角色，并将此权限附加到实例本身，然后才能关联该角色。"], "explanation_zh": "EC2 实例不直接引用 IAM 角色。相反，他们使用实例配置文件，这些配置文件是保存 IAM 角色引用的容器。通过适用于 EC2 的 AWS 控制台创建角色时，会自动创建实例配置文件，但使用 CLI 或开发工具包时，必须单独创建实例配置文件并将角色添加到其中。服务相关角色由 AWS 服务管理。信任策略使用 EC2 服务主体，而不是实例 ID。 `iam:PassRole` 是开发人员需要对其自己的身份（而不是实例）授予的权限。"}, {"exam": 5, "id": 45, "question_en": "A company's compliance policy requires that all KMS customer managed keys used for encrypting production data are rotated every 90 days. The encryption keys are symmetric and were created natively in KMS without imported key material.\n \nHow should they configure key rotation to meet this requirement?", "options_en": ["Enable automatic key rotation on each KMS key, which rotates the key material every 365 days by default, and request an AWS support exception to reduce the period.", "Create a Lambda function triggered by EventBridge on a 90-day schedule that calls `CreateKey` followed by `UpdateAlias` to point the alias to the new key.", "Use KMS imported key material and schedule manual re-importation every 90 days, since automatic rotation does not support custom rotation periods for any key type.", "Enable automatic key rotation on each KMS key and set the rotation period to 90 days, which is supported for customer managed symmetric encryption keys created in KMS."], "correct": 3, "explanation_en": "KMS supports configurable automatic key rotation periods for customer managed symmetric keys, ranging from 90 to 2560 days. When enabled, KMS automatically generates new cryptographic material on the specified schedule while retaining previous versions for decryption. The default period is 365 days but can be customized. AWS support exceptions are not needed for this. Manual Lambda-based rotation is unnecessarily complex when native rotation is available. Imported key material does not support automatic rotation.", "question_zh": "公司的合规性策略要求用于加密生产数据的所有 KMS 客户管理密钥每 90 天轮换一次。加密密钥是对称的，并且是在 KMS 中本地创建的，无需导入密钥材料。\n \n他们应该如何配置密钥轮换才能满足此要求？", "options_zh": ["对每个 KMS 密钥启用自动密钥轮换，默认情况下每 365 天轮换一次密钥材料，并请求 AWS 支持例外以缩短周期。", "创建一个由 EventBridge 按 90 天的计划触发的 Lambda 函数，该函数调用“CreateKey”，然后调用“UpdateAlias”，将别名指向新密钥。", "使用 KMS 导入的密钥材料并安排每 90 天手动重新导入一次，因为自动轮换不支持任何密钥类型的自定义轮换周期。", "对每个 KMS 密钥启用自动密钥轮换，并将轮换周期设置为 90 天，在 KMS 中创建的客户管理的对称加密密钥支持此设置。"], "explanation_zh": "KMS 支持客户管理的对称密钥的可配置自动密钥轮换周期，范围为 90 到 2560 天。启用后，KMS 会按照指定的时间表自动生成新的加密材料，同时保留以前的版本进行解密。默认期限为 365 天，但可以自定义。为此不需要 AWS 支持例外。当本机旋转可用时，基于 Lambda 的手动旋转不必要地复杂。导入的密钥材料不支持自动轮换。"}, {"exam": 5, "id": 46, "question_en": "A company stores their Amazon RDS PostgreSQL database credentials in AWS Secrets Manager. They need to configure automatic rotation so that the database password is changed every 30 days without application downtime, using the single-user rotation strategy.\n \nWhat infrastructure does Secrets Manager require for automatic rotation?", "options_en": ["A Lambda rotation function deployed in a VPC with network connectivity to the RDS instance, which Secrets Manager invokes to update the secret and database password.", "An IAM role with permissions to connect to the RDS instance and execute ALTER USER SQL commands, which Secrets Manager assumes during the rotation process.", "An SSM Automation document that defines the rotation steps including connecting to the database, changing the password, and updating the secret value in Secrets Manager.", "A Step Functions state machine that orchestrates the multi-step rotation process including generating a new password, updating RDS, and verifying the new credentials."], "correct": 0, "explanation_en": "Secrets Manager automatic rotation uses a Lambda function that handles the four-step rotation process: createSecret, setSecret, testSecret, and finishSecret. For RDS databases, the Lambda function must be deployed in a VPC with network access to the database instance or use a VPC endpoint for Secrets Manager. Secrets Manager provides managed Lambda function templates for common databases. Rotation does not use IAM for direct database connections, SSM Automation documents, or Step Functions state machines.", "question_zh": "一家公司将其 Amazon RDS PostgreSQL 数据库凭证存储在 AWS Secrets Manager 中。他们需要配置自动轮换，以便使用单用户轮换策略每 30 天更改一次数据库密码，而不会导致应用程序停机。\n \nSecrets Manager 需要什么基础设施才能自动轮换？", "options_zh": ["部署在具有与 RDS 实例的网络连接的 VPC 中的 Lambda 轮换函数，Secrets Manager 调用该函数来更新密钥和数据库密码。", "一个 IAM 角色，有权连接到 RDS 实例并执行 ALTER USER SQL 命令，这是 Secrets Manager 在轮换过程中假定的。", "定义轮换步骤的 SSM 自动化文档，包括连接到数据库、更改密码以及更新 Secrets Manager 中的密钥值。", "Step Functions 状态机，用于协调多步骤轮换过程，包括生成新密码、更新 RDS 和验证新凭据。"], "explanation_zh": "Secrets Manager 自动轮换使用 Lambda 函数来处理四步轮换过程：createSecret、setSecret、testSecret 和 finishSecret。对于 RDS 数据库，Lambda 函数必须部署在可通过网络访问数据库实例的 VPC 中，或者使用 Secrets Manager 的 VPC 终端节点。 Secrets Manager 为常见数据库提供托管 Lambda 函数模板。轮换不使用 IAM 进行直接数据库连接、SSM 自动化文档或 Step Functions 状态机。"}, {"exam": 5, "id": 47, "question_en": "A company runs an AWS CloudHSM cluster with three HSM instances across three Availability Zones. After creating a new encryption key on one HSM, a developer reports that the key is not immediately available when connecting to another HSM in the same cluster.\n \nWhat explains this behavior and how is it resolved?", "options_en": ["CloudHSM does not replicate keys between HSMs automatically, so the developer must manually export the key from one HSM and import it into each additional HSM.", "CloudHSM requires a manual synchronization command to be executed after key creation, which triggers replication of the key material to all other HSMs in the cluster.", "CloudHSM synchronizes keys across HSMs in the cluster automatically, but there is a brief propagation delay during which the key may not be available on all HSMs.", "CloudHSM stores keys only on the HSM where they were created for security isolation, and the developer must use that specific HSM endpoint for all subsequent operations."], "correct": 2, "explanation_en": "CloudHSM automatically synchronizes keys across all HSM instances in a cluster. When a key is created on one HSM, it is replicated to all other HSMs, but there is a brief propagation delay during which the key may not yet be available on other nodes. Applications should handle this by retrying or ensuring they connect to the same HSM for immediate operations after key creation. Keys are not isolated to a single HSM, and manual export or synchronization commands are not required.", "question_zh": "一家公司运行一个 AWS CloudHSM 集群，其中包含跨三个可用区的三个 HSM 实例。在一个 HSM 上创建新的加密密钥后，开发人员报告称，当连接到同一集群中的另一个 HSM 时，该密钥无法立即可用。\n \n如何解释此行为以及如何解决？", "options_zh": ["CloudHSM 不会自动在 HSM 之间复制密钥，因此开发人员必须手动从一个 HSM 导出密钥并将其导入到每个附加 HSM 中。", "CloudHSM 需要在创建密钥后执行手动同步命令，这会触发将密钥材料复制到集群中的所有其他 HSM。", "CloudHSM 会自动在集群中的 HSM 之间同步密钥，但存在短暂的传播延迟，在此期间密钥可能无法在所有 HSM 上可用。", "CloudHSM 仅将密钥存储在创建密钥的 HSM 上以实现安全隔离，并且开发人员必须使用该特定 HSM 端点来执行所有后续操作。"], "explanation_zh": "CloudHSM 自动同步集群中所有 HSM 实例的密钥。在一个 HSM 上创建密钥后，它会被复制到所有其他 HSM，但会存在短暂的传播延迟，在此期间密钥可能在其他节点上不可用。应用程序应通过重试或确保它们连接到相同的 HSM 以便在创建密钥后立即进行操作来处理此问题。密钥不隔离到单个 HSM，并且不需要手动导出或同步命令。"}, {"exam": 5, "id": 48, "question_en": "A company is implementing a private PKI using AWS Private Certificate Authority. They need a two-tier CA hierarchy where the root CA is used only for issuing subordinate CA certificates, and the subordinate CA handles all end-entity certificate issuance for internal services.\n \nWhat is the correct configuration for this hierarchy?", "options_en": ["Create a single Private CA configured as a root CA that directly issues both subordinate CA certificates and end-entity certificates for all internal services and applications.", "Create a root CA in Private CA with a long validity period, then create a subordinate CA signed by the root, and use the subordinate CA exclusively for issuing end-entity certificates.", "Create two root CAs in different Regions for redundancy, each independently issuing end-entity certificates, with cross-signing between the roots for trust chain validation.", "Create a subordinate CA in Private CA and have it signed by an external public CA such as DigiCert, eliminating the need to manage a private root CA within the environment."], "correct": 1, "explanation_en": "A two-tier PKI hierarchy in AWS Private CA consists of a root CA with a long validity period that issues only subordinate CA certificates, and a subordinate CA that handles all end-entity certificate issuance. This separation allows the root CA to remain minimally used, reducing its exposure. A single CA issuing both types lacks hierarchy separation. Multiple root CAs with cross-signing adds unnecessary complexity. A subordinate signed by an external public CA is not a standard private PKI design.", "question_zh": "一家公司正在使用 AWS 私有证书颁发机构实施私有 PKI。他们需要一个两层 CA 层次结构，其中根 CA 仅用于颁发从属 CA 证书，从属 CA 处理内部服务的所有最终实体证书颁发。\n \n该层次结构的正确配置是什么？", "options_zh": ["创建配置为根 CA 的单个私有 CA，该根 CA 直接为所有内部服务和应用程序颁发从属 CA 证书和最终实体证书。", "在 Private CA 中创建一个有效期较长的根 CA，然后创建由根签名的从属 CA，并专门使用从属 CA 来颁发终端实体证书。", "在不同区域创建两个根 CA 以实现冗余，每个根 CA 独立颁发最终实体证书，并在根之间进行交叉签名以进行信任链验证。", "在私有 CA 中创建从属 CA，并由外部公共 CA（例如 DigiCert）对其进行签名，从而无需在环境中管理私有根 CA。"], "explanation_zh": "AWS Private CA 中的两层 PKI 层次结构由一个具有较长有效期且仅颁发从属 CA 证书的根 CA 和一个处理所有最终实体证书颁发的从属 CA 组成。这种分离允许根 CA 保持最低限度的使用，从而减少其暴露。颁发这两种类型的单个 CA 缺乏层次结构分离。具有交叉签名的多个根 CA 增加了不必要的复杂性。由外部公共 CA 签署的从属不是标准的私有 PKI 设计。"}, {"exam": 5, "id": 49, "question_en": "A company stores sensitive healthcare records in Amazon DynamoDB. They need end-to-end encryption where data is encrypted before it leaves the application, ensuring that even DynamoDB service operators cannot read the plaintext data. Decryption should only be possible by authorized application components.\n \nWhich approach provides this level of protection?", "options_en": ["Enable DynamoDB encryption at rest with an AWS managed KMS key, which encrypts all data transparently and prevents any DynamoDB operators from accessing plaintext.", "Configure DynamoDB encryption at rest using a customer managed KMS key with a restrictive key policy that grants decrypt access only to the application IAM role.", "Use Amazon DynamoDB Accelerator (DAX) with in-transit encryption enabled to encrypt data between the application and the DAX cluster before it reaches DynamoDB.", "Implement the AWS Database Encryption SDK to encrypt sensitive attributes client-side before writing to DynamoDB, so only holders of the encryption key can decrypt."], "correct": 3, "explanation_en": "The AWS Database Encryption SDK (formerly DynamoDB Encryption Client) provides client-side encryption that encrypts data before it is sent to DynamoDB. This ensures end-to-end protection where DynamoDB never sees plaintext data. Server-side encryption at rest protects data on disk but DynamoDB still processes plaintext during read and write operations. Customer managed KMS keys control access but do not prevent service-level access to data in transit. DAX provides caching acceleration, not client-side encryption.", "question_zh": "一家公司将敏感的医疗记录存储在 Amazon DynamoDB 中。他们需要端到端加密，即数据在离开应用程序之前进行加密，确保即使是 DynamoDB 服务运营商也无法读取明文数据。解密只能由授权的应用程序组件进行。\n \n哪种方法可以提供这种级别的保护？", "options_zh": ["使用 AWS 托管的 KMS 密钥启用静态 DynamoDB 加密，这会透明地加密所有数据并防止任何 DynamoDB 操作员访问明文。", "使用客户管理的 KMS 密钥以及仅向应用程序 IAM 角色授予解密访问权限的限制性密钥策略来配置静态 DynamoDB 加密。", "使用启用了传输中加密的 Amazon DynamoDB Accelerator (DAX)，在应用程序和 DAX 集群之间的数据到达 DynamoDB 之前对其进行加密。", "实施 AWS 数据库加密 SDK 以在写入 DynamoDB 之前对客户端的敏感属性进行加密，因此只有加密密钥的持有者才能解密。"], "explanation_zh": "AWS 数据库加密 SDK（以前称为 DynamoDB 加密客户端）提供客户端加密，可在将数据发送到 DynamoDB 之前对数据进行加密。这可确保 DynamoDB 永远不会看到纯文本数据的端到端保护。服务器端静态加密可保护磁盘上的数据，但 DynamoDB 仍在读取和写入操作期间处理纯文本。客户管理的 KMS 密钥控制访问，但不会阻止对传输中数据的服务级别访问。 DAX 提供缓存加速，而不是客户端加密。"}, {"exam": 5, "id": 50, "question_en": "A SaaS company needs to expose their service running on a Network Load Balancer to customers in other AWS accounts without requiring VPC peering, VPN, or internet connectivity. Customers should connect using private IP addresses within their own VPCs.\n \nWhich AWS feature enables this architecture?", "options_en": ["Create a VPC endpoint service backed by the NLB, then customers create interface VPC endpoints in their accounts to access the service over AWS PrivateLink.", "Share the NLB using AWS Resource Access Manager with the customer accounts, allowing them to reference the shared NLB directly from their VPC resources.", "Deploy a Transit Gateway and share it with customer accounts, then configure routing so that customer VPCs can reach the NLB through the Transit Gateway attachment.", "Configure a Global Accelerator endpoint pointing to the NLB and provide customers with the accelerator's static anycast IP addresses for private connectivity."], "correct": 0, "explanation_en": "AWS PrivateLink allows service providers to create VPC endpoint services backed by a Network Load Balancer. Customers in other accounts create interface VPC endpoints in their VPCs, which provision elastic network interfaces with private IP addresses. Traffic flows over the AWS backbone without requiring peering, VPN, or internet access. RAM cannot share NLBs directly. Transit Gateway requires more complex networking setup. Global Accelerator provides public anycast IPs, not private connectivity.", "question_zh": "SaaS 公司需要向其他 AWS 账户中的客户公开其在网络负载均衡器上运行的服务，而无需 VPC 对等、VPN 或互联网连接。客户应使用自己的 VPC 内的私有 IP 地址进行连接。\n \n哪些 AWS 功能支持此架构？", "options_zh": ["创建由 NLB 支持的 VPC 终端节点服务，然后客户在其账户中创建接口 VPC 终端节点以通过 AWS PrivateLink 访问该服务。", "使用 AWS Resource Access Manager 与客户账户共享 NLB，使他们能够直接从其 VPC 资源引用共享的 NLB。", "部署 Transit Gateway 并与客户账户共享，然后配置路由，以便客户 VPC 可以通过 Transit Gateway 附件到达 NLB。", "配置指向 NLB 的 Global Accelerator 端点，并向客户提供加速器的静态任播 IP 地址以实现专用连接。"], "explanation_zh": "AWS PrivateLink 允许服务提供商创建由网络负载均衡器支持的 VPC 终端节点服务。其他账户中的客户在其 VPC 中创建接口 VPC 终端节点，这些终端节点提供具有私有 IP 地址的弹性网络接口。流量通过 AWS 主干网流动，无需对等互连、VPN 或互联网访问。 RAM 不能直接共享 NLB。 Transit Gateway 需要更复杂的网络设置。 Global Accelerator 提供公共任播 IP，而不是专用连接。"}, {"exam": 5, "id": 51, "question_en": "A financial services company needs to protect their AWS Backup recovery points from deletion by any user, including administrators and the root account. Once locked, the backup retention policy must be immutable for regulatory compliance purposes.\n \nWhich AWS Backup feature provides this protection?", "options_en": ["Create an SCP in AWS Organizations that denies `backup:DeleteRecoveryPoint` for all principals including the root user across all accounts in the organization.", "Enable AWS Backup vault lock in compliance mode on the backup vault, which makes the retention policy immutable and prevents recovery point deletion by any principal.", "Configure the backup vault access policy to deny delete operations and protect the policy itself from modification using an IAM condition that requires MFA for changes.", "Use AWS Backup cross-account backup with the recovery points stored in a separate security account where only the backup administrator has any permissions to manage."], "correct": 1, "explanation_en": "AWS Backup vault lock in compliance mode makes the vault's retention policy immutable and prevents any principal, including root and administrators, from deleting recovery points before their retention period expires. Once compliance mode is enabled, the vault lock cannot be removed. SCPs do not apply to the root user. Vault access policies can be modified by administrators. Cross-account backups provide isolation but do not guarantee immutability.", "question_zh": "金融服务公司需要保护其 AWS Backup 恢复点不被任何用户（包括管理员和根账户）删除。一旦锁定，备份保留策略必须是不可变的，以符合法规要求。\n \n哪种 AWS Backup 功能提供这种保护？", "options_zh": ["在 AWS Organizations 中创建一个 SCP，拒绝所有委托人（包括组织中所有账户的根用户）的“backup:DeleteRecoveryPoint”。", "在备份文件库上以合规模式启用 AWS Backup 文件库锁定，这使得保留策略不可变并防止任何委托人删除恢复点。", "配置备份文件库访问策略以拒绝删除操作，并使用需要 MFA 进行更改的 IAM 条件来保护策略本身免遭修改。", "使用 AWS Backup 跨账户备份，并将恢复点存储在单独的安全账户中，只有备份管理员有权管理该账户。"], "explanation_zh": "合规模式下的 AWS Backup 文件库锁定使文件库的保留策略不可变，并防止任何委托人（包括根用户和管理员）在保留期到期之前删除恢复点。一旦启用合规模式，保管库锁就无法删除。 SCP 不适用于 root 用户。管理员可以修改保管库访问策略。跨账户备份提供隔离，但不保证不变性。"}, {"exam": 5, "id": 52, "question_en": "A company needs to digitally sign software artifacts before distributing them to customers. The signing process must use an RSA key pair where the private key never leaves a FIPS 140-2 validated HSM, and customers verify signatures using the corresponding public key.\n \nWhich KMS key configuration supports this use case?", "options_en": ["Create a symmetric KMS key and use the `GenerateMac` API to produce an HMAC signature for each artifact, distributing the same symmetric key to customers for verification.", "Create an asymmetric KMS key with RSA key spec and ENCRYPT_DECRYPT usage, then use the `Encrypt` API with the private key to produce signatures for each artifact.", "Create an asymmetric KMS key with RSA key spec and SIGN_VERIFY usage, use the `Sign` API to sign artifacts, and distribute the public key for customer verification.", "Import an RSA private key into KMS as an asymmetric key and use the `GenerateDataKeyPair` API to derive signing keys for each artifact individually."], "correct": 2, "explanation_en": "KMS asymmetric keys with SIGN_VERIFY key usage are designed for digital signing. The private key remains within the KMS HSMs (FIPS 140-2 validated) and is used via the `Sign` API. The public key can be downloaded and distributed to customers for offline signature verification. HMAC produces message authentication codes, not public-key digital signatures. ENCRYPT_DECRYPT usage keys cannot be used for signing operations. `GenerateDataKeyPair` generates data key pairs outside HSM protection, which does not meet the requirement.", "question_zh": "公司需要在将软件工件分发给客户之前对其进行数字签名。签名过程必须使用 RSA 密钥对，其中私钥永远不会离开经过 FIPS 140-2 验证的 HSM，并且客户使用相应的公钥验证签名。\n \n哪种 KMS 密钥配置支持此用例？", "options_zh": ["创建对称 KMS 密钥并使用“GenerateMac” API 为每个工件生成 HMAC 签名，并将相同的对称密钥分发给客户进行验证。", "使用 RSA 密钥规范和 ENCRYPT_DECRYPT 用法创建非对称 KMS 密钥，然后使用带有私钥的“Encrypt” API 为每个工件生成签名。", "使用 RSA 密钥规范和 SIGN_VERIFY 用法创建非对称 KMS 密钥，使用“Sign” API 签署工件，并分发公钥以供客户验证。", "将 RSA 私钥作为非对称密钥导入到 KMS 中，并使用“GenerateDataKeyPair” API 分别为每个工件派生签名密钥。"], "explanation_zh": "具有 SIGN_VERIFY 密钥用法的 KMS 非对称密钥专为数字签名而设计。私钥保留在 KMS HSM 中（经过 FIPS 140-2 验证），并通过“Sign” API 使用。公钥可以下载并分发给客户进行离线签名验证。 HMAC 生成消息验证代码，而不是公钥数字签名。 ENCRYPT_DECRYPT 使用密钥不能用于签名操作。 `GenerateDataKeyPair`生成HSM保护之外的数据密钥对，不符合要求。"}, {"exam": 5, "id": 53, "question_en": "A high-throughput application encrypts millions of small messages per minute using the AWS Encryption SDK with KMS. The application's KMS API call rate is approaching the per-second request quota, causing occasional `ThrottlingException` errors that impact message processing latency.\n \nHow should they reduce KMS API calls while maintaining security?", "options_en": ["Request a KMS API quota increase through AWS Service Quotas to accommodate the high call volume and add exponential backoff retry logic for remaining throttled requests.", "Replace KMS with CloudHSM for encryption operations, which provides dedicated HSM capacity without shared API rate limits and supports higher throughput per device.", "Switch to S3 server-side encryption with S3-managed keys (SSE-S3) which eliminates KMS API calls entirely by using Amazon-managed encryption keys for all operations.", "Enable data key caching in the AWS Encryption SDK, which reuses data keys for multiple encryption operations within configurable limits, reducing KMS API calls significantly."], "correct": 3, "explanation_en": "The AWS Encryption SDK supports data key caching, which allows the application to reuse generated data keys for multiple encryption operations within configurable limits for maximum age, maximum bytes, and maximum messages. This dramatically reduces KMS `GenerateDataKey` calls while maintaining envelope encryption security. Increasing quotas is a short-term fix that does not scale indefinitely. CloudHSM requires significant architectural changes. SSE-S3 only applies to S3 storage, not application-level message encryption.", "question_zh": "高吞吐量应用程序使用 AWS 加密开发工具包和 KMS 每分钟加密数百万条小消息。应用程序的 KMS API 调用率接近每秒请求配额，导致偶尔出现影响消息处理延迟的“ThrotdlingException”错误。\n \n他们应该如何在保持安全性的同时减少 KMS API 调用？", "options_zh": ["通过 AWS Service Quotas 请求增加 KMS API 配额，以适应高调用量，并为剩余受限制的请求添加指数退避重试逻辑。", "将 KMS 替换为 CloudHSM 进行加密操作，CloudHSM 提供专用 HSM 容量，没有共享 API 速率限制，并支持每台设备更高的吞吐量。", "切换到使用 S3 托管密钥 (SSE-S3) 的 S3 服务器端加密，通过对所有操作使用 Amazon 托管加密密钥来完全消除 KMS API 调用。", "在 AWS 加密 SDK 中启用数据密钥缓存，该缓存可在可配置的限制内重复使用数据密钥进行多个加密操作，从而显着减少 KMS API 调用。"], "explanation_zh": "AWS 加密开发工具包支持数据密钥缓存，这允许应用程序在可配置的最大期限、最大字节数和最大消息数限制内重复使用生成的数据密钥进行多
