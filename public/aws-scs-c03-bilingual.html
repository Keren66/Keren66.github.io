bucket。", "一个带有 \"Condition\": {\"StringNotEquals\": {\"aws:SourceIp\": \"vpc-cidr\"}} 的 Deny 声明。", "一个带有 \"Condition\": {\"StringNotEquals\": {\"aws:sourceVpce\": \"vpce-1a2b3c4d\"}} 的 Deny 声明，应用于所有主体和所有 S3 操作。"], "explanation_zh": "要强制执行所有访问必须通过特定 VPC 端点，您需要一个带有 aws:sourceVpce 的 StringNotEquals 条件的 Deny 声明。这会拒绝任何不源自指定 VPC 端点的请求，无论调用者的 IAM 权限如何（因为显式 Deny 始终覆盖 Allow）。带有 aws:sourceVpce 的 Allow 声明仅允许 VPC 端点流量，但不会拒绝其他访问路径。VPC 端点策略限制端点可以访问的内容，但不限制存储桶通过其他路径被访问。"}, {"exam": 2, "id": 34, "question_en": "An organization has the following OU structure: Root -> Production OU -> Workloads OU. An SCP attached to the Production OU denies the `ec2:RunInstances` action for instance types larger than `m5.xlarge`. A separate SCP attached to the Workloads OU allows `ec2:RunInstances` for all instance types.\n \nCan a user in an account under the Workloads OU launch an `m5.4xlarge` instance?", "options_en": ["Yes, because the Allow SCP on Workloads OU overrides the Deny SCP on the parent Production OU.", "No, because the explicit Deny in the Production OU SCP cannot be overridden by any Allow statement at a lower level.", "Yes, because SCPs are evaluated only at the OU level directly attached to the account.", "No, because SCPs use an implicit deny model and the user needs an explicit Allow at every level of the OU hierarchy."], "correct": 1, "explanation_en": "SCPs follow the same evaluation logic as IAM policies: an explicit Deny always takes precedence over any Allow, regardless of where it is in the hierarchy. The Deny SCP on the Production OU explicitly denies launching large instance types, and this cannot be overridden by an Allow SCP at the Workloads OU or account level. SCPs are evaluated at every level of the hierarchy, and the effective permissions are the intersection of all applicable SCPs. An explicit Deny at any level in the chain blocks the action.", "question_zh": "一个组织具有以下 OU 结构：Root -> Production OU -> Workloads OU。附加到 Production OU 的 SCP 拒绝大于 m5.xlarge 的实例类型的 ec2:RunInstances 操作。附加到 Workloads OU 的单独 SCP 允许所有实例类型的 ec2:RunInstances。Workloads OU 下账户中的用户可以启动 m5.4xlarge 实例吗？", "options_zh": ["是，因为 Workloads OU 上的 Allow SCP 覆盖了父级 Production OU 上的 Deny SCP。", "否，因为 Production OU SCP 中的显式 Deny 不能被较低级别的任何 Allow 声明覆盖。", "是，因为 SCP 仅在直接附加到账户的 OU 级别评估。", "否，因为 SCP 使用隐式拒绝模型，用户需要在 OU 层次结构的每个级别都有显式 Allow。"], "explanation_zh": "SCP 遵循与 IAM 策略相同的评估逻辑：显式 Deny 始终优先于任何 Allow，无论其在层次结构中的位置。Production OU 上的 Deny SCP 显式拒绝启动大型实例类型，这不能被 Workloads OU 或账户级别的 Allow SCP 覆盖。SCP 在层次结构的每个级别都会被评估，有效权限是所有适用 SCP 的交集。链中任何级别的显式 Deny 都会阻止该操作。"}, {"exam": 2, "id": 35, "question_en": "A company uses IAM Identity Center (AWS SSO) with an external IdP (Okta). They need to grant developers temporary access to production accounts for troubleshooting, limited to 1 hour per session, with read-only permissions to EC2, RDS, and CloudWatch.\n \nHow should they configure this?", "options_en": ["Create an IAM role in each production account with a 1-hour maximum session duration and manually share the role ARN with developers.", "Configure Okta to issue SAML assertions with 1-hour session timeout and let developers assume roles directly via SAML federation.", "Create a permission set with a custom policy allowing read-only access to EC2, RDS, and CloudWatch, set the session duration to 1 hour, and assign it to the Developers group for the production accounts.", "Create a temporary IAM user in each production account with programmatic access keys that expire after 1 hour."], "correct": 2, "explanation_en": "IAM Identity Center permission sets define the level of access that users and groups have in assigned AWS accounts. A permission set can include AWS managed policies, customer managed policies, or inline policies. The session duration can be configured between 1 and 12 hours (default is 1 hour). By assigning the permission set to the Developers group for the production accounts, developers can access production through the IAM Identity Center portal and receive temporary credentials that expire after the configured session duration.", "question_zh": "一家公司使用 IAM Identity Center（AWS SSO）与外部 IdP（Okta）。他们需要授予开发人员对生产账户的临时访问权限以进行故障排除，每次会话限制为 1 小时，具有对 EC2、RDS 和 CloudWatch 的只读权限。应如何配置？", "options_zh": ["在每个生产账户中创建一个具有 1 小时最大会话持续时间的 IAM 角色，并手动与开发人员共享角色 ARN。", "配置 Okta 签发具有 1 小时会话超时的 SAML 断言，让开发人员直接通过 SAML 联合代入角色。", "创建一个权限集，其中包含允许对 EC2、RDS 和 CloudWatch 只读访问的自定义策略，将会话持续时间设为 1 小时，并将其分配给 Developers 组用于生产账户。", "在每个生产账户中创建具有 1 小时后过期的编程访问密钥的临时 IAM 用户。"], "explanation_zh": "IAM Identity Center 权限集定义了用户和组在分配的 AWS 账户中拥有的访问级别。权限集可以包含 AWS 托管策略、客户托管策略或内联策略。会话持续时间可以在 1 到 12 小时之间配置（默认为 1 小时）。通过将权限集分配给 Developers 组用于生产账户，开发人员可以通过 IAM Identity Center 门户访问生产环境，并收到在配置的会话持续时间后过期的临时凭证。"}, {"exam": 2, "id": 36, "question_en": "A mobile application uses Amazon Cognito User Pools for authentication. The security team has noticed a pattern of account takeover attempts where attackers use credentials obtained from data breaches on other sites.\n \nWhich Cognito feature BEST addresses this threat?", "options_en": ["Enable Cognito Advanced Security Features, which include compromised credentials detection that automatically blocks sign-in attempts using credentials known to be leaked in public breaches.", "Enable Cognito User Pool MFA with TOTP for all users.", "Configure a Pre-Authentication Lambda trigger that checks the user's IP address against a threat intelligence feed.", "Implement Cognito User Pool device tracking to detect sign-ins from new devices."], "correct": 0, "explanation_en": "Cognito Advanced Security Features include compromised credentials detection, which checks user credentials at sign-up, sign-in, and password change against a database of credentials known to be leaked in public data breaches. When a match is found, Cognito can block the sign-in attempt or notify the user. This directly addresses credential stuffing attacks using breached credentials. While MFA adds security, it does not specifically detect compromised passwords. Device tracking detects new devices but does not identify breached credentials.", "question_zh": "一个移动应用程序使用 Amazon Cognito User Pools 进行认证。安全团队注意到一种账户接管攻击模式，攻击者使用从其他网站数据泄露中获取的凭证。哪个 Cognito 功能最能应对此威胁？", "options_zh": ["启用 Cognito Advanced Security Features，其中包括泄露凭证检测，自动阻止使用已知在公开泄露中的凭证的登录尝试。", "为所有用户启用 Cognito User Pool MFA 与 TOTP。", "配置 Pre-Authentication Lambda 触发器，根据威胁情报源检查用户的 IP 地址。", "实施 Cognito User Pool 设备跟踪以检测来自新设备的登录。"], "explanation_zh": "Cognito Advanced Security Features 包括泄露凭证检测，在注册、登录和密码更改时对照已知在公开数据泄露中泄露的凭证数据库检查用户凭证。当发现匹配时，Cognito 可以阻止登录尝试或通知用户。这直接应对了使用泄露凭证的撞库攻击。MFA 虽然增加了安全性，但不专门检测泄露的密码。设备跟踪检测新设备但不识别泄露的凭证。"}, {"exam": 2, "id": 37, "question_en": "A SaaS vendor asks your company to create a cross-account IAM role that the vendor's application can assume to access resources in your AWS account. The vendor provides their AWS account ID and a unique customer identifier.\n \nWhat is the purpose of including an `ExternalId` condition in the role's trust policy?", "options_en": ["To encrypt the communication between the vendor's account and your account using a shared secret.", "To restrict the role assumption to specific IP addresses belonging to the vendor.", "To limit the duration of the temporary credentials issued when the role is assumed.", "To prevent the confused deputy problem by ensuring that only requests with the correct, customer-specific `ExternalId` value can assume the role, even if a malicious third party knows the role ARN."], "correct": 3, "explanation_en": "The `ExternalId` is a condition in the trust policy that mitigates the confused deputy problem. Without it, if a malicious third party learns the role ARN (which is not a secret), they could potentially trick the vendor's service into assuming your role on their behalf. By requiring a unique `ExternalId` value that only you and the vendor know, the trust policy ensures that only legitimate requests from the vendor's service on your behalf can assume the role. The `ExternalId` is not for encryption; it is a verification token.", "question_zh": "一家 SaaS 供应商要求您的公司创建一个跨账户 IAM 角色，供应商的应用程序可以代入该角色以访问您 AWS 账户中的资源。供应商提供了他们的 AWS 账户 ID 和唯一的客户标识符。在角色的信任策略中包含 ExternalId 条件的目的是什么？", "options_zh": ["使用共享密钥加密供应商账户与您的账户之间的通信。", "将角色代入限制为属于供应商的特定 IP 地址。", "限制代入角色时颁发的临时凭证的持续时间。", "防止混淆代理人问题，确保只有具有正确的、客户特定的 ExternalId 值的请求才能代入角色，即使恶意第三方知道了角色 ARN。"], "explanation_zh": "ExternalId 是信任策略中的一个条件，用于缓解混淆代理人问题。如果没有它，如果恶意第三方得知角色 ARN（这不是秘密），他们可能诱骗供应商的服务代表他们代入您的角色。通过要求只有您和供应商知道的唯一 ExternalId 值，信任策略确保只有来自供应商服务代表您的合法请求才能代入角色。ExternalId 不是用于加密；它是一个验证令牌。"}, {"exam": 2, "id": 38, "question_en": "A company is building a multi-tenant SaaS application and needs fine-grained authorization that evaluates permissions based on the requesting user's attributes, the resource's attributes, and the action being performed. Authorization decisions must be centralized and decoupled from application code.\n \nWhich AWS service should they use?", "options_en": ["Amazon Cognito User Pools with custom scopes and resource servers.", "AWS Verified Permissions, which uses Cedar policy language to define fine-grained authorization policies and provides a centralized authorization API.", "IAM policies with ABAC (attribute-based access control) using principal and resource tags.", "Amazon API Gateway with Lambda authorizers that implement custom authorization logic."], "correct": 1, "explanation_en": "AWS Verified Permissions provides a centralized, fine-grained authorization service that uses the Cedar policy language. Cedar policies can express complex authorization rules based on principal attributes (user role, department), resource attributes (owner, sensitivity level), and action types, making it ideal for multi-tenant SaaS applications. The service provides an API that applications call to make authorization decisions, decoupling authorization logic from application code. IAM policies and ABAC are for AWS resource-level access, not application-level authorization.", "question_zh": "一家公司正在构建多租户 SaaS 应用程序，需要基于请求用户属性、资源属性和所执行操作的细粒度授权。授权决策必须集中化并与应用程序代码解耦。应使用哪个 AWS 服务？", "options_zh": ["Amazon Cognito User Pools 配合自定义范围和资源服务器。", "AWS Verified Permissions，使用 Cedar 策略语言定义细粒度授权策略，并提供集中式授权 API。", "使用主体和资源标签的 IAM 策略与 ABAC（基于属性的访问控制）。", "Amazon API Gateway 配合实现自定义授权逻辑的 Lambda 授权器。"], "explanation_zh": "AWS Verified Permissions 提供一个集中式、细粒度的授权服务，使用 Cedar 策略语言。Cedar 策略可以基于主体属性（用户角色、部门）、资源属性（所有者、敏感级别）和操作类型表达复杂的授权规则，非常适合多租户 SaaS 应用程序。该服务提供一个 API，应用程序调用该 API 来做出授权决策，将授权逻辑与应用程序代码解耦。IAM 策略和 ABAC 用于 AWS 资源级访问，而非应用程序级授权。"}, {"exam": 2, "id": 39, "question_en": "A company has on-premises servers that need to access AWS services (S3 and DynamoDB) using temporary credentials. The servers already have X.509 certificates issued by their private Certificate Authority (CA). The company does not want to store long-term AWS access keys on the servers.\n \nWhich solution should they use?", "options_en": ["Configure AWS Site-to-Site VPN and use instance profile credentials through a VPC extension.", "Install the AWS SSM agent on the on-premises servers and use the SSM service role for AWS API access.", "Register their private CA as a trust anchor in IAM Roles Anywhere and configure profiles that map to IAM roles, allowing servers to exchange X.509 certificates for temporary AWS credentials.", "Create an OIDC provider in IAM and configure the servers to use OIDC tokens for role assumption."], "correct": 2, "explanation_en": "IAM Roles Anywhere enables workloads outside of AWS (such as on-premises servers) to use X.509 certificates to obtain temporary AWS credentials. You register your CA as a trust anchor and create profiles that map certificate attributes to IAM roles. When a server presents a valid certificate signed by the trusted CA, IAM Roles Anywhere issues temporary STS credentials. This eliminates the need for long-term access keys on on-premises servers. SSM agent requires hybrid activation and is not designed for general-purpose AWS API access.", "question_zh": "一家公司有本地服务器需要使用临时凭证访问 AWS 服务（S3 和 DynamoDB）。这些服务器已经拥有由其私有证书颁发机构 (CA) 签发的 X.509 证书。公司不想在服务器上存储长期 AWS 访问密钥。应使用哪个解决方案？", "options_zh": ["配置 AWS Site-to-Site VPN 并通过 VPC 扩展使用实例配置文件凭证。", "在本地服务器上安装 AWS SSM 代理，并使用 SSM 服务角色进行 AWS API 访问。", "在 IAM Roles Anywhere 中将私有 CA 注册为信任锚，并配置映射到 IAM 角色的配置文件，允许服务器用 X.509 证书换取临时 AWS 凭证。", "在 IAM 中创建 OIDC 提供商，并配置服务器使用 OIDC 令牌进行角色代入。"], "explanation_zh": "IAM Roles Anywhere 使 AWS 之外的工作负载（如本地服务器）能够使用 X.509 证书获取临时 AWS 凭证。您将 CA 注册为信任锚，并创建将证书属性映射到 IAM 角色的配置文件。当服务器出示由受信任 CA 签名的有效证书时，IAM Roles Anywhere 会颁发临时 STS 凭证。这消除了在本地服务器上存储长期访问密钥的需要。SSM 代理需要混合激活，且不适用于通用 AWS API 访问。"}, {"exam": 2, "id": 40, "question_en": "A company uses on-premises Active Directory for identity management. They need to enable SSO to the AWS Management Console using their existing AD credentials. They do NOT need to run AD-aware workloads (like SQL Server with Windows Authentication) in AWS.\n \nWhich directory service option is MOST cost-effective?", "options_en": ["Deploy AD Connector, which proxies authentication requests to the on-premises Active Directory without caching credentials in AWS.", "Deploy AWS Managed Microsoft AD (Enterprise Edition) with a trust relationship to the on-premises AD.", "Deploy AWS Managed Microsoft AD (Standard Edition) with AD replication from on-premises.", "Use Amazon Cognito User Pools with SAML federation to the on-premises AD."], "correct": 0, "explanation_en": "AD Connector is a directory gateway that redirects directory requests to the on-premises Active Directory without caching any information in the cloud. It is the most cost-effective option when you only need to use existing on-premises AD credentials for AWS console access and do not need AD-aware workloads in AWS. AD Connector is smaller (and cheaper) than AWS Managed Microsoft AD and does not require deploying domain controllers in AWS. Managed Microsoft AD is needed when you have AD-aware applications running in AWS, which is not the case here.", "question_zh": "一家公司使用本地 Active Directory 进行身份管理。他们需要使用现有的 AD 凭证启用对 AWS 管理控制台的 SSO。他们不需要在 AWS 中运行 AD 感知的工作负载（如使用 Windows 身份验证的 SQL Server）。哪种目录服务选项最具成本效益？", "options_zh": ["部署 AD Connector，它将认证请求代理到本地 Active Directory，而不在 AWS 中缓存凭证。", "部署 AWS Managed Microsoft AD（企业版），与本地 AD 建立信任关系。", "部署 AWS Managed Microsoft AD（标准版），从本地进行 AD 复制。", "使用 Amazon Cognito User Pools 与本地 AD 进行 SAML 联合。"], "explanation_zh": "AD Connector 是一个目录网关，将目录请求重定向到本地 Active Directory，而不在云中缓存任何信息。当您只需要使用现有本地 AD 凭证进行 AWS 控制台访问且不需要在 AWS 中运行 AD 感知工作负载时，这是最具成本效益的选择。AD Connector 比 AWS Managed Microsoft AD 更小（也更便宜），并且不需要在 AWS 中部署域控制器。当您在 AWS 中运行 AD 感知应用程序时才需要 Managed Microsoft AD，但这里不是这种情况。"}, {"exam": 2, "id": 41, "question_en": "A security engineer needs to identify all S3 buckets, IAM roles, KMS keys, and Lambda functions in their account that are shared with external AWS accounts or made public. The solution should continuously monitor for new external sharing and generate findings.\n \nWhich tool should they use?", "options_en": ["Run AWS Trusted Advisor checks for S3 bucket permissions and IAM access.", "Use AWS Config rules like `s3-bucket-public-read-prohibited` and `iam-role-managed-policy-check`.", "Review CloudTrail logs for cross-account API calls to identify external access patterns.", "Create an IAM Access Analyzer with the account as the zone of trust, which continuously monitors resource policies and generates findings for any external access."], "correct": 3, "explanation_en": "IAM Access Analyzer uses automated reasoning (formal provability) to analyze resource policies and identify resources that are accessible from outside the defined zone of trust (either an account or an organization). It continuously monitors and generates findings for S3 buckets, IAM roles, KMS keys, Lambda functions, SQS queues, and Secrets Manager secrets that grant external access. This provides comprehensive, continuous coverage without requiring manual policy review. Config rules check individual service configurations but do not use formal policy analysis.", "question_zh": "一名安全工程师需要识别账户中所有与外部 AWS 账户共享或公开的 S3 存储桶、IAM 角色、KMS 密钥和 Lambda 函数。该解决方案应持续监控新的外部共享并生成发现结果。应使用哪个工具？", "options_zh": ["运行 AWS Trusted Advisor 检查 S3 存储桶权限和 IAM 访问。", "使用 AWS Config 规则，如 s3-bucket-public-read-prohibited 和 iam-role-managed-policy-check。", "审查 CloudTrail 日志中的跨账户 API 调用以识别外部访问模式。", "创建一个以账户为信任区域的 IAM Access Analyzer，持续监控资源策略并为任何外部访问生成发现结果。"], "explanation_zh": "IAM Access Analyzer 使用自动推理（形式可证明性）来分析资源策略，并识别在定义的信任区域（账户或组织）之外可访问的资源。它持续监控 S3 存储桶、IAM 角色、KMS 密钥、Lambda 函数、SQS 队列和 Secrets Manager 密钥，为授予外部访问权限的资源生成发现结果。这提供了全面的持续覆盖，无需手动策略审查。Config 规则检查单个服务配置但不使用形式化策略分析。"}, {"exam": 2, "id": 42, "question_en": "A company has hundreds of EC2 instances owned by different project teams. They want each team to manage only their own instances without creating separate IAM policies per team. The teams are identified by a `Project` tag on both the IAM principals and the EC2 instances.\n \nWhich IAM policy approach implements this?", "options_en": ["Create a separate IAM policy for each project that lists the specific instance IDs belonging to that project.", "Create a single IAM policy that uses the condition `\"StringEquals\": {\"aws:ResourceTag/Project\": \"${aws:PrincipalTag/Project}\"}` to allow actions only when the resource's Project tag matches the principal's Project tag.", "Create IAM policies that use `aws:RequestTag/Project` to restrict which project tag users can assign when launching new instances.", "Use resource-based policies on each EC2 instance to restrict access to the owning team."], "correct": 1, "explanation_en": "Attribute-Based Access Control (ABAC) uses tags on both IAM principals and AWS resources to make authorization decisions. By comparing `aws:ResourceTag/Project` (the tag on the EC2 instance) with `aws:PrincipalTag/Project` (the tag on the IAM user or role), a single policy can dynamically restrict each team to managing only instances with a matching Project tag. This scales automatically as new teams and instances are added without requiring policy changes. Listing specific instance IDs does not scale. EC2 instances do not support resource-based policies.", "question_zh": "一家公司有数百个由不同项目团队拥有的 EC2 实例。他们希望每个团队仅管理自己的实例，而无需为每个团队创建单独的 IAM 策略。团队由 IAM 主体和 EC2 实例上的 Project 标签标识。哪种 IAM 策略方法能实现这一点？", "options_zh": ["为每个项目创建单独的 IAM 策略，列出属于该项目的特定实例 ID。", "创建一个使用条件 \"StringEquals\": {\"aws:ResourceTag/Project\": \"${aws:PrincipalTag/Project}\"} 的单个 IAM 策略，仅当资源的 Project 标签与主体的 Project 标签匹配时才允许操作。", "创建使用 aws:RequestTag/Project 的 IAM 策略，限制用户在启动新实例时可以分配的项目标签。", "在每个 EC2 实例上使用基于资源的策略将访问限制给拥有团队。"], "explanation_zh": "基于属性的访问控制 (ABAC) 使用 IAM 主体和 AWS 资源上的标签来做出授权决策。通过将 aws:ResourceTag/Project（EC2 实例上的标签）与 aws:PrincipalTag/Project（IAM 用户或角色上的标签）进行比较，单个策略可以动态地将每个团队限制为仅管理具有匹配 Project 标签的实例。随着新团队和实例的添加，这会自动扩展，无需策略更改。列出特定实例 ID 无法扩展。EC2 实例不支持基于资源的策略。"}, {"exam": 2, "id": 43, "question_en": "An organization wants to create an IAM policy for developers that allows all AWS actions EXCEPT IAM, Organizations, and Account actions. They want the policy to be concise and maintainable.\n \nWhich policy construct should they use?", "options_en": ["An Allow statement listing every AWS service action except IAM, Organizations, and Account.", "A Deny statement using `\"Action\": [\"iam:*\", \"organizations:*\", \"account:*\"]` without any Allow statement.", "An Allow statement using `\"NotAction\": [\"iam:*\", \"organizations:*\", \"account:*\"]` with `\"Resource\": \"*\"`, combined with an explicit Deny statement for the same services as a safeguard.", "An Allow statement using `\"Action\": \"*\"` followed by a separate Deny statement for IAM, Organizations, and Account actions."], "correct": 2, "explanation_en": "`NotAction` in an Allow statement means \"allow everything EXCEPT these actions.\" This is more concise than listing every allowed service. However, `NotAction` with Allow alone has a subtle risk: if a new AWS service is launched, it would be automatically allowed. To ensure the excluded services remain inaccessible even if other policies grant access, combining the `NotAction` Allow with an explicit Deny for the sensitive services provides defense in depth. An explicit Deny always overrides any Allow. Using only a Deny statement without an Allow would result in no permissions at all (implicit deny).", "question_zh": "一个组织希望为开发人员创建 IAM 策略，允许除 IAM、Organizations 和 Account 操作之外的所有 AWS 操作。他们希望策略简洁且易于维护。应使用哪种策略构造？", "options_zh": ["一个 Allow 声明，列出除 IAM、Organizations 和 Account 之外的每个 AWS 服务操作。", "一个使用 \"Action\": [\"iam:*\", \"organizations:*\", \"account:*\"] 的 Deny 声明，没有任何 Allow 声明。", "一个使用 \"NotAction\": [\"iam:*\", \"organizations:*\", \"account:*\"] 和 \"Resource\": \"*\" 的 Allow 声明，结合对相同服务的显式 Deny 声明作为安全防护。", "一个使用 \"Action\": \"*\" 的 Allow 声明，后面跟一个对 IAM、Organizations 和 Account 操作的单独 Deny 声明。"], "explanation_zh": "Allow 声明中的 NotAction 意味着\"允许除了这些操作之外的一切\"。这比列出每个允许的服务更简洁。然而，单独使用带有 NotAction 的 Allow 有一个微妙的风险：如果推出了新的 AWS 服务，它会自动被允许。为确保被排除的服务即使有其他策略授权也仍然不可访问，将 NotAction Allow 与对敏感服务的显式 Deny 结合提供了纵深防御。显式 Deny 始终覆盖任何 Allow。仅使用 Deny 声明而不使用 Allow 将导致根本没有权限（隐式拒绝）。"}, {"exam": 2, "id": 44, "question_en": "An organization wants to allow developers to create IAM roles for their Lambda functions but restrict the maximum permissions those roles can have. Developers should not be able to create roles with administrative access or access to production S3 buckets.\n \nWhich mechanism enforces this restriction?", "options_en": ["Require developers to attach a permissions boundary to every role they create, where the boundary limits the maximum permissions to non-admin actions and excludes production S3 buckets.", "Attach an SCP to the developer accounts that restricts IAM role creation.", "Use IAM Access Analyzer to detect overly permissive roles after they are created and remediate them.", "Create a Config rule that evaluates IAM roles for excessive permissions and auto-remediates non-compliant roles."], "correct": 0, "explanation_en": "Permissions boundaries set the maximum permissions that an IAM entity (user or role) can have, regardless of what permissions policies are attached to it. By requiring developers to attach a specific permissions boundary when creating roles (enforced via a condition in the developer's IAM policy using `iam:PermissionsBoundary`), the organization ensures that any role created by a developer cannot exceed the boundary's permissions. Even if a developer attaches an AdministratorAccess policy to the role, the effective permissions are the intersection of the permissions policy and the boundary.", "question_zh": "一个组织希望允许开发人员为其 Lambda 函数创建 IAM 角色，但限制这些角色可以拥有的最大权限。开发人员不应能够创建具有管理访问权限或对生产 S3 存储桶有访问权限的角色。哪种机制强制执行此限制？", "options_zh": ["要求开发人员为他们创建的每个角色附加权限边界，其中边界将最大权限限制为非管理操作并排除生产 S3 存储桶。", "将 SCP 附加到开发人员账户以限制 IAM 角色创建。", "使用 IAM Access Analyzer 在角色创建后检测权限过大的角色并修复它们。", "创建 Config 规则评估 IAM 角色的过多权限，并自动修复不合规角色。"], "explanation_zh": "权限边界设置了 IAM 实体（用户或角色）可以拥有的最大权限，无论附加了什么权限策略。通过要求开发人员在创建角色时附加特定的权限边界（通过开发人员 IAM 策略中的 iam:PermissionsBoundary 条件强制执行），组织确保开发人员创建的任何角色都不能超过边界的权限。即使开发人员将 AdministratorAccess 策略附加到角色，有效权限也是权限策略和边界的交集。"}, {"exam": 2, "id": 45, "question_en": "An application needs to encrypt files larger than 100 MB before storing them in S3. Direct encryption with KMS has a 4 KB plaintext data limit for the `Encrypt` API.\n \nHow should the application encrypt these large files?", "options_en": ["Split the file into 4 KB chunks, encrypt each chunk individually using the KMS `Encrypt` API, and reassemble the encrypted chunks.", "Use envelope encryption: call KMS `GenerateDataKey` to obtain a plaintext data key and an encrypted copy, encrypt the file locally with the plaintext data key using AES-256, store the encrypted file alongside the encrypted data key, and securely discard the plaintext data key.", "Upload the file to S3 with SSE-KMS enabled, which handles large file encryption transparently.", "Use CloudHSM to generate a data key and encrypt the file, then store the encrypted key in KMS."], "correct": 1, "explanation_en": "Envelope encryption is the standard pattern for encrypting data larger than 4 KB with KMS. The application calls `GenerateDataKey`, which returns both a plaintext data key and a KMS-encrypted copy. The application uses the plaintext key to encrypt the data locally (client-side), stores the encrypted data key alongside the encrypted data, and discards the plaintext key from memory. To decrypt, the application calls KMS `Decrypt` on the encrypted data key, then uses the resulting plaintext key to decrypt the data locally.", "question_zh": "一个应用程序需要在存储到 S3 之前加密大于 100 MB 的文件。使用 KMS 直接加密时，Encrypt API 有 4 KB 的明文数据限制。应用程序应如何加密这些大文件？", "options_zh": ["将文件分割成 4 KB 的块，使用 KMS Encrypt API 分别加密每个块，并重新组装加密块。", "使用信封加密：调用 KMS GenerateDataKey 获取明文数据密钥和加密副本，使用明文数据密钥通过 AES-256 在本地加密文件，将加密文件与加密数据密钥一起存储，并安全丢弃明文数据密钥。", "启用 SSE-KMS 将文件上传到 S3，这会透明地处理大文件加密。", "使用 CloudHSM 生成数据密钥并加密文件，然后将加密密钥存储在 KMS 中。"], "explanation_zh": "信封加密是使用 KMS 加密大于 4 KB 数据的标准模式。应用程序调用 GenerateDataKey，该调用返回明文数据密钥和 KMS 加密的副本。应用程序使用明文密钥在本地加密数据（客户端），将加密的数据密钥与加密数据一起存储，并从内存中丢弃明文密钥。要解密，应用程序对加密的数据密钥调用 KMS Decrypt，然后使用生成的明文密钥在本地解密数据。"}, {"exam": 2, "id": 46, "question_en": "A KMS key has a key policy that includes the following statement: `{\"Sid\": \"Enable IAM policies\",\n \"Effect\": \"Allow\",\n \"Principal\": {\"AWS\": \"arn:aws:iam::111111111111:root\"},\n \"Action\": \"kms:*\",\n \"Resource\": \"*\"}` An IAM user in account 111111111111 has an IAM policy that grants `kms:Encrypt` on this key.\n \nCan the user encrypt data with this key?", "options_en": ["No, because the key policy grants access to the root principal, which only means the AWS account root user.", "No, because the key policy must explicitly list each IAM user who needs access.", "Yes, but only if the user also has MFA enabled on their account.", "Yes, because the key policy statement enables IAM policies to control access to the key, and the user's IAM policy grants the needed permission."], "correct": 3, "explanation_en": "When a KMS key policy includes the `\"Principal\": {\"AWS\": \"arn:aws:iam::ACCOUNT-ID:root\"}` statement with `kms:*`, it does not grant access specifically to the root user. Instead, it enables the account to use IAM policies to delegate access to the key. This is the default key policy statement that bridges KMS key policies with IAM policies. Without this statement, IAM policies alone cannot grant access to the key. With it in place, any IAM principal in the account that has a matching IAM policy can use the key.", "question_zh": "一个 KMS 密钥的密钥策略包含以下声明：{\"Sid\": \"Enable IAM policies\", \"Effect\": \"Allow\", \"Principal\": {\"AWS\": \"arn:aws:iam::111111111111:root\"}, \"Action\": \"kms:*\", \"Resource\": \"*\"}。账户 111111111111 中的一个 IAM 用户具有授予对此密钥的 kms:Encrypt 权限的 IAM 策略。此用户可以使用此密钥加密数据吗？", "options_zh": ["否，因为密钥策略授予根主体的访问权限，这仅指 AWS 账户根用户。", "否，因为密钥策略必须显式列出每个需要访问的 IAM 用户。", "是，但仅当用户在其账户上启用了 MFA。", "是，因为密钥策略声明启用了 IAM 策略来控制对密钥的访问，而用户的 IAM 策略授予了所需的权限。"], "explanation_zh": "当 KMS 密钥策略包含 \"Principal\": {\"AWS\": \"arn:aws:iam::ACCOUNT-ID:root\"} 声明和 kms:* 时，它并不专门授予根用户访问权限。相反，它使账户能够使用 IAM 策略委派对密钥的访问。这是默认的密钥策略声明，连接 KMS 密钥策略和 IAM 策略。没有此声明，仅有 IAM 策略无法授予对密钥的访问权限。有了此声明，账户中具有匹配 IAM 策略的任何 IAM 主体都可以使用该密钥。"}, {"exam": 2, "id": 47, "question_en": "Account A stores a database credential in AWS Secrets Manager. A Lambda function in Account B needs to retrieve this secret at runtime. The secret is encrypted with a customer managed KMS key.\n \nWhat is required for cross-account secret access?", "options_en": ["Attach a resource-based policy to the secret in Account A granting `secretsmanager:GetSecretValue` to Account B's Lambda execution role, ensure the Lambda role has an IAM policy allowing the same action on the secret ARN, and grant `kms:Decrypt` on the KMS key to Account B's Lambda role.", "Create a copy of the secret in Account B using Secrets Manager replication.", "Share the secret through AWS Resource Access Manager (RAM).", "Encrypt the secret with an AWS managed KMS key, which automatically allows cross-account access."], "correct": 0, "explanation_en": "Cross-account access to Secrets Manager requires three things: (1) a resource-based policy on the secret granting the cross-account principal permission, (2) an IAM policy in the consuming account allowing the action on the secret ARN, and (3) a KMS key policy granting `kms:Decrypt` to the cross-account principal since the secret is encrypted with a customer managed KMS key. AWS managed KMS keys (`aws/secretsmanager`) cannot be used for cross-account access because their key policies do not support cross-account grants. Secrets Manager does not integrate with RAM.", "question_zh": "账户 A 在 AWS Secrets Manager 中存储了一个数据库凭证。账户 B 中的 Lambda 函数需要在运行时检索此密钥。该密钥使用客户托管的 KMS 密钥加密。跨账户密钥访问需要什么？", "options_zh": ["向账户 A 中的密钥附加基于资源的策略，授予账户 B 的 Lambda 执行角色 secretsmanager:GetSecretValue，确保 Lambda 角色具有允许对密钥 ARN 执行相同操作的 IAM 策略，并授予账户 B 的 Lambda 角色对该 KMS 密钥的 kms:Decrypt 权限。", "使用 Secrets Manager 复制在账户 B 中创建密钥的副本。", "通过 AWS Resource Access Manager (RAM) 共享密钥。", "使用 AWS 托管的 KMS 密钥加密密钥，这会自动允许跨账户访问。"], "explanation_zh": "对 Secrets Manager 的跨账户访问需要三件事：(1) 密钥上的基于资源的策略授予跨账户主体权限，(2) 消费账户中的 IAM 策略允许对密钥 ARN 执行操作，(3) 由于密钥使用客户托管 KMS 密钥加密，KMS 密钥策略需要授予跨账户主体 kms:Decrypt 权限。AWS 托管的 KMS 密钥（aws/secretsmanager）不能用于跨账户访问，因为它们的密钥策略不支持跨账户授权。Secrets Manager 不与 RAM 集成。"}, {"exam": 2, "id": 48, "question_en": "A financial services company has a regulatory requirement mandating that cryptographic keys must be generated and stored in dedicated, single-tenant FIPS 140-2 Level 3 validated hardware under the company's exclusive control. They need to use these keys for TLS offloading on their web servers.\n \nWhich service meets this requirement?", "options_en": ["AWS KMS with a customer managed key.", "AWS KMS with an external key store (XKS) connecting to an on-premises HSM.", "AWS CloudHSM, which provides dedicated, single-tenant HSMs validated to FIPS 140-2 Level 3 with exclusive customer control over key management and TLS offloading support.", "AWS Certificate Manager for TLS certificate management with automated rotation."], "correct": 2, "explanation_en": "AWS CloudHSM provides single-tenant, dedicated hardware security modules (HSMs) that are validated to FIPS 140-2 Level 3. Customers have exclusive control over the HSMs, including key generation, storage, and management. CloudHSM supports TLS offloading through integration with web servers (like NGINX and Apache) via PKCS#11 or the OpenSSL dynamic engine. While AWS KMS also uses FIPS 140-2 Level 3 validated HSMs, KMS is a multi-tenant managed service where customers do not have direct exclusive control over the underlying hardware.", "question_zh": "一家金融服务公司有监管要求，规定加密密钥必须在公司独占控制的专用单租户 FIPS 140-2 Level 3 验证硬件中生成和存储。他们需要使用这些密钥在其 Web 服务器上进行 TLS 卸载。哪个服务满足此要求？", "options_zh": ["AWS KMS 配合客户托管密钥。", "AWS KMS 配合连接到本地 HSM 的外部密钥存储 (XKS)。", "AWS CloudHSM，提供经过 FIPS 140-2 Level 3 验证的专用单租户 HSM，客户对密钥管理和 TLS 卸载支持具有独占控制。", "AWS Certificate Manager 用于 TLS 证书管理与自动轮换。"], "explanation_zh": "AWS CloudHSM 提供经过 FIPS 140-2 Level 3 验证的单租户专用硬件安全模块 (HSM)。客户对 HSM 具有独占控制，包括密钥生成、存储和管理。CloudHSM 支持通过与 Web 服务器（如 NGINX 和 Apache）的集成，通过 PKCS#11 或 OpenSSL 动态引擎进行 TLS 卸载。虽然 AWS KMS 也使用 FIPS 140-2 Level 3 验证的 HSM，但 KMS 是一个多租户托管服务，客户对底层硬件没有直接的独占控制。"}, {"exam": 2, "id": 49, "question_en": "An application uses Amazon CloudFront with a custom domain name. The team needs to provision an SSL/TLS certificate for the domain `app.example.com` with automatic renewal.\n \nWhere must the ACM public certificate be provisioned for use with CloudFront?", "options_en": ["In the same Region as the application's origin servers.", "In the `us-east-1` (N. Virginia) Region, which is required for all CloudFront distributions.", "In any Region, as CloudFront automatically replicates the certificate globally.", "The certificate must be imported into CloudFront directly and cannot use ACM."], "correct": 1, "explanation_en": "CloudFront requires that ACM certificates used for custom domain names (alternate domain names/CNAMEs) be provisioned in the `us-east-1` (N. Virginia) Region. This is a CloudFront-specific requirement regardless of where the origin servers are located. ACM public certificates provisioned in `us-east-1` are automatically deployed to all CloudFront edge locations globally. Certificates in other Regions cannot be associated with CloudFront distributions. ACM public certificates support automatic renewal.", "question_zh": "一个应用程序使用 Amazon CloudFront 配合自定义域名。团队需要为域名 app.example.com 配置具有自动续期的 SSL/TLS 证书。ACM 公有证书必须在哪个区域配置才能与 CloudFront 一起使用？", "options_zh": ["与应用程序源服务器相同的区域。", "us-east-1（弗吉尼亚北部）区域，这是所有 CloudFront 分发的要求。", "任何区域，因为 CloudFront 会自动将证书复制到全球。", "证书必须直接导入到 CloudFront，不能使用 ACM。"], "explanation_zh": "CloudFront 要求用于自定义域名（备用域名/CNAME）的 ACM 证书在 us-east-1（弗吉尼亚北部）区域配置。这是 CloudFront 的特定要求，无论源服务器位于何处。在 us-east-1 配置的 ACM 公有证书会自动部署到所有 CloudFront 边缘站点全球。其他区域的证书无法与 CloudFront 分发关联。ACM 公有证书支持自动续期。"}, {"exam": 2, "id": 50, "question_en": "A company stores millions of objects in an S3 bucket encrypted with SSE-KMS. Their KMS costs have become significant because each `PutObject` and `GetObject` call generates a separate KMS API request.\n \nHow can they reduce KMS costs without changing the encryption type?", "options_en": ["Increase the KMS key rotation period to reduce the number of key versions.", "Switch from SSE-KMS to SSE-S3 to eliminate KMS costs entirely.", "Enable KMS key caching in the application code using the AWS Encryption SDK data key caching feature.", "Enable S3 Bucket Keys, which generate a bucket-level key from KMS and use it to encrypt multiple objects, reducing the number of KMS API calls."], "correct": 3, "explanation_en": "S3 Bucket Keys reduce KMS costs by generating a short-lived, bucket-level key derived from the KMS key. This bucket-level key is used to encrypt multiple objects within S3, significantly reducing the number of direct KMS API calls (and thus KMS costs) by up to 99%. Each KMS `GenerateDataKey` call produces a bucket key that is reused for a time-limited period. This works transparently with SSE-KMS and requires no application code changes. Key rotation frequency does not affect the per-request KMS API call volume.", "question_zh": "一家公司在 S3 存储桶中存储了数百万个使用 SSE-KMS 加密的对象。由于每次 PutObject 和 GetObject 调用都会产生单独的 KMS API 请求，因此其 KMS 成本变得很高。如何在不更改加密类型的情况下降低 KMS 成本？", "options_zh": ["增加 KMS 密钥轮换周期以减少密钥版本数量。", "从 SSE-KMS 切换到 SSE-S3 以完全消除 KMS 成本。", "在应用程序代码中使用 AWS Encryption SDK 数据密钥缓存功能启用 KMS 密钥缓存。", "启用 S3 Bucket Keys，从 KMS 生成存储桶级别密钥并用它加密多个对象，减少 KMS API 调用次数。"], "explanation_zh": "S3 Bucket Keys 通过生成从 KMS 密钥派生的短期存储桶级别密钥来降低 KMS 成本。此存储桶级密钥用于在 S3 内加密多个对象，将直接 KMS API 调用次数（以及 KMS 成本）最多减少 99%。每次 KMS GenerateDataKey 调用生成一个存储桶密钥，在有限时间内可重复使用。这在 SSE-KMS 下透明工作，无需更改应用程序代码。密钥轮换频率不影响每次请求的 KMS API 调用量。"}, {"exam": 2, "id": 51, "question_en": "A data governance team needs to automatically discover and classify sensitive data (PII, financial data, credentials) across all S3 buckets in their account. They want a continuous, low-touch solution that provides a sensitivity score showing which buckets contain the most sensitive data.\n \nWhich approach is BEST?", "options_en": ["Enable Amazon Macie automated sensitive data discovery, which continuously samples and analyzes objects across all S3 buckets to build a sensitivity score and heat map.", "Configure S3 Storage Lens with advanced metrics to identify buckets with sensitive content.", "Deploy a Lambda function triggered by S3 events that uses Amazon Comprehend to detect PII in new objects.", "Use AWS Glue DataBrew with PII detection recipes to profile all S3 data."], "correct": 0, "explanation_en": "Amazon Macie automated sensitive data discovery continuously samples objects across S3 buckets using machine learning and pattern matching to identify sensitive data types including PII, financial data, and credentials. It provides a sensitivity score for each bucket and an interactive visualization showing the distribution of sensitive data across the account. This is a fully managed, continuous solution that requires minimal configuration. S3 Storage Lens provides storage metrics but does not inspect object contents for sensitive data.", "question_zh": "数据治理团队需要自动发现和分类账户中所有 S3 存储桶中的敏感数据（PII、财务数据、凭证）。他们希望采用持续、低接触的解决方案，提供显示哪些存储桶包含最敏感数据的敏感度评分。哪种方法最好？", "options_zh": ["启用 Amazon Macie 自动敏感数据发现，持续采样和分析所有 S3 存储桶中的对象，以建立敏感度评分和热力图。", "配置 S3 Storage Lens 高级指标来识别包含敏感内容的存储桶。", "部署由 S3 事件触发的 Lambda 函数，使用 Amazon Comprehend 检测新对象中的 PII。", "使用 AWS Glue DataBrew 配合 PII 检测配方来分析所有 S3 数据。"], "explanation_zh": "Amazon Macie 自动敏感数据发现使用机器学习和模式匹配持续采样 S3 存储桶中的对象，以识别敏感数据类型，包括 PII、财务数据和凭证。它为每个存储桶提供敏感度评分和交互式可视化，显示整个账户中敏感数据的分布。这是一个完全托管、持续的解决方案，需要最少的配置。S3 Storage Lens 提供存储指标但不检查对象内容中的敏感数据。"}, {"exam": 2, "id": 52, "question_en": "A healthcare organization needs to store medical records in S3 for 7 years to meet HIPAA requirements. Even administrators with full S3 permissions should NOT be able to delete or overwrite the records before the retention period expires.\n \nWhich S3 Object Lock configuration meets this requirement?", "options_en": ["Enable S3 versioning with MFA Delete to prevent object deletion.", "Enable S3 Object Lock in Governance mode with a 7-year retention period.", "Enable S3 Object Lock in Compliance mode with a 7-year retention period.", "Create an S3 Lifecycle policy that transitions objects to S3 Glacier Deep Archive and prevents deletion."], "correct": 2, "explanation_en": "S3 Object Lock in Compliance mode provides the strictest immutability protection. Once set, the retention period cannot be shortened and the object version cannot be deleted or overwritten by ANY user, including the AWS account root user. In Governance mode, users with the `s3:BypassGovernanceRetention` permission can override the retention. Since the requirement states that even administrators should not be able to delete records, Compliance mode is the only option that provides true WORM (Write Once Read Many) protection.", "question_zh": "一家医疗机构需要在 S3 中存储医疗记录 7 年以满足 HIPAA 要求。即使具有完全 S3 权限的管理员也不应在保留期届满前删除或覆盖这些记录。哪种 S3 Object Lock 配置满足此需求？", "options_zh": ["启用带有 MFA Delete 的 S3 版本控制以防止对象删除。", "在 Governance 模式下启用 S3 Object Lock，保留期为 7 年。", "在 Compliance 模式下启用 S3 Object Lock，保留期为 7 年。", "创建 S3 Lifecycle 策略，将对象过渡到 S3 Glacier Deep Archive 并防止删除。"], "explanation_zh": "Compliance 模式下的 S3 Object Lock 提供最严格的不可变性保护。一旦设置，保留期无法缩短，任何用户（包括 AWS 账户根用户）都无法删除或覆盖对象版本。在 Governance 模式下，具有 s3:BypassGovernanceRetention 权限的用户可以覆盖保留期。由于要求甚至管理员也不能删除记录，Compliance 模式是唯一提供真正 WORM（一次写入多次读取）保护的选项。"}, {"exam": 2, "id": 53, "question_en": "An organization needs to implement a backup strategy where production account backups are automatically copied to a separate backup account in a different Region for disaster recovery. The backup copies in the target account should be immutable.\n \nWhich AWS Backup feature supports this?", "options_en": ["Use AWS Backup with a backup plan that includes a cross-Region copy rule within the same account, then configure a resource-based policy on the vault to allow the backup account access for restores.", "Use AWS Backup with a backup plan that includes a cross-account, cross-Region copy rule targeting a backup vault in the backup account, with AWS Backup Vault Lock enabled on the destination vault.", "Use AWS Backup with a backup plan and enable Backup Vault Lock on the source vault in the production account to protect recovery points from deletion.", "Use AWS Backup with a backup plan that has a cross-Region copy rule targeting a vault in the backup account, using the default vault retention settings without enabling Vault Lock."], "correct": 1, "explanation_en": "AWS Backup supports cross-account and cross-Region backup copy rules within a backup plan. This automatically copies backup recovery points to a destination backup vault in another account and/or Region. By enabling AWS Backup Vault Lock on the destination vault, the backups become immutable and cannot be deleted even by privileged users, providing protection against ransomware and accidental deletion. This is a fully managed solution that supports multiple AWS resource types (EBS, RDS, DynamoDB, EFS, etc.) through a single backup plan.", "question_zh": "一个组织需要实现备份策略，将生产账户的备份自动复制到另一个区域中的单独备份账户用于灾难恢复。目标账户中的备份副本应不可变。哪个 AWS Backup 功能支持此需求？", "options_zh": ["使用 AWS Backup 配合包含同一账户内跨区域复制规则的备份计划，然后在保管库上配置基于资源的策略以允许备份账户访问进行还原。", "使用 AWS Backup 配合包含跨账户、跨区域复制规则的备份计划，目标为备份账户中的备份保管库，并在目标保管库上启用 AWS Backup Vault Lock。", "使用 AWS Backup 配合备份计划，并在生产账户的源保管库上启用 Backup Vault Lock，以保护恢复点免于删除。", "使用 AWS Backup 配合包含跨区域复制规则的备份计划，目标为备份账户中的保管库，使用默认保管库保留设置，不启用 Vault Lock。"], "explanation_zh": "AWS Backup 在备份计划内支持跨账户和跨区域备份复制规则。这会自动将备份恢复点复制到另一个账户和/或区域中的目标备份保管库。通过在目标保管库上启用 AWS Backup Vault Lock，备份变得不可变，即使特权用户也无法删除，提供防范勒索软件和意外删除的保护。这是一个完全托管的解决方案，通过单个备份计划支持多种 AWS 资源类型（EBS、RDS、DynamoDB、EFS 等）。"}, {"exam": 2, "id": 54, "question_en": "A company uses AWS Private Certificate Authority to issue certificates for internal services. They need to implement certificate revocation so that clients can verify whether a certificate has been revoked before establishing a TLS connection.\n \nWhich revocation mechanisms does AWS Private CA support?", "options_en": ["Only Certificate Revocation Lists (CRLs) published to an S3 bucket.", "Only OCSP (Online Certificate Status Protocol) through a managed OCSP responder.", "Certificate revocation is not supported; you must re-issue all certificates when a compromise occurs.", "Both CRL (published to S3) and OCSP (via a managed OCSP responder), which can be enabled independently or together."], "correct": 3, "explanation_en": "AWS Private CA supports two revocation mechanisms that can be enabled independently or together: Certificate Revocation Lists (CRLs) are published to an S3 bucket and contain a list of revoked certificate serial numbers. The OCSP responder is a fully managed service that responds to real-time revocation status queries from clients. OCSP provides faster revocation checking since clients do not need to download and parse a full CRL. Using both provides defense in depth for clients that may support only one mechanism.", "question_zh": "一家公司使用 AWS Private Certificate Authority 为内部服务颁发证书。他们需要实现证书吊销，以便客户端在建立 TLS 连接之前可以验证证书是否已被吊销。AWS Private CA 支持哪些吊销机制？", "options_zh": ["仅支持发布到 S3 存储桶的证书吊销列表 (CRL)。", "仅支持通过托管 OCSP 响应器的 OCSP（在线证书状态协议）。", "不支持证书吊销；发生泄露时必须重新颁发所有证书。", "同时支持 CRL（发布到 S3）和 OCSP（通过托管 OCSP 响应器），可以独立或一起启用。"], "explanation_zh": "AWS Private CA 支持两种可以独立或一起启用的吊销机制：证书吊销列表 (CRL) 发布到 S3 存储桶，包含已吊销证书序列号的列表。OCSP 响应器是一个完全托管的服务，响应客户端的实时吊销状态查询。OCSP 提供更快的吊销检查，因为客户端无需下载和解析完整的 CRL。两者同时使用为可能仅支持一种机制的客户端提供纵深防御。"}, {"exam": 2, "id": 55, "question_en": "A company needs to access Amazon S3 from EC2 instances in a private subnet without traversing the internet or using a NAT Gateway. The instances use HTTPS (port 443) to access S3 APIs.\n \nWhich VPC endpoint type is the MOST cost-effective for this use case?", "options_en": ["A Gateway endpoint for S3, which adds a route to the VPC route table, keeps traffic within the AWS network, and is free of charge.", "An Interface endpoint (PrivateLink) for S3, which creates ENIs in the subnet and supports access from on-premises networks via VPN/Direct Connect.", "Both Gateway and Interface endpoints are identical; either one works equally well.", "A NAT Gateway is the only option for private subnet access to S3."], "correct": 0, "explanation_en": "S3 supports both Gateway endpoints and Interface endpoints (PrivateLink). For EC2-to-S3 access from within a VPC, a Gateway endpoint is the most cost-effective choice because it is free of charge. It adds a prefix list route to the route table and keeps traffic entirely within the AWS network. Interface endpoints create ENIs with private IP addresses and incur hourly and data processing charges. Interface endpoints are primarily needed when S3 access is required from on-premises networks via VPN/Direct Connect or from other Regions via VPC peering.", "question_zh": "一家公司需要从私有子网中的 EC2 实例访问 Amazon S3，而不经过互联网或使用 NAT Gateway。这些实例使用 HTTPS（端口 443）访问 S3 API。哪种 VPC 端点类型对此用例最具成本效益？", "options_zh": ["S3 的 Gateway 端点，它向 VPC 路由表添加路由，将流量保持在 AWS 网络内，并且免费。", "S3 的 Interface 端点（PrivateLink），它在子网中创建 ENI，并支持通过 VPN/Direct Connect 从本地网络访问。", "Gateway 和 Interface 端点完全相同；两者均可同样使用。", "NAT Gateway 是从私有子网访问 S3 的唯一选项。"], "explanation_zh": "S3 同时支持 Gateway 端点和 Interface 端点（PrivateLink）。对于 VPC 内的 EC2 到 S3 访问，Gateway 端点是最具成本效益的选择，因为它是免费的。它向路由表添加前缀列表路由，并将流量完全保持在 AWS 网络内。Interface 端点创建带有私有 IP 地址的 ENI，会产生每小时费用和数据处理费用。Interface 端点主要在需要从本地网络通过 VPN/Direct Connect 或从其他区域通过 VPC 对等访问 S3 时才需要。"}, {"exam": 2, "id": 56, "question_en": "A company sends application logs to Amazon CloudWatch Logs. The logs occasionally contain sensitive customer data such as email addresses and credit card numbers. Compliance requires that sensitive data in logs be masked in real-time before anyone can view it.\n \nWhich feature should they use?", "options_en": ["Create a CloudWatch Logs subscription filter that sends logs to a Lambda function for real-time PII redaction.", "Configure Amazon Macie to scan CloudWatch Logs for sensitive data.", "Enable CloudWatch Logs data protection policies that use managed data identifiers to automatically detect and mask sensitive data (such as email addresses and credit card numbers) in log events.", "Use CloudWatch Logs Insights queries with regex to mask sensitive fields at query time."], "correct": 2, "explanation_en": "CloudWatch Logs data protection allows you to define data protection policies on log groups that automatically detect and mask sensitive data in log events. The policies use managed data identifiers that can detect PII categories like email addresses, credit card numbers, SSNs, and other sensitive data types. Masked data appears as asterisks in the log events. This operates in real-time as logs are ingested, requiring no custom Lambda functions or complex processing pipelines. Macie is designed for S3 data, not CloudWatch Logs.", "question_zh": "一家公司将应用程序日志发送到 Amazon CloudWatch Logs。这些日志偶尔包含敏感的客户数据，如电子邮件地址和信用卡号码。合规要求要求在任何人查看之前实时屏蔽日志中的敏感数据。应使用哪个功能？", "options_zh": ["创建 CloudWatch Logs 订阅筛选器，将日志发送到 Lambda 函数进行实时 PII 编辑。", "配置 Amazon Macie 扫描 CloudWatch Logs 中的敏感数据。", "启用 CloudWatch Logs 数据保护策略，使用托管数据标识符自动检测和屏蔽日志事件中的敏感数据（如电子邮件地址和信用卡号码）。", "使用 CloudWatch Logs Insights 查询，在查询时使用正则表达式屏蔽敏感字段。"], "explanation_zh": "CloudWatch Logs 数据保护允许您在日志组上定义数据保护策略，自动检测和屏蔽日志事件中的敏感数据。这些策略使用托管数据标识符，可以检测 PII 类别，如电子邮件地址、信用卡号码、社会安全号码和其他敏感数据类型。被屏蔽的数据在日志事件中显示为星号。这在日志摄入时实时运行，无需自定义 Lambda 函数或复杂的处理管道。Macie 专为 S3 数据设计，而非 CloudWatch Logs。"}, {"exam": 2, "id": 57, "question_en": "An organization is deploying AWS Control Tower for their multi-account environment. They need to prevent any account in the organization from disabling CloudTrail logging, and this control must be strictly enforced (not just detected).\n \nWhich type of Control Tower control should they apply?", "options_en": ["A detective control that uses AWS Config rules to detect when CloudTrail is disabled and generates a notification.", "A preventive control that uses a Service Control Policy (SCP) to deny the `cloudtrail:StopLogging` and `cloudtrail:DeleteTrail` actions across all accounts.", "A proactive control that uses CloudFormation hooks to validate CloudTrail configurations during stack deployments.", "A detective control that uses Security Hub to monitor CloudTrail status and flag non-compliant accounts."], "correct": 1, "explanation_en": "Control Tower controls (formerly called guardrails) come in three types: preventive, detective, and proactive. Preventive controls use SCPs to prohibit actions and are strictly enforced - the action is blocked before it can occur. A preventive control denying `cloudtrail:StopLogging` and `cloudtrail:DeleteTrail` ensures no one in any account can disable CloudTrail logging. Detective controls only identify non-compliance after the fact via Config rules. Proactive controls use CloudFormation hooks and only apply during stack operations, not direct API calls.", "question_zh": "一个组织正在为其多账户环境部署 AWS Control Tower。他们需要阻止组织中任何账户禁用 CloudTrail 日志记录，此控制必须被严格执行（而不仅仅是检测）。应应用哪种类型的 Control Tower 控制？", "options_zh": ["一种检测性控制，使用 AWS Config 规则检测 CloudTrail 何时被禁用并生成通知。", "一种预防性控制，使用 Service Control Policy (SCP) 拒绝所有账户中的 cloudtrail:StopLogging 和 cloudtrail:DeleteTrail 操作。", "一种主动控制，使用 CloudFormation hooks 在堆栈部署期间验证 CloudTrail 配置。", "一种检测性控制，使用 Security Hub 监控 CloudTrail 状态并标记不合规账户。"], "explanation_zh": "Control Tower 控制（以前称为护栏）分为三种类型：预防性、检测性和主动性。预防性控制使用 SCP 禁止操作并被严格执行——操作在发生之前就被阻止。拒绝 cloudtrail:StopLogging 和 cloudtrail:DeleteTrail 的预防性控制确保任何账户中没有人可以禁用 CloudTrail 日志记录。检测性控制仅在事后通过 Config 规则识别不合规。主动控制使用 CloudFormation hooks，仅在堆栈操作期间适用，不适用直接 API 调用。"}, {"exam": 2, "id": 58, "question_en": "Your organization has a custom security requirement: all RDS instances must have deletion protection enabled. There is no AWS managed Config rule for this specific check.\n \nHow should you implement automated compliance checking?", "options_en": ["Create a CloudWatch Events rule that monitors RDS API calls and triggers a Lambda function to check deletion protection.", "Use AWS Trusted Advisor to check RDS instances for deletion protection settings.", "Create an IAM policy that prevents launching RDS instances without deletion protection.", "Create an AWS Config custom rule backed by a Lambda function that evaluates each RDS instance's `DeletionProtection` attribute and reports compliance status."], "correct": 3, "explanation_en": "AWS Config custom rules allow you to define custom compliance checks using Lambda functions. The Lambda function receives the configuration item from Config when a resource is created or modified, evaluates it against your custom logic (in this case, checking if `DeletionProtection` is true), and reports the resource as COMPLIANT or NON_COMPLIANT. Config tracks compliance over time and can trigger automatic remediation for non-compliant resources. An IAM policy cannot enforce RDS configuration attributes; it can only control API permissions.", "question_zh": "您的组织有一项自定义安全要求：所有 RDS 实例必须启用删除保护。没有针对此特定检查的 AWS 托管 Config 规则。应如何实现自动化合规检查？", "options_zh": ["创建 CloudWatch Events 规则监控 RDS API 调用，并触发 Lambda 函数检查删除保护。", "使用 AWS Trusted Advisor 检查 RDS 实例的删除保护设置。", "创建 IAM 策略防止启动未启用删除保护的 RDS 实例。", "创建 AWS Config 自定义规则，由检查每个 RDS 实例的 DeletionProtection 属性并报告合规状态的 Lambda 函数支持。"], "explanation_zh": "AWS Config 自定义规则允许您使用 Lambda 函数定义自定义合规检查。Lambda 函数在资源创建或修改时从 Config 接收配置项，根据您的自定义逻辑评估它（在这种情况下，检查 DeletionProtection 是否为 true），并将资源报告为 COMPLIANT 或 NON_COMPLIANT。Config 随时间跟踪合规状态，并可以为不合规资源触发自动修复。IAM 策略无法强制执行 RDS 配置属性；它只能控制 API 权限。"}, {"exam": 2, "id": 59, "question_en": "A company needs to prepare for an upcoming SOC 2 Type II audit. They want to automate the collection of evidence from their AWS environment to demonstrate compliance with SOC 2 trust service criteria.\n \nWhich service should they use?", "options_en": ["AWS Audit Manager, which automates evidence collection from AWS services, maps it to SOC 2 controls, and generates assessment reports.", "AWS Artifact, which provides on-demand access to AWS compliance reports and agreements.", "AWS Security Hub with the CIS AWS Foundations Benchmark enabled.", "AWS CloudTrail with a custom analysis dashboard in Amazon QuickSight."], "correct": 0, "explanation_en": "AWS Audit Manager automates the continuous collection of evidence from AWS services (CloudTrail, Config, Security Hub, etc.) and maps it to compliance framework controls. It includes a pre-built framework for SOC 2 that maps AWS evidence to SOC 2 trust service criteria. Assessment reports can be generated for auditors with all collected evidence organized by control domain. AWS Artifact provides AWS's own compliance reports (like AWS's SOC reports) but does not collect evidence from your environment.", "question_zh": "一家公司需要为即将到来的 SOC 2 Type II 审计做准备。他们希望自动从 AWS 环境收集证据，以证明符合 SOC 2 信任服务标准。应使用哪个服务？", "options_zh": ["AWS Audit Manager，自动从 AWS 服务收集证据，将其映射到 SOC 2 控制措施，并生成评估报告。", "AWS Artifact，提供按需访问 AWS 合规报告和协议的服务。", "启用了 CIS AWS Foundations Benchmark 的 AWS Security Hub。", "AWS CloudTrail 配合在 Amazon QuickSight 中的自定义分析仪表板。"], "explanation_zh": "AWS Audit Manager 自动持续从 AWS 服务（CloudTrail、Config、Security Hub 等）收集证据，并将其映射到合规框架控制措施。它包括一个预构建的 SOC 2 框架，将 AWS 证据映射到 SOC 2 信任服务标准。可为审计员生成评估报告，其中包含按控制域组织的所有已收集证据。AWS Artifact 提供 AWS 自身的合规报告（如 AWS 的 SOC 报告），但不从您的环境收集证据。"}, {"exam": 2, "id": 60, "question_en": "An organization wants to restrict which AWS service principals can perform actions on resources in member accounts, regardless of the IAM permissions granted. For example, they want to prevent unapproved services from creating log subscriptions to CloudWatch Logs in production accounts.\n \nWhich policy type should they use?", "options_en": ["Service Control Policies (SCPs) that deny specific service actions.", "IAM service-linked role policies that restrict service permissions.", "Resource Control Policies (RCPs) that restrict which service principals can perform actions on resources within the organization, complementing SCPs.", "VPC endpoint policies that restrict which services can be accessed from within the VPC."], "correct": 2, "explanation_en": "Resource Control Policies (RCPs) are a type of organization policy that controls the maximum permissions available on resources in member accounts. While SCPs restrict what IAM principals can do (identity-based), RCPs restrict what service principals can do on resources (resource-based). RCPs allow organizations to set boundaries on resource-based policies, preventing resources from being accessed by unapproved service principals. This provides a complementary layer of control alongside SCPs for comprehensive access governance.", "question_zh": "一个组织希望限制哪些 AWS 服务主体可以对成员账户中的资源执行操作，无论授予了什么 IAM 权限。例如，他们希望防止未经批准的服务在生产账户中对 CloudWatch Logs 创建日志订阅。应使用哪种策略类型？", "options_zh": ["拒绝特定服务操作的 Service Control Policies (SCP)。", "限制服务权限的 IAM 服务关联角色策略。", "Resource Control Policies (RCP)，限制哪些服务主体可以对组织内的资源执行操作，作为 SCP 的补充。", "限制可以从 VPC 内访问哪些服务的 VPC 端点策略。"], "explanation_zh": "Resource Control Policies (RCP) 是一种组织策略类型，控制成员账户中资源上可用的最大权限。SCP 限制 IAM 主体可以做什么（基于身份），而 RCP 限制服务主体可以对资源做什么（基于资源）。RCP 允许组织在基于资源的策略上设置边界，防止资源被未经批准的服务主体访问。这与 SCP 一起提供了全面的访问治理互补控制层。"}, {"exam": 2, "id": 61, "question_en": "A platform team needs to ensure that all CloudFormation templates used by development teams comply with security policies before deployment. Policies include: all S3 buckets must have encryption enabled, all EC2 instances must use approved instance types, and all security groups must not allow inbound SSH from `0.0.0.0/0`.\n \nWhich tool should they use?", "options_en": ["Use cfn-lint to validate CloudFormation template syntax and best practices.", "Use CloudFormation Guard to write policy-as-code rules that validate CloudFormation templates against custom security policies before deployment.", "Use AWS Config to detect non-compliant resources after deployment and auto-remediate them.", "Use IAM policies to prevent the creation of non-compliant resources via CloudFormation."], "correct": 1, "explanation_en": "CloudFormation Guard (cfn-guard) is a policy-as-code tool that validates CloudFormation templates (and other JSON/YAML data) against custom rules before deployment. Rules are written in a domain-specific language that can express conditions like \"S3 buckets must have encryption\" or \"security groups must not allow 0.0.0.0/0 on port 22.\" This shifts security left by catching policy violations before resources are created, rather than detecting and remediating them after deployment. cfn-lint validates syntax but does not support custom security policy rules.", "question_zh": "平台团队需要确保开发团队使用的所有 CloudFormation 模板在部署前符合安全策略。策略包括：所有 S3 存储桶必须启用加密，所有 EC2 实例必须使用批准的实例类型，所有安全组不得允许来自 0.0.0.0/0 的入站 SSH。应使用哪个工具？", "options_zh": ["使用 cfn-lint 验证 CloudFormation 模板语法和最佳实践。", "使用 CloudFormation Guard 编写策略即代码规则，在部署前根据自定义安全策略验证 CloudFormation 模板。", "使用 AWS Config 在部署后检测不合规资源并自动修复它们。", "使用 IAM 策略防止通过 CloudFormation 创建不合规资源。"], "explanation_zh": "CloudFormation Guard (cfn-guard) 是一个策略即代码工具，在部署前根据自定义规则验证 CloudFormation 模板（和其他 JSON/YAML 数据）。规则使用领域特定语言编写，可以表达诸如\"S3 存储桶必须加密\"或\"安全组不得允许端口 22 的 0.0.0.0/0\"等条件。这通过创建资源之前捕获策略违规来实现安全左移，而不是在部署后检测和修复。cfn-lint 验证语法但不支持自定义安全策略规则。"}, {"exam": 2, "id": 62, "question_en": "An organization with over 100 accounts needs to deploy consistent AWS WAF rules across all Application Load Balancers and API Gateways in every account. The security team should manage the rules centrally without requiring individual account owners to configure WAF.\n \nWhich service provides this capability?", "options_en": ["Deploy WAF WebACLs in each account using CloudFormation StackSets.", "Create a shared WAF WebACL in the management account and reference it from other accounts using Resource Access Manager.", "Enable AWS Config rules to detect ALBs without WAF and send notifications for manual remediation.", "Use AWS Firewall Manager to create a WAF policy that automatically associates WAF WebACLs with ALBs and API Gateways across all organization accounts."], "correct": 3, "explanation_en": "AWS Firewall Manager enables centralized management of AWS WAF rules, Shield Advanced protections, security groups, Network Firewall policies, and Route 53 Resolver DNS Firewall rules across an organization. A Firewall Manager WAF policy automatically creates and associates WAF WebACLs with in-scope resources (ALBs, API Gateways, CloudFront distributions) in all member accounts. When new resources are created, Firewall Manager automatically applies the WAF policy. StackSets could deploy WAF but would not automatically associate WebACLs with newly created resources.", "question_zh": "一个拥有超过 100 个账户的组织需要在每个账户中的所有 Application Load Balancer 和 API Gateway 上部署一致的 AWS WAF 规则。安全团队应集中管理规则，无需各个账户所有者配置 WAF。哪个服务提供此能力？", "options_zh": ["使用 CloudFormation StackSets 在每个账户中部署 WAF WebACL。", "在管理账户中创建共享 WAF WebACL，并使用 Resource Access Manager 从其他账户引用它。", "启用 AWS Config 规则检测没有 WAF 的 ALB 并发送通知以进行手动修复。", "使用 AWS Firewall Manager 创建 WAF 策略，自动将 WAF WebACL 与所有组织账户中的 ALB 和 API Gateway 关联。"], "explanation_zh": "AWS Firewall Manager 支持集中管理 AWS WAF 规则、Shield Advanced 保护、安全组、Network Firewall 策略和 Route 53 Resolver DNS Firewall 规则跨组织。Firewall Manager WAF 策略自动创建 WAF WebACL 并将其与所有成员账户中的范围内资源（ALB、API Gateway、CloudFront 分发）关联。当创建新资源时，Firewall Manager 会自动应用 WAF 策略。StackSets 可以部署 WAF 但不能自动将 WebACL 与新创建的资源关联。"}, {"exam": 2, "id": 63, "question_en": "An organization uses AWS Service Catalog to provide approved CloudFormation templates to developers. Developers need to launch products that create IAM roles and S3 buckets, but the developers themselves should NOT have direct permissions to create IAM roles or S3 buckets outside of Service Catalog.\n \nHow should this be configured?", "options_en": ["Configure a launch constraint on the Service Catalog product that specifies a launch role with permissions to create IAM roles and S3 buckets. Developers only need `servicecatalog:ProvisionProduct` permission.", "Grant developers IAM permissions to create roles and buckets, but use SCPs to restrict usage outside Service Catalog.", "Create a Lambda-backed custom resource in the CloudFormation template that creates resources using an admin role.", "Share the CloudFormation template directly and let developers deploy it with elevated temporary credentials."], "correct": 0, "explanation_en": "Service Catalog launch constraints allow an administrator to specify an IAM role that Service Catalog assumes when launching a product. This means the launch role (not the developer's role) creates the resources defined in the CloudFormation template. Developers only need permission to provision products through Service Catalog, not to create the underlying resources directly. This provides a controlled self-service mechanism where developers can deploy approved architectures without having broad IAM permissions.", "question_zh": "一个组织使用 AWS Service Catalog 向开发人员提供经批准的 CloudFormation 模板。开发人员需要启动创建 IAM 角色和 S3 存储桶的产品，但开发人员自身不应具有在 Service Catalog 之外直接创建 IAM 角色或 S3 存储桶的权限。应如何配置？", "options_zh": ["在 Service Catalog 产品上配置启动约束，指定具有创建 IAM 角色和 S3 存储桶权限的启动角色。开发人员仅需要 servicecatalog:ProvisionProduct 权限。", "授予开发人员创建角色和存储桶的 IAM 权限，但使用 SCP 限制在 Service Catalog 之外的使用。", "在 CloudFormation 模板中创建 Lambda 支持的自定义资源，使用管理员角色创建资源。", "直接共享 CloudFormation 模板，让开发人员使用提升的临时凭证部署它。"], "explanation_zh": "Service Catalog 启动约束允许管理员指定 Service Catalog 在启动产品时代入的 IAM 角色。这意味着启动角色（而非开发人员的角色）创建 CloudFormation 模板中定义的资源。开发人员仅需要通过 Service Catalog 配置产品的权限，而不需要直接创建底层资源的权限。这提供了受控的自助服务机制，开发人员可以部署经批准的架构而无需拥有广泛的 IAM 权限。"}, {"exam": 2, "id": 64, "question_en": "An organization wants to share a set of private subnets in a central networking account with multiple workload accounts so that workload accounts can launch resources (EC2, RDS, Lambda) in these shared subnets without managing their own VPC infrastructure.\n \nWhich service enables this?", "options_en": ["Create VPC peering connections between the networking account and each workload account.", "Deploy a Transit Gateway and create route table entries to connect each workload account's VPC to the central networking VPC.", "Use AWS Resource Access Manager (RAM) to share the subnets with the workload accounts via AWS Organizations, enabling workload accounts to launch resources in the shared subnets.", "Use AWS PrivateLink to create VPC endpoint services that workload accounts can consume."], "correct": 2, "explanation_en": "AWS Resource Access Manager (RAM) supports sharing VPC subnets across accounts within an organization. Workload accounts that receive shared subnets can launch their own resources (EC2 instances, RDS databases, Lambda functions, etc.) in those subnets, but they do not own or manage the VPC, route tables, or internet gateways. This is the recommended approach for centralized VPC management in multi-account architectures. VPC peering and Transit Gateway connect separate VPCs but do not allow resource placement in another account's subnets.", "question_zh": "一个组织希望与多个工作负载账户共享中央网络账户中的一组私有子网，以便工作负载账户可以在这些共享子网中启动资源（EC2、RDS、Lambda），而无需管理自己的 VPC 基础设施。哪个服务能实现这一点？", "options_zh": ["在网络账户和每个工作负载账户之间创建 VPC 对等连接。", "部署 Transit Gateway 并创建路由表条目，将每个工作负载账户的 VPC 连接到中央网络 VPC。", "使用 AWS Resource Access Manager (RAM) 通过 AWS Organizations 与工作负载账户共享子网，使工作负载账户能够在共享子网中启动资源。", "使用 AWS PrivateLink 创建 VPC 端点服务供工作负载账户消费。"], "explanation_zh": "AWS Resource Access Manager (RAM) 支持在组织内跨账户共享 VPC 子网。接收共享子网的工作负载账户可以在这些子网中启动自己的资源（EC2 实例、RDS 数据库、Lambda 函数等），但他们不拥有或管理 VPC、路由表或 Internet Gateway。这是多账户架构中集中式 VPC 管理的推荐方法。VPC 对等和 Transit Gateway 连接分离的 VPC，但不允许在另一个账户的子网中放置资源。"}, {"exam": 2, "id": 65, "question_en": "An application team is preparing for a production launch and needs to evaluate their architecture against AWS security best practices. They want a structured review that identifies high-risk security issues and provides actionable improvement recommendations.\n \nWhich AWS tool provides this capability?", "options_en": ["AWS Trusted Advisor, which provides automated checks for security, cost, and performance.", "The AWS Well-Architected Tool, which guides teams through a structured questionnaire based on the Security pillar (and other pillars), identifies risks, and generates an improvement plan.", "Amazon Inspector, which scans infrastructure for vulnerabilities.", "AWS Security Hub, which aggregates security findings from multiple services."], "correct": 1, "explanation_en": "The AWS Well-Architected Tool provides a structured framework review through interactive questionnaires covering six pillars, including Security. The Security pillar addresses identity and access management, detection, infrastructure protection, data protection, and incident response. After completing the review, the tool identifies high-risk issues (HRIs) and generates an improvement plan with prioritized recommendations. This is a strategic architecture review tool, whereas Trusted Advisor provides tactical automated checks, Inspector scans for vulnerabilities, and Security Hub aggregates operational findings.", "question_zh": "应用程序团队正在准备生产发布，需要根据 AWS 安全最佳实践评估其架构。他们希望进行结构化审查，识别高风险安全问题并提供可操作的改进建议。哪个 AWS 工具提供此能力？", "options_zh": ["AWS Trusted Advisor，提供安全、成本和性能的自动化检查。", "AWS Well-Architected Tool，通过基于安全支柱（和其他支柱）的结构化问卷指导团队，识别风险并生成改进计划。", "Amazon Inspector，扫描基础设施中的漏洞。", "AWS Security Hub，聚合来自多个服务的安全发现结果。"], "explanation_zh": "AWS Well-Architected Tool 通过交互式问卷提供结构化框架审查，涵盖包括安全在内的六个支柱。安全支柱涉及身份和访问管理、检测、基础设施保护、数据保护和事件响应。完成审查后，该工具识别高风险问题 (HRI) 并生成包含优先级建议的改进计划。这是战略性架构审查工具，而 Trusted Advisor 提供战术性自动化检查，Inspector 扫描漏洞，Security Hub 聚合运维发现结果。"}, {"exam": 3, "id": 1, "question_en": "A security team manages multiple Amazon EKS clusters running containerized microservices. They have observed suspicious container behavior including unexpected process executions and privilege escalation attempts. The team needs real-time visibility into runtime threats within their containers without deploying third-party agents.\n \nWhich solution provides this capability with minimal operational overhead?", "options_en": ["Enable Amazon GuardDuty Runtime Monitoring for EKS with the automated agent management feature, which deploys a security agent as a DaemonSet to collect runtime events from containers.", "Install the Amazon Inspector agent on each EKS worker node and configure Inspector to perform continuous behavioral analysis of container processes.", "Deploy Amazon CloudWatch Container Insights with enhanced observability to monitor container process-level activities and generate security alerts.", "Configure AWS Security Hub to receive container runtime events directly from EKS clusters and create custom actions for threat detection."], "correct": 0, "explanation_en": "GuardDuty Runtime Monitoring for EKS provides real-time container threat detection by deploying a lightweight security agent as a DaemonSet on EKS nodes. The automated agent management feature handles deployment and updates without manual intervention, detecting runtime threats such as unexpected process executions, privilege escalations, and container escapes. Inspector focuses on vulnerability scanning rather than runtime threat detection, and CloudWatch Container Insights provides observability metrics but not security threat analysis.", "question_zh": "安全团队管理多个运行容器化微服务的 Amazon EKS 集群。他们观察到可疑的容器行为，包括意外的进程执行和权限升级尝试。该团队需要实时了解容器内的运行时威胁，而无需部署第三方代理。\n \n哪种解决方案能够以最小的运营开销提供此功能？", "options_zh": ["使用自动化代理管理功能为 EKS 启用 Amazon GuardDuty 运行时监控，该功能将安全代理部署为 DaemonSet 以从容器收集运行时事件。", "在每个 EKS 工作线程节点上安装 Amazon Inspector 代理并配置 Inspector 以对容器进程执行持续行为分析。", "部署具有增强可观察性的 Amazon CloudWatch Container Insights，以监控容器进程级活动并生成安全警报。", "配置 AWS Security Hub 以直接从 EKS 集群接收容器运行时事件并创建用于威胁检测的自定义操作。"], "explanation_zh": "GuardDuty Runtime Monitoring for EKS 通过在 EKS 节点上将轻量级安全代理部署为 DaemonSet 来提供实时容器威胁检测。自动化代理管理功能无需手动干预即可处理部署和更新，检测运行时威胁，例如意外的进程执行、权限升级和容器逃逸。 Inspector 专注于漏洞扫描而不是运行时威胁检测，CloudWatch Container Insights 提供可观察性指标，但不提供安全威胁分析。"}, {"exam": 3, "id": 2, "question_en": "A company receives thousands of Security Hub findings daily across 50 AWS accounts. The security operations team struggles to identify the most impactful findings. They need a prioritized view that shows findings grouped by resource type where the severity is CRITICAL, filtered to only production accounts tagged with `env:production`.\n \nWhat should the team configure?", "options_en": ["Create a Security Hub automation rule that moves CRITICAL findings from production accounts into a separate findings collection for manual review.", "Create a Security Hub custom insight with filters for severity label equal to CRITICAL and resource tag env:production, then group results by resource type to identify the most affected resource categories.", "Configure a CloudWatch dashboard that queries Security Hub findings using CloudWatch Logs Insights and creates widgets filtered by severity and account tags.", "Set up an EventBridge rule to capture CRITICAL findings, enrich them with account tags using Lambda, and publish prioritized reports to an SNS topic."], "correct": 1, "explanation_en": "Security Hub custom insights allow creating filtered and grouped views of findings based on attributes such as severity label, resource tags, and account IDs. By configuring a custom insight with appropriate filters and grouping by resource type, the team gets a prioritized dashboard directly within Security Hub. Custom insights are purpose-built for this use case and require no additional infrastructure. Automation rules modify findings but do not provide the analytical grouping view needed for prioritization.", "question_zh": "一家公司每天都会收到来自 50 个 AWS 账户的数千个 Security Hub 结果。安全运营团队努力寻找最具影响力的发现。他们需要一个按优先级排序的视图，显示按资源类型分组的结果，其中严重性为“CRITICAL”，仅筛选到标记有“env:product”的生产帐户。\n \n团队应该配置什么？", "options_zh": ["创建一个 Security Hub 自动化规则，将关键结果从生产帐户移动到单独的结果集合中以供手动审核。", "使用严重性标签等于 CRITICAL 和资源标签 env:product 的筛选器创建 Security Hub 自定义洞察，然后按资源类型对结果进行分组，以确定受影响最严重的资源类别。", "配置 CloudWatch 仪表板，该仪表板使用 CloudWatch Logs Insights 查询 Security Hub 结果并创建按严重性和账户标签过滤的小部件。", "设置 EventBridge 规则来捕获关键发现，使用 Lambda 通过帐户标签丰富它们，并将优先报告发布到 SNS 主题。"], "explanation_zh": "Security Hub 自定义见解允许根据严重性标签、资源标签和账户 ID 等属性创建经过筛选和分组的结果视图。通过使用适当的过滤器配置自定义洞察并按资源类型分组，团队可以直接在 Security Hub 内获得按优先级排序的仪表板。自定义见解是专门为此用例构建的，不需要额外的基础设施。自动化规则会修改结果，但不提供确定优先级所需的分析分组视图。"}, {"exam": 3, "id": 3, "question_en": "A financial services company wants to detect unusual spikes in AWS API activity that might indicate compromised credentials being used for reconnaissance or data exfiltration. The security team needs an automated mechanism that baselines normal API call patterns and alerts when significant deviations occur, without writing custom anomaly detection code.\n \nWhich approach meets these requirements?", "options_en": ["Enable AWS Config with managed rules to monitor API call frequency and trigger Lambda functions when thresholds are exceeded.", "Create CloudWatch Alarms with anomaly detection on CloudTrail log metric filters for each API action that requires monitoring.", "Enable CloudTrail Insights events on the trail, which automatically baselines normal management event API patterns and generates insight events when unusual write or read activity is detected.", "Deploy Amazon GuardDuty with the CloudTrail data source enabled to detect all anomalous API call patterns using machine learning models."], "correct": 2, "explanation_en": "CloudTrail Insights automatically analyzes management events to establish a baseline of normal API call patterns for your account. When it detects unusual activity volumes such as spikes in write or read API calls, it generates insight events without requiring custom anomaly detection code. This is specifically designed for detecting API activity anomalies like credential abuse reconnaissance. GuardDuty uses CloudTrail as a data source but focuses on specific threat types rather than general API volume anomalies.", "question_zh": "一家金融服务公司希望检测 AWS API 活动中的异常峰值，这可能表明被盗的凭证被用于侦察或数据泄露。安全团队需要一种自动化机制，可以对正常 API 调用模式进行基线分析，并在发生重大偏差时发出警报，而无需编写自定义异常检测代码。\n \n哪种方法可以满足这些要求？", "options_zh": ["使用托管规则启用 AWS Config，以监控 API 调用频率并在超过阈值时触发 Lambda 函数。", "为需要监控的每个 API 操作创建 CloudWatch 警报，并在 CloudTrail 日志指标过滤器上进行异常检测。", "在跟踪上启用 CloudTrail Insights 事件，它会自动确定正常管理事件 API 模式的基线，并在检测到异常写入或读取活动时生成洞察事件。", "部署 Amazon GuardDuty，并启用 CloudTrail 数据源，以使用机器学习模型检测所有异常 API 调用模式。"], "explanation_zh": "CloudTrail Insights 自动分析管理事件，为您的账户建立正常 API 调用模式的基线。当它检测到异常活动量（例如写入或读取 API 调用的峰值）时，它会生成洞察事件，而无需自定义异常检测代码。这是专门为检测 API 活动异常（例如凭据滥用侦察）而设计的。 GuardDuty 使用 CloudTrail 作为数据源，但重点关注特定威胁类型，而不是一般 API 量异常。"}, {"exam": 3, "id": 4, "question_en": "A security operations team has configured VPC Flow Logs to publish to CloudWatch Logs. They are investigating a network scanning incident and need to quickly identify the top source IP addresses generating the most rejected traffic across their VPCs over the past 24 hours.\n \nWhich approach provides this analysis most efficiently?", "options_en": ["Export the VPC Flow Logs from CloudWatch to S3, then use Amazon Athena to run SQL queries grouping rejected packets by source IP address.", "Create a CloudWatch Logs Insights query that parses the flow log data and computes the count of REJECT actions grouped by source address.", "Configure Amazon Detective to ingest VPC Flow Logs and use the Detective console to visualize the top contributing IP addresses in the behavior graph.", "Create a CloudWatch Contributor Insights rule on the VPC Flow Logs log group, filtering by REJECT action and ranking contributors by source address to identify the top talkers in real time."], "correct": 3, "explanation_en": "CloudWatch Contributor Insights is designed to analyze log data and identify the top contributors to a metric, making it ideal for finding the top source IP addresses generating rejected traffic. It provides real-time, continuously updated rankings without requiring manual query execution. While CloudWatch Logs Insights can run ad-hoc queries, Contributor Insights provides a persistent and auto-updating view. Exporting to S3 and using Athena introduces unnecessary latency and complexity for real-time analysis.", "question_zh": "安全运营团队已将 VPC 流日志配置为发布到 CloudWatch Logs。他们正在调查网络扫描事件，需要快速识别过去 24 小时内在其 VPC 中产生最多被拒绝流量的主要源 IP 地址。\n \n哪种方法最有效地提供这种分析？", "options_zh": ["将 VPC 流日志从 CloudWatch 导出到 S3，然后使用 Amazon Athena 运行 SQL 查询，按源 IP 地址对拒绝的数据包进行分组。", "创建一个 CloudWatch Logs Insights 查询，用于解析流日志数据并计算按源地址分组的 REJECT 操作计数。", "配置 Amazon Detective 以提取 VPC 流日志并使用 Detective 控制台可视化行为图中贡献最大的 IP 地址。", "在 VPC Flow Logs 日志组上创建 CloudWatch Contributor Insights 规则，按 REJECT 操作进行过滤，并按源地址对贡献者进行排名，以实时识别流量最大的用户。"], "explanation_zh": "CloudWatch Contributor Insights 旨在分析日志数据并识别指标的主要贡献者，使其成为查找生成被拒绝流量的主要源 IP 地址的理想选择。它提供实时、持续更新的排名，无需手动执行查询。虽然 CloudWatch Logs Insights 可以运行即席查询，但 Contributor Insights 提供持久且自动更新的视图。导出到 S3 并使用 Athena 会给实时分析带来不必要的延迟和复杂性。"}, {"exam": 3, "id": 5, "question_en": "A multinational company collects security logs from AWS CloudTrail, Amazon VPC Flow Logs, Amazon Route 53 resolver query logs, and several third-party security tools. Each source uses a different log format, making it difficult for analysts to correlate events across sources. The company needs to normalize all security data into a single schema for efficient cross-source analysis.\n \nWhich solution addresses this requirement?", "options_en": ["Enable Amazon Security Lake, which automatically normalizes supported AWS log sources into the Open Cybersecurity Schema Framework (OCSF) format and supports ingesting third-party data through custom sources that conform to OCSF.", "Configure Amazon OpenSearch Service with index patterns for each log source and use OpenSearch dashboards to create cross-index visualizations that present a unified view.", "Create AWS Glue ETL jobs for each log source that transform data into a common Parquet schema stored in S3, then query using Athena with federated views.", "Deploy Amazon Kinesis Data Firehose streams for each source with Lambda transformation functions that convert logs into a standardized JSON format in a central S3 bucket."], "correct": 0, "explanation_en": "Amazon Security Lake automatically normalizes supported AWS sources including CloudTrail, VPC Flow Logs, and Route 53 into the OCSF standard schema. OCSF provides a vendor-agnostic open standard for security event data, enabling consistent cross-source correlation. Third-party sources can also be ingested via custom source integrations that conform to OCSF. Custom ETL solutions with Glue or Kinesis would require ongoing maintenance as schemas evolve and do not leverage a recognized industry standard.", "question_zh": "一家跨国公司从 AWS CloudTrail、Amazon VPC 流日志、Amazon Route 53 解析器查询日志和多个第三方安全工具收集安全日志。每个来源都使用不同的日志格式，这使得分析师很难将跨来源的事件关联起来。该公司需要将所有安全数据标准化为单一模式，以进行高效的跨源分析。\n \n哪种解决方案可以满足此要求？", "options_zh": ["启用 Amazon Security Lake，它会自动将支持的 AWS 日志源规范化为开放网络安全架构框架 (OCSF) 格式，并支持通过符合 OCSF 的自定义源提取第三方数据。", "使用每个日志源的索引模式配置 Amazon OpenSearch Service，并使用 OpenSearch 仪表板创建呈现统一视图的跨索引可视化。", "为每个日志源创建 AWS Glue ETL 作业，将数据转换为存储在 S3 中的通用 Parquet 架构，然后使用 Athena 和联合视图进行查询。", "使用 Lambda 转换函数为每个源部署 Amazon Kinesis Data Firehose 流，将日志转换为中央 S3 存储桶中的标准化 JSON 格式。"], "explanation_zh": "Amazon Security Lake 会自动将受支持的 AWS 源（包括 CloudTrail、VPC 流日志和 Route 53）规范化为 OCSF 标准架构。 OCSF 为安全事件数据提供与供应商无关的开放标准，从而实现一致的跨源关联。还可以通过符合 OCSF 的自定义源集成来摄取第三方源。随着模式的发展，使用 Glue 或 Kinesis 的自定义 ETL 解决方案需要持续维护，并且不利用公认的行业标准。"}, {"exam": 3, "id": 6, "question_en": "A security team uses Amazon Athena to query CloudTrail logs stored in S3. Their queries scan terabytes of raw JSON data daily, resulting in slow performance and high costs. They want to optimize query performance and reduce costs while maintaining the ability to run ad-hoc security investigations on historical data.\n \nWhat should the team implement?", "options_en": ["Enable Athena query result reuse caching and increase the DPU allocation for the Athena workgroup to improve query processing speed.", "Use Athena CREATE TABLE AS SELECT (CTAS) statements to convert raw JSON CloudTrail logs into partitioned Apache Parquet format, reducing data scanned through columnar storage and partition pruning.", "Migrate all CloudTrail logs from S3 to Amazon Redshift Serverless, which provides columnar storage and automatic compression for faster analytical queries.", "Configure CloudTrail to deliver logs directly in Apache ORC format to S3 and create Athena tables with projection-based partitioning on the delivery prefix."], "correct": 1, "explanation_en": "Athena CTAS allows transforming raw JSON CloudTrail logs into optimized columnar formats like Apache Parquet with partitioning by date, region, or event source. Parquet provides columnar compression and predicate pushdown, dramatically reducing the amount of data scanned. Partition pruning further limits scans to relevant time ranges. CloudTrail does not natively deliver logs in ORC format, and migrating to Redshift introduces unnecessary infrastructure management for ad-hoc investigations.", "question_zh": "安全团队使用 Amazon Athena 查询存储在 S3 中的 CloudTrail 日志。他们的查询每天扫描 TB 级的原始 JSON 数据，导致性能缓慢且成本高昂。他们希望优化查询性能并降低成本，同时保持对历史数据运行临时安全调查的能力。\n \n团队应该实施什么？", "options_zh": ["启用 Athena 查询结果重用缓存并增加 Athena 工作组的 DPU 分配，以提高查询处理速度。", "使用 Athena CREATE TABLE AS SELECT (CTAS) 语句将原始 JSON CloudTrail 日志转换为分区 Apache Parquet 格式，从而减少通过列式存储和分区修剪扫描的数据。", "将所有 CloudTrail 日志从 S3 迁移到 Amazon Redshift Serverless，后者提供列式存储和自动压缩，以实现更快的分析查询。", "配置 CloudTrail 以将 Apache ORC 格式的日志直接传送到 S3，并在传送前缀上创建具有基于投影的分区的 Athena 表。"], "explanation_zh": "Athena CTAS 允许将原始 JSON CloudTrail 日志转换为优化的列式格式，例如 Apache Parquet，并按日期、区域或事件源进行分区。 Parquet 提供列压缩和谓词下推，显着减少扫描的数据量。分区修剪进一步将扫描限制在相关时间范围内。 CloudTrail 本身并不以 ORC 格式提供日志，迁移到 Redshift 会为临时调查带来不必要的基础设施管理。"}, {"exam": 3, "id": 7, "question_en": "A large enterprise operates OpenSearch Service domains in five different AWS accounts, each collecting security logs from services in that account. The central security team needs to search across all five domains from a single interface to investigate incidents that span multiple accounts, without consolidating all data into a single domain.\n \nWhich approach should they use?", "options_en": ["Configure each OpenSearch domain to replicate indices to a central domain using OpenSearch cross-cluster replication, then query the central domain.", "Set up Amazon Kinesis Data Firehose streams in each account to duplicate security log data to a shared S3 bucket, then use a central OpenSearch domain to index the shared data.", "Configure OpenSearch cross-cluster search connections between the central security account domain and each remote account domain, allowing the security team to query all domains from a single endpoint.", "Deploy an OpenSearch Serverless collection with a data access policy that grants the security team read access to indices across all five account domains."], "correct": 2, "explanation_en": "OpenSearch cross-cluster search enables querying multiple remote domains from a single domain without moving or duplicating data. The central security domain establishes connections to each remote domain, and analysts ca
