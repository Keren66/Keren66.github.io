n run queries that span all connected clusters. This avoids the storage costs and complexity of data replication or consolidation. OpenSearch Serverless collections operate independently and do not provide cross-domain query federation.", "question_zh": "一家大型企业在五个不同的 AWS 账户中运行 OpenSearch Service 域，每个账户都从该账户中的服务收集安全日志。中央安全团队需要从单个界面跨所有五个域进行搜索，以调查跨多个帐户的事件，而无需将所有数据合并到单个域中。\n \n他们应该使用哪种方法？", "options_zh": ["将每个 OpenSearch 域配置为使用 OpenSearch 跨集群复制将索引复制到中央域，然后查询中央域。", "在每个账户中设置 Amazon Kinesis Data Firehose 流，以将安全日志数据复制到共享 S3 存储桶，然后使用中央 OpenSearch 域对共享数据建立索引。", "在中央安全帐户域和每个远程帐户域之间配置 OpenSearch 跨集群搜索连接，允许安全团队从单个端点查询所有域。", "使用数据访问策略部署 OpenSearch Serverless 集合，该策略授予安全团队对所有五个帐户域的索引的读取访问权限。"], "explanation_zh": "OpenSearch 跨集群搜索允许从单个域查询多个远程域，而无需移动或复制数据。中央安全域与每个远程域建立连接，分析人员可以运行跨所有连接集群的查询。这避免了数据复制或整合的存储成本和复杂性。 OpenSearch Serverless 集合独立运行，不提供跨域查询联合。"}, {"exam": 3, "id": 8, "question_en": "A security team wants to build operational dashboards that combine CloudWatch metrics, CloudWatch Logs Insights results, and AWS X-Ray trace data into unified security visualizations. They need role-based access control for dashboard viewers and editors, with authentication through their existing SAML identity provider.\n \nWhich solution meets these requirements with the least operational overhead?", "options_en": ["Deploy a self-managed Grafana instance on Amazon ECS Fargate, configure CloudWatch and X-Ray data source plugins, and integrate SAML authentication through an Application Load Balancer.", "Create Amazon CloudWatch dashboards with cross-account and cross-Region widgets, and use IAM policies to control access for different security team members.", "Build custom dashboards using Amazon QuickSight with CloudWatch as a data source, and configure QuickSight to use the existing SAML identity provider for authentication.", "Use Amazon Managed Grafana with workspace authentication configured through the existing SAML identity provider, add CloudWatch and X-Ray as data sources, and assign viewer and editor roles to team members."], "correct": 3, "explanation_en": "Amazon Managed Grafana provides a fully managed Grafana environment that natively supports SAML authentication, CloudWatch, CloudWatch Logs, and X-Ray as data sources. It offers built-in role-based access control with viewer and editor roles, eliminating the need to manage infrastructure. CloudWatch dashboards lack SAML integration and the rich visualization capabilities of Grafana. A self-managed Grafana instance on ECS would require significant operational overhead for patching, scaling, and authentication configuration.", "question_zh": "安全团队希望构建操作仪表板，将 CloudWatch 指标、CloudWatch Logs Insights 结果和 AWS X-Ray 跟踪数据组合到统一的安全可视化中。他们需要对仪表板查看者和编辑者进行基于角色的访问控制，并通过现有的 SAML 身份提供商进行身份验证。\n \n哪种解决方案能够以最少的运营开销满足这些要求？", "options_zh": ["在 Amazon ECS Fargate 上部署自我管理的 Grafana 实例，配置 CloudWatch 和 X-Ray 数据源插件，并通过 Application Load Balancer 集成 SAML 身份验证。", "使用跨账户和跨区域小部件创建 Amazon CloudWatch 控制面板，并使用 IAM 策略来控制不同安全团队成员的访问。", "使用 Amazon QuickSight 和 CloudWatch 作为数据源构建自定义控制面板，并将 QuickSight 配置为使用现有的 SAML 身份提供商进行身份验证。", "使用 Amazon Managed Grafana 以及通过现有 SAML 身份提供商配置的工作区身份验证，添加 CloudWatch 和 X-Ray 作为数据源，并向团队成员分配查看者和编辑者角色。"], "explanation_zh": "Amazon Managed Grafana 提供完全托管的 Grafana 环境，该环境本身支持 SAML 身份验证、CloudWatch、CloudWatch Logs 和 X-Ray 作为数据源。它提供内置的基于角色的访问控制以及查看者和编辑者角色，从而无需管理基础设施。 CloudWatch 仪表板缺乏 SAML 集成和 Grafana 丰富的可视化功能。 ECS 上的自我管理 Grafana 实例需要大量的运营开销来进行修补、扩展和身份验证配置。"}, {"exam": 3, "id": 9, "question_en": "A network security team wants to identify which AWS services their EC2 instances are communicating with by analyzing VPC Flow Logs. They need to distinguish between traffic destined for S3, DynamoDB, and other AWS services without performing IP address lookups against published AWS IP ranges.\n \nWhat should the team configure?", "options_en": ["Configure VPC Flow Logs with a version 5 custom format that includes the `pkt-dst-aws-service` field, which identifies the AWS service name associated with the destination IP address of each flow.", "Enable VPC Flow Logs in the default format and use AWS Lambda to enrich each flow record by querying the AWS IP address ranges JSON file to resolve service names.", "Configure VPC Flow Logs to publish to CloudWatch Logs and create metric filters that match known AWS service IP ranges to identify service-specific traffic patterns.", "Enable AWS Network Manager and use its built-in traffic analytics to automatically classify VPC traffic by destination AWS service name."], "correct": 0, "explanation_en": "VPC Flow Logs version 5 introduced the `pkt-dst-aws-service` field, which directly identifies the AWS service associated with the destination IP address in each flow record. This eliminates the need for external IP range lookups or Lambda enrichment. The field provides values such as S3, DYNAMODB, and other AWS service identifiers. Using Lambda to query the AWS IP ranges file adds latency, cost, and complexity compared to the native field.", "question_zh": "网络安全团队希望通过分析 VPC 流日志来确定其 EC2 实例正在与哪些 AWS 服务进行通信。他们需要区分发往 S3、DynamoDB 和其他 AWS 服务的流量，而无需针对已发布的 AWS IP 范围执行 IP 地址查找。\n \n团队应该配置什么？", "options_zh": ["使用版本 5 自定义格式配置 VPC 流日志，其中包含“pkt-dst-aws-service”字段，该字段标识与每个流的目标 IP 地址关联的 AWS 服务名称。", "以默认格式启用 VPC 流日志，并使用 AWS Lambda 通过查询 AWS IP 地址范围 JSON 文件来解析服务名称来丰富每个流记录。", "配置 VPC 流日志以发布到 CloudWatch Logs 并创建与已知 AWS 服务 IP 范围匹配的指标筛选器，以识别特定于服务的流量模式。", "启用 AWS Network Manager 并使用其内置流量分析按目标 AWS 服务名称自动对 VPC 流量进行分类。"], "explanation_zh": "VPC 流日志版本 5 引入了“pkt-dst-aws-service”字段，该字段直接标识与每个流记录中的目标 IP 地址关联的 AWS 服务。这消除了外部 IP 范围查找或 Lambda 丰富的需要。该字段提供 S3、DYNAMODB 和其他 AWS 服务标识符等值。与本机字段相比，使用 Lambda 查询 AWS IP 范围文件会增加延迟、成本和复杂性。"}, {"exam": 3, "id": 10, "question_en": "A security team receives a GuardDuty finding indicating that an EC2 instance may be compromised. They want GuardDuty to automatically scan the instance EBS volumes for malware without installing any antivirus agents on the instance and without affecting the running workload.\n \nWhich feature provides this capability?", "options_en": ["Enable Amazon Inspector deep inspection for EC2, which automatically scans EBS volumes for malware signatures when a GuardDuty finding is generated.", "Enable GuardDuty Malware Protection, which automatically creates snapshots of the affected EC2 instance EBS volumes and scans them for malware in an isolated service account without impacting the running instance.", "Configure AWS Systems Manager to run an on-demand antivirus scan document on the affected EC2 instance when triggered by a GuardDuty finding through EventBridge.", "Enable Amazon Detective malware analysis, which performs automated forensic scanning of EBS volumes associated with GuardDuty findings."], "correct": 1, "explanation_en": "GuardDuty Malware Protection performs agentless malware scanning by creating snapshots of the affected EC2 instance EBS volumes and analyzing them in an isolated AWS-managed environment. This approach does not require installing agents on the instance and has no impact on the running workload. The scanning occurs automatically when certain GuardDuty findings are generated. Inspector provides vulnerability scanning rather than malware detection, and Detective provides investigation tools rather than malware scanning.", "question_zh": "安全团队收到 GuardDuty 调查结果，表明 EC2 实例可能受到威胁。他们希望 GuardDuty 能够自动扫描实例 EBS 卷中的恶意软件，而无需在实例上安装任何防病毒代理，也不会影响正在运行的工作负载。\n \n哪个功能提供了此功能？", "options_zh": ["为 EC2 启用 Amazon Inspector 深度检查，它会在生成 GuardDuty 结果时自动扫描 EBS 卷是否存在恶意软件签名。", "启用 GuardDuty 恶意软件防护，它会自动创建受影响的 EC2 实例 EBS 卷的快照，并在隔离的服务帐户中扫描它们是否存在恶意软件，而不会影响正在运行的实例。", "将 AWS Systems Manager 配置为当通过 EventBridge 的 GuardDuty 发现触发时，在受影响的 EC2 实例上运行按需防病毒扫描文档。", "启用 Amazon Detective 恶意软件分析，该分析会对与 GuardDuty 发现相关的 EBS 卷执行自动取证扫描。"], "explanation_zh": "GuardDuty 恶意软件防护通过创建受影响的 EC2 实例 EBS 卷的快照并在隔离的 AWS 托管环境中对其进行分析来执行无代理恶意软件扫描。此方法不需要在实例上安装代理，并且不会影响正在运行的工作负载。当生成某些 GuardDuty 结果时，扫描会自动进行。 Inspector 提供漏洞扫描而不是恶意软件检测，Detective 提供调查工具而不是恶意软件扫描。"}, {"exam": 3, "id": 11, "question_en": "A company wants to automate their incident response process. When a GuardDuty high-severity finding is detected, the workflow should isolate the affected EC2 instance, create forensic snapshots, notify the security team, and wait for manual approval before terminating the instance. The workflow must handle failures and retries for each step independently.\n \nWhich approach best orchestrates this multi-step workflow?", "options_en": ["Create an EventBridge rule that triggers a single Lambda function containing all incident response logic with try-catch blocks for each step and SNS notifications for approval.", "Configure AWS Systems Manager Incident Manager to define an incident response plan with automated runbooks that execute each step sequentially.", "Use AWS Step Functions to orchestrate the workflow with individual states for isolation, snapshot creation, notification, and a Wait for Callback task that pauses execution until the security team approves instance termination.", "Deploy an Amazon MWAA (Managed Apache Airflow) DAG that defines the incident response steps as tasks with retry policies and uses an SQS queue for the approval gate."], "correct": 2, "explanation_en": "AWS Step Functions is ideal for orchestrating multi-step incident response workflows because it provides built-in error handling, retries, and the Wait for Callback integration pattern that pauses execution until an external approval is received. Each step runs independently with its own error handling. A single Lambda function would be limited by execution time constraints and lacks native orchestration features. MWAA introduces unnecessary complexity for event-driven security automation.", "question_zh": "一家公司希望实现事件响应流程自动化。当检测到 GuardDuty 高严重性发现时，工作流程应隔离受影响的 EC2 实例、创建取证快照、通知安全团队，并在终止实例之前等待手动批准。工作流必须独立处理每个步骤的失败和重试。\n \n哪种方法最能协调这个多步骤工作流程？", "options_zh": ["创建一个 EventBridge 规则，该规则触发单个 Lambda 函数，该函数包含所有事件响应逻辑以及每个步骤的 try-catch 块和用于批准的 SNS 通知。", "配置 AWS Systems Manager 事件管理器，以使用按顺序执行每个步骤的自动运行手册来定义事件响应计划。", "使用 AWS Step Functions 编排具有隔离、快照创建、通知和等待回调任务的各个状态的工作流程，该任务会暂停执行，直到安全团队批准实例终止。", "部署 Amazon MWAA（托管 Apache Airflow）DAG，将事件响应步骤定义为具有重试策略的任务，并使用 SQS 队列作为审批门。"], "explanation_zh": "AWS Step Functions 非常适合编排多步骤事件响应工作流程，因为它提供内置的错误处理、重试和等待回调集成模式，该模式会暂停执行，直到收到外部批准。每个步骤独立运行并具有自己的错误处理。单个 Lambda 函数将受到执行时间的限制，并且缺乏本机编排功能。 MWAA 给事件驱动的安全自动化带来了不必要的复杂性。"}, {"exam": 3, "id": 12, "question_en": "During a security incident, a security analyst discovers multiple GuardDuty findings across different AWS accounts and services that appear to be related to the same threat actor. The analyst needs to visualize how these findings are connected and understand the attack chain across IAM users, EC2 instances, and S3 buckets involved.\n \nWhich service provides this correlation capability?", "options_en": ["Use Amazon Detective finding groups, which automatically correlate related GuardDuty findings across accounts and resources into grouped visualizations that show the attack chain and affected entities.", "Configure Security Hub with cross-account aggregation and use the Related Findings feature to manually link findings that share common indicators of compromise.", "Deploy Amazon OpenSearch Security Analytics with correlation rules that match findings from different accounts based on shared IP addresses, IAM principals, and timestamps.", "Enable Amazon Security Lake and use Athena queries to join findings from different accounts based on common attributes like source IP and user identity."], "correct": 0, "explanation_en": "Amazon Detective finding groups automatically correlate related security findings from GuardDuty across multiple accounts and services. Detective uses graph analysis to identify connections between affected resources such as IAM users, EC2 instances, and S3 buckets, presenting the attack chain as a visual group. This provides cross-service and cross-account correlation without manual linking. Security Hub can aggregate findings but does not automatically correlate them into attack chain visualizations.", "question_zh": "在安全事件期间，安全分析师在不同的 AWS 账户和服务中发现多个 GuardDuty 发现结果，这些结果似乎与同一威胁参与者相关。分析师需要可视化这些发现如何相互关联，并了解跨 IAM 用户、EC2 实例和所涉及的 S3 存储桶的攻击链。\n \n哪个服务提供这种关联功能？", "options_zh": ["使用 Amazon Detective 发现组，它会自动将跨账户和资源的相关 GuardDuty 发现关联到分组可视化中，以显示攻击链和受影响的实体。", "使用跨账户聚合配置 Security Hub，并使用相关发现功能手动链接共享常见危害指标的发现结果。", "使用关联规则部署 Amazon OpenSearch Security Analytics，这些规则根据共享 IP 地址、IAM 委托人和时间戳来匹配来自不同账户的结果。", "启用 Amazon Security Lake 并使用 Athena 查询根据源 IP 和用户身份等通用属性连接来自不同账户的结果。"], "explanation_zh": "Amazon Detective 发现组会自动将 GuardDuty 跨多个账户和服务的相关安全发现关联起来。 Detective 使用图形分析来识别受影响的资源（例如 IAM 用户、EC2 实例和 S3 存储桶）之间的连接，将攻击链呈现为可视化组。这提供了跨服务和跨账户关联，无需手动链接。 Security Hub 可以聚合发现结果，但不会自动将它们关联到攻击链可视化中。"}, {"exam": 3, "id": 13, "question_en": "A disaster recovery team needs to validate that their application can withstand an Availability Zone failure. They want to simulate the failure of an AZ by stopping EC2 instances and pausing Auto Scaling in a specific AZ, observe the application behavior, and automatically roll back if critical CloudWatch alarms trigger.\n \nWhich approach should the team use?", "options_en": ["Create a Lambda function that terminates EC2 instances in the target AZ and suspends Auto Scaling processes, with a CloudWatch alarm trigger that re-launches instances if metrics breach thresholds.", "Create an AWS Fault Injection Service (FIS) experiment template with actions to stop EC2 instances and pause Auto Scaling in the target AZ, and configure stop conditions linked to CloudWatch alarms to automatically halt the experiment if critical metrics are breached.", "Use AWS Systems Manager Automation to run a runbook that stops instances in the target AZ and creates a CloudWatch composite alarm that triggers a rollback runbook if the application becomes unhealthy.", "Configure AWS Application Recovery Controller to simulate an AZ failure by shifting traffic away from the affected AZ using routing controls, while monitoring readiness checks for automatic recovery."], "correct": 1, "explanation_en": "AWS Fault Injection Service (FIS) is purpose-built for chaos engineering experiments. FIS experiment templates support actions like stopping EC2 instances and pausing Auto Scaling in a specific AZ, with stop conditions that automatically halt the experiment when CloudWatch alarms breach thresholds. This provides controlled blast radius and automatic safety mechanisms. Custom Lambda solutions lack the built-in safety controls and experiment tracking that FIS provides natively.", "question_zh": "灾难恢复团队需要验证其应用程序是否能够承受可用区故障。他们希望通过停止 EC2 实例并暂停特定可用区中的 Auto Scaling 来模拟可用区的故障，观察应用程序行为，并在触发关键 CloudWatch 警报时自动回滚。\n \n团队应该使用哪种方法？", "options_zh": ["创建一个 Lambda 函数，用于终止目标可用区中的 EC2 实例并暂停 Auto Scaling 进程，并使用 CloudWatch 警报触发器在指标违反阈值时重新启动实例。", "创建 AWS 故障注入服务 (FIS) 实验模板，其中包含停止 EC2 实例并暂停目标可用区中的 Auto Scaling 的操作，并配置链接到 CloudWatch 警报的停止条件，以便在违反关键指标时自动停止实验。", "使用 AWS Systems Manager Automation 运行 Runbook，该 Runbook 会停止目标可用区中的实例并创建 CloudWatch 复合警报，以便在应用程序运行状况不佳时触发回滚 Runbook。", "配置 AWS Application Recovery Controller 以通过使用路由控制将流量从受影响的可用区移走来模拟可用区故障，同时监控自动恢复的准备情况检查。"], "explanation_zh": "AWS 故障注入服务 (FIS) 专为混沌工程实验而构建。 FIS 实验模板支持停止 EC2 实例和在特定可用区暂停 Auto Scaling 等操作，并具有在 CloudWatch 警报超出阈值时自动停止实验的停止条件。这提供了受控的爆炸半径和自动安全机制。自定义 Lambda 解决方案缺乏 FIS 本身提供的内置安全控制和实验跟踪。"}, {"exam": 3, "id": 14, "question_en": "An organization runs a mission-critical application across two AWS Regions in an active-passive configuration. During a recent regional outage, the failover took too long because the team discovered the standby Region had configuration drift and was not ready to accept traffic. The team needs continuous validation of standby readiness and instant traffic failover.\n \nWhich solution addresses both requirements?", "options_en": ["Deploy AWS Global Accelerator with health checks on both Regions and configure automatic failover when the primary Region health check fails.", "Use Route 53 health checks with calculated health checks across both Regions and configure DNS failover routing policies with low TTL values.", "Implement AWS CloudFormation drift detection scheduled hourly on both Regions and use EventBridge to trigger Route 53 failover when drift is detected.", "Configure Amazon Application Recovery Controller with readiness checks to continuously audit resource configurations across both Regions, and use routing controls to perform instant traffic failover through a highly available data plane."], "correct": 3, "explanation_en": "Amazon Application Recovery Controller provides readiness checks that continuously audit whether resources in the standby Region match the configuration of the primary Region, detecting issues like insufficient capacity or mismatched configurations before failover is needed. Routing controls enable instant and reliable failover through a dedicated highly available data plane independent of the control plane. Global Accelerator provides automatic failover based on health checks but does not validate standby readiness or detect configuration drift.", "question_zh": "组织以主动-被动配置跨两个 AWS 区域运行任务关键型应用程序。在最近的一次区域中断期间，故障转移花费了太长时间，因为团队发现备用区域存在配置漂移并且未准备好接受流量。团队需要持续验证备用准备情况和即时流量故障转移。\n \n哪种解决方案可以同时满足这两个要求？", "options_zh": ["部署 AWS Global Accelerator，在两个区域上进行运行状况检查，并在主区域运行状况检查失败时配置自动故障转移。", "将 Route 53 运行状况检查与跨两个区域的计算运行状况检查结合使用，并配置具有低 TTL 值的 DNS 故障转移路由策略。", "在这两个区域上实施每小时安排一次的 AWS CloudFormation 偏差检测，并在检测到偏差时使用 EventBridge 触发 Route 53 故障转移。", "配置 Amazon Application Recovery Controller 进行就绪检查，以持续审核两个区域的资源配置，并使用路由控制通过高度可用的数据平面执行即时流量故障转移。"], "explanation_zh": "Amazon Application Recovery Controller 提供准备情况检查，持续审核备用区域中的资源是否与主区域的配置匹配，从而在需要进行故障转移之前检测到容量不足或配置不匹配等问题。路由控制通过独立于控制平面的专用高可用数据平面实现即时、可靠的故障转移。 Global Accelerator 提供基于运行状况检查的自动故障转移，但不验证备用就绪情况或检测配置偏差。"}, {"exam": 3, "id": 15, "question_en": "An incident responder needs to isolate a potentially compromised EC2 instance for forensic analysis. The instance must be isolated from all network traffic immediately, but the running state and memory contents must be preserved. The responder also needs to capture the current disk state for analysis on a separate forensic workstation.\n \nWhat is the correct sequence of actions?", "options_en": ["Stop the instance to preserve its state, detach the instance from its VPC, create AMIs of the instance, and launch the AMIs in an isolated forensic VPC for analysis.", "Terminate the internet gateway route, modify the network ACL to deny all traffic, create EBS snapshots, and restore them on a forensic workstation in a separate account.", "Replace the instance security groups with a forensic isolation security group that has no inbound or outbound rules, create EBS snapshots of all attached volumes while the instance is running, and mount the snapshot volumes on a forensic workstation in an isolated VPC.", "Detach the instance Elastic Network Interface, create EBS snapshots of all volumes, launch a new instance from the snapshots in a forensic VPC, and then stop the compromised instance."], "correct": 2, "explanation_en": "Replacing security groups with an isolation group that has no rules immediately blocks all network traffic while keeping the instance running and preserving volatile memory contents. Creating EBS snapshots while the instance is running captures the disk state without disrupting the instance. Stopping the instance would lose volatile memory and running process data. Detaching the ENI would also disrupt the instance state and could interfere with forensic investigation of network connections.", "question_zh": "事件响应人员需要隔离可能受到损害的 EC2 实例以进行取证分析。实例必须立即与所有网络流量隔离，但必须保留运行状态和内存内容。响应者还需要捕获当前磁盘状态，以便在单独的取证工作站上进行分析。\n \n正确的操作顺序是什么？", "options_zh": ["停止实例以保留其状态，将实例与其 VPC 分离，创建实例的 AMI，并在隔离的取证 VPC 中启动 AMI 进行分析。", "终止互联网网关路由，修改网络 ACL 以拒绝所有流量，创建 EBS 快照，并在单独帐户的取证工作站上将其恢复。", "将实例安全组替换为没有入站或出站规则的取证隔离安全组，在实例运行时创建所有附加卷的 EBS 快照，并将快照卷挂载到隔离 VPC 中的取证工作站上。", "分离实例弹性网络接口，创建所有卷的 EBS 快照，从取证 VPC 中的快照启动新实例，然后停止受感染的实例。"], "explanation_zh": "使用没有规则的隔离组替换安全组会立即阻止所有网络流量，同时保持实例运行并保留易失性内存内容。在实例运行时创建 EBS 快照可以捕获磁盘状态，而不会中断实例。停止实例将丢失易失性内存和正在运行的进程数据。分离 ENI 还会破坏实例状态，并可能干扰网络连接的取证调查。"}, {"exam": 3, "id": 16, "question_en": "A company runs a public-facing web application behind an Application Load Balancer with Auto Scaling. During a recent DDoS attack, the Auto Scaling group scaled out significantly, resulting in a large unexpected AWS bill. The company wants protection against future DDoS-induced cost spikes while maintaining the ability to scale during attacks to absorb traffic.\n \nWhich solution addresses the cost concern?", "options_en": ["Subscribe to AWS Shield Advanced, which provides cost protection that credits charges for scaling events caused by DDoS attacks on protected resources including EC2 instances, Elastic Load Balancers, and CloudFront distributions.", "Configure Auto Scaling group maximum capacity limits to prevent excessive scaling during DDoS attacks and use AWS WAF rate-based rules to drop attack traffic before it reaches the instances.", "Deploy Amazon CloudFront in front of the ALB to absorb DDoS traffic at the edge, and set up AWS Budgets alerts to notify the team when costs exceed expected thresholds.", "Enable Shield Standard (included by default) and configure CloudWatch alarms on the Auto Scaling group desired capacity to trigger an SNS alert when scaling exceeds normal patterns."], "correct": 0, "explanation_en": "AWS Shield Advanced provides DDoS cost protection, meaning AWS credits your account for charges that resulted from DDoS-related scaling of protected resources. This includes charges for EC2 instances, Elastic Load Balancers, CloudFront, Global Accelerator, and Route 53. Setting Auto Scaling maximum limits would protect costs but could cause the application to become unavailable during an attack. Shield Standard does not include cost protection or DDoS response team access.", "question_zh": "一家公司在具有 Auto Scaling 功能的应用程序负载均衡器后面运行面向公众的 Web 应用程序。在最近的一次 DDoS 攻击中，Auto Scaling 组大幅扩展，导致 AWS 产生了巨额意外费用。该公司希望防范未来 DDoS 引发的成本飙升，同时保持在攻击期间扩展以吸收流量的能力。\n \n哪种解决方案可以解决成本问题？", "options_zh": ["订阅 AWS Shield Advanced，它提供成本保护，可抵扣因对受保护资源（包括 EC2 实例、弹性负载均衡器和 CloudFront 发行版）进行 DDoS 攻击而导致的扩展事件的费用。", "配置 Auto Scaling 组最大容量限制，以防止 DDoS 攻击期间过度扩展，并使用 AWS WAF 基于速率的规则在攻击流量到达实例之前将其丢弃。", "在 ALB 前面部署 Amazon CloudFront 以吸收边缘的 DDoS 流量，并设置 AWS 预算警报以在成本超过预期阈值时通知团队。", "启用 Shield Standard（默认包含）并在 Auto Scaling 组所需容量上配置 CloudWatch 警报，以便在扩展超出正常模式时触发 SNS 警报。"], "explanation_zh": "AWS Shield Advanced 提供 DDoS 成本保护，这意味着 AWS 会将因与 DDoS 相关的受保护资源扩展而产生的费用计入您的账户。这包括 EC2 实例、弹性负载均衡器、CloudFront、Global Accelerator 和 Route 53 的费用。设置 Auto Scaling 最大限制可以保护成本，但可能会导致应用程序在攻击期间变得不可用。 Shield Standard 不包括成本保护或 DDoS 响应团队访问权限。"}, {"exam": 3, "id": 17, "question_en": "A security team uses AWS Config rules to monitor resource compliance. When a security group is found to be non-compliant because it allows unrestricted SSH access (0.0.0.0/0 on port 22), the team wants the offending inbound rule to be automatically removed within minutes without human intervention.\n \nWhich approach provides automated remediation?", "options_en": ["Configure the AWS Config rule with a manual remediation action that sends an SNS notification to the security team, who then removes the rule using a predefined SSM Automation document.", "Create a CloudWatch Events rule that monitors Config compliance changes and triggers a Step Functions workflow to evaluate and remediate non-compliant security groups.", "Create an Amazon EventBridge rule that matches AWS Config compliance change events for the security group rule, and target an SSM Automation document that revokes the non-compliant ingress rule.", "Enable AWS Config auto-remediation with the `AWS-DisablePublicAccessForSecurityGroup` SSM document attached to the Config rule, which blocks all public access to the security group."], "correct": 2, "explanation_en": "An EventBridge rule matching Config compliance change events can trigger an SSM Automation document to automatically remove the specific non-compliant ingress rule allowing unrestricted SSH. This provides granular remediation within minutes. While Config does support auto-remediation natively, the `AWS-DisablePublicAccessForSecurityGroup` document removes all public access rules, not just the offending SSH rule, which could disrupt legitimate public-facing services. EventBridge with a targeted SSM document provides more precise remediation.", "question_zh": "安全团队使用 AWS Config 规则来监控资源合规性。当发现安全组因允许不受限制的 SSH 访问（端口 22 上的 0.0.0.0/0）而不合规时，团队希望在几分钟内自动删除违规的入站规则，而无需人工干预。\n \n哪种方法提供自动修复？", "options_zh": ["使用手动修复操作配置 AWS Config 规则，该操作向安全团队发送 SNS 通知，然后安全团队使用预定义的 SSM 自动化文档删除该规则。", "创建一个 CloudWatch Events 规则，用于监控 Config 合规性更改并触发 Step Functions 工作流来评估和修复不合规的安全组。", "创建与安全组规则的 AWS Config 合规性更改事件匹配的 Amazon EventBridge 规则，并定位撤销不合规入口规则的 SSM 自动化文档。", "使用附加到 Config 规则的“AWS-DisablePublicAccessForSecurityGroup”SSM 文档启用 AWS Config 自动修复，该文档会阻止对安全组的所有公共访问。"], "explanation_zh": "与配置合规性更改事件匹配的 EventBridge 规则可以触发 SSM 自动化文档，以自动删除特定的不合规入口规则，从而允许不受限制的 SSH。这可以在几分钟内提供精细的修复。虽然 Config 本身确实支持自动修复，但“AWS-DisablePublicAccessForSecurityGroup”文档删除了所有公共访问规则，而不仅仅是违规的 SSH 规则，这可能会破坏合法的面向公众的服务。具有目标 SSM 文档的 EventBridge 提供更精确的修复。"}, {"exam": 3, "id": 18, "question_en": "A company uses Amazon GuardDuty and frequently receives findings for authorized penetration testing activities conducted by their internal red team from known IP addresses. These findings create noise and make it difficult for analysts to focus on genuine threats. The team needs to automatically suppress these expected findings without disabling GuardDuty detection.\n \nWhat should the team configure?", "options_en": ["Add the red team IP addresses to the GuardDuty trusted IP list, which prevents GuardDuty from generating any findings associated with traffic from those addresses.", "Create GuardDuty suppression rules with filter criteria matching the red team source IP addresses, which automatically archives expected findings so they do not appear in the current findings view.", "Configure a Security Hub automation rule that automatically sets the workflow status to SUPPRESSED for findings originating from the red team known IP addresses.", "Create an EventBridge rule that matches GuardDuty findings from the red team IP addresses and triggers a Lambda function to call the GuardDuty ArchiveFindings API."], "correct": 1, "explanation_en": "GuardDuty suppression rules (also called auto-archive rules) automatically archive findings that match specified filter criteria such as source IP addresses. Archived findings are still generated and available for review but do not appear in the current findings view, reducing noise for analysts. Trusted IP lists prevent findings from being generated entirely, which could mask genuine threats if the red team infrastructure were compromised. Suppression rules preserve the detection while removing operational noise.", "question_zh": "一家公司使用 Amazon GuardDuty，并经常收到其内部红队从已知 IP 地址进行的授权渗透测试活动的结果。这些发现会产生噪音，使分析人员难以关注真正的威胁。团队需要在不禁用 GuardDuty 检测的情况下自动抑制这些预期结果。\n \n团队应该配置什么？", "options_zh": ["将红队 IP 地址添加到 GuardDuty 可信 IP 列表中，这会阻止 GuardDuty 生成与来自这些地址的流量相关的任何结果。", "使用与红队源 IP 地址匹配的过滤条件创建 GuardDuty 抑制规则，该规则会自动存档预期结果，以便它们不会出现在当前结果视图中。", "配置 Security Hub 自动化规则，对于源自红队已知 IP 地址的结果，自动将工作流状态设置为“已禁止”。", "创建一条 EventBridge 规则，该规则与红队 IP 地址中的 GuardDuty 结果相匹配，并触发 Lambda 函数来调用 GuardDuty ArchiveFindings API。"], "explanation_zh": "GuardDuty 抑制规则（也称为自动存档规则）会自动存档与指定过滤条件（例如源 IP 地址）相匹配的结果。存档的结果仍然会生成并可供审查，但不会出现在当前的结果视图中，从而减少分析师的干扰。受信任的 IP 列表会阻止完全生成调查结果，如果红队基础设施受到损害，这可能会掩盖真正的威胁。抑制规则保留检测，同时消除操作噪声。"}, {"exam": 3, "id": 19, "question_en": "A security operations team needs to standardize their incident containment process. When a compromised EC2 instance is identified, they want to execute a predefined set of containment steps including tagging the instance, enabling termination protection, capturing instance metadata, and creating a forensic AMI. Different team members should execute the same consistent steps.\n \nWhat should the team implement?", "options_en": ["Create a detailed runbook wiki page with step-by-step CLI commands and train all team members to follow the documented procedure when responding to incidents.", "Develop a Python script stored in CodeCommit that accepts an instance ID and executes all containment steps, then distribute it to the security team for local execution.", "Configure AWS Config rules that automatically tag compromised instances and trigger Lambda functions to enable termination protection and create AMIs.", "Create an SSM Automation runbook that defines each containment step as an automation action, accepts the instance ID as an input parameter, and can be executed by any authorized team member from the Systems Manager console."], "correct": 3, "explanation_en": "SSM Automation runbooks provide a standardized, repeatable, and auditable way to execute multi-step operational procedures. Each step is defined as an automation action with built-in error handling and logging. Any authorized team member can execute the same runbook from the console or CLI, ensuring consistent execution. A wiki page relies on manual execution which is error-prone under pressure, and a Python script lacks the audit trail, access controls, and step-by-step visibility that SSM Automation provides.", "question_zh": "安全运营团队需要标准化其事件遏制流程。当发现受感染的 EC2 实例时，他们希望执行一组预定义的遏制步骤，包括标记实例、启用终止保护、捕获实例元数据以及创建取证 AMI。不同的团队成员应该执行相同的一致步骤。\n \n团队应该实施什么？", "options_zh": ["使用分步 CLI 命令创建详细的 Runbook wiki 页面，并培训所有团队成员在响应事件时遵循记录的程序。", "开发一个存储在 CodeCommit 中的 Python 脚本，该脚本接受实例 ID 并执行所有遏制步骤，然后将其分发给安全团队以在本地执行。", "配置 AWS Config 规则，自动标记受损实例并触发 Lambda 函数以启用终止保护并创建 AMI。", "创建一个 SSM 自动化运行手册，将每个遏制步骤定义为自动化操作，接受实例 ID 作为输入参数，并且可由任何授权团队成员从 Systems Manager 控制台执行。"], "explanation_zh": "SSM 自动化操作手册提供了一种标准化、可重复且可审核的方法来执行多步骤操作程序。每个步骤都被定义为具有内置错误处理和日志记录的自动化操作。任何授权的团队成员都可以从控制台或 CLI 执行相同的 Runbook，从而确保一致的执行。 wiki 页面依赖于手动执行，这在压力下容易出错，而 Python 脚本缺乏 SSM Automation 提供的审核跟踪、访问控制和逐步可见性。"}, {"exam": 3, "id": 20, "question_en": "A network security team maintains identical security group rules across 50 VPCs that allow traffic from a list of 30 corporate office CIDR blocks. Whenever a new office is added, they must manually update security groups in all 50 VPCs. They need a centralized mechanism to manage these CIDR blocks and have changes automatically reflected in all security groups.\n \nWhich solution reduces this operational overhead?", "options_en": ["Create a customer-managed prefix list containing all corporate office CIDR blocks and reference the prefix list in security group rules across all 50 VPCs. When a new office is added, update only the prefix list.", "Create an AWS Config rule that monitors security group rules and triggers an SSM Automation document to add missing CIDR blocks whenever a new office IP range is added to a DynamoDB reference table.", "Use AWS Firewall Manager to create a common security group policy that contains all corporate CIDR blocks and apply it to all 50 VPCs through the organization.", "Develop a CloudFormation StackSet that deploys security group rules parameterized with the corporate CIDR blocks, and update the stack parameter when new offices are added."], "correct": 0, "explanation_en": "Customer-managed prefix lists allow defining a set of CIDR blocks in a single object that can be referenced in security group rules, route tables, and network ACLs across multiple VPCs. Updating the prefix list automatically updates all resources that reference it. Prefix lists can also be shared across accounts using AWS RAM. Note that AWS-managed prefix lists are read-only objects for AWS service IPs and cannot be created by users. CloudFormation StackSets would require a stack update operation across all 50 VPCs, which is slower and more operationally complex than a single prefix list update.", "question_zh": "网络安全团队在 50 个 VPC 中维护相同的安全组规则，允许来自 30 个公司办公室 CIDR 块的列表的流量。每当添加新办公室时，他们必须手动更新所有 50 个 VPC 中的安全组。他们需要一个集中机制来管理这些 CIDR 块，并让更改自动反映在所有安全组中。\n \n哪种解决方案可以减少这种运营开销？", "options_zh": ["创建包含所有公司办公室 CIDR 块的客户管理的前缀列表，并在所有 50 个 VPC 的安全组规则中引用该前缀列表。添加新局点时，仅更新前缀列表。", "创建一个 AWS Config 规则，用于监控安全组规则，并在将新的办公室 IP 范围添加到 DynamoDB 引用表时触发 SSM 自动化文档来添加缺失的 CIDR 块。", "使用 AWS Firewall Manager 创建包含所有公司 CIDR 块的通用安全组策略，并将其应用到组织中的所有 50 个 VPC。", "开发一个 CloudFormation StackSet，用于部署使用公司 CIDR 块参数化的安全组规则，并在添加新办公室时更新堆栈参数。"], "explanation_zh": "客户管理的前缀列表允许在单个对象中定义一组 CIDR 块，这些块可以在跨多个 VPC 的安全组规则、路由表和网络 ACL 中引用。更新前缀列表会自动更新引用它的所有资源。前缀列表还可以使用 AWS RAM 在账户之间共享。请注意，AWS 管理的前缀列表是 AWS 服务 IP 的只读对象，用户无法创建。 CloudFormation StackSets 需要跨所有 50 个 VPC 进行堆栈更新操作，这比单个前缀列表更新更慢且操作更复杂。"}, {"exam": 3, "id": 21, "question_en": "An e-commerce company website is experiencing increased traffic from automated bots that scrape product pricing data, create fake accounts, and overwhelm the checkout API. The company needs to differentiate between legitimate bots like search engine crawlers and malicious bots, applying different policies for each category.\n \nWhich AWS WAF feature provides this capability?", "options_en": ["Configure AWS WAF rate-based rules with different thresholds for each URL path to throttle automated traffic, and add IP reputation list managed rules to block known malicious bot IP addresses.", "Enable the AWS WAF Bot Control managed rule group, which categorizes bots as verified (like search engines), common (automated scripts), or targeted (advanced bots), and allows configuring different actions for each category.", "Create custom AWS WAF rules using regex pattern matching on User-Agent headers to identify known bot signatures, and set up CAPTCHA challenges for unrecognized User-Agents.", "Deploy Amazon CloudFront with field-level encryption in front of the application and configure AWS WAF geographic restrictions to block traffic from countries associated with bot farms."], "correct": 1, "explanation_en": "AWS WAF Bot Control is a managed rule group that uses machine learning and behavioral analysis to categorize bots into verified bots (such as search engine crawlers), common bots (automated scripts), and targeted bots (advanced bots that mimic human behavior). You can configure different actions for each category, allowing legitimate crawlers while blocking malicious bots. Rate-based rules alone cannot differentiate between bot categories, and User-Agent header matching is easily spoofed by sophisticated bots.", "question_zh": "一家电子商务公司的网站正面临来自自动化机器人的流量增加，这些机器人会抓取产品定价数据、创建虚假帐户并压垮结账 API。该公司需要区分搜索引擎爬虫等合法机器人和恶意机器人，为每个类别应用不同的策略。\n \n哪个 AWS WAF 功能提供此功能？", "options_zh": ["为每个 URL 路径配置不同阈值的 AWS WAF 基于速率的规则，以限制自动流量，并添加 IP 信誉列表托管规则以阻止已知的恶意机器人 IP 地址。", "启用 AWS WAF 机器人控制托管规则组，该规则组将机器人分类为已验证机器人（如搜索引擎）、常见机器人（自动脚本）或目标机器人（高级机器人），并允许为每个类别配置不同的操作。", "使用用户代理标头上的正则表达式模式匹配创建自定义 AWS WAF 规则，以识别已知的机器人签名，并为无法识别的用户代理设置验证码挑战。", "在应用程序前面部署具有字段级加密的 Amazon CloudFront，并配置 AWS WAF 地理限制以阻止来自与机器人农场相关的国家/地区的流量。"], "explanation_zh": "AWS WAF 机器人控制是一个托管规则组，它使用机器学习和行为分析将机器人分类为经过验证的机器人（例如搜索引擎爬网程序）、常见机器人（自动化脚本）和目标机器人（模仿人类行为的高级机器人）。您可以为每个类别配置不同的操作，允许合法爬网程序，同时阻止恶意机器人。仅基于速率的规则无法区分机器人类别，并且用户代理标头匹配很容易被复杂的机器人欺骗。"}, {"exam": 3, "id": 22, "question_en": "A security team needs to deploy deep packet inspection for traffic traversing their centralized inspection VPC. They have an existing library of Suricata IDS/IPS rules from their on-premises environment that they want to reuse in AWS. The rules need to inspect traffic content beyond IP and port information.\n \nWhich service supports this requirement?", "options_en": ["AWS WAF deployed on an Application Load Balancer in the inspection VPC, configured with custom rules that inspect HTTP request bodies and headers for malicious patterns.", "VPC security groups with detailed logging enabled, combined with VPC Flow Logs analysis using Lambda functions to detect suspicious traffic patterns.", "AWS Network Firewall with Suricata-compatible stateful rule groups that support importing existing Suricata rules for deep packet inspection of traffic traversing the inspection VPC.", "Amazon GuardDuty with VPC Flow Logs monitoring enabled, which performs deep packet inspection and generates findings based on traffic content analysis."], "correct": 2, "explanation_en": "AWS Network Firewall supports Suricata-compatible stateful rule groups, allowing organizations to import their existing Suricata IDS/IPS rules directly. These rules provide deep packet inspection capabilities that examine traffic content beyond IP addresses and ports. Network Firewall is deployed in the inspection VPC to inspect traffic passing through it. AWS WAF operates at Layer 7 for HTTP/HTTPS only, and GuardDuty analyzes flow log metadata rather than performing deep packet inspection of traffic content.", "question_zh": "安全团队需要针对流经其集中检测 VPC 的流量部署深度数据包检测。他们拥有来自本地环境的现有 Suricata IDS/IPS 规则库，希望在 AWS 中重用。这些规则需要检查 IP 和端口信息之外的流量内容。\n \n哪个服务支持这个要求？", "options_zh": ["AWS WAF 部署在检查 VPC 中的 Application Load Balancer 上，配置了自定义规则来检查 HTTP 请求正文和标头是否存在恶意模式。", "启用详细日志记录的 VPC 安全组，结合使用 Lambda 函数的 VPC 流日志分析来检测可疑流量模式。", "具有与 Suricata 兼容的状态规则组的 AWS 网络防火墙，支持导入现有 Suricata 规则，以对流经检查 VPC 的流量进行深度数据包检查。", "启用了 VPC 流日志监控的 Amazon GuardDuty，它执行深度数据包检查并根据流量内容分析生成结果。"], "explanation_zh": "AWS Network Firewall 支持与 Suricata 兼容的有状态规则组，允许组织直接导入其现有的 Suricata IDS/IPS 规则。这些规则提供深度数据包检查功能，可检查 IP 地址和端口之外的流量内容。网络防火墙部署在检查VPC中，对经过该VPC的流量进行检查。 AWS WAF 仅在 HTTP/HTTPS 的第 7 层运行，GuardDuty 分析流日志元数据，而不是对流量内容执行深度数据包检查。"}, {"exam": 3, "id": 23, "question_en": "A security team wants to identify EC2 instances that have network paths allowing unrestricted access from the internet. They need an automated assessment that analyzes VPC configurations including security groups, network ACLs, route tables, and internet gateways to determine actual network reachability, not just individual rule analysis.\n \nWhich service provides this holistic network reachability analysis?", "options_en": ["AWS Config with the `ec2-instance-no-public-ip` and `restricted-ssh` managed rules to identify instances with public IPs and open SSH ports.", "VPC Reachability Analyzer, which traces the network path between two resources to determine if traffic can flow between them.", "AWS Trusted Advisor security checks, which identify security groups with unrestricted access and EBS volumes without encryption.", "Amazon Inspector network reachability assessments, which analyze VPC configurations holistically including security groups, NACLs, route tables, and IGWs to identify EC2 instances reachable from the internet on specific ports."], "correct": 3, "explanation_en": "Amazon Inspector network reachability assessments perform holistic analysis of VPC networking configurations to determine which EC2 instances are actually reachable from the internet. It evaluates the combined effect of security groups, network ACLs, route tables, internet gateways, and VPC peering connections. This is different from individual rule checking provided by AWS Config. VPC Reachability Analyzer tests specific source-to-destination paths rather than scanning for all internet-reachable instances.", "question_zh": "安全团队希望识别具有允许从互联网不受限制访问的网络路径的 EC2 实例。他们需要自动评估来分析 VPC 配置，包括安全组、网络 ACL、路由表和互联网网关，以确定实际的网络可达性，而不仅仅是单独的规则分析。\n \n哪种服务提供这种全面的网络可达性分析？", "options_zh": ["AWS Config 使用“ec2-instance-no-public-ip”和“restricted-ssh”托管规则来识别具有公共 IP 和开放 SSH 端口的实例。", "VPC 可达性分析器，跟踪两个资源之间的网络路径，以确定流量是否可以在它们之间流动。", "AWS Trusted Advisor 安全检查，可识别具有不受限制的访问权限的安全组和未加密的 EBS 卷。", "Amazon Inspector 网络可达性评估，全面分析 VPC 配置，包括安全组、NACL、路由表和 IGW，以识别可通过特定端口从互联网访问的 EC2 实例。"], "explanation_zh": "Amazon Inspector 网络可达性评估对 VPC 网络配置进行整体分析，以确定哪些 EC2 实例实际上可以通过 Internet 访问。它评估安全组、网络 ACL、路由表、互联网网关和 VPC 对等连接的综合效果。这与 AWS Config 提供的单独规则检查不同。 VPC 可达性分析器测试特定的源到目标路径，而不是扫描所有可通过 Internet 访问的实例。"}, {"exam": 3, "id": 24, "question_en": "A federal government agency needs to create hardened Amazon Machine Images (AMIs) that comply with DISA Security Technical Implementation Guide (STIG) requirements. The AMIs must be automatically rebuilt monthly with the latest OS patches and STIG configurations, validated through automated testing, and distributed to approved AWS accounts.\n \nWhich solution meets these requirements?", "options_en": ["Use EC2 Image Builder with STIG hardening components in the image recipe, configure a pipeline with a monthly schedule, add STIG compliance test components for validation, and configure distribution settings to share AMIs with approved accounts.", "Create a golden AMI manually with STIG configurations, store it in a shared AMI account, use AWS Systems Manager Patch Manager to apply monthly patches, and re-create the AMI using a Lambda function.", "Deploy AWS Config rules that validate EC2 instances against STIG benchmarks, use Systems Manager State Manager to apply STIG configurations, and create AMIs from compliant instances using scheduled EventBridge rules.", "Use HashiCorp Packer with a STIG hardening Ansible playbook executed on an EC2 builder instance, store the AMI in a central account, and use AWS RAM to share it across the organization."], "correct": 0, "explanation_en": "EC2 Image Builder provides managed STIG hardening components that can be included in image recipes, along with STIG compliance test components for automated validation. Pipelines can be scheduled to run monthly, automatically applying the latest patches and STIG configurations. Distribution settings allow sharing AMIs with specific accounts or across an organization. While Packer can build hardened AMIs, it requires managing the build infrastructure and STIG playbooks manually, whereas Image Builder provides these as managed components.", "question_zh": "联邦政府机构需要创建符合 DISA 安全技术实施指南 (STIG) 要求的强化 Amazon 系统映像 (AMI)。 AMI 必须每月使用最新的操作系统补丁和 STIG 配置自动重建，通过自动化测试进行验证，并分发到批准的 AWS 账户。\n \n哪种解决方案满足这些要求？", "options_zh": ["将 EC2 Image Builder 与映像配方中的 STIG 强化组件结合使用，配置具有每月计划的管道，添加 STIG 合规性测试组件进行验证，并配置分发设置以与批准的账户共享 AMI。", "使用 STIG 配置手动创建黄金 AMI，将其存储在共享 AMI 账户中，使用 AWS Systems Manager Patch Manager 应用每月补丁，并使用 Lambda 函数重新创建 AMI。", "部署 AWS Config 规则，根据 STIG 基准验证 EC2 实例，使用 Systems Manager 状态管理器应用 STIG 配置，并使用计划的 EventBridge 规则从合规实例创建 AMI。", "将 HashiCorp Packer 与在 EC2 构建器实例上执行的 STIG 强化 Ansible playbook 结合使用，将 AMI 存储在中央账户中，并使用 AWS RAM 在整个组织中共享它。"], "explanation_zh": "EC2 Image Builder 提供可包含在映像配方中的托管 STIG 强化组件，以及用于自动验证的 STIG 合规性测试组件。管道可以安排每月运行一次，自动应用最新的补丁和 STIG 配置。分发设置允许与特定账户或整个组织共享 AMI。虽然 Packer 可以构建强化的 AMI，但它需要手动管理构建基础设施和 STIG playbook，而 Image Builder 将这些作为托管组件提供。"}, {"exam": 3, "id": 25, "question_en": "A company requires that all EC2 instances in their production environment maintain specific security configurations including antivirus definitions, CIS benchmark settings, and CloudWatch agent configuration. If any instance drifts from the desired state, the configuration should be automatically reapplied without manual intervention.\n \nWhich service enforces this continuous desired state?", "options_en": ["AWS Config rules with auto-remediation using SSM Automation documents that reapply configurations when instances are found non-compliant during periodic evaluations.", "AWS Systems Manager State Manager associations that apply configuration documents to target instances on a defined schedule, automatically reapplying the desired state if drift occurs.", "Amazon EventBridge rules that detect EC2 configuration changes through CloudTrail events and trigger Lambda functions to restore the desired configuration.", "AWS OpsWorks with Chef recipes that define the desired configuration and run on a periodic convergence schedule to correct any configuration drift."], "correct": 1, "explanation_en": "Systems Manager State Manager applies configuration documents (SSM documents) to managed instances on a defined schedule, continuously enforcing the desired state. If an instance drifts from the desired configuration, State Manager automatically reapplies it on the next scheduled run. This is specifically designed for enforcing desired state across a fleet. AWS Config detects compliance drift but its auto-remediation is reactive to evaluation events rather than continuously enforcing a desired state on a schedule.", "question_zh": "公司要求其生产环境中的所有 EC2 实例维护特定的安全配置，包括防病毒定义、CIS 基准设置和 CloudWatch 代理配置。如果任何实例偏离所需状态，则应自动重新应用配置，无需手动干预。\n \n哪个服务强制执行这种连续的期望状态？", "options_zh": ["AWS Config 规则使用 SSM 自动化文档进行自动修复，当定期评估期间发现实例不合规时，会重新应用配置。", "AWS Systems Manager 状态管理器关联，按照定义的计划将配置文档应用到目标实例，如果发生偏差，则自动重新应用所需的状态。", "Amazon EventBridge 规则通过 CloudTrail 事件检测 EC2 配置更改并触发 Lambda 函数以恢复所需的配置。", "AWS OpsWorks 具有 Chef 配方，可定义所需的配置并按定期收敛计划运行以纠正任何配置偏差。"], "explanation_zh": "Systems Manager 状态管理器按照定义的计划将配置文档（SSM 文档）应用到托管实例，持续实施所需的状态。如果实例偏离所需配置，状态管理器会在下一次计划运行时自动重新应用它。这是专门为在整个车队中强制执行所需状态而设计的。 AWS Config 检测合规性偏差，但其自动修复是对评估事件做出反应，而不是按计划持续强制执行所需状态。"}, {"exam": 3, "id": 26, "question_en": "A company is migrating from a traditional VPN-based remote access model to a zero-trust architecture. They want to grant access to internal web applications only when both the user identity is verified through their corporate IdP AND the connecting device meets security requirements such as having an updated OS, disk encryption enabled, and a running firewall.\n \nWhich AWS service supports both identity and device posture verification?", "options_en": ["AWS Client VPN with certificate-based mutual authentication and posture assessment through a Lambda authorizer function that checks device attributes.", "Amazon Cognito User Pools with adaptive authentication that evaluates device context and risk factors before granting access tokens.", "AWS Verified Access with both an identity trust provider (connected to the corporate IdP) and a device trust provider (integrated with a device management solution) to evaluate user identity and device posture before granting application access.", "AWS IAM Identity Center with device-aware session policies that verify device compliance status from a mobile device management solution before issuing federation tokens."], "correct": 2, "explanation_en": "AWS Verified Access supports configuring multiple trust providers, including an identity trust provider connected to a corporate IdP and a device trust provider integrated with device management solutions such as CrowdStrike or Jamf. Access policies can require both identity verification and device posture compliance before granting access to applications. Client VPN does not natively integrate with device management solutions for posture checks, and Cognito is designed for customer-facing authentication rather than corporate zero-trust access.", "question_zh": "一家公司正在从传统的基于 VPN 的远程访问模型迁移到零信任架构。他们希望仅在通过公司 IdP 验证用户身份并且连接设备满足安全要求（例如更新操作系统、启用磁盘加密和运行防火墙）时才授予对内部 Web 应用程序的访问权限。\n \n哪种 AWS 服务同时支持身份验证和设备状态验证？", "options_zh": ["AWS 客户端 VPN，通过检查设备属性的 Lambda 授权者函数进行基于证书的相互身份验证和状态评估。", "具有自适应身份验证功能的 Amazon Cognito 用户池，可在授予访问令牌之前评估设备上下文和风险因素。", "通过身份信任提供商（连接到企业 IdP）和设备信任提供商（与设备管理解决方案集成）进行 AWS 验证访问，以在授予应用程序访问权限之前评估用户身份和设备状态。", "AWS IAM Identity Center 具有设备感知会话策略，可在颁发联合令牌之前通过移动设备管理解决方案验证设备合规性状态。"], "explanation_zh": "AWS Verified Access 支持配置多个信任提供商，包括连接到企业 IdP 的身份信任提供商以及与 CrowdStrike 或 Jamf 等设备管理解决方案集成的设备信任提供商。在授予应用程序访问权限之前，访问策略可能需要身份验证和设备状态合规性。客户端 VPN 本身并不与用于状态检查的设备管理解决方案集成，Cognito 专为面向客户的身份验证而不是企业零信任访问而设计。"}, {"exam": 3, "id": 27, "question_en": "A media company serves premium video content through Amazon CloudFront. Subscribers should access all videos in the premium library through their browser session, while individual video previews should have time-limited URLs that expire after 30 minutes. The company needs to implement both access patterns efficiently.\n \nHow should the company configure CloudFront content access control?", "options_en": ["Use CloudFront origin access control (OAC) for both patterns, configuring the S3 bucket policy to validate subscriber identity and set object-level time-based access conditions.", "Generate AWS STS temporary credentials for subscribers that grant direct S3 access to premium content, and create pre-signed S3 URLs for video previews with a 30-minute expiration.", "Use CloudFront signed URLs for all content with long expiration for subscribers and 30-minute expiration for previews, embedding the subscriber session information in each URL.", "Use CloudFront signed cookies for subscriber access to the entire premium library, which provides access to multiple files without modifying URLs, and use CloudFront signed URLs for individual video previews with a 30-minute expiration policy."], "correct": 3, "explanation_en": "CloudFront signed cookies are ideal when granting access to multiple restricted files such as a premium content library because cookies are set once and apply to all subsequent requests without modifying URLs. Signed URLs are better for restricting access to individual resources with specific expiration times, making them appropriate for time-limited video previews. Using signed URLs for the entire library would require generating and managing individual URLs for every video. Pre-signed S3 URLs bypass CloudFront caching and edge optimization.", "question_zh": "一家媒体公司通过 Amazon CloudFront 提供优质视频内容。订阅者应通过浏览器会话访问高级库中的所有视频，而各个视频预览应具有限时 URL，并在 30 分钟后过期。公司需要有效地实施这两种访问模式。\n \n公司应如何配置CloudFront内容访问控制？", "options_zh": ["对这两种模式使用 CloudFront 源访问控制 (OAC)，配置 S3 存储桶策略来验证订阅者身份并设置对象级基于时间的访问条件。", "为订阅者生成 AWS STS 临时凭证，授予对优质内容的直接 S3 访问权限，并创建用于视频预览的预签名 S3 URL，有效期为 30 分钟。", "对所有内容使用 CloudFront 签名 URL，订阅者的有效期较长，预览的有效期为 30 分钟，并将订阅者会话信息嵌入到每个 URL 中。", "使用 CloudFront 签名 cookie 供订阅者访问整个高级库，无需修改 URL 即可访问多个文件，并使用 CloudFront 签名 URL 进行具有 30 分钟过期策略的单个视频预览。"], "explanation_zh": "CloudFront 签名 Cookie 非常适合授予对多个受限文件（例如高级内容库）的访问权限，因为 Cookie 设置一次后即可应用于所有后续请求，而无需修改 URL。签名 URL 更适合限制对具有特定过期时间的单个资源的访问，使它们适合限时视频预览。对整个库使用签名 URL 需要为每个视频生成和管理单独的 URL。预签名的 S3 URL 绕过 CloudFront 缓存和边缘优化。"}, {"exam": 3, "id": 28, "question_en": "A company uses AWS Transit Gateway to connect 20 VPCs in us-east-1. They are expanding to eu-west-1 and need to connect VPCs across both Regions while ensuring that inter-Region traffic is encrypted and does not traverse the public internet. They also need segmented routing to isolate production and development traffic across Regions.\n \nWhich architecture meets these requirements?", "options_en": ["Create a Transit Gateway in eu-west-1, establish an inter-Region Transit Gateway peering connection between the two Transit Gateways, and use separate route tables on each Transit Gateway to segment production and development traffic. Inter-Region peering traffic is automatically encrypted and stays on the AWS global network.", "Extend the existing us-east-1 Transit Gateway to eu-west-1 using Transit Gateway multi-Region deployment, and configure route table associations to segment production and development VPC attachments.", "Create a Site-to-Site VPN connection between the two Transit Gateways using AWS VPN with IPSec encryption, and configure static routes to segment production and development traffic.", "Deploy VPC peering connections between each VPC in us-east-1 and eu-west-1, enable encryption on each peering connection, and use security group references for traffic segmentation."], "correct": 0, "explanation_en": "Transit Gateway inter-Region peering connects two Transit Gateways across Regions with traffic that is automatically encrypted and stays on the AWS global backbone network, never traversing the public internet. Each Transit Gateway can have separate route tables for production and development traffic segmentation. Transit Gateways cannot be extended across Regions in a multi-Region deployment; you must create a separate Transit Gateway in each Region and peer them. VPC peering does not scale well for 20+ VPCs and does not support transitive routing.", "question_zh": "一家公司使用 AWS Transit Gateway 连接 us-east-1 中的 20 个 VPC。他们正在扩展到 eu-west-1，需要跨两个区域连接 VPC，同时确保区域间流量经过加密且不会穿越公共互联网。他们还需要分段路由来隔离跨区域的生产和开发流量。\n \n哪种架构可以满足这些要求？", "options_zh": ["在 eu-west-1 中创建一个 Transit Gateway，在两个 Transit Gateway 之间建立区域间 Transit Gateway 对等连接，并在每个 Transit Gateway 上使用单独的路由表来分段生产和开发流量。区域间对等流量会自动加密并保留在 AWS 全球网络上。", "使用 Transit Gateway 多区域部署将现有 us-east-1 Transit Gateway 扩展到 eu-west-1，并配置路由表关联以分段生产和开发 VPC 连接。", "使用具有 IPSec 加密的 AWS VPN 在两个 Transit Gateway 之间创建站点到站点 VPN 连接，并配置静态路由以分段生产和开发流量。", "在 us-east-1 和 eu-west-1 中的每个 VPC 之间部署 VPC 对等连接，对每个对等连接启用加密，并使用安全组引用进行流量分段。"], "explanation_zh": "Transit Gateway 区域间对等连接跨区域连接两个 Transit Gateway，流量会自动加密并保留在 AWS 全球骨干网络上，从不穿越公共互联网。每个 Transit Gateway 都可以有单独的路由表，用于生产和开发流量分段。在多区域部署中，中转网关无法跨区域扩展；您必须在每个区域中创建一个单独的 Transit Gateway 并对它们进行对等。 VPC 对等互连无法很好地扩展 20 个以上的 VPC，并且不支持传递路由。"}, {"exam": 3, "id": 29, "question_en": "A DevOps team writes Terraform and CloudFormation templates for infrastructure deployments. They want to automatically detect security misconfigurations in their IaC templates during development, such as S3 buckets without encryption, security groups with unrestricted access, and IAM policies with wildcard permissions, directly within their IDE.\n \nWhich tool provides this capability?", "options_en": ["AWS CloudFormation Guard, which validates CloudFormation templates against policy-as-code rules written in the Guard domain-specific language.", "Amazon Q Developer security scanning, which analyzes IaC templates including Terraform and CloudFormation within the IDE to identify security misconfigurations and suggest remediation.", "AWS Config proactive compliance rules, which evaluate CloudFormation resource configurations before deployment and block non-compliant stack creation.", "Amazon Inspector SBOM scanning, which analyzes infrastructure templates for vulnerable dependencies and misconfigured resource properties."], "correct": 1, "explanation_en": "Amazon Q Developer includes security scanning capabilities that analyze IaC templates including Terraform, CloudFormation, and CDK directly within the developer IDE. It identifies security misconfigurations such as unencrypted resources, overly permissive access rules, and insecure defaults, and provides remediation suggestions inline. CloudFormation Guard is limited to CloudFormation and requires writing custom guard rules. Config proactive compliance works during deployment, not during development in the IDE.", "question_zh": "DevOps 团队为基础设施部署编写 Terraform 和 CloudFormation 模板。他们希望在开发过程中直接在 IDE 中自动检测 IaC 模板中的安全错误配置，例如未加密的 S3 存储桶、访问不受限制的安全组以及具有通配符权限的 IAM 策略。\n \n哪个工具提供此功能？", "options_zh": ["AWS CloudFormation Guard，根据以 Guard 域特定语言编写的策略即代码规则来验证 CloudFormation 模板。", "Amazon Q Developer 安全扫描，可分析 IDE 中的 IaC 模板（包括 Terraform 和 CloudFormation），以识别安全配置错误并提出修复建议。", "AWS Config 主动合规性规则，在部署之前评估 CloudFormation 资源配置并阻止不合规的堆栈创建。", "Amazon Inspector SBOM 扫描，可分析基础设施模板以查找易受攻击的依赖项和错误配置的资源属性。"], "explanation_zh": "Amazon Q Developer 包含安全扫描功能，可直接在开发人员 IDE 中分析 IaC 模板，包括 Terraform、CloudFormation 和 CDK。它可以识别安全错误配置，例如未加密的资源、过于宽松的访问规则和不安全的默认设置，并提供内联修复建议。 CloudFormation Guard 仅限于 CloudFormation，并且需要编写自定义防护规则。配置主动合规性在部署期间起作用，而不是在 IDE 中的开发期间起作用。"}, {"exam": 3, "id": 30, "question_en": "A company security policy requires blocking DNS resolution of known malicious domains and command-and-control (C2) domains for all resources in their VPCs. They need a solution that integrates with their existing VPC DNS resolution and uses regularly updated threat intelligence domain lists.\n \nWhich service provides this capability?", "options_en": ["Configure Route 53 hosted zone policies that deny DNS resolution for domains matching a blocklist maintained in an S3 bucket updated by a Lambda function.", "Deploy AWS Network Firewall with stateful domain list rules that inspect DNS traffic and block resolution of domains matching threat intelligence feeds.", "Configure Route 53 Resolver DNS Firewall with rule groups that reference AWS Managed Domain Lists for malicious domains and C2 domains, associated with the VPCs requiring protection.", "Use Amazon GuardDuty DNS monitoring to detect queries to malicious domains and configure an EventBridge rule to add detected domains to VPC DHCP option set DNS blocklists."], "correct": 2, "explanation_en": "Route 53 Resolver DNS Firewall integrates directly with VPC DNS resolution to filter DNS queries. It supports AWS Managed Domain Lists that are regularly updated with known malicious domains and C2 domains, requiring no manual maintenance. Rule groups can be associated with specific VPCs and configured to block or alert on queries matching the lists. Network Firewall can inspect DNS traffic but requires more complex configuration, and GuardDuty detects malicious DNS queries after the fact rather than blocking them.", "question_zh": "公司安全策略要求阻止其 VPC 中所有资源的已知恶意域和命令与控制 (C2) 域的 DNS 解析。他们需要一个与现有 VPC DNS 解析集成并使用定期更新的威胁情报域列表的解决方案。\n \n哪个服务提供此功能？", "options_zh": ["配置 Route 53 托管区域策略，拒绝与 Lambda 函数更新的 S3 存储桶中维护的阻止列表匹配的域的 DNS 解析。", "使用状态域列表规则部署 AWS Network Firewall，这些规则可检查 DNS 流量并阻止与威胁情报源匹配的域的解析。", "使用规则组配置 Route 53 解析器 DNS 防火墙，这些规则组引用与需要保护的 VPC 关联的恶意域和 C2 域的 AWS 托管域列表。", "使用 Amazon GuardDuty DNS 监控来检测对恶意域的查询，并配置 EventBridge 规则以将检测到的域添加到 VPC DHCP 选项集 DNS 阻止列表。"], "explanation_zh": "Route 53 解析器 DNS 防火墙直接与 VPC DNS 解析集成以过滤 DNS 查询。它支持使用已知恶意域和 C2 域定期更新的 AWS 托管域列表，无需手动维护。规则组可以与特定 VPC 关联，并配置为阻止或警告与列表匹配的查询。网络防火墙可以检查 DNS 流量，但需要更复杂的配置，而 GuardDuty 会在事后检测恶意 DNS 查询，而不是阻止它们。"}, {"exam": 3, "id": 31, "question_en": "A company connects its on-premises data center to AWS using an AWS Site-to-Site VPN over the public internet. Users in remote offices experience high latency and inconsistent performance when accessing AWS resources because internet routing is unpredictable. The company wants to improve VPN performance without deploying a dedicated private connection.\n \nWhich enhancement reduces latency for the Site-to-Site VPN?", "options_en": ["Enable VPN multi-hop routing that establishes VPN tunnels through multiple AWS edge locations to find the optimal path to the VPN endpoint.", "Configure the VPN connection with dynamic routing using BGP and enable Equal-Cost Multi-Path (ECMP) routing across multiple VPN tunnels for load balancing.", "Deploy an AWS Transit Gateway with multiple VPN attachments and configure weighted routing to distribute traffic across VPN endpoints in different Availability Zones.", "Enable the accelerated VPN option on the Site-to-Site VPN connection, which routes traffic through AWS Global Accelerator to enter the AWS global network at the nearest edge location, reducing internet path latency."], "correct": 3, "explanation_en": "Accelerated Site-to-Site VPN uses AWS Global Accelerator to route VPN traffic onto the AWS global network at the nearest edge location. This reduces the distance traffic travels over the unpredictable public internet, resulting in lower latency and more consistent performance. The traffic enters the AWS backbone near the on-premises location and travels within the AWS network to the destination Region. BGP and ECMP improve redundancy and throughput but do not address internet routing latency.", "question_zh": "一家公司使用 AWS Site-to-Site VPN 通过公共互联网将其本地数据中心连接到 AWS。由于互联网路由不可预测，远程办公室的用户在访问 AWS 资源时会遇到高延迟和性能不稳定的情况。该公司希望在不部署专用连接的情况下提高 VPN 性能。\n \n哪项增强功能可减少 Site-to-Site VPN 的延迟？", "options_zh": ["启用 VPN 多跳路由，通过多个 AWS 边缘站点建立 VPN 隧道，以找到通往 VPN 终端节点的最佳路径。", "使用 BGP 通过动态路由配置 VPN 连接，并在多个 VPN 隧道之间启用等价多路径 (ECMP) 路由以实现负载平衡。", "部署具有多个 VPN 连接的 AWS Transit Gateway 并配置加权路由以跨不同可用区中的 VPN 终端节点分配流量。", "在 Site-to-Site VPN 连接上启用加速 VPN 选项，该选项通过 AWS Global Accelerator 路由流量以进入最近边缘位置的 AWS 全球网络，从而减少 Internet 路径延迟。"], "explanation_zh": "加速站点到站点 VPN 使用 AWS Global Accelerator 将 VPN 流量路由到最近边缘位置的 AWS 全球网络。这减少了流量在不可预测的公共互联网上传输的距离，从而降低了延迟并提高了性能的一致性。流量进入本地位置附近的 AWS 主干网，并在 AWS 网络内传输到目标区域。 BGP 和 ECMP 提高了冗余和吞吐量，但不能解决互联网路由延迟问题。"}, {"exam": 3, "id": 32, "question_en": "A company wants to allow developers to create IAM roles for their Lambda functions without involving the central security team. However, the security team must ensure that developer-created roles cannot exceed the permissions granted to the developers themselves, and roles cannot be used to escalate privileges.\n \nHow should the security team implement this self-service model?", "options_en": ["Grant developers the `iam:CreateRole` permission with a condition that restricts the role trust policy to only the Lambda service principal, and audit created roles with AWS Config.", "Create a permissions boundary policy that defines the maximum allowed permissions, and require developers to attach this permissions boundary to any roles they create by adding a condition on `iam:CreateRole` that enforces `iam:PermissionsBoundary`.", "Provide developers with a Service Catalog product that creates pre-approved Lambda execution roles from CloudFormation templates, preventing direct IAM role creation.", "Configure an SCP that limits the actions available to developer-created roles and use IAM Access Analyzer to continuously validate that no privilege escalation paths exist."], "correct": 1, "explanation_en": "Permissions boundaries define the maximum permissions that an IAM entity can have. By requiring developers to attach a specific permissions boundary when creating roles (enforced via a condition on `iam:CreateRole` checking `iam:PermissionsBoundary`), the security team ensures that developer-created roles cannot exceed the defined permission limits. This prevents privilege escalation while enabling self-service role creation. Restricting only the trust policy does not limit the permissions a role can have, and SCPs apply to the account level rather than individual role creation.", "question_zh": "一家公司希望允许开发人员为其 Lambda 函数创建 IAM 角色，而无需中央安全团队的参与。但安全团队必须确保开发人员创建的角色不能超出开发人员自己授予的权限，并且不能利用角色进行提权。\n \n安全团队应该如何实施这种自助服务模式？", "options_zh": ["向开发人员授予“iam:CreateRole”权限，条件是将角色信任策略限制为仅 Lambda 服务委托人，并使用 AWS Config 审核创建的角色。", "创建定义允许的最大权限的权限边界策略，并要求开发人员通过在“iam:CreateRole”上添加强制执行“iam:PermissionsBoundary”的条件，将此权限边界附加到他们创建的任何角色。", "为开发人员提供服务目录产品，该产品可从 CloudFormation 模板创建预先批准的 Lambda 执行角色，从而防止直接创建 IAM 角色。", "配置 SCP 以限制开发人员创建的角色可用的操作，并使用 IAM 访问分析器持续验证是否不存在权限提升路径。"], "explanation_zh": "权限边界定义 IAM 实体可以拥有的最大权限。通过要求开发人员在创建角色时附加特定的权限边界（通过“iam:CreateRole”检查“iam:PermissionsBoundary”的条件强制执行），安全团队确保开发人员创建的角色不能超出定义的权限限制。这可以防止权限升级，同时启用自助服务角色创建。仅限制信任策略不会限制角色可以拥有的权限，并且 SCP 适用于帐户级别而不是单个角色创建。"}, {"exam": 3, "id": 33, "question_en": "A company has 100 AWS accounts in an AWS Organization. They want to share an S3 bucket in a central data lake account with all organization accounts. The bucket policy should automatically allow access from any current or future organization account without listing individual account IDs, and must deny access from accounts outside the organization.\n \nWhich IAM condition key should be used in the bucket policy?", "options_en": ["Use the `aws:PrincipalOrgID` condition key in the bucket policy, which matches the AWS Organizations ID of the requesting principal account, automatically including all current and future organization members.", "Use the `aws:SourceAccount` condition key in the bucket policy with a wildcard pattern matching the organization account ID prefix to allow all organization accounts.", "Use the `aws:PrincipalArn` condition key with a wildcard ARN pattern that matches the organization root account and all descendant accounts.", "Use the `aws:PrincipalTag` condition key with an organization-specific tag that is automatically applied to all IAM principals in organization member accounts."], "correct": 0, "explanation_en": "The `aws:PrincipalOrgID` condition key matches against the AWS Organizations ID (o-xxxxxxxxxx) of the principal making the request. This automatically includes all accounts in the organization, including accounts added in the future, without requiring policy updates. It provides a simple and maintainable way to restrict resource access to organization members only. The `aws:SourceAccount` key is used for service-to-service requests, not cross-account principal access, and does not support wildcard patterns for organization membership.", "question_zh": "一家公司在 AWS 组织中拥有 100 个 AWS 账户。他们希望与所有组织帐户共享中央数据湖帐户中的 S3 存储桶。存储桶策略应自动允许来自任何当前或未来组织帐户的访问，而不列出单个帐户 ID，并且必须拒绝来自组织外部帐户的访问。\n \n存储桶策略中应使用哪个 IAM 条件键？", "options_zh": ["在存储桶策略中使用 `aws:PrincipalOrgID` 条件键，该键与请求主体账户的 AWS Organizations ID 匹配，自动包含所有当前和未来的组织成员。", "在存储桶策略中使用“aws:SourceAccount”条件键以及与组织账户 ID 前缀匹配的通配符模式，以允许所有组织账户。", "将 `aws:PrincipalArn` 条件键与通配符 ARN 模式结合使用，以匹配组织根账户和所有后代账户。", "将 `aws:PrincipalTag` 条件键与组织特定的标签结合使用，该标签会自动应用于组织成员账户中的所有 IAM 委托人。"], "explanation_zh": "`aws:PrincipalOrgID` 条件键与发出请求的委托人的 AWS Organizations ID (o-xxxxxxxxxx) 匹配。这会自动包含组织中的所有帐户，包括将来添加的帐户，而无需更新策略。它提供了一种简单且可维护的方法来将资源访问限制为仅组织成员。 `aws:SourceAccount` 键用于服务到服务请求，而不是跨账户主体访问，并且不支持组织成员资格的通配符模式。"}, {"exam": 3, "id": 34, "question_en": "An organization CISO requires that CloudTrail logging and AWS Config recording cannot be disabled or modified in any member account, including by account administrators. This must be enforced as a preventive control that cannot be overridden at the account level.\n \nWhich approach enforces this requirement?", "options_en": ["Configure CloudTrail and Config as organization-level services managed from the management account, and remove IAM permissions for CloudTrail and Config APIs from all member account users.", "Create AWS Config rules that monitor CloudTrail and Config status, with auto-remediation that re-enables them using an SSM Automation document if they are disabled.", "Attach a Service Control Policy (SCP) to the organization root or relevant OUs that explicitly denies actions such as `cloudtrail:StopLogging`, `cloudtrail:DeleteTrail`, `config:StopConfigurationRecorder`, and `config:DeleteConfigurationRecorder`.", "Enable CloudTrail and Config in each account using CloudFormation StackSets with termination protection and stack policy that prevents deletion or modification of these resources."], "correct": 2, "explanation_en": "Service Control Policies (SCPs) are the only mechanism that can restrict permissions for all IAM principals in member accounts, including account administrators. An SCP denying CloudTrail and Config modification actions prevents anyone in the member account from disabling these services, regardless of their IAM permissions. Config auto-remediation is a detective and corrective control that reacts after the fact, not a preventive control. CloudFormation stack policies can be modified by account administrators.", "question_zh": "组织 CISO 要求不得在任何成员账户（包括账户管理员）中禁用或修改 CloudTrail 日志记录和 AWS Config 记录。这必须作为预防性控制来强制执行，并且不能在账户级别被覆盖。\n \n哪种方法强制执行此要求？", "options_zh": ["将 CloudTrail 和 Config 配置为从管理账户管理的组织级服务，并从所有成员账户用户中删除 CloudTrail 和 Config API 的 IAM 权限。", "创建监控 CloudTrail 和 Config 状态的 AWS Config 规则，并通过自动修复功能在禁用它们时使用 SSM 自动化文档重新启用它们。", "将服务控制策略 (SCP) 附加到组织根或相关 OU，明确拒绝“cloudtrail:StopLogging”、“cloudtrail:DeleteTrail”、“config:StopConfigurationRecorder”和“config:DeleteConfigurationRecorder”等操作。", "使用具有终止保护和堆栈策略的 CloudFormation StackSets 在每个帐户中启用 CloudTrail 和 Config，以防止删除或修改这些资源。"], "explanation_zh": "服务控制策略 (SCP) 是唯一可以限制成员账户中所有 IAM 委托人（包括账户管理员）权限的机制。拒绝 CloudTrail 和 Config 修改操作的 SCP 会阻止成员账户中的任何人禁用这些服务，无论其 IAM 权限如何。配置自动修复是一种在事后做出反应的检测和纠正控制，而不是预防性控制。帐户管理员可以修改 CloudFormation 堆栈策略。"}, {"exam": 3, "id": 35, "question_en": "A company uses IAM Identity Center for workforce access to AWS accounts. Developers need 1-hour sessions for daily work, while break-glass administrators need 12-hour sessions during incident response. Both groups authenticate through the same SAML identity provider. The security team wants to enforce different session durations for each group without creating separate identity provider configurations.\n \nHow should they configure this?", "options_en": ["Create two IAM roles in each account with different maximum session duration settings, and configure IAM Identity Center to map each group to the appropriate role.", "Configure the SAML identity provider to include a SessionDuration attribute in the SAML assertion that varies based on the user group membership.", "Create a single permission set with the maximum 12-hour duration and use session policies to dynamically reduce the session duration for developer group members.", "Create separate IAM Identity Center permission sets for developers and break-glass administrators, configuring the session duration to 1 hour and 12 hours respectively, and assign each permission set to the appropriate group."], "correct": 3, "explanation_en": "IAM Identity Center permission sets include a configurable session duration that controls how long federated sessions last. By creating separate permission sets with different session durations and assigning them to the appropriate groups, the company can enforce different session lengths without modifying the identity provider. Permission sets are the native mechanism for managing session configurations in Identity Center. Configuring SAML SessionDuration attributes bypasses Identity Center management and makes auditing more difficult.", "question_zh": "一家公司使用 IAM Identity Center 让员工访问 AWS 账户。开发人员的日常工作需要 1 小时的会议，而破碎玻璃管理员在事件响应期间需要 12 小时的会议。两个组都通过相同的 SAML 身份提供商进行身份验证。安全团队希望为每个组强制实施不同的会话持续时间，而不创建单独的身份提供程序配置。\n \n他们应该如何配置？", "options_zh": ["在每个账户中创建两个具有不同最大会话持续时间设置的 IAM 角色，并配置 IAM Identity Center 以将每个组映射到适当的角色。", "配置 SAML 身份提供程序以在 SAML 断言中包含 SessionDuration 属性，该属性根据用户组成员身份而变化。", "创建最长持续时间为 12 小时的单个权限集，并使用会话策略动态缩短开发人员组成员的会话持续时间。", "为开发人员和打破玻璃管理员创建单独的 IAM Identity Center 权限集，将会话持续时间分别配置为 1 小时和 12 小时，并将每个权限集分配给适当的组。"], "explanation_zh": "IAM Identity Center 权限集包括可配置的会话持续时间，用于控制联合会话的持续时间。通过创建具有不同会话持续时间的单独权限集并将其分配给适当的组，公司可以强制执行不同的会话长度，而无需修改身份提供者。权限集是用于管理 Identity Center 中的会话配置的本机机制。配置 SAML SessionDuration 属性会绕过 Identity Center 管理并使审核变得更加困难。"}, {"exam": 3, "id": 36, "question_en": "A SaaS application uses Amazon Cognito User Pools for customer authentication. The security team has noticed an increase in credential stuffing attacks where attackers use stolen username and password combinations from other breached services. They want Cognito to automatically detect these attacks and apply adaptive responses without requiring all users to set up MFA.\n \nWhich Cognito feature addresses this?", "options_en": ["Enable Cognito User Pool device tracking with remembered devices, which fingerprints the user device and blocks sign-in attempts from unrecognized devices.", "Enable Cognito User Pool advanced security features with adaptive authentication, which uses risk scoring to detect anomalous sign-in attempts and can automatically challenge high-risk sign-ins with additional verification while allowing low-risk sign-ins to proceed normally.", "Configure Cognito User Pool Lambda triggers with a pre-authentication function that checks the source IP against a threat intelligence database and blocks known malicious IPs.", "Enable Cognito User Pool password policies with compromised credentials detection, which checks passwords against a database of known breached credentials during sign-in."], "correct": 1, "explanation_en": "Cognito advanced security features provide adaptive authentication that evaluates the risk of each sign-in attempt based on factors like device familiarity, IP reputation, and geographic location. High-risk sign-ins can automatically trigger additional verification challenges such as MFA while low-risk sign-ins proceed without friction. This addresses credential stuffing by detecting anomalous patterns without forcing all users to configure MFA. Device tracking alone does not provide risk-based adaptive responses to credential stuffing attacks.", "question_zh": "SaaS 应用程序使用 Amazon Cognito 用户池进行客户身份验证。安全团队注意到撞库攻击有所增加，攻击者使用从其他被破坏的服务中窃取的用户名和密码组合。他们希望 Cognito 自动检测这些攻击并应用自适应响应，而不需要所有用户设置 MFA。\n \nCognito 的哪个功能可以解决这个问题？", "options_zh": ["使用记住的设备启用 Cognito 用户池设备跟踪，这会对用户设备进行指纹识别并阻止来自无法识别的设备的登录尝试。", "通过自适应身份验证启用 Cognito 用户池高级安全功能，该功能使用风险评分来检测异常登录尝试，并可以通过额外验证自动质疑高风险登录，同时允许低风险登录正常进行。", "使用预身份验证功能配置 Cognito 用户池 Lambda 触发器，该功能可根据威胁情报数据库检查源 IP 并阻止已知的恶意 IP。", "启用具有泄露凭据检测功能的 Cognito 用户池密码策略，该检测可在登录期间根据已知泄露凭据的数据库检查密码。"], "explanation_zh": "Cognito 高级安全功能提供自适应身份验证，可根据设备熟悉程度、IP 信誉和地理位置等因素评估每次登录尝试的风险。高风险登录可能会自动触发额外的验证挑战，例如 MFA，而低风险登录则可以顺利进行。这可以通过检测异常模式来解决凭证填充问题，而无需强制所有用户配置 MFA。设备跟踪本身并不能提供针对撞库攻击的基于风险的自适应响应。"}, {"exam": 3, "id": 37, "question_en": "A company is building a multi-tenant SaaS application where each tenant users have different roles with varying permissions to access API resources. The application needs fine-grained, real-time authorization decisions that evaluate user roles, resource attributes, and tenant context. The authorization logic should be managed separately from application code.\n \nWhich service provides this capability?", "options_en": ["Amazon Verified Permissions with a Cedar policy store that defines authorization policies based on principal attributes, resource properties, and action types, providing real-time authorization decisions through the `IsAuthorized` API.", "Amazon Cognito User Pools with custom claims in JWT tokens that encode the user tenant ID and role, evaluated by API Gateway Lambda authorizers for each API request.", "AWS IAM with tag-based access control (ABAC) policies that use resource tags for tenant isolation and IAM role session tags for user role authorization.", "Amazon API Gateway resource policies combined with Lambda authorizers that query a DynamoDB table containing tenant-specific permission mappings for each API resource."], "correct": 0, "explanation_en": "Amazon Verified Permissions uses the Cedar policy language to define fine-grained authorization policies that evaluate principal attributes (like user roles), resource properties, and contextual information (like tenant ID). The `IsAuthorized` API provides real-time authorization decisions at scale. Policies are managed centrally in a policy store, separate from application code. Cognito JWT custom claims require implementing authorization logic in the application, while IAM ABAC is designed for AWS resource access, not application-level authorization.", "question_zh": "一家公司正在构建多租户 SaaS 应用程序，其中每个租户用户具有不同的角色，具有不同的访问 API 资源的权限。应用程序需要细粒度的实时授权决策来评估用户角色、资源属性和租户上下文。授权逻辑应与应用程序代码分开管理。\n \n哪个服务提供此功能？", "options_zh": ["使用 Cedar 策略存储进行 Amazon 验证权限，该策略存储根据主体属性、资源属性和操作类型定义授权策略，通过“IsAuthorized” API 提供实时授权决策。", "Amazon Cognito 用户池在 JWT 令牌中包含自定义声明，这些令牌对用户租户 ID 和角色进行编码，由 API Gateway Lambda 授权方针对每个 API 请求进行评估。", "具有基于标签的访问控制 (ABAC) 策略的 AWS IAM，该策略使用资源标签进行租户隔离，使用 IAM 角色会话标签进行用户角色授权。", "Amazon API Gateway 资源策略与 Lambda 授权者相结合，查询包含每个 API 资源的租户特定权限映射的 DynamoDB 表。"], "explanation_zh": "Amazon Verified Permissions 使用 Cedar 策略语言来定义细粒度的授权策略，以评估主体属性（如用户角色）、资源属性和上下文信息（如租户 ID）。 “IsAuthorized” API 提供大规模的实时授权决策。策略在策略存储中集中管理，与应用程序代码分开。 Cognito JWT 自定义声明需要在应用程序中实现授权逻辑，而 IAM ABAC 专为 AWS 资源访问而设计，而不是应用程序级授权。"}, {"exam": 3, "id": 38, "question_en": "A company uses IAM Roles Anywhere to grant temporary AWS credentials to on-premises servers using X.509 certificates issued by their private certificate authority. A certificate for one server has been compromised and needs to be immediately revoked so it can no longer obtain AWS credentials.\n \nHow should the security team revoke access?", "options_en": ["Delete the IAM Roles Anywhere trust anchor associated with the private CA, which immediately invalidates all certificates issued by that CA.", "Modify the IAM Roles Anywhere profile to add a condition that excludes the compromised certificate serial number from credential issuance.", "Upload a Certificate Revocation List (CRL) to IAM Roles Anywhere that includes the compromised certificate serial number, which prevents the certificate from being used to obtain temporary credentials.", "Revoke the certificate in the private CA and wait for IAM Roles Anywhere to automatically check the CA OCSP responder to reject the revoked certificate."], "correct": 2, "explanation_en": "IAM Roles Anywhere supports Certificate Revocation Lists (CRLs) that can be uploaded to the trust anchor. When a certificate serial number is added to the CRL, IAM Roles Anywhere will reject authentication attempts using that certificate. This allows revoking individual certificates without affecting other valid certificates from the same CA. Deleting the trust anchor would revoke access for all servers using certificates from that CA. IAM Roles Anywhere does not automatically check OCSP responders; CRL is the supported revocation mechanism.", "question_zh": "一家公司使用 IAM Roles Anywhere 向使用其私有证书颁发机构颁发的 X.509 证书的本地服务器授予临时 AWS 凭证。一台服务器的证书已被泄露，需要立即吊销，以便它无法再获取 AWS 凭证。\n \n安全团队应如何撤销访问权限？", "options_zh": ["删除与私有 CA 关联的 IAM Roles Anywhere 信任锚，这会立即使该 CA 颁发的所有证书失效。", "修改 IAM Roles Anywhere 配置文件以添加一个条件，将受损的证书序列号排除在证书颁发之外。", "将包含受损证书序列号的证书吊销列表 (CRL) 上传到 IAM Roles Anywhere，以防止该证书被用于获取临时凭证。", "吊销私有 CA 中的证书并等待 IAM Roles Anywhere 自动检查 CA OCSP 响应程序以拒绝吊销的证书。"], "explanation_zh": "IAM Roles Anywhere 支持可上传到信任锚的证书吊销列表 (CRL)。将证书序列号添加到 CRL 后，IAM Roles Anywhere 将拒绝使用该证书的身份验证尝试。这允许撤销单个证书而不影响来自同一 CA 的其他有效证书。删除信任锚将撤销使用该 CA 证书的所有服务器的访问权限。 IAM Roles Anywhere 不会自动检查 OCSP 响应程序； CRL 是支持的撤销机制。"}, {"exam": 3, "id": 39, "question_en": "A company has an on-premises Active Directory forest and wants to allow on-premises AD users to access AWS resources and applications while preventing AWS Managed Microsoft AD users from authenticating to on-premises resources. The trust relationship must minimize the security exposure of the on-premises directory.\n \nWhich trust configuration should be established?", "options_en": ["Create a two-way forest trust between AWS Managed Microsoft AD and on-premises AD, and use Group Policy Objects to restrict AWS users from accessing on-premises resources.", "Create an AD Connector pointing to the on-premises AD, which proxies authentication requests without creating a trust relationship between the directories.", "Create a one-way forest trust where the on-premises AD trusts the AWS Managed Microsoft AD domain, allowing AWS users to authenticate to on-premises resources.", "Create a one-way forest trust where the AWS Managed Microsoft AD trusts the on-premises AD forest, allowing on-premises users to authenticate to AWS resources while preventing AWS users from accessing on-premises resources."], "correct": 3, "explanation_en": "A one-way forest trust where AWS Managed Microsoft AD trusts the on-premises AD forest allows on-premises users to authenticate to AWS-hosted resources and applications. The trust is directional, so AWS Managed Microsoft AD users cannot authenticate to on-premises resources, minimizing security exposure. A two-way trust would allow authentication in both directions, which violates the requirement. AD Connector proxies authentication but does not support all AWS Managed Microsoft AD features like seamless domain join.", "question_zh": "一家公司拥有本地 Active Directory 林，希望允许本地 AD 用户访问 AWS 资源和应用程序，同时阻止 AWS Managed Microsoft AD 用户对本地资源进行身份验证。信任关系必须最大限度地减少本地目录的安全风险。\n \n应该建立哪种信任配置？", "options_zh": ["在 AWS Managed Microsoft AD 和本地 AD 之间创建双向林信任，并使用组策略对象限制 AWS 用户访问本地资源。", "创建指向本地 AD 的 AD 连接器，该连接器代理身份验证请求，而无需在目录之间创建信任关系。", "创建单向林信任，其中本地 AD 信任 AWS Managed Microsoft AD 域，从而允许 AWS 用户对本地资源进行身份验证。", "创建单向林信任，其中 AWS Managed Microsoft AD 信任本地 AD 林，允许本地用户对 AWS 资源进行身份验证，同时阻止 AWS 用户访问本地资源。"], "explanation_zh": "AWS Managed Microsoft AD 信任本地 AD 林的单向林信任允许本地用户对 AWS 托管的资源和应用程序进行身份验证。这种信任是定向的，因此 AWS Managed Microsoft AD 用户无法对本地资源进行身份验证，从而最大限度地减少安全风险。双向信任允许双向身份验证，这违反了要求。 AD Connector 代理身份验证，但不支持所有 AWS Managed Microsoft AD 功能，例如无缝域加入。"}, {"exam": 3, "id": 40, "question_en": "A company security team is migrating from overly permissive IAM policies to least-privilege policies. They need to generate IAM policies that reflect the actual API calls made by each IAM role over the past 90 days, rather than manually analyzing CloudTrail logs to determine required permissions.\n \nWhich feature automates this process?", "options_en": ["AWS CloudTrail Lake, which allows running SQL queries against CloudTrail events to identify unique API actions per IAM role and generate policy documents from query results.", "IAM Access Analyzer policy generation, which analyzes CloudTrail activity for a specified IAM role and generates an IAM policy that includes only the services and actions actually used during the analysis period.", "IAM Policy Simulator, which tests existing policies against simulated API calls and identifies which permissions can be safely removed based on usage patterns.", "AWS Config advanced queries, which scan IAM policies across accounts and compare them against a baseline of re
