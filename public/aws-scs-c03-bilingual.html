 Pool configured with Google as an external OIDC identity provider — no Cognito User Pool required. The mobile app authenticates directly with Google using the Google Sign-In SDK, receives a Google ID token, and exchanges it with the Identity Pool. The Identity Pool validates the token, maps the user to an IAM role, and returns temporary AWS credentials. The app uses those credentials directly with the AWS SDK to access S3 and invoke Lambda.\n \nThis is preferred over calling STS directly because Cognito Identity Pools handle token validation, credential caching, and refresh automatically through the AWS mobile SDK — reducing client-side complexity without requiring a Cognito User Pool.\n \nWhy the other options are incorrect:\n\nConfigure Google as an OIDC provider in IAM and call STS AssumeRoleWithWebIdentity directly: This is technically functional but requires the mobile app to implement STS API calls, token validation, and credential refresh manually. Cognito Identity Pools provide all of this as a managed abstraction and are the AWS-recommended pattern for this use case. While this option works, it is not the most appropriate architecture.\nAPI Gateway Lambda authorizer that validates Google tokens and generates credentials: A Lambda authorizer controls access to API Gateway endpoints — it does not vend AWS credentials to the mobile app client. The app would still have no credentials to directly access S3 or invoke Lambda. This option also misuses `AssumeRole` as a credential distribution mechanism, which is not how Lambda authorizers are designed to work.\nIAM Identity Center with Google Workspace as the identity source: IAM Identity Center is designed for workforce identity — employee SSO to the AWS Console, CLI, and internal applications. It requires Google Workspace (an enterprise directory), not consumer Google accounts, and uses SAML with browser-based redirects, which is a poor fit for native mobile app authentication.\n", "question_zh": "您的移动应用使用 Google 作为唯一的身份提供者（用户使用\"使用 Google 登录\"进行登录）。认证后，应用需要临时 AWS 凭证以直接访问 S3 进行文件存储，并调用 Lambda 函数进行后端处理。您不想使用 Amazon Cognito User Pools——只需要 Google 认证。\n\n什么是最合适的架构？", "options_zh": ["在 IAM 中将 Google 配置为 OpenID Connect (OIDC) 提供者。移动应用使用 Google 认证，接收 OIDC ID 令牌，然后直接使用 Google 令牌调用 STS AssumeRoleWithWebIdentity 以接收临时 AWS 凭证。", "创建配置了 Google 作为外部身份提供者的 Cognito Identity Pool（无需 Cognito User Pool）。移动应用使用 Google 认证，将 Google ID 令牌与 Cognito Identity Pool 交换为临时 AWS 凭证，然后直接访问 S3 和 Lambda。", "实施 API Gateway 配合 Lambda 授权器，通过调用 Google 的 tokeninfo 端点验证 Google ID 令牌。Lambda 授权器使用 STS AssumeRole 生成临时凭证，并在授权上下文中返回以供后端 Lambda 函数使用。", "使用 AWS IAM Identity Center（AWS SSO）配合 Google Workspace 作为身份源。移动应用将用户重定向到 Google 进行认证，接收 SAML 断言，与 IAM Identity Center 交换临时凭证，然后访问 AWS 服务。"], "explanation_zh": "正确的架构是配置了 Google 作为外部 OIDC 身份提供者的 Cognito Identity Pool——无需 Cognito User Pool。移动应用使用 Google Sign-In SDK 直接通过 Google 认证，接收 Google ID 令牌，并将其与 Identity Pool 交换。Identity Pool 验证令牌，将用户映射到 IAM 角色，并返回临时 AWS 凭证。应用直接使用 AWS SDK 的这些凭证访问 S3 和调用 Lambda。\n\n这优于直接调用 STS，因为 Cognito Identity Pools 通过 AWS 移动 SDK 自动处理令牌验证、凭证缓存和刷新——减少客户端复杂性而无需 Cognito User Pool。\n\n为什么其他选项不正确：\n\n在 IAM 中将 Google 配置为 OIDC 提供者并直接调用 STS AssumeRoleWithWebIdentity：这在技术上是可行的，但需要移动应用手动实施 STS API 调用、令牌验证和凭证刷新。Cognito Identity Pools 将这些作为托管抽象提供，是此用例的 AWS 推荐模式。虽然此选项可以工作，但不是最合适的架构。\nAPI Gateway Lambda 授权器验证 Google 令牌并生成凭证：Lambda 授权器控制对 API Gateway 端点的访问——它不向移动应用客户端发放 AWS 凭证。应用仍然没有凭证来直接访问 S3 或调用 Lambda。此选项还误用了 `AssumeRole` 作为凭证分发机制，这不是 Lambda 授权器的设计用途。\nIAM Identity Center 配合 Google Workspace 作为身份源：IAM Identity Center 是为劳动力身份设计的——员工 SSO 到 AWS Console、CLI 和内部应用程序。它需要 Google Workspace（企业目录），而不是消费者 Google 账户，并使用带有基于浏览器重定向的 SAML，这不适合原生移动应用。"}, {"exam": 1, "id": 57, "question_en": "Your company uses AWS Organizations with multiple AWS accounts for different environments. You want to implement attribute-based access control (ABAC) that allows developers to manage only EC2 instances they personally created. Each developer has a unique IAM user with a username matching their corporate ID. When a developer launches an EC2 instance, it should be automatically tagged with `Owner: `. Developers should be able to start, stop, and terminate only instances where the `Owner` tag matches their username.\n \nWhich IAM policy condition is MOST critical to enforce this?", "options_en": ["Use `aws:RequestTag/Owner` condition with `StringEquals: \"${aws:username}\"` on the `ec2:RunInstances` action to require that launched instances are tagged with the creator's username.", "Use `aws:ResourceTag/Owner` condition with `StringEquals: \"${aws:username}\"` on `ec2:StartInstances`, `ec2:StopInstances`, and `ec2:TerminateInstances` actions to restrict operations to instances matching the user's username.", "Use `aws:TagKeys` condition with `ForAllValues:StringEquals: [\"Owner\"]` on all EC2 actions to ensure only the Owner tag can be used for access control decisions.", "Use `ec2:ResourceTag/Owner` condition with `StringEquals: \"${aws:username}\"` on all EC2 instance operations to restrict access based on the instance tag."], "correct": 0, "explanation_en": "A complete ABAC solution for EC2 ownership requires two conditions working together, but the most critical is enforcing the `Owner` tag at launch time using `aws:RequestTag/Owner` on `ec2:RunInstances`.\n \n`aws:RequestTag/Owner` checks the tag value being submitted in the current API call. When combined with `${aws:username}`, it forces the developer to tag every instance they launch with their own username — and prevents them from tagging an instance with someone else's name. Without this condition, a developer could launch an instance with any `Owner` value (or none at all), which would break the downstream resource-tag checks entirely.\n \n`aws:ResourceTag/Owner` on `ec2:StartInstances`, `ec2:StopInstances`, and `ec2:TerminateInstances` is also required in a complete policy. It checks the tag already attached to the resource and blocks operations on instances the user does not own. However, this condition is only effective if instances were correctly tagged at creation — making the `aws:RequestTag` condition the foundational one.\n \nWhy the other options are incorrect:\n\nUsing `aws:ResourceTag/Owner` on start/stop/terminate only: Restricts operations correctly but does nothing to enforce correct tagging at launch. A developer could launch instances without the `Owner` tag, making those instances unmanageable by anyone under this policy.\nUsing `aws:TagKeys` with `ForAllValues:StringEquals`: This condition governs which tag keys are present in a request, not what the tag values are. It cannot enforce that the `Owner` value matches the caller's identity and provides no ABAC ownership control.\nUsing `ec2:ResourceTag/Owner` instead of `aws:ResourceTag/Owner`: `ec2:ResourceTag` is a service-specific condition key prefix that is not valid for IAM authorization conditions. The correct global condition key is `aws:ResourceTag/`, which works across all AWS services.\n", "question_zh": "您的公司使用 AWS Organizations 配合多个 AWS 账户用于不同环境。您希望实施基于属性的访问控制（ABAC），允许开发人员仅管理他们自己创建的 EC2 实例。每个开发人员有唯一的 IAM 用户，用户名与其企业 ID 匹配。当开发人员启动 EC2 实例时，应自动标记 `Owner: <username>`。开发人员应能够启动、停止和终止仅 `Owner` 标签与其用户名匹配的实例。\n\n哪个 IAM 策略条件对于强制执行此限制最关键？", "options_zh": ["在 `ec2:RunInstances` 操作上使用 `aws:RequestTag/Owner` 条件配合 `StringEquals: \"${aws:username}\"`，要求启动的实例标记创建者的用户名。", "在 `ec2:StartInstances`、`ec2:StopInstances` 和 `ec2:TerminateInstances` 操作上使用 `aws:ResourceTag/Owner` 条件配合 `StringEquals: \"${aws:username}\"`，将操作限制为与用户名匹配的实例。", "在所有 EC2 操作上使用 `aws:TagKeys` 条件配合 `ForAllValues:StringEquals: [\"Owner\"]`，确保只有 Owner 标签可用于访问控制决策。", "在所有 EC2 实例操作上使用 `ec2:ResourceTag/Owner` 条件配合 `StringEquals: \"${aws:username}\"`，根据实例标签限制访问。"], "explanation_zh": "完整的 EC2 所有权 ABAC 解决方案需要两个协同工作的条件，但最关键的是在启动时使用 `aws:RequestTag/Owner` 和 `ec2:RunInstances` 强制执行 `Owner` 标签。\n\n`aws:RequestTag/Owner` 检查当前 API 调用中正在提交的标签值。当与 `${aws:username}` 结合使用时，它强制开发人员将每个启动的实例标记为其自己的用户名——并防止他们以他人名称标记实例。没有此条件，开发人员可以以任何 `Owner` 值（或根本没有）启动实例，这将完全破坏下游资源标签检查。\n\n在 `ec2:StartInstances`、`ec2:StopInstances` 和 `ec2:TerminateInstances` 上使用 `aws:ResourceTag/Owner` 在完整策略中也是必需的。它检查已附加到资源的标签并阻止对用户不拥有的实例的操作。但是，此条件仅在实例在创建时正确标记时才有效——使 `aws:RequestTag` 条件成为基础条件。\n\n为什么其他选项不正确：\n\n仅在启动/停止/终止上使用 `aws:ResourceTag/Owner`：正确限制操作，但不强制执行创建时的正确标记。开发人员可以在没有 `Owner` 标签的情况下启动实例，使这些实例在此策略下任何人都无法管理。\n使用 `aws:TagKeys` 配合 `ForAllValues:StringEquals`：此条件控制请求中存在哪些标签键，而不是标签值是什么。它无法强制执行 `Owner` 值与调用者身份匹配，并且不提供 ABAC 所有权控制。\n使用 `ec2:ResourceTag/Owner` 而非 `aws:ResourceTag/Owner`：`ec2:ResourceTag` 是服务特定的条件键前缀，对 IAM 授权条件无效。正确的全局条件键是 `aws:ResourceTag/`，适用于所有 AWS 服务。"}, {"exam": 1, "id": 58, "question_en": "Your security team wants to enforce that all Secrets Manager secrets created by IAM users must have two specific tags: `environment` (with values either \"preprod\" or \"production\") and `cost-center`. Users should NOT be able to create secrets with any other tags. The policy should prevent secrets from being created without these exact tags or with additional tags beyond these two.\n \nWhich IAM policy statement BEST enforces this requirement?", "options_en": ["`{\n \"Effect\": \"Allow\",\n \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:RequestTag/environment\": [\"preprod\", \"production\"]\n },\n \"Null\": {\n \"aws:RequestTag/cost-center\": \"false\"\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:RequestTag/environment\": [\"preprod\", \"production\"]\n },\n \"Null\": {\n \"aws:TagKeys\": \"false\"\n },\n \"ForAllValues:StringEquals\": {\n \"aws:TagKeys\": [\"environment\", \"cost-center\"]\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"ForAnyValue:StringEquals\": {\n \"aws:RequestTag/environment\": [\"preprod\", \"production\"]\n },\n \"StringLike\": {\n \"aws:TagKeys\": [\"environment\", \"cost-center\"]\n }\n }\n}`", "`{\n \"Effect\": \"Allow\",\n \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"],\n \"Resource\": \"*\",\n \"Condition\": {\n \"StringEquals\": {\n \"aws:RequestTag/environment\": [\"preprod\", \"production\"],\n \"aws:ResourceTag/cost-center\": \"*\"\n },\n \"ForAllValues:StringEquals\": {\n \"aws:TagKeys\": [\"environment\", \"cost-center\"]\n }\n }\n}`"], "correct": 1, "explanation_en": "The correct policy uses three conditions together: `StringEquals` on `aws:RequestTag/environment` to enforce the valid values (preprod or production), `Null: false` on `aws:TagKeys` to ensure at least one tag is present, and — most critically — `ForAllValues:StringEquals` on `aws:TagKeys` to restrict the entire set of tag keys in the request to only `environment` and `cost-center`. The `ForAllValues` operator means every tag key being submitted must appear in the allowed list; if a user attempts to add any extra tag key (e.g., `owner`), the condition fails and the request is denied.\n \nWhy the other options are incorrect:\n\nPolicy using `StringEquals` on `aws:RequestTag/environment` and `Null` on `aws:RequestTag/cost-center` only: This validates the environment tag value and requires cost-center to be present, but it does not restrict what other tag keys can be submitted. A user could add any number of additional tags (e.g., `owner`, `project`) and the policy would still allow the request. The missing piece is a `ForAllValues:StringEquals` on `aws:TagKeys`.\nPolicy using `ForAnyValue:StringEquals` on `aws:RequestTag/environment` and `StringLike` on `aws:TagKeys`: Two errors here. `ForAnyValue` on a single-value tag check is semantically wrong — it would allow the request as long as at least one submitted value matches, which can produce incorrect results. `StringLike` on `aws:TagKeys` does not enforce an exhaustive allowlist; it performs pattern matching and does not prevent additional tag keys from being present.\nPolicy using `aws:ResourceTag/cost-center` instead of `aws:RequestTag/cost-center`: `aws:ResourceTag` checks tags that are already on the existing resource. During a `CreateSecret` call, the resource does not exist yet and therefore has no existing tags. This condition would never be satisfied for a creation operation, making the policy non-functional for its intended purpose.\n", "question_zh": "您的安全团队希望强制执行所有由 IAM 用户创建的 Secrets Manager 密钥必须具有两个特定标签：`environment`（值为 \"preprod\" 或 \"production\"）和 `cost-center`。用户不应能够创建带有任何其他标签的密钥。策略应防止创建没有这些确切标签或带有超出这两个标签之外的额外标签的密钥。\n\n哪个 IAM 策略语句最能强制执行此要求？", "options_zh": ["`{\"Effect\": \"Allow\", \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"], \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"aws:RequestTag/environment\": [\"preprod\", \"production\"]}, \"Null\": {\"aws:RequestTag/cost-center\": \"false\"}}}`", "`{\"Effect\": \"Allow\", \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"], \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"aws:RequestTag/environment\": [\"preprod\", \"production\"]}, \"Null\": {\"aws:TagKeys\": \"false\"}, \"ForAllValues:StringEquals\": {\"aws:TagKeys\": [\"environment\", \"cost-center\"]}}}`", "`{\"Effect\": \"Allow\", \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"], \"Resource\": \"*\", \"Condition\": {\"ForAnyValue:StringEquals\": {\"aws:RequestTag/environment\": [\"preprod\", \"production\"]}, \"StringLike\": {\"aws:TagKeys\": [\"environment\", \"cost-center\"]}}}`", "`{\"Effect\": \"Allow\", \"Action\": [\"secretsmanager:CreateSecret\", \"secretsmanager:TagResource\"], \"Resource\": \"*\", \"Condition\": {\"StringEquals\": {\"aws:RequestTag/environment\": [\"preprod\", \"production\"], \"aws:ResourceTag/cost-center\": \"*\"}, \"ForAllValues:StringEquals\": {\"aws:TagKeys\": [\"environment\", \"cost-center\"]}}}`"], "explanation_zh": "正确的策略使用三个条件：`StringEquals` 和 `aws:RequestTag/environment` 强制执行有效值（preprod 或 production），`Null: false` 和 `aws:TagKeys` 确保至少存在一个标签，且最关键的是——`ForAllValues:StringEquals` 和 `aws:TagKeys` 将请求中的整个标签键集限制为仅 `environment` 和 `cost-center`。`ForAllValues` 操作符意味着提交的每个标签键必须出现在允许列表中；如果用户尝试添加任何额外的标签键（例如 `owner`），条件失败且请求被拒绝。\n\n为什么其他选项不正确：\n\n仅使用 `StringEquals` 和 `aws:RequestTag/environment` 以及 `Null` 和 `aws:RequestTag/cost-center` 的策略：这验证了 environment 标签值并要求 cost-center 存在，但它不限制可以提交哪些其他标签键。用户可以添加任意数量的额外标签（例如 `owner`、`project`），策略仍然允许请求。缺少的部分是 `ForAllValues:StringEquals` 和 `aws:TagKeys`。\n使用 `ForAnyValue:StringEquals` 和 `aws:RequestTag/environment` 以及 `StringLike` 和 `aws:TagKeys` 的策略：这里有两个错误。`ForAnyValue` 在单值标签检查上语义错误——只要至少一个提交的值匹配，它就会允许请求，这可能产生不正确的结果。`StringLike` 和 `aws:TagKeys` 不强制执行详尽的允许列表；它执行模式匹配，不能防止存在额外的标签键。\n使用 `aws:ResourceTag/cost-center` 而非 `aws:RequestTag/cost-center` 的策略：`aws:ResourceTag` 检查资源上已有的标签。在 `CreateSecret` 调用期间，资源尚不存在，因此没有现有标签。此条件对于创建操作永远无法满足，使策略无法用于其预期目的。"}, {"exam": 2, "id": 1, "question_en": "Your organization has 200 AWS accounts managed through AWS Organizations. The security team needs to enable Amazon GuardDuty across all accounts and centrally manage findings. The management account should not be used for day-to-day security operations.\n \nWhat is the RECOMMENDED approach?", "options_en": ["Enable GuardDuty in each account individually and use EventBridge rules to forward findings to a central SNS topic.", "Enable GuardDuty only in the management account and configure cross-account IAM roles for each member account.", "Designate a dedicated security account as the GuardDuty delegated administrator and auto-enable GuardDuty for all organization accounts.", "Create a CloudFormation StackSet to deploy GuardDuty in all accounts and aggregate findings using a centralized S3 bucket."], "correct": 2, "explanation_en": "The recommended approach is to designate a dedicated security account (not the management account) as the GuardDuty delegated administrator. This account can auto-enable GuardDuty for all existing and new organization accounts and centrally view and manage findings. Using the management account for day-to-day operations is an anti-pattern because it concentrates too many responsibilities. The delegated administrator model follows the principle of least privilege while providing centralized visibility.", "question_zh": "您的组织通过 AWS Organizations 管理 200 个 AWS 账户。安全团队需要在所有账户中启用 Amazon GuardDuty 并集中管理发现结果。管理账户不应用于日常安全操作。推荐的方案是什么？", "options_zh": ["在每个账户中单独启用 GuardDuty，并使用 EventBridge 规则将发现结果转发到中央 SNS 主题。", "仅在管理账户中启用 GuardDuty，并为每个成员账户配置跨账户 IAM 角色。", "指定一个专用的安全账户作为 GuardDuty 委派管理员，并为所有组织账户自动启用 GuardDuty。", "创建一个 CloudFormation StackSet 在所有账户中部署 GuardDuty，并使用集中式 S3 存储桶聚合发现结果。"], "explanation_zh": "推荐方案是指定一个专用的安全账户（而非管理账户）作为 GuardDuty 委派管理员。此账户可以为所有现有和新加入的组织账户自动启用 GuardDuty，并集中查看和管理发现结果。将管理账户用于日常操作是一种反模式，因为它集中了过多职责。委派管理员模型遵循最小权限原则，同时提供集中可见性。"}, {"exam": 2, "id": 2, "question_en": "A multinational company operates workloads in `us-east-1`, `eu-west-1`, and `ap-southeast-1`. Their security operations center (SOC) in `us-east-1` needs a unified view of all Security Hub findings across all Regions from a single pane of glass.\n \nWhich configuration achieves this requirement?", "options_en": ["Designate `us-east-1` as the Security Hub aggregation Region and link `eu-west-1` and `ap-southeast-1` as linked Regions.", "Create an EventBridge rule in each Region to forward Security Hub findings to an SQS queue in `us-east-1`.", "Enable AWS Config aggregator in `us-east-1` and use Config rules to evaluate Security Hub findings.", "Deploy a Lambda function in each Region that periodically exports findings to an S3 bucket in `us-east-1`."], "correct": 0, "explanation_en": "Security Hub supports cross-Region aggregation natively. You designate one Region as the aggregation Region and link other Regions to it. This provides a unified view of findings, compliance status, and security scores across all linked Regions without custom automation or additional infrastructure.", "question_zh": "一家跨国公司在 us-east-1、eu-west-1 和 ap-southeast-1 运行工作负载。其位于 us-east-1 的安全运营中心 (SOC) 需要通过统一视图从单一界面查看所有区域的 Security Hub 发现结果。哪种配置能满足此需求？", "options_zh": ["将 us-east-1 指定为 Security Hub 聚合区域，并将 eu-west-1 和 ap-southeast-1 链接为关联区域。", "在每个区域创建 EventBridge 规则，将 Security Hub 发现结果转发到 us-east-1 中的 SQS 队列。", "在 us-east-1 中启用 AWS Config 聚合器，并使用 Config 规则评估 Security Hub 发现结果。", "在每个区域部署 Lambda 函数，定期将发现结果导出到 us-east-1 中的 S3 存储桶。"], "explanation_zh": "Security Hub 原生支持跨区域聚合。您可以指定一个区域作为聚合区域，并将其他区域链接到该区域。这提供了跨所有关联区域的统一发现结果、合规状态和安全评分视图，无需自定义自动化或额外基础设施。"}, {"exam": 2, "id": 3, "question_en": "Your security team needs to investigate API activity across 50 AWS accounts over the past 90 days. They need to run ad-hoc SQL queries on management events and identify which IAM principals performed specific actions. The team wants the simplest operational approach without managing infrastructure.\n \nWhich solution BEST meets these requirements?", "options_en": ["Configure CloudTrail to deliver logs to a centralized S3 bucket with Athena tables partitioned by account and date.", "Stream CloudTrail events to Amazon OpenSearch Service and use dashboards for investigation.", "Use Amazon Detective to automatically correlate API calls and identify the responsible IAM principals.", "Enable CloudTrail Lake with an organization event data store and query events using CloudTrail Lake SQL queries."], "correct": 3, "explanation_en": "CloudTrail Lake provides a managed, serverless event data store that supports SQL-based queries directly on CloudTrail events. An organization event data store can aggregate events from all accounts in an organization. This eliminates the need to manage S3 buckets, Athena tables, Glue crawlers, or partitioning schemes. CloudTrail Lake is the simplest operational approach for ad-hoc querying of management events across multiple accounts.", "question_zh": "您的安全团队需要调查过去 90 天内 50 个 AWS 账户的 API 活动。他们需要对管理事件运行即席 SQL 查询，并识别哪些 IAM 主体执行了特定操作。团队希望采用最简单的运营方式，无需管理基础设施。哪种解决方案最能满足这些要求？", "options_zh": ["配置 CloudTrail 将日志传输到集中式 S3 存储桶，使用按账户和日期分区的 Athena 表。", "将 CloudTrail 事件流式传输到 Amazon OpenSearch Service，并使用仪表板进行调查。", "使用 Amazon Detective 自动关联 API 调用并识别负责的 IAM 主体。", "启用 CloudTrail Lake 并创建组织事件数据存储，使用 CloudTrail Lake SQL 查询来查询事件。"], "explanation_zh": "CloudTrail Lake 提供托管的无服务器事件数据存储，支持直接对 CloudTrail 事件进行基于 SQL 的查询。组织事件数据存储可以聚合组织中所有账户的事件。这消除了管理 S3 存储桶、Athena 表、Glue 爬虫或分区方案的需要。对于跨多个账户的管理事件即席查询，CloudTrail Lake 是最简单的运营方案。"}, {"exam": 2, "id": 4, "question_en": "A compliance requirement mandates that any usage of the AWS root account credentials must generate an immediate alert to the security team. The solution should work across all API calls made with root credentials.\n \nWhat is the MOST effective approach?", "options_en": ["Enable AWS Config rule `root-account-mfa-enabled` and configure automatic remediation to notify the security team.", "Create a CloudWatch metric filter on the CloudTrail log group that matches events where `userIdentity.type` is `Root`, then create a CloudWatch alarm with an SNS notification.", "Create a GuardDuty custom threat list that includes the root account ARN and configure finding notifications.", "Use IAM Access Analyzer to monitor root account API calls and generate findings when root credentials are used."], "correct": 1, "explanation_en": "A CloudWatch metric filter applied to the CloudTrail log group is the standard approach for detecting root account usage. The filter matches events where `userIdentity.type` equals `Root` and triggers a CloudWatch alarm that sends an SNS notification. This is a CIS AWS Foundations Benchmark recommendation and provides near-real-time alerting. The Config rule only checks if MFA is enabled, not if root is being used. GuardDuty and IAM Access Analyzer do not provide this specific detection mechanism.", "question_zh": "合规要求规定，任何对 AWS 根账户凭证的使用都必须立即向安全团队发出告警。该解决方案应适用于使用根凭证进行的所有 API 调用。什么是最有效的方法？", "options_zh": ["启用 AWS Config 规则 root-account-mfa-enabled 并配置自动修复以通知安全团队。", "在 CloudTrail 日志组上创建 CloudWatch 指标筛选器，匹配 userIdentity.type 为 Root 的事件，然后创建 CloudWatch 告警并发送 SNS 通知。", "创建一个包含根账户 ARN 的 GuardDuty 自定义威胁列表，并配置发现结果通知。", "使用 IAM Access Analyzer 监控根账户 API 调用，并在使用根凭证时生成发现结果。"], "explanation_zh": "在 CloudTrail 日志组上应用 CloudWatch 指标筛选器是检测根账户使用的标准方法。筛选器匹配 userIdentity.type 等于 Root 的事件，并触发 CloudWatch 告警发送 SNS 通知。这是 CIS AWS Foundations Benchmark 的建议，并提供近实时告警。Config 规则仅检查是否启用了 MFA，而不是根账户是否被使用。GuardDuty 和 IAM Access Analyzer 不提供此特定检测机制。"}, {"exam": 2, "id": 5, "question_en": "Your organization has deployed Amazon Security Lake and wants to grant a third-party SIEM tool access to consume security events. The SIEM tool needs to receive events in near-real-time as they are ingested into Security Lake.\n \nHow should you configure subscriber access for this use case?", "options_en": ["Create a data access subscriber that queries the Security Lake S3 bucket directly using Athena.", "Create a query access subscriber and schedule automated Athena queries every 5 minutes.", "Create a subscriber with data access that receives event notifications via SQS and retrieves new objects from the S3 bucket.", "Configure an S3 event notification on the Security Lake bucket to trigger a Lambda function that forwards events to the SIEM."], "correct": 2, "explanation_en": "For near-real-time consumption, Security Lake supports subscriber data access, which notifies the subscriber via an SQS queue (or HTTPS endpoint) when new data is available in the S3 bucket. The subscriber then retrieves the data directly from S3. This is the recommended pattern for SIEM integrations that need near-real-time event ingestion. Query access subscribers use Athena for ad-hoc queries and are better suited for on-demand analysis rather than continuous streaming.", "question_zh": "您的组织已部署 Amazon Security Lake，并希望授权第三方 SIEM 工具消费安全事件。该 SIEM 工具需要近实时地接收 Security Lake 中摄入的事件。您应如何为此用例配置订阅者访问权限？", "options_zh": ["创建一个数据访问订阅者，使用 Athena 直接查询 Security Lake S3 存储桶。", "创建一个查询访问订阅者，并安排每 5 分钟自动化执行 Athena 查询。", "创建一个支持数据访问的订阅者，通过 SQS 接收事件通知并从 S3 存储桶中检索新对象。", "在 Security Lake 存储桶上配置 S3 事件通知，触发 Lambda 函数将事件转发到 SIEM。"], "explanation_zh": "对于近实时消费，Security Lake 支持订阅者数据访问，当 S3 存储桶中有新数据可用时，通过 SQS 队列（或 HTTPS 端点）通知订阅者。订阅者随后直接从 S3 检索数据。这是需要近实时事件摄入的 SIEM 集成的推荐模式。查询访问订阅者使用 Athena 进行即席查询，更适合按需分析而非连续流式传输。"}, {"exam": 2, "id": 6, "question_en": "Your security team received a GuardDuty finding of type `AttackSequence:S3/CompromisedData` with a critical severity. The finding describes a multi-stage attack involving credential discovery, S3 enumeration, and data exfiltration from a sensitive bucket.\n \nWhat does this finding type represent, and how should you prioritize it?", "options_en": ["A correlated sequence of multiple activities that collectively indicate an in-progress attack, requiring immediate investigation as a critical-severity finding.", "A single suspicious API call to an S3 bucket that should be treated as a medium-severity informational finding.", "A potential false positive generated by automated scanning tools that requires tuning the GuardDuty threat intelligence feed.", "A finding from a third-party integration that GuardDuty imported via the `BatchImportFindings` API."], "correct": 0, "explanation_en": "GuardDuty Extended Threat Detection identifies attack sequences by correlating multiple activities across data sources that collectively indicate an in-progress attack. The `AttackSequence` finding type represents a critical-severity, multi-stage threat (such as credential compromise followed by data exfiltration) rather than a single anomalous event. These findings are always critical severity and require immediate investigation. GuardDuty generates them natively using AI/ML correlation - they are not imported from third-party tools.", "question_zh": "您的安全团队收到了一条 GuardDuty 发现结果，类型为 AttackSequence:S3/CompromisedData，严重级别为严重。该发现结果描述了一个涉及凭证发现、S3 枚举和从敏感存储桶中数据泄露的多阶段攻击。此发现类型代表什么，您应如何确定其优先级？", "options_zh": ["多个活动的关联序列，共同表明攻击正在进行中，需要立即作为严重级别发现结果进行调查。", "指向 S3 存储桶的单次可疑 API 调用，应作为中等严重级别的信息性发现结果处理。", "由自动化扫描工具生成的潜在误报，需要调整 GuardDuty 威胁情报源。", "GuardDuty 通过 BatchImportFindings API 导入的第三方集成发现结果。"], "explanation_zh": "GuardDuty 扩展威胁检测通过关联跨多个数据源的多个活动来识别攻击序列，这些活动共同表明攻击正在进行中。AttackSequence 发现类型代表严重级别的多阶段威胁（例如凭证泄露后跟数据泄露），而非单个异常事件。这些发现结果始终为严重级别，需要立即调查。GuardDuty 使用 AI/ML 关联原生生成这些发现结果——它们不是从第三方工具导入的。"}, {"exam": 2, "id": 7, "question_en": "A security team is investigating potential data exfiltration from an EC2 instance. They need to analyze all network traffic leaving the instance, including the traffic direction and destination service information.\n \nWhich VPC Flow Log configuration provides the necessary data?", "options_en": ["Enable default VPC Flow Logs at the VPC level, delivering to CloudWatch Logs, capturing all traffic.", "Enable VPC Flow Logs at the subnet level with the default format and a REJECT filter.", "Enable VPC Flow Logs with the default format at the instance level, delivering to an S3 bucket.", "Enable VPC Flow Logs at the ENI level for the suspect instance with a custom format including `srcaddr`, `dstaddr`, `bytes`, `flow-direction`, and `pkt-dst-aws-service` fields."], "correct": 3, "explanation_en": "For investigating potential data exfiltration from a specific instance, ENI-level flow logs with a custom format provide the most targeted and useful data. Including `flow-direction` distinguishes inbound from outbound traffic, `bytes` reveals data volume, and `pkt-dst-aws-service` identifies whether traffic is going to AWS services or external destinations. The default format lacks `flow-direction` and `pkt-dst-aws-service` fields. Capturing only REJECT traffic would miss exfiltration attempts that were allowed through.", "question_zh": "安全团队正在调查从 EC2 实例潜在的数据泄露。他们需要分析离开该实例的所有网络流量，包括流量方向和目标服务信息。哪种 VPC Flow Log 配置能提供必要的数据？", "options_zh": ["在 VPC 级别启用默认 VPC Flow Logs，传输到 CloudWatch Logs，捕获所有流量。", "在子网级别启用 VPC Flow Logs，使用默认格式和 REJECT 筛选器。", "在实例级别启用默认格式的 VPC Flow Logs，传输到 S3 存储桶。", "在可疑实例的 ENI 级别启用 VPC Flow Logs，使用包含 srcaddr、dstaddr、bytes、flow-direction 和 pkt-dst-aws-service 字段的自定义格式。"], "explanation_zh": "对于调查来自特定实例的潜在数据泄露，ENI 级别的流日志配合自定义格式可提供最有针对性和最有用的数据。包含 flow-direction 可以区分入站和出站流量，bytes 可以揭示数据量，pkt-dst-aws-service 可以识别流量是流向 AWS 服务还是外部目标。默认格式缺少 flow-direction 和 pkt-dst-aws-service 字段。仅捕获 REJECT 流量会遗漏通过允许规则的外泄尝试。"}, {"exam": 2, "id": 8, "question_en": "Your organization stores CloudTrail logs in a centralized S3 bucket and uses Amazon Athena for security investigations. Queries are slow and expensive because they scan all log files in the bucket.\n \nHow can you optimize Athena queries for CloudTrail data?", "options_en": ["Convert CloudTrail JSON logs to Apache Parquet format using AWS Glue ETL and create a new Athena table pointing to the Parquet data.", "Create a CloudTrail-specific Athena table with partition projection using the account, region, and date partition keys that match the CloudTrail S3 path structure.", "Enable S3 Select on the CloudTrail S3 bucket to allow Athena to push predicates down to individual JSON files.", "Use CloudTrail Lake instead, which eliminates the need to manage Athena tables entirely."], "correct": 1, "explanation_en": "CloudTrail delivers logs in a predictable S3 path structure organized by account, region, and date. Using Athena partition projection with these keys allows Athena to prune partitions and scan only the relevant S3 prefixes matching the query predicates. This dramatically reduces both query execution time and cost by avoiding full-bucket scans. While converting to Parquet also improves performance, partition projection is the more impactful and simpler optimization for CloudTrail specifically.", "question_zh": "您的组织将 CloudTrail 日志存储在集中式 S3 存储桶中，并使用 Amazon Athena 进行安全调查。查询速度慢且成本高，因为每次查询都扫描存储桶中的所有日志文件。如何优化针对 CloudTrail 数据的 Athena 查询？", "options_zh": ["使用 AWS Glue ETL 将 CloudTrail JSON 日志转换为 Apache Parquet 格式，并创建指向 Parquet 数据的新 Athena 表。", "使用与 CloudTrail S3 路径结构匹配的 account、region 和 date 分区键，创建带有分区投影的 CloudTrail 专用 Athena 表。", "在 CloudTrail S3 存储桶上启用 S3 Select，允许 Athena 将谓词下推到单个 JSON 文件。", "改用 CloudTrail Lake，这完全消除了管理 Athena 表的需要。"], "explanation_zh": "CloudTrail 以可预测的 S3 路径结构传输日志，按 account、region 和 date 组织。使用这些键通过 Athena 分区投影可以让 Athena 剪除分区，仅扫描与查询谓词匹配的相关 S3 前缀。这通过避免全桶扫描大幅减少了查询执行时间和成本。虽然转换为 Parquet 也能提高性能，但对于 CloudTrail 来说，分区投影是更有效且更简单的优化。"}, {"exam": 2, "id": 9, "question_en": "A company has deployed Amazon OpenSearch Service for centralized log analysis. They ingest VPC Flow Logs, CloudTrail logs, and application logs. The security team wants automated alerting when detection rules identify anomalous patterns like brute-force authentication attempts across their applications.\n \nWhich OpenSearch Service feature should they use?", "options_en": ["OpenSearch Security Analytics with detection rules based on the Sigma format to identify security threats and generate findings.", "OpenSearch cross-cluster search to query authentication logs across multiple domains.", "OpenSearch Index State Management (ISM) policies that send alerts based on index size.", "A Logstash pipeline with custom filters to count authentication failures and send alerts."], "correct": 0, "explanation_en": "OpenSearch Security Analytics is purpose-built for detecting security threats from log data. It supports pre-packaged and custom detection rules in Sigma format, which is an open standard for SIEM detection rules. These rules can identify patterns like brute-force authentication attempts, anomalous login patterns, and other security events. When a rule matches, Security Analytics generates findings and can trigger notifications. Cross-cluster search queries across domains but is not a detection engine. ISM manages index lifecycle, not security alerting.", "question_zh": "一家公司已部署 Amazon OpenSearch Service 用于集中式日志分析。他们摄入 VPC Flow Logs、CloudTrail 日志和应用程序日志。安全团队希望在检测规则识别出异常模式（如跨应用程序的暴力认证尝试）时自动发出告警。应使用 OpenSearch Service 的哪个功能？", "options_zh": ["OpenSearch Security Analytics，使用基于 Sigma 格式的检测规则来识别安全威胁并生成发现结果。", "OpenSearch 跨集群搜索，跨多个域查询认证日志。", "OpenSearch 索引状态管理 (ISM) 策略，根据索引大小发送告警。", "使用 Logstash 管道配合自定义筛选器来计算认证失败次数并发送告警。"], "explanation_zh": "OpenSearch Security Analytics 专为从日志数据中检测安全威胁而设计。它支持基于 Sigma 格式的预打包和自定义检测规则，Sigma 是 SIEM 检测规则的开放标准。这些规则可以识别暴力认证尝试、异常登录模式和其他安全事件。当规则匹配时，Security Analytics 会生成发现结果并可触发通知。跨集群搜索跨域查询但不是检测引擎。ISM 管理索引生命周期，而非安全告警。"}, {"exam": 2, "id": 10, "question_en": "A security analyst suspects that a compromised EC2 instance is using DNS tunneling to exfiltrate data. The analyst needs to capture all DNS queries made by resources within the VPC to identify suspicious query patterns.\n \nWhich service should the analyst enable?", "options_en": ["Enable VPC Flow Logs with DNS query metadata fields.", "Enable CloudTrail data events for Route 53 to capture DNS API calls.", "Enable GuardDuty DNS monitoring, which logs all DNS queries to an S3 bucket for analysis.", "Enable Route 53 Resolver query logging for the VPC and send logs to CloudWatch Logs for analysis."], "correct": 3, "explanation_en": "Route 53 Resolver query logging captures all DNS queries made by resources within a VPC, including the query name, type, response, and the source ENI. This data is essential for detecting DNS tunneling, which uses encoded data in DNS query names to exfiltrate information. Logs can be sent to CloudWatch Logs, S3, or Kinesis Data Firehose. VPC Flow Logs do not include DNS query content. CloudTrail captures Route 53 management API calls (like creating hosted zones), not actual DNS resolution queries. GuardDuty uses DNS logs internally for detection but does not expose raw DNS query logs to the customer.", "question_zh": "一名安全分析师怀疑被入侵的 EC2 实例正在使用 DNS 隧道外泄数据。分析师需要捕获 VPC 内资源发出的所有 DNS 查询，以识别可疑的查询模式。应启用哪个服务？", "options_zh": ["启用 VPC Flow Logs 并包含 DNS 查询元数据字段。", "启用 Route 53 的 CloudTrail 数据事件以捕获 DNS API 调用。", "启用 GuardDuty DNS 监控，它将所有 DNS 查询记录到 S3 存储桶供分析。", "为 VPC 启用 Route 53 Resolver 查询日志记录，并将日志发送到 CloudWatch Logs 供分析。"], "explanation_zh": "Route 53 Resolver 查询日志记录捕获 VPC 内资源发出的所有 DNS 查询，包括查询名称、类型、响应和源 ENI。这些数据对于检测 DNS 隧道至关重要，DNS 隧道使用 DNS 查询名称中编码的数据来外泄信息。日志可以发送到 CloudWatch Logs、S3 或 Kinesis Data Firehose。VPC Flow Logs 不包含 DNS 查询内容。CloudTrail 捕获 Route 53 管理 API 调用（如创建托管区域），而非实际的 DNS 解析查询。GuardDuty 在内部使用 DNS 日志进行检测，但不会向客户公开原始 DNS 查询日志。"}, {"exam": 2, "id": 11, "question_en": "An AWS access key belonging to an IAM user has been identified on a paste site. The key prefix is `AKIA`. The security team needs to immediately contain the threat while preserving evidence for investigation.\n \nWhat is the CORRECT order of incident response actions?", "options_en": ["Delete the IAM user, review CloudTrail for unauthorized activity, create a new IAM user with fresh credentials.", "Disable the access key, attach a deny-all inline policy to the user, review CloudTrail for unauthorized actions, and check for any additional access keys or console access on the user.", "Rotate the access key, notify the user, and enable MFA on the account.", "Revoke all active sessions by setting the `aws:TokenIssueTime` condition, then delete the access key."], "correct": 1, "explanation_en": "The correct response is to first disable (not delete) the compromised access key to preserve it as evidence. Next, attach a deny-all inline policy to the IAM user to block any remaining access paths (such as a second access key or console password). Then review CloudTrail to determine what actions were taken with the compromised credentials. Finally, check for additional credentials on the same user. Deleting the user destroys evidence. Simply rotating the key does not address potential ongoing sessions from the compromised key.", "question_zh": "属于某个 IAM 用户的 AWS 访问密钥在一个粘贴网站上被发现。密钥前缀为 AKIA。安全团队需要立即遏制威胁，同时保留证据以供调查。正确的应急响应操作顺序是什么？", "options_zh": ["删除 IAM 用户，审查 CloudTrail 中的未授权活动，创建具有新凭证的新 IAM 用户。", "禁用访问密钥，向用户附加拒绝所有操作的内联策略，审查 CloudTrail 中的未授权操作，并检查该用户是否有其他访问密钥或控制台访问权限。", "轮换访问密钥，通知用户，并为账户启用 MFA。", "通过设置 aws:TokenIssueTime 条件撤销所有活动会话，然后删除访问密钥。"], "explanation_zh": "正确的响应是首先禁用（而非删除）被泄露的访问密钥，以将其保留为证据。接下来，向 IAM 用户附加拒绝所有操作的内联策略，以阻止任何剩余的访问路径（如第二个访问密钥或控制台密码）。然后审查 CloudTrail 以确定使用被泄露凭证执行了哪些操作。最后，检查同一用户是否有其他凭证。删除用户会销毁证据。仅轮换密钥不能解决被泄露密钥可能存在的持续会话问题。"}, {"exam": 2, "id": 12, "question_en": "Your organization requires that all EC2 instances have the latest Systems Manager (SSM) agent version running. If an instance is found with an outdated agent, it should be automatically updated without manual intervention.\n \nWhich combination provides automated detection and remediation?", "options_en": ["Create a GuardDuty custom finding for outdated SSM agents and use a Lambda function to update the agent.", "Deploy an Inspector assessment to check SSM agent versions and create an SNS notification for remediation.", "Create an AWS Config managed rule to check SSM agent compliance, and configure an automatic remediation action using the `AWS-UpdateSSMAgent` SSM Automation document.", "Use EventBridge Scheduler to run the `AWS-UpdateSSMAgent` document on all instances every hour regardless of compliance status."], "correct": 2, "explanation_en": "AWS Config can evaluate whether EC2 instances comply with specific configuration requirements. When a non-compliant resource is detected, Config can automatically trigger an SSM Automation document as a remediation action. The `AWS-UpdateSSMAgent` document is a pre-built automation that updates the SSM agent on the target instance. This approach provides continuous compliance monitoring with automated remediation and an audit trail. Running a scheduled update on all instances regardless of compliance is wasteful and does not provide a compliance record.", "question_zh": "您的组织要求所有 EC2 实例运行最新版本的 Systems Manager (SSM) 代理。如果发现实例的代理版本过旧，应无需人工干预自动更新。哪种组合提供自动化检测和修复？", "options_zh": ["为过时的 SSM 代理创建 GuardDuty 自定义发现结果，并使用 Lambda 函数更新代理。", "部署 Inspector 评估来检查 SSM 代理版本，并创建 SNS 通知以进行修复。", "创建 AWS Config 托管规则检查 SSM 代理合规性，并配置使用 AWS-UpdateSSMAgent SSM Automation 文档的自动修复操作。", "使用 EventBridge Scheduler 每小时在所有实例上运行 AWS-UpdateSSMAgent 文档，无论合规状态如何。"], "explanation_zh": "AWS Config 可以评估 EC2 实例是否符合特定配置要求。当检测到不合规资源时，Config 可以自动触发 SSM Automation 文档作为修复操作。AWS-UpdateSSMAgent 文档是一个预构建的自动化，可更新目标实例上的 SSM 代理。此方法提供持续的合规监控、自动修复和审计跟踪。无论合规状态如何，定期在所有实例上运行更新是低效的，并且不提供合规记录。"}, {"exam": 2, "id": 13, "question_en": "GuardDuty has generated multiple findings over the past week involving the same IAM role: `UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS` and `Discovery:S3/MaliciousIPCaller`. The security team needs to understand the full scope of activity performed by this IAM role across multiple AWS services.\n \nWhich tool provides the MOST efficient investigation?", "options_en": ["Use Amazon Detective to view the entity profile for the IAM role, which automatically correlates all associated API activity, resource interactions, and related findings in a behavior graph.", "Query CloudTrail Lake for all events associated with the IAM role ARN during the past week.", "Search CloudWatch Logs Insights across all log groups for the IAM role ARN.", "Use Security Hub to aggregate all findings related to the IAM role and manually correlate them."], "correct": 0, "explanation_en": "Amazon Detective automatically ingests data from GuardDuty, CloudTrail, and VPC Flow Logs to build a behavior graph. When investigating an IAM role, Detective shows the entity profile including all API calls, IP addresses used, resources accessed, and related findings over the retention period. This provides a visual and interactive timeline of activity that makes it efficient to understand the full scope of a potential compromise without writing queries manually.", "question_zh": "GuardDuty 在过去一周内生成了涉及同一 IAM 角色的多个发现结果：UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS 和 Discovery:S3/MaliciousIPCaller。安全团队需要了解此 IAM 角色跨多个 AWS 服务执行的全部活动范围。哪种工具提供最高效的调查？", "options_zh": ["使用 Amazon Detective 查看 IAM 角色的实体档案，该档案在行为图中自动关联所有相关的 API 活动、资源交互和相关发现结果。", "查询 CloudTrail Lake 中过去一周内与 IAM 角色 ARN 相关的所有事件。", "跨所有日志组搜索 CloudWatch Logs Insights 查找 IAM 角色 ARN。", "使用 Security Hub 聚合与该 IAM 角色相关的所有发现结果，并手动关联它们。"], "explanation_zh": "Amazon Detective 自动从 GuardDuty、CloudTrail 和 VPC Flow Logs 摄取数据以构建行为图。在调查 IAM 角色时，Detective 显示实体档案，包括在保留期内所有的 API 调用、使用的 IP 地址、访问的资源和相关发现结果。这提供了视觉化和交互式活动时间线，无需手动编写查询即可高效了解潜在入侵的全部范围。"}, {"exam": 2, "id": 14, "question_en": "An EC2 instance has been identified as compromised by GuardDuty. The security team needs to capture the contents of its EBS volumes for offline forensic analysis in an isolated forensic account. The instance must not be terminated yet.\n \nWhat is the CORRECT procedure?", "options_en": ["Create an AMI of the running instance and share it with the forensic account.", "Stop the instance, detach its EBS volumes, and reattach them to an EC2 instance in the forensic account.", "Use AWS Backup to create a backup of the instance and restore it in the forensic account.", "Create EBS snapshots of all attached volumes, share the snapshots with the forensic account, and restore them as volumes in the forensic account for analysis."], "correct": 3, "explanation_en": "Creating EBS snapshots of the attached volumes captures a point-in-time copy of the disk contents without affecting the running instance. Sharing those snapshots with the forensic account and restoring them as EBS volumes there allows analysis in a clean, isolated environment. This preserves the chain of custody and does not require stopping or modifying the compromised instance. Stopping the instance or detaching volumes could destroy volatile evidence and is disruptive.", "question_zh": "GuardDuty 已识别出一个 EC2 实例被入侵。安全团队需要捕获其 EBS 卷的内容，以便在隔离的取证账户中进行离线取证分析。该实例目前不能被终止。正确的操作步骤是什么？", "options_zh": ["从正在运行的实例创建 AMI，并与取证账户共享。", "停止实例，分离其 EBS 卷，然后将其重新挂载到取证账户中的 EC2 实例。", "使用 AWS Backup 创建实例的备份，并在取证账户中还原。", "创建所有挂载卷的 EBS 快照，与取证账户共享快照，并在取证账户中将它们还原为卷以供分析。"], "explanation_zh": "创建挂载卷的 EBS 快照可以在不影响正在运行的实例的情况下捕获磁盘内容的即时副本。将这些快照与取证账户共享并在那里还原为 EBS 卷，可以在干净、隔离的环境中进行分析。这保留了保管链，并且不需要停止或修改被入侵的实例。停止实例或分离卷可能会破坏易失性证据并造成中断。"}, {"exam": 2, "id": 15, "question_en": "Your company subscribes to AWS Shield Advanced for its internet-facing Application Load Balancer. During a large-scale DDoS attack, the Shield Advanced metrics show elevated traffic but automatic mitigations are not fully effective.\n \nWhat additional support option is available exclusively to Shield Advanced customers?", "options_en": ["Escalate to AWS Support by opening a standard support case and requesting DDoS assistance.", "Contact the AWS Shield Response Team (SRT), which can apply manual mitigations, create custom WAF rules, and assist with attack analysis.", "Enable AWS WAF Bot Control to automatically block all bot traffic during the attack.", "Deploy Amazon CloudFront with a custom origin failover configuration to absorb the attack."], "correct": 1, "explanation_en": "Shield Advanced customers have access to the AWS Shield Response Team (SRT), a team of DDoS experts who can engage 24/7 during an active attack. The SRT can apply manual mitigations, write and deploy custom WAF rules on behalf of the customer, and perform post-attack analysis. This is an exclusive benefit of Shield Advanced that is not available with the free Shield Standard tier. Standard support cases do not provide the specialized, proactive DDoS response capabilities of the SRT.", "question_zh": "您的公司为其面向互联网的 Application Load Balancer 订阅了 AWS Shield Advanced。在遭受大规模 DDoS 攻击期间，Shield Advanced 指标显示流量升高，但自动缓解措施未完全生效。Shield Advanced 客户独有的额外支持选项是什么？", "options_zh": ["通过开启标准支持工单向 AWS Support 升级并请求 DDoS 协助。", "联系 AWS Shield Response Team (SRT)，该团队可以应用手动缓解措施、创建自定义 WAF 规则并协助进行攻击分析。", "启用 AWS WAF Bot Control 以在攻击期间自动阻止所有机器人流量。", "部署具有自定义源故障转移配置的 Amazon CloudFront 以吸收攻击。"], "explanation_zh": "Shield Advanced 客户可以使用 AWS Shield Response Team (SRT)，这是一个 DDoS 专家团队，可在活跃攻击期间 24/7 参与。SRT 可以应用手动缓解措施、代表客户编写和部署自定义 WAF 规则，并执行攻击后分析。这是 Shield Advanced 独有的权益，免费的 Shield Standard 层级不提供。标准支持工单不提供 SRT 的专业化、主动式 DDoS 响应能力。"}, {"exam": 2, "id": 16, "question_en": "A company runs a multi-Region active-passive application with primary infrastructure in `us-east-1` and standby in `us-west-2`. During a regional failure, they need a reliable mechanism to redirect traffic from the failed primary Region to the standby Region, even if the `us-east-1` control plane is degraded.\n \nWhat should they use?", "options_en": ["Use Amazon Route 53 Application Recovery Controller (ARC) routing controls hosted on a highly available cluster, allowing manual or automated failover via a simple API call from any Region.", "Use Route 53 health checks with DNS failover records that automatically switch to `us-west-2` when `us-east-1` health checks fail.", "Use a Global Accelerator endpoint group with automatic health-based routing.", "Use CloudFront with origin failover groups configured to switch to the `us-west-2` origin."], "correct": 0, "explanation_en": "Route 53 Application Recovery Controller provides extremely reliable routing controls hosted on a cluster of five endpoints across five Regions. Even if the primary Region control plane is completely degraded, routing controls can be toggled from any Region to redirect traffic. This is specifically designed for disaster recovery failover scenarios where standard Route 53 health checks may not be sufficient. The routing controls provide a simple on/off switch for traffic routing with safety rules to prevent unsafe configurations.", "question_zh": "一家公司在 us-east-1 运行主基础设施、在 us-west-2 运行备用基础设施的多区域主动-被动应用程序。在区域故障期间，他们需要一种可靠的机制将流量从故障的主区域重定向到备用区域，即使 us-east-1 的控制平面降级也能正常工作。应使用什么？", "options_zh": ["使用 Amazon Route 53 Application Recovery Controller (ARC) 路由控制，托管在高可用集群上，允许从任何区域通过简单的 API 调用进行手动或自动故障转移。", "使用带有 DNS 故障转移记录的 Route 53 健康检查，在 us-east-1 健康检查失败时自动切换到 us-west-2。", "使用具有自动基于健康状态路由的 Global Accelerator 端点组。", "使用配置了源故障转移组的 CloudFront 切换到 us-west-2 源。"], "explanation_zh": "Route 53 Application Recovery Controller 提供极其可靠的路由控制，托管在跨五个区域的五个端点集群上。即使主区域控制平面完全降级，也可以从任何区域切换路由控制来重定向流量。这是专为灾难恢复故障转移场景设计的，标准的 Route 53 健康检查可能不适用。路由控制为流量路由提供了简单的开/关开关，并带有安全规则以防止不安全的配置。"}, {"exam": 2, "id": 17, "question_en": "Your operations team uses AWS Systems Manager OpsCenter to track and remediate operational issues. They want critical Security Hub findings (severity CRITICAL and HIGH) to automatically create OpsItems in OpsCenter so they can be tracked and assigned to team members.\n \nWhat is the SIMPLEST way to achieve this?", "options_en": ["Create a Lambda function that polls Security Hub findings every 5 minutes and creates OpsItems for critical findings.", "Create an EventBridge rule that matches Security Hub findings with CRITICAL severity and targets a Step Functions workflow that creates OpsItems.", "Enable the Security Hub integration with OpsCenter in AWS Systems Manager, which automatically creates OpsItems from Security Hub findings based on severity filters.", "Configure Security Hub custom actions to manually send selected findings to OpsCenter."], "correct": 2, "explanation_en": "AWS Systems Manager OpsCenter has a built-in integration with Security Hub. When enabled, OpsCenter can automatically create OpsItems from Security Hub findings based on configurable severity thresholds. This native integration requires no custom code, Lambda functions, or EventBridge rules. The OpsItems include the finding details and can be assigned, tracked, and managed through the standard OpsCenter workflow.", "question_zh": "您的运维团队使用 AWS Systems Manager OpsCenter 来跟踪和修复运维问题。他们希望严重级别为 CRITICAL 和 HIGH 的 Security Hub 发现结果能够自动在 OpsCenter 中创建 OpsItems，以便跟踪并分配给团队成员。实现此目标的最简单方法是什么？", "options_zh": ["创建一个 Lambda 函数，每 5 分钟轮询 Security Hub 发现结果并为严重发现结果创建 OpsItems。", "创建一个 EventBridge 规则，匹配严重级别为 CRITICAL 的 Security Hub 发现结果，并以创建 OpsItems 的 Step Functions 工作流为目标。", "在 AWS Systems Manager 中启用 Security Hub 与 OpsCenter 的集成，该集成根据严重级别筛选器自动从 Security Hub 发现结果创建 OpsItems。", "配置 Security Hub 自定义操作以手动将选定的发现结果发送到 OpsCenter。"], "explanation_zh": "AWS Systems Manager OpsCenter 与 Security Hub 有内置集成。启用后，OpsCenter 可以根据可配置的严重级别阈值自动从 Security Hub 发现结果创建 OpsItems。此原生集成不需要自定义代码、Lambda 函数或 EventBridge 规则。OpsItems 包含发现结果的详细信息，并可以通过标准 OpsCenter 工作流进行分配、跟踪和管理。"}, {"exam": 2, "id": 18, "question_en": "A company needs to evaluate whether their application architecture meets a target Recovery Time Objective (RTO) of 15 minutes and Recovery Point Objective (RPO) of 1 minute. They want an automated assessment that identifies gaps between their current architecture and their resilience goals.\n \nWhich service should they use?", "options_en": ["AWS Fault Injection Service to run chaos experiments and measure actual recovery times.", "AWS Well-Architected Tool to review the Reliability pillar and identify high-risk issues.", "AWS Backup Audit Manager to verify backup compliance against the target RPO.", "AWS Resilience Hub to define a resiliency policy with target RTO/RPO, discover application resources, and receive an assessment with a resilience score and improvement recommendations."], "correct": 3, "explanation_en": "AWS Resilience Hub is designed specifically for defining resiliency policies (target RTO/RPO), automatically discovering application resources and their dependencies, and assessing whether the architecture meets the defined targets. It provides a resilience score and actionable recommendations for improvement. Fault Injection Service tests resilience through active experiments but does not assess architecture against targets. The Well-Architected Tool provides general best-practice guidance but not automated RTO/RPO assessment.", "question_zh": "一家公司需要评估其应用程序架构是否满足 15 分钟的恢复时间目标 (RTO) 和 1 分钟的恢复点目标 (RPO)。他们希望进行自动评估，找出当前架构与弹性目标之间的差距。应使用哪个服务？", "options_zh": ["AWS Fault Injection Service 运行混沌实验并测量实际恢复时间。", "AWS Well-Architected Tool 审查可靠性支柱并识别高风险问题。", "AWS Backup Audit Manager 根据目标 RPO 验证备份合规性。", "AWS Resilience Hub 定义具有目标 RTO/RPO 的弹性策略，发现应用程序资源，并接收包含弹性评分和改进建议的评估。"], "explanation_zh": "AWS Resilience Hub 专为定义弹性策略（目标 RTO/RPO）、自动发现应用程序资源及其依赖关系，以及评估架构是否满足定义的目标而设计。它提供弹性评分和可操作的改进建议。Fault Injection Service 通过主动实验测试弹性，但不根据目标评估架构。Well-Architected Tool 提供一般最佳实践指导，但不提供自动化的 RTO/RPO 评估。"}, {"exam": 2, "id": 19, "question_en": "Macie has detected a large number of objects containing PII (Social Security numbers and credit card numbers) in an S3 bucket that was inadvertently configured with public access. CloudTrail shows that multiple anonymous `GetObject` requests were made from external IP addresses over the past 48 hours.\n \nWhat is the MOST critical immediate action?", "options_en": ["Enable S3 Object Lock in Compliance mode to prevent further data modification.", "Block all public access to the bucket using the S3 Block Public Access settings at the bucket level, then assess the scope of data exposure using CloudTrail and S3 server access logs.", "Delete all objects containing PII from the bucket to prevent additional exposure.", "Enable S3 default encryption with an AWS KMS key to protect the data at rest."], "correct": 1, "explanation_en": "The most critical immediate action is to stop the bleeding by blocking public access to the bucket. S3 Block Public Access at the bucket level overrides any bucket policies or ACLs that may be granting public access. After stopping the exposure, the next step is to assess the scope by reviewing CloudTrail data events and S3 server access logs to identify exactly which objects were accessed and from which IP addresses. Deleting objects destroys evidence. Encryption and Object Lock do not address the public access issue.", "question_zh": "Macie 在意外配置为公共访问的 S3 存储桶中检测到大量包含 PII（社会安全号码和信用卡号码）的对象。CloudTrail 显示，在过去 48 小时内，来自外部 IP 地址的多次匿名 GetObject 请求被发出。最关键的即时行动是什么？", "options_zh": ["在 Compliance 模式下启用 S3 Object Lock 以防止进一步的数据修改。", "使用存储桶级别的 S3 Block Public Access 设置阻止对存储桶的所有公共访问，然后使用 CloudTrail 和 S3 服务器访问日志评估数据暴露范围。", "从存储桶中删除所有包含 PII 的对象，以防止进一步的暴露。", "使用 AWS KMS 密钥启用 S3 默认加密以保护静态数据。"], "explanation_zh": "最关键的即时行动是通过阻止对存储桶的公共访问来止血。存储桶级别的 S3 Block Public Access 会覆盖任何可能授予公共访问权限的存储桶策略或 ACL。在阻止暴露后，下一步是通过审查 CloudTrail 数据事件和 S3 服务器访问日志来评估范围，以准确识别哪些对象被访问以及来自哪些 IP 地址。删除对象会销毁证据。加密和 Object Lock 不解决公共访问问题。"}, {"exam": 2, "id": 20, "question_en": "A web application in a public subnet receives traffic from the internet through a Network Load Balancer. After adding a new Network ACL rule to allow inbound HTTPS (port 443), the application is still not accessible from the internet.\n \nWhich is the MOST LIKELY cause?", "options_en": ["The Network ACL does not have a corresponding outbound rule allowing ephemeral port traffic (ports 1024-65535) for return traffic.", "The security group associated with the EC2 instances does not allow inbound traffic on port 443.", "The NLB is not configured with a TLS listener on port 443.", "The VPC does not have an Internet Gateway attached."], "correct": 0, "explanation_en": "Network ACLs are stateless, meaning return traffic must be explicitly allowed by a separate outbound rule. Unlike security groups (which are stateful and automatically allow return traffic), NACLs require an outbound rule allowing traffic on the ephemeral port range (1024-65535) for TCP responses to reach the client. If only the inbound HTTPS rule was added without a matching outbound ephemeral port rule, the response traffic will be blocked by the NACL even though the request was allowed in.", "question_zh": "公共子网中的 Web 应用程序通过 Network Load Balancer 从互联网接收流量。在添加新的 Network ACL 规则以允许入站 HTTPS（端口 443）后，应用程序仍然无法从互联网访问。最可能的原因是什么？", "options_zh": ["Network ACL 没有相应的出站规则允许临时端口流量（端口 1024-65535）作为返回流量。", "与 EC2 实例关联的安全组不允许端口 443 上的入站流量。", "NLB 未配置端口 443 上的 TLS 监听器。", "VPC 未挂载 Internet Gateway。"], "explanation_zh": "Network ACL 是无状态的，这意味着返回流量必须由单独出站规则显式允许。与安全组（有状态，自动允许返回流量）不同，NACL 需要一条出站规则允许临时端口范围（1024-65535）上的流量，以便 TCP 响应能够到达客户端。如果只添加了入站 HTTPS 规则而没有匹配的出站临时端口规则，即使请求被允许进入，响应流量也会被 NACL 阻止。"}, {"exam": 2, "id": 21, "question_en": "An e-commerce website hosted behind an Application Load Balancer is experiencing a credential stuffing attack where thousands of login attempts are made from rotating IP addresses, each sending fewer than 100 requests per 5-minute window.\n \nWhich WAF strategy BEST mitigates this attack?", "options_en": ["Create a standard rate-based rule with a threshold of 100 requests per 5 minutes.", "Create an IP set containing all known malicious IPs and block them with an IP match rule.", "Configure a geographic restriction rule to block all traffic from countries where the attack originates.", "Use AWS WAF Bot Control managed rule group to detect and block automated login attempts based on behavioral signals rather than just request rate."], "correct": 3, "explanation_en": "Credential stuffing attacks using rotating IPs with low per-IP request rates can evade simple rate-based rules. AWS WAF Bot Control uses behavioral analysis, browser fingerprinting, and CAPTCHA challenges to identify automated requests regardless of their source IP or rate. It detects patterns like automated browsers, headless tools, and scripted clients that standard rate-based rules cannot catch. IP-based blocking is ineffective against rotating IPs, and geographic blocking causes too much collateral damage.", "question_zh": "托管在 Application Load Balancer 后面的电子商务网站正在遭受撞库攻击，数千次登录尝试来自轮换 IP 地址，每个 IP 在 5 分钟窗口内发送的请求不到 100 次。哪种 WAF 策略最能缓解此攻击？", "options_zh": ["创建一个标准速率规则，阈值为每 5 分钟 100 次请求。", "创建一个包含所有已知恶意 IP 的 IP 集，并使用 IP 匹配规则阻止它们。", "配置地理限制规则以阻止来自攻击来源国家的所有流量。", "使用 AWS WAF Bot Control 托管规则组，基于行为信号而非仅基于请求速率来检测和阻止自动登录尝试。"], "explanation_zh": "使用低每个 IP 请求速率的轮换 IP 的撞库攻击可以规避简单的基于速率的规则。AWS WAF Bot Control 使用行为分析、浏览器指纹识别和 CAPTCHA 挑战来识别自动化请求，无论其源 IP 或速率如何。它检测标准基于速率规则无法捕获的模式，如自动化浏览器、无头工具和脚本客户端。基于 IP 的阻止对轮换 IP 无效，地理阻止会造成过多的附带损害。"}, {"exam": 2, "id": 22, "question_en": "Your organization requires deep packet inspection of all traffic leaving the VPC to detect and block known malware command-and-control (C2) communication patterns. The solution must be able to inspect TLS-encrypted traffic to external domains.\n \nWhich approach should you use?", "options_en": ["Use VPC Flow Logs with machine learning anomaly detection to identify C2 traffic patterns.", "Deploy AWS Network Firewall with Suricata-compatible stateful rules and configure TLS inspection by importing a CA certificate to decrypt and inspect outbound HTTPS traffic.", "Deploy a NAT Gateway with VPC traffic mirroring to a third-party IDS appliance.", "Configure security group outbound rules to allow only specific IP addresses and block all other traffic."], "correct": 1, "explanation_en": "AWS Network Firewall supports Suricata-compatible IDS/IPS rules that can inspect traffic at the application layer. For encrypted traffic, Network Firewall supports TLS inspection (SSL/TLS decryption) by using a CA certificate stored in AWS Certificate Manager. This allows the firewall to decrypt, inspect for malware C2 patterns, and re-encrypt outbound HTTPS traffic. VPC Flow Logs only capture metadata (IPs, ports, bytes) and cannot inspect packet contents. Security groups operate at L3/L4 and cannot detect C2 patterns within allowed connections.", "question_zh": "您的组织需要对离开 VPC 的所有流量进行深度数据包检查，以检测和阻止已知的恶意软件命令与控制 (C2) 通信模式。解决方案必须能够检查发往外部域的 TLS 加密流量。应使用哪种方法？", "options_zh": ["使用 VPC Flow Logs 配合机器学习异常检测来识别 C2 流量模式。", "部署 AWS Network Firewall，使用与 Suricata 兼容的有状态规则，并通过导入 CA 证书配置 TLS 检查以解密和检查出站 HTTPS 流量。", "部署 NAT Gateway 配合 VPC 流量镜像到第三方 IDS 设备。", "配置安全组出站规则仅允许特定 IP 地址并阻止所有其他流量。"], "explanation_zh": "AWS Network Firewall 支持与 Suricata 兼容的 IDS/IPS 规则，可以在应用层检查流量。对于加密流量，Network Firewall 支持通过使用存储在 AWS Certificate Manager 中的 CA 证书进行 TLS 检查（SSL/TLS 解密）。这允许防火墙解密、检查恶意软件 C2 模式，然后重新加密出站 HTTPS 流量。VPC Flow Logs 仅捕获元数据（IP、端口、字节），无法检查数据包内容。安全组在 L3/L4 层级运行，无法检测已允许连接中的 C2 模式。"}, {"exam": 2, "id": 23, "question_en": "A development team deploys Lambda functions written in Python that use third-party libraries from PyPI. The security team needs automated vulnerability scanning of these Lambda functions, including their dependency packages.\n \nWhich service provides this capability with minimal operational overhead?", "options_en": ["Deploy Amazon CodeGuru Reviewer to scan Lambda function code for security vulnerabilities.", "Create a CodePipeline stage that runs `pip audit` against Lambda deployment packages before deployment.", "Enable Amazon Inspector Lambda standard scanning, which automatically discovers Lambda functions and scans their application dependencies for known CVEs.", "Configure AWS Config rules to check Lambda function configurations for security misconfigurations."], "correct": 2, "explanation_en": "Amazon Inspector supports Lambda standard scanning, which automatically discovers Lambda functions in the account and scans their application dependency packages for known vulnerabilities (CVEs). For Python functions, Inspector analyzes the packages included in the deployment package or Lambda layer. This is a fully managed, continuous scanning capability that requires no CI/CD pipeline changes or custom tooling. CodeGuru Reviewer focuses on code quality and some security issues but is not a comprehensive CVE vulnerability scanner for dependencies.", "question_zh": "开发团队部署使用 PyPI 第三方库的 Python 编写的 Lambda 函数。安全团队需要对这些 Lambda 函数（包括其依赖包）进行自动化漏洞扫描。哪个服务能以最小的运营开销提供此能力？", "options_zh": ["部署 Amazon CodeGuru Reviewer 扫描 Lambda 函数代码中的安全漏洞。", "创建一个 CodePipeline 阶段，在部署前对 Lambda 部署包运行 pip audit。", "启用 Amazon Inspector Lambda 标准扫描，该功能自动发现 Lambda 函数并扫描其应用程序依赖项中的已知 CVE。", "配置 AWS Config 规则检查 Lambda 函数配置中的安全错误配置。"], "explanation_zh": "Amazon Inspector 支持 Lambda 标准扫描，自动发现账户中的 Lambda 函数并扫描其应用程序依赖包中的已知漏洞 (CVE)。对于 Python 函数，Inspector 分析部署包或 Lambda 层中包含的包。这是一个完全托管、持续的扫描能力，无需更改 CI/CD 流水线或自定义工具。CodeGuru Reviewer 侧重于代码质量和部分安全问题，但不是依赖项的综合 CVE 漏洞扫描器。"}, {"exam": 2, "id": 24, "question_en": "Your organization requires that all EC2 instances are launched from hardened AMIs that comply with CIS (Center for Internet Security) benchmarks. The hardening process must be automated, repeatable, and produce a validated AMI.\n \nWhat is the BEST approach?", "options_en": ["Use EC2 Image Builder to create an image pipeline with CIS hardening components for the build phase and CIS benchmark test components for the test phase, producing a validated AMI.", "Launch an EC2 instance, manually apply CIS benchmarks, and create an AMI from the configured instance.", "Use AWS Systems Manager Patch Manager to apply all security patches and create an AMI after patching is complete.", "Download a pre-hardened CIS AMI from the AWS Marketplace and use it without further customization."], "correct": 0, "explanation_en": "EC2 Image Builder provides an automated pipeline for creating, customizing, testing, and distributing AMIs. It includes pre-built components for CIS benchmark hardening (build phase) and CIS benchmark validation tests (test phase). The pipeline ensures that every AMI produced meets CIS compliance requirements and is validated before distribution. This approach is automated, repeatable, and produces an audit trail. Manual hardening is error-prone and not repeatable. Patch Manager addresses OS patches but not the full CIS hardening scope.", "question_zh": "您的组织要求所有 EC2 实例从符合 CIS（互联网安全中心）基准的加固 AMI 启动。加固过程必须是自动化、可重复的，并生成经过验证的 AMI。什么是最佳方法？", "options_zh": ["使用 EC2 Image Builder 创建镜像流水线，在构建阶段使用 CIS 加固组件，在测试阶段使用 CIS 基准测试组件，生成经过验证的 AMI。", "启动一个 EC2 实例，手动应用 CIS 基准，然后从配置好的实例创建 AMI。", "使用 AWS Systems Manager Patch Manager 应用所有安全补丁，并在补丁完成后创建 AMI。", "从 AWS Marketplace 下载预加固的 CIS AMI 并直接使用，无需进一步定制。"], "explanation_zh": "EC2 Image Builder 提供自动化流水线用于创建、定制、测试和分发 AMI。它包括用于 CIS 基准加固（构建阶段）和 CIS 基准验证测试（测试阶段）的预构建组件。流水线确保生成的每个 AMI 都满足 CIS 合规要求并在分发前经过验证。此方法自动化、可重复并产生审计跟踪。手动加固易出错且不可重复。Patch Manager 处理操作系统补丁但不覆盖完整的 CIS 加固范围。"}, {"exam": 2, "id": 25, "question_en": "A company currently uses SSH bastion hosts in public subnets to access EC2 instances in private subnets. The security team wants to eliminate bastion hosts to reduce attack surface while maintaining the ability to access instances for troubleshooting. All sessions must be logged.\n \nWhat should they implement?", "options_en": ["Configure a VPN connection to the VPC and use SSH directly to private instances, logging sessions via CloudTrail.", "Use EC2 Instance Connect to establish SSH connections through the AWS console without bastion hosts.", "Deploy AWS Cloud9 environments pre-configured for accessing production instances.", "Deploy AWS Systems Manager Session Manager, which provides browser-based and CLI shell access to instances without opening inbound ports, with session logging to S3 and CloudWatch Logs."], "correct": 3, "explanation_en": "Systems Manager Session Manager provides secure shell access to EC2 instances without requiring bastion hosts, SSH keys, or inbound security group rules. Traffic is encrypted using TLS and routed through the SSM service endpoints (via VPC endpoints for private instances). All session activity can be logged to S3 and CloudWatch Logs for audit purposes, including full session data capture. This eliminates the bastion host attack surface entirely. EC2 Instance Connect still requires port 22 to be open in the security group.", "question_zh": "一家公司当前在公共子网中使用 SSH 堡垒主机来访问私有子网中的 EC2 实例。安全团队希望消除堡垒主机以减少攻击面，同时保持访问实例进行故障排除的能力。所有会话必须被记录。应实施什么？", "options_zh": ["配置到 VPC 的 VPN 连接并通过 SSH 直接访问私有实例，通过 CloudTrail 记录会话。", "使用 EC2 Instance Connect 通过 AWS 控制台建立 SSH 连接，无需堡垒主机。", "部署预配置用于访问生产实例的 AWS Cloud9 环境。", "部署 AWS Systems Manager Session Manager，该功能提供基于浏览器和 CLI 的 Shell 访问实例，无需开放入站端口，并将会话日志记录到 S3 和 CloudWatch Logs。"], "explanation_zh": "Systems Manager Session Manager 提供对 EC2 实例的安全 Shell 访问，无需堡垒主机、SSH 密钥或入站安全组规则。流量使用 TLS 加密并通过 SSM 服务端点路由（对于私有实例通过 VPC 端点）。所有会话活动都可以记录到 S3 和 CloudWatch Logs 以用于审计目的，包括完整的会话数据捕获。这完全消除了堡垒主机的攻击面。EC2 Instance Connect 仍然需要在安全组中开放端口 22。"}, {"exam": 2, "id": 26, "question_en": "A company wants to provide access to an internal web application for remote employees without requiring a VPN. The access policy should consider device security posture (such as whether the device has an updated antivirus) and user identity from their corporate IdP.\n \nWhich service meets this requirement?", "options_en": ["Deploy an Application Load Balancer with Cognito authentication and a Lambda authorizer that checks device posture.", "Use AWS Verified Access with a trust provider for identity (corporate IdP) and a device trust provider for posture assessment, creating an access policy that requires both identity and device trust.", "Configure AWS Client VPN with certificate-based mutual authentication and MFA from the corporate IdP.", "Deploy a CloudFront distribution with Lambda@Edge functions to validate user identity and device compliance."], "correct": 1, "explanation_en": "AWS Verified Access provides zero-trust network access to corporate applications without a VPN. It integrates with identity providers (such as IAM Identity Center, Okta, or any OIDC-compatible IdP) and device trust providers (such as CrowdStrike or Jamf) to make access decisions based on both user identity and device security posture. Access policies are written in Cedar and can require conditions like a valid corporate identity AND a compliant device. This eliminates VPN complexity while implementing zero-trust principles.", "question_zh": "一家公司希望为远程员工提供对内部 Web 应用程序的访问，而无需 VPN。访问策略应考虑设备安全状态（如设备是否安装了更新的杀毒软件）以及来自其企业 IdP 的用户身份。哪个服务能满足此需求？", "options_zh": ["部署带有 Cognito 认证和检查设备状态的 Lambda 授权器的 Application Load Balancer。", "使用 AWS Verified Access，配置身份信任提供商（企业 IdP）和设备信任提供商用于状态评估，创建需要身份和设备双重信任的访问策略。", "配置 AWS Client VPN，使用基于证书的相互认证和来自企业 IdP 的 MFA。", "部署带有 Lambda@Edge 函数的 CloudFront 分发来验证用户身份和设备合规性。"], "explanation_zh": "AWS Verified Access 提供对企业应用程序的零信任网络访问，无需 VPN。它与身份提供商（如 IAM Identity Center、Okta 或任何兼容 OIDC 的 IdP）和设备信任提供商（如 CrowdStrike 或 Jamf）集成，基于用户身份和设备安全状态做出访问决策。访问策略使用 Cedar 语言编写，可以要求诸如有效的企业身份 AND 合规设备等条件。这在实施零信任原则的同时消除了 VPN 复杂性。"}, {"exam": 2, "id": 27, "question_en": "A financial institution requires a dedicated network connection between their on-premises data center and AWS with encryption at the physical layer (Layer 2). They need to ensure that data in transit over the dedicated connection cannot be intercepted.\n \nWhich solution provides Layer 2 encryption for a Direct Connect connection?", "options_en": ["Configure a Site-to-Site VPN over the Direct Connect connection using a virtual private gateway.", "Use AWS CloudHSM at the Direct Connect location to encrypt all traffic before it enters the AWS network.", "Enable MACsec (IEEE 802.1AE) encryption on a dedicated Direct Connect connection at a supported Direct Connect location.", "Enable TLS 1.3 on all application connections that traverse the Direct Connect link."], "correct": 2, "explanation_en": "MACsec (Media Access Control Security, IEEE 802.1AE) provides Layer 2 (point-to-point) encryption on dedicated Direct Connect connections. This encrypts all data at the Ethernet frame level as it traverses the physical link between the customer router and the AWS Direct Connect device. MACsec is available on dedicated connections (not hosted) at supported Direct Connect locations. A Site-to-Site VPN over Direct Connect provides Layer 3 (IPsec) encryption, which is a different approach. TLS operates at the application layer and does not encrypt all traffic on the link.", "question_zh": "一家金融机构需要在本地数据中心和 AWS 之间建立专用网络连接，并在物理层（第 2 层）进行加密。他们需要确保在专用连接上传输的数据不能被拦截。哪种解决方案为 Direct Connect 连接提供第 2 层加密？", "options_zh": ["使用虚拟私有网关在 Direct Connect 连接上配置 Site-to-Site VPN。", "在 Direct Connect 位置使用 AWS CloudHSM 加密所有流量，然后才进入 AWS 网络。", "在受支持的 Direct Connect 位置上的专用 Direct Connect 连接上启用 MACsec (IEEE 802.1AE) 加密。", "在所有通过 Direct Connect 链路的应用程序连接上启用 TLS 1.3。"], "explanation_zh": "MACsec（媒体访问控制安全，IEEE 802.1AE）在专用 Direct Connect 连接上提供第 2 层（点对点）加密。这在以太网帧级别加密客户路由器和 AWS Direct Connect 设备之间物理链路上的所有数据。MACsec 在受支持的 Direct Connect 位置上的专用连接（非托管）上可用。通过 Direct Connect 的 Site-to-Site VPN 提供第 3 层（IPsec）加密，这是不同的方法。TLS 在应用层运行，不加密链路上的所有流量。"}, {"exam": 2, "id": 28, "question_en": "A company serves static content from an S3 bucket through Amazon CloudFront. They need to ensure that users can only access the content through CloudFront and not directly through the S3 bucket URL. The bucket uses SSE-KMS encryption.\n \nWhich approach is RECOMMENDED?", "options_en": ["Configure an Origin Access Control (OAC) with signing behavior set to always sign requests and update the S3 bucket policy to allow only the CloudFront service principal with a condition matching the distribution.", "Configure an Origin Access Identity (OAI) and update the S3 bucket policy to allow only the OAI principal.", "Make the S3 bucket a website endpoint and restrict access using a CloudFront custom header that the origin validates.", "Use a Lambda@Edge function to validate a shared secret in the request header before allowing access to the S3 origin."], "correct": 0, "explanation_en": "Origin Access Control (OAC) is the recommended replacement for Origin Access Identity (OAI). OAC supports all S3 bucket features including SSE-KMS encryption, which OAI does not support. With OAC, CloudFront signs requests using SigV4, and the S3 bucket policy restricts access to only requests from the specific CloudFront distribution using the `aws:SourceArn` condition. This ensures content can only be accessed through CloudFront. OAI is a legacy feature that does not support SSE-KMS encrypted objects.", "question_zh": "一家公司通过 Amazon CloudFront 提供来自 S3 存储桶的静态内容。他们需要确保用户只能通过 CloudFront 访问内容，而不能直接通过 S3 存储桶 URL 访问。该存储桶使用 SSE-KMS 加密。推荐使用哪种方法？", "options_zh": ["配置 Origin Access Control (OAC)，将签名行为设为始终签名请求，并更新 S3 存储桶策略仅允许 CloudFront 服务主体，并使用匹配分发的条件。", "配置 Origin Access Identity (OAI) 并更新 S3 存储桶策略仅允许 OAI 主体。", "将 S3 存储桶设为网站端点，并使用 CloudFront 自定义标头来限制访问，由源进行验证。", "使用 Lambda@Edge 函数在允许访问 S3 源之前验证请求标头中的共享密钥。"], "explanation_zh": "Origin Access Control (OAC) 是推荐用于替代 Origin Access Identity (OAI) 的方案。OAC 支持所有 S3 存储桶功能，包括 SSE-KMS 加密，而 OAI 不支持。使用 OAC，CloudFront 使用 SigV4 签名请求，S3 存储桶策略通过 aws:SourceArn 条件限制只有来自特定 CloudFront 分发的请求才能访问。这确保内容只能通过 CloudFront 访问。OAI 是一个不支持 SSE-KMS 加密对象的旧功能。"}, {"exam": 2, "id": 29, "question_en": "A security engineer needs to verify that no resources in any VPC across the organization have unintended internet access paths. They want an automated assessment that identifies all network paths from the internet to resources in private subnets.\n \nWhich tool should they use?", "options_en": ["Use VPC Reachability Analyzer to trace paths between the internet gateway and each resource individually.", "Review security group and NACL configurations manually across all VPCs.", "Enable AWS Config rule `vpc-sg-open-only-to-authorized-ports` to identify overly permissive security groups.", "Use VPC Network Access Analyzer to define a network access scope specifying internet gateways as sources and private subnets as destinations, then run an analysis to identify all matching paths."], "correct": 3, "explanation_en": "VPC Network Access Analyzer allows you to define network access scopes that specify trusted and untrusted network paths. By creating a scope with internet gateways as sources and private subnets as destinations, you can identify all network paths that would allow internet traffic to reach private resources. This automated analysis evaluates security groups, NACLs, route tables, and other network configurations holistically. VPC Reachability Analyzer tests individual source-destination pairs and is not suited for broad assessments. Config rules check individual configurations but do not evaluate end-to-end network paths.", "question_zh": "一名安全工程师需要验证组织中任何 VPC 中的资源都没有意外的互联网访问路径。他们希望进行自动评估，识别从互联网到私有子网中资源的所有网络路径。应使用哪个工具？", "options_zh": ["使用 VPC Reachability Analyzer 逐一追踪 Internet Gateway 和每个资源之间的路径。", "手动审查所有 VPC 的安全组和 NACL 配置。", "启用 AWS Config 规则 vpc-sg-open-only-to-authorized-ports 来识别过于宽松的安全组。", "使用 VPC Network Access Analyzer 定义网络访问范围，将 Internet Gateway 指定为源、私有子网指定为目标，然后运行分析以识别所有匹配的路径。"], "explanation_zh": "VPC Network Access Analyzer 允许您定义网络访问范围，指定受信任和不受信任的网络路径。通过创建以 Internet Gateway 为源、私有子网为目标的访问范围，可以识别所有允许互联网流量到达私有资源的网络路径。此自动分析全面评估安全组、NACL、路由表和其他网络配置。VPC Reachability Analyzer 测试单个源-目标对，不适合广泛评估。Config 规则检查单个配置但不评估端到端网络路径。"}, {"exam": 2, "id": 30, "question_en": "A development team uses GitHub as their source code repository. They want to automatically scan pull requests for security vulnerabilities in their Java application code, including issues like SQL injection, hardcoded credentials, and insecure cryptographic usage.\n \nWhich AWS service provides automated code security scanning integrated with GitHub pull requests?", "options_en": ["Amazon Inspector code scanning for Lambda functions.", "Amazon CodeGuru Security, which integrates with GitHub repositories to scan code changes for security vulnerabilities and provides remediation suggestions in pull request comments.", "AWS Trusted Advisor security checks for code repositories.", "Amazon Macie to scan code repositories for sensitive data like hardcoded credentials."], "correct": 1, "explanation_en": "Amazon CodeGuru Security (part of Amazon Q Developer) provides automated code security scanning that integrates with GitHub, GitLab, Bitbucket, and AWS CodeCommit. It scans code for security vulnerabilities including injection flaws, hardcoded credentials, insecure cryptography, and other OWASP Top 10 categories. It posts findings as comments directly in pull requests with remediation suggestions. Inspector code scanning is limited to Lambda functions. Macie is designed for S3 data classification, not code analysis.", "question_zh": "开发团队使用 GitHub 作为源代码仓库。他们希望自动扫描 pull request 中的 Java 应用程序代码安全漏洞，包括 SQL 注入、硬编码凭证和不安全的加密使用等问题。哪个 AWS 服务提供与 GitHub pull request 集成的自动化代码安全扫描？", "options_zh": ["Amazon Inspector 针对 Lambda 函数的代码扫描。", "Amazon CodeGuru Security，它与 GitHub 仓库集成，扫描代码变更中的安全漏洞，并在 pull request 评论中提供修复建议。", "AWS Trusted Advisor 针对代码仓库的安全检查。", "Amazon Macie 扫描代码仓库中的敏感数据，如硬编码凭证。"], "explanation_zh": "Amazon CodeGuru Security（Amazon Q Developer 的一部分）提供与 GitHub、GitLab、Bitbucket 和 AWS CodeCommit 集成的自动化代码安全扫描。它扫描代码中的安全漏洞，包括注入缺陷、硬编码凭证、不安全的加密和其他 OWASP Top 10 类别。它将发现结果作为评论直接发布在 pull request 中，并附有修复建议。Inspector 代码扫描仅限于 Lambda 函数。Macie 专为 S3 数据分类设计，而非代码分析。"}, {"exam": 2, "id": 31, "question_en": "A company is building a customer-facing chatbot using Amazon Bedrock with a foundation model. The security team is concerned about prompt injection attacks where malicious users craft inputs that manipulate the model into ignoring its system instructions and performing unintended actions.\n \nWhich combination of controls BEST mitigates prompt injection risk?", "options_en": ["Use a smaller foundation model that is inherently resistant to prompt injection attacks.", "Encrypt all user inputs with KMS before sending them to the model to prevent injection.", "Implement Amazon Bedrock Guardrails with input content filters and denied topics, use a system prompt that instructs the model to ignore override attempts, and validate model outputs before presenting them to users.", "Limit the model temperature to 0 to ensure deterministic responses that cannot be manipulated."], "correct": 2, "explanation_en": "Prompt injection mitigation requires a defense-in-depth approach. Amazon Bedrock Guardrails provides content filters that can block harmful inputs before they reach the model, and denied topics can prevent the model from responding to specific categories. A well-crafted system prompt adds another layer by instructing the model on boundaries. Output validation catches cases where injection bypasses input controls. No model is inherently immune to prompt injection regardless of size. Encryption does not prevent injection since the model still receives the same text after decryption. Temperature settings affect randomness, not susceptibility to injection.", "question_zh": "一家公司正在使用 Amazon Bedrock 配合基础模型构建面向客户的聊天机器人。安全团队担心提示注入攻击，即恶意用户构造输入来操纵模型忽略其系统指令并执行非预期操作。哪种控制组合最能降低提示注入风险？", "options_zh": ["使用一个本质上能抵抗提示注入攻击的较小基础模型。", "在将用户输入发送到模型之前使用 KMS 加密所有用户输入以防止注入。", "实施 Amazon Bedrock Guardrails，配置输入内容筛选器和拒绝主题，使用指示模型忽略覆盖尝试的系统提示，并在向用户展示模型输出前进行验证。", "将模型 temperature 限制为 0 以确保无法被操纵的确定性响应。"], "explanation_zh": "提示注入缓解需要纵深防御方法。Amazon Bedrock Guardrails 提供内容筛选器，可以在有害输入到达模型之前阻止它们，拒绝主题可以防止模型响应特定类别。精心设计的系统提示通过指示模型了解边界来增加另一层保护。输出验证用于捕获注入绕过输入控制的情况。无论大小，没有模型天生对提示注入免疫。加密不能防止注入，因为解密后模型仍然接收到相同的文本。Temperature 设置影响随机性，而非对注入的敏感性。"}, {"exam": 2, "id": 32, "question_en": "Account A (111111111111) needs to allow a Lambda function in Account B (222222222222) to invoke a Lambda function in Account A. The Lambda function in Account B has an execution role `LambdaExecRole`.\n \nWhat is the SIMPLEST approach that does NOT require Account B to assume a role in Account A?", "options_en": ["Add a resource-based policy to the Lambda function in Account A that grants `lambda:InvokeFunction` permission to Account B's `LambdaExecRole`.", "Create a VPC peering connection between the two accounts and invoke the function via a VPC endpoint.", "Use AWS Resource Access Manager to share the Lambda function with Account B.", "Create an IAM role in Account A and grant Account B permission to assume it with `lambda:InvokeFunction` permissions."], "correct": 0, "explanation_en": "Lambda functions support resource-based policies that can grant cross-account access directly. By adding a policy statement to the Lambda function in Account A that specifies Account B's execution role ARN as the principal with the `lambda:InvokeFunction` action, Account B's Lambda function can invoke it directly without needing to assume a cross-account role. This is the simplest approach because it only requires a single policy change on the target function.", "question_zh": "账户 A (111111111111) 需要允许账户 B (222222222222) 中的 Lambda 函数调用账户 A 中的 Lambda 函数。账户 B 中的 Lambda 函数具有执行角色 LambdaExecRole。什么是最简单的方法，且不需要账户 B 代入账户 A 中的角色？", "options_zh": ["向账户 A 中的 Lambda 函数添加基于资源的策略，授予账户 B 的 LambdaExecRole 执行 lambda:InvokeFunction 的权限。", "在两个账户之间创建 VPC 对等连接，并通过 VPC 端点调用函数。", "使用 AWS Resource Access Manager 与账户 B 共享 Lambda 函数。", "在账户 A 中创建 IAM 角色，并授予账户 B 代入该角色的权限，该角色具有 lambda:InvokeFunction 权限。"], "explanation_zh": "Lambda 函数支持基于资源的策略，可以直接授予跨账户访问权限。通过向账户 A 中的 Lambda 函数添加策略声明，将账户 B 的执行角色 ARN 指定为主体并授予 lambda:InvokeFunction 操作权限，账户 B 的 Lambda 函数可以直接调用它，无需代入跨账户角色。这是最简单的方法，因为只需要在目标函数上进行单个策略更改。"}, {"exam": 2, "id": 33, "question_en": "A company wants to ensure that all access to their S3 bucket `sensitive-data-bucket` occurs exclusively through a specific VPC endpoint `vpce-1a2b3c4d`. Any requests not coming through this endpoint should be denied, including those from IAM administrators.\n \nWhich S3 bucket policy statement achieves this?", "options_en": ["An Allow statement with `\"Condition\": {\"StringEquals\": {\"aws:sourceVpce\": \"vpce-1a2b3c4d\"}}`.", "An Allow statement on the VPC endpoint policy restricting access to only `sensitive-data-bucket`.", "A Deny statement with `\"Condition\": {\"StringNotEquals\": {\"aws:SourceIp\": \"vpc-cidr\"}}`.", "A Deny statement with `\"Condition\": {\"StringNotEquals\": {\"aws:sourceVpce\": \"vpce-1a2b3c4d\"}}` applied to all principals and all S3 actions."], "correct": 3, "explanation_en": "To enforce that all access must come through a specific VPC endpoint, you need a Deny statement with a `StringNotEquals` condition on `aws:sourceVpce`. This denies any request that does NOT originate from the specified VPC endpoint, regardless of the caller's IAM permissions (because explicit Deny always overrides Allow). An Allow statement with `aws:sourceVpce` would only allow VPC endpoint traffic but would not deny other access paths. A VPC endpoint policy restricts what the endpoint can access but does not restrict the bucket from being accessed through other paths.", "question_zh": "一家公司希望确保对其 S3 存储桶 sensitive-data-bucket 的所有访问都只能通过特定的 VPC 端点 vpce-1a2b3c4d 进行。任何不通过此端点的请求都应被拒绝，包括来自 IAM 管理员的请求。哪个 S3 存储桶策略声明能实现此目标？", "options_zh": ["一个带有 \"Condition\": {\"StringEquals\": {\"aws:sourceVpce\": \"vpce-1a2b3c4d\"}} 的 Allow 声明。", "一个在 VPC 端点策略上的 Allow 声明，限制仅访问 sensitive-data-
