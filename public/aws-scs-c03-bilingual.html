个加密操作。这极大地减少了 KMS“GenerateDataKey”调用，同时保持信封加密安全。增加配额是一种短期解决方案，不会无限期地扩大。 CloudHSM 需要进行重大的架构更改。 SSE-S3仅适用于S3存储，不适用于应用级消息加密。"}, {"exam": 5, "id": 54, "question_en": "A company has a regulatory requirement that encryption keys used for S3 data must be generated and managed entirely within their on-premises HSM. AWS must never store or have access to the encryption key material at any point in the process. The company still wants to use S3 as storage.\n \nWhich S3 encryption option meets this requirement?", "options_en": ["Use SSE-C (server-side encryption with customer-provided keys), where the application provides the encryption key with each request and AWS uses it without storing it.", "Use SSE-KMS with an external key store (XKS) that connects KMS to the on-premises HSM, allowing KMS to use the HSM-managed keys for S3 encryption operations.", "Use SSE-KMS with imported key material, where the company imports their HSM-generated key into KMS and retains a copy on-premises for independent key lifecycle management.", "Use client-side encryption with the AWS Encryption SDK before uploading to S3, combined with SSE-S3 to provide a second layer of server-side encryption on the stored objects."], "correct": 0, "explanation_en": "SSE-C allows the customer to provide the encryption key with each S3 request. AWS uses the key to encrypt or decrypt the object but does not store the key material, discarding it after the operation. This ensures AWS never retains the encryption key. XKS connects KMS to an external keystore but still routes through KMS. Imported key material is stored within KMS after import. Client-side encryption with the AWS Encryption SDK would also work but the question asks about S3 encryption options specifically, and SSE-C is the native S3 mechanism.", "question_zh": "公司有一项监管要求，即用于 S3 数据的加密密钥必须完全在其本地 HSM 内生成和管理。 AWS 绝不能在此过程中的任何时刻存储或访问加密密钥材料。该公司仍然希望使用S3作为存储。\n \n哪种 S3 加密选项满足此要求？", "options_zh": ["使用 SSE-C（使用客户提供的密钥进行服务器端加密），其中应用程序为每个请求提供加密密钥，AWS 使用它而不存储它。", "将 SSE-KMS 与外部密钥存储 (XKS) 结合使用，将 KMS 连接到本地 HSM，从而允许 KMS 使用 HSM 管理的密钥进行 S3 加密操作。", "将 SSE-KMS 与导入的密钥材料结合使用，公司将 HSM 生成的密钥导入到 KMS 中，并在本地保留副本以进行独立的密钥生命周期管理。", "在上传到 S3 之前，使用 AWS 加密 SDK 进行客户端加密，并结合 SSE-S3 对存储的对象提供第二层服务器端加密。"], "explanation_zh": "SSE-C 允许客户在每个 S3 请求中提供加密密钥。 AWS 使用密钥来加密或解密对象，但不存储密钥材料，并在操作后将其丢弃。这可确保 AWS 永远不会保留加密密钥。 XKS 将 KMS 连接到外部密钥库，但仍通过 KMS 进行路由。导入的密钥材料导入后存储在KMS中。使用 AWS 加密 SDK 进行客户端加密也可以，但问题专门询问 S3 加密选项，而 SSE-C 是本机 S3 机制。"}, {"exam": 5, "id": 55, "question_en": "A security operations team in Account A needs to receive and analyze CloudWatch Logs from application workloads running in Accounts B and C. They want a near-real-time streaming solution that delivers logs from the source accounts to the central monitoring account without deploying additional infrastructure.\n \nWhich approach provides this cross-account log streaming?", "options_en": ["Enable CloudWatch cross-account observability in Accounts B and C with Account A as the monitoring account, then access log groups from Account A's CloudWatch console.", "Configure S3 export tasks on each log group in Accounts B and C to deliver log data to a central S3 bucket in Account A, then query the exported data using Athena.", "Create CloudWatch Logs cross-account subscription filters in Accounts B and C that stream log events to a destination in Account A such as a Kinesis Data Stream or Lambda.", "Use AWS CloudTrail organization trails to aggregate all log data from Accounts B and C into Account A, since CloudTrail captures CloudWatch Logs events for centralized analysis."], "correct": 2, "explanation_en": "CloudWatch Logs subscription filters support cross-account log streaming by sending log events in near-real-time to a destination in another account, such as a Kinesis Data Stream, Kinesis Data Firehose, or Lambda function. This requires setting up a destination in the receiving account and configuring subscription filters in the source accounts. Cross-account observability provides a read-only console view but does not stream data for processing. S3 export is batch-based, not near-real-time. CloudTrail captures API calls, not application log data from CloudWatch Logs.", "question_zh": "账户 A 中的安全运营团队需要从账户 B 和 C 中运行的应用程序工作负载接收并分析 CloudWatch Logs。他们需要一个近乎实时的流解决方案，能够将日志从源账户传送到中央监控账户，而无需部署额外的基础设施。\n \n哪种方法提供这种跨账户日志流？", "options_zh": ["在账户 B 和 C 中启用 CloudWatch 跨账户可观察性，并以账户 A 作为监控账户，然后从账户 A 的 CloudWatch 控制台访问日志组。", "在账户 B 和 C 中的每个日志组上配置 S3 导出任务，将日志数据传送到账户 A 中的中央 S3 存储桶，然后使用 Athena 查询导出的数据。", "在账户 B 和 C 中创建 CloudWatch Logs 跨账户订阅过滤器，将日志事件流式传输到账户 A 中的目标，例如 Kinesis Data Stream 或 Lambda。", "使用 AWS CloudTrail 组织跟踪将账户 B 和 C 中的所有日志数据聚合到账户 A 中，因为 CloudTrail 会捕获 CloudWatch Logs 事件以进行集中分析。"], "explanation_zh": "CloudWatch Logs 订阅筛选器通过近乎实时地将日志事件发送到另一个账户中的目标（例如 Kinesis Data Stream、Kinesis Data Firehose 或 Lambda 函数）来支持跨账户日志流。这需要在接收帐户中设置目标并在源帐户中配置订阅过滤器。跨账户可观察性提供只读控制台视图，但不流式传输数据进行处理。 S3 导出是基于批量的，而不是近乎实时的。 CloudTrail 捕获 API 调用，而不是来自 CloudWatch Logs 的应用程序日志数据。"}, {"exam": 5, "id": 56, "question_en": "A company stores sensitive user profiles in Amazon DynamoDB. Their security policy requires that the encryption key used for the table data at rest is a customer managed KMS key with a specific key policy, and all encryption operations must be auditable through CloudTrail.\n \nHow should they configure DynamoDB encryption?", "options_en": ["Enable DynamoDB encryption at rest using the default AWS owned key, then create a CloudTrail trail with DynamoDB data events to capture all encryption-related API calls.", "Specify a customer managed KMS key when creating or updating the DynamoDB table encryption settings, ensuring all data at rest is encrypted with the CMK and logged in CloudTrail.", "Implement client-side encryption using the AWS Encryption SDK before writing items to DynamoDB, and configure CloudTrail to capture all KMS API calls for the encryption key.", "Configure DynamoDB to use an AWS managed KMS key (`aws/dynamodb`) and customize the key policy to restrict access, since AWS managed keys support custom key policies."], "correct": 1, "explanation_en": "DynamoDB supports server-side encryption at rest with customer managed KMS keys. When a CMK is specified, all read and write operations trigger KMS API calls that are logged in CloudTrail, providing full auditability. Customer managed keys allow custom key policies for fine-grained access control. The default AWS owned key does not appear in CloudTrail. Client-side encryption adds application complexity. AWS managed keys (`aws/dynamodb`) do not support custom key policies.", "question_zh": "一家公司将敏感用户配置文件存储在 Amazon DynamoDB 中。他们的安全策略要求用于静态表数据的加密密钥是具有特定密钥策略的客户管理的 KMS 密钥，并且所有加密操作都必须可通过 CloudTrail 进行审核。\n \n他们应该如何配置 DynamoDB 加密？", "options_zh": ["使用默认的 AWS 拥有的密钥启用静态 DynamoDB 加密，然后使用 DynamoDB 数据事件创建 CloudTrail 跟踪以捕获所有与加密相关的 API 调用。", "创建或更新 DynamoDB 表加密设置时指定客户管理的 KMS 密钥，确保所有静态数据均使用 CMK 加密并记录在 CloudTrail 中。", "在将项目写入 DynamoDB 之前，使用 AWS 加密 SDK 实施客户端加密，并配置 CloudTrail 以捕获加密密钥的所有 KMS API 调用。", "配置 DynamoDB 以使用 AWS 托管 KMS 密钥 (`aws/dynamodb`) 并自定义密钥策略以限制访问，因为 AWS 托管密钥支持自定义密钥策略。"], "explanation_zh": "DynamoDB 支持使用客户管理的 KMS 密钥进行服务器端静态加密。指定 CMK 后，所有读取和写入操作都会触发记录在 CloudTrail 中的 KMS API 调用，从而提供完整的可审核性。客户管理的密钥允许自定义密钥策略以实现细粒度的访问控制。默认 AWS 拥有的密钥不会出现在 CloudTrail 中。客户端加密增加了应用程序的复杂性。 AWS 托管密钥 (`aws/dynamodb`) 不支持自定义密钥策略。"}, {"exam": 5, "id": 57, "question_en": "A company uses AWS Control Tower to govern their multi-account environment. They want to prevent non-compliant resources from being created by CloudFormation, such as S3 buckets without encryption or EC2 instances without required tags, before the resources are provisioned.\n \nWhich Control Tower control type provides this pre-deployment validation?", "options_en": ["Enable detective controls in Control Tower that use AWS Config rules to identify non-compliant resources after creation and generate compliance findings for remediation.", "Create preventive controls using SCPs that deny the `s3:CreateBucket` and `ec2:RunInstances` API calls unless specific condition keys are present in the request.", "Deploy custom AWS Config remediation actions that automatically delete or modify non-compliant resources within minutes of their creation in the governed member accounts.", "Enable proactive controls in Control Tower that use CloudFormation hooks to validate resource configurations against compliance rules before the deployment proceeds."], "correct": 3, "explanation_en": "Control Tower proactive controls use CloudFormation hooks to validate resource properties before they are created or updated. If a resource fails validation, CloudFormation blocks the deployment. This prevents non-compliant resources from being provisioned in the first place. Detective controls identify non-compliance after the fact. SCPs can restrict API calls but cannot inspect resource properties like encryption settings. Config remediation acts after resource creation, not before.", "question_zh": "一家公司使用 AWS Control Tower 来管理其多账户环境。他们希望在配置资源之前防止 CloudFormation 创建不合规的资源，例如未加密的 S3 存储桶或没有所需标签的 EC2 实例。\n \n哪种控制塔控件类型提供此部署前验证？", "options_zh": ["在 Control Tower 中启用检测控制，使用 AWS Config 规则在创建后识别不合规资源并生成合规性结果以进行修复。", "使用 SCP 创建预防性控制，拒绝“s3:CreateBucket”和“ec2:RunInstances” API 调用，除非请求中存在特定条件键。", "部署自定义 AWS Config 修复操作，在受管成员账户中创建不合规资源后几分钟内自动删除或修改不合规资源。", "在 Control Tower 中启用主动控制，在部署继续之前使用 CloudFormation 挂钩根据合规性规则验证资源配置。"], "explanation_zh": "Control Tower 主动控件使用 CloudFormation 挂钩在创建或更新资源属性之前对其进行验证。如果资源验证失败，CloudFormation 会阻止部署。这首先可以防止供应不合规的资源。检测控制在事后发现违规行为。 SCP 可以限制 API 调用，但无法检查加密设置等资源属性。配置修复在资源创建之后而不是之前进行。"}, {"exam": 5, "id": 58, "question_en": "An auditor requests copies of AWS's SOC 2 Type II report and ISO 27001 certification to verify that AWS infrastructure meets the company's vendor compliance requirements. The security team needs to download these compliance documents directly from AWS.\n \nWhich AWS service provides access to these compliance reports?", "options_en": ["Use AWS Artifact to download AWS compliance reports including SOC, ISO, PCI DSS, and other third-party audit reports directly from the AWS Management Console.", "Submit a request through AWS Support to obtain copies of SOC and ISO reports, as these documents require NDA agreement and manual distribution by the compliance team.", "Access the AWS Compliance Center website, which hosts downloadable copies of all AWS compliance certifications and audit reports for public access without authentication.", "Use AWS Audit Manager to generate the SOC 2 and ISO 27001 reports by running the corresponding assessment frameworks against the company's own AWS environment."], "correct": 0, "explanation_en": "AWS Artifact is a self-service portal in the AWS Management Console that provides on-demand access to AWS compliance reports such as SOC 1/2/3, ISO 27001, PCI DSS, and others. Users can download these reports after accepting the applicable agreements. AWS Support requests are not required. There is no public compliance center with downloadable reports. Audit Manager assesses the customer's own environment against compliance frameworks; it does not provide AWS's own audit reports.", "question_zh": "审核员要求提供 AWS 的 SOC 2 Type II 报告和 ISO 27001 认证的副本，以验证 AWS 基础设施是否满足公司的供应商合规性要求。安全团队需要直接从 AWS 下载这些合规性文档。\n \n哪些 AWS 服务提供对这些合规性报告的访问？", "options_zh": ["使用 AWS Artifact 直接从 AWS 管理控制台下载 AWS 合规性报告，包括 SOC、ISO、PCI DSS 和其他第三方审核报告。", "通过 AWS Support 提交请求以获取 SOC 和 ISO 报告的副本，因为这些文件需要 NDA 协议并由合规团队手动分发。", "访问 AWS 合规中心网站，该网站托管所有 AWS 合规性认证和审核报告的可下载副本，可供公众访问，无需身份验证。", "使用 AWS Audit Manager 通过针对公司自己的 AWS 环境运行相应的评估框架来生成 SOC 2 和 ISO 27001 报告。"], "explanation_zh": "AWS Artifact 是 AWS 管理控制台中的自助服务门户，可按需访问 AWS 合规性报告，例如 SOC 1/2/3、ISO 27001、PCI DSS 等。用户可以在接受适用协议后下载这些报告。不需要 AWS 支持请求。没有提供可下载报告的公共合规中心。审计经理根据合规性框架评估客户自身的环境；它不提供AWS自己的审计报告。"}, {"exam": 5, "id": 59, "question_en": "A company's compliance team needs to collect audit evidence across 30 AWS accounts in their organization. They want to centralize audit management in a dedicated compliance account rather than using the management account for day-to-day audit operations.\n \nHow should they configure AWS Audit Manager for this multi-account setup?", "options_en": ["Create separate Audit Manager assessments in each of the 30 accounts and use CloudFormation StackSets to deploy standardized assessment configurations across all accounts.", "Enable Audit Manager in the management account only and configure cross-account IAM roles in each member account that allow Audit Manager to collect evidence remotely.", "Register a dedicated compliance account as the Audit Manager delegated administrator, enabling centralized assessment management and evidence collection across the organization.", "Deploy a Lambda function in the management account that calls Audit Manager APIs in each member account using assumed roles, aggregating evidence into a central S3 bucket."], "correct": 2, "explanation_en": "AWS Audit Manager supports delegated administrators through AWS Organizations integration. Registering a compliance account as the delegated administrator enables it to create assessments, collect evidence, and manage audit activities across all organization accounts without using the management account. Per-account assessments lack centralization. Cross-account IAM roles require custom implementation. Lambda-based aggregation adds unnecessary complexity compared to the native delegation feature.", "question_zh": "公司的合规团队需要收集组织内 30 个 AWS 账户的审计证据。他们希望将审计管理集中在专用的合规帐户中，而不是使用管理帐户进行日常审计操作。\n \n他们应该如何为此多账户设置配置 AWS Audit Manager？", "options_zh": ["在 30 个账户中的每个账户中创建单独的 Audit Manager 评估，并使用 CloudFormation StackSets 在所有账户中部署标准化评估配置。", "仅在管理账户中启用 Audit Manager，并在每个成员账户中配置跨账户 IAM 角色，以允许 Audit Manager 远程收集证据。", "注册专用合规帐户作为审计经理委派管理员，从而​​在整个组织内实现集中评估管理和证据收集。", "在管理账户中部署 Lambda 函数，该函数使用假定的角色调用每个成员账户中的审核管理器 API，将证据聚合到中央 S3 存储桶中。"], "explanation_zh": "AWS Audit Manager 通过 AWS Organizations 集成支持委派管理员。将合规帐户注册为委派管理员，使其能够在所有组织帐户中创建评估、收集证据和管理审核活动，而无需使用管理帐户。每个账户的评估缺乏集中化。跨账户 IAM 角色需要自定义实现。与本机委托功能相比，基于 Lambda 的聚合增加了不必要的复杂性。"}, {"exam": 5, "id": 60, "question_en": "A DevOps team writes CloudFormation templates and wants to validate them for syntax errors, incorrect resource property types, and unsupported resource attributes before deploying. They need a tool that runs as a pre-commit check in their local development environment.\n \nWhich tool is designed specifically for this CloudFormation validation use case?", "options_en": ["Use `aws cloudformation validate-template` CLI command, which checks template syntax and validates resource property types against the CloudFormation specification.", "Run AWS CloudFormation Guard (`cfn-guard`) to validate templates against policy rules, which verifies resource property values match organizational compliance requirements.", "Deploy a CloudFormation change set in a sandbox account to identify errors during the planning phase without actually creating or modifying any infrastructure resources.", "Use `cfn-lint` to validate templates against the CloudFormation resource specification, checking for syntax errors, incorrect property types, and unsupported attributes."], "correct": 3, "explanation_en": "`cfn-lint` is an open-source linter specifically designed for CloudFormation templates. It validates templates against the CloudFormation resource specification, catching syntax errors, incorrect property types, deprecated features, and unsupported attributes. It runs locally as a pre-commit hook or in CI pipelines. The `validate-template` CLI command only checks basic JSON/YAML syntax, not resource property types. CloudFormation Guard validates templates against custom policy rules, not the resource specification. Change sets require an AWS account and network connectivity.", "question_zh": "DevOps 团队编写 CloudFormation 模板，并希望在部署之前验证它们是否存在语法错误、不正确的资源属性类型和不受支持的资源属性。他们需要一个在本地开发环境中作为预提交检查运行的工具。\n \n哪个工具是专门为此 CloudFormation 验证用例设计的？", "options_zh": ["使用“aws cloudformation validate-template” CLI 命令，该命令检查模板语法并根据 CloudFormation 规范验证资源属性类型。", "运行 AWS CloudFormation Guard (`cfn-guard`) 以根据策略规则验证模板，从而验证资源属性值是否符合组织合规性要求。", "在沙盒帐户中部署 CloudFormation 更改集，以在规划阶段识别错误，而无需实际创建或修改任何基础设施资源。", "使用“cfn-lint”根据 CloudFormation 资源规范验证模板，检查语法错误、不正确的属性类型和不受支持的属性。"], "explanation_zh": "`cfn-lint` 是专门为 CloudFormation 模板设计的开源 linter。它根据 CloudFormation 资源规范验证模板，捕获语法错误、不正确的属性类型、已弃用的功能和不受支持的属性。它作为预提交挂钩在本地运行或在 CI 管道中运行。 `validate-template` CLI 命令仅检查基本 JSON/YAML 语法，而不检查资源属性类型。 CloudFormation Guard 根据自定义策略规则（而不是资源规范）验证模板。更改集需要 AWS 账户和网络连接。"}, {"exam": 5, "id": 61, "question_en": "A central platform team manages a portfolio of approved CloudFormation products in AWS Service Catalog. They need to make these products available to developers in 20 member accounts across the organization without duplicating the portfolio in each account.\n \nHow should they distribute the portfolio across accounts?", "options_en": ["Export each product as a CloudFormation template and import them into Service Catalog portfolios created independently in each of the 20 member accounts.", "Share the portfolio with the organization or specific OUs using AWS Service Catalog portfolio sharing, which makes products available in member accounts without duplication.", "Use AWS RAM to share the Service Catalog portfolio resource with the member accounts, enabling developers to launch shared products from their local Service Catalog console.", "Deploy the portfolio to each account using CloudFormation StackSets with a template that recreates the portfolio and all products identically in every member account."], "correct": 1, "explanation_en": "AWS Service Catalog supports portfolio sharing with AWS Organizations, OUs, or individual accounts. Shared portfolios appear in recipient accounts and products can be launched by authorized users without duplicating the portfolio or product definitions. Changes to the shared portfolio are automatically reflected in recipient accounts. Exporting and importing templates creates independent copies. RAM does not support Service Catalog portfolio sharing. StackSets would create independent copies requiring separate management.", "question_zh": "中央平台团队管理 AWS Service Catalog 中经批准的 CloudFormation 产品组合。他们需要向整个组织 20 个成员帐户中的开发人员提供这些产品，而无需在每个帐户中重复产品组合。\n \n他们应该如何在账户之间分配投资组合？", "options_zh": ["将每个产品导出为 CloudFormation 模板，并将其导入到 20 个成员帐户中每个帐户独立创建的服务目录组合中。", "使用 AWS Service Catalog 产品组合共享与组织或特定 OU 共享产品组合，这使得成员账户中的产品不重复可用。", "使用 AWS RAM 与成员账户共享 Service Catalog 产品组合资源，使开发人员能够从本地 Service Catalog 控制台启动共享产品。", "使用 CloudFormation StackSets 将产品组合部署到每个帐户，并使用一个模板在每个成员帐户中以相同的方式重新创建产品组合和所有产品。"], "explanation_zh": "AWS Service Catalog 支持与 AWS Organizations、OU 或个人账户共享产品组合。共享的产品组合出现在接收者帐户中，并且授权用户可以启动产品，而无需复制产品组合或产品定义。对共享投资组合的更改会自动反映在收件人帐户中。导出和导入模板会创建独立的副本。 RAM 不支持服务目录组合共享。 StackSets 将创建需要单独管理的独立副本。"}, {"exam": 5, "id": 62, "question_en": "A company has configured Route 53 Resolver forwarding rules in their shared services account to resolve on-premises domain names. They need workloads in 15 spoke VPCs across different accounts to use these same forwarding rules without recreating them in each account.\n \nHow should they share the Resolver rules across accounts?", "options_en": ["Create a Transit Gateway and attach all spoke VPCs, then configure Route 53 Resolver to forward queries through the Transit Gateway to the shared services account.", "Deploy Route 53 private hosted zones associated with each spoke VPC and create identical forwarding rules in each hosted zone for the on-premises domain names.", "Set up VPC peering between each spoke VPC and the shared services VPC, and configure the DHCP option sets in spoke VPCs to use the shared services DNS resolver.", "Share the Route 53 Resolver forwarding rules with the spoke accounts using AWS Resource Access Manager, then associate the shared rules with VPCs in each account."], "correct": 3, "explanation_en": "AWS RAM supports sharing Route 53 Resolver forwarding rules across accounts. Once shared, the recipient accounts can associate the rules with their VPCs, enabling DNS resolution of on-premises domains without recreating rules in each account. Updates to the shared rules are automatically reflected. Transit Gateway provides network connectivity but does not share Resolver rules. Private hosted zones handle DNS names you define, not forwarding rules. DHCP option sets cannot reference cross-account DNS resolvers.", "question_zh": "一家公司在其共享服务账户中配置了 Route 53 解析器转发规则来解析本地域名。他们需要跨不同账户的 15 个分支 VPC 中的工作负载来使用这些相同的转发规则，而无需在每个账户中重新创建它们。\n \n他们应该如何跨账户共享解析器规则？", "options_zh": ["创建 Transit Gateway 并附加所有分支 VPC，然后配置 Route 53 解析器以通过 Transit Gateway 将查询转发到共享服务账户。", "部署与每个分支 VPC 关联的 Route 53 私有托管区域，并在每个托管区域中为本地域名创建相同的转发规则。", "在每个分支 VPC 和共享服务 VPC 之间设置 VPC 对等互连，并将分支 VPC 中的 DHCP 选项集配置为使用共享服务 DNS 解析器。", "使用 AWS Resource Access Manager 与分支账户共享 Route 53 解析器转发规则，然后将共享规则与每个账户中的 VPC 关联。"], "explanation_zh": "AWS RAM 支持跨账户共享 Route 53 Resolver 转发规则。共享后，收件人账户可以将规则与其 VPC 关联，从而启用本地域的 DNS 解析，而无需在每个账户中重新创建规则。共享规则的更新会自动反映。 Transit Gateway 提供网络连接，但不共享解析程序规则。私有托管区域处理您定义的 DNS 名称，而不是转发规则。 DHCP 选项集无法引用跨账户 DNS 解析器。"}, {"exam": 5, "id": 63, "question_en": "A company completed an initial Well-Architected Framework review of their production workload three months ago and has since addressed several high-risk security issues. They want to track their improvement progress over time by comparing the current state to the original review.\n \nWhich Well-Architected Tool feature supports this comparison?", "options_en": ["Export the current review as a PDF report and manually compare it against the exported report from the original review to identify improvements made over time.", "Create a new workload review in the Well-Architected Tool and reference the original review as a baseline, which automatically highlights the differences between reviews.", "Save a milestone in the Well-Architected Tool before making changes, then compare the current workload state against the saved milestone to visualize improvement progress.", "Use AWS Config to track changes to the workload resources over the past three months and correlate the configuration changes with the Well-Architected improvement plan."], "correct": 2, "explanation_en": "The Well-Architected Tool supports milestones, which capture a point-in-time snapshot of the workload review. After saving a milestone, you can update the workload review as improvements are made and compare the current state against previous milestones to visualize progress and identify resolved high-risk issues. PDF exports do not support automated comparison. The tool does not support baseline references between separate reviews. AWS Config tracks resource configurations, not Well-Architected review states.", "question_zh": "一家公司在三个月前完成了对其生产工作负载的初步架构完善框架审查，此后解决了多个高风险安全问题。他们希望通过将当前状态与原始审核进行比较来跟踪一段时间内的改进进度。\n \n哪些架构完善的工具功能支持这种比较？", "options_zh": ["将当前审阅导出为 PDF 报告，并手动将其与原始审阅导出的报告进行比较，以确定随着时间的推移所做的改进。", "在 Well-Architected Tool 中创建新的工作负载审查，并将原始审查作为基准，这会自动突出显示审查之间的差异。", "在进行更改之前，在 Well-Architected Tool 中保存一个里程碑，然后将当前工作负载状态与保存的里程碑进行比较，以可视化改进进度。", "使用 AWS Config 跟踪过去三个月工作负载资源的更改，并将配置更改与架构完善的改进计划关联起来。"], "explanation_zh": "Well-Architected Tool 支持里程碑，它捕获工作负载审查的时间点快照。保存里程碑后，您可以在进行改进时更新工作负载审核，并将当前状态与之前的里程碑进行比较，以可视化进度并识别已解决的高风险问题。 PDF 导出不支持自动比较。该工具不支持单独审阅之间的基线参考。 AWS Config 跟踪资源配置，而不是 Well-Architected 审核状态。"}, {"exam": 5, "id": 64, "question_en": "A security team needs to audit all security groups across their organization's accounts to identify groups with overly permissive rules such as `0.0.0.0/0` on SSH port 22. They want to automatically receive alerts when non-compliant security groups are detected in any member account.\n \nWhich service provides centralized security group auditing across an organization?", "options_en": ["Create an AWS Firewall Manager security group audit policy that checks security groups across all member accounts for overly permissive rules and generates compliance findings.", "Deploy AWS Config managed rules for security group compliance in each account using CloudFormation StackSets and aggregate findings in a central Config aggregator account.", "Use Amazon Inspector network reachability assessments to scan all VPCs across the organization and identify security groups that allow unrestricted inbound access to instances.", "Configure VPC Flow Logs across all accounts and use CloudWatch Logs Insights queries to identify traffic patterns indicating overly permissive security group configurations."], "correct": 0, "explanation_en": "AWS Firewall Manager security group audit policies allow centralized auditing of security groups across all accounts in an organization. Audit policies check for overly permissive rules based on configurable criteria and generate non-compliance findings. This provides a single-pane view of security group compliance. Config rules require per-account deployment. Inspector network reachability analyzes individual instances, not organization-wide security group compliance. VPC Flow Logs show traffic patterns but do not directly audit security group rules.", "question_zh": "安全团队需要审核其组织帐户中的所有安全组，以识别具有过度宽松规则的组，例如 SSH 端口 22 上的“0.0.0.0/0”。他们希望在任何成员帐户中检测到不合规安全组时自动接收警报。\n \n哪种服务提供整个组织的集中安全组审核？", "options_zh": ["创建 AWS Firewall Manager 安全组审核策略，检查所有成员账户的安全组是否存在过度宽松的规则并生成合规性结果。", "使用 CloudFormation StackSets 在每个账户中部署 AWS Config 托管规则以实现安全组合规性，并在中央 Config 聚合器账户中聚合结果。", "使用 Amazon Inspector 网络可达性评估扫描整个组织中的所有 VPC，并识别允许对实例进行不受限制的入站访问的安全组。", "跨所有账户配置 VPC 流日志，并使用 CloudWatch Logs Insights 查询来识别表明安全组配置过于宽松的流量模式。"], "explanation_zh": "AWS Firewall Manager 安全组审核策略允许对组织中所有账户的安全组进行集中审核。审核策略根据可配置的标准检查是否存在过于宽松的规则，并生成不合规结果。这提供了安全组合规性的单一窗格视图。配置规则需要按帐户部署。 Inspector 网络可达性分析单个实例，而不是组织范围内的安全组合规性。 VPC 流日志显示流量模式，但不直接审核安全组规则。"}, {"exam": 5, "id": 65, "question_en": "A European company using AWS Control Tower needs to restrict all member accounts to only operate in `eu-west-1` and `eu-central-1` to comply with data sovereignty requirements. No AWS services should be usable in any other Region except for global services like IAM and CloudFront.\n \nHow should they implement this Region restriction in Control Tower?", "options_en": ["Create a custom SCP that explicitly denies all actions in non-approved Regions and manually attach it to each OU, exempting global services using `NotAction` statements.", "Configure the Control Tower Region deny setting in the landing zone configuration, specifying the allowed Regions, which automatically generates and applies the Region restriction SCP.", "Enable AWS Config rules in each account that detect and flag resources created outside the approved Regions, with auto-remediation to terminate non-compliant resources.", "Use IAM Identity Center permission sets with a Region condition that restricts all federated users to launch sessions only in the two approved European Regions."], "correct": 1, "explanation_en": "Control Tower provides a built-in Region deny setting in the landing zone configuration. When configured with the allowed Regions, Control Tower automatically generates and applies an SCP that denies API calls in non-approved Regions while exempting global services. This is managed as part of the landing zone and automatically applies to governed accounts. Custom SCPs require manual maintenance. Config rules detect after creation, not prevent. Identity Center Region conditions only apply to federated sessions, not service-level API calls.", "question_zh": "使用 AWS Control Tower 的欧洲公司需要限制所有成员账户仅在“eu-west-1”和“eu-central-1”中运行，以符合数据主权要求。除了 IAM 和 CloudFront 等全球服务之外，任何 AWS 服务都不能在任何其他区域使用。\n \n他们应该如何在控制塔中实施这个区域限制？", "options_zh": ["创建一个自定义 SCP，明确拒绝未经批准的区域中的所有操作，并将其手动附加到每个 OU，使用“NotAction”语句免除全局服务。", "在登陆区域配置中配置控制塔区域拒绝设置，指定允许的区域，这会自动生成并应用区域限制 SCP。", "在每个账户中启用 AWS Config 规则，以检测和标记在批准的区域之外创建的资源，并通过自动修复来终止不合规的资源。", "将 IAM Identity Center 权限集与区域条件结合使用，限制所有联合用户仅在两个批准的欧洲区域启动会话。"], "explanation_zh": "Control Tower 在登陆区域配置中提供内置区域拒绝设置。配置允许的区域后，Control Tower 会自动生成并应用 SCP，该 SCP 拒绝未经批准的区域中的 API 调用，同时免除全局服务。这是作为登陆区域的一部分进行管理的，并自动应用于受管理的帐户。自定义 SCP 需要手动维护。配置规则在创建后进行检测，而不是阻止。 Identity Center 区域条件仅适用于联合会话，不适用于服务级别 API 调用。"}];

// ===== STATE =====
let questions = [];
let currentIndex = 0;
let answers = {}; // { questionId: { selected: N, correct: bool } }
let mode = 'bilingual'; // en | zh | bilingual
let examFilter = 'all';

// ===== DOM refs =====
const $quiz = document.getElementById('quizArea');
const $results = document.getElementById('resultsArea');
const $resultsContent = document.getElementById('resultsContent');
const $reviewList = document.getElementById('reviewList');
const $progressLabel = document.getElementById('progressLabel');
const $progressFill = document.getElementById('progressFill');
const $scoreLabel = document.getElementById('scoreLabel');
const $examFilter = document.getElementById('examFilter');
const $langMode = document.getElementById('langMode');

// ===== Init =====
function filterQuestions() {
  if (examFilter === 'all') {
    questions = [...ALL_QUESTIONS];
  } else {
    questions = ALL_QUESTIONS.filter(q => q.exam === parseInt(examFilter));
  }
  // Shuffle
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
}

function resetExam() {
  answers = {};
  currentIndex = 0;
  filterQuestions();
  mode = $langMode.value;
  examFilter = $examFilter.value;
  $results.classList.remove('show');
  $quiz.classList.remove('hidden');
  updateProgress();
  renderQuestion();
}

function updateProgress() {
  const total = questions.length;
  const answered = Object.keys(answers).length;
  const correct = Object.values(answers).filter(a => a.correct).length;
  $progressLabel.textContent = `Q ${answered}/${total}`;
  $progressFill.style.width = total > 0 ? `${(answered/total)*100}%` : '0%';
  $scoreLabel.textContent = answered > 0 ? `Score: ${correct}/${answered} (${Math.round(correct/answered*100)}%)` : 'Score: -';
}

// ===== Render =====
function renderQuestion() {
  const input = document.getElementById('qJumpInput');
  if (input) input.value = currentIndex + 1;
  if (currentIndex >= questions.length) {
    showResults();
    return;
  }
  const q = questions[currentIndex];
  const qId = `${q.exam}-${q.id}`;
  const answered = answers[qId];
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

  let html = `<div class="q-card${answered ? (answered.correct ? ' correct-card' : ' wrong-card') : ''}" id="qCard">`;
  html += `<div class="q-header"><span class="q-num">Q ${currentIndex+1}/${questions.length}</span><span class="q-exam-tag">Exam ${q.exam}, Q${q.id}</span></div>`;
  html += `<p class="q-text q-text-en">${q.question_en}</p>`;
  if (mode !== 'en') html += `<p class="q-text-zh">${q.question_zh}</p>`;

  html += '<ul class="options">';
  q.options_en.forEach((optEn, i) => {
    const optZh = q.options_zh[i] || optEn;
    let cls = 'option';
    if (answered) {
      cls += ' disabled';
      if (i === q.correct) cls += ' correct-answer';
      else if (i === answered.selected && !answered.correct) cls += ' wrong-answer';
    }
    html += `<li class="${cls}" onclick="selectOption(${i})" id="opt${i}">
      <span class="opt-letter">${letters[i]}</span>
      <span class="opt-text">
        <span class="opt-en">${optEn}</span>
        ${mode !== 'en' ? `<br><span class="opt-zh">${optZh}</span>` : ''}
      </span>
    </li>`;
  });
  html += '</ul>';

  if (answered) {
    html += `<div class="explanation show" id="explanation">
      <h4>📖 Explanation / 解释</h4>
      <p class="exp-en">${q.explanation_en}</p>
      ${mode !== 'en' ? `<p class="exp-zh">${q.explanation_zh}</p>` : ''}
    </div>`;
  } else {
    html += `<div class="explanation" id="explanation">
      <h4>📖 Explanation / 解释</h4>
      <p class="exp-en">${q.explanation_en}</p>
      ${mode !== 'en' ? `<p class="exp-zh">${q.explanation_zh}</p>` : ''}
    </div>`;
  }

  html += '<div class="actions">';
  if (!answered) {
    html += '<button class="btn-primary" onclick="showAnswer()">💡 Show Answer / 显示答案</button>';
  }
  html += `<button onclick="nextQuestion()">${answered ? '➡️ Next Question / 下一题' : '⏭️ Skip / 跳过'}</button>`;
  html += '</div>';
  html += '</div>';

  $quiz.innerHTML = html;

  // Apply lang mode classes
  if (mode === 'en') {
    $quiz.classList.add('hidden-zh');
    $quiz.classList.remove('hidden-en');
  } else if (mode === 'zh') {
    $quiz.classList.add('hidden-en');
    $quiz.classList.remove('hidden-zh');
  } else {
    $quiz.classList.remove('hidden-zh', 'hidden-en');
  }

  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(idx) {
  const q = questions[currentIndex];
  const qId = `${q.exam}-${q.id}`;
  if (answers[qId]) return; // already answered

  const correct = idx === q.correct;
  answers[qId] = { selected: idx, correct };

  // Update UI
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.add('disabled');
    if (i === q.correct) el.classList.add('correct-answer');
    else if (i === idx && !correct) el.classList.add('wrong-answer');
  });
  document.getElementById('explanation').classList.add('show');

  // Update buttons
  const actions = document.querySelector('.actions');
  actions.innerHTML = '<button class="btn-primary" onclick="nextQuestion()">➡️ Next Question / 下一题</button>';
}

function showAnswer() {
  const q = questions[currentIndex];
  const qId = `${q.exam}-${q.id}`;
  if (answers[qId]) return;

  // Mark all as disabled and show correct
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.add('disabled');
    if (i === q.correct) el.classList.add('correct-answer');
  });
  document.getElementById('explanation').classList.add('show');

  // Record as skipped (no selection)
  answers[qId] = { selected: -1, correct: false };

  const actions = document.querySelector('.actions');
  actions.innerHTML = '<button class="btn-primary" onclick="nextQuestion()">➡️ Next Question / 下一题</button>';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
    document.getElementById('qJumpInput').value = currentIndex + 1;
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
    document.getElementById('qJumpInput').value = currentIndex + 1;
  }
}

function jumpToQ() {
  const input = document.getElementById('qJumpInput');
  let idx = parseInt(input.value) - 1;
  if (isNaN(idx) || idx < 0) idx = 0;
  if (idx >= questions.length) idx = questions.length - 1;
  currentIndex = idx;
  input.value = currentIndex + 1;
  $results.classList.remove('show');
  $quiz.classList.remove('hidden');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResults() {
  $quiz.classList.add('hidden');
  $results.classList.add('show');
  const total = questions.length;
  const correct = Object.values(answers).filter(a => a.correct).length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  const passed = pct >= 75;

  let html = `<h2>${passed ? '🎉 Passed! / 通过!' : '📚 Keep Studying! / 继续学习!'}</h2>`;
  html += `<div class="score-big ${passed ? 'pass' : 'fail'}">${correct}/${total}</div>`;
  html += `<p style="color:var(--text2);margin-bottom:10px;">${pct}% — ${passed ? 'Above 75% threshold' : 'Below 75% threshold'}</p>`;
  html += `<div class="badge ${passed ? 'badge-pass' : 'badge-fail'}">${passed ? '✅ PASS / 通过' : '❌ NEEDS WORK / 需加强'}</div>`;
  html += `<p style="margin-top:12px;"><button class="btn-orange" onclick="resetExam()">🔄 Retry / 重新开始</button></p>`;
  $resultsContent.innerHTML = html;

  // Review list
  let reviewHtml = '<h4 style="margin-bottom:8px;">📋 Review / 回顾</h4>';
  questions.forEach((q, idx) => {
    const qId = `${q.exam}-${q.id}`;
    const a = answers[qId];
    const isCorrect = a && a.correct;
    const cls = isCorrect ? 'correct' : 'wrong';
    const mark = isCorrect ? '✓' : '✗';
    reviewHtml += `<div class="review-item ${cls}" onclick="jumpToQuestion(${idx})">
      <span>${mark} Exam ${q.exam} Q${q.id}: ${q.question_en.substring(0, 80)}...</span>
      <span class="mark ${isCorrect ? 'green' : 'red'}">${mark}</span>
    </div>`;
  });
  $reviewList.innerHTML = reviewHtml;
  updateProgress();
}

function jumpToQuestion(idx) {
  currentIndex = idx;
  $results.classList.remove('show');
  $quiz.classList.remove('hidden');
  renderQuestion();
  document.getElementById('qJumpInput').value = currentIndex + 1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== Event listeners =====
$examFilter.addEventListener('change', () => { examFilter = $examFilter.value; resetExam(); });
$langMode.addEventListener('change', () => { mode = $langMode.value; renderQuestion(); });

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ($results.classList.contains('show')) return;
  const q = questions[currentIndex];
  const qId = `${q.exam}-${q.id}`;
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    nextQuestion();
    return;
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevQuestion();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (answers[qId]) nextQuestion();
  }
  const num = parseInt(e.key);
  if (num >= 1 && num <= 6 && !answers[qId]) {
    const idx = num - 1;
    if (idx < q.options_en.length) selectOption(idx);
  }
});

// ===== THEME TOGGLE =====
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  if (html.getAttribute('data-theme') === 'light') {
    html.removeAttribute('data-theme');
    btn.textContent = '☀️ Light';
    localStorage.setItem('bev-theme', 'dark');
  } else {
    html.setAttribute('data-theme', 'light');
    btn.textContent = '🌙 Dark';
    localStorage.setItem('bev-theme', 'light');
  }
}

// ===== START =====
filterQuestions();
renderQuestion();
updateProgress();
// Apply saved theme
const saved = localStorage.getItem('bev-theme');
if (saved === 'light') toggleTheme();
</script>
</body>
</html>
