g data without additional infrastructure. Logs Insights supports SQL-like queries on fields such as query name, response code, source VPC, and source ENI. Athena is not a direct destination for Resolver query logs; data would need to flow to S3 first.", "question_zh": "一家公司为所有VPC启用了Route 53解析器查询日志。他们希望使用SQL查询DNS日志以调查过去90天内的可疑域，并尽量减少基础设施管理。\n\n他们应该使用哪种日志目的地和查询方法？", "options_zh": ["将解析器查询日志发送到Amazon Kinesis Data Firehose，该服务缓冲日志并按批次传送到按日期分区的S3存储桶，以便使用Amazon QuickSight仪表板进行可视化。", "将日志发送到CloudWatch Logs日志组，并使用CloudWatch Logs Insights对DNS查询数据（包括查询名称、响应代码和源IP）运行类似SQL的查询。", "将解析器查询日志发送到S3存储桶并创建Athena表，通过手动分区管理，使分析师能够对90天的历史DNS解析数据编写完整的SQL查询。", "将解析器查询日志发送到Amazon OpenSearch Service，并使用其Discover界面进行交互式临时探索DNS查询名称、响应类型和解析器端点活动。"], "explanation_zh": "Route 53解析器查询日志支持三种目的地：CloudWatch Logs、S3和Kinesis Data Firehose。CloudWatch Logs与Logs Insights提供了无服务器的内置查询能力，用于结构化日志数据，无需额外基础设施。Logs Insights支持对查询名称、响应代码、源VPC和源ENI等字段进行类似SQL的查询。Athena不是解析器查询日志的直接目的地；数据需要先流向S3。"}, {"exam": 4, "id": 9, "question_en": "A company runs containerized microservices on Amazon EKS. They want to detect Kubernetes-specific threats such as anonymous API server access, privilege escalation within pods, and unauthorized resource creation using a managed service.\n \nWhich feature should they enable?", "options_en": ["Enable GuardDuty EKS Audit Log Monitoring, which analyzes Kubernetes audit logs from EKS clusters to detect suspicious activities like anonymous API access, privilege escalation, and use of known malicious IPs.", "Deploy a Falco DaemonSet on all EKS worker nodes configured with custom security rules, forwarding runtime alerts to a CloudWatch Logs group for centralized analysis and notification.", "Enable CloudTrail data events for the EKS cluster to capture all Kubernetes API server calls in the trail, then create CloudWatch metric filters to surface suspicious request patterns.", "Use Amazon Inspector to continuously scan container images running on EKS worker nodes for OS and language package vulnerabilities, generating findings when CVE severity exceeds a threshold."], "correct": 0, "explanation_en": "GuardDuty EKS Audit Log Monitoring is specifically designed to analyze Kubernetes audit logs from EKS clusters. It detects Kubernetes-specific threats such as anonymous API access, access from malicious IPs, privilege escalation within pods, and suspicious RBAC usage. GuardDuty generates findings with Kubernetes context including pod name, namespace, and user agent. CloudTrail captures EKS management API calls (like `CreateCluster`) but not Kubernetes API server audit logs. Inspector scans container images for CVEs, not runtime behavior.", "question_zh": "一家公司在Amazon EKS上运行容器化微服务。他们希望使用托管服务检测Kubernetes特定的威胁，例如匿名API服务器访问、Pod内权限提升以及未经授权的资源创建。\n\n他们应该启用哪个功能？", "options_zh": ["启用GuardDuty EKS Audit Log Monitoring，该功能分析来自EKS集群的Kubernetes审计日志，以检测可疑活动，例如匿名API访问、权限提升以及使用已知恶意IP。", "在EKS工作节点上部署Falco DaemonSet，配置自定义安全规则，将运行时告警转发到CloudWatch Logs日志组以进行集中分析和通知。", "为EKS集群启用CloudTrail数据事件，捕获跟踪中的所有Kubernetes API服务器调用，然后创建CloudWatch指标筛选器来暴露可疑的请求模式。", "使用Amazon Inspector持续扫描在EKS工作节点上运行的容器镜像中的操作系统和语言包漏洞，在CVE严重级别超过阈值时生成发现项。"], "explanation_zh": "GuardDuty EKS Audit Log Monitoring专门设计用于分析来自EKS集群的Kubernetes审计日志。它可以检测Kubernetes特定的威胁，例如匿名API访问、来自恶意IP的访问、Pod内权限提升以及可疑的RBAC使用。GuardDuty生成包含Kubernetes上下文（包括Pod名称、命名空间和用户代理）的发现项。CloudTrail捕获EKS管理API调用（如CreateCluster），但不捕获Kubernetes API服务器审计日志。Inspector扫描容器镜像中的CVE，而非运行时行为。"}, {"exam": 4, "id": 10, "question_en": "A company uses a Transit Gateway to connect 50 VPCs across development, staging, and production environments. The security team suspects unauthorized east-west traffic flowing between development and production VPCs through the Transit Gateway.\n \nWhich feature provides direct visibility into traffic traversing the Transit Gateway?", "options_en": ["Enable VPC Flow Logs on every VPC attached to the Transit Gateway and correlate source and destination entries manually across all 50 VPC log groups to identify unauthorized east-west paths.", "Review Transit Gateway route table entries and route table associations to determine which VPC attachments have possible routing paths between development and production network segments.", "Enable Transit Gateway Flow Logs to capture traffic metadata (source/destination IPs, ports, protocol, bytes, action) for traffic flowing through Transit Gateway attachments.", "Deploy AWS Network Firewall between the Transit Gateway and each VPC to perform stateful inspection and generate detailed traffic logs for all inter-VPC communication flowing through the gateway."], "correct": 2, "explanation_en": "Transit Gateway Flow Logs provide direct visibility into network traffic flowing through Transit Gateway attachments, capturing metadata such as source and destination IP addresses, ports, protocol, bytes, and accept/reject actions. This allows the security team to identify unexpected traffic between VPCs without enabling and correlating flow logs across all 50 individual VPCs. Route table review shows potential paths but not actual traffic volumes or connections.", "question_zh": "一家公司使用Transit Gateway连接开发、预发布和生产环境中的50个VPC。安全团队怀疑有未经授权的东西流量通过Transit Gateway在开发和生产VPC之间流动。\n\n哪个功能可以提供对穿越Transit Gateway的流量的直接可见性？", "options_zh": ["在每个连接到Transit Gateway的VPC上启用VPC Flow Logs，并在所有50个VPC日志组中手动关联源和目标条目以识别未经授权的东西路径。", "审查Transit Gateway路由表条目和路由表关联，以确定哪些VPC连接在开发和生产的网络段之间具有可能的路由路径。", "启用Transit Gateway Flow Logs，捕获穿越Transit Gateway连接的流量元数据（源/目标IP、端口、协议、字节数、操作）。", "在Transit Gateway和每个VPC之间部署AWS Network Firewall，执行有状态检测并生成所有通过网关的VPC间通信的详细流量日志。"], "explanation_zh": "Transit Gateway Flow Logs提供对穿越Transit Gateway连接的网络流量的直接可见性，捕获元数据，例如源和目标IP地址、端口、协议、字节数以及接受/拒绝操作。这使安全团队能够识别VPC之间的意外流量，而无需在所有50个单独VPC中启用和关联Flow Logs。路由表审查显示潜在路径，但不显示实际流量或连接。"}, {"exam": 4, "id": 11, "question_en": "A media company has AWS Shield Advanced protecting their CloudFront distributions and ALBs. During a previous DDoS attack, the response was delayed because the team had to manually contact AWS Support.\n \nWhich Shield Advanced feature inverts this support model?", "options_en": ["Configure CloudWatch alarms on Shield Advanced DDoS detection metrics that automatically trigger an EventBridge rule to open a high-priority AWS Support case when volumetric attack thresholds are breached.", "Enable AWS WAF rate-based rules on all protected resources with aggressive thresholds that automatically block source IPs exceeding the request rate limit during detected DDoS flooding events.", "Deploy an additional CloudFront distribution with a custom origin failover configuration that routes traffic to a standby origin in a secondary Region when the primary origin becomes unreachable.", "Enable Shield Advanced proactive engagement, which allows the AWS Shield Response Team (SRT) to proactively contact your operations team and apply mitigations when Shield Advanced detects a DDoS event affecting your resources."], "correct": 3, "explanation_en": "Shield Advanced proactive engagement inverts the support model: instead of the customer contacting AWS, the Shield Response Team proactively contacts the customer's designated operations contacts when Shield Advanced metrics indicate a DDoS attack. The SRT can apply mitigations without waiting for the customer to initiate contact, significantly reducing response time. This requires pre-configuring health checks and contact information. It is exclusive to Shield Advanced.", "question_zh": "一家媒体公司为其CloudFront分发和ALB订阅了AWS Shield Advanced。在上一次DDoS攻击期间，由于团队必须手动联系AWS Support，响应出现了延迟。\n\n哪个Shield Advanced功能可以反转这种支持模式？", "options_zh": ["对Shield Advanced DDoS检测指标配置CloudWatch告警，在达到流量攻击阈值时自动触发EventBridge规则，打开高优先级AWS Support工单。", "在所有受保护资源上启用AWS WAF基于速率的规则，设置激进的阈值，在检测到DDoS洪水事件时自动阻止超过请求速率限制的源IP。", "部署一个额外的CloudFront分发，配置自定义源故障转移，在主源不可达时将流量路由到辅助区域的备用源。", "启用Shield Advanced主动参与，允许AWS Shield响应团队(SRT)在Shield Advanced检测到影响您资源的DDoS事件时主动联系您的运营团队并应用缓解措施。"], "explanation_zh": "Shield Advanced主动参与反转了支持模式：不是客户联系AWS，而是当Shield Advanced指标表明发生DDoS攻击时，Shield响应团队主动联系客户指定的运营联系人。SRT可以在不等待客户发起联系的情况下应用缓解措施，显著减少响应时间。这需要预先配置健康检查和联系信息。这是Shield Advanced独有的功能。"}, {"exam": 4, "id": 12, "question_en": "When GuardDuty detects a compromised EC2 instance, the security team wants to automatically capture forensic copies of the instance's EBS volumes and share them with a dedicated forensic account before any manual response begins.\n \nWhat is the BEST automated approach?", "options_en": ["Configure a CloudWatch alarm on the GuardDuty finding metric that sends an SNS notification to the security team, who then manually create EBS snapshots and share them with the forensic account.", "Create an EventBridge rule matching GuardDuty EC2 findings that triggers a Step Functions workflow to create EBS snapshots, share them with the forensic account, and tag them with incident metadata.", "Deploy an AWS Backup plan with a 15-minute backup frequency targeting all EC2 instances by tag, automatically copying each recovery point to a backup vault in the dedicated forensic account.", "Use a Lambda function triggered by GuardDuty EC2 findings to immediately terminate the compromised instance and create a full AMI image for later forensic analysis in the security account."], "correct": 1, "explanation_en": "An EventBridge rule matching GuardDuty finding types can trigger a Step Functions workflow that orchestrates the multi-step forensic process: identifying attached EBS volumes, creating snapshots, sharing them with the forensic account, and tagging them with incident details (finding ID, timestamp, instance ID). Step Functions provides retry logic, error handling, and an audit trail. This ensures evidence is preserved before manual response actions that might alter or destroy it. Terminating the instance destroys volatile memory evidence.", "question_zh": "当GuardDuty检测到受感染的EC2实例时，安全团队希望在任何人开始手动响应之前自动捕获实例EBS卷的取证副本，并将其共享给专用的取证账户。\n\n什么是最好的自动化方法？", "options_zh": ["对GuardDuty发现项指标配置CloudWatch告警，发送SNS通知给安全团队，然后由他们手动创建EBS快照并与取证账户共享。", "创建一个匹配GuardDuty EC2发现项的EventBridge规则，触发Step Functions工作流来创建EBS快照、与取证账户共享，并使用事件元数据标记它们。", "部署一个AWS Backup计划，每15分钟备份一次所有带标签的EC2实例，自动将每个恢复点复制到专用取证账户中的备份保管库。", "使用由GuardDuty EC2发现项触发的Lambda函数，立即终止受感染的实例并创建完整的AMI镜像，以便在安全账户中进行后续取证分析。"], "explanation_zh": "匹配GuardDuty发现类型的EventBridge规则可以触发Step Functions工作流，编排多步骤取证流程：识别附加的EBS卷、创建快照、与取证账户共享，并使用事件详情（发现ID、时间戳、实例ID）标记它们。Step Functions提供重试逻辑、错误处理和审计跟踪。这确保证据在可能更改或销毁它的手动响应操作之前被保存。终止实例会销毁易失性内存证据。"}, {"exam": 4, "id": 13, "question_en": "GuardDuty has generated multiple findings over two weeks involving the same IAM role: `UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS` and `Discovery:S3/MaliciousIPCaller`. The security team needs to understand the full scope of activity by this role, including new behaviors that deviate from the role's baseline.\n \nWhich tool provides the MOST efficient investigation?", "options_en": ["Use Amazon Detective to view the IAM role's entity profile, which automatically correlates all API activity, shows new behaviors compared to the role's historical baseline, and links related findings in a behavior graph.", "Query CloudTrail Lake for all API events associated with the IAM role ARN over the past two weeks, filtering by event source and error codes to manually reconstruct the activity timeline.", "Search CloudWatch Logs Insights across all application and service log groups using the IAM role ARN as a filter pattern, aggregating results by time to build a manual activity chronology.", "Aggregate all GuardDuty and Security Hub findings referencing the IAM role into a single custom insight, then manually review each finding's detail to correlate the scope of suspicious activity."], "correct": 0, "explanation_en": "Amazon Detective builds a behavior graph from CloudTrail, VPC Flow Logs, and GuardDuty findings. The entity profile for an IAM role shows all API activity, geolocation of API sources, new API calls that deviate from the role's baseline, and associated findings in a visual timeline. The baseline comparison is particularly valuable for identifying what is abnormal about the role's recent activity. Manual CloudTrail queries require construction and do not provide behavioral baselines.", "question_zh": "GuardDuty在过去两周内生成了多条涉及同一IAM角色的发现项：UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS和Discovery:S3/MaliciousIPCaller。安全团队需要了解该角色活动的完整范围，包括偏离角色基线的新行为。\n\n哪种工具提供最有效的调查？", "options_zh": ["使用Amazon Detective查看IAM角色的实体画像，该画像自动关联所有API活动，显示与角色历史基线相比的新行为，并在行为图中链接相关发现项。", "查询CloudTrail Lake中过去两周内与该IAM角色ARN关联的所有API事件，按事件源和错误代码筛选，以手动重建活动时间线。", "使用IAM角色ARN作为筛选模式，在所有应用程序和服务日志组中搜索CloudWatch Logs Insights，按时间汇总结果以构建手动活动年表。", "将所有引用该IAM角色的GuardDuty和Security Hub发现项聚合到一个自定义洞察中，然后手动审查每个发现项的详细信息以关联可疑活动的范围。"], "explanation_zh": "Amazon Detective从CloudTrail、VPC Flow Logs和GuardDuty发现项构建行为图。IAM角色的实体画像显示所有API活动、API来源的地理位置、偏离角色基线的新API调用以及相关联的发现项的可视化时间线。基线比较对于识别角色近期活动的异常特别有价值。手动CloudTrail查询需要自行构建，且不提供行为基线。"}, {"exam": 4, "id": 14, "question_en": "An EC2 instance has been flagged as compromised. The security team needs to capture its EBS volumes for offline forensic analysis in an isolated account. The instance must remain running to preserve volatile memory.\n \nWhat is the CORRECT procedure?", "options_en": ["Create an AMI of the running instance from the source account, share it with the forensic account, and launch a new instance from that AMI in an isolated forensic VPC for analysis.", "Stop the compromised instance to ensure disk consistency, detach all EBS volumes, and reattach them directly to an analysis instance running in the dedicated forensic account.", "Use AWS Backup to create a backup of the instance and its volumes, then perform a cross-account restore into the forensic account's isolated VPC for offline examination.", "Create EBS snapshots of all attached volumes while the instance is running, share the snapshots with the forensic account, and restore them as new volumes there for analysis."], "correct": 3, "explanation_en": "Creating EBS snapshots of attached volumes captures a point-in-time copy of the disk contents without stopping or modifying the running instance. Sharing those snapshots with the forensic account and restoring them as volumes allows analysis in a clean, isolated environment. This preserves the chain of custody and keeps the instance running to retain volatile memory. Stopping the instance or detaching volumes destroys volatile evidence and disrupts the running workload.", "question_zh": "一个EC2实例被标记为已受感染。安全团队需要捕获其EBS卷以在隔离账户中进行离线取证分析。实例必须保持运行以保留易失性内存。\n\n正确的程序是什么？", "options_zh": ["从源账户创建运行中实例的AMI，与取证账户共享，并在隔离的取证VPC中从该AMI启动新实例进行分析。", "停止受感染的实例以确保磁盘一致性，分离所有EBS卷，然后直接将它们重新挂载到在专用取证账户中运行的分析实例上。", "使用AWS Backup创建实例及其卷的备份，然后执行跨账户还原到取证账户的隔离VPC中进行离线检查。", "在实例运行期间创建所有附加EBS卷的快照，与取证账户共享快照，并在那里将它们还原为新卷进行分析。"], "explanation_zh": "创建附加EBS卷的快照可以捕获磁盘内容的即时副本，而无需停止或修改正在运行的实例。与取证账户共享这些快照并将其还原为卷，可以在干净、隔离的环境中进行取证分析。这保留了保管链并使实例保持运行以保留易失性内存。停止实例或分离卷会销毁易失性证据并中断运行的工作负载。"}, {"exam": 4, "id": 15, "question_en": "A company subscribes to AWS Shield Advanced for their Application Load Balancers. During a DDoS attack, automatic mitigations are not fully effective.\n \nWhat exclusive Shield Advanced support option can they engage?", "options_en": ["Open a standard AWS Support case with a detailed description of the attack vectors and request priority routing to the DDoS response queue for faster triage and manual mitigation assistance.", "Contact the AWS Shield Response Team (SRT), which can apply manual mitigations, create custom WAF rules, and assist with attack analysis around the clock.", "Enable AWS WAF Bot Control managed rule group on all protected resources to automatically detect and block automated bot traffic patterns that contribute to the volumetric DDoS attack.", "Deploy a secondary CloudFront distribution configured with an origin failover group that routes traffic to a standby ALB in another Region when the primary origin health check fails."], "correct": 1, "explanation_en": "Shield Advanced customers have exclusive access to the AWS Shield Response Team (SRT), a team of DDoS experts available 24/7. The SRT can apply manual mitigations, write and deploy custom WAF rules on behalf of the customer, and perform post-attack analysis. This capability is not available with Shield Standard or through standard AWS Support. The SRT has deep expertise in DDoS patterns and can craft targeted mitigations that automated systems may not catch.", "question_zh": "一家公司为其Application Load Balancer订阅了AWS Shield Advanced。在DDoS攻击期间，自动缓解措施效果不佳。\n\n他们可以使用哪个Shield Advanced独有的支持选项？", "options_zh": ["打开一个标准AWS Support工单，详细描述攻击向量，并请求优先路由到DDoS响应队列以加快分类和手动缓解协助。", "联系AWS Shield响应团队(SRT)，该团队可以应用手动缓解措施、创建自定义WAF规则，并全天候协助攻击分析。", "在所有受保护资源上启用AWS WAF Bot Control托管规则组，以自动检测并阻止导致流量型DDoS攻击的自动机器人流量模式。", "部署一个辅助CloudFront分发，配置源故障转移组，在主源健康检查失败时将流量路由到另一个区域的备用ALB。"], "explanation_zh": "Shield Advanced客户可以独家访问AWS Shield响应团队(SRT)，这是一个24/7全天候可用的DDoS专家团队。SRT可以应用手动缓解措施、代表客户编写和部署自定义WAF规则，并进行攻击后分析。此功能不适用于Shield Standard或通过标准AWS Support获得。SRT在DDoS攻击模式方面拥有深厚的专业知识，可以制定自动化系统可能无法捕捉的有针对性的缓解措施。"}, {"exam": 4, "id": 16, "question_en": "A multi-Region active-passive application has primary infrastructure in `us-east-1` and standby in `us-west-2`. During a regional failure, the team needs to redirect traffic even if the `us-east-1` control plane is degraded.\n \nWhich service provides reliable failover in this scenario?", "options_en": ["Use Amazon Route 53 Application Recovery Controller (ARC) routing controls hosted on a highly available cluster across five AZs, allowing operators to instantly redirect DNS to us-west-2 via a simple API call.", "Use Route 53 health checks with DNS failover routing policies that automatically switch traffic to us-west-2 endpoints when us-east-1 health checks fail, based on configurable thresholds.", "Use AWS Global Accelerator with endpoint groups in both Regions, leveraging automatic health-based routing that shifts traffic away from unhealthy endpoints within seconds of failure detection.", "Configure CloudFront with origin failover groups that automatically route requests to a secondary origin in us-west-2 when the primary us-east-1 origin returns 5xx errors or becomes unreachable."], "correct": 0, "explanation_en": "Route 53 Application Recovery Controller provides extremely reliable routing controls hosted on a cluster of five endpoints across five Regions. Even if the primary Region's control plane is completely degraded, routing controls can be toggled from any Region to redirect traffic. This is specifically designed for disaster recovery failover scenarios with safety rules that prevent unsafe configurations like turning off both Regions simultaneously.", "question_zh": "一个多区域主动-被动应用程序的主基础设施在us-east-1，备用在us-west-2。在区域故障期间，即使us-east-1的控制平面降级，团队也需要重定向流量。\n\n在这种情况下，哪个服务可以提供可靠的故障转移？", "options_zh": ["使用Amazon Route 53 Application Recovery Controller(ARC)路由控制，托管在跨五个可用区的高可用集群上，允许操作员通过简单的API调用立即将DNS重定向到us-west-2。", "使用Route 53健康检查和DNS故障转移路由策略，当us-east-1健康检查失败时，根据可配置的阈值自动将流量切换到us-west-2端点。", "使用AWS Global Accelerator，在两个区域设置端点组，利用基于健康的自动路由，在检测到故障后几秒钟内将流量从运行不正常的端点转移。", "配置CloudFront源故障转移组，当主us-east-1源返回5xx错误或不可达时，自动将请求路由到us-west-2的辅助源。"], "explanation_zh": "Route 53 Application Recovery Controller提供极其可靠的路由控制，托管在跨五个区域的五个端点集群上。即使主区域的控制平面完全降级，也可以从任何区域切换路由控制以重定向流量。这是专门为灾难恢复故障转移场景设计的，具有安全规则，可防止不安全的配置，例如同时关闭两个区域。"}, {"exam": 4, "id": 17, "question_en": "The operations team uses AWS Systems Manager OpsCenter for incident management. They want critical Security Hub findings to automatically create OpsItems in OpsCenter with minimal configuration.\n \nWhat is the SIMPLEST approach?", "options_en": ["Create a Lambda function that polls Security Hub findings every 5 minutes using the GetFindings API and creates corresponding OpsItems in Systems Manager OpsCenter via the CreateOpsItem API.", "Create an EventBridge rule matching Security Hub IMPORTED finding events that triggers a Step Functions state machine to format finding details and create OpsItems in OpsCenter programmatically.", "Enable the built-in Security Hub integration with OpsCenter in Systems Manager, which automatically creates OpsItems from Security Hub findings based on configurable severity filters.", "Configure Security Hub custom actions that allow analysts to manually select findings in the console and push them to OpsCenter through an EventBridge target for ad-hoc incident tracking."], "correct": 2, "explanation_en": "Systems Manager OpsCenter has a native integration with Security Hub. When enabled, OpsCenter automatically creates OpsItems from Security Hub findings based on configurable severity thresholds. This requires no custom code, Lambda functions, or EventBridge rules. The OpsItems include finding details and can be assigned, tracked, and managed through the standard OpsCenter workflow.", "question_zh": "运维团队使用AWS Systems Manager OpsCenter进行事件管理。他们希望关键Security Hub发现项能够以最少的配置自动在OpsCenter中创建OpsItems。\n\n最简单的方法是什么？", "options_zh": ["创建一个Lambda函数，每5分钟使用GetFindings API轮询Security Hub发现项，并通过CreateOpsItem API在Systems Manager OpsCenter中创建相应的OpsItems。", "创建一个匹配Security Hub IMPORTED发现事件的EventBridge规则，触发Step Functions状态机来格式化发现项详细信息并以编程方式在OpsCenter中创建OpsItems。", "在Systems Manager中启用Security Hub与OpsCenter的内置集成，该集成根据可配置的严重级别筛选器自动从Security Hub发现项创建OpsItems。", "配置Security Hub自定义操作，允许分析师在控制台中选择发现项，并通过EventBridge目标将它们手动推送到OpsCenter以进行临时事件跟踪。"], "explanation_zh": "Systems Manager OpsCenter与Security Hub具有原生集成。启用后，OpsCenter根据可配置的严重级别阈值自动从Security Hub发现项创建OpsItems。这不需要自定义代码、Lambda函数或EventBridge规则。OpsItems包含发现项详细信息，可以通过标准OpsCenter工作流进行分配、跟踪和管理。"}, {"exam": 4, "id": 18, "question_en": "A company needs to verify whether their application architecture meets a target RTO of 15 minutes and RPO of 1 minute. They want an automated assessment that identifies gaps without running active chaos experiments.\n \nWhich service should they use?", "options_en": ["Run AWS Fault Injection Service experiments that simulate AZ failures, instance terminations, and network disruptions, then measure actual recovery times against the defined RTO and RPO targets.", "Use the AWS Well-Architected Tool Reliability pillar review to assess the application architecture against resilience best practices and generate improvement recommendations for the team.", "Review AWS Backup Audit Manager reports to verify that backup frequency and cross-Region copy schedules align with the defined RPO, and that restore testing passes within the target RTO window.", "Use AWS Resilience Hub to define a resiliency policy with target RTO and RPO values, discover application resources, and run an assessment that identifies gaps between targets and actual recovery capability."], "correct": 3, "explanation_en": "AWS Resilience Hub allows you to define resiliency policies specifying target RTO and RPO values, automatically discover application resources and dependencies, and assess whether the architecture meets the defined targets. It provides a resilience score and actionable recommendations for improvement. This is an architecture assessment tool, not an active testing tool. Fault Injection Service runs actual experiments, which the scenario specifically wants to avoid.", "question_zh": "一家公司需要验证其应用程序架构是否满足15分钟的RTO和1分钟的RPO目标。他们希望进行自动化评估以识别差距，而无需运行主动混沌实验。\n\n他们应该使用哪个服务？", "options_zh": ["运行AWS Fault Injection Service实验，模拟可用区故障、实例终止和网络中断，然后根据定义的RTO和RPO目标测量实际恢复时间。", "使用AWS Well-Architected Tool的可靠性支柱审查来评估应用程序架构是否符合弹性最佳实践，并为团队生成改进建议。", "审查AWS Backup Audit Manager报告，验证备份频率和跨区域复制计划是否符合定义的RPO，以及恢复测试是否在目标RTO窗口内通过。", "使用AWS Resilience Hub定义具有目标RTO和RPO值的弹性策略，发现应用程序资源，并运行评估以识别目标与实际恢复能力之间的差距。"], "explanation_zh": "AWS Resilience Hub允许您定义弹性策略，指定目标RTO和RPO值，自动发现应用程序资源和依赖关系，并评估架构是否符合定义的目标。它提供弹性评分和可操作的改进建议。这是一个架构评估工具，而非主动测试工具。Fault Injection Service运行实际实验，而场景明确希望避免这样做。"}, {"exam": 4, "id": 19, "question_en": "When GuardDuty generates a finding of type `UnauthorizedAccess:EC2/MaliciousIPCaller.Custom`, the security team wants to automatically isolate the instance by replacing its security groups with a quarantine group that blocks all traffic.\n \nWhich automated approach preserves the original security group configuration for investigation?", "options_en": ["Configure OpsCenter to receive GuardDuty findings via EventBridge and automatically create OpsItems that link to predefined SSM Automation runbooks for each GuardDuty finding type severity level.", "Create an EventBridge rule matching GuardDuty findings that invokes a Step Functions workflow to evaluate finding severity, execute the appropriate SSM Automation document, and log results to CloudWatch.", "Deploy a Lambda function triggered by GuardDuty that evaluates finding attributes and returns remediation recommendations to the security team via SNS notifications for manual execution steps.", "Set up GuardDuty auto-archive rules that automatically suppress informational findings, combined with CloudWatch alarms that notify the team only when high-severity findings accumulate beyond a threshold."], "correct": 1, "explanation_en": "An EventBridge rule can match specific GuardDuty finding types and trigger a Lambda function that saves the current security group configuration as instance tags (preserving evidence for investigation) and then replaces them with a quarantine group with no inbound or outbound rules. This automated approach ensures rapid containment within seconds of detection. Saving the original groups as tags preserves the forensic record of the instance's network exposure at the time of compromise. GuardDuty does not have built-in auto-remediation for instance isolation.", "question_zh": "当GuardDuty生成类型为UnauthorizedAccess:EC2/MaliciousIPCaller.Custom的发现项时，安全团队希望通过将实例的安全组替换为阻止所有流量的隔离组来自动隔离实例。\n\n哪种自动化方法能够保留原始安全组配置以供调查？", "options_zh": ["配置OpsCenter通过EventBridge接收GuardDuty发现项，并自动创建链接到预定义SSM自动化运行手册的OpsItems，针对每种GuardDuty发现类型严重级别。", "创建一个匹配GuardDuty发现项的EventBridge规则，调用Step Functions工作流来评估发现项严重级别，执行相应的SSM自动化文档，并将结果记录到CloudWatch。", "部署一个由GuardDuty触发的Lambda函数，评估发现项属性，并通过SNS通知向安全团队返回修复建议以执行手动步骤。", "设置GuardDuty自动归档规则，自动抑制信息级别的发现项，结合CloudWatch告警，仅在高级别发现项超过阈值时通知团队。"], "explanation_zh": "EventBridge规则可以匹配特定的GuardDuty发现类型，并触发Lambda函数，该函数将当前安全组配置保存为实例标签（保留证据以供调查），然后将它们替换为没有入站或出站规则的隔离组。这种自动化方法确保在检测到后数秒内快速隔离。将原始组保存为标签保留了实例在感染时网络暴露的取证记录。GuardDuty没有内置的实例隔离自动修复功能。"}, {"exam": 4, "id": 20, "question_en": "An organization uses an S3 gateway VPC endpoint for private data access. They must prevent workloads from using that endpoint to reach buckets in other AWS accounts, while still allowing access to approved buckets in their own account.\n \nWhich endpoint policy design is BEST?", "options_en": ["Allow all S3 actions on all resources in the endpoint policy and rely on individual bucket policies in each team account to explicitly deny requests originating from unauthorized VPC endpoints.", "Allow S3 actions only when the request context condition `s3:ResourceAccount` equals the organization's AWS account ID(s), and scope resources to approved bucket ARNs.", "Deny S3 access at the subnet level using NACLs that filter traffic by destination IP prefix list, then permit bucket access through a broad wildcard in the VPC endpoint policy document.", "Allow S3 access only when the request includes object-level tags matching `DataClass=Internal`, enforced through the endpoint policy regardless of destination bucket ownership."], "correct": 1, "explanation_en": "Using an endpoint policy with `s3:ResourceAccount` limits gateway endpoint traffic to buckets owned by approved accounts, which blocks exfiltration to external buckets. Route-table IP filtering and object-tag checks do not reliably enforce bucket ownership boundaries. Combining account-based conditions with resource scoping is the most direct control.", "question_zh": "一个组织使用S3网关VPC端点进行私有数据访问。他们必须阻止工作负载使用该端点访问其他AWS账户中的存储桶，同时仍允许访问自己账户中已批准的存储桶。\n\n哪种端点策略设计是最好的？", "options_zh": ["在端点策略中允许对所有资源执行所有S3操作，并依赖每个团队账户中的单独存储桶策略来明确拒绝来自未授权VPC端点的请求。", "仅当请求上下文条件s3:ResourceAccount等于组织的AWS账户ID时允许S3操作，并将资源范围限定为已批准的存储桶ARN。", "使用NACL在子网级别拒绝S3访问，按目标IP前缀列表筛选流量，然后通过VPC端点策略文档中的广泛通配符允许存储桶访问。", "仅当请求包含与DataClass=Internal匹配的对象级别标签时允许S3访问，通过端点策略强制执行，无论目标存储桶所有权如何。"], "explanation_zh": "使用带有s3:ResourceAccount的端点策略将网关端点流量限制到已批准账户拥有的存储桶，从而阻止数据泄露到外部存储桶。路由表IP筛选和对象标签检查不能可靠地执行存储桶所有权边界。将基于账户的条件与资源范围限定结合使用是最直接的控制方式。"}, {"exam": 4, "id": 21, "question_en": "A public sign-in endpoint is under credential stuffing from rotating bot infrastructure. Per-IP rate limits are ineffective because each source sends low request volume.\n \nWhich AWS WAF capability should be prioritized?", "options_en": ["Create a rate-based WAF rule on the login URI path with a low threshold per source IP and a temporary block action, combined with an IP reputation list to pre-filter known bad addresses.", "Deploy an IP reputation managed rule group combined with geographic match rules that block all authentication traffic from countries where the company has no legitimate user base.", "AWS WAF Fraud Control Account Takeover Prevention (ATP) managed protection configured for the login flow, with challenge and signal-based detection.", "Create a custom WAF rule that inspects the User-Agent header and blocks requests lacking standard browser identifiers, combined with a string match rule filtering common automation toolkits."], "correct": 2, "explanation_en": "ATP is designed for credential stuffing and account takeover patterns that evade simple per-IP thresholds. It evaluates request and session signals for authentication flows and can apply challenge or block actions. Basic rate limits or static IP filters are often bypassed by distributed botnets.", "question_zh": "一个公共登录端点受到来自轮换机器人基础设施的凭证填充攻击。基于每个IP的速率限制无效，因为每个来源发送的请求量很低。\n\n应优先使用哪个AWS WAF功能？", "options_zh": ["在登录URI路径上创建基于速率的WAF规则，对每个源IP设置低阈值和临时阻止操作，并结合IP信誉列表预筛选已知的不良地址。", "部署IP信誉托管规则组，结合地理位置匹配规则，阻止来自公司没有合法用户基础的国家的所有身份验证流量。", "为登录流程配置AWS WAF Fraud Control Account Takeover Prevention(ATP)托管保护，使用质询和基于信号的检测。", "创建自定义WAF规则，检查User-Agent标头并阻止缺少标准浏览器标识符的请求，结合字符串匹配规则筛选常见自动化工具包。"], "explanation_zh": "ATP专为凭证填充和账户接管模式而设计，这些模式可以规避简单的基于IP的阈值。它评估身份验证流程的请求和会话信号，并可以应用质询或阻止操作。基本的速率限制或静态IP筛选通常会被分布式僵尸网络绕过。"}, {"exam": 4, "id": 22, "question_en": "An organization requires deep packet inspection of all outbound HTTPS traffic to detect malware command-and-control (C2) communication. The solution must be able to inspect the contents of TLS-encrypted connections.\n \nWhich approach should they use?", "options_en": ["Use VPC Flow Logs with a machine learning anomaly detection solution on CloudWatch to identify unusual outbound traffic patterns that might indicate C2 communication channels to external hosts.", "Configure AWS Network Firewall with TLS inspection enabled, using a CA certificate from ACM Private CA to decrypt, inspect, and re-encrypt outbound HTTPS traffic against Suricata-compatible stateful rules.", "Deploy a NAT Gateway with VPC Traffic Mirroring configured to send a copy of outbound traffic to an EC2-hosted third-party IDS appliance that performs deep packet inspection and signature matching.", "Configure security group outbound rules with explicit allow lists for approved destination IP ranges combined with DNS Firewall rules blocking resolution of known malicious command-and-control domains."], "correct": 1, "explanation_en": "AWS Network Firewall supports TLS inspection using a CA certificate from ACM Private CA. The firewall performs man-in-the-middle decryption of outbound HTTPS connections, inspects the plaintext HTTP content against Suricata IDS/IPS rules for malware C2 patterns, and re-encrypts the traffic before forwarding. This provides visibility into encrypted traffic that VPC Flow Logs (metadata only) and security groups (L3/L4 only) cannot achieve.", "question_zh": "一个组织需要对所有出站HTTPS流量进行深度包检测，以检测恶意软件命令与控制(C2)通信。该解决方案必须能够检查TLS加密连接的内容。\n\n他们应该使用哪种方法？", "options_zh": ["使用VPC Flow Logs，结合CloudWatch上的机器学习异常检测解决方案，识别可能表明与外部主机建立C2通信通道的异常出站流量模式。", "配置AWS Network Firewall并启用TLS检测，使用来自ACM Private CA的CA证书解密、检查和重新加密出站HTTPS流量，对照兼容Suricata的有状态规则进行检测。", "部署NAT网关并配置VPC Traffic Mirroring，将出站流量的副本发送到EC2托管的第三方IDS设备，执行深度包检测和签名匹配。", "配置安全组出站规则，使用明确的允许列表限制已批准的目标IP范围，结合DNS Firewall规则阻止解析已知恶意C2域。"], "explanation_zh": "AWS Network Firewall支持使用来自ACM Private CA的CA证书进行TLS检测。防火墙对出站HTTPS连接执行中间人解密，根据Suricata IDS/IPS规则检查明文HTTP内容以检测恶意软件C2模式，然后重新加密流量再转发。这提供了对加密流量的可见性，而VPC Flow Logs（仅元数据）和安全组（仅L3/L4）无法实现。"}, {"exam": 4, "id": 23, "question_en": "Development teams deploy Lambda functions with third-party Python and Node.js packages. The security team wants continuous vulnerability scanning of these functions and their dependencies without modifying the CI/CD pipeline.\n \nWhich service provides this with minimal operational overhead?", "options_en": ["Deploy Amazon CodeGuru Reviewer to perform automated code reviews on Lambda function source code, identifying security vulnerabilities and suggesting remediation for each deployment package.", "Create a CodePipeline stage that runs `pip audit` and `npm audit` commands against Lambda deployment packages before deployment, failing the pipeline on high-severity findings.", "Enable Amazon Inspector Lambda standard scanning, which automatically discovers Lambda functions and continuously scans their application dependency packages for known CVEs.", "Configure AWS Config custom rules that check Lambda function runtime versions against an approved list and flag functions running outdated or end-of-life runtimes for remediation."], "correct": 2, "explanation_en": "Amazon Inspector Lambda standard scanning automatically discovers Lambda functions in your account and continuously scans their application dependency packages for known CVEs. When new CVEs are published, Inspector re-evaluates all scanned functions and generates findings. This is a fully managed, zero-configuration solution that works without CI/CD pipeline changes. CodePipeline-based scanning only catches vulnerabilities at deployment time, missing CVEs discovered after deployment.", "question_zh": "开发团队部署包含第三方Python和Node.js包的Lambda函数。安全团队希望对函数及其依赖项进行持续漏洞扫描，而无需修改CI/CD管道。\n\n哪个服务可以以最小的运营开销提供此功能？", "options_zh": ["部署Amazon CodeGuru Reviewer对Lambda函数源代码执行自动代码审查，为每个部署包识别安全漏洞并建议修复。", "在CodePipeline中创建一个阶段，在部署前运行pip audit和npm audit命令检查Lambda部署包，在高严重级别发现项上使管道失败。", "启用Amazon Inspector Lambda标准扫描，自动发现Lambda函数并持续扫描其应用程序依赖包中的已知CVE。", "配置AWS Config自定义规则，将Lambda函数运行时版本与批准列表进行比对，并标记运行过时或终止生命周期运行时的函数以进行修复。"], "explanation_zh": "Amazon Inspector Lambda标准扫描自动发现您账户中的Lambda函数，并持续扫描其应用程序依赖包中的已知CVE。当有新的CVE发布时，Inspector重新评估所有已扫描的函数并生成发现项。这是一个完全托管、零配置的解决方案，无需更改CI/CD管道。基于CodePipeline的扫描仅在部署时捕获漏洞，会遗漏部署后发现的CVE。"}, {"exam": 4, "id": 24, "question_en": "A security audit found that EC2 instances use Instance Metadata Service Version 1 (IMDSv1), which is vulnerable to SSRF attacks that can steal IAM role credentials from the metadata endpoint.\n \nHow should they mitigate this?", "options_en": ["Disable the instance metadata service entirely on all instances by configuring a host-based NACL rule blocking all traffic to the link-local metadata endpoint at 169.254.169.254.", "Configure a host-based firewall rule (iptables) on each instance that blocks non-root processes from accessing the metadata endpoint, preventing unprivileged application code from reaching credentials.", "Attach an IAM policy to the instance role that includes a Deny statement for the `ec2:DescribeInstances` action, restricting application access to the instance metadata service.", "Enforce IMDSv2 by setting `HttpTokens` to `required`, which mandates a session token obtained via a PUT request before any metadata retrieval, mitigating SSRF credential theft."], "correct": 3, "explanation_en": "IMDSv2 requires a session token obtained via an HTTP PUT request before any metadata can be accessed. SSRF attacks that exploit web application vulnerabilities to make GET requests to the metadata endpoint fail because they cannot obtain the required token (PUT requests to 169.254.169.254 are not typically proxied by web application vulnerabilities). Setting `HttpTokens` to `required` disables IMDSv1 and forces the token-based IMDSv2 protocol. IAM policies do not control metadata service access.", "question_zh": "安全审计发现EC2实例使用实例元数据服务版本1(IMDSv1)，该版本容易受到SSRF攻击，可能从元数据端点窃取IAM角色凭证。\n\n他们应该如何缓解此问题？", "options_zh": ["通过配置基于主机的NACL规则阻止所有访问链路本地元数据端点169.254.169.254的流量，完全禁用所有实例上的实例元数据服务。", "在每个实例上配置基于主机的防火墙规则(iptables)，阻止非root进程访问元数据端点，防止非特权应用程序代码获取凭证。", "将包含ec2:DescribeInstances操作的Deny语句的IAM策略附加到实例角色，限制应用程序对实例元数据服务的访问。", "通过将HttpTokens设置为required来强制执行IMDSv2，要求在获取任何元数据之前通过PUT请求获取会话令牌，从而缓解SSRF凭证窃取。"], "explanation_zh": "IMDSv2要求在访问任何元数据之前通过HTTP PUT请求获取会话令牌。利用Web应用程序漏洞对元数据端点进行GET请求的SSRF攻击会失败，因为它们无法获取所需的令牌（Web应用程序漏洞通常不会代理对169.254.169.254的PUT请求）。将HttpTokens设置为required会禁用IMDSv1并强制使用基于令牌的IMDSv2协议。IAM策略不能控制元数据服务访问。"}, {"exam": 4, "id": 25, "question_en": "A company uses SSH bastion hosts in public subnets to access EC2 instances in private subnets. The security team wants to eliminate bastion hosts, remove inbound SSH rules from security groups, and log all interactive sessions.\n \nWhat should they implement?", "options_en": ["Deploy EC2 Instance Connect Endpoint in each private subnet, which pushes temporary SSH keys to target instances and provides browser-based shell access with session logs sent to CloudTrail.", "Replace the bastion hosts with an AWS Client VPN endpoint connected to the private subnets, requiring each administrator to install the VPN client and authenticate before SSH access is granted.", "Use AWS Systems Manager Session Manager with the SSM Agent on each instance, configuring VPC endpoints for private connectivity and enabling session logging to S3 and CloudWatch Logs.", "Set up an AWS Direct Connect private virtual interface from the corporate network to the VPC, allowing administrators to SSH directly to private instances over the dedicated connection."], "correct": 2, "explanation_en": "Systems Manager Session Manager provides interactive shell access without bastion hosts, SSH keys, or inbound security group rules. For private instances, VPC endpoints for the SSM service keep traffic within the VPC. All session activity (commands typed, output received) is logged to S3 and CloudWatch Logs. This eliminates the bastion host attack surface entirely. EC2 Instance Connect Endpoint provides connectivity but does not natively log full session content. VPN and Direct Connect still require SSH and open inbound ports.", "question_zh": "一家公司使用公有子网中的SSH堡垒主机访问私有子网中的EC2实例。安全团队希望消除堡垒主机、从安全组中移除入站SSH规则，并记录所有交互式会话。\n\n他们应该实施什么方案？", "options_zh": ["在每个私有子网中部署EC2 Instance Connect Endpoint，将临时SSH密钥推送到目标实例，并通过CloudTrail提供带会话日志的基于浏览器的Shell访问。", "用连接到私有子网的AWS Client VPN端点替换堡垒主机，要求每个管理员安装VPN客户端并在授予SSH访问权限之前进行身份验证。", "在每个实例上使用AWS Systems Manager Session Manager和SSM Agent，配置VPC端点以实现私有连接，并启用到S3和CloudWatch Logs的会话日志记录。", "从企业网络到VPC设置AWS Direct Connect私有虚拟接口，允许管理员通过专用连接直接SSH到私有实例。"], "explanation_zh": "Systems Manager Session Manager提供交互式Shell访问，无需堡垒主机、SSH密钥或入站安全组规则。对于私有实例，SSM服务的VPC端点将流量保持在VPC内。所有会话活动（键入的命令、收到的输出）都记录到S3和CloudWatch Logs。这完全消除了堡垒主机的攻击面。EC2 Instance Connect Endpoint提供连接性，但不会原生记录完整的会话内容。VPN和Direct Connect仍然需要SSH并开放入站端口。"}, {"exam": 4, "id": 26, "question_en": "A company wants to provide access to an internal web application for remote employees without a VPN. The access policy should consider device security posture (updated antivirus, disk encryption) and user identity from their corporate IdP.\n \nWhich service meets this requirement?", "options_en": ["Deploy an Application Load Balancer with OIDC authentication configured on the listener rules, redirecting unauthenticated users to the corporate IdP for login before granting access to the application.", "Configure AWS Client VPN with SAML-based federation to the corporate IdP, requiring remote employees to install the VPN client and establish a TLS tunnel before accessing the internal application.", "Use AWS Verified Access, which integrates with OIDC-compatible identity providers and device trust providers to evaluate both user identity and device security posture before granting application access.", "Set up an EC2 Instance Connect Endpoint in the application VPC, allowing remote employees to establish browser-based SSH tunnels to reach the internal web application through port forwarding."], "correct": 2, "explanation_en": "AWS Verified Access provides zero-trust network access to corporate applications without a VPN. It integrates with identity providers (OIDC-compatible IdPs) and device trust providers (CrowdStrike, Jamf) to make access decisions based on both user identity and device security posture. Access policies are written in Cedar and can require conditions like a valid corporate identity AND a compliant device. ALB OIDC authentication handles user identity but cannot evaluate device posture. Client VPN requires a VPN client, which the scenario wants to avoid.", "question_zh": "一家公司希望为远程员工提供对内部Web应用程序的访问，无需VPN。访问策略应考虑设备安全状态（更新的杀毒软件、磁盘加密）和来自企业IdP的用户身份。\n\n哪个服务满足此要求？", "options_zh": ["部署Application Load Balancer，在监听器规则上配置OIDC身份验证，将未经身份验证的用户重定向到企业IdP进行登录后再授予应用程序访问权限。", "配置AWS Client VPN，与企业IdP进行基于SAML的联邦，要求远程员工安装VPN客户端并建立TLS隧道后才能访问内部应用程序。", "使用AWS Verified Access，它与兼容OIDC的身份提供商和设备信任提供商集成，在授予应用程序访问权限之前评估用户身份和设备安全状态。", "在应用程序VPC中设置EC2 Instance Connect Endpoint，允许远程员工通过端口转发建立基于浏览器的SSH隧道以访问内部Web应用程序。"], "explanation_zh": "AWS Verified Access提供对企业应用程序的零信任网络访问，无需VPN。它与身份提供商（兼容OIDC的IdP）和设备信任提供商（CrowdStrike、Jamf）集成，根据用户身份和设备安全状态做出访问决策。访问策略用Cedar编写，可以要求同时满足有效企业身份和合规设备等条件。ALB OIDC身份验证处理用户身份但不能评估设备状态。Client VPN需要VPN客户端，而场景希望避免使用。"}, {"exam": 4, "id": 27, "question_en": "A financial institution requires Layer 2 encryption on their dedicated AWS Direct Connect connection to satisfy data-in-transit regulations. Application-level TLS is already in place but does not fulfill the Layer 2 requirement.\n \nWhich solution provides this?", "options_en": ["Create a Site-to-Site VPN connection over the Direct Connect public virtual interface, using IPsec tunnels to encrypt all traffic at the network layer between the on-premises router and the VPC.", "Enable MACsec (IEEE 802.1AE) on the dedicated Direct Connect connection, which encrypts all Ethernet frames at wire speed between the customer router and the AWS Direct Connect device.", "Configure a private virtual interface with BGP MD5 authentication on the Direct Connect connection, which encrypts the routing session and all data packets exchanged over the link.", "Deploy a transit virtual interface with an AWS-managed IPsec VPN overlay that automatically encrypts all traffic traversing the Direct Connect connection at the transport layer."], "correct": 1, "explanation_en": "MACsec provides IEEE 802.1AE standard Layer 2 encryption on dedicated Direct Connect connections, encrypting all Ethernet frames at wire speed between the customer router and the AWS device. This satisfies Layer 2 encryption requirements that IPsec (Layer 3) and TLS (application layer) cannot meet. MACsec is available on 10 Gbps and 100 Gbps dedicated connections at supported Direct Connect locations. IPsec VPN operates at Layer 3, not Layer 2. BGP MD5 authenticates routing sessions but does not encrypt data traffic.", "question_zh": "一家金融机构需要在其专用AWS Direct Connect连接上实施第2层加密，以满足数据传输中的法规要求。应用程序级别的TLS已经就位，但不满足第2层要求。\n\n哪个解决方案提供此功能？", "options_zh": ["通过Direct Connect公有虚拟接口创建Site-to-Site VPN连接，使用IPsec隧道在网络层加密本地路由器与VPC之间的所有流量。", "在专用Direct Connect连接上启用MACsec(IEEE 802.1AE)，在客户路由器和AWS Direct Connect设备之间以线速加密所有以太网帧。", "在Direct Connect连接上配置带BGP MD5身份验证的私有虚拟接口，加密路由会话和通过链路交换的所有数据包。", "部署具有AWS托管IPsec VPN覆盖的传输虚拟接口，自动在传输层加密通过Direct Connect连接传输的所有流量。"], "explanation_zh": "MACsec在专用Direct Connect连接上提供IEEE 802.1AE标准第2层加密，在客户路由器和AWS设备之间以线速加密所有以太网帧。这满足了IPsec（第3层）和TLS（应用层）无法满足的第2层加密要求。MACsec在支持的Direct Connect站点上的10 Gbps和100 Gbps专用连接上可用。IPsec VPN工作在第3层而非第2层。BGP MD5认证路由会话但不加密数据流量。"}, {"exam": 4, "id": 28, "question_en": "A company serves static content from an SSE-KMS encrypted S3 bucket through CloudFront. They configured an Origin Access Identity (OAI) but CloudFront returns 403 errors when serving the encrypted objects.\n \nWhat is the RECOMMENDED fix?", "options_en": ["Add a `kms:Decrypt` permission to the OAI role in the KMS key policy so that CloudFront can decrypt SSE-KMS objects when forwarding them to viewers through the distribution.", "Switch from SSE-KMS to SSE-S3 encryption on the S3 bucket so that CloudFront OAI can read the objects without needing explicit KMS key permissions in the key policy.", "Replace the Origin Access Identity with an Origin Access Control (OAC), update the bucket policy to grant the CloudFront service principal access, and add `kms:Decrypt` for CloudFront in the KMS key policy.", "Create a Lambda@Edge function on the origin-request event that assumes an IAM role with KMS decrypt permissions, retrieves the object from S3, decrypts it, and returns the plaintext content to CloudFront."], "correct": 2, "explanation_en": "Origin Access Identity (OAI) does not support SSE-KMS encrypted S3 objects. Origin Access Control (OAC) is the recommended replacement that uses SigV4 request signing and supports all S3 features including SSE-KMS. With OAC, the bucket policy grants access to the CloudFront service principal via `aws:SourceArn`, and the KMS key policy must grant decrypt permissions to the CloudFront service principal. OAI is a legacy feature that lacks SSE-KMS support, so adding KMS permissions to OAI does not resolve the issue. Switching to SSE-S3 works around the problem but is not the recommended approach.", "question_zh": "一家公司通过CloudFront从SSE-KMS加密的S3存储桶提供静态内容。他们配置了Origin Access Identity(OAI)，但CloudFront在提供加密对象时返回403错误。\n\n推荐的修复方法是什么？", "options_zh": ["在KMS密钥策略中为OAI角色添加kms:Decrypt权限，以便CloudFront在通过分发将SSE-KMS对象转发给查看者时可以解密它们。", "从SSE-KMS切换到SSE-S3加密S3存储桶，以便CloudFront OAI可以读取对象而无需在密钥策略中明确的KMS密钥权限。", "将Origin Access Identity替换为Origin Access Control(OAC)，更新存储桶策略以授予CloudFront服务主体访问权限，并在KMS密钥策略中为CloudFront添加kms:Decrypt。", "在源请求事件上创建Lambda@Edge函数，该函数承担具有KMS解密权限的IAM角色，从S3检索对象，解密它，并将明文内容返回给CloudFront。"], "explanation_zh": "Origin Access Identity(OAI)不支持SSE-KMS加密的S3对象。Origin Access Control(OAC)是推荐的替代方案，使用SigV4请求签名并支持包括SSE-KMS在内的所有S3功能。使用OAC时，存储桶策略通过aws:SourceArn授予CloudFront服务主体访问权限，并且KMS密钥策略必须授予CloudFront服务主体解密权限。OAI是不支持SSE-KMS的旧版功能，因此向OAI添加KMS权限并不能解决问题。切换到SSE-S3可以绕过问题，但不是推荐的方法。"}, {"exam": 4, "id": 29, "question_en": "A security engineer needs to verify that no resources in any VPC across the organization have unintended internet access paths. They want an automated assessment that identifies all possible network paths from internet gateways to resources in private subnets.\n \nWhich tool should they use?", "options_en": ["Use VPC Network Access Analyzer to define a network access scope with internet gateways as sources and private subnets as destinations, then run an analysis to identify all matching network paths across security groups, NACLs, and route tables.", "Use VPC Reachability Analyzer to test connectivity between the internet gateway and each resource individually, evaluating each hop in the path to determine which security group, NACL, or route table entry allows or blocks the traffic.", "Enable the AWS Config managed rule `vpc-sg-open-only-to-authorized-ports` across all accounts to continuously evaluate every security group and flag inbound rules that allow unrestricted access from 0.0.0.0/0 on non-approved ports.", "Review security group inbound rules, NACL entries, and route table configurations manually in each VPC through the console, cross-referencing internet gateway and NAT gateway attachments to trace unintended public access paths."], "correct": 0, "explanation_en": "VPC Network Access Analyzer allows you to define network access scopes specifying trusted and untrusted network paths. By creating a scope with internet gateways as sources and private subnets as destinations, the analysis evaluates security groups, NACLs, route tables, and other network configurations holistically to identify all paths that would allow internet traffic to reach private resources. VPC Reachability Analyzer tests individual source-destination pairs and is not suited for broad, organization-wide assessments.", "question_zh": "一名安全工程师需要验证组织中任何VPC中的任何资源都没有意外的互联网访问路径。他们希望进行自动化评估，识别从互联网网关到私有子网中资源的所有可能网络路径。\n\n他们应该使用哪个工具？", "options_zh": ["使用VPC Network Access Analyzer定义以互联网网关为源、私有子网为目标的网络访问范围，然后运行分析以识别所有匹配的网络路径，涵盖安全组、NACL和路由表。", "使用VPC Reachability Analyzer单独测试互联网网关与每个资源之间的连接性，评估路径中的每一跳以确定哪个安全组、NACL或路由表条目允许或阻止流量。", "在所有账户中启用AWS Config托管规则vpc-sg-open-only-to-authorized-ports，持续评估每个安全组，并标记在未经批准的端口上允许来自0.0.0.0/0的未受限访问的入站规则。", "通过控制台手动审查每个VPC中的安全组入站规则、NACL条目和路由表配置，交叉引用互联网网关和NAT网关的连接以追踪意外公有访问路径。"], "explanation_zh": "VPC Network Access Analyzer允许您定义网络访问范围，指定可信和不可信的网络路径。通过创建以互联网网关为源、私有子网为目标的访问范围，分析会全面评估安全组、NACL、路由表和其他网络配置，以识别允许互联网流量到达私有资源的所有路径。VPC Reachability Analyzer测试单个源-目标对，不适合广泛的、组织范围的评估。"}, {"exam": 4, "id": 30, "question_en": "A company runs a latency-sensitive TCP application on EC2 instances in three Regions. They need global anycast IP addresses with built-in DDoS protection at the network edge.\n \nWhich service provides this?", "options_en": ["Deploy the application behind CloudFront distributions in each Region with custom origin failover groups that automatically switch to a healthy origin when the primary returns consecutive 5xx errors.", "Use Route 53 latency-based routing with health checks attached to each regional endpoint, automatically directing users to the lowest-latency healthy Region based on DNS resolution geography.", "Deploy AWS Global Accelerator with endpoint groups in each Region, providing static anycast IPs automatically protected by Shield Standard with the option to add Shield Advanced for enhanced DDoS mitigation.", "Create a Network Load Balancer in each Region and configure Route 53 weighted routing policies to distribute traffic across Regions, with manual weight adjustment during regional failure events."], "correct": 2, "explanation_en": "AWS Global Accelerator provides two static anycast IP addresses that route traffic to optimal endpoints across Regions based on health, proximity, and routing policies. It operates at the TCP/UDP layer, making it suitable for non-HTTP applications. Global Accelerator resources are automatically protected by Shield Standard, with Shield Advanced available for enhanced DDoS protection and SRT access. Route 53 latency routing does not provide anycast IPs or edge-level DDoS mitigation.", "question_zh": "一家公司在三个区域中的EC2实例上运行延迟敏感的TCP应用程序。他们需要具有内置DDoS防护的全球任播IP地址。\n\n哪个服务提供此功能？", "options_zh": ["在每个区域将应用程序部署在CloudFront分发后面，使用自定义源故障转移组，在主源连续返回5xx错误时自动切换到健康的源。", "使用Route 53基于延迟的路由，在每个区域端点附加健康检查，根据DNS解析地理位置自动将用户引导到延迟最低的健康区域。", "部署AWS Global Accelerator，在每个区域设置端点组，提供自动受到Shield Standard保护的静态任播IP，并可选择添加Shield Advanced以增强DDoS缓解。", "在每个区域创建一个Network Load Balancer，配置Route 53加权路由策略以跨区域分配流量，在区域故障事件期间手动调整权重。"], "explanation_zh": "AWS Global Accelerator提供两个静态任播IP地址，根据健康状况、距离和路由策略将流量路由到跨区域的最佳端点。它运行在TCP/UDP层，适用于非HTTP应用程序。Global Accelerator资源自动受到Shield Standard保护，Shield Advanced可用于增强DDoS保护和SRT访问。Route 53延迟路由不提供任播IP或边缘级DDoS缓解。"}, {"exam": 4, "id": 31, "question_en": "A security team wants to deploy a network-based Intrusion Detection System (IDS) that analyzes full packet captures from specific EC2 instances without affecting production traffic performance.\n \nWhich feature should they use?", "options_en": ["Enable VPC Flow Logs with maximum field granularity on the target instance ENIs and feed them to a SIEM for analysis, providing network connection metadata but not packet payload content.", "Configure VPC Traffic Mirroring to copy network traffic from the ENIs of target instances to the IDS appliance, providing full packet capture including headers and payloads.", "Deploy a transparent inline proxy between the target instances and the internet gateway that duplicates all traffic to the IDS appliance, inspecting both inbound and outbound packet payloads.", "Use AWS Network Firewall in alert-only mode with Suricata rules matching known attack signatures, generating CloudWatch alerts for traffic patterns without performing full packet capture analysis."], "correct": 1, "explanation_en": "VPC Traffic Mirroring creates a copy of network traffic from source ENIs and sends it to a target (IDS appliance ENI or NLB fronting an IDS fleet). The mirrored traffic includes full packet content (headers and payloads), enabling deep packet inspection by the IDS. Mirroring does not affect the performance of source instances. VPC Flow Logs only capture metadata (IPs, ports, bytes, action) without packet payloads, which is insufficient for IDS analysis.", "question_zh": "一个安全团队希望部署基于网络的入侵检测系统(IDS)，分析来自特定EC2实例的完整数据包捕获，而不影响生产流量性能。\n\n他们应该使用哪个功能？", "options_zh": ["在目标实例ENI上启用具有最大字段粒度的VPC Flow Logs，并将其提供给SIEM进行分析，提供网络连接元数据但不提供数据包有效载荷内容。", "配置VPC Traffic Mirroring将来自目标实例ENI的网络流量复制到IDS设备，提供包括标头和有效载荷在内的完整数据包捕获。", "在目标实例和互联网网关之间部署透明内联代理，将所有流量复制到IDS设备，检查入站和出站数据包有效载荷。", "使用AWS Network Firewall的仅告警模式，使用匹配已知攻击签名的Suricata规则，为流量模式生成CloudWatch告警，而不进行完整数据包捕获分析。"], "explanation_zh": "VPC Traffic Mirroring创建来自源ENI的网络流量副本，并将其发送到目标（IDS设备ENI或前置IDS集群的NLB）。镜像流量包括完整的数据包内容（标头和有效载荷），使IDS能够进行深度包检测。镜像不影响源实例的性能。VPC Flow Logs仅捕获元数据（IP、端口、字节、操作），不包含数据包有效载荷，这对于IDS分析是不够的。"}, {"exam": 4, "id": 32, "question_en": "A central S3 bucket should be accessible by principals in one specific OU, including future accounts added to that OU, but not by accounts in sibling OUs.\n \nWhich global condition key best supports this policy?", "options_en": ["Use the `aws:PrincipalOrgID` condition key, which matches all principals in the specified organization but cannot distinguish between individual OUs or restrict access to a specific OU path.", "Use the `aws:SourceAccount` condition key to list each account ID in the target OU, updating the bucket policy manually whenever new accounts are added to or removed from the OU.", "Use `aws:PrincipalOrgPaths`, because it lets the bucket policy match principals by organization hierarchy path.", "Use the `aws:RequestedRegion` condition key to restrict access by Region, relying on the assumption that accounts in different OUs operate exclusively in different AWS Regions."], "correct": 2, "explanation_en": "`aws:PrincipalOrgPaths` supports policy decisions based on the caller's organization path, which enables OU-specific access controls. `aws:PrincipalOrgID` is organization-wide and cannot isolate a single OU by itself. The other keys do not express organization hierarchy membership.", "question_zh": "一个中心S3存储桶应可供一个特定OU中的主体访问，包括将来添加到该OU的账户，但不能被同级OU中的账户访问。\n\n哪个全局条件键对此策略支持最好？", "options_zh": ["使用aws:PrincipalOrgID条件键，它匹配指定组织中的所有主体，但不能区分单个OU或限制对特定OU路径的访问。", "使用aws:SourceAccount条件键列出目标OU中的每个账户ID，在新账户添加或移除时手动更新存储桶策略。", "使用aws:PrincipalOrgPaths，因为它允许存储桶策略按组织层次路径匹配主体。", "使用aws:RequestedRegion条件键按区域限制访问，依赖不同OU中的账户仅在不同AWS区域中运行的假设。"], "explanation_zh": "aws:PrincipalOrgPaths支持基于调用者组织路径的策略决策，从而实现OU特定的访问控制。aws:PrincipalOrgID是组织范围的，不能单独隔离单个OU。其他键不能表达组织层次结构成员资格。"}, {"exam": 4, "id": 33, "question_en": "A company wants to manage AWS Config rules and aggregators across all member accounts from a central security account without using the management account for day-to-day operations.\n \nHow should they set this up?", "options_en": ["Enable trusted access for AWS Config in AWS Organizations and designate the security account as the delegated administrator, allowing it to manage Config rules, conformance packs, and aggregators across all member accounts.", "Deploy AWS Config individually in each member account using CloudFormation StackSets, creating cross-account IAM roles that grant the security account read and write access to Config resources.", "Use CloudTrail organization trails as a substitute for Config compliance monitoring, analyzing management events to infer resource configuration state changes across all member accounts.", "Share Config rules from the management account to member accounts using AWS Resource Access Manager (RAM), then create a Config aggregator in the security account to collect compliance results."], "correct": 0, "explanation_en": "AWS Organizations trusted access allows AWS services to perform actions across member accounts. By enabling trusted access for Config and designating a delegated administrator, the security account can create organization-wide Config rules, conformance packs, and aggregators without individual account setup. This follows the best practice of delegating administration away from the management account. StackSets achieve similar results but require more operational management and lack native delegated administration.", "question_zh": "一家公司希望从中心安全账户管理所有成员账户的AWS Config规则和聚合器，而无需使用管理账户进行日常运维。\n\n他们应该如何设置？", "options_zh": ["在AWS Organizations中启用AWS Config的可信访问，并将安全账户指定为委派管理员，允许其管理所有成员账户的Config规则、合规包和聚合器。", "使用CloudFormation StackSets在每个成员账户中单独部署AWS Config，创建跨账户IAM角色，授予安全账户对Config资源的读写访问权限。", "使用CloudTrail组织跟踪作为Config合规性监控的替代方案，分析管理事件以推断所有成员账户中的资源配置状态变化。", "使用AWS Resource Access Manager(RAM)将Config规则从管理账户共享给成员账户，然后在安全账户中创建Config聚合器以收集合规性结果。"], "explanation_zh": "AWS Organizations可信访问允许AWS服务跨成员账户执行操作。通过启用Config的可信访问并指定委派管理员，安全账户可以创建组织范围的Config规则、合规包和聚合器，无需单独账户设置。这遵循了将管理权限从管理账户委派出去的最佳实践。StackSets可以实现类似结果，但需要更多的运营管理，且缺乏原生的委派管理员功能。"}, {"exam": 4, "id": 34, "question_en": "A company with 100 developers needs to manage access to 50 AWS accounts. They want developers to access only accounts and resources matching their team and department, and adding new developers should not require AWS-side policy changes.\n \nHow should they configure IAM Identity Center?", "options_en": ["Create individual permission sets for each team-and-account combination, then manually assign each developer to the appropriate permission set and account pairing as they join or change teams.", "Configure ABAC in IAM Identity Center by passing user attributes (team, department) from the external IdP as session tags, and write permission set policies using `aws:PrincipalTag` conditions to dynamically match resource tags.", "Create separate OUs per team in AWS Organizations and attach SCPs that restrict API access based on the OU membership, relying on OU structure rather than identity attributes for access decisions.", "Create IAM user groups in each AWS account with team-specific inline policies, provisioning local IAM users for each developer and managing group memberships manually across all 50 accounts."], "correct": 1, "explanation_en": "IAM Identity Center supports ABAC by propagating user attributes from the identity provider as session tags. Permission set policies reference these tags using `aws:PrincipalTag` conditions to dynamically authorize access based on matching resource tags. When a new developer joins with the correct IdP attributes, they automatically receive appropriate access without any AWS-side policy changes. This scales much better than creating individual permission sets per team-account combination.", "question_zh": "一家拥有100名开发者的公司需要管理对50个AWS账户的访问。他们希望开发者只能访问与其团队和部门匹配的账户和资源，并且添加新开发者不应需要AWS侧的策略更改。\n\n他们应该如何配置IAM Identity Center？", "options_zh": ["为每个团队-账户组合创建单独的权限集，然后在开发者加入或更换团队时手动将每个开发者分配到相应的权限集和账户配对。", "在IAM Identity Center中配置ABAC，将来自外部IdP的用户属性（团队、部门）作为会话标签传递，并使用aws:PrincipalTag条件编写权限集策略以动态匹配资源标签。", "在AWS Organizations中为每个团队创建单独的OU，并附加SCP根据OU成员资格限制API访问，依赖OU结构而非身份属性进行访问决策。", "在每个AWS账户中创建带团队特定内联策略的IAM用户组，为每个开发者配置本地IAM用户，并在所有50个账户中手动管理组成员资格。"], "explanation_zh": "IAM Identity Center支持ABAC，通过将来自身份提供商的用户属性作为会话标签传播。权限集策略使用aws:PrincipalTag条件引用这些标签，根据匹配的资源标签动态授权访问。当新开发者以正确的IdP属性加入时，他们自动获得适当的访问权限，无需任何AWS侧的策略更改。这比创建每个团队-账户组合的单独权限集具有更好的扩展性。"}, {"exam": 4, "id": 35, "question_en": "A mobile app uses Cognito User Pools for authentication and needs to grant different levels of AWS access based on user group membership. Admin users get full DynamoDB read/write, while regular users can only access their own items.\n \nHow should they configure this?", "options_en": ["Create a single IAM role with broad DynamoDB read and write permissions for all user groups, then enforce per-user item-level restrictions in application-layer authorization logic checked before each database operation.", "Create separate Cognito User Pool app clients with different OAuth scopes per user group, and configure API Gateway to validate scope claims in the access token before routing requests to the DynamoDB backend.", "Configure a Cognito identity pool with role mapping rules that map User Pool groups to different IAM roles: an admin role with full DynamoDB access and a user role with conditions restricting access to items matching the caller's Cognito identity ID.", "Use API Gateway with a Lambda authorizer that inspects Cognito group claims in the JWT token and returns different IAM policy documents granting broad or restricted DynamoDB access depending on group membership."], "correct": 2, "explanation_en": "Cognito identity pools support role mapping based on claims in the authentication token. By configuring token-to-role mapping rules, User Pool group claims are mapped to specific IAM roles. Admin group members assume a role with full DynamoDB access, while regular users assume a role that uses the `cognito-identity.amazonaws.com:sub` condition to restrict access to only their own items. This leverages IAM for enforcement rather than application-level logic.", "question_zh": "一个移动应用使用Cognito User Pools进行身份验证，需要根据用户组成员资格授予不同级别的AWS访问权限。管理员用户获得完整的DynamoDB读写权限，而普通用户只能访问自己的项目。\n\n他们应该如何配置？", "options_zh": ["为所有用户组创建一个具有广泛DynamoDB读写权限的单一IAM角色，然后在每次数据库操作之前在应用层授权逻辑中强制执行按用户的项目级限制。", "为每个用户组创建具有不同OAuth范围的单独Cognito User Pool应用客户端，并配置API Gateway在将请求路由到DynamoDB后端之前验证访问令牌中的范围声明。", "配置Cognito身份池，使用角色映射规则将User Pool组映射到不同的IAM角色：一个具有完整DynamoDB访问权限的管理员角色，以及一个具有限制仅访问与调用者Cognito身份ID匹配的项目的条件的用户角色。", "使用API Gateway与Lambda授权器，检查JWT令牌中的Cognito组声明，并根据组成员资格返回授予广泛或受限DynamoDB访问权限的不同IAM策略文档。"], "explanation_zh": "Cognito身份池支持基于身份验证令牌中声明的角色映射。通过配置令牌到角色的映射规则，User Pool组声明被映射到特定的IAM角色。管理员组成员承担具有完整DynamoDB访问权限的角色，而普通用户承担使用cognito-identity.amazonaws.com:sub条件限制仅访问自己项目的角色。这利用IAM进行强制执行，而非应用层逻辑。"}, {"exam": 4, "id": 36, "question_en": "An application assumes Role A, then from Role A assumes Role B (role chaining). When assuming Role B, the maximum session duration is limited to 1 hour despite Role B being configured with a 12-hour maximum.\n \nWhy is this happening?", "options_en": ["Role B's trust policy includes a session duration condition that explicitly limits chained role assumptions to 1 hour, overriding the role's configured maximum when the caller is already using temporary credentials.", "The `DurationSeconds` parameter was omitted in the `AssumeRole` API call for Role B, so STS applied the 1-hour default instead of using Role B's configured 12-hour maximum session duration.", "Role A's own maximum session duration of 1 hour propagates to all downstream role assumptions in the chain, capping Role B's effective session to the same limit regardless of its independent configuration.", "Role chaining limits the maximum session duration to 1 hour regardless of the role's configured maximum. To use longer sessions, assume Role B directly from long-term credentials or an instance profile instead of chaining through another role."], "correct": 3, "explanation_en": "When using role chaining (assuming a role from credentials obtained by assuming another role), AWS STS limits the maximum session duration to 1 hour. This applies regardless of the maximum session duration configured on the target role and cannot be overridden by specifying `DurationSeconds`. The only way to use sessions longer than 1 hour is to assume the role directly from long-term credentials (IAM user) or from an EC2 instance profile. This security measure prevents indefinite credential escalation through role chains.", "question_zh": "一个应用程序承担角色A，然后从角色A承担角色B（角色链）。尽管角色B配置了12小时的最大会话时长，但在承担角色B时，最大会话时长限制为1小时。\n\n为什么会这样？", "options_zh": ["角色B的信任策略包含一个会话时长条件，在调用者已经使用临时凭证时明确将链式角色承担限制为1小时，覆盖了角色配置的最大值。", "AssumeRole API调用中省略了DurationSeconds参数，因此STS应用了1小时默认值，而非使用角色B配置的12小时最大会话时长。", "角色A自身的1小时最大会话时长会传播到链中所有下游角色承担，将角色B的有效会话限制为相同的限制，无论其独立配置如何。", "角色链将最大会话时长限制为1小时，无论角色配置的最大值如何。要使用更长的会话，应直接从长期凭证或实例配置文件承担角色B，而不是通过另一个角色链式承担。"], "explanation_zh": "当使用角色链（通过承担另一个角色获得的凭证来承担角色）时，AWS STS将最大会话时长限制为1小时。无论目标角色上配置的最大会话时长如何，这都适用，并且不能通过指定DurationSeconds来覆盖。使用超过1小时的会话的唯一方法是直接从长期凭证（IAM用户）或EC2实例配置文件承担角色。这种安全措施防止通过角色链无限期地提升凭证。"}, {"exam": 4, "id": 37, "question_en": "A SaaS API already authenticates users with OIDC tokens and needs centralized authorization decisions without embedding tenant permission logic in every microservice.\n \nWhich approach BEST centralizes fine-grained, tenant-aware authorization?", "options_en": ["Use IAM role session tags derived from the OIDC token claims and write IAM policies with tag-based conditions so that each microservice delegates authorization decisions to the IAM evaluation engine.", "Create an Amazon Verified Permissions policy store with Cedar policies and call `IsAuthorizedWithToken` from each microservice so token claims are evaluated against centralized authorization rules.", "Build a shared Lambda authorizer backed by a DynamoDB table of per-tenant allow and deny rules, invoking it from each microservice API Gateway to evaluate permissions at the gateway layer.", "Store Cedar policy files in an S3 bucket and embed a local policy evaluation library in each microservice that downloads and caches the policies, evaluating authorization decisions in-process."], "correct": 1, "explanation_en": "Verified Permissions externalizes application authorization and evaluates Cedar policies centrally. `IsAuthorizedWithToken` is specifically designed for token-based applications and reduces duplicated authorization logic in services. IAM session tags work for AWS resource-level access but are not suited for fine-grained tenant-scoped application permissions. DynamoDB-backed authorizers and local policy evaluation both distribute logic rather than centralizing it.", "question_zh": "一个SaaS API已经使用OIDC令牌对用户进行身份验证，需要集中授权决策，而无需在每个微服务中嵌入租户权限逻辑。\n\n哪种方法最能集中化细粒度、租户感知的授权？", "options_zh": ["使用从OIDC令牌声明派生的IAM角色会话标签，并使用基于标签的条件编写IAM策略，以便每个微服务将授权决策委托给IAM评估引擎。", "创建一个Amazon Verified Permissions策略存储，使用Cedar策略，并从每个微服务调用IsAuthorizedWithToken，以便令牌声明根据集中授权规则进行评估。", "构建一个由含每个租户允许和拒绝规则的DynamoDB表支持的共享Lambda授权器，从每个微服务API Gateway调用它以在网关层评估权限。", "将Cedar策略文件存储在S3存储桶中，并在每个微服务中嵌入一个本地策略评估库，该库下载并缓存策略，在进程内评估授权决策。"], "explanation_zh": "Verified Permissions将应用程序授权外部化，并集中评估Cedar策略。IsAuthorizedWithToken专为基于令牌的应用程序设计，减少服务中重复的授权逻辑。IAM会话标签适用于AWS资源级别的访问，但不适合细粒度、租户范围的应用权限。基于DynamoDB的授权器和本地策略评估都分散了逻辑，而非集中化。"}, {"exam": 4, "id": 38, "question_en": "A company stores sensitive data in S3 and wants to ensure that all API requests to the bucket use HTTPS. Requests over unencrypted HTTP should be denied.\n \nWhich bucket policy approach enforces this?", "options_en": ["Add a Deny statement with the condition `\"Bool\": {\"aws:SecureTransport\": \"false\"}`, which rejects any request not made over a TLS/HTTPS connection regardless of the caller's IAM permissions.", "Enable S3 Transfer Acceleration on the bucket, which negotiates optimized TLS connections through CloudFront edge locations and implicitly rejects any non-HTTPS upload or download requests.", "Configure SSE-S3 default encryption on the bucket with a bucket policy requiring the `x-amz-server-side-encryption` header, which ensures data is encrypted and implicitly enforces HTTPS for all API calls.", "Place a CloudFront distribution with an HTTPS-only viewer protocol policy in front of the S3 bucket origin, ensuring viewers connect over TLS while CloudFront handles origin requests internally."], "correct": 0, "explanation_en": "The `aws:SecureTransport` condition key evaluates to `true` for TLS/HTTPS requests and `false` for HTTP. A bucket policy Deny statement with this condition blocks all unencrypted requests regardless of the caller's permissions. This is a CIS AWS Foundations Benchmark recommendation for data-in-transit protection. SSE-S3 protects data at rest, not in transit. CloudFront HTTPS only protects the viewer-to-CloudFront connection, not direct S3 API access.", "question_zh": "一家公司在S3中存储敏感数据，并希望确保所有对存储桶的API请求使用HTTPS。应拒绝通过未加密HTTP的请求。\n\n哪种存储桶策略方法强制执行此要求？", "options_zh": ["添加带有条件\"Bool\": {\"aws:SecureTransport\": \"false\"}的Deny语句，该语句拒绝任何未通过TLS/HTTPS连接发出的请求，无论调用者的IAM权限如何。", "在存储桶上启用S3 Transfer Acceleration，通过CloudFront边缘站点协商优化的TLS连接，并隐式拒绝任何非HTTPS的上传或下载请求。", "在存储桶上配置SSE-S3默认加密，并使用要求x-amz-server-side-encryption标头的存储桶策略，确保数据被加密并隐式强制所有API调用使用HTTPS。", "在S3存储桶源前面放置一个具有仅HTTPS查看器协议策略的CloudFront分发，确保查看者通过TLS连接，而CloudFront在内部处理源请求。"], "explanation_zh": "aws:SecureTransport条件键对TLS/HTTPS请求评估为true，对HTTP评估为false。带有此条件的存储桶策略Deny语句阻止所有未加密的请求，无论调用者权限如何。这是CIS AWS Foundations Benchmark对传输中数据保护的建议。SSE-S3保护静态数据而非传输中的数据。CloudFront HTTPS仅保护查看者到CloudFront的连接，而非直接的S3 API访问。"}, {"exam": 4, "id": 39, "question_en": "Security engineers want to remove unused service permissions from an IAM role, but first they need evidence of which services the role has actually accessed over time.\n \nWhich IAM feature gives this service-level usage view?", "options_en": ["IAM Access Analyzer policy generation, which immediately returns a full action-level policy from a single CloudTrail event.", "IAM service last accessed data (Access Advisor), which shows when each allowed service was last used by the role.", "AWS Config resource timeline, which reports the role's API usage across all attached policies.", "AWS Trusted Advisor IAM checks, which provide action-by-action historical usage for each role session."], "correct": 1, "explanation_en": "Service last accessed data in IAM provides a service-level history signal that helps identify broad permissions that may be unused. It is useful for right-sizing before refining detailed actions. The other options do not provide this same native service-last-used view for IAM principals.", "question_zh": "安全工程师希望从IAM角色中移除未使用的服务权限，但首先需要角色随时间推移实际访问过哪些服务的证据。\n\n哪个IAM功能提供此服务级别的使用视图？", "options_zh": ["IAM Access Analyzer策略生成，立即从单个CloudTrail事件返回完整的操作级别策略。", "IAM服务最后访问数据(Access Advisor)，显示角色最近使用每个已允许服务的时间。", "AWS Config资源时间线，报告角色在所有附加策略中的API使用情况。", "AWS Trusted Advisor IAM检查，为每个角色会话提供逐操作的历史使用情况。"], "explanation_zh": "IAM中的服务最后访问数据提供服务级别历史信号，帮助识别可能未使用的广泛权限。在细化具体操作之前，它在权限缩小方面非常有用。其他选项不为IAM主体提供相同的原生服务最后使用视图。"}, {"exam": 4, "id": 40, "question_en": "A platform team can create IAM roles, but security requires every new role to include a specific permissions boundary ARN at creation time.\n \nHow can this be enforced preventively?", "options_en": ["Create an SCP that denies all IAM role creation unless the role name starts with `bounded-`.", "Use a CloudTrail alarm that detects roles without boundaries and triggers a remediation Lambda function.", "Grant `iam:CreateRole` only when the request includes the approved `iam:PermissionsBoundary` condition value.", "Allow unrestricted role creation, then rely on quarterly access reviews to remove non-compliant roles."], "correct": 2, "explanation_en": "Using the `iam:PermissionsBoundary` condition in the identity policy enforces boundary attachment during role creation, which is preventive and deterministic. Detection-based remediations are reactive and create a compliance gap window. Naming conventions do not guarantee boundary enforcement.", "question_zh": "平台团队可以创建IAM角色，但安全要求每个新角色在创建时必须包含特定的权限边界ARN。\n\n如何预防性地强制执行此要求？", "options_zh": ["创建一个SCP，拒绝所有IAM角色创建，除非角色名称以bounded-开头。", "使用CloudTrail告警检测没有边界的角色，并触发修复Lambda函数。", "仅当请求包含已批准的iam:PermissionsBoundary条件值时授予iam:CreateRole权限。", "允许不受限制的角色创建，然后依赖季度访问审查移除不合规的角色。"], "explanation_zh": "在身份策略中使用iam:PermissionsBoundary条件在角色创建期间强制执行边界附加，这是预防性和确定性的。基于检测的修复是反应性的，会创建合规性缺口窗口。命名约定不能保证边界强制执行。"}, {"exam": 4, "id": 41, "question_en": "A delegated admin role in a member account has `AdministratorAccess` but cannot run an API call that is explicitly denied by an SCP attached to that account's OU.\n \nWhy does the request fail?", "options_en": ["Because SCP explicit denies are guardrails that limit maximum permissions in member accounts, even when IAM policies allow the action.", "Because delegated administrator registration does not override OU-level guardrails and does not bypass applicable SCP deny statements.", "Because `AdministratorAccess` grants read operations only when Organizations delegated administration is enabled for that service.", "Because SCP evaluation happens before IAM allow processing, so a matching deny in scope blocks the request entirely."], "correct": 0, "explanation_en": "SCPs define the maximum available permissions for principals in member accounts. An explicit deny in an SCP blocks the action regardless of identity policy allows, including broad administrative permissions. Delegated administration does not bypass SCP guardrails.", "question_zh": "成员账户中的委派管理员角色具有AdministratorAccess，但无法运行被附加到该账户OU的SCP明确拒绝的API调用。\n\n为什么请求会失败？", "options_zh": ["因为SCP明确拒绝是限制成员账户中最大权限的护栏，即使IAM策略允许该操作。", "因为委派管理员注册不覆盖OU级别的护栏，也不绕过适用的SCP拒绝语句。", "因为当为该服务启用Organizations委派管理时，AdministratorAccess仅授予读取操作。", "因为SCP评估在IAM允许处理之前进行，所以范围内匹配的拒绝会完全阻止请求。"], "explanation_zh": "SCP定义成员账户中主体的最大可用权限。SCP中的明确拒绝会阻止该操作，无论身份策略如何允许，包括广泛的管理权限。委派管理不绕过SCP护栏。"}, {"exam": 4, "id": 42, "question_en": "A company has hundreds of EC2 instances owned by different teams. They want each team to manage only their own instances using a single IAM policy that scales automatically as teams and instances are added.\n \nWhich approach implements this?", "options_en": ["Create a separate IAM policy for each team that explicitly lists the instance IDs belonging to that team, updating the policy whenever instances are launched or terminated in the environment.", "Create a single IAM policy using `\"StringEquals\": {\"aws:ResourceTag/Team\": \"${aws:PrincipalTag/Team}\"}` to allow actions only on instances whose Team tag matches the caller's own Team tag.", "Use `aws:RequestTag/Team` conditions to restrict which Team tag value users can assign when launching new instances, preventing teams from tagging resources with another team's identifier.", "Apply resource-based policies directly on each EC2 instance that specify which IAM principals from the owning team are allowed to perform start, stop, and terminate actions on that resource."], "correct": 1, "explanation_en": "Attribute-Based Access Control (ABAC) uses tags on both IAM principals and AWS resources for authorization. By comparing `aws:ResourceTag/Team` (on the EC2 instance) with `aws:PrincipalTag/Team` (on the IAM principal), a single policy dynamically restricts each team to instances with a matching tag. This scales automatically as new teams and instances are added without policy changes. Listing instance IDs does not scale. EC2 instances do not support resource-based policies.", "question_zh": "一家公司拥有数百个由不同团队拥有的EC2实例。他们希望每个团队使用一个随着团队和实例的添加自动扩展的单一IAM策略来仅管理自己的实例。\n\n哪种方法可以实现此目的？", "options_zh": ["为每个团队创建单独的IAM策略，明确列出属于该团队的实例ID，在实例启动或终止时更新策略。", "创建一个单一IAM策略，使用\"StringEquals\": {\"aws:ResourceTag/Team\": \"${aws:PrincipalTag/Team}\"}仅允许对Team标签与调用者自身Team标签匹配的实例执行操作。", "使用aws:RequestTag/Team条件限制用户在启动新实例时可以分配哪个Team标签值，防止团队使用其他团队的标识符标记资源。", "直接在每个EC2实例上应用基于资源的策略，指定拥有团队中的哪些IAM主体可以对该资源执行启动、停止和终止操作。"], "explanation_zh": "基于属性的访问控制(ABAC)使用IAM主体和AWS资源上的标签进行授权。通过比较aws:ResourceTag/Team（在EC2实例上）和aws:PrincipalTag/Team（在IAM主体上），单个策略动态地将每个团队限制为具有匹配标签的实例。这随着新团队和实例的添加而自动扩展，无需策略更改。列出实例ID不可扩展。EC2实例不支持基于资源的策略。"}, {"exam": 4, "id": 43, "question_en": "An organization wants to restrict all AWS operations to `us-east-1` and `eu-west-1` only, while still allowing access to global services like IAM, CloudFront, Route 53, and Organizations.\n \nWhich SCP construct achieves this?", "options_en": ["Create an SCP Allow statement that lists only `us-east-1` and `eu-west-1` in an `aws:RequestedRegion` condition, replacing the default FullAWSAccess SCP so that only actions in those two Regions are permitted.", "Create an SCP Deny statement using `aws:RequestedRegion` that blocks actions in non-approved Regions, with a `NotAction` list exempting global services like IAM, Route 53, and CloudFront.", "Create an SCP Deny statement using `aws:SourceRegion` to block resource creation outside approved Regions, with an `Action` list that explicitly includes every global service to exempt them.", "Create an SCP Deny statement using `aws:RequestedRegion` that blocks actions in non-approved Regions, with a `Condition` exception using `aws:PrincipalOrgID` to exempt global services from the restriction."], "correct": 1, "explanation_en": "An SCP Deny with `aws:RequestedRegion` and a `NotAction` list is the AWS-recommended pattern. The `NotAction` element excludes global services like IAM, STS, CloudFront, Route 53, and Organizations that must remain accessible regardless of Region. Replacing the default FullAWSAccess SCP with an Allow-list approach is risky and breaks global services that operate without a Region context. The condition key `aws:SourceRegion` does not exist. Using `aws:PrincipalOrgID` controls which organization can call APIs, not which services are exempt from Region restrictions.", "question_zh": "一个组织希望将所有AWS操作限制为仅us-east-1和eu-west-1，同时仍允许访问IAM、CloudFront、Route 53和Organizations等全球服务。\n\n哪个SCP构造可以实现这一点？", "options_zh": ["创建SCP Allow语句，在aws:RequestedRegion条件中仅列出us-east-1和eu-west-1，替换默认的FullAWSAccess SCP，以便仅允许这两个区域中的操作。", "创建使用aws:RequestedRegion的SCP Deny语句阻止未经批准区域中的操作，并使用NotAction列表排除IAM、Route 53和CloudFront等全球服务。", "创建使用aws:SourceRegion的SCP Deny语句阻止在批准区域之外创建资源，并使用Action列表明确包含每个全球服务以豁免它们。", "创建使用aws:RequestedRegion的SCP Deny语句阻止未经批准区域中的操作，并使用aws:PrincipalOrgID条件异常来豁免全球服务的区域限制。"], "explanation_zh": "使用aws:RequestedRegion和NotAction列表的SCP Deny是AWS推荐的模式。NotAction元素排除必须保持可访问的全球服务，如IAM、STS、CloudFront、Route 53和Organizations，无论区域如何。用Allow列表方法替换默认的FullAWSAccess SCP是有风险的，会破坏在没有区域上下文的情况下运行的全球服务。条件键aws:SourceRegion不存在。使用aws:PrincipalOrgID控制哪个组织可以调用API，而非哪些服务豁免区域限制。"}, {"exam": 4, "id": 44, "question_en": "A company needs database administrators to have read-only access to EC2, RDS, and CloudWatch in production accounts only, with sessions limited to 1 hour. Access must be managed centrally.\n \nHow should they configure this in IAM Identity Center?", "options_en": ["Create an IAM role in each of the twelve production accounts with a 1-hour session duration and read-only policies, then distribute the role ARNs to each DBA for manual cross-account assumption.", "Configure Okta to issue SAML assertions with a 1-hour session timeout that map DBAs directly to individual IAM roles in each production account, bypassing IAM Identity Center for federation.", "Create temporary IAM users in each production account with programmatic access keys set to expire after 1 hour, granting DBAs console access through a custom credential vending portal.", "Create a permission set with a policy allowing read-only access to EC2, RDS, and CloudWatch, set the session duration to 1 hour, and assign it to the DBA group for all twelve production accounts."], "correct": 3, "explanation_en": "IAM Identity Center permission sets define permissions and session parameters for specific account assignments. By creating a permission set scoped to EC2, RDS, and CloudWatch with a 1-hour session duration, and assigning it to the DBA group for only the production accounts, DBAs see only those accounts in the Identity Center portal with time-limited, read-only access. No per-account IAM role creation is needed.", "question_zh": "一家公司需要数据库管理员仅在生产账户中拥有对EC2、RDS和CloudWatch的只读访问权限，会话限制为1小时。访问必须集中管理。\n\n他们应该如何通过IAM Identity Center配置？", "options_zh": ["在每个生产账户中创建具有1小时会话时长和只读策略的IAM角色，然后将角色ARN分发给每个DBA以进行手动跨账户承担。", "配置Okta发出具有1小时会话超时的SAML断言，将DBA直接映射到每个生产账户中的单独IAM角色，绕过IAM Identity Center进行联邦。", "在每个生产账户中创建临时IAM用户，具有设置为1小时后过期的编程访问密钥，通过自定义凭证发放门户授予DBA控制台访问权限。", "创建一个权限集，其策略允许对EC2、RDS和CloudWatch的只读访问，将会话时长设置为1小时，并将其分配给所有生产账户的DBA组。"], "explanation_zh": "IAM Identity Center权限集为特定账户分配定义权限和会话参数。通过创建范围限定为EC2、RDS和CloudWatch并具有1小时会话时长的权限集，并仅将其分配给生产账户的DBA组，管理员在Identity Center门户中只看到这些账户，具有时间限制的只读访问权限。无需为每个账户创建IAM角色。"}, {"exam": 4, "id": 45, "question_en": "An application needs to encrypt files larger than 100 MB before storing them in S3. The KMS `
