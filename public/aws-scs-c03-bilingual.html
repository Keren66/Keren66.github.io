<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SCS-C03 Practice Exams — 中英双语题库 (325 Questions)</title>
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --border: #334155;
  --orange: #f97316; --cyan: #06b6d4; --green: #22c55e; --red: #ef4444;
  --text: #f1f5f9; --text2: #94a3b8;
}
[data-theme="light"] {
  --bg: #ffffff; --card: #f0f4f8; --border: #cbd5e1;
  --orange: #ea580c; --cyan: #0891b2; --green: #16a34a; --red: #dc2626;
  --text: #1e293b; --text2: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
header { text-align: center; padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
header h1 { font-size: 1.6rem; background: linear-gradient(135deg, var(--orange), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--text2); font-size: 0.9rem; margin-top: 0.3rem; }

/* Controls */
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
.controls select, .controls button {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 0.9rem; cursor: pointer;
}
.controls button:hover { border-color: var(--orange); }
.btn-orange { background: var(--orange) !important; border-color: var(--orange) !important; color: #fff !important; font-weight: 600; }
.btn-cyan { background: var(--cyan) !important; border-color: var(--cyan) !important; color: #000 !important; font-weight: 600; }

/* Progress */
.progress-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.progress-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--cyan)); transition: width 0.3s; }
.progress-text { font-size: 0.8rem; color: var(--text2); white-space: nowrap; }

/* Question card */
.q-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; position: relative; }
.q-card.correct-card { border-color: var(--green); }
.q-card.wrong-card { border-color: var(--red); }
.q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.q-num { font-size: 0.8rem; color: var(--cyan); font-weight: 600; }
.q-exam-tag { font-size: 0.75rem; color: var(--text2); background: var(--bg); padding: 2px 8px; border-radius: 4px; }
.q-text { font-size: 1.05rem; color: var(--text); margin-bottom: 14px; }
.q-text-zh { color: var(--text2); font-size: 0.95rem; margin-bottom: 8px; padding: 8px 12px; background: rgba(6,182,212,0.05); border-radius: 6px; border-left: 2px solid var(--cyan); }

/* Options */
.options { list-style: none; }
.option { padding: 12px 16px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; gap: 10px; align-items: flex-start; }
.option:hover { background: rgba(249,115,22,0.08); border-color: var(--orange); }
.option.selected { border-color: var(--cyan); background: rgba(6,182,212,0.1); }
.option.correct-answer { border-color: var(--green); background: rgba(34,197,94,0.1); }
.option.wrong-answer { border-color: var(--red); background: rgba(239,68,68,0.1); text-decoration: line-through; }
.option.disabled { pointer-events: none; opacity: 0.7; }
.opt-letter { width: 28px; height: 28px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
.option.selected .opt-letter { background: var(--cyan); color: #000; }
.option.correct-answer .opt-letter { background: var(--green); color: #fff; }
.option.wrong-answer .opt-letter { background: var(--red); color: #fff; }
.opt-text { flex: 1; }
.opt-en { color: var(--text); }
.opt-zh { color: var(--text2); font-size: 0.85rem; margin-top: 2px; }
.opt-zh.hidden-zh { display: none; }

/* Explanation */
.explanation { display: none; margin-top: 14px; padding: 12px 16px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--cyan); }
.explanation.show { display: block; }
.explanation h4 { color: var(--cyan); margin-bottom: 6px; font-size: 0.9rem; }
.explanation .exp-en { color: var(--text); font-size: 0.9rem; }
.explanation .exp-zh { color: var(--text2); font-size: 0.85rem; margin-top: 6px; }

/* Action buttons */
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.actions button { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
.actions button:hover { border-color: var(--orange); }
.actions .btn-primary { background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 600; }

/* Results */
.results { display: none; text-align: center; padding: 2rem; }
.results.show { display: block; }
.results .score-big { font-size: 3rem; font-weight: 700; }
.results .score-big.pass { color: var(--green); }
.results .score-big.fail { color: var(--red); }
.results .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin: 10px 0; }
.badge-pass { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.badge-fail { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

/* Review list */
.review-list { text-align: left; margin-top: 1.5rem; }
.review-item { padding: 8px 12px; margin: 4px 0; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.review-item:hover { background: var(--card); }
.review-item.correct { border-left: 3px solid var(--green); }
.review-item.wrong { border-left: 3px solid var(--red); }
.review-item .mark { font-weight: 700; font-size: 0.85rem; }
.review-item .mark.green { color: var(--green); }
.review-item .mark.red { color: var(--red); }

/* Hidden */
.hidden { display: none !important; }
.hidden-zh .q-text-zh, .hidden-zh .opt-zh, .hidden-zh .exp-zh { display: none; }
.hidden-en .q-text-en, .hidden-en .opt-en, .hidden-en .exp-en { display: none; }

/* Mobile */
@media (max-width: 600px) {
  .container { padding: 12px; }
  .q-card { padding: 14px 16px; }
  header h1 { font-size: 1.3rem; }
  .controls { flex-direction: column; align-items: stretch; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AWS Certified Security — Specialty (SCS-C03)</h1>
    <p>中英双语题库 — 5 套模拟考试 · 325 题 | Bilingual Practice Exams</p>
  </header>

  <div class="controls">
    <select id="examFilter">
      <option value="all">📋 All Exams (325 questions)</option>
      <option value="1">📝 Exam 1 (65 questions)</option>
      <option value="2">📝 Exam 2 (65 questions)</option>
      <option value="3">📝 Exam 3 (65 questions)</option>
      <option value="4">📝 Exam 4 (65 questions)</option>
      <option value="5">📝 Exam 5 (65 questions)</option>
    </select>
    <select id="langMode">
      <option value="bilingual">🌐 Bilingual (中英双语)</option>
      <option value="en">🇺🇸 English Only</option>
      <option value="zh">🇨🇳 中文 Only</option>
    </select>
    <button id="themeToggle" onclick="toggleTheme()">☀️ Light</button>
    <span style="display:flex;align-items:center;gap:6px;">
      <button onclick="prevQuestion()" title="← 上一题">◀</button>
      <input id="qJumpInput" type="number" min="1" max="325" value="1"
        style="width:60px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.9rem;text-align:center;"
        onkeydown="if(event.key==='Enter')jumpToQ()" />
      <button onclick="jumpToQ()" title="跳转">⏩</button>
      <button onclick="nextQuestion()" title="→ 下一题">▶</button>
    </span>
    <button onclick="showAnswer()">💡 Show Answer</button>
    <button class="btn-orange" onclick="resetExam()">🔄 Reset</button>
  </div>

  <div class="progress-bar">
    <span class="progress-text" id="progressLabel">Q 0/325</span>
    <div class="progress-bg"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-text" id="scoreLabel">Score: -</span>
  </div>

  <div id="quizArea"></div>

  <div class="results" id="resultsArea">
    <div id="resultsContent"></div>
    <div class="review-list" id="reviewList"></div>
  </div>
</div>

<script>
// ===== QUESTION DATA (embedded) =====
const ALL_QUESTIONS = [{"exam": 1, "id": 1, "question_en": "You are a Security Engineer at FinTech Corp. Amazon GuardDuty has detected a `Backdoor:EC2/C&CActivity.B` finding on a production EC2 instance running a payment processing application. The instance is part of an Auto Scaling group behind an Application Load Balancer. Your security team needs to investigate the instance while minimizing impact to production traffic.\n \nWhat is the CORRECT sequence of steps to remediate this potentially compromised EC2 instance?", "options_en": ["Terminate the instance immediately, rely on the Auto Scaling group to launch a replacement, and review CloudTrail logs afterward.", "Detach the instance from the Auto Scaling group, create a dedicated isolation security group with restricted access, associate the isolation security group with the instance, remove all other security group associations, and investigate for malware.", "Stop the instance, take an EBS snapshot for forensic analysis, then terminate the instance and launch a new one from a known-good AMI.", "Run an on-demand GuardDuty malware scan, wait for results, and if malware is detected, update the instance's security groups to block outbound traffic."], "correct": 1, "explanation_en": "The AWS-recommended remediation steps for a potentially compromised EC2 instance are:\n \n\nIdentify the potentially compromised instance and investigate for malware\nIsolate the instance by creating a dedicated isolation security group that only allows specific inbound/outbound access, associating it with the instance, and removing all other security group associations\nIdentify the source of suspicious activity and stop unauthorized processes\nIf unable to remediate, terminate and replace the instance\n\n \nOption A is incorrect because terminating immediately destroys forensic evidence. Option C stops the instance which may lose volatile memory data needed for investigation. Option D delays isolation while waiting for scan results, allowing potential continued C&C communication.\n \nImportant Note: Changing security groups does not terminate existing tracked connections—only future traffic is blocked. For complete isolation, consider using NACLs.", "question_zh": "您是 FinTech Corp 的安全工程师。Amazon GuardDuty 在一台运行支付处理应用程序的生产 EC2 实例上检测到了 `Backdoor:EC2/C&CActivity.B` 发现项。该实例是 Application Load Balancer 后面 Auto Scaling 组的一部分。您的安全团队需要在最小化对生产流量影响的同时调查该实例。\n\n修复此潜在受感染 EC2 实例的正确步骤顺序是什么？", "options_zh": ["立即终止该实例，依赖 Auto Scaling 组启动替代实例，然后审查 CloudTrail 日志。", "将该实例从 Auto Scaling 组中分离，创建具有受限访问权限的专用隔离安全组，将隔离安全组关联到该实例，移除所有其他安全组关联，然后调查恶意软件。", "停止该实例，创建 EBS 快照用于取证分析，然后终止该实例并从已知良好的 AMI 启动新实例。", "运行按需 GuardDuty 恶意软件扫描，等待结果，如果检测到恶意软件，则更新实例的安全组以阻止出站流量。"], "explanation_zh": "AWS 推荐的针对潜在受感染 EC2 实例的修复步骤如下：\n\n1. 识别潜在受感染的实例并调查恶意软件\n2. 隔离实例：创建仅允许特定入站/出站访问的专用隔离安全组，将其关联到实例，并移除所有其他安全组关联\n3. 识别可疑活动的来源并停止未经授权的进程\n4. 如果无法修复，则终止并替换实例\n\n选项 A 不正确，因为立即终止会销毁取证证据。选项 C 停止实例可能会丢失调查所需的易失性内存数据。选项 D 在等待扫描结果时延迟了隔离，允许可能持续的 C&C 通信。\n\n重要提示：更改安全组不会终止现有的已跟踪连接——只有未来的流量会被阻止。要完全隔离，请考虑使用 NACL。"}, {"exam": 1, "id": 2, "question_en": "A Security Analyst at your company discovers that an AWS access key has been posted on a public GitHub repository. The key ID begins with `ASIA`. The analyst needs to determine the scope of the compromise and take appropriate remediation steps.\n \nWhat is the MOST important first step the analyst should take?", "options_en": ["Immediately delete or rotate the key via the IAM console since it's associated with an IAM user.", "Examine the `sessionIssuer` element in CloudTrail logs to identify how the temporary STS credential was obtained.", "Rotate all IAM user access keys in the account as a precautionary measure.", "Wait for the key to expire since it's a long-term credential that will eventually become invalid."], "correct": 1, "explanation_en": "The `ASIA` prefix identifies the key as a short-term temporary credential from AWS STS (unlike `AKIA`, which indicates long-term IAM user credentials). The most important first step is to examine the `sessionIssuer` element in CloudTrail logs to identify how the temporary credential was generated — whether via `AssumeRole`, `GetFederationToken`, or `GetSessionToken` — and which IAM role or user is the source. Deleting or rotating through the IAM console does not apply to STS temporary credentials. Rotating all access keys is overkill and does not address the actual source. Waiting for expiration ignores the need to identify and secure the underlying principal that generated the credential.", "question_zh": "您公司的安全分析师发现一个 AWS 访问密钥被发布到了公共 GitHub 仓库。该密钥 ID 以 `ASIA` 开头。分析师需要确定泄露的范围并采取适当的修复措施。\n\n分析师应该采取的最重要的第一步是什么？", "options_zh": ["立即通过 IAM 控制台删除或轮换密钥，因为它与 IAM 用户关联。", "检查 CloudTrail 日志中的 `sessionIssuer` 元素，以确定临时 STS 凭证是如何获取的。", "作为预防措施，轮换账户中的所有 IAM 用户访问密钥。", "等待密钥过期，因为它是一个长期凭证，最终会失效。"], "explanation_zh": "`ASIA` 前缀将该密钥标识为来自 AWS STS 的短期临时凭证（与表示长期 IAM 用户凭证的 `AKIA` 不同）。最重要的第一步是检查 CloudTrail 日志中的 `sessionIssuer` 元素，以确定临时凭证是如何生成的——是通过 `AssumeRole`、`GetFederationToken` 还是 `GetSessionToken`——以及哪个 IAM 角色或用户是来源。通过 IAM 控制台删除或轮换不适用于 STS 临时凭证。轮换所有访问密钥过度且不解决实际来源问题。等待过期则忽略了识别和保护生成该凭证的底层主体的需求。"}, {"exam": 1, "id": 3, "question_en": "Amazon GuardDuty has generated a `Policy:S3/BucketAnonymousAccessGranted` finding for a bucket containing customer PII data. Your investigation reveals that a bucket policy was modified 2 hours ago to allow public access. The bucket has versioning enabled and server access logging configured.\n \nWhich step is the BEST first action to investigate and remediate this incident?", "options_en": ["Review S3 server access logs to identify any data access that occurred during the 2-hour window.", "Immediately delete the bucket to prevent further unauthorized access.", "Review CloudTrail logs to identify the IAM principal that modified the bucket policy.", "Restore the previous bucket policy version using S3 versioning."], "correct": 0, "explanation_en": "The best first action is to review S3 server access logs to identify any data access that occurred during the 2-hour window the bucket was publicly accessible. Knowing what data was accessed (and by whom) is critical for assessing the breach impact and meeting breach notification obligations. CloudTrail logs should also be reviewed in parallel to identify the IAM principal that modified the bucket policy. After establishing the investigation baseline, remediation follows: restore the bucket policy to a secure state and enable S3 Block Public Access to prevent recurrence.\n \nWhy the other options are incorrect:\n\nImmediately delete the bucket: Deleting the bucket destroys both evidence and customer PII data. Incident response requires preserving evidence. The correct action is to secure the bucket, not destroy it.\nRestore the previous bucket policy version using S3 versioning: S3 versioning applies to objects stored in the bucket, not to the bucket policy itself. Bucket policies are not versioned — there is no previous version of the policy to restore through the versioning mechanism.\n", "question_zh": "Amazon GuardDuty 为一个包含客户 PII 数据的存储桶生成了 `Policy:S3/BucketAnonymousAccessGranted` 发现项。您的调查显示，存储桶策略在 2 小时前被修改以允许公共访问。该存储桶已启用版本控制并配置了服务器访问日志。\n\n调查和修复此事件的最佳第一步操作是什么？", "options_zh": ["审查 S3 服务器访问日志以识别在 2 小时窗口内发生的任何数据访问。", "立即删除存储桶以防止进一步的未经授权访问。", "审查 CloudTrail 日志以识别修改存储桶策略的 IAM 主体。", "使用 S3 版本控制恢复先前的存储桶策略版本。"], "explanation_zh": "最佳第一步操作是审查 S3 服务器访问日志，以识别存储桶公开可访问的 2 小时窗口内发生的任何数据访问。了解哪些数据被访问（以及被谁访问）对于评估泄露影响和满足泄露通知义务至关重要。CloudTrail 日志也应并行审查，以识别修改存储桶策略的 IAM 主体。建立调查基线后，修复紧随其后：将存储桶策略恢复到安全状态并启用 S3 Block Public Access 以防止再次发生。\n\n为什么其他选项不正确：\n\n立即删除存储桶：删除存储桶会同时销毁证据和客户 PII 数据。事件响应要求保留证据。正确的操作是保护存储桶，而不是销毁它。\n使用 S3 版本控制恢复先前的存储桶策略版本：S3 版本控制适用于存储桶中存储的对象，而不是存储桶策略本身。存储桶策略没有版本控制——无法通过版本控制机制恢复策略的先前版本。"}, {"exam": 1, "id": 4, "question_en": "Your company runs containerized microservices on Amazon ECS with Fargate. GuardDuty Runtime Monitoring has detected a `RuntimeProtection:ECS/MaliciousFile` finding. The affected task is part of a service handling real-time transaction processing.\n \nWhat steps should you take to contain and investigate this threat while maintaining service availability?", "options_en": ["Stop the ECS service immediately to prevent the malicious container from processing any more transactions.", "Update the ECS task definition to use a known-good container image, then force a new deployment to replace the compromised tasks.", "Enable VPC Flow Logs for the ECS cluster VPC to capture network traffic from the malicious container.", "Modify the security group associated with the ECS tasks to block all outbound internet access, isolating the potentially compromised containers."], "correct": 1, "explanation_en": "For compromised ECS containers, the recommended approach is:\n\nIdentify the compromised task and container image\nUpdate the task definition to use a verified clean image\nForce a new deployment, which replaces running tasks with new ones from the clean image\n\n \nThis maintains service availability while replacing compromised containers. Option A and E cause service outages. Option C is useful for investigation but doesn't contain the threat. Option D may disrupt legitimate application functionality and doesn't replace the compromised container.", "question_zh": "您的公司在 Amazon ECS with Fargate 上运行容器化微服务。GuardDuty Runtime Monitoring 检测到了 `RuntimeProtection:ECS/MaliciousFile` 发现项。受影响的任务是处理实时交易处理的服务的一部分。\n\n在保持服务可用性的同时，您应该采取哪些措施来遏制和调查此威胁？", "options_zh": ["立即停止 ECS 服务，以防止恶意容器处理更多交易。", "更新 ECS 任务定义以使用已知良好的容器镜像，然后强制进行新部署以替换受感染的任务。", "为 ECS 集群 VPC 启用 VPC Flow Logs，以捕获来自恶意容器的网络流量。", "修改与 ECS 任务关联的安全组，以阻止所有出站互联网访问，隔离可能受感染的容器。"], "explanation_zh": "对于受感染的 ECS 容器，推荐的方法是：\n\n1. 识别受感染的任务和容器镜像\n2. 更新任务定义以使用经过验证的干净镜像\n3. 强制进行新部署，用干净镜像的新任务替换运行中的任务\n\n这保持了服务可用性，同时替换受感染的容器。选项 A 和 E 会导致服务中断。选项 C 对调查有用但不能遏制威胁。选项 D 可能会干扰合法的应用程序功能，且不能替换受感染的容器。"}, {"exam": 1, "id": 5, "question_en": "A healthcare company subject to HIPAA regulations needs to implement a logging strategy for their AWS environment. Requirements include:\n\nAll API calls must be logged across all AWS accounts\nLogs must be instantly searchable and available for analysis for 90 days\nFor compliance, logs must be restorable for 7 years\nThe solution must be cost-effective\n\n \nWhich approach meets ALL requirements?", "options_en": ["Enable AWS CloudTrail in each account with logs delivered to a centralized S3 bucket. Configure Amazon CloudWatch Logs integration for real-time analysis. Set an S3 lifecycle policy to transition logs to S3 Glacier after 90 days and expire after 7 years.", "Enable AWS CloudTrail in each account with logs delivered to Amazon CloudWatch Logs. Set log retention to 90 days. Export logs to S3 Glacier monthly for 7-year retention.", "Enable AWS CloudTrail in the management account only with organization trail enabled. Deliver logs directly to S3 Glacier for cost savings. Use Athena with S3 Glacier Instant Retrieval for analysis.", "Enable AWS CloudTrail Lake with 90-day retention. Configure event data stores for each account. Export to S3 annually for long-term storage."], "correct": 0, "explanation_en": "The requirements are:\n\nInstantly available for 90 days: S3 Standard with CloudWatch Logs integration enables immediate search and analysis\nRestorable for 7 years: S3 Glacier after 90 days provides cost-effective long-term storage\nAll accounts: Centralized S3 bucket with cross-account CloudTrail delivery\n\n \nOption B loses logs after 90 days in CloudWatch and monthly exports create gaps. Option C delivers directly to Glacier which doesn't allow instant analysis (Glacier has retrieval delays). Option D's CloudTrail Lake has per-query costs that become expensive at scale for 7 years.", "question_zh": "一家受 HIPAA 法规约束的医疗保健公司需要为其 AWS 环境实施日志策略。要求包括：\n\n- 所有 AWS 账户的所有 API 调用都必须记录\n- 日志必须在 90 天内可即时搜索和分析\n- 为了合规，日志必须可恢复保存 7 年\n- 解决方案必须具有成本效益\n\n哪种方法满足所有要求？", "options_zh": ["在每个账户中启用 AWS CloudTrail，将日志传送到集中式 S3 存储桶。配置 Amazon CloudWatch Logs 集成的实时分析。设置 S3 生命周期策略，在 90 天后将日志转换到 S3 Glacier，并在 7 年后过期。", "在每个账户中启用 AWS CloudTrail，将日志传送到 Amazon CloudWatch Logs。将日志保留设置为 90 天。每月将日志导出到 S3 Glacier 以实现 7 年保留。", "仅在管理账户中启用 AWS CloudTrail 并启用组织跟踪。将日志直接传送到 S3 Glacier 以节省成本。使用 Athena 与 S3 Glacier Instant Retrieval 进行分析。", "启用 AWS CloudTrail Lake 并设置 90 天保留。为每个账户配置事件数据存储。每年导出到 S3 进行长期存储。"], "explanation_zh": "要求包括：\n\n- 90 天内即时可用：S3 Standard 配合 CloudWatch Logs 集成可实现即时搜索和分析\n- 可恢复保存 7 年：90 天后转换到 S3 Glacier 提供具有成本效益的长期存储\n- 所有账户：集中式 S3 存储桶配合跨账户 CloudTrail 传送\n\n选项 B 在 CloudWatch 中 90 天后丢失日志，每月导出会产生空白期。选项 C 直接传送到 Glacier，不允许即时分析（Glacier 有检索延迟）。选项 D 的 CloudTrail Lake 在 7 年规模下每次查询费用会变得昂贵。"}, {"exam": 1, "id": 6, "question_en": "A company has implemented a VPC endpoint for AWS KMS with the following endpoint policy:\n \n`{\n \"Statement\": [{\n \"Principal\": \"*\",\n \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\"],\n \"Effect\": \"Allow\",\n \"Resource\": \"arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab\"\n }]\n}`\n \nA developer reports that their Lambda function (which has a key policy allowing `kms:GenerateDataKey` on the same key) is failing with \"Access Denied\" errors when calling `GenerateDataKey`.\n \nWhat is the cause of this failure?", "options_en": ["The VPC endpoint policy does not allow the `kms:GenerateDataKey` action, so the request is denied even though the key policy permits it.", "The Lambda function's IAM role is missing the `kms:ViaService` condition key.", "The KMS key policy must explicitly include the VPC endpoint ID in a condition key.", "VPC endpoints for KMS only support encryption and decryption operations; data key generation must go through the public endpoint."], "correct": 0, "explanation_en": "For a KMS request using a VPC endpoint to succeed, the request must be allowed by BOTH:\n\nThe KMS key policy (or IAM policy/grant)\nThe VPC endpoint policy\n\n \nThe endpoint policy only allows `kms:Encrypt` and `kms:Decrypt`. Even though the key policy allows `kms:GenerateDataKey`, the VPC endpoint policy denies it because `GenerateDataKey` is not in the allowed actions list.\n \nThis is a common pitfall: the VPC endpoint policy acts as an additional authorization layer, not a replacement for key policies.", "question_zh": "一家公司已为 AWS KMS 实施了 VPC 端点，端点策略如下：\n\n`{\"Statement\": [{\"Principal\": \"*\", \"Action\": [\"kms:Encrypt\", \"kms:Decrypt\"], \"Effect\": \"Allow\", \"Resource\": \"arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab\"}]}`\n\n开发人员报告说，他们的 Lambda 函数（其密钥策略允许在同一密钥上使用 `kms:GenerateDataKey`）在调用 `GenerateDataKey` 时出现\"Access Denied\"错误。\n\n此失败的原因是什么？", "options_zh": ["VPC 端点策略不允许 `kms:GenerateDataKey` 操作，因此即使密钥策略允许，请求也会被拒绝。", "Lambda 函数的 IAM 角色缺少 `kms:ViaService` 条件键。", "KMS 密钥策略必须在条件键中显式包含 VPC 端点 ID。", "KMS 的 VPC 端点仅支持加密和解密操作；数据密钥生成必须通过公共端点进行。"], "explanation_zh": "要使使用 VPC 端点的 KMS 请求成功，请求必须同时被以下两者允许：\n\n- KMS 密钥策略（或 IAM 策略/授权）\n- VPC 端点策略\n\n端点策略只允许 `kms:Encrypt` 和 `kms:Decrypt`。即使密钥策略允许 `kms:GenerateDataKey`，VPC 端点策略也会拒绝它，因为 `GenerateDataKey` 不在允许的操作列表中。\n\n这是一个常见的陷阱：VPC 端点策略充当额外的授权层，而不是密钥策略的替代品。"}, {"exam": 1, "id": 7, "question_en": "Your organization requires that all KMS API calls must originate from within your corporate VPCs. You need to create a key policy condition that enforces this requirement. The VPCs have IDs `vpc-11111111` and `vpc-22222222`, and you have a KMS VPC endpoint with ID `vpce-1a2b3c4d`.\n \nWhich condition block correctly restricts KMS key usage to only requests originating from within these VPCs?", "options_en": ["`\"Condition\": {\n \"StringEquals\": {\n \"aws:sourceVpce\": \"vpce-1a2b3c4d\"\n }\n}`", "`\"Condition\": {\n \"StringEquals\": {\n \"aws:sourceVpc\": [\"vpc-11111111\", \"vpc-22222222\"]\n }\n}`", "`\"Condition\": {\n \"IpAddress\": {\n \"aws:sourceIP\": [\"10.0.0.0/8\"]\n }\n}`", "`\"Condition\": {\n \"StringEquals\": {\n \"kms:ViaService\": \"ec2.us-east-1.amazonaws.com\"\n }\n}`"], "correct": 0, "explanation_en": "There are two valid approaches to restrict KMS key access to VPC-only:\n\n`aws:sourceVpce` — restricts to a specific VPC endpoint. Use when you want to ensure requests come through a particular endpoint ID.\n`aws:sourceVpc` — restricts to specific VPCs by ID. Use when you have multiple VPC endpoints across VPCs and want to allow any of them.\n\nBoth condition keys only carry values when a request arrives through a VPC endpoint. Requests from the public internet produce null values, causing the condition to evaluate to false and deny access.\n \nWhy the other options are incorrect:\n\nRestricting by private IP range with `aws:sourceIP`: For requests routed through VPC endpoints, `aws:sourceIP` does not contain the private IP address — it is empty or null. IP-based conditions do not work for VPC endpoint traffic and would not provide the intended restriction.\nUsing `kms:ViaService` with an EC2 service endpoint: `kms:ViaService` restricts key usage to requests that originate from a specific AWS service (e.g., when EC2 calls KMS on your behalf). It does not restrict based on network origin or VPC membership, so it cannot enforce VPC-only access.\n", "question_zh": "您的组织要求所有 KMS API 调用必须来自公司 VPC 内部。您需要创建一个强制执行此要求的密钥策略条件。VPC ID 分别为 `vpc-11111111` 和 `vpc-22222222`，并且您有一个 ID 为 `vpce-1a2b3c4d` 的 KMS VPC 端点。\n\n哪个条件块能正确地将 KMS 密钥使用限制为仅来自这些 VPC 的请求？", "options_zh": ["`\"Condition\": {\"StringEquals\": {\"aws:sourceVpce\": \"vpce-1a2b3c4d\"}}`", "`\"Condition\": {\"StringEquals\": {\"aws:sourceVpc\": [\"vpc-11111111\", \"vpc-22222222\"]}}`", "`\"Condition\": {\"IpAddress\": {\"aws:sourceIP\": [\"10.0.0.0/8\"]}}`", "`\"Condition\": {\"StringEquals\": {\"kms:ViaService\": \"ec2.us-east-1.amazonaws.com\"}}`"], "explanation_zh": "有两种有效的方法可以将 KMS 密钥访问限制为仅 VPC：\n\n- `aws:sourceVpce`——限制到特定的 VPC 端点。当您想确保请求通过特定端点 ID 时使用。\n- `aws:sourceVpc`——按 ID 限制到特定 VPC。当您在多个 VPC 中有多个 VPC 端点并希望允许其中任何一个时使用。\n\n这两个条件键仅在请求通过 VPC 端点到达时才携带值。来自公共互联网的请求产生空值，导致条件评估为 false 并拒绝访问。\n\n为什么其他选项不正确：\n\n使用 `aws:sourceIP` 限制私有 IP 范围：对于通过 VPC 端点路由的请求，`aws:sourceIP` 不包含私有 IP 地址——它为空或 null。基于 IP 的条件不适用于 VPC 端点流量，无法提供预期的限制。\n使用 EC2 服务端点的 `kms:ViaService`：`kms:ViaService` 将密钥使用限制为源自特定 AWS 服务的请求（例如，当 EC2 代表您调用 KMS 时）。它不根据网络来源或 VPC 成员身份进行限制，因此无法强制执行仅 VPC 访问。"}, {"exam": 1, "id": 8, "question_en": "A startup is designing their encryption strategy for AWS. They have three distinct use cases:\n \n\nUse Case A: Encrypt S3 objects with minimal operational overhead; they don't need to manage keys or audit key usage.\nUse Case B: Encrypt RDS databases with keys they can audit, rotate automatically, and use across multiple AWS services; they need CloudTrail logs of key usage.\nUse Case C: Protect highly sensitive data with keys where they control the key material, can set expiration dates, and can delete the key material at any time to render data unrecoverable.\n\n \nWhich key types should be used for each use case?", "options_en": ["Use Case A: AWS owned keys, Use Case B: AWS managed keys, Use Case C: Customer managed keys with imported key material", "Use Case A: AWS managed keys, Use Case B: Customer managed keys, Use Case C: AWS owned keys", "Use Case A: SSE-S3, Use Case B: SSE-KMS with AWS managed key, Use Case C: Customer managed keys", "Use Case A: Customer managed keys, Use Case B: AWS managed keys, Use Case C: AWS owned keys"], "correct": 0, "explanation_en": "The correct mapping is AWS owned keys → AWS managed keys → Customer managed keys with imported key material.\n \n\nUse Case A (minimal overhead, no audit required) → AWS owned keys. AWS owned keys are fully managed by AWS with zero operational overhead, no monthly cost, and no CloudTrail visibility into key usage — exactly what this use case requires. In the S3 context, this is what SSE-S3 uses under the hood. The question asks for key types, so \"AWS owned keys\" is the correct answer; SSE-S3 is an encryption method, not a key type.\nUse Case B (audit, automatic rotation, multi-service, CloudTrail) → AWS managed keys. AWS managed keys (e.g., `aws/rds`) are created and managed by AWS in your account. They appear in CloudTrail, rotate automatically every year, and can be used across AWS services — all with low operational overhead and no key management cost.\nUse Case C (control key material, set expiration, render data unrecoverable) → Customer managed keys with imported key material. Importing your own key material is the only way to set an expiration date on the key material and delete it on demand. Deleting the imported material immediately renders all data encrypted with it permanently unrecoverable — this level of control is not possible with AWS owned or AWS managed keys.\n\n \nWhy the SSE-S3 / SSE-KMS option is incorrect: It mixes S3 encryption methods (SSE-S3, SSE-KMS) with a KMS key type (Customer managed keys) in the same list. These are different layers of the stack and cannot be compared like-for-like. SSE-S3 is a valid S3 encryption method for Use Case A, but it is implemented using AWS owned keys — making the \"AWS owned keys\" answer both more precise and more consistent in terminology.", "question_zh": "一家初创公司正在为其 AWS 设计加密策略。他们有三个不同的用例：\n\n- 用例 A：加密 S3 对象，运营开销最小；不需要管理密钥或审计密钥使用。\n- 用例 B：加密 RDS 数据库，密钥可审计、可自动轮换，并可跨多个 AWS 服务使用；需要密钥使用的 CloudTrail 日志。\n- 用例 C：保护高度敏感数据，密钥可控制密钥材料、可设置过期日期，并可在任何时候删除密钥材料以使数据不可恢复。\n\n每个用例应该使用哪种密钥类型？", "options_zh": ["用例 A：AWS owned keys，用例 B：AWS managed keys，用例 C：具有导入密钥材料的 Customer managed keys", "用例 A：AWS managed keys，用例 B：Customer managed keys，用例 C：AWS owned keys", "用例 A：SSE-S3，用例 B：SSE-KMS 配合 AWS managed key，用例 C：Customer managed keys", "用例 A：Customer managed keys，用例 B：AWS managed keys，用例 C：AWS owned keys"], "explanation_zh": "正确的映射是 AWS owned keys → AWS managed keys → 具有导入密钥材料的 Customer managed keys。\n\n- 用例 A（最小开销，无需审计）→ AWS owned keys。AWS owned keys 完全由 AWS 管理，零运营开销，无月度费用，且无 CloudTrail 可见性查看密钥使用情况——正是此用例所需。在 S3 上下文中，这是 SSE-S3 底层使用的密钥类型。问题要求的是密钥类型，因此\"AWS owned keys\"是正确答案；SSE-S3 是一种加密方法，不是密钥类型。\n- 用例 B（审计、自动轮换、多服务、CloudTrail）→ AWS managed keys。AWS managed keys（如 `aws/rds`）由 AWS 在您的账户中创建和管理。它们会出现在 CloudTrail 中，每年自动轮换，并可跨 AWS 服务使用——所有这些都具有低运营开销且无需密钥管理费用。\n- 用例 C（控制密钥材料、设置过期时间、使数据不可恢复）→ 具有导入密钥材料的 Customer managed keys。导入自己的密钥材料是唯一可以设置密钥材料过期日期并可按需删除的方法。删除导入的材料会立即使所有用其加密的数据永久不可恢复——这种控制级别是 AWS owned keys 或 AWS managed keys 无法实现的。\n\n为什么 SSE-S3 / SSE-KMS 选项不正确：它将 S3 加密方法（SSE-S3、SSE-KMS）与 KMS 密钥类型（Customer managed keys）混合在同一列表中。这些是不同层次的堆栈，无法进行同类比较。SSE-S3 是用例 A 的有效 S3 加密方法，但它是使用 AWS owned keys 实现的——使\"AWS owned keys\"答案更加精确且术语更加一致。"}, {"exam": 1, "id": 9, "question_en": "Your company's security policy requires that all encryption keys used in AWS must use key material generated by your on-premises HSM. You need to create a KMS key with imported key material for encrypting data in Amazon S3.\n \nWhat is the CORRECT sequence of steps to create a KMS key with imported key material?", "options_en": ["1) Generate key material on your HSM, 2) Create a KMS key with origin AWS_KMS, 3) Import the key material, 4) Enable the key", "1) Create a KMS key with origin EXTERNAL, 2) Download the wrapping public key and import token, 3) Encrypt the key material using the wrapping public key, 4) Import the encrypted key material with the import token", "1) Create a KMS key with origin EXTERNAL, 2) Generate a CSR (Certificate Signing Request), 3) Have your HSM sign the CSR, 4) Upload the signed certificate to complete the import", "1) Download the KMS wrapping key from AWS, 2) Create key material on your HSM, 3) Create a KMS key with origin EXTERNAL, 4) Import the wrapped key material"], "correct": 1, "explanation_en": "The correct sequence for importing key material is:\n \n\nCreate a KMS key with no key material - Origin must be `EXTERNAL` (this prevents AWS from generating key material)\nDownload the wrapping public key and import token - The wrapping key protects your key material in transit; the import token binds the import to your specific KMS key\nEncrypt your key material - Use the downloaded wrapping public key to encrypt your key material generated externally\nImport the key material - Upload the encrypted key material along with the import token\n\n \nOption A is incorrect because origin must be EXTERNAL, not AWS_KMS. Option C describes certificate-based authentication, not key import. Option D has steps out of order (you must create the KMS key first to get the wrapping key specific to that key).", "question_zh": "您公司的安全策略要求 AWS 中使用的所有加密密钥必须使用本地 HSM 生成的密钥材料。您需要创建一个具有导入密钥材料的 KMS 密钥，用于加密 Amazon S3 中的数据。\n\n创建具有导入密钥材料的 KMS 密钥的正确步骤顺序是什么？", "options_zh": ["1) 在 HSM 上生成密钥材料，2) 创建 origin 为 AWS_KMS 的 KMS 密钥，3) 导入密钥材料，4) 启用密钥", "1) 创建 origin 为 EXTERNAL 的 KMS 密钥，2) 下载包装公钥和导入令牌，3) 使用包装公钥加密密钥材料，4) 使用导入令牌导入加密的密钥材料", "1) 创建 origin 为 EXTERNAL 的 KMS 密钥，2) 生成 CSR（证书签名请求），3) 让 HSM 签署 CSR，4) 上传签名的证书以完成导入", "1) 从 AWS 下载 KMS 包装密钥，2) 在 HSM 上创建密钥材料，3) 创建 origin 为 EXTERNAL 的 KMS 密钥，4) 导入包装的密钥材料"], "explanation_zh": "导入密钥材料的正确顺序是：\n\n1. 创建无密钥材料的 KMS 密钥——Origin 必须为 `EXTERNAL`（这可以防止 AWS 生成密钥材料）\n2. 下载包装公钥和导入令牌——包装密钥在传输中保护您的密钥材料；导入令牌将导入绑定到您的特定 KMS 密钥\n3. 加密您的密钥材料——使用下载的包装公钥加密外部生成的密钥材料\n4. 导入密钥材料——上传加密的密钥材料以及导入令牌\n\n选项 A 不正确，因为 origin 必须是 EXTERNAL，而不是 AWS_KMS。选项 C 描述了基于证书的身份验证，而不是密钥导入。选项 D 的步骤顺序错误（您必须先创建 KMS 密钥才能获取特定于该密钥的包装密钥）。"}, {"exam": 1, "id": 10, "question_en": "You have created a KMS key with imported key material and set an expiration date. The key is used to encrypt objects in an S3 bucket. The expiration date has now passed.\n \nWhich statement CORRECTLY describes what happens when imported key material expires?", "options_en": ["The encrypted S3 objects are automatically re-encrypted with a new AWS-generated key.", "The KMS key's key state changes to `PendingImport` and cannot be used for cryptographic operations.", "The key material and all associated key metadata are permanently deleted by AWS KMS; you must create a new KMS key to restore access.", "The S3 objects remain encrypted but become permanently inaccessible."], "correct": 1, "explanation_en": "When imported key material expires, AWS KMS deletes the key material but preserves the KMS key itself — the key ID, ARN, key policy, and all metadata remain intact. The key state transitions to `PendingImport`, which means the key cannot be used for any cryptographic operation (encrypt, decrypt, generate data key, etc.) until key material is reimported. The S3 objects remain encrypted and are temporarily inaccessible, but access can be fully restored by reimporting the original key material. Importing different key material will not work because the ciphertext was generated with the original material and the two will not match.\n \nWhy the other options are incorrect:\n\nS3 automatically re-encrypts with a new AWS-generated key: S3 has no mechanism to automatically re-encrypt objects when a KMS key becomes unavailable. The objects remain as-is, still encrypted with the original key material's ciphertext.\nKey metadata is permanently deleted and a new KMS key is required: AWS KMS does not delete the key metadata, ARN, or policies on expiration — only the key material is removed. Because the key itself persists, you can reimport the same key material and restore full functionality without creating a new key or re-encrypting any data.\nS3 objects become permanently inaccessible: The inaccessibility is temporary, not permanent. Once the original key material is reimported, the key returns to the Enabled state and all previously encrypted objects can be decrypted normally.\n", "question_zh": "您已创建了一个具有导入密钥材料的 KMS 密钥并设置了过期日期。该密钥用于加密 S3 存储桶中的对象。过期日期现已过去。\n\n以下哪个陈述正确描述了导入密钥材料过期时发生的情况？", "options_zh": ["加密的 S3 对象会自动使用新的 AWS 生成的密钥重新加密。", "KMS 密钥的密钥状态更改为 `PendingImport`，无法用于加密操作。", "密钥材料和所有关联的密钥元数据被 AWS KMS 永久删除；您必须创建新的 KMS 密钥才能恢复访问。", "S3 对象保持加密状态但变得永久不可访问。"], "explanation_zh": "当导入的密钥材料过期时，AWS KMS 删除密钥材料但保留 KMS 密钥本身——密钥 ID、ARN、密钥策略和所有元数据保持不变。密钥状态转换为 `PendingImport`，这意味着密钥不能用于任何加密操作（加密、解密、生成数据密钥等），直到重新导入密钥材料。S3 对象保持加密状态并暂时不可访问，但通过重新导入原始密钥材料可以完全恢复访问。导入不同的密钥材料将不起作用，因为密文是用原始材料生成的，两者不会匹配。\n\n为什么其他选项不正确：\n\nS3 自动使用新的 AWS 生成的密钥重新加密：S3 没有在 KMS 密钥不可用时自动重新加密对象的机制。对象保持原样，仍然使用原始密钥材料的密文加密。\n密钥元数据被永久删除，需要新的 KMS 密钥：AWS KMS 在过期时不会删除密钥元数据、ARN 或策略——只有密钥材料被移除。由于密钥本身持续存在，您可以重新导入相同的密钥材料并恢复全部功能，无需创建新密钥或重新加密任何数据。\nS3 对象变得永久不可访问：不可访问是暂时的，不是永久的。一旦原始密钥材料被重新导入，密钥将返回 Enabled 状态，所有先前加密的对象都可以正常解密。"}, {"exam": 1, "id": 11, "question_en": "A company is building an API that requires message authentication to prevent tampering. They want to use AWS KMS to generate and verify HMAC tags for API requests without exposing the secret key to their application code.\n \nWhich statement about HMAC KMS keys is TRUE?", "options_en": ["HMAC KMS keys can be used for both encryption and message authentication.", "The HMAC key material never leaves AWS KMS unencrypted, and you generate and verify HMAC tags by calling KMS APIs.", "HMAC KMS keys support automatic annual rotation like symmetric encryption keys.", "You can import your own HMAC key material into a KMS key with origin set to EXTERNAL."], "correct": 1, "explanation_en": "HMAC KMS keys are designed so the key material never leaves AWS KMS unencrypted. Your application never has direct access to the secret key — instead, you call the `GenerateMac` API to produce an HMAC tag and the `VerifyMac` API to verify it. This satisfies the requirement of generating and verifying HMAC tags without exposing the secret key to application code.\n \nWhy the other options are incorrect:\n\nHMAC KMS keys can be used for both encryption and message authentication: False. HMAC KMS keys are exclusively for message authentication (MAC generation and verification). They cannot perform encryption or decryption — that requires a symmetric or asymmetric KMS key.\nHMAC KMS keys support automatic annual rotation like symmetric encryption keys: False. HMAC KMS keys do not support automatic key rotation. Symmetric customer managed keys support automatic rotation, but HMAC keys do not.\nYou can import your own HMAC key material into a KMS key with origin set to EXTERNAL: False. HMAC KMS keys do not support imported key material. The origin for HMAC keys must be `AWS_KMS`; you cannot set the origin to `EXTERNAL`.\n", "question_zh": "一家公司正在构建一个需要消息认证以防止篡改的 API。他们希望使用 AWS KMS 生成和验证 API 请求的 HMAC 标签，而不将密钥暴露给应用程序代码。\n\n关于 HMAC KMS 密钥，哪个陈述是正确的？", "options_zh": ["HMAC KMS 密钥可用于加密和消息认证。", "HMAC 密钥材料永远不会以未加密形式离开 AWS KMS，您通过调用 KMS API 来生成和验证 HMAC 标签。", "HMAC KMS 密钥支持像对称加密密钥一样的自动年度轮换。", "您可以将自己的 HMAC 密钥材料导入到 origin 设置为 EXTERNAL 的 KMS 密钥中。"], "explanation_zh": "HMAC KMS 密钥的设计确保密钥材料永远不会以未加密形式离开 AWS KMS。您的应用程序永远无法直接访问密钥——相反，您调用 `GenerateMac` API 来生成 HMAC 标签，调用 `VerifyMac` API 来验证它。这满足了在不将密钥暴露给应用程序代码的情况下生成和验证 HMAC 标签的要求。\n\n为什么其他选项不正确：\n\nHMAC KMS 密钥可用于加密和消息认证：错误。HMAC KMS 密钥专门用于消息认证（MAC 生成和验证）。它们不能执行加密或解密——这需要对称或非对称 KMS 密钥。\nHMAC KMS 密钥支持像对称加密密钥一样的自动年度轮换：错误。HMAC KMS 密钥不支持自动密钥轮换。对称 customer managed keys 支持自动轮换，但 HMAC 密钥不支持。\n您可以将自己的 HMAC 密钥材料导入到 origin 设置为 EXTERNAL 的 KMS 密钥中：错误。HMAC KMS 密钥不支持导入的密钥材料。HMAC 密钥的 origin 必须是 `AWS_KMS`；您不能将 origin 设置为 `EXTERNAL`。"}, {"exam": 1, "id": 12, "question_en": "Your company uses a single-region KMS key with imported key material for encrypting sensitive data. Due to a compliance audit, you need to perform an immediate key rotation. The key currently encrypts data in DynamoDB and S3.\n \nHow should you perform on-demand rotation for this KMS key?", "options_en": ["Call the `RotateKeyOnDemand` API, which will automatically generate new key material and maintain the old material for decryption.", "Generate new key material externally, download a new wrapping public key and import token, encrypt the new key material, and call `ImportKeyMaterial` with the new material.", "Delete the imported key material using `DeleteImportedKeyMaterial`, then import new key material using the same import token you used originally.", "Create a new KMS key with new imported key material, update your applications to use the new key, and re-encrypt all existing data with the new key."], "correct": 1, "explanation_en": "For a single-region KMS key with imported key material, on-demand rotation works as follows:\n \n\nGenerate new key material on your external system\nDownload a NEW wrapping public key and import token (you must get fresh ones)\nEncrypt the new key material with the wrapping public key\nCall `ImportKeyMaterial` with the new encrypted key material and import token\n\n \nAWS KMS will add the new key material as a rotation, maintaining the old key material for decrypting existing ciphertext. The key ID and ARN remain the same.\n \nOption A is incorrect because `RotateKeyOnDemand` generates AWS key material, which isn't allowed for imported key material keys. Option C is incorrect because you need a new import token (the old one expires). Option D is manual re-encryption which is unnecessary and complex.", "question_zh": "您的公司使用具有导入密钥材料的单区域 KMS 密钥来加密敏感数据。由于合规审计，您需要执行即时密钥轮换。该密钥当前加密 DynamoDB 和 S3 中的数据。\n\n您应该如何对此 KMS 密钥执行按需轮换？", "options_zh": ["调用 `RotateKeyOnDemand` API，它将自动生成新的密钥材料并保留旧材料用于解密。", "在外部生成新的密钥材料，下载新的包装公钥和导入令牌，加密新的密钥材料，然后使用新材料调用 `ImportKeyMaterial`。", "使用 `DeleteImportedKeyMaterial` 删除导入的密钥材料，然后使用最初使用的同一导入令牌导入新的密钥材料。", "创建具有新导入密钥材料的新 KMS 密钥，更新应用程序以使用新密钥，并使用新密钥重新加密所有现有数据。"], "explanation_zh": "对于具有导入密钥材料的单区域 KMS 密钥，按需轮换的工作方式如下：\n\n1. 在外部系统上生成新的密钥材料\n2. 下载新的包装公钥和导入令牌（必须获取全新的）\n3. 使用包装公钥加密新的密钥材料\n4. 使用新的加密密钥材料和导入令牌调用 `ImportKeyMaterial`\n\nAWS KMS 将添加新的密钥材料作为轮换，保留旧的密钥材料用于解密现有密文。密钥 ID 和 ARN 保持不变。\n\n选项 A 不正确，因为 `RotateKeyOnDemand` 生成 AWS 密钥材料，这对于导入密钥材料的密钥是不允许的。选项 C 不正确，因为您需要新的导入令牌（旧令牌已过期）。选项 D 是手动重新加密，不必要且复杂。"}, {"exam": 1, "id": 13, "question_en": "Your organization uses a multi-region KMS key with imported key material, with the primary key in `us-east-1` and replica keys in `eu-west-1` and `ap-southeast-1`. You need to rotate the key material across all regions.\n \nWhat is the CORRECT approach for rotating key material on multi-region keys with imported key material?", "options_en": ["Rotate the key material on the primary key in `us-east-1`; the new key material will automatically replicate to all replica keys.", "Import new key material to each regional key independently—primary and all replicas require separate import operations with the same key material.", "Delete all replica keys, rotate the primary key material, then recreate the replicas, which will inherit the new key material.", "Multi-region keys with imported key material do not support rotation; you must create a new multi-region key set."], "correct": 1, "explanation_en": "For multi-region KMS keys with imported key material:\n \n\nKey material is NOT automatically replicated between primary and replica keys\nYou must import the same key material to each key (primary and all replicas) independently\nEach import requires its own wrapping public key and import token from that specific regional key\n\n \nThis is different from multi-region keys with AWS-generated key material, where the key material is automatically synchronized.\n \nImportant: You must ensure you import the exact same key material to all related multi-region keys, or they won't be able to decrypt each other's ciphertext.", "question_zh": "您的组织使用具有导入密钥材料的多区域 KMS 密钥，主密钥在 `us-east-1`，副本密钥在 `eu-west-1` 和 `ap-southeast-1`。您需要在所有区域轮换密钥材料。\n\n轮换具有导入密钥材料的多区域密钥材料的正确方法是什么？", "options_zh": ["在 `us-east-1` 中的主密钥上轮换密钥材料；新的密钥材料将自动复制到所有副本密钥。", "独立地向每个区域密钥导入新的密钥材料——主密钥和所有副本都需要使用相同密钥材料的单独导入操作。", "删除所有副本密钥，轮换主密钥材料，然后重新创建副本，这些副本将继承新的密钥材料。", "具有导入密钥材料的多区域密钥不支持轮换；您必须创建新的多区域密钥集。"], "explanation_zh": "对于具有导入密钥材料的多区域 KMS 密钥：\n\n- 密钥材料不会在主密钥和副本密钥之间自动复制\n- 您必须独立地向每个密钥（主密钥和所有副本）导入相同的密钥材料\n- 每次导入需要从该特定区域密钥获取自己的包装公钥和导入令牌\n\n这与具有 AWS 生成的密钥材料的多区域密钥不同，后者的密钥材料是自动同步的。\n\n重要提示：您必须确保向所有关联的多区域密钥导入完全相同的密钥材料，否则它们将无法解密彼此的密文。"}, {"exam": 1, "id": 14, "question_en": "Your security team at a healthcare company needs to implement different key rotation strategies for various KMS keys. They have three requirements: (1) a customer managed key that rotates every 180 days automatically, (2) an asymmetric signing key that needs rotation, and (3) a symmetric key that must be rotated immediately due to a security incident.\n \nWhich combination of rotation approaches correctly addresses all three requirements?", "options_en": ["Requirement 1: Enable automatic rotation with custom period; Requirement 2: Enable automatic rotation; Requirement 3: Call `RotateKeyOnDemand` API", "Requirement 1: Enable automatic rotation with custom period; Requirement 2: Manual rotation by creating new key; Requirement 3: Call `RotateKeyOnDemand` API", "Requirement 1: Schedule AWS Lambda to call `RotateKeyOnDemand` every 180 days; Requirement 2: Enable automatic rotation; Requirement 3: Manual rotation by creating new key", "Requirement 1: Enable automatic rotation (annual only); Requirement 2: On-demand rotation; Requirement 3: Manual rotation with alias update"], "correct": 1, "explanation_en": "Each requirement maps to a distinct KMS rotation mechanism:\n \n\nRequirement 1 (symmetric CMK, 180-day automatic rotation): Automatic rotation with a custom period. AWS KMS natively supports custom rotation periods from 90 to 2560 days for symmetric encryption keys — no Lambda scheduling required.\nRequirement 2 (asymmetric signing key rotation): Manual rotation by creating a new KMS key and updating aliases or application references. Automatic rotation and on-demand rotation (`RotateKeyOnDemand`) are only available for symmetric encryption keys. Asymmetric keys, HMAC keys, and keys in custom key stores must always be rotated manually.\nRequirement 3 (immediate rotation of symmetric key after security incident): Call the `RotateKeyOnDemand` API. This triggers an immediate rotation outside the scheduled automatic rotation cycle, which is the correct tool for unplanned, urgent rotations.\n\n \nWhy the other options are incorrect:\n\nEnabling automatic rotation for the asymmetric signing key: Automatic rotation is not supported for asymmetric keys. Any option that proposes enabling automatic rotation for Requirement 2 is incorrect.\nUsing Lambda to call `RotateKeyOnDemand` every 180 days for Requirement 1: This is unnecessary complexity. AWS KMS has native automatic rotation with a configurable period — there is no need to build a Lambda-based scheduler to achieve what the service already does natively.\nClaiming automatic rotation is annual-only: This was true historically but is no longer accurate. AWS KMS now supports custom rotation periods between 90 and 2560 days.\nUsing on-demand rotation for the asymmetric key: `RotateKeyOnDemand` only works for symmetric encryption keys, not asymmetric keys.\n", "question_zh": "您的医疗保健公司安全团队需要为各种 KMS 密钥实施不同的密钥轮换策略。他们有三个要求：(1) 一个每 180 天自动轮换的 customer managed key，(2) 一个需要轮换的非对称签名密钥，以及 (3) 一个因安全事件必须立即轮换的对称密钥。\n\n哪种轮换方法组合能正确满足所有三个要求？", "options_zh": ["要求 1：启用自定义周期的自动轮换；要求 2：启用自动轮换；要求 3：调用 `RotateKeyOnDemand` API", "要求 1：启用自定义周期的自动轮换；要求 2：通过创建新密钥进行手动轮换；要求 3：调用 `RotateKeyOnDemand` API", "要求 1：安排 AWS Lambda 每 180 天调用 `RotateKeyOnDemand`；要求 2：启用自动轮换；要求 3：通过创建新密钥进行手动轮换", "要求 1：启用自动轮换（仅年度）；要求 2：按需轮换；要求 3：使用别名更新进行手动轮换"], "explanation_zh": "每个要求映射到不同的 KMS 轮换机制：\n\n- 要求 1（对称 CMK，180 天自动轮换）：自定义周期的自动轮换。AWS KMS 原生支持对称加密密钥从 90 天到 2560 天的自定义轮换周期——无需 Lambda 调度。\n- 要求 2（非对称签名密钥轮换）：通过创建新的 KMS 密钥并更新别名或应用程序引用进行手动轮换。自动轮换和按需轮换（`RotateKeyOnDemand`）仅适用于对称加密密钥。非对称密钥、HMAC 密钥和自定义密钥存储中的密钥始终必须手动轮换。\n- 要求 3（安全事件后对称密钥的立即轮换）：调用 `RotateKeyOnDemand` API。这会在计划的自动轮换周期之外触发立即轮换，这是应对非计划紧急轮换的正确工具。\n\n为什么其他选项不正确：\n\n为非对称签名密钥启用自动轮换：自动轮换不支持非对称密钥。任何提议为要求 2 启用自动轮换的选项都是不正确的。\n使用 Lambda 每 180 天调用 `RotateKeyOnDemand` 用于要求 1：这是不必要的复杂性。AWS KMS 有原生自动轮换和可配置周期——无需构建基于 Lambda 的调度器来实现服务已经原生提供的功能。\n声称自动轮换仅为年度：这在历史上是正确的但已不再准确。AWS KMS 现在支持 90 天到 2560 天之间的自定义轮换周期。\n为非对称密钥使用按需轮换：`RotateKeyOnDemand` 仅适用于对称加密密钥，不适用于非对称密钥。"}, {"exam": 1, "id": 15, "question_en": "A global financial services company uses AWS KMS multi-region keys with imported key material for encrypting customer data. The primary key is in `us-east-1` with replicas in `eu-west-1` and `ap-southeast-1`. They need to rotate the key material across all regions while maintaining cross-region decryption capabilities.\n \nWhat is the correct approach for rotating key material on these multi-region keys?", "options_en": ["Rotate the key material on the primary key in `us-east-1` using `ImportKeyMaterial`; AWS KMS automatically synchronizes the new key material to all replica keys within 24 hours.", "Download wrapping keys and import tokens for each regional key separately, then import the same key material to the primary and each replica independently using separate import operations.", "Use the `SynchronizeMultiRegionKey` API after importing new key material to the primary key to force replication of the key material to all replicas.", "Delete all replica keys, import new key material to the primary key, then recreate replicas which will automatically inherit the new key material from the primary."], "correct": 1, "explanation_en": "For multi-region KMS keys with external (imported) key material, key material is NOT automatically replicated between the primary and replica keys — this is a critical distinction from multi-region keys with AWS-generated key material. Each regional key (primary and every replica) requires its own separate import operation. The correct process is to download a unique wrapping key and import token for each regional key, encrypt the same key material with that region's wrapping key, and then import it using `ImportKeyMaterial` for each key independently. Importing identical key material to all regional keys is essential — if the material differs, the keys will not be able to decrypt each other's ciphertext, breaking cross-region functionality.\n \nWhy the other options are incorrect:\n\nImporting key material to the primary key only and relying on automatic synchronization to replicas: Key material is never automatically synchronized for external-origin multi-region keys. Automatic replication applies only to multi-region keys whose key material is generated by AWS KMS, not to imported material.\nUsing the `SynchronizeMultiRegionKey` API after importing to the primary: The `SynchronizeMultiRegionKey` API synchronizes key metadata (such as key policies and tags) between the primary and replica keys — it does not replicate or transfer key material.\nDeleting all replica keys, importing to the primary, then recreating replicas: This approach is unnecessary and destructive. Deleting replica keys causes service disruption in those regions and is not required. Each regional key can be updated with new imported material in place without deletion.\n", "question_zh": "一家全球金融服务公司使用具有导入密钥材料的 AWS KMS 多区域密钥来加密客户数据。主密钥在 `us-east-1`，副本在 `eu-west-1` 和 `ap-southeast-1`。他们需要在所有区域轮换密钥材料，同时保持跨区域解密能力。\n\n在这些多区域密钥上轮换密钥材料的正确方法是什么？", "options_zh": ["在 `us-east-1` 的主密钥上使用 `ImportKeyMaterial` 轮换密钥材料；AWS KMS 会在 24 小时内自动将新密钥材料同步到所有副本密钥。", "为每个区域密钥分别下载包装密钥和导入令牌，然后使用单独的导入操作独立地向主密钥和每个副本导入相同的密钥材料。", "在向主密钥导入新密钥材料后使用 `SynchronizeMultiRegionKey` API 强制将密钥材料复制到所有副本。", "删除所有副本密钥，向主密钥导入新密钥材料，然后重新创建副本，这些副本将自动从主密钥继承新密钥材料。"], "explanation_zh": "对于具有外部（导入）密钥材料的多区域 KMS 密钥，密钥材料不会在主密钥和副本密钥之间自动复制——这是与具有 AWS 生成的密钥材料的多区域密钥的关键区别。每个区域密钥（主密钥和每个副本）都需要自己的单独导入操作。正确的过程是为每个区域密钥下载唯一的包装密钥和导入令牌，使用该区域的包装密钥加密相同的密钥材料，然后使用 `ImportKeyMaterial` 为每个密钥独立导入。向所有区域密钥导入相同的密钥材料至关重要——如果材料不同，密钥将无法解密彼此的密文，破坏跨区域功能。\n\n为什么其他选项不正确：\n\n仅向主密钥导入密钥材料并依赖自动同步到副本：外部来源多区域密钥的密钥材料永远不会自动同步。自动复制仅适用于密钥材料由 AWS KMS 生成的多区域密钥，不适用于导入的材料。\n向主密钥导入后使用 `SynchronizeMultiRegionKey` API：`SynchronizeMultiRegionKey` API 在主密钥和副本密钥之间同步密钥元数据（如密钥策略和标签）——它不复制或传输密钥材料。\n删除所有副本密钥，向主密钥导入，然后重新创建副本：这种方法不必要且具有破坏性。删除副本密钥会导致这些区域的服务中断，并且不是必需的。每个区域密钥可以在不删除的情况下原地更新新的导入材料。"}, {"exam": 1, "id": 16, "question_en": "Your company's primary AWS region is `us-east-1`, but due to data residency regulations, you need to change the primary region for a multi-region KMS key to `eu-central-1`. The key currently has the primary in `us-east-1` and replicas in `eu-central-1`, `eu-west-1`, and `ap-southeast-1`.\n \nWhat is the MOST important consideration when changing the primary region?", "options_en": ["Update applications to use the new key ID since the key ARN will change to reflect the new primary region.", "Ensure both the current primary key and the replica key being promoted are in the Enabled state before starting the operation.", "Delete and recreate all replica keys in other regions after the primary region change completes.", "The key material and key ID will change after updating the primary region, requiring data re-encryption."], "correct": 1, "explanation_en": "The most critical requirement when calling `UpdatePrimaryRegion` is that both the current primary key and the replica key being promoted must be in the Enabled state before the operation begins. This is a hard prerequisite — the API call will fail if either key is disabled, pending deletion, or in any other non-enabled state. The operation is asynchronous and may take time to complete, after which the regional replica becomes the new primary and the former primary becomes a replica.\n \nWhy the other options are incorrect:\n\nApplications need to update to the new key ID because the ARN changes: False on both counts. Multi-region keys share the same key ID across all regions (the key ID portion of the ARN is identical). The ARN does change its region segment to reflect the new primary region, but the key ID itself does not change, and applications using the key ID directly are unaffected.\nAll replica keys in other regions must be deleted and recreated after the primary region change: False. The primary region change only affects which regional key holds the primary designation. All other replicas remain intact and continue functioning. No deletion or recreation is needed.\nThe key material and key ID will change, requiring data re-encryption: False. The key material is identical across all regional copies of a multi-region key — that is the defining characteristic of multi-region keys. No re-encryption is needed, and no data becomes inaccessible after changing the primary region.\n", "question_zh": "您公司的主要 AWS 区域是 `us-east-1`，但由于数据驻留法规，您需要将多区域 KMS 密钥的主要区域更改为 `eu-central-1`。该密钥当前在 `us-east-1` 有主密钥，在 `eu-central-1`、`eu-west-1` 和 `ap-southeast-1` 有副本。\n\n更改主要区域时最重要的考虑因素是什么？", "options_zh": ["更新应用程序以使用新的密钥 ID，因为密钥 ARN 将更改以反映新的主要区域。", "在开始操作之前，确保当前主密钥和被提升的副本密钥都处于 Enabled 状态。", "主要区域更改完成后，删除并重新创建其他区域中的所有副本密钥。", "更新主要区域后，密钥材料和密钥 ID 将更改，需要重新加密数据。"], "explanation_zh": "调用 `UpdatePrimaryRegion` 时最关键的要求是当前主密钥和被提升的副本密钥都必须在操作开始前处于 Enabled 状态。这是一个硬性先决条件——如果任一密钥被禁用、待删除或处于任何其他非启用状态，API 调用将失败。该操作是异步的，可能需要时间完成，之后区域副本成为新的主密钥，而原来的主密钥成为副本。\n\n为什么其他选项不正确：\n\n应用程序需要更新到新密钥 ID 因为 ARN 更改：两个说法都错误。多区域密钥在所有区域共享相同的密钥 ID（ARN 的密钥 ID 部分相同）。ARN 确实改变了其区域段以反映新的主要区域，但密钥 ID 本身不改变，直接使用密钥 ID 的应用程序不受影响。\n主要区域更改后必须删除并重新创建所有其他区域的副本密钥：错误。主要区域更改仅影响哪个区域密钥持有主密钥指定。所有其他副本保持完整并继续运行。不需要删除或重新创建。\n密钥材料和密钥 ID 将更改，需要重新加密数据：错误。密钥材料在多区域密钥的所有区域副本中都是相同的——这是多区域密钥的定义特征。不需要重新加密，且更改主要区域后没有数据变得不可访问。"}, {"exam": 1, "id": 17, "question_en": "A Security Engineer discovers that a KMS key used by multiple applications was accidentally scheduled for deletion with the minimum 7-day waiting period. The key encrypts data in DynamoDB, S3, and EBS volumes. It's now day 5 of the waiting period.\n \nWhich statement is TRUE about this situation?", "options_en": ["The key can still be used for decryption operations during the waiting period, but not encryption operations.", "AWS KMS will not automatically rotate the key material while it's in the \"Pending deletion\" state.", "For asymmetric keys, the `GetPublicKey` API remains available during the waiting period so external parties can still encrypt data using the public key.", "All encrypted data (DynamoDB, S3, EBS) will be automatically re-encrypted with a different key before the deletion completes."], "correct": 1, "explanation_en": "When a KMS key is in the Pending deletion state, AWS KMS suspends all key management operations on it — including automatic key rotation. Key rotation cannot occur for a key that is scheduled to be deleted, so no new key material is generated during the waiting period. This is the only statement that is unambiguously true.\n \nWhy the other options are incorrect:\n\nThe key can be used for decryption but not encryption during the waiting period: False. A key in the Pending deletion state cannot be used for any cryptographic operation — neither encryption nor decryption. All KMS API calls that require the key to be in an enabled state (Encrypt, Decrypt, GenerateDataKey, etc.) return a `KMSInvalidStateException`.\n`GetPublicKey` remains available during the waiting period: False. The Pending deletion state blocks all KMS API operations, including `GetPublicKey`. Any attempt to call it returns a `KMSInvalidStateException`. Note that if a party already downloaded the public key before the deletion was scheduled, they could use it externally — but the API itself is not available during the waiting period.\nEncrypted data is automatically re-encrypted before deletion completes: False. AWS KMS never automatically re-encrypts data. If the key is deleted, all data encrypted with it becomes permanently undecryptable. This is precisely why the waiting period exists — to give teams time to identify dependencies and cancel the deletion via `CancelKeyDeletion` if needed. Note that cancellation restores the key to Disabled state, not Enabled; it must be manually re-enabled.\n", "question_zh": "一名安全工程师发现多个应用程序使用的 KMS 密钥被意外安排了删除，等待期为最低的 7 天。该密钥加密了 DynamoDB、S3 和 EBS 卷中的数据。现在已是等待期的第 5 天。\n\n关于这种情况，哪个陈述是正确的？", "options_zh": ["在等待期内，密钥仍可用于解密操作，但不能用于加密操作。", "当密钥处于\"Pending deletion\"状态时，AWS KMS 不会自动轮换密钥材料。", "对于非对称密钥，`GetPublicKey` API 在等待期内仍然可用，因此外部方仍然可以使用公钥加密数据。", "所有加密数据（DynamoDB、S3、EBS）将在删除完成前自动使用不同的密钥重新加密。"], "explanation_zh": "当 KMS 密钥处于 Pending deletion 状态时，AWS KMS 会暂停其上的所有密钥管理操作——包括自动密钥轮换。为计划删除的密钥无法进行密钥轮换，因此在等待期内不会生成新的密钥材料。这是唯一明确正确的陈述。\n\n为什么其他选项不正确：\n\n密钥在等待期内可用于解密但不能用于加密：错误。处于 Pending deletion 状态的密钥不能用于任何加密操作——既不能加密也不能解密。所有要求密钥处于 enabled 状态的 KMS API 调用（Encrypt、Decrypt、GenerateDataKey 等）都会返回 `KMSInvalidStateException`。\n`GetPublicKey` 在等待期内仍然可用：错误。Pending deletion 状态阻止所有 KMS API 操作，包括 `GetPublicKey`。任何尝试调用它都会返回 `KMSInvalidStateException`。请注意，如果一方在安排删除之前已经下载了公钥，他们可以在外部使用它——但 API 本身在等待期内不可用。\n加密数据在删除完成前自动重新加密：错误。AWS KMS 永远不会自动重新加密数据。如果密钥被删除，所有用它加密的数据将永久无法解密。这正是等待期存在的目的——给团队时间识别依赖关系，并在需要时通过 `CancelKeyDeletion` 取消删除。请注意，取消会将密钥恢复到 Disabled 状态而非 Enabled 状态；必须手动重新启用。"}, {"exam": 1, "id": 18, "question_en": "Your security team wants to detect when applications attempt to use a KMS key that is pending deletion. You need to create a CloudWatch alarm that triggers when such attempts occur, sending notifications via SNS.\n \nWhich AWS service and configuration combination is the BEST answer?", "options_en": ["Enable AWS CloudTrail to log KMS API calls to CloudWatch Logs", "Create a CloudWatch Logs metric filter with pattern: `{ $.errorMessage = \"*Key ARN is pending deletion*\" }`", "Create a CloudWatch alarm on the custom metric from the metric filter that triggers when the metric >= 1", "Configure GuardDuty to monitor for `Policy:KMS/KeyPendingDeletion` findings"], "correct": 0, "explanation_en": "This is a three-piece solution that must work together: First, CloudTrail must be configured to deliver KMS management events to CloudWatch Logs — CloudTrail is the source of the error events generated when an application attempts to use a key in the Pending deletion state. Second, a CloudWatch Logs metric filter must be created to match the specific error message (\"Key ARN is pending deletion\") and increment a custom metric counter. Third, a CloudWatch alarm on that custom metric triggers when the count reaches 1 or more, sending a notification via SNS.\n \nWhy the other option is incorrect:\n\nGuardDuty monitoring for a `Policy:KMS/KeyPendingDeletion` finding: No such GuardDuty finding type exists. GuardDuty does not generate findings specifically for attempts to use keys in the Pending deletion state. The correct detection path is through CloudTrail error logs analyzed by CloudWatch.\n", "question_zh": "您的安全团队希望在应用程序尝试使用处于待删除状态的 KMS 密钥时检测到这些尝试。您需要创建一个 CloudWatch 告警，在发生此类尝试时触发，并通过 SNS 发送通知。\n\n哪个 AWS 服务和配置组合是最佳答案？", "options_zh": ["启用 AWS CloudTrail 将 KMS API 调用记录到 CloudWatch Logs", "使用模式创建 CloudWatch Logs 指标筛选器：`{ $.errorMessage = \"*Key ARN is pending deletion*\" }`", "在指标筛选器的自定义指标上创建 CloudWatch 告警，当指标 >= 1 时触发", "配置 GuardDuty 监控 `Policy:KMS/KeyPendingDeletion` 发现项"], "explanation_zh": "这是必须协同工作的三部分解决方案：首先，CloudTrail 必须配置为将 KMS 管理事件传送到 CloudWatch Logs——CloudTrail 是应用程序尝试使用处于 Pending deletion 状态的密钥时生成的错误事件的来源。其次，必须创建 CloudWatch Logs 指标筛选器以匹配特定错误消息（\"Key ARN is pending deletion\"）并递增自定义指标计数器。第三，该自定义指标上的 CloudWatch 告警在计数达到 1 或更多时触发，通过 SNS 发送通知。\n\n为什么另一个选项不正确：\n\nGuardDuty 监控 `Policy:KMS/KeyPendingDeletion` 发现项：不存在此类 GuardDuty 发现项类型。GuardDuty 不会专门为尝试使用处于 Pending deletion 状态的密钥生成发现项。正确的检测路径是通过 CloudTrail 错误日志由 CloudWatch 分析。"}, {"exam": 1, "id": 19, "question_en": "A healthcare company is building a secure messaging application where two parties need to establish a shared secret for symmetric encryption without transmitting the secret over the network. Both parties have asymmetric KMS keys of type `ECC_NIST_P256` with key usage `KEY_AGREEMENT`.\n \nHow should they use AWS KMS to derive a shared secret?", "options_en": ["Party A calls `DeriveSharedSecret` with their private key and Party B's public key; Party B calls `DeriveSharedSecret` with their private key and Party A's public key; both operations produce the same shared secret.", "Party A encrypts a random value with Party B's public key using `Encrypt`; Party B decrypts it with their private key using `Decrypt`; the decrypted value is the shared secret.", "Both parties call `GenerateDataKey` with the same KMS key and encryption context to derive an identical shared secret.", "Party A calls `GetPublicKey` on Party B's KMS key, then uses the Diffie-Hellman algorithm locally to compute the shared secret outside of AWS KMS."], "correct": 0, "explanation_en": "`DeriveSharedSecret` implements the Elliptic Curve Diffie-Hellman (ECDH) key agreement protocol:\n \nHow it works:\n\nParty A calls `DeriveSharedSecret` specifying:\n\n\nTheir own KMS key (private key stays in KMS)\nParty B's KMS key ID (KMS retrieves the public key)\nReturns a shared secret\n\n \n\nParty B calls `DeriveSharedSecret` specifying:\n\n\nTheir own KMS key (private key stays in KMS)\nParty A's KMS key ID (KMS retrieves the public key)\nReturns the same shared secret\n\n \nKey properties:\n\nThe private keys never leave AWS KMS\nBoth parties derive the same shared secret independently\nThe shared secret can be used as a symmetric encryption key\nSupported key specs: `ECC_NIST_P256`, `ECC_NIST_P384`, `ECC_NIST_P521`, `ECC_SECG_P256K1`\n\n \nThe other options are incorrect: using `Encrypt` and `Decrypt` with a public key is RSA-based key transport, not key agreement — it also requires transmitting encrypted material. Calling `GenerateDataKey` with the same KMS key produces the same data key only if you share the key, which defeats the purpose. Computing the shared secret locally using a downloaded public key means the private key material must leave KMS, which violates the security requirement.", "question_zh": "一家医疗保健公司正在构建一个安全消息应用程序，双方需要在不通过网络传输密钥的情况下为对称加密建立共享密钥。双方都有类型为 `ECC_NIST_P256`、密钥用途为 `KEY_AGREEMENT` 的非对称 KMS 密钥。\n\n他们应如何使用 AWS KMS 来派生共享密钥？", "options_zh": ["A 方使用其私钥和 B 方的公钥调用 `DeriveSharedSecret`；B 方使用其私钥和 A 方的公钥调用 `DeriveSharedSecret`；两个操作产生相同的共享密钥。", "A 方使用 B 方的公钥通过 `Encrypt` 加密一个随机值；B 方使用其私钥通过 `Decrypt` 解密它；解密后的值就是共享密钥。", "双方使用相同的 KMS 密钥和加密上下文调用 `GenerateDataKey` 以派生相同的共享密钥。", "A 方在 B 方的 KMS 密钥上调用 `GetPublicKey`，然后在 AWS KMS 外部本地使用 Diffie-Hellman 算法计算共享密钥。"], "explanation_zh": "`DeriveSharedSecret` 实现了椭圆曲线 Diffie-Hellman (ECDH) 密钥协商协议：\n\n工作原理：\n- A 方调用 `DeriveSharedSecret` 指定：\n  - 自己的 KMS 密钥（私钥保留在 KMS 中）\n  - B 方的 KMS 密钥 ID（KMS 检索公钥）\n  - 返回共享密钥\n\n- B 方调用 `DeriveSharedSecret` 指定：\n  - 自己的 KMS 密钥（私钥保留在 KMS 中）\n  - A 方的 KMS 密钥 ID（KMS 检索公钥）\n  - 返回相同的共享密钥\n\n关键属性：\n- 私钥永远不会离开 AWS KMS\n- 双方独立派生相同的共享密钥\n- 共享密钥可用作对称加密密钥\n- 支持的密钥规格：`ECC_NIST_P256`、`ECC_NIST_P384`、`ECC_NIST_P521`、`ECC_SECG_P256K1`\n\n其他选项不正确：使用公钥的 `Encrypt` 和 `Decrypt` 是基于 RSA 的密钥传输，不是密钥协商——它还需要传输加密材料。使用相同 KMS 密钥调用 `GenerateDataKey` 只有在共享密钥的情况下才产生相同的数据密钥，这违背了目的。使用下载的公钥在本地计算共享密钥意味着私钥材料必须离开 KMS，这违反了安全要求。"}, {"exam": 1, "id": 20, "question_en": "Your company has an organization trail in CloudTrail that logs all API activity. Due to the high volume of KMS API calls (millions per day from S3 and EBS encryption), you're incurring significant CloudTrail storage costs. Management wants to reduce costs by excluding KMS events while maintaining audit capability for all other services.\n \nWhat should you do?", "options_en": ["Enable the `ExcludeManagementEventSources` parameter in the trail configuration with value `kms.amazonaws.com` to exclude all KMS events.", "Create an S3 lifecycle policy on the CloudTrail bucket to delete logs with `eventSource: \"kms.amazonaws.com\"` immediately after delivery.", "Disable CloudTrail for the entire organization and enable individual trails per account excluding KMS, then aggregate logs manually.", "Use AWS Config to track KMS key configuration changes instead of CloudTrail, then disable KMS logging in CloudTrail."], "correct": 0, "explanation_en": "To exclude AWS KMS events from a CloudTrail trail, use the `ExcludeManagementEventSources` parameter:\n \nConfiguration:\n`{\n \"ExcludeManagementEventSources\": [\"kms.amazonaws.com\"]\n}`\n \nThis excludes all AWS KMS events from the trail, significantly reducing volume and costs for KMS-heavy workloads (S3 encryption, EBS encryption, etc. generate many KMS API calls).\n \nImportant considerations:\n\nThis setting is applied at the trail level\nYou lose audit visibility into KMS API calls (who accessed which keys, when)\nFor compliance, you may need to keep KMS events despite costs\nYou can still use CloudWatch metrics to monitor KMS without full CloudTrail logs\n\n \nOption B is incorrect because S3 lifecycle policies can't filter by JSON content (and you'd lose non-KMS events in the same log files). Option C creates operational complexity. Option D is incorrect because AWS Config tracks configuration, not API activity.", "question_zh": "您的公司在 CloudTrail 中有一个记录所有 API 活动的组织跟踪。由于 KMS API 调用量很大（来自 S3 和 EBS 加密的每天数百万次），您产生了显著的 CloudTrail 存储成本。管理层希望通过排除 KMS 事件来降低成本，同时保持所有其他服务的审计能力。\n\n您应该怎么做？", "options_zh": ["在跟踪配置中使用值 `kms.amazonaws.com` 启用 `ExcludeManagementEventSources` 参数，以排除所有 KMS 事件。", "在 CloudTrail 存储桶上创建 S3 生命周期策略，在传送后立即删除带有 `eventSource: \"kms.amazonaws.com\"` 的日志。", "为整个组织禁用 CloudTrail，并在每个账户中启用排除 KMS 的单独跟踪，然后手动聚合日志。", "使用 AWS Config 跟踪 KMS 密钥配置更改而不是 CloudTrail，然后在 CloudTrail 中禁用 KMS 日志记录。"], "explanation_zh": "要从 CloudTrail 跟踪中排除 AWS KMS 事件，使用 `ExcludeManagementEventSources` 参数：\n\n配置：\n`{\"ExcludeManagementEventSources\": [\"kms.amazonaws.com\"]}`\n\n这会从跟踪中排除所有 AWS KMS 事件，显著减少 KMS 密集型工作负载（S3 加密、EBS 加密等产生许多 KMS API 调用）的日志量和成本。\n\n重要考虑因素：\n- 此设置在跟踪级别应用\n- 您会失去对 KMS API 调用的审计可见性（谁访问了哪些密钥、何时访问）\n- 为了合规，您可能需要保留 KMS 事件而不顾成本\n- 您仍然可以使用 CloudWatch 指标监控 KMS 而无需完整的 CloudTrail 日志\n\n选项 B 不正确，因为 S3 生命周期策略不能按 JSON 内容筛选（而且您会丢失同一日志文件中的非 KMS 事件）。选项 C 创建操作复杂性。选项 D 不正确，因为 AWS Config 跟踪配置，而不是 API 活动。"}, {"exam": 1, "id": 21, "question_en": "A Security Engineer needs to configure alerts for various KMS key lifecycle events. They want to receive notifications when specific events occur.\n \nWhich event can be most reliably detected using Amazon CloudWatch?", "options_en": ["The imported key material in a KMS key is nearing its expiration date", "A KMS key that is pending deletion is still being used", "A KMS key policy was modified", "The daily request quota for a KMS key was exceeded"], "correct": 0, "explanation_en": "Imported key material nearing its expiration date is the most reliably detected using CloudWatch because AWS KMS publishes a native CloudWatch metric called `SecondsUntilKeyMaterialExpiration`. You can create a CloudWatch alarm that triggers when this metric falls below a threshold (e.g., 7 days remaining), with SNS notification — no custom log parsing or metric filters needed.\n \nWhy the other events are less reliable to detect via CloudWatch:\n\nA KMS key pending deletion still being used: This requires a multi-step setup — CloudTrail must deliver KMS logs to CloudWatch Logs, then a custom metric filter must match the specific error message, and finally an alarm is placed on the resulting custom metric. It works, but it is more complex and indirect than a native metric.\nA KMS key policy was modified: Key policy modification events appear in CloudTrail logs as management events. While EventBridge can react to CloudTrail events, there is no native CloudWatch metric for this — it requires CloudTrail-based detection, not CloudWatch directly.\nThe daily request quota for a KMS key was exceeded: KMS request throttling is managed through AWS Service Quotas. There is no native CloudWatch metric published for KMS quota exhaustion.\n", "question_zh": "一名安全工程师需要为各种 KMS 密钥生命周期事件配置告警。他们希望在特定事件发生时收到通知。\n\n哪个事件可以通过 Amazon CloudWatch 最可靠地检测到？", "options_zh": ["KMS 密钥中导入的密钥材料即将到期", "处于待删除状态的 KMS 密钥仍在使用中", "KMS 密钥策略被修改", "KMS 密钥的每日请求配额已超出"], "explanation_zh": "导入的密钥材料即将到期是使用 CloudWatch 最可靠检测到的，因为 AWS KMS 发布了一个名为 `SecondsUntilKeyMaterialExpiration` 的原生 CloudWatch 指标。您可以创建一个 CloudWatch 告警，在其低于阈值（例如剩余 7 天）时触发，并配合 SNS 通知——无需自定义日志解析或指标筛选器。\n\n为什么其他事件通过 CloudWatch 检测不太可靠：\n\n处于待删除状态的 KMS 密钥仍在使用中：这需要多步骤设置——CloudTrail 必须将 KMS 日志传送到 CloudWatch Logs，然后自定义指标筛选器必须匹配特定错误消息，最后在生成的自定义指标上设置告警。它可以工作，但比原生指标更复杂和间接。\nKMS 密钥策略被修改：密钥策略修改事件作为管理事件出现在 CloudTrail 日志中。虽然 EventBridge 可以对 CloudTrail 事件做出反应，但没有原生的 CloudWatch 指标支持——需要基于 CloudTrail 的检测，而不是直接通过 CloudWatch。\nKMS 密钥的每日请求配额已超出：KMS 请求节流通过 AWS Service Quotas 管理。没有为 KMS 配额耗尽发布的原生 CloudWatch 指标。"}, {"exam": 1, "id": 22, "question_en": "Your company wants to automate the deployment of AWS Control Tower landing zones using infrastructure-as-code. A DevOps engineer is planning to use the AWS Control Tower API to create a landing zone programmatically.\n \nWhat is the MOST accurate prerequisite/expectation when using the Control Tower API to create a landing zone?", "options_en": ["The AWS account must already be the management account of an AWS Organization with at least one organizational unit created.", "You must pre-create an Amazon S3 bucket in the management account for Control Tower to store baseline resources.", "The API creates the Log Archive and Audit accounts automatically as part of landing zone creation.", "You must manually create IAM roles with specific trust policies before calling the API to create the landing zone."], "correct": 0, "explanation_en": "The most accurate prerequisite when using the Control Tower API to create a landing zone is that the account must already be the management account of an AWS Organization with at least one organizational unit created. Control Tower cannot bootstrap an organization from scratch — it requires the organizational structure to exist first. The management account requirement and the presence of at least one OU are hard prerequisites that the API validates before proceeding.\n \nWhy the other options are incorrect:\n\nPre-creating an S3 bucket is not required: Control Tower provisions and manages the S3 buckets it needs (such as the centralized logging bucket in the Log Archive account) automatically. There is no prerequisite to create any S3 resources beforehand.\nThe API does not create the Log Archive and Audit accounts automatically without input: Control Tower does create these accounts as part of landing zone setup, but the caller must provide unique email addresses for each account in the API request. The creation is not fully automatic — it depends on valid email addresses being supplied.\nManually creating IAM roles is not required: Control Tower creates the IAM roles it needs (such as `AWSControlTowerAdmin` and the execution role) as part of the landing zone creation process. Pre-creating them manually is not a prerequisite and could cause conflicts.\n", "question_zh": "您的公司希望使用基础设施即代码自动化部署 AWS Control Tower landing zones。一名 DevOps 工程师计划使用 AWS Control Tower API 以编程方式创建 landing zone。\n\n使用 Control Tower API 创建 landing zone 时，最准确的先决条件/期望是什么？", "options_zh": ["AWS 账户必须已经是 AWS Organization 的管理账户，并且至少创建了一个组织单元。", "您必须在管理账户中预先创建一个 Amazon S3 存储桶，供 Control Tower 存储基线资源。", "该 API 会在 landing zone 创建过程中自动创建 Log Archive 和 Audit 账户。", "在调用 API 创建 landing zone 之前，您必须手动创建具有特定信任策略的 IAM 角色。"], "explanation_zh": "使用 Control Tower API 创建 landing zone 时最准确的先决条件是，该账户必须已经是 AWS Organization 的管理账户，并且至少创建了一个组织单元。Control Tower 不能从零开始引导组织——它需要组织结构先存在。管理账户要求和至少一个 OU 的存在是 API 在继续之前验证的硬性先决条件。\n\n为什么其他选项不正确：\n\n预先创建 S3 存储桶不是必需的：Control Tower 会自动预置和管理它需要的 S3 存储桶（例如 Log Archive 账户中的集中式日志存储桶）。没有预先创建任何 S3 资源的先决条件。\nAPI 在没有输入的情况下不会自动创建 Log Archive 和 Audit 账户：Control Tower 确实会作为 landing zone 设置的一部分创建这些账户，但调用者必须在 API 请求中为每个账户提供唯一的电子邮件地址。创建不是完全自动的——它取决于提供有效的电子邮件地址。\n手动创建 IAM 角色不是必需的：Control Tower 会在 landing zone 创建过程中创建它需要的 IAM 角色（例如 `AWSControlTowerAdmin` 和执行角色）。预先手动创建它们不是先决条件，并可能导致冲突。"}, {"exam": 1, "id": 23, "question_en": "A financial services company subject to strict data privacy regulations wants to ensure that customer data stored in AWS is never used to improve AI/ML services. They're using AWS Control Tower to manage their multi-account environment.\n \nHow can they opt out of having their data used by AI services across all accounts in their organization?", "options_en": ["Enable the \"AI services opt-out\" guardrail in Control Tower, which applies an SCP that denies AI service data collection across all member accounts.", "Configure the AI services opt-out policy in AWS Organizations, then use Control Tower to deploy the policy to all OUs.", "Create an SCP that denies the `ai-opt-out:PutOptOutPolicy` action and attach it to the root of the organization.", "Manually opt out of each AI service (Rekognition, Comprehend, Lex, etc.) in each account through the service consoles."], "correct": 1, "explanation_en": "AWS Organizations supports a dedicated AI services opt-out policy type specifically designed for this use case. You create the policy in the management account, attach it to the relevant OUs or accounts, and AWS ensures that content processed by covered AI services (Rekognition, Transcribe, Comprehend, Lex, Polly, Translate, Textract) is not used to develop or improve AWS or third-party models. Control Tower can assist in managing and deploying these policies across the organization. This is a distinct policy type from SCPs — it targets AI service data usage, not IAM permissions.\n \nWhy the other options are incorrect:\n\nEnabling an \"AI services opt-out\" guardrail in Control Tower: No such guardrail exists in Control Tower. AI services opt-out is managed through the AWS Organizations AI services opt-out policy type, not through a Control Tower guardrail.\nCreating an SCP that denies the `ai-opt-out:PutOptOutPolicy` action: This would deny the ability to manage opt-out policies — the opposite of what is needed. It does not opt accounts out of AI service data collection; it would actually prevent administrators from configuring opt-outs at all.\nManually opting out of each AI service in each account through the consoles: This approach does not scale across a multi-account organization and is prone to gaps as new accounts are created. Centralized Organizations policies are the correct tool for organization-wide enforcement.\n", "question_zh": "一家受严格数据隐私法规约束的金融服务公司希望确保存储在 AWS 中的客户数据永远不会被用于改进 AI/ML 服务。他们正在使用 AWS Control Tower 管理其多账户环境。\n\n他们如何在其组织中所有账户中选择退出让 AI 服务使用其数据？", "options_zh": ["在 Control Tower 中启用\"AI 服务选择退出\"护栏，该护栏会应用一个 SCP，拒绝所有成员账户中的 AI 服务数据收集。", "在 AWS Organizations 中配置 AI 服务选择退出策略，然后使用 Control Tower 将策略部署到所有 OU。", "创建一个 SCP 拒绝 `ai-opt-out:PutOptOutPolicy` 操作，并将其附加到组织的根。", "在每个账户中通过服务控制台手动选择退出每个 AI 服务（Rekognition、Comprehend、Lex 等）。"], "explanation_zh": "AWS Organizations 支持专门为此用例设计的专用 AI 服务选择退出策略类型。您在管理账户中创建策略，将其附加到相关的 OU 或账户，AWS 确保由涵盖的 AI 服务（Rekognition、Transcribe、Comprehend、Lex、Polly、Translate、Textract）处理的内容不被用于开发或改进 AWS 或第三方模型。Control Tower 可以协助管理和部署这些策略到整个组织。这是一种不同于 SCP 的策略类型——它针对 AI 服务数据使用，而不是 IAM 权限。\n\n为什么其他选项不正确：\n\n在 Control Tower 中启用\"AI 服务选择退出\"护栏：Control Tower 中不存在此类护栏。AI 服务选择退出是通过 AWS Organizations AI 服务选择退出策略类型管理的，而不是通过 Control Tower 护栏。\n创建拒绝 `ai-opt-out:PutOptOutPolicy` 操作的 SCP：这会拒绝管理选择退出策略的能力——与所需相反。它不会选择退出账户的 AI 服务数据收集；实际上会阻止管理员配置选择退出。\n在每个账户中通过控制台手动选择退出每个 AI 服务：这种方法无法在多账户组织中扩展，并且随着新账户的创建容易出现遗漏。集中式 Organizations 策略是实现组织范围强制执行的正确工具。"}, {"exam": 1, "id": 24, "question_en": "AWS Control Tower creates a VPC automatically in each new member account. A network architect needs to understand the default VPC configuration to plan IP addressing and connectivity.\n \nWhich statement accurately describes the VPC created by Control Tower?", "options_en": ["The VPC uses a /16 CIDR block by default, providing 65,536 IP addresses per account.", "Control Tower creates public subnets only; you must manually create private subnets for workloads that don't need internet access.", "The VPC enables VPC Flow Logs automatically, sending logs to the Log Archive account's S3 bucket.", "Control Tower configures a NAT Gateway in each Availability Zone for private subnet outbound internet access."], "correct": 0, "explanation_en": "Control Tower's automatically created VPC uses a /16 CIDR block (default: 172.31.0.0/16), providing 65,536 IP addresses per account. It creates both public and private subnets across multiple Availability Zones, with an Internet Gateway and appropriate route tables for the public subnets. The CIDR block can be customized during account provisioning.\n \nWhy the other options are incorrect:\n\nControl Tower creates public subnets only: False. Control Tower creates both public and private subnets in each Availability Zone automatically.\nVPC Flow Logs are automatically enabled and sent to the Log Archive account: False. VPC Flow Logs are not enabled by default in the Control Tower VPC. They can be enabled through guardrails or customizations, but this does not happen automatically out of the box.\nControl Tower
