quired permissions to identify overly permissive policies."], "correct": 1, "explanation_en": "IAM Access Analyzer policy generation analyzes CloudTrail events for a specified IAM role over a configurable period (up to 90 days) and generates a least-privilege policy based on actual API activity. This automates the process of creating right-sized policies without manually parsing CloudTrail logs. IAM Policy Simulator tests whether specific API calls are allowed or denied by existing policies but does not generate new policies based on usage. CloudTrail Lake can query events but does not generate IAM policy documents.", "question_zh": "公司安全团队正在从过于宽松的 IAM 策略迁移到最低权限策略。他们需要生成反映每个 IAM 角色在过去 90 天内实际进行的 API 调用的 IAM 策略，而不是手动分析 CloudTrail 日志来确定所需的权限。\n \n哪个功能可以自动执行此过程？", "options_zh": ["AWS CloudTrail Lake，允许针对 CloudTrail 事件运行 SQL 查询，以识别每个 IAM 角色的唯一 API 操作，并根据查询结果生成策略文档。", "IAM 访问分析器策略生成，它分析指定 IAM 角色的 CloudTrail 活动并生成仅包含分析期间实际使用的服务和操作的 IAM 策略。", "IAM 策略模拟器，它针对模拟 API 调用测试现有策略，并根据使用模式确定可以安全删除哪些权限。", "AWS Config 高级查询，跨账户扫描 IAM 策略，并将其与所需权限的基准进行比较，以识别过于宽松的策略。"], "explanation_zh": "IAM 访问分析器策略生成会在可配置的时间段（最多 90 天）内分析指定 IAM 角色的 CloudTrail 事件，并根据实际 API 活动生成最低权限策略。这可以自动创建适当大小的策略，而无需手动解析 CloudTrail 日志。 IAM 策略模拟器测试现有策略是否允许或拒绝特定 API 调用，但不会根据使用情况生成新策略。 CloudTrail Lake 可以查询事件，但不会生成 IAM 策略文档。"}, {"exam": 3, "id": 41, "question_en": "A security engineer needs to verify whether an IAM role in Account A can assume a role in Account B and then access an S3 bucket in Account C. The engineer wants to test this multi-hop access chain without actually executing the API calls, to validate the policy configuration before granting access to a production CI/CD pipeline.\n \nWhich tool allows this testing?", "options_en": ["Use the IAM Policy Simulator to test the `sts:AssumeRole` action for the source role against the cross-account target role, then simulate the S3 actions using the assumed role policies to verify end-to-end access.", "Use IAM Access Analyzer to create an access preview for the S3 bucket in Account C and evaluate whether the cross-account role chain from Account A would be granted access.", "Use AWS CloudTrail to search for historical `sts:AssumeRole` events between the accounts and correlate them with S3 access events to verify the access chain works.", "Use AWS Organizations policy simulator to evaluate SCPs, IAM policies, and resource policies together across all three accounts to determine effective permissions."], "correct": 0, "explanation_en": "The IAM Policy Simulator allows testing whether specific API calls are permitted by evaluating the effective policies for an IAM entity without executing the actual calls. You can simulate `sts:AssumeRole` to verify cross-account role assumption and then simulate S3 actions to verify resource access. This provides a safe way to validate policy configurations before deploying to production. Access Analyzer access previews evaluate external access to resources but do not simulate multi-hop role assumption chains.", "question_zh": "安全工程师需要验证账户 A 中的 IAM 角色是否可以代入账户 B 中的角色，然后访问账户 C 中的 S3 存储桶。工程师希望在不实际执行 API 调用的情况下测试此多跳访问链，以便在授予对生产 CI/CD 管道的访问权限之前验证策略配置。\n \n哪个工具允许进行此测试？", "options_zh": ["使用 IAM 策略模拟器根据跨账户目标角色测试源角色的“sts:AssumeRole”操作，然后使用假定的角色策略模拟 S3 操作以验证端到端访问。", "使用 IAM 访问分析器为账户 C 中的 S3 存储桶创建访问预览，并评估账户 A 中的跨账户角色链是否会被授予访问权限。", "使用 AWS CloudTrail 搜索账户之间的历史“sts:AssumeRole”事件，并将其与 S3 访问事件关联起来，以验证访问链是否正常工作。", "使用 AWS Organizations 策略模拟器跨所有三个账户一起评估 SCP、IAM 策略和资源策略，以确定有效权限。"], "explanation_zh": "IAM 策略模拟器允许通过评估 IAM 实体的有效策略来测试是否允许特定 API 调用，而无需执行实际调用。您可以模拟“sts:AssumeRole”来验证跨账户角色假设，然后模拟 S3 操作来验证资源访问。这提供了一种在部署到生产之前验证策略配置的安全方法。访问分析器访问预览评估对资源的外部访问，但不模拟多跳角色假设链。"}, {"exam": 3, "id": 42, "question_en": "A company runs a CI/CD pipeline in a central DevOps account that deploys to workload accounts across development, staging, and production environments. The pipeline needs to assume different IAM roles in each target account with limited session duration. The central account pipeline role should not have long-lived credentials for any target account.\n \nHow should the cross-account access be configured?", "options_en": ["Create IAM users in each target account with access keys stored in AWS Secrets Manager in the DevOps account, and rotate the keys automatically using a Secrets Manager rotation Lambda.", "Configure IAM Identity Center with permission sets for each target account and use Identity Center API to obtain temporary credentials for the pipeline role in each account.", "Configure the pipeline to use `sts:AssumeRole` to assume a deployment role in each target account, with trust policies on the target roles that allow only the pipeline role in the DevOps account and include session duration limits.", "Create resource-based policies on deployment resources in each target account that directly allow the DevOps account pipeline role to perform actions, avoiding the need for role assumption."], "correct": 2, "explanation_en": "Using `sts:AssumeRole` provides temporary credentials for cross-account access. Each target account deployment role has a trust policy that specifies the DevOps account pipeline role as a trusted principal with maximum session duration limits. The pipeline assumes the appropriate role for each deployment target. This follows least privilege because the pipeline only has access to target accounts through temporary credentials. IAM users with access keys create long-lived credentials that violate the no-long-lived-credentials requirement.", "question_zh": "一家公司在中央 DevOps 帐户中运行 CI/CD 管道，该管道部署到跨开发、登台和生产环境的工作负载帐户。管道需要在每个目标账户中承担不同的 IAM 角色，并且会话持续时间有限。中央帐户管道角色不应具有任何目标帐户的长期凭据。\n \n跨账户访问应该如何配置？", "options_zh": ["使用存储在 DevOps 账户的 AWS Secrets Manager 中的访问密钥在每个目标账户中创建 IAM 用户，并使用 Secrets Manager 轮换 Lambda 自动轮换密钥。", "使用每个目标账户的权限集配置 IAM Identity Center，并使用 Identity Center API 获取每个账户中管道角色的临时凭证。", "配置管道以使用“sts:AssumeRole”在每个目标帐户中承担部署角色，并在目标角色上使用仅允许 DevOps 帐户中的管道角色并包括会话持续时间限制的信任策略。", "针对每个目标帐户中的部署资源创建基于资源的策略，直接允许 DevOps 帐户管道角色执行操作，从而避免角色假设。"], "explanation_zh": "使用“sts:AssumeRole”为跨账户访问提供临时凭据。每个目标帐户部署角色都有一个信任策略，该策略将 DevOps 帐户管道角色指定为具有最大会话持续时间限制的受信任主体。管道为每个部署目标承担适当的角色。这遵循最低权限，因为管道只能通过临时凭据访问目标帐户。拥有访问密钥的 IAM 用户创建的长期凭证违反了无长期凭证的要求。"}, {"exam": 3, "id": 43, "question_en": "A SaaS platform uses IAM federation to give customers temporary access to specific S3 buckets containing their data. Each customer should only access their own prefix within a shared S3 bucket. The base IAM role grants access to the entire bucket, but individual sessions need to be scoped down to specific customer prefixes at federation time.\n \nHow should the sessions be restricted?", "options_en": ["Use S3 bucket policies with condition keys that match the federated user source identity to restrict access to the customer prefix at the resource level.", "Pass a session policy when calling `sts:AssumeRole` or `sts:GetFederationToken` that restricts S3 access to only the specific customer prefix, effectively scoping down the role permissions for that session.", "Create separate IAM roles for each customer with inline policies restricting access to their S3 prefix, and assume the customer-specific role for each federation request.", "Configure S3 access points for each customer with access point policies that limit access to the customer prefix, and direct federated sessions to use the customer-specific access point."], "correct": 1, "explanation_en": "Session policies are inline policies passed during `sts:AssumeRole` or `sts:GetFederationToken` calls that scope down the effective permissions of temporary credentials. The effective permissions are the intersection of the role identity policy and the session policy, so the session can never exceed the role permissions but can be further restricted. This allows using a single role while dynamically restricting each session to a specific customer S3 prefix. Creating separate roles per customer would not scale for a large number of customers.", "question_zh": "SaaS 平台使用 IAM 联合来让客户临时访问包含其数据的特定 S3 存储桶。每个客户只能访问共享 S3 存储桶中自己的前缀。基本 IAM 角色授予对整个存储桶的访问权限，但需要在联合时将各个会话的范围缩小到特定的客户前缀。\n \n应该如何限制会话？", "options_zh": ["使用具有与联合用户源身份匹配的条件键的 S3 存储桶策略，以在资源级别限制对客户前缀的访问。", "在调用“sts:AssumeRole”或“sts:GetFederationToken”时传递会话策略，将 S3 访问限制为仅特定客户前缀，从而有效地缩小该会话的角色权限范围。", "为每个客户创建单独的 IAM 角色，并使用内联策略限制对其 S3 前缀的访问，并为每个联合请求承担特定于客户的角色。", "使用限制对客户前缀的访问的访问点策略为每个客户配置 S3 访问点，并指示联合会话使用客户特定的访问点。"], "explanation_zh": "会话策略是在“sts:AssumeRole”或“sts:GetFederationToken”调用期间传递的内联策略，用于缩小临时凭证的有效权限范围。有效权限是角色身份策略和会话策略的交集，因此会话永远不能超出角色权限，但可以进一步限制。这允许使用单个角色，同时动态地将每个会话限制为特定的客户 S3 前缀。为每个客户创建单独的角色无法适应大量客户。"}, {"exam": 3, "id": 44, "question_en": "A company needs to enforce consistent resource tagging across all AWS accounts in their organization. Specifically, they want to ensure that the `CostCenter` tag uses only values from an approved list, and that the tag key capitalization is consistent. Non-compliant tag values should be prevented rather than just detected.\n \nWhich mechanism enforces this?", "options_en": ["Create AWS Config rules with the `required-tags` managed rule to detect resources missing the CostCenter tag, and configure auto-remediation to add the tag with a default value.", "Configure SCPs that deny resource creation unless the `aws:RequestTag/CostCenter` condition key matches a list of approved values for all supported resource types.", "Deploy an EventBridge rule that captures `CreateTags` API calls and triggers a Lambda function to validate tag values against an approved list and remove non-compliant tags.", "Configure AWS Organizations tag policies that define the `CostCenter` tag key with a list of approved values and enable enforcement, which prevents non-compliant tag values on supported resource types."], "correct": 3, "explanation_en": "AWS Organizations tag policies define standardized tag keys and their approved values across the organization. When enforcement is enabled, tag policies prevent non-compliant tag values on supported resource types, ensuring consistency. Tag policies also enforce consistent tag key capitalization. SCPs can enforce tagging conditions but require listing every resource creation action for every service, making them complex to maintain. Config rules detect non-compliance after the fact rather than preventing it.", "question_zh": "公司需要在其组织中的所有 AWS 账户中强制执行一致的资源标记。具体来说，他们希望确保“CostCenter”标签仅使用批准列表中的值，并且标签键大小写一致。不合规的标签值应该被阻止，而不仅仅是检测。\n \n哪种机制强制执行此操作？", "options_zh": ["使用“required-tags”托管规则创建 AWS Config 规则，以检测缺少 CostCenter 标签的资源，并配置自动修复以添加具有默认值的标签。", "配置拒绝资源创建的 SCP，除非 `aws:RequestTag/CostCenter` 条件键与所有支持的资源类型的批准值列表匹配。", "部署一个 EventBridge 规则，捕获“CreateTags”API 调用并触发 Lambda 函数，根据批准的列表验证标签值并删除不合规的标签。", "配置 AWS Organizations 标签策略，使用批准的值列表定义“CostCenter”标签键并启用强制执行，从而防止受支持的资源类型上出现不合规的标签值。"], "explanation_zh": "AWS Organizations 标签策略定义标准化标签键及其在整个组织中批准的值。启用强制执行后，标签策略会阻止支持的资源类型上出现不合规的标签值，从而确保一致性。标签策略还强制执行一致的标签键大写。 SCP 可以强制执行标记条件，但需要列出每个服务的每个资源创建操作，这使得维护变得复杂。配置规则在事后检测不合规情况，而不是阻止它。"}, {"exam": 3, "id": 45, "question_en": "An application uses AWS KMS to encrypt data in Amazon S3. During batch processing, an AWS Lambda function needs temporary access to decrypt objects, but the Lambda function execution role should not have permanent decrypt permissions in the KMS key policy. Access should be automatically revoked after the batch processing job completes.\n \nWhich mechanism provides this temporary access?", "options_en": ["Create a KMS grant that allows the Lambda execution role to perform `Decrypt` operations on the key, and retire the grant programmatically when the batch processing completes.", "Add a temporary IAM inline policy to the Lambda execution role that grants `kms:Decrypt` permission, and use a scheduled Lambda function to remove the policy after batch completion.", "Modify the KMS key policy to add the Lambda execution role with a condition that limits access to a specific time window using `aws:CurrentTime` condition key.", "Use STS to create temporary credentials for the Lambda function with a session policy that includes `kms:Decrypt` permission, limited to the batch processing duration."], "correct": 0, "explanation_en": "KMS grants provide temporary, delegated access to KMS key operations without modifying the key policy. Grants can be created programmatically before the batch job starts and retired when the job completes, providing time-limited access. This is the recommended mechanism for temporary cross-service encryption access. Modifying key policies for temporary access is operationally complex and not designed for short-lived access patterns. Adding and removing IAM policies introduces race conditions and is not a clean pattern for temporary access.", "question_zh": "应用程序使用 AWS KMS 加密 Amazon S3 中的数据。在批处理期间，AWS Lambda 函数需要临时访问权限来解密对象，但 Lambda 函数执行角色不应在 KMS 密钥策略中拥有永久解密权限。批处理作业完成后，访问权限应自动撤销。\n \n哪种机制提供这种临时访问？", "options_zh": ["创建一个 KMS 授权，允许 Lambda 执行角色对密钥执行“解密”操作，并在批处理完成时以编程方式撤销该授权。", "将临时 IAM 内联策略添加到授予“kms:Decrypt”权限的 Lambda 执行角色，并使用计划的 Lambda 函数在批量完成后删除该策略。", "修改 KMS 密钥策略以添加 Lambda 执行角色，并使用“aws:CurrentTime”条件键限制对特定时间窗口的访问。", "使用 STS 为 Lambda 函数创建临时凭证，其会话策略包含“kms:Decrypt”权限，仅限于批处理持续时间。"], "explanation_zh": "KMS 授权提供对 KMS 密钥操作的临时委派访问权限，而无需修改密钥策略。可以在批处理作业开始之前以编程方式创建拨款，并在作业完成时取消拨款，从而提供限时访问。这是临时跨服务加密访问的推荐机制。修改临时访问的关键策略在操作上很复杂，并且不适合短期访问模式。添加和删​​除 IAM 策略会引入竞争条件，并且对于临时访问而言并不是一种干净的模式。"}, {"exam": 3, "id": 46, "question_en": "A financial services company uses AWS CloudHSM for cryptographic operations in their payment processing system. They need to ensure high availability of the HSM cluster so that key operations continue if a single Availability Zone becomes unavailable. The solution must maintain the same key material across all HSM instances.\n \nHow should the cluster be configured?", "options_en": ["Deploy two separate CloudHSM clusters in different Availability Zones and configure application-level failover between the clusters using Route 53 health checks.", "Add HSM instances to the CloudHSM cluster in at least two different Availability Zones, as the cluster automatically synchronizes key material across all HSMs in the cluster.", "Enable CloudHSM automated backups with cross-Region replication and configure the application to restore from backup in a different AZ if the primary HSM becomes unavailable.", "Deploy a CloudHSM cluster with a single HSM and enable the AWS-managed high availability feature that automatically provisions a standby HSM in a different AZ."], "correct": 1, "explanation_en": "A CloudHSM cluster can span multiple Availability Zones by adding HSM instances in different AZs. The cluster automatically synchronizes keys, users, and policies across all HSMs in the cluster. If one HSM or AZ becomes unavailable, the CloudHSM client automatically routes requests to available HSMs. Deploying separate clusters would not share key material automatically. CloudHSM does not have an AWS-managed high availability feature that provisions standby HSMs; you must explicitly add HSMs to additional AZs.", "question_zh": "一家金融服务公司使用 AWS CloudHSM 在其支付处理系统中进行加密操作。他们需要确保 HSM 集群的高可用性，以便在单个可用区不可用时关键操作仍能继续。该解决方案必须在所有 HSM 实例中维护相同的密钥材料。\n \n集群应该如何配置？", "options_zh": ["在不同的可用区中部署两个独立的 CloudHSM 集群，并使用 Route 53 运行状况检查在集群之间配置应用程序级故障转移。", "将 HSM 实例添加到至少两个不同可用区中的 CloudHSM 集群，因为集群会自动同步集群中所有 HSM 之间的密钥材料。", "通过跨区域复制启用 CloudHSM 自动备份，并将应用程序配置为在主 HSM 不可用时从不同可用区中的备份进行恢复。", "使用单个 HSM 部署 CloudHSM 集群，并启用 AWS 管理的高可用性功能，该功能可自动在不同的可用区预置备用 HSM。"], "explanation_zh": "CloudHSM 集群可以通过在不同可用区添加 HSM 实例来跨越多个可用区。集群自动同步集群中所有 HSM 上的密钥、用户和策略。如果一个 HSM 或可用区不可用，CloudHSM 客户端会自动将请求路由到可用的 HSM。部署单独的集群不会自动共享密钥材料。 CloudHSM 没有 AWS 管理的高可用性功能来配置备用 HSM；您必须显式地将 HSM 添加到其他可用区。"}, {"exam": 3, "id": 47, "question_en": "A DevOps team needs to provision SSL/TLS certificates through AWS Certificate Manager for applications deployed across multiple AWS accounts and Regions. They want certificates to be automatically renewed without manual intervention and need the validation process to work even when the domain email infrastructure is managed by a third party.\n \nWhich validation method should they use?", "options_en": ["Use ACM email validation, which sends approval emails to domain contacts registered in WHOIS and the standard admin and postmaster addresses, providing the fastest initial validation.", "Use ACM HTTP validation by placing a validation file at a specific URL path on the web server, which ACM checks periodically for automatic renewal.", "Use ACM DNS validation by adding CNAME records to the domain DNS zone, which allows ACM to automatically renew certificates without manual intervention as long as the DNS records remain in place.", "Use ACM private certificate authority (Private CA) to issue certificates, which does not require external domain validation and supports automatic renewal across all accounts."], "correct": 2, "explanation_en": "ACM DNS validation requires adding a CNAME record to the domain DNS zone. Once the record is in place, ACM can automatically validate and renew certificates without any manual intervention, making it ideal for automation. DNS validation works regardless of who manages the domain email infrastructure. Email validation requires manual approval for each renewal cycle. ACM does not support HTTP validation; that is a feature of other certificate providers like Let us Encrypt.", "question_zh": "开发运营团队需要通过 AWS Certificate Manager 为跨多个 AWS 账户和区域部署的应用程序预置 SSL/TLS 证书。他们希望证书能够在无需人工干预的情况下自动续订，并且即使域电子邮件基础设施由第三方管理，也需要验证过程正常工作。\n \n他们应该使用哪种验证方法？", "options_zh": ["使用 ACM 电子邮件验证，将批准电子邮件发送到在 WHOIS 中注册的域联系人以及标准管理员和邮政主管地址，从而提供最快的初始验证。", "通过将验证文件放置在 Web 服务器上的特定 URL 路径来使用 ACM HTTP 验证，ACM 会定期检查该文件以进行自动续订。", "通过将 CNAME 记录添加到域 DNS 区域来使用 ACM DNS 验证，这样只要 DNS 记录保持不变，ACM 就可以自动续订证书，而无需手动干预。", "使用ACM私有证书颁发机构（Private CA）颁发证书，无需外部域验证，并支持跨所有账户自动续订。"], "explanation_zh": "ACM DNS 验证需要将 CNAME 记录添加到域 DNS 区域。记录到位后，ACM 可以自动验证和续订证书，无需任何手动干预，非常适合自动化。无论谁管理域电子邮件基础设施，DNS 验证都会起作用。电子邮件验证需要每个续订周期的手动批准。 ACM 不支持 HTTP 验证；这是 Let us Encrypt 等其他证书提供商的功能。"}, {"exam": 3, "id": 48, "question_en": "A healthcare company uses Amazon Macie to scan S3 buckets for sensitive data. In addition to standard PII detection, they need to identify proprietary internal patient record identifiers that follow a specific format: three uppercase letters followed by a hyphen and seven digits (e.g., MRN-1234567). Macie built-in managed data identifiers do not recognize this format.\n \nHow should the company extend Macie detection capabilities?", "options_en": ["Configure Macie allow lists that define the proprietary identifier format so Macie includes matching patterns in its sensitive data findings alongside managed data identifiers.", "Create a Lambda function triggered by Macie findings that performs additional regex scanning on flagged S3 objects and generates custom findings for proprietary identifier matches.", "Submit a feature request to AWS to add the proprietary identifier format as a managed data identifier, and use an S3 event-triggered Lambda for detection in the interim.", "Create a Macie custom data identifier using a regex pattern `[A-Z]{3}-[0-9]{7}` with optional keywords like patient and record to improve accuracy, and include it in Macie discovery jobs."], "correct": 3, "explanation_en": "Macie custom data identifiers allow defining regex patterns to detect proprietary or organization-specific sensitive data that managed data identifiers do not cover. Keywords can be optionally specified to provide context that improves detection accuracy by requiring the pattern to appear near relevant terms. Custom data identifiers are included in sensitive data discovery jobs alongside managed identifiers. Allow lists are used to exclude known safe patterns from findings, not to add new detection patterns.", "question_zh": "一家医疗保健公司使用 Amazon Macie 扫描 S3 存储桶中的敏感数据。除了标准 PII 检测之外，他们还需要识别遵循特定格式的专有内部患者记录标识符：三个大写字母后跟一个连字符和七个数字（例如 MRN-1234567）。 Macie 内置托管数据标识符无法识别此格式。\n \n公司应如何扩展 Macie 检测功能？", "options_zh": ["配置定义专有标识符格式的 Macie 允许列表，以便 Macie 在其敏感数据结果中包含匹配模式以及托管数据标识符。", "创建由 Macie 结果触发的 Lambda 函数，该函数对标记的 S3 对象执行额外的正则表达式扫描，并为专有标识符匹配生成自定义结果。", "向 AWS 提交功能请求，将专有标识符格式添加为托管数据标识符，并在此期间使用 S3 事件触发的 Lambda 进行检测。", "使用正则表达式模式“[A-Z]{3}-[0-9]{7}”以及患者和记录等可选关键字创建 Macie 自定义数据标识符，以提高准确性，并将其包含在 Macie 发现作业中。"], "explanation_zh": "Macie 自定义数据标识符允许定义正则表达式模式来检测托管数据标识符未涵盖的专有或组织特定的敏感数据。可以选择指定关键字来提供上下文，通过要求模式出现在相关术语附近来提高检测准确性。自定义数据标识符与托管标识符一起包含在敏感数据发现作业中。允许列表用于从结果中排除已知的安全模式，而不是添加新的检测模式。"}, {"exam": 3, "id": 49, "question_en": "A company has a VPC with a gateway endpoint for Amazon S3. The security team wants to ensure that EC2 instances in the VPC can only access three specific S3 buckets through the endpoint and cannot access any other S3 buckets, even if their IAM policies allow broader S3 access.\n \nHow should this be configured?", "options_en": ["Modify the VPC endpoint policy to allow S3 actions only on the three specific bucket ARNs, which restricts all traffic through the endpoint to only those buckets regardless of the IAM permissions on the EC2 instances.", "Create S3 bucket policies on the three buckets with `aws:sourceVpce` conditions that allow access only from the VPC endpoint, and deny all other access.", "Configure the VPC endpoint route table associations to only include subnets that should access the three buckets, and use security group rules to restrict S3 traffic.", "Add IAM policies to all EC2 instance roles that restrict S3 access to only the three specific buckets using resource-level permissions with bucket ARN conditions."], "correct": 0, "explanation_en": "VPC endpoint policies control which resources can be accessed through the endpoint. By restricting the endpoint policy to allow actions only on the three specific bucket ARNs, all S3 traffic through the endpoint is limited to those buckets. Even if an EC2 instance IAM policy allows broader S3 access, the effective permissions are the intersection of the IAM policy and the endpoint policy. S3 bucket policies with `aws:sourceVpce` conditions restrict who can access the buckets but do not prevent the EC2 instances from accessing other buckets.", "question_zh": "一家公司拥有一个带有 Amazon S3 网关终端节点的 VPC。安全团队希望确保 VPC 中的 EC2 实例只能通过终端节点访问三个特定的 S3 存储桶，而无法访问任何其他 S3 存储桶，即使它们的 IAM 策略允许更广泛的 S3 访问也是如此。\n \n这个应该怎么配置呢？", "options_zh": ["修改 VPC 终端节点策略以仅允许在三个特定存储桶 ARN 上执行 S3 操作，这将通过终端节点的所有流量限制为仅限这些存储桶，无论 EC2 实例上的 IAM 权限如何。", "使用“aws:sourceVpce”条件在三个存储桶上创建 S3 存储桶策略，仅允许从 VPC 终端节点进行访问，并拒绝所有其他访问。", "将 VPC 终端节点路由表关联配置为仅包含应访问三个存储桶的子网，并使用安全组规则来限制 S3 流量。", "将 IAM 策略添加到所有 EC2 实例角色，使用资源级权限和存储桶 ARN 条件将 S3 访问限制为仅三个特定存储桶。"], "explanation_zh": "VPC 终端节点策略控制可以通过终端节点访问哪些资源。通过将端点策略限制为仅允许在三个特定存储桶 ARN 上执行操作，通过端点的所有 S3 流量都限制在这些存储桶中。即使 EC2 实例 IAM 策略允许更广泛的 S3 访问，有效权限也是 IAM 策略和终端节点策略的交集。具有“aws:sourceVpce”条件的 S3 存储桶策略限制谁可以访问存储桶，但不会阻止 EC2 实例访问其他存储桶。"}, {"exam": 3, "id": 50, "question_en": "A financial institution must store trading records in immutable storage for seven years to comply with SEC Rule 17a-4. The records must be written once and cannot be modified or deleted by anyone, including root account users, for the retention period. The compliance mechanism must be irrevocable once activated.\n \nWhich AWS storage configuration meets this regulatory requirement?", "options_en": ["Configure an S3 bucket with Object Lock in governance mode with a seven-year retention period, which prevents standard users from deleting objects while allowing authorized administrators to override the lock.", "Configure an S3 Glacier vault with a Vault Lock policy that enforces a seven-year retention period. Once the Vault Lock policy is confirmed, it becomes immutable and cannot be changed or deleted, even by the root account.", "Configure an S3 bucket with Object Lock in compliance mode and a seven-year retention period, combined with an SCP that denies `s3:PutObjectRetention` actions to prevent retention period changes.", "Store records in an S3 bucket with versioning enabled and MFA Delete required, combined with a lifecycle policy that transitions objects to Glacier after creation and prevents deletion for seven years."], "correct": 1, "explanation_en": "S3 Glacier Vault Lock provides WORM (Write Once Read Many) storage with a vault lock policy that becomes irrevocable once confirmed. After confirmation, the lock policy cannot be changed or deleted by anyone, including the root account user, meeting SEC Rule 17a-4 requirements for immutable record retention. S3 Object Lock in compliance mode provides similar protection at the object level, but Glacier Vault Lock is specifically designed and assessed for SEC 17a-4 compliance. Governance mode allows authorized users to override the lock, which does not meet the requirements.", "question_zh": "金融机构必须将交易记录在不可变存储中保存七年，以遵守 SEC 规则 17a-4。这些记录必须写入一次，并且在保留期内任何人（包括 root 帐户用户）都不能修改或删除。合规机制一旦启动就必须不可撤销。\n \n哪种 AWS 存储配置满足此监管要求？", "options_zh": ["在治理模式下配置具有对象锁定的 S3 存储桶，保留期为七年，这可以防止标准用户删除对象，同时允许授权管理员覆盖锁定。", "使用保管库锁定策略配置 S3 Glacier 保管库，该策略强制执行七年的保留期。一旦保管库锁定策略得到确认，它就变得不可变，即使是 root 帐户也无法更改或删除。", "在合规模式下配置具有对象锁定和七年保留期的 S3 存储桶，并结合拒绝“s3:PutObjectRetention”操作的 SCP 以防止保留期更改。", "将记录存储在启用版本控制且需要 MFA 删除的 S3 存储桶中，并结合生命周期策略，在对象创建后将其转换到 Glacier，并在七年内防止删除。"], "explanation_zh": "S3 Glacier Vault Lock 提供 WORM（一次写入多次读取）存储，其保管库锁定策略一旦确认就不可撤销。确认后，任何人（包括根帐户用户）都无法更改或删除锁定策略，满足 SEC 规则 17a-4 对不可变记录保留的要求。合规模式下的 S3 对象锁在对象级别提供类似的保护，但 Glacier Vault Lock 专门针对 SEC 17a-4 合规性进行设计和评估。治理模式允许授权用户覆盖锁，这不符合要求。"}, {"exam": 3, "id": 51, "question_en": "A company has hundreds of EBS volumes across multiple accounts and Regions. The security team requires that all EBS volumes have automated daily snapshots retained for 30 days, with snapshots copied to a secondary Region for disaster recovery. Managing this manually is not feasible.\n \nWhich service automates this requirement?", "options_en": ["Configure AWS Backup with a backup plan that creates daily EBS snapshots with a 30-day retention period and a copy action to replicate snapshots to the secondary Region.", "Create a Lambda function triggered by a daily CloudWatch Events schedule that iterates through all EBS volumes, creates snapshots, manages retention, and initiates cross-Region copies.", "Use Amazon Data Lifecycle Manager (DLM) to create an EBS snapshot lifecycle policy with a daily schedule, 30-day retention count, and cross-Region copy rules targeting the secondary Region.", "Deploy a CloudFormation StackSet that creates CloudWatch Events rules in each account to trigger an SSM Automation document for daily EBS snapshot creation and cross-Region replication."], "correct": 2, "explanation_en": "Amazon Data Lifecycle Manager (DLM) is purpose-built for automating EBS snapshot lifecycle management. DLM policies can be configured with schedules, retention rules, and cross-Region copy rules. It handles snapshot creation, retention management, and cross-Region copies automatically. While AWS Backup can also manage EBS snapshots, DLM is the native EBS-specific service designed for this exact use case with simpler configuration. Lambda-based solutions require significant custom code for snapshot management and error handling.", "question_zh": "一家公司拥有跨多个账户和区域的数百个 EBS 卷。安全团队要求所有 EBS 卷自动保留 30 天的每日快照，并将快照复制到辅助区域以进行灾难恢复。手动管理此操作是不可行的。\n \n哪个服务可以自动执行此要求？", "options_zh": ["使用备份计划配置 AWS Backup，该计划创建保留期为 30 天的每日 EBS 快照以及将快照复制到次要区域的复制操作。", "创建由每日 CloudWatch Events 计划触发的 Lambda 函数，该函数迭代所有 EBS 卷、创建快照、管理保留并启动跨区域副本。", "使用 Amazon Data Lifecycle Manager (DLM) 创建 EBS 快照生命周期策略，其中包含每日计划、30 天保留计数以及针对次要区域的跨区域复制规则。", "部署一个 CloudFormation StackSet，在每个账户中创建 CloudWatch Events 规则，以触发 SSM 自动化文档以进行日常 EBS 快照创建和跨区域复制。"], "explanation_zh": "Amazon Data Lifecycle Manager (DLM) 专为自动化 EBS 快照生命周期管理而构建。可以使用计划、保留规则和跨区域复制规则来配置 DLM 策略。它自动处理快照创建、保留管理和跨区域复制。虽然 AWS Backup 还可以管理 EBS 快照，但 DLM 是专门针对此特定用例而设计的原生 EBS 服务，配置更简单。基于 Lambda 的解决方案需要大量自定义代码来进行快照管理和错误处理。"}, {"exam": 3, "id": 52, "question_en": "A European government agency wants to use AWS services but has a regulatory requirement that all encryption keys must be stored and managed within their own on-premises hardware security modules (HSMs) located within national borders. AWS must never have access to the key material, but the agency still wants to use AWS KMS APIs for encryption operations.\n \nWhich KMS feature satisfies this requirement?", "options_en": ["Use AWS KMS with imported key material from the on-premises HSMs, which ensures the key material originated from the agency HSMs and can be deleted from AWS on demand.", "Deploy AWS CloudHSM with a cluster connected to the on-premises HSMs through a VPN tunnel, and use CloudHSM as the key store for KMS operations.", "Configure AWS KMS custom key store backed by a CloudHSM cluster deployed in the agency preferred Region, keeping key material within the AWS CloudHSM FIPS-validated boundary.", "Configure a KMS external key store (XKS) that connects AWS KMS to the agency on-premises HSM through an XKS proxy, keeping all key material in the agency HSMs while allowing KMS API integration."], "correct": 3, "explanation_en": "KMS external key store (XKS) allows connecting AWS KMS to an external key manager such as on-premises HSMs through an XKS proxy. The key material never leaves the agency HSMs, and all cryptographic operations are performed on the external hardware. This satisfies data sovereignty requirements while providing the convenience of KMS API integration. KMS imported key material transfers key material to AWS (even if temporarily), which may not satisfy the requirement that AWS never has access to the keys. CloudHSM stores keys within the AWS environment.", "question_zh": "一家欧洲政府机构希望使用 AWS 服务，但有一项监管要求，即所有加密密钥必须在其位于国境内的本地硬件安全模块 (HSM) 内存储和管理。 AWS 绝不能访问密钥材料，但该机构仍然希望使用 AWS KMS API 进行加密操作。\n \n哪个 KMS 功能可以满足此要求？", "options_zh": ["将 AWS KMS 与从本地 HSM 导入的密钥材料结合使用，这可确保密钥材料源自机构 HSM 并可以按需从 AWS 中删除。", "部署 AWS CloudHSM，其中集群通过 VPN 隧道连接到本地 HSM，并使用 CloudHSM 作为 KMS 操作的密钥存储。", "配置由部署在机构首选区域中的 CloudHSM 集群支持的 AWS KMS 自定义密钥存储，将密钥材料保留在经 FIPS 验证的 AWS CloudHSM 边界内。", "配置 KMS 外部密钥存储 (XKS)，通过 XKS 代理将 AWS KMS 连接到机构本地 HSM，将所有密钥材料保留在机构 HSM 中，同时允许 KMS API 集成。"], "explanation_zh": "KMS 外部密钥存储 (XKS) 允许通过 XKS 代理将 AWS KMS 连接到外部密钥管理器，例如本地 HSM。密钥材料永远不会离开机构 HSM，所有加密操作都在外部硬件上执行。这样既满足了数据主权的要求，又提供了KMS API集成的便利性。 KMS 导入的密钥材料将密钥材料传输到 AWS（即使是暂时的），这可能无法满足 AWS 永远无法访问密钥的要求。 CloudHSM 在 AWS 环境中存储密钥。"}, {"exam": 3, "id": 53, "question_en": "A company uses Amazon SNS topics to distribute messages containing customer data to multiple downstream consumers. Compliance requires that any message containing personally identifiable information (PII) such as credit card numbers or Social Security numbers must be detected and either masked before delivery or blocked entirely.\n \nWhich feature provides this capability natively?", "options_en": ["Configure SNS message data protection policies on the topic that use data identifiers to detect PII patterns in messages, with actions to either mask sensitive data before delivery or deny the publish operation.", "Create a Lambda function subscribed to the SNS topic that inspects each message for PII patterns using Amazon Comprehend, and republishes sanitized messages to a clean SNS topic for downstream consumers.", "Enable Amazon Macie to monitor the SNS topic for sensitive data and configure EventBridge rules to block message delivery when PII is detected in transit.", "Configure an SNS subscription filter policy on each subscriber that filters out messages containing patterns matching PII data formats like credit card numbers."], "correct": 0, "explanation_en": "SNS message data protection policies provide native inline detection and protection of sensitive data in SNS messages. These policies use managed data identifiers to detect PII patterns such as credit card numbers and SSNs, and can take actions like masking (de-identifying) sensitive data or denying the publish operation. This is built into the SNS service and requires no additional infrastructure. Lambda-based solutions introduce latency and complexity, and Macie does not monitor SNS topics in real time.", "question_zh": "一家公司使用 Amazon SNS 主题将包含客户数据的消息分发给多个下游消费者。合规性要求任何包含信用卡号或社会保障号等个人身份信息 (PII) 的消息都必须被检测到，并在发送前进行屏蔽或完全阻止。\n \n哪个功能本身就提供了此功能？", "options_zh": ["配置主题上的 SNS 消息数据保护策略，使用数据标识符来检测消息中的 PII 模式，并采取在传递前屏蔽敏感数据或拒绝发布操作的操作。", "创建一个订阅 SNS 主题的 Lambda 函数，该函数使用 Amazon Comprehend 检查每条消息的 PII 模式，并将经过清理的消息重新发布到下游消费者的干净 SNS 主题。", "使 Amazon Macie 能够监控 SNS 主题中的敏感数据，并配置 EventBridge 规则以在传输过程中检测到 PII 时阻止消息传输。", "在每个订阅者上配置 SNS 订阅过滤策略，过滤掉包含与 PII 数据格式（例如信用卡号）匹配的模式的消息。"], "explanation_zh": "SNS 消息数据保护策略提供对 SNS 消息中敏感数据的本机内联检测和保护。这些策略使用托管数据标识符来检测信用卡号和 SSN 等 PII 模式，并可以采取屏蔽（去识别化）敏感数据或拒绝发布操作等操作。这是内置于 SNS 服务中的，不需要额外的基础设施。基于 Lambda 的解决方案会带来延迟和复杂性，而且 Macie 无法实时监控 SNS 主题。"}, {"exam": 3, "id": 54, "question_en": "A company runs hundreds of microservices on Amazon EKS that communicate using mutual TLS (mTLS). They need to issue short-lived certificates (valid for 24 hours) to each service at scale, minimizing the risk from compromised certificates and eliminating the need for certificate revocation infrastructure.\n \nWhich solution provides scalable short-lived certificate issuance?", "options_en": ["Use ACM to issue public certificates for each microservice with automatic renewal, and configure EKS pods to retrieve certificates from ACM using IAM Roles for Service Accounts.", "Use AWS Private CA configured in short-lived certificate mode, which optimizes for high-volume issuance of certificates with validity periods up to seven days, and integrate with a service mesh for automated certificate rotation.", "Deploy cert-manager on EKS with a self-signed CA issuer that generates 24-hour certificates for each pod, storing the CA private key in a Kubernetes secret encrypted with KMS.", "Use AWS Secrets Manager to store pre-generated TLS certificate-key pairs with 24-hour rotation, and configure EKS pods to retrieve their certificates at startup using the Secrets Manager CSI driver."], "correct": 1, "explanation_en": "AWS Private CA offers a short-lived certificate mode optimized for high-volume issuance of certificates with validity periods up to seven days at a reduced cost compared to general-purpose mode. Short-lived certificates minimize the risk from compromise because they expire quickly, reducing the need for revocation infrastructure. Integration with service mesh tools like AWS App Mesh or Istio provides automated certificate rotation. ACM public certificates cannot be issued with 24-hour validity and are not designed for mTLS between internal services.", "question_zh": "一家公司在 Amazon EKS 上运行数百个微服务，这些微服务使用相互 TLS (mTLS) 进行通信。他们需要大规模地向每项服务颁发短期证书（有效期为 24 小时），从而最大限度地降低证书受损的风险并消除对证书吊销基础设施的需求。\n \n哪种解决方案提供可扩展的短期证书颁发？", "options_zh": ["使用 ACM 为每个微服务颁发公共证书并自动续订，并配置 EKS Pod 以使用服务账户的 IAM 角色从 ACM 检索证书。", "使用在短期证书模式下配置的 AWS Private CA，该模式针对大批量颁发有效期长达 7 天的证书进行了优化，并与服务网格集成以实现自动证书轮换。", "在 EKS 上部署 cert-manager，并使用自签名 CA 颁发者为每个 Pod 生成 24 小时证书，并将 CA 私钥存储在使用 KMS 加密的 Kubernetes 密钥中。", "使用 AWS Secrets Manager 存储预先生成的 24 小时轮换的 TLS 证书密钥对，并配置 EKS Pod 以在启动时使用 Secrets Manager CSI 驱动程序检索其证书。"], "explanation_zh": "AWS Private CA 提供短期证书模式，针对大批量证书颁发进行了优化，有效期长达 7 天，与通用模式相比，成本更低。短期证书可以最大限度地降低泄露风险，因为它们很快就会过期，从而减少了对吊销基础设施的需求。与 AWS App Mesh 或 Istio 等服务网格工具集成可提供自动证书轮换。 ACM 公共证书无法颁发 24 小时有效期的证书，并且不适用于内部服务之间的 mTLS。"}, {"exam": 3, "id": 55, "question_en": "A healthcare application needs to process protected health information (PHI) in a way that prevents even the EC2 instance administrator or the application other processes from accessing the unencrypted PHI data during processing. The solution must provide a cryptographically isolated compute environment on the same EC2 instance.\n \nWhich AWS feature provides this level of isolation?", "options_en": ["Launch the EC2 instance with a dedicated tenancy to ensure hardware isolation from other AWS customers, and use encrypted EBS volumes for PHI storage.", "Run the PHI processing workload in a Docker container on ECS with `readonlyRootFilesystem` enabled and no network access, isolating it from other containers.", "Use AWS Nitro Enclaves to create an isolated compute environment on the EC2 instance with its own kernel, memory, and CPU, where the enclave has no persistent storage, no external network access, and no interactive access, even from the parent instance.", "Deploy the PHI processing in a Lambda function with VPC configuration that has no internet access, ensuring the function runs in an isolated execution environment managed by AWS."], "correct": 2, "explanation_en": "AWS Nitro Enclaves create isolated virtual machines on the EC2 instance with their own kernel, memory, and CPU cores. Enclaves have no persistent storage, no external networking, and no interactive access (no SSH, no console). Even the EC2 instance owner cannot access the enclave memory. Data enters the enclave through a secure local channel (vsock) and can only be decrypted inside the enclave using KMS attestation. Dedicated tenancy isolates from other customers but not from the instance administrator.", "question_zh": "医疗保健应用程序需要以某种方式处理受保护的健康信息 (PHI)，甚至防止 EC2 实例管理员或应用程序其他进程在处理过程中访问未加密的 PHI 数据。该解决方案必须在同一 EC2 实例上提供加密隔离的计算环境。\n \n哪个 AWS 功能提供了这种级别的隔离？", "options_zh": ["使用专用租赁启动 EC2 实例，以确保与其他 AWS 客户的硬件隔离，并使用加密的 EBS 卷进行 PHI 存储。", "在启用了“readonlyRootFilesystem”且没有网络访问权限的 ECS 上的 Docker 容器中运行 PHI 处理工作负载，将其与其他容器隔离。", "使用 AWS Nitro Enclaves 在具有自己的内核、内存和 CPU 的 EC2 实例上创建一个隔离的计算环境，其中 enclave 没有持久存储、没有外部网络访问，也没有交互式访问，即使来自父实例也是如此。", "在具有无法访问 Internet 的 VPC 配置的 Lambda 函数中部署 PHI 处理，确保该函数在由 AWS 管理的隔离执行环境中运行。"], "explanation_zh": "AWS Nitro Enclaves 在 EC2 实例上使用自己的内核、内存和 CPU 核心创建隔离的虚拟机。 Enclave 没有持久存储、没有外部网络、也没有交互式访问（没有 SSH、没有控制台）。即使 EC2 实例所有者也无法访问 enclave 内存。数据通过安全本地通道 (vsock) 进入 enclave，并且只能使用 KMS 证明在 enclave 内部进行解密。专用租赁与其他客户隔离，但与实例管理员隔离。"}, {"exam": 3, "id": 56, "question_en": "A security team manages Amazon EKS clusters that store database credentials and API keys as Kubernetes Secrets. By default, Kubernetes Secrets are only base64-encoded, not encrypted. The team needs to enable encryption at rest for Kubernetes Secrets using a customer-managed KMS key, ensuring that the secrets are encrypted in the etcd datastore.\n \nHow should this be configured?", "options_en": ["Create a KMS key and modify the EKS worker node IAM role to include `kms:Encrypt` and `kms:Decrypt` permissions, then enable the ETCD encryption provider on each worker node.", "Use the Kubernetes External Secrets Operator to sync secrets from AWS Secrets Manager into the cluster, replacing native Kubernetes Secrets with references to externally managed secrets.", "Enable EBS encryption for the EKS control plane etcd volumes using a customer-managed KMS key configured through the EKS cluster storage settings.", "Enable envelope encryption on the EKS cluster by associating a customer-managed KMS key, which configures the Kubernetes API server to encrypt Secrets using a data encryption key (DEK) that is itself encrypted by the KMS key."], "correct": 3, "explanation_en": "EKS supports envelope encryption for Kubernetes Secrets by associating a customer-managed KMS key with the cluster. When enabled, the Kubernetes API server uses a data encryption key (DEK) to encrypt Secrets before storing them in etcd, and the DEK is encrypted by the KMS key. This is configured at the cluster level through the EKS API or console. Worker nodes do not manage etcd encryption; it is handled by the EKS-managed control plane. External Secrets Operator is a valid alternative but does not encrypt native Kubernetes Secrets in etcd.", "question_zh": "安全团队管理将数据库凭证和 API 密钥存储为 Kubernetes Secret 的 Amazon EKS 集群。默认情况下，Kubernetes Secret 仅进行 Base64 编码，未加密。团队需要使用客户管理的 KMS 密钥为 Kubernetes Secret 启用静态加密，确保机密在 etcd 数据存储中加密。\n \n这个应该怎么配置呢？", "options_zh": ["创建 KMS 密钥并修改 EKS 工作节点 IAM 角色以包含“kms:Encrypt”和“kms:Decrypt”权限，然后在每个工作节点上启用 ETCD 加密提供程序。", "使用 Kubernetes external Secrets Operator 将 AWS Secrets Manager 中的密钥同步到集群中，将本机 Kubernetes Secret 替换为对外部管理密钥的引用。", "使用通过 EKS 集群存储设置配置的客户管理的 KMS 密钥为 EKS 控制平面 etcd 卷启用 EBS 加密。", "通过关联客户管理的 KMS 密钥，在 EKS 集群上启用信封加密，这将 Kubernetes API 服务器配置为使用本身由 KMS 密钥加密的数据加密密钥 (DEK) 来加密 Secret。"], "explanation_zh": "EKS 通过将客户管理的 KMS 密钥与集群关联来支持 Kubernetes Secret 的信封加密。启用后，Kubernetes API 服务器在将 Secret 存储到 etcd 之前使用数据加密密钥 (DEK) 对其进行加密，并且 DEK 由 KMS 密钥加密。这是通过 EKS API 或控制台在集群级别配置的。工作节点不管理etcd加密；它由 EKS 管理的控制平面处理。外部 Secrets Operator 是一个有效的替代方案，但不会加密 etcd 中的本机 Kubernetes Secret。"}, {"exam": 3, "id": 57, "question_en": "A company uses Terraform as their standard IaC tool and wants to automate the provisioning of new AWS accounts through AWS Control Tower. They need each new account to be automatically configured with standard VPC layouts, IAM roles, security baselines, and compliance guardrails, all defined in Terraform. Account requests should be submitted through Terraform code.\n \nWhich solution enables Terraform-based account provisioning with Control Tower?", "options_en": ["Deploy Account Factory for Terraform (AFT), which integrates with Control Tower to provision accounts from Terraform configurations and supports account customizations defined as Terraform modules applied during and after account creation.", "Create a Terraform module that calls the AWS Organizations API to create accounts and then uses Terraform providers to configure each account with standard resources, registered with Control Tower post-creation.", "Use Control Tower Account Factory from the console to create accounts and configure a Terraform Cloud webhook that triggers account customization workspaces when new account creation events are detected.", "Deploy a Step Functions workflow triggered by Terraform that calls the Control Tower `CreateManagedAccount` API, then executes Terraform apply in each new account through CodeBuild projects."], "correct": 0, "explanation_en": "Account Factory for Terraform (AFT) is the official AWS solution for integrating Terraform with Control Tower account provisioning. AFT allows defining account requests as Terraform configurations and supports customizations through Terraform modules that are automatically applied during and after account creation. It handles the full lifecycle including Control Tower guardrail enrollment. Creating accounts directly through Organizations API bypasses Control Tower guardrails and governance controls.", "question_zh": "一家公司使用 Terraform 作为其标准 IaC 工具，并希望通过 AWS Control Tower 自动配置新的 AWS 账户。他们需要为每个新账户自动配置标准 VPC 布局、IAM 角色、安全基线和合规性护栏，所有这些都在 Terraform 中定义。帐户请求应通过 Terraform 代码提交。\n \n哪种解决方案支持使用 Control Tower 进行基于 Terraform 的帐户配置？", "options_zh": ["部署 Terraform 帐户工厂 (AFT)，它与 ​​Control Tower 集成，从 Terraform 配置中配置帐户，并支持定义为在帐户创建期间和之后应用的 Terraform 模块的帐户自定义。", "创建一个 Terraform 模块，该模块调用 AWS Organizations API 来创建账户，然后使用 Terraform 提供程序使用标准资源配置每个账户，并在创建后向 Control Tower 注册。", "从控制台使用 Control Tower Account Factory 创建帐户并配置 Terraform Cloud Webhook，该 Webhook 在检测到新帐户创建事件时触发帐户自定义工作区。", "部署由 Terraform 触发的 Step Functions 工作流，该工作流调用 Control Tower `CreateManagedAccount` API，然后通过 CodeBuild 项目在每个新帐户中执行 Terraform apply。"], "explanation_zh": "Account Factory for Terraform (AFT) 是用于将 Terraform 与 Control Tower 账户配置集成的官方 AWS 解决方案。 AFT 允许将帐户请求定义为 Terraform 配置，并支持通过在帐户创建期间和之后自动应用的 Terraform 模块进行自定义。它处理整个生命周期，包括控制塔护栏注册。直接通过 Organizations API 创建帐户会绕过 Control Tower 护栏和治理控制。"}, {"exam": 3, "id": 58, "question_en": "A company needs to deploy a consistent set of 40 AWS Config rules across 200 AWS accounts in their organization to evaluate compliance with their internal security baseline. The rules and remediation actions must be deployed as a single unit and must be identical across all accounts. Updates to the rule set should be propagated automatically.\n \nWhich feature provides this capability?", "options_en": ["Create an AWS Config aggregator in the management account that collects compliance data from all 200 accounts, and deploy individual Config rules in each account using CloudFormation StackSets.", "Deploy an AWS Config organizational conformance pack that bundles the 40 Config rules and remediation actions as a single unit, automatically deployed and updated across all organization accounts.", "Use AWS Security Hub with the AWS Foundational Security Best Practices standard enabled across all accounts, which automatically deploys and evaluates the required Config rules.", "Create an AWS Service Catalog portfolio with a Config rules product that member account administrators deploy, ensuring consistent rule sets through version-controlled product updates."], "correct": 1, "explanation_en": "AWS Config organizational conformance packs allow deploying a bundle of Config rules and remediation actions as a single unit across all accounts in an AWS Organization. Updates to the conformance pack are automatically propagated to all member accounts. This provides centralized management and consistent compliance evaluation. CloudFormation StackSets can deploy rules but do not provide the bundled conformance pack management features like drift detection and compliance score aggregation.", "question_zh": "公司需要在其组织中的 200 个 AWS 账户中部署一组一致的 40 条 AWS Config 规则，以评估其内部安全基线的合规性。规则和补救措施必须作为一个单元进行部署，并且在所有账户中必须相同。规则集的更新应该自动传播。\n \n哪个功能提供了此功能？", "options_zh": ["在管理账户中创建一个 AWS Config 聚合器，从所有 200 个账户收集合规性数据，并使用 CloudFormation StackSets 在每个账户中部署单独的 Config 规则。", "部署 AWS Config 组织一致性包，将 40 条 Config 规则和修复操作捆绑为一个单元，并在所有组织账户中自动部署和更新。", "使用 AWS Security Hub 并在所有账户中启用 AWS 基础安全最佳实践标准，该标准会自动部署和评估所需的 Config 规则。", "使用成员账户管理员部署的 Config 规则产品创建 AWS Service Catalog 产品组合，通过版本控制的产品更新确保规则集的一致性。"], "explanation_zh": "AWS Config 组织一致性包允许将一组 Config 规则和修复操作作为单个单元部署到 AWS 组织中的所有账户。一致性包的更新会自动传播到所有成员帐户。这提供了集中管理和一致的合规性评估。 CloudFormation StackSets 可以部署规则，但不提供捆绑的一致性包管理功能，例如偏差检测和合规性分数聚合。"}, {"exam": 3, "id": 59, "question_en": "A company needs to continuously collect evidence for PCI DSS compliance across their AWS environment. They want automated evidence collection for controls that map to PCI DSS requirements, including CloudTrail logs, Config rule evaluations, and Security Hub findings. The evidence must be organized by PCI DSS requirement for auditor review.\n \nWhich service provides automated compliance evidence collection?", "options_en": ["Configure AWS Security Hub with the PCI DSS standard enabled, which evaluates controls against PCI requirements and generates a compliance report suitable for auditor review.", "Create a custom AWS Config conformance pack with rules mapped to PCI DSS requirements and generate compliance reports from the Config dashboard for auditor review.", "Use AWS Audit Manager with the PCI DSS prebuilt framework to create an assessment that automatically collects evidence from CloudTrail, Config, and Security Hub, organized by PCI DSS control domains for auditor review.", "Build a custom compliance dashboard using Amazon QuickSight that aggregates data from CloudTrail, Config, and Security Hub, with visualizations mapped to PCI DSS requirements."], "correct": 2, "explanation_en": "AWS Audit Manager provides prebuilt frameworks for compliance standards including PCI DSS. When an assessment is created using the PCI DSS framework, Audit Manager automatically collects evidence from multiple AWS sources including CloudTrail logs, Config evaluations, and Security Hub findings. Evidence is organized by PCI DSS control domains, making it ready for auditor review. Security Hub evaluates controls but does not collect and organize evidence across multiple data sources in the structured format that auditors require.", "question_zh": "公司需要在其 AWS 环境中持续收集 PCI DSS 合规性证据。他们希望针对符合 PCI DSS 要求的控制措施自动收集证据，包括 CloudTrail 日志、Config 规则评估和 Security Hub 结果。证据必须按照 PCI DSS 审核员审查要求进行组织。\n \n哪种服务提供自动合规证据收集？", "options_zh": ["配置 AWS Security Hub 并启用 PCI DSS 标准，该标准可根据 PCI 要求评估控制措施并生成适合审核员审查的合规性报告。", "使用映射到 PCI DSS 要求的规则创建自定义 AWS Config 一致性包，并从 Config 仪表板生成合规性报告以供审核员审查。", "将 AWS Audit Manager 与 PCI DSS 预构建框架结合使用来创建评估，自动从 CloudTrail、Config 和 Security Hub 收集证据，并按 PCI DSS 控制域组织以供审核员审查。", "使用 Amazon QuickSight 构建自定义合规性仪表板，该仪表板聚合来自 CloudTrail、Config 和 Security Hub 的数据，并具有映射到 PCI DSS 要求的可视化效果。"], "explanation_zh": "AWS Audit Manager 提供了符合 PCI DSS 等合规性标准的预构建框架。使用 PCI DSS 框架创建评估时，Audit Manager 会自动从多个 AWS 来源收集证据，包括 CloudTrail 日志、Config 评估和 Security Hub 结果。证据由 PCI DSS 控制域组织，以便为审计员审查做好准备。 Security Hub 评估控制措施，但不会以审计人员要求的结构化格式跨多个数据源收集和组织证据。"}, {"exam": 3, "id": 60, "question_en": "An organization wants to prevent any AWS principal outside the organization from accessing resources in their member accounts. Unlike SCPs which restrict what principals in member accounts can do, they need a mechanism that restricts who can access resources in member accounts regardless of the resource policy configuration.\n \nWhich Organizations policy type provides this capability?", "options_en": ["Service Control Policies (SCPs) with `aws:PrincipalOrgID` conditions that deny all actions unless the requesting principal belongs to the organization.", "Tag policies with enforcement enabled that require all resource-based policies to include the organization ID as a condition, preventing external access.", "Backup policies that centrally define resource access controls for all supported services across organization member accounts.", "Resource Control Policies (RCPs) attached to the organization root or OUs, which set the maximum permissions for resources in member accounts and can restrict external principal access regardless of resource policy configurations."], "correct": 3, "explanation_en": "Resource Control Policies (RCPs) are an Organizations policy type that sets maximum permissions for resources in member accounts. Unlike SCPs which constrain what member account principals can do, RCPs constrain who can access resources in member accounts, even when resource-based policies grant broader access. This provides a preventive control against external access that cannot be overridden by individual resource policies. SCPs with `aws:PrincipalOrgID` conditions restrict member account principals, not external principals accessing resources.", "question_zh": "组织希望阻止组织外部的任何 AWS 委托人访问其成员账户中的资源。与限制成员帐户中的主体可以执行的操作的 SCP 不同，它们需要一种机制来限制谁可以访问成员帐户中的资源，而不管资源策略配置如何。\n \n哪种组织策略类型提供此功能？", "options_zh": ["具有“aws:PrincipalOrgID”条件的服务控制策略 (SCP) 拒绝所有操作，除非请求主体属于组织。", "启用强制执行的标记策略要求所有基于资源的策略都包含组织 ID 作为条件，以防止外部访问。", "备份策略集中定义跨组织成员帐户的所有受支持服务的资源访问控制。", "附加到组织根或 OU 的资源控制策略 (RCP)，它设置成员帐户中资源的最大权限，并且可以限制外部主体访问，无论资源策略配置如何。"], "explanation_zh": "资源控制策略 (RCP) 是一种组织策略类型，用于设置成员帐户中资源的最大权限。与限制成员账户主体可以执行的操作的 SCP 不同，RCP 限制谁可以访问成员账户中的资源，即使基于资源的策略授予更广泛的访问权限。这提供了对外部访问的预防性控制，该控制不能被单个资源策略覆盖。具有“aws:PrincipalOrgID”条件的 SCP 限制成员账户主体，而不是访问资源的外部主体。"}, {"exam": 3, "id": 61, "question_en": "A security team needs to detect when EC2 instances, security groups, and IAM roles deployed through CloudFormation stacks are manually modified outside of CloudFormation, creating configuration drift from the intended state. They want automated detection and notification when drift occurs.\n \nWhich approach detects this infrastructure drift?", "options_en": ["Enable CloudFormation drift detection on the stacks containing the resources, which compares the actual resource configurations against the expected template configurations and identifies properties that have been modified.", "Configure AWS Config rules that compare current resource configurations against a stored baseline configuration, triggering an SNS notification when differences are detected.", "Create CloudTrail metric filters for modify and update API calls on the stack resources, and set CloudWatch alarms to alert when changes are made outside of CloudFormation.", "Use Terraform import to bring the CloudFormation-managed resources under Terraform state management, then run terraform plan to detect configuration differences."], "correct": 0, "explanation_en": "CloudFormation drift detection compares the actual state of stack resources against their expected configurations defined in the CloudFormation template. It identifies which resources have drifted and which specific properties have been modified. This is the native mechanism for detecting out-of-band changes to CloudFormation-managed resources. CloudTrail can detect API calls but cannot determine whether the resulting state differs from the intended template configuration. Using Terraform for drift detection on CloudFormation stacks introduces unnecessary tool complexity.", "question_zh": "安全团队需要检测何时在 CloudFormation 外部手动修改通过 CloudFormation 堆栈部署的 EC2 实例、安全组和 IAM 角色，从而导致配置偏离预期状态。他们希望在发生偏差时自动检测并发出通知。\n \n哪种方法可以检测到这种基础设施漂移？", "options_zh": ["在包含资源的堆栈上启用 CloudFormation 偏差检测，它将实际资源配置与预期模板配置进行比较，并识别已修改的属性。", "配置 AWS Config 规则，将当前资源配置与存储的基准配置进行比较，并在检测到差异时触发 SNS 通知。", "创建 CloudTrail 指标筛选器以修改和更新堆栈资源上的 API 调用，并设置 CloudWatch 警报以在 CloudFormation 外部进行更改时发出警报。", "使用 Terraform 导入将 CloudFormation 管理的资源置于 Terraform 状态管理之下，然后运行 ​​terraform plan 来检测配置差异。"], "explanation_zh": "CloudFormation 偏差检测将堆栈资源的实际状态与 CloudFormation 模板中定义的预期配置进行比较。它确定哪些资源已发生漂移以及哪些特定属性已被修改。这是用于检测 CloudFormation 托管资源的带外更改的本机机制。 CloudTrail 可以检测 API 调用，但无法确定结果状态是否与预期的模板配置不同。使用 Terraform 在 CloudFormation 堆栈上进行偏差检测会带来不必要的工具复杂性。"}, {"exam": 3, "id": 62, "question_en": "A company wants to enforce DNS Firewall protection across all VPCs in their AWS Organization. They need to ensure that all existing and newly created VPCs automatically have DNS Firewall rule group associations that block queries to known malicious domains, without requiring individual account administrators to configure anything.\n \nWhich service centralizes this enforcement?", "options_en": ["Use AWS Control Tower guardrails to require DNS Firewall rule group associations on all VPCs, with a detective guardrail that reports non-compliant VPCs.", "Create an AWS Config organizational rule that checks for DNS Firewall associations on all VPCs and auto-remediates by attaching the rule group using an SSM Automation document.", "Deploy a CloudFormation StackSet that creates DNS Firewall rule group associations in all member accounts, with automatic deployment to new accounts enabled.", "Use AWS Firewall Manager to create a DNS Firewall policy scoped to the organization, which automatically creates and manages DNS Firewall rule group associations on all VPCs across member accounts, including newly created VPCs."], "correct": 3, "explanation_en": "AWS Firewall Manager is designed for centrally managing security policies across an AWS Organization. DNS Firewall policies in Firewall Manager automatically create rule group associations on all VPCs in scope, including VPCs created after the policy is deployed. This requires no action from individual account administrators. CloudFormation StackSets can deploy resources across accounts but do not automatically detect and protect newly created VPCs without additional automation.", "question_zh": "一家公司希望在其 AWS 组织中的所有 VPC 上实施 DNS 防火墙保护。他们需要确保所有现有和新创建的 VPC 自动具有 DNS 防火墙规则组关联，阻止对已知恶意域的查询，而不需要个人帐户管理员进行任何配置。\n \n哪个服务集中执行此操作？", "options_zh": ["使用 AWS Control Tower 护栏要求所有 VPC 上的 DNS 防火墙规则组关联，并使用报告不合规 VPC 的检测护栏。", "创建一个 AWS Config 组织规则，检查所有 VPC 上的 DNS 防火墙关联，并通过使用 SSM 自动化文档附加规则组来自动修复。", "部署 CloudFormation StackSet，在所有成员帐户中创建 DNS 防火墙规则组关联，并启用自动部署到新帐户。", "使用 AWS Firewall Manager 创建范围为组织的 DNS 防火墙策略，该策略会自动在成员账户的所有 VPC（包括新创建的 VPC）上创建和管理 DNS 防火墙规则组关联。"], "explanation_zh": "AWS Firewall Manager 旨在集中管理整个 AWS 组织的安全策略。 Firewall Manager 中的 DNS 防火墙策略会自动在范围内的所有 VPC 上创建规则组关联，包括部署策略后创建的 VPC。这不需要个人帐户管理员执行任何操作。 CloudFormation StackSets 可以跨账户部署资源，但在没有额外自动化的情况下不会自动检测和保护新创建的 VPC。"}, {"exam": 3, "id": 63, "question_en": "A company provides developers with pre-approved infrastructure templates through AWS Service Catalog. Developers should be able to launch products without needing broad IAM permissions for the underlying services (EC2, RDS, VPC). The provisioning should use a controlled IAM role with specific permissions rather than the developer own permissions.\n \nHow should this be configured?", "options_en": ["Grant developers the `servicecatalog:ProvisionProduct` permission and IAM permissions for all underlying services, then restrict the Terraform or CloudFormation actions through resource-level permissions.", "Configure a launch constraint on each Service Catalog product that specifies an IAM role with permissions to create the underlying resources. Developers only need `servicecatalog:ProvisionProduct` permission, and the product launches using the launch constraint role.", "Create an SCP that allows developers to create resources only when the API call originates from the Service Catalog service principal, blocking direct resource creation attempts.", "Use Service Catalog provisioned product plans that generate an execution plan for the developer to review, and require an administrator to approve the plan before resources are created."], "correct": 1, "explanation_en": "Service Catalog launch constraints specify an IAM role that Service Catalog assumes when launching a product. This means developers only need permission to interact with Service Catalog, not the underlying AWS services. The launch constraint role has the specific permissions needed to create the product resources. This follows least privilege by separating the developer ability to request infrastructure from the permissions needed to create it. Granting developers permissions for underlying services defeats the purpose of using Service Catalog as an access control layer.", "question_zh": "一家公司通过 AWS Service Catalog 向开发人员提供预先批准的基础设施模板。开发人员应该能够推出产品，而无需底层服务（EC2、RDS、VPC）的广泛 IAM 权限。配置应使用具有特定权限的受控 IAM 角色，而不是开发人员自己的权限。\n \n这个应该怎么配置呢？", "options_zh": ["授予开发人员所有底层服务的“servicecatalog:ProvisionProduct”权限和 IAM 权限，然后通过资源级权限限制 Terraform 或 CloudFormation 操作。", "在每个 Service Catalog 产品上配置启动约束，指定具有创建底层资源权限的 IAM 角色。开发人员只需要“servicecatalog:ProvisionProduct”权限，产品就会使用启动约束角色启动。", "创建一个 SCP，仅当 API 调用源自服务目录服务主体时才允许开发人员创建资源，从而阻止直接资源创建尝试。", "使用服务目录配置的产品计划生成执行计划供开发人员查看，并要求管理员在创建资源之前批准该计划。"], "explanation_zh": "Service Catalog 启动约束指定 Service Catalog 在启动产品时承担的 IAM 角色。这意味着开发人员只需要与 Service Catalog 交互的权限，而不需要与底层 AWS 服务交互。启动约束角色具有创建产品资源所需的特定权限。这遵循最小特权，将开发人员请求基础设施的能力与创建基础设施所需的权限分开。授予开发人员对底层服务的权限违背了使用服务目录作为访问控制层的目的。"}, {"exam": 3, "id": 64, "question_en": "A network team manages a centralized Transit Gateway in a shared services account and needs to share it with all accounts in specific organizational units (OUs) so that VPCs in those accounts can create attachments. They want sharing to be automatic for new accounts added to the OUs without manual intervention.\n \nHow should the Transit Gateway be shared?", "options_en": ["Create IAM cross-account roles in each member account that allow the shared services account to create Transit Gateway VPC attachments on behalf of member accounts.", "Deploy a CloudFormation StackSet targeted at the OUs that creates a Transit Gateway peering connection from each member account to the central Transit Gateway.", "Use AWS Resource Access Manager (RAM) to share the Transit Gateway with the target OUs in the organization. RAM automatically includes new accounts added to the OUs, allowing them to create VPC attachments to the shared Transit Gateway.", "Export the Transit Gateway ID as a CloudFormation export in the shared services account and import it in member account templates to create VPC attachments using cross-stack references."], "correct": 2, "explanation_en": "AWS Resource Access Manager (RAM) enables sharing resources like Transit Gateways with specific accounts, OUs, or the entire organization. When shared with an OU, RAM automatically extends the share to new accounts added to that OU. Member accounts can then create VPC attachments to the shared Transit Gateway without needing cross-account IAM roles. CloudFormation cross-stack references do not work across accounts, and peering connections are for connecting different Transit Gateways rather than sharing a single one.", "question_zh": "网络团队在共享服务账户中管理集中式 Transit Gateway，并需要与特定组织单位 (OU) 中的所有账户共享，以便这些账户中的 VPC 可以创建附件。他们希望添加到 OU 的新帐户能够自动共享，无需手动干预。\n \nTransit Gateway 应如何共享？", "options_zh": ["在每个成员账户中创建 IAM 跨账户角色，以允许共享服务账户代表成员账户创建 Transit Gateway VPC 附件。", "部署针对 OU 的 CloudFormation StackSet，该 OU 创建从每个成员帐户到中央 Transit Gateway 的 Transit Gateway 对等连接。", "使用 AWS Resource Access Manager (RAM) 与组织中的目标 OU 共享 Transit Gateway。 RAM 自动包含添加到 OU 的新帐户，允许它们创建共享 Transit Gateway 的 VPC 附件。", "将 Transit Gateway ID 作为 CloudFormation 导出导出到共享服务账户中，并将其导入到成员账户模板中，以使用跨堆栈引用创建 VPC 附件。"], "explanation_zh": "AWS Resource Access Manager (RAM) 支持与特定账户、OU 或整个组织共享传输网关等资源。与 OU 共享时，RAM 会自动将共享扩展到添加到该 OU 的新帐户。然后，成员账户可以创建到共享 Transit Gateway 的 VPC 附件，而无需跨账户 IAM 角色。 CloudFormation 跨堆栈引用不能跨帐户使用，对等连接用于连接不同的 Transit Gateway，而不是共享单个 Transit Gateway。"}, {"exam": 3, "id": 65, "question_en": "An organization wants to enforce that all EC2 instances launched in member accounts use IMDSv2, have detailed monitoring enabled, and use specific EBS volume types. These baseline configurations should be enforced transparently at the organization level without modifying any application code or CloudFormation templates in member accounts.\n \nWhich Organizations policy type enforces these EC2 instance attribute defaults?", "options_en": ["Service Control Policies (SCPs) that deny `ec2:RunInstances` calls unless the request includes IMDSv2, detailed monitoring, and approved EBS volume types as parameters.", "AWS Config organizational rules that detect non-compliant EC2 instances and auto-remediate by modifying instance attributes to match the required configuration.", "Tag policies with enforcement that require specific tags on EC2 instances indicating the baseline configuration has been applied.", "Declarative policies attached to the organization or OUs that define baseline EC2 instance configurations such as IMDSv2, monitoring settings, and EBS defaults, enforced transparently without requiring changes to member account code or templates."], "correct": 3, "explanation_en": "Declarative policies are an AWS Organizations policy type that enforces baseline configurations for AWS services across member accounts. For EC2, declarative policies can enforce IMDSv2, monitoring settings, and other instance attribute defaults. These policies are applied transparently, meaning member accounts do not need to modify their launch configurations or templates. SCPs can deny non-compliant launches but require users to know and specify the correct parameters. Config rules are detective controls that act after resources are created.", "question_zh": "组织希望强制在成员账户中启动的所有 EC2 实例都使用 IMDSv2、启用详细监控并使用特定的 EBS 卷类型。这些基线配置应在组织级别透明地实施，而无需修改成员帐户中的任何应用程序代码或 CloudFormation 模板。\n \n哪种组织策略类型强制执行这些 EC2 实例属性默认值？", "options_zh": ["拒绝“ec2:RunInstances”调用的服务控制策略 (SCP)，除非请求包含 IMDSv2、详细监控和批准的 EBS 卷类型作为参数。", "AWS Config 组织规则可检测不合规的 EC2 实例并通过修改实例属性以匹配所需的配置来自动修复。", "强制执行标签策略，需要 EC2 实例上的特定标签来指示已应用基准配置。", "附加到组织或 OU 的声明性策略，用于定义基线 EC2 实例配置（例如 IMDSv2、监控设置和 EBS 默认值），透明地实施，无需更改成员账户代码或模板。"], "explanation_zh": "声明性策略是一种 AWS Organizations 策略类型，可跨成员账户强制实施 AWS 服务的基准配置。对于 EC2，声明性策略可以强制实施 IMDSv2、监控设置和其他实例属性默认值。这些策略的应用是透明的，这意味着成员帐户不需要修改其启动配置或模板。 SCP 可以拒绝不合规的启动，但要求用户了解并指定正确的参数。配置规则是在创建资源后起作用的检测控制。"}, {"exam": 4, "id": 1, "question_en": "A company stores sensitive customer data in multiple S3 buckets. They want to detect unauthorized access attempts, anomalous data access patterns, and potential data exfiltration from their S3 buckets using a managed threat detection service.\n \nWhich feature should they enable?", "options_en": ["Enable CloudTrail data events for S3 and create CloudWatch metric filters that trigger alarms on suspicious API patterns like bulk GetObject or DeleteObject calls from unfamiliar principals.", "Deploy a scheduled Lambda function that queries S3 server access logs, correlates access patterns against a baseline, and publishes anomaly alerts to an SNS topic for the security team.", "Enable GuardDuty S3 Protection, which analyzes CloudTrail S3 data events to detect suspicious data access activities, credential exfiltration, and anomalous API call patterns targeting S3 buckets.", "Configure Amazon Macie with automated sensitive data discovery jobs that scan S3 objects for PII and flag buckets with unusual access frequency as potential exfiltration targets."], "correct": 2, "explanation_en": "GuardDuty S3 Protection uses CloudTrail S3 data events combined with machine learning to identify threats such as anomalous data access patterns, S3 API calls from unusual locations, and access from known malicious IP addresses. It detects credential exfiltration and privilege escalation related to S3 without requiring custom metric filters or Lambda functions. Macie focuses on data classification and sensitive data discovery, not real-time threat detection from API activity patterns.", "question_zh": "一家公司将敏感的客户数据存储在多个S3存储桶中。他们希望使用托管威胁检测服务来检测未经授权的访问尝试、异常数据访问模式以及潜在的S3存储桶数据泄露。\n\n他们应该启用哪个功能？", "options_zh": ["为S3启用CloudTrail数据事件，并创建CloudWatch指标筛选器，在出现可疑API模式（例如来自不熟悉主体的批量GetObject或DeleteObject调用）时触发告警。", "部署一个定时Lambda函数，该函数查询S3服务器访问日志，将访问模式与基线进行关联分析，并将异常告警发布到SNS主题以供安全团队处理。", "启用GuardDuty S3 Protection，该功能分析CloudTrail S3数据事件以检测可疑的数据访问活动、凭证泄露以及针对S3存储桶的异常API调用模式。", "配置Amazon Macie，使用自动化敏感数据发现作业扫描S3对象中的PII，并将访问频率异常的存储桶标记为潜在的数据泄露目标。"], "explanation_zh": "GuardDuty S3 Protection利用CloudTrail S3数据事件结合机器学习来识别威胁，例如异常数据访问模式、来自异常位置的S3 API调用以及来自已知恶意IP地址的访问。它可以检测与S3相关的凭证泄露和权限提升，无需自定义指标筛选器或Lambda函数。Macie专注于数据分类和敏感数据发现，而非基于API活动模式的实时威胁检测。"}, {"exam": 4, "id": 2, "question_en": "A SOC team receives thousands of Security Hub findings daily. They want to automatically suppress all findings from sandbox accounts and auto-set findings with CRITICAL severity to a `NOTIFIED` workflow status, without writing any custom code.\n \nWhich feature provides this capability?", "options_en": ["Create Security Hub automation rules that match findings based on account ID and severity criteria, and automatically update workflow status or suppress findings.", "Create EventBridge rules that match Security Hub finding events by account and severity, then invoke Lambda functions to call the BatchUpdateFindings API and update workflow status.", "Use Security Hub custom insights to build filtered views grouped by account ID and severity, then select matching findings in bulk and manually change workflow statuses through the console.", "Create AWS Config custom rules that evaluate Security Hub finding severity labels and trigger SSM Automation documents to update finding workflow status through cross-service API calls."], "correct": 0, "explanation_en": "Security Hub automation rules allow you to automatically update or suppress findings based on defined criteria such as account ID, severity, resource type, or finding title. Rules can change the workflow status, add notes, or suppress findings without writing any custom code, Lambda functions, or EventBridge rules. This is a native, codeless feature designed to reduce SOC operational toil in high-volume environments.", "question_zh": "一个SOC团队每天收到数千条Security Hub发现项。他们希望自动抑制来自沙盒账户的所有发现项，并自动将严重级别为CRITICAL的发现项的工作流状态设置为NOTIFIED，而无需编写任何自定义代码。\n\n哪个功能提供了这种能力？", "options_zh": ["创建Security Hub自动化规则，根据账户ID和严重级别条件匹配发现项，并自动更新工作流状态或抑制发现项。", "创建EventBridge规则，按账户和严重级别匹配Security Hub发现事件，然后调用Lambda函数调用BatchUpdateFindings API并更新工作流状态。", "使用Security Hub自定义洞察构建按账户ID和严重级别分组的筛选视图，然后在控制台中批量选择匹配的发现项并手动更改工作流状态。", "创建AWS Config自定义规则，评估Security Hub发现项严重级别标签，并触发SSM自动化文档通过跨服务API调用更新发现项工作流状态。"], "explanation_zh": "Security Hub自动化规则允许您根据定义的条件（如账户ID、严重级别、资源类型或发现项标题）自动更新或抑制发现项。规则可以更改工作流状态、添加注释或抑制发现项，无需编写任何自定义代码、Lambda函数或EventBridge规则。这是一个原生的无代码功能，旨在减少高容量环境中SOC的操作负担。"}, {"exam": 4, "id": 3, "question_en": "A company with 150 AWS accounts in an Organization needs a single CloudTrail trail that captures management events from all accounts. The security team in a dedicated security account should manage the trail, not the management account.\n \nHow should they configure this?", "options_en": ["Create individual CloudTrail trails in each of the 150 accounts using CloudFormation StackSets, delivering all logs to a shared S3 bucket in the security account with cross-account write permissions.", "Enable CloudTrail in the management account with an organization trail, then create cross-account IAM roles that let the security team view and manage the trail configuration and log data.", "Use CloudTrail Lake with an organization-wide event data store managed exclusively from the management account, granting the security account read-only query access to the Lake data.", "Designate the security account as the CloudTrail delegated administrator and create an organization trail from that account, which automatically captures events from all member accounts."], "correct": 3, "explanation_en": "CloudTrail supports delegated administrators, allowing a designated member account to create and manage organization trails on behalf of the entire organization. The organization trail automatically captures events from all accounts without individual setup per account. This follows the best practice of keeping the management account for governance only and delegating operational tasks to dedicated accounts. Creating individual trails via StackSets adds operational overhead without centralized management.", "question_zh": "一家拥有150个AWS账户的组织需要一个单一的CloudTrail跟踪来捕获所有账户的管理事件。位于专用安全账户中的安全团队应管理该跟踪，而非管理账户。\n\n他们应该如何配置？", "options_zh": ["使用CloudFormation StackSets在每个账户中创建单独的CloudTrail跟踪，将所有日志通过跨账户写入权限传输到安全账户中的共享S3存储桶。", "在管理账户中启用CloudTrail并创建组织跟踪，然后创建跨账户IAM角色，允许安全团队查看和管理跟踪配置及日志数据。", "使用CloudTrail Lake，在管理账户中创建组织范围的事件数据存储，仅授予安全账户对Lake数据的只读查询访问权限。", "将安全账户指定为CloudTrail委派管理员，并从该账户创建组织跟踪，该跟踪自动捕获所有成员账户的事件。"], "explanation_zh": "CloudTrail支持委派管理员，允许指定的成员账户代表整个组织创建和管理组织跟踪。组织跟踪自动捕获所有账户的事件，无需在每个账户中单独设置。这遵循了将管理账户仅用于治理、将运营任务委派给专用账户的最佳实践。通过StackSets创建单独跟踪增加了操作开销，且没有集中管理。"}, {"exam": 4, "id": 4, "question_en": "Application logs are sent to a CloudWatch Logs log group. The security team has created a metric filter counting failed login attempts. They want an alarm that adapts to the application's normal traffic patterns instead of using a static threshold that generates false positives during low-traffic periods.\n \nWhich approach should they use?", "options_en": ["Create a CloudWatch alarm with a static threshold and pair it with a scheduled Lambda function that adjusts the threshold value based on historical traffic patterns for the same time window.", "Enable CloudWatch anomaly detection on the failed login metric, which uses machine learning to model expected behavior and alerts when the metric deviates beyond the expected band.", "Create a CloudWatch composite alarm that combines the failed login metric alarm with a separate traffic volume metric alarm, requiring both to trigger before sending a notification.", "Use Amazon Lookout for Metrics to ingest the login failure metric from CloudWatch, detect anomalies using built-in machine learning, and provide automatic root cause grouping for analysis."], "correct": 1, "explanation_en": "CloudWatch anomaly detection uses machine learning to analyze a metric's historical data and build a model of expected behavior, accounting for daily, weekly, and seasonal patterns. An anomaly detection alarm triggers when the metric value falls outside the expected band. This reduces false positives during low-traffic periods while still detecting genuine spikes compared to the baseline. Lookout for Metrics is a separate service not designed for direct CloudWatch metric integration.", "question_zh": "应用日志被发送到CloudWatch Logs日志组。安全团队创建了一个计算失败登录尝试次数的指标筛选器。他们希望一个能够适应应用程序正常流量模式的告警，而不是使用静态阈值在低流量期间产生误报。\n\n他们应该使用哪种方法？", "options_zh": ["创建一个带静态阈值的CloudWatch告警，并搭配一个定时Lambda函数，该函数根据历史流量模式在同一时间窗口内调整阈值。", "对失败登录指标启用CloudWatch异常检测，该功能使用机器学习对预期行为建模，并在指标偏离预期范围时发出告警。", "创建一个CloudWatch复合告警，将失败登录指标告警与单独的流量指标告警结合，要求两者都触发后才发送通知。", "使用Amazon Lookout for Metrics从CloudWatch接收登录失败指标，利用内置机器学习检测异常，并提供自动根因分组以供分析。"], "explanation_zh": "CloudWatch异常检测使用机器学习分析指标的历史数据并构建预期行为模型，考虑每日、每周和季节性模式。异常检测告警在指标值超出预期范围时触发。这减少了低流量期间的误报，同时仍然能检测到相对于基线的真正峰值。Lookout for Metrics是一个独立服务，并非设计用于直接集成CloudWatch指标。"}, {"exam": 4, "id": 5, "question_en": "An organization uses a third-party firewall appliance that generates security logs in a proprietary format. They want to include these logs in Amazon Security Lake alongside native AWS log sources for unified threat analysis.\n \nHow should they integrate the third-party logs?", "options_en": ["Convert the firewall logs to JSON format, map each field to the OCSF schema manually, and upload the normalized records directly to the Security Lake managed S3 bucket using the PutObject API.", "Stream the firewall logs to Amazon OpenSearch Service via Kinesis Data Firehose, then configure an OpenSearch pipeline that normalizes records and forwards them to Security Lake as a subscriber.", "Register the firewall as a custom source in Security Lake with a unique source name and OCSF event class, then deliver normalized data in OCSF-compliant Parquet format to the designated S3 location.", "Configure an Amazon EventBridge partner integration with the firewall vendor to transform proprietary events into CloudTrail-compatible format and route them natively into Security Lake."], "correct": 2, "explanation_en": "Security Lake supports custom sources for integrating third-party security data. You register a custom source specifying a unique name and the OCSF event class. Security Lake provides an S3 location and role ARN for the custom source to deliver data. The data must be normalized into OCSF format and stored as Apache Parquet files. Writing directly to the Security Lake bucket without registering a custom source bypasses Security Lake's management, partitioning, and subscriber delivery mechanisms.", "question_zh": "一个组织使用第三方防火墙设备，该设备生成专有格式的安全日志。他们希望将这些日志与AWS原生日志源一起纳入Amazon Security Lake，以进行统一的威胁分析。\n\n他们应该如何集成第三方日志？", "options_zh": ["将防火墙日志转换为JSON格式，手动将每个字段映射到OCSF模式，然后使用PutObject API将规范化记录直接上传到Security Lake托管S3存储桶。", "通过Kinesis Data Firehose将防火墙日志流式传输到Amazon OpenSearch Service，然后配置一个OpenSearch管道，规范化记录并将其作为订阅者转发到Security Lake。", "在Security Lake中将防火墙注册为具有唯一源名称和OCSF事件类的自定义源，然后将规范化的OCSF兼容Parquet格式数据传送到指定的S3位置。", "配置Amazon EventBridge与防火墙供应商的合作伙伴集成，将专有事件转换为兼容CloudTrail的格式，并将其原生路由到Security Lake。"], "explanation_zh": "Security Lake支持自定义源来集成第三方安全数据。您需要注册一个自定义源，指定唯一名称和OCSF事件类。Security Lake为自定义源提供S3位置和角色ARN以传送数据。数据必须规范化为OCSF格式并存储为Apache Parquet文件。在未注册自定义源的情况下直接写入Security Lake存储桶会绕过Security Lake的管理、分区和订阅者交付机制。"}, {"exam": 4, "id": 6, "question_en": "A company stores VPC Flow Logs in S3 partitioned by account, Region, and date. When analysts query the data with Amazon Athena, they must frequently run `MSCK REPAIR TABLE` or Glue Crawlers to discover new partitions, causing delays.\n \nHow can they eliminate partition management overhead?", "options_en": ["Configure the Athena table with partition projection, defining partition key patterns that match the S3 path structure so Athena calculates partitions at query time without Glue Data Catalog updates.", "Create a scheduled Glue Crawler that runs every hour to scan the S3 prefix hierarchy, automatically discover new date and Region partitions, and register them in the Glue Data Catalog.", "Use a CloudWatch Events rule to trigger a Lambda function whenever new S3 prefixes appear, calling the Glue BatchCreatePartition API to register each new partition in the Data Catalog.", "Convert the VPC Flow Log data from its default format to compressed Parquet using a Glue ETL job, then create a new Athena table pointing to the Parquet output for faster query execution."], "correct": 0, "explanation_en": "Partition projection allows Athena to calculate partition values at query time from defined patterns, eliminating the need for partition metadata in the Glue Data Catalog entirely. This is particularly effective for time-series data like VPC Flow Logs where partitions follow a predictable hierarchical pattern (account/region/year/month/day). It reduces query planning time and eliminates the operational overhead of crawlers, Lambda functions, or manual partition management.", "question_zh": "一家公司将VPC Flow Logs存储在S3中，按账户、区域和日期分区。当分析师使用Amazon Athena查询数据时，他们必须频繁运行MSCK REPAIR TABLE或Glue爬虫来发现新分区，导致延迟。\n\n他们如何消除分区管理开销？", "options_zh": ["配置Athena表使用分区投影，定义与S3路径结构匹配的分区键模式，使Athena在查询时计算分区，无需Glue Data Catalog更新。", "创建一个定时Glue爬虫，每小时运行一次扫描S3前缀层次结构，自动发现新的日期和区域分区，并将其注册到Glue Data Catalog中。", "使用CloudWatch Events规则，在出现新S3前缀时触发Lambda函数，调用Glue BatchCreatePartition API将每个新分区注册到Data Catalog中。", "使用Glue ETL作业将VPC Flow Log数据从默认格式转换为压缩的Parquet格式，然后创建指向Parquet输出的新Athena表以加快查询执行速度。"], "explanation_zh": "分区投影允许Athena在查询时根据定义的模式计算分区值，完全消除了对Glue Data Catalog中分区元数据的需求。这对于像VPC Flow Logs这样遵循可预测层次模式（账户/区域/年/月/日）的时间序列数据特别有效。它减少了查询规划时间，并消除了爬虫、Lambda函数或手动分区管理的操作开销。"}, {"exam": 4, "id": 7, "question_en": "A security team uses Amazon OpenSearch Service for centralized log analysis. They need automated notifications via email and Slack when detection rules identify specific conditions, such as more than 10 failed SSH connections from a single source IP within 5 minutes.\n \nWhich OpenSearch feature should they configure?", "options_en": ["Create CloudWatch alarms on OpenSearch domain metrics such as CPUUtilization and JVMMemoryPressure, using high threshold values as a proxy indicator for security-related event spikes.", "Configure Amazon EventBridge rules that monitor OpenSearch API calls via CloudTrail and invoke an SNS topic to notify the security team when suspicious management-plane activity is detected.", "Deploy a Kinesis Data Analytics application with SQL-based tumbling window queries on the log ingestion stream, detecting threshold breaches and publishing SNS alerts for matched patterns.", "Configure an OpenSearch alerting monitor with a per-query trigger that runs on a schedule, evaluates query results against defined thresholds, and sends notifications to email and Slack destinations."], "correct": 3, "explanation_en": "OpenSearch Alerting is a built-in plugin that lets you create monitors running scheduled queries against indices and evaluating results against trigger conditions. When a condition is met (e.g., failed SSH count exceeds 10), OpenSearch sends notifications to destinations including email, Slack, Chime, and custom webhooks. This enables complex, data-driven alerting directly within OpenSearch. CloudWatch alarms operate on domain-level infrastructure metrics, not on indexed log data content.", "question_zh": "一个安全团队使用Amazon OpenSearch Service进行集中式日志分析。当检测规则识别到特定条件（例如在5分钟内来自单个源IP的SSH连接失败超过10次）时，他们需要通过电子邮件和Slack自动通知。\n\n他们应该配置哪个OpenSearch功能？", "options_zh": ["对OpenSearch域指标（如CPUUtilization和JVMMemoryPressure）创建CloudWatch告警，使用高阈值作为安全相关事件峰值的代理指标。", "配置Amazon EventBridge规则，通过CloudTrail监控OpenSearch API调用，并在检测到可疑管理平面活动时触发SNS主题通知安全团队。", "部署一个Kinesis Data Analytics应用程序，在日志摄取流上使用基于SQL的滚动窗口查询，检测阈值违规并为匹配模式发布SNS告警。", "配置OpenSearch告警监控器，使用按查询触发器按计划运行，根据定义的阈值评估查询结果，并向电子邮件和Slack目的地发送通知。"], "explanation_zh": "OpenSearch告警是一个内置插件，允许您创建监控器，按计划运行针对索引的查询并评估触发条件的结果。当满足条件时（例如SSH失败计数超过10），OpenSearch向包括电子邮件、Slack、Chime和自定义webhook的目的地发送通知。这实现了直接在OpenSearch内部进行复杂的、数据驱动的告警。CloudWatch告警作用于域级别的基础设施指标，而非索引日志数据内容。"}, {"exam": 4, "id": 8, "question_en": "A company enables Route 53 Resolver query logging for all VPCs in their account. They want to query the DNS logs using SQL to investigate suspicious domains over the past 90 days with minimal infrastructure management.\n \nWhich log destination and query approach should they use?", "options_en": ["Send Resolver query logs to Amazon Kinesis Data Firehose, which buffers and delivers them in batches to an S3 bucket partitioned by date for visualization with Amazon QuickSight dashboards.", "Send logs to a CloudWatch Logs log group and use CloudWatch Logs Insights to run SQL-like queries on DNS query data including query names, response codes, and source IPs.", "Send Resolver query logs to an S3 bucket and create an Athena table with manual partition management so analysts can write full SQL queries against 90 days of historical DNS resolution data.", "Send Resolver query logs to Amazon OpenSearch Service and use its Discover interface for interactive, ad-hoc exploration of DNS query names, response types, and resolver endpoint activity."], "correct": 1, "explanation_en": "Route 53 Resolver query logging supports three destinations: CloudWatch Logs, S3, and Kinesis Data Firehose. CloudWatch Logs with Logs Insights provides a serverless, built-in query capability for structured lo
